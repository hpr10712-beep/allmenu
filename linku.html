<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Game Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Salin Design Tokens dan gaya dari HTML utama Anda di sini, atau buat gaya sederhana baru */
        :root {
            --bg: #0a0e1a; --surface: #111828; --surface-2: #182135; --border: rgba(255,255,255,.1);
            --text: #f0f4fc; --text-dim: #8b96b3; --accent: #6d7bff; --success: #10d98d; --danger: #ff5d6c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            display: flex; justify-content: center; padding: 20px; min-height: 100vh;
        }
        .admin-container { width: 100%; max-width: 800px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 800; }
        .card {
            background: var(--surface); border-radius: 16px; padding: 24px; border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }
        .game-list { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .game-item {
            background: var(--surface-2); border-radius: 12px; padding: 16px; border: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .game-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .game-info p { font-size: 12px; color: var(--text-dim); }
        .game-actions button { margin-left: 8px; }
        .btn { padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; border: none; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.9; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-ghost:hover { background: var(--surface-2); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); font-family: inherit; font-size: 14px;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--surface); border-radius: 20px; padding: 24px; width: 90%; max-width: 500px;
            max-height: 80vh; overflow-y: auto; border: 1px solid var(--border);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 20px; font-weight: 800; }
        .close-btn { background: none; border: none; color: var(--text-dim); font-size: 24px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header">
        <h1>🎮 Game Manager</h1>
        <button class="btn btn-primary" id="btnAddGame">+ Tambah Game</button>
    </div>
    <div class="card">
        <h2>Daftar Game</h2>
        <div class="game-list" id="gameList"></div>
    </div>
</div>

<!-- Modal Form -->
<div class="modal-overlay" id="gameModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Tambah Game Baru</h2>
            <button class="close-btn" id="btnCloseModal">&times;</button>
        </div>
        <form id="gameForm">
            <input type="hidden" id="gameId">
            <div class="form-group">
                <label for="gameTitle">Judul Game</label>
                <input type="text" id="gameTitle" required placeholder="Contoh: Tic-Tac-Toe">
            </div>
            <div class="form-group">
                <label for="gameDesc">Deskripsi</label>
                <textarea id="gameDesc" placeholder="Deskripsi singkat..."></textarea>
            </div>
            <div class="form-group">
                <label for="gameIcon">Ikon (Nama dari ICONS)</label>
                <input type="text" id="gameIcon" placeholder="Contoh: grid3, dino, target">
            </div>
            <div class="form-group">
                <label for="gameIconClass">Icon Class (warna)</label>
                <input type="text" id="gameIconClass" placeholder="Contoh: tictactoe, trex">
            </div>
            <div class="form-group">
                <label for="gameModeClass">Mode Class (background card)</label>
                <input type="text" id="gameModeClass" placeholder="Contoh: tictactoe, trex">
            </div>
            <div class="form-group">
                <label for="gameAction">Action (Fungsi JS)</label>
                <select id="gameAction">
                    <option value="ttt">openTttDialog</option>
                    <option value="trex">openTrex</option>
                    <option value="ranked">openRankedDialog</option>
                    <option value="casual">openClassicDialog</option>
                    <option value="ai">openAiDialog</option>
                    <option value="local">openLocalDialog</option>
                    <option value="puzzle">startPuzzle</option>
                    <option value="url">Buka URL Eksternal</option>
                </select>
            </div>
            <div class="form-group hidden" id="urlGroup">
                <label for="gameUrl">URL Game</label>
                <input type="text" id="gameUrl" placeholder="https://contoh.com/game">
            </div>
            <div class="form-group">
                <label for="gameOrder">Urutan</label>
                <input type="number" id="gameOrder" value="0">
            </div>
            <div class="form-group">
                <label for="gameVisible">Tampilkan</label>
                <select id="gameVisible">
                    <option value="true">Ya</option>
                    <option value="false">Tidak</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Simpan Game</button>
        </form>
    </div>
</div>

<script type="module">
    // --- Salin Inisialisasi Firebase dari HTML utama Anda ---
    const firebaseConfig = {
        apiKey: "AIzaSyBEPzUM9EresZ-yvphzDusVs7AUqdLuCNQ",
        authDomain: "mygame-68b24.firebaseapp.com",
        databaseURL: "https://mygame-68b24-default-rtdb.firebaseio.com",
        projectId: "mygame-68b24",
        storageBucket: "mygame-68b24.firebasestorage.app",
        messagingSenderId: "1003182873390",
        appId: "1:1003182873390:web:aabf3248f759cbc9d678bf"
    };

    let db;
    let currentGames = {};

    // Inisialisasi Firebase
    async function initAdmin() {
        try {
            const appMod = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
            const dbMod = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js');
            const app = appMod.initializeApp(firebaseConfig);
            db = dbMod.getDatabase(app);
            window.FB = { api: { ref: dbMod.ref, set: dbMod.set, get: dbMod.get, remove: dbMod.remove, update: dbMod.update } };
            window.FB.db = db;
            loadGames();
        } catch (e) {
            console.error("Firebase init error:", e);
            document.getElementById('gameList').innerHTML = '<p style="color:red;">Gagal terhubung ke database.</p>';
        }
    }

    // --- Fungsi CRUD ---
    async function loadGames() {
        const listEl = document.getElementById('gameList');
        listEl.innerHTML = '<p>Memuat...</p>';
        try {
            const snap = await FB.api.get(FB.api.ref(db, 'games_config'));
            if (snap.exists()) {
                currentGames = snap.val();
                renderGameList();
            } else {
                listEl.innerHTML = '<p>Belum ada game yang ditambahkan.</p>';
            }
        } catch (e) {
            console.error("Load error:", e);
            listEl.innerHTML = '<p style="color:red;">Gagal memuat data.</p>';
        }
    }

    function renderGameList() {
        const listEl = document.getElementById('gameList');
        listEl.innerHTML = '';
        const games = Object.keys(currentGames).map(id => ({ id, ...currentGames[id] }))
            .sort((a, b) => (a.order || 0) - (b.order || 0));

        games.forEach(game => {
            const item = document.createElement('div');
            item.className = 'game-item';
            item.innerHTML = `
                <div class="game-info">
                    <h3>${game.title}</h3>
                    <p>${game.description || 'Tidak ada deskripsi'} | Action: ${game.action}</p>
                </div>
                <div class="game-actions">
                    <button class="btn btn-ghost edit-btn" data-id="${game.id}">Edit</button>
                    <button class="btn btn-danger delete-btn" data-id="${game.id}">Hapus</button>
                </div>
            `;
            listEl.appendChild(item);
        });

        // Tambahkan event listener untuk tombol edit & hapus
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', (e) => openEditModal(e.target.dataset.id));
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => deleteGame(e.target.dataset.id));
        });
    }

    async function saveGame(e) {
        e.preventDefault();
        const id = document.getElementById('gameId').value || document.getElementById('gameTitle').value.toLowerCase().replace(/\s+/g, '_');
        const gameData = {
            title: document.getElementById('gameTitle').value,
            description: document.getElementById('gameDesc').value,
            icon: document.getElementById('gameIcon').value,
            iconClass: document.getElementById('gameIconClass').value,
            modeClass: document.getElementById('gameModeClass').value,
            action: document.getElementById('gameAction').value,
            url: document.getElementById('gameUrl').value, // untuk aksi 'url'
            order: parseInt(document.getElementById('gameOrder').value) || 0,
            visible: document.getElementById('gameVisible').value === 'true'
        };

        try {
            await FB.api.set(FB.api.ref(db, 'games_config/' + id), gameData);
            closeModal();
            loadGames(); // Refresh list
        } catch (e) {
            console.error("Save error:", e);
            alert("Gagal menyimpan game.");
        }
    }

    async function deleteGame(id) {
        if (!confirm('Yakin ingin menghapus game ini?')) return;
        try {
            await FB.api.remove(FB.api.ref(db, 'games_config/' + id));
            loadGames(); // Refresh list
        } catch (e) {
            console.error("Delete error:", e);
            alert("Gagal menghapus game.");
        }
    }

    // --- Fungsi UI Modal ---
    function openAddModal() {
        document.getElementById('modalTitle').textContent = 'Tambah Game Baru';
        document.getElementById('gameForm').reset();
        document.getElementById('gameId').value = '';
        document.getElementById('gameModal').classList.add('active');
        toggleUrlField();
    }

    function openEditModal(id) {
        const game = currentGames[id];
        if (!game) return;
        document.getElementById('modalTitle').textContent = 'Edit Game';
        document.getElementById('gameId').value = id;
        document.getElementById('gameTitle').value = game.title || '';
        document.getElementById('gameDesc').value = game.description || '';
        document.getElementById('gameIcon').value = game.icon || '';
        document.getElementById('gameIconClass').value = game.iconClass || '';
        document.getElementById('gameModeClass').value = game.modeClass || '';
        document.getElementById('gameAction').value = game.action || 'ttt';
        document.getElementById('gameUrl').value = game.url || '';
        document.getElementById('gameOrder').value = game.order || 0;
        document.getElementById('gameVisible').value = game.visible !== false ? 'true' : 'false';
        document.getElementById('gameModal').classList.add('active');
        toggleUrlField();
    }

    function closeModal() {
        document.getElementById('gameModal').classList.remove('active');
    }

    function toggleUrlField() {
        const action = document.getElementById('gameAction').value;
        const urlGroup = document.getElementById('urlGroup');
        urlGroup.classList.toggle('hidden', action !== 'url');
    }

    // --- Event Listeners ---
    document.getElementById('btnAddGame').addEventListener('click', openAddModal);
    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('gameForm').addEventListener('submit', saveGame);
    document.getElementById('gameAction').addEventListener('change', toggleUrlField);
    document.getElementById('gameModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('gameModal')) closeModal();
    });

    // Mulai
    initAdmin();
</script>
</body>
</html>
