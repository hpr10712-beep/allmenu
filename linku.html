<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0a0e0d" />
<title>CAZOO Control Center</title>
<link rel="icon" href="https://i.ibb.co.com/Jw4Fvfkn/1790573470498.jpg" />
<style>
:root {
  --bg:#0a0e0d; --surface-1:#111614; --surface-2:#171e1b; --surface-3:#1f2925;
  --text:#e9efed; --text-dim:#93a5a0; --text-faint:#5f7069;
  --line:#1c2623; --line-strong:#2a3833;
  --brand:#10b981; --brand-soft:rgba(16,185,129,.12); --brand-glow:rgba(16,185,129,.28);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,.12);
  --warn:#f59e0b; --warn-soft:rgba(245,158,11,.12);
  --info:#38bdf8; --info-soft:rgba(56,189,248,.12);
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  --ease:cubic-bezier(.32,.72,.24,1);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; margin:0; }
body {
  background:var(--bg); color:var(--text);
  font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; }
input,textarea,select { font:inherit; color:inherit; }
img { max-width:100%; display:block; }
[hidden] { display:none !important; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--line-strong); border-radius:4px; }

h1 { font-size:22px; font-weight:600; letter-spacing:-.02em; margin:0; }
h2 { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin:24px 0 10px; }
h3 { font-size:15px; font-weight:600; margin:0; }
.muted { color:var(--text-dim); }
.faint { color:var(--text-faint); }
.small { font-size:12px; }
.tiny { font-size:11px; }
.mono { font-family:ui-monospace,Menlo,monospace; }
strong { font-weight:600; }

.loading-screen {
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px;
  background:var(--bg); z-index:100;
}
.loading-logo { width:80px; height:80px; border-radius:22px; box-shadow:var(--shadow-lg); animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
.loading-bar { width:160px; height:3px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
.loading-bar span { display:block; height:100%; width:40%; background:linear-gradient(90deg,var(--brand),#34d399); animation:slide 1.4s cubic-bezier(.5,0,.2,1) infinite; }
@keyframes slide { 0% { transform:translateX(-100%); } 100% { transform:translateX(320%); } }
.loading-screen p { color:var(--text-faint); font-size:13px; margin:0; }

.center-wrap {
  min-height:100dvh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:32px 24px; gap:16px; text-align:center;
}
.center-logo { width:80px; height:80px; border-radius:22px; box-shadow:var(--shadow-lg); margin-bottom:8px; }
.center-title { font-size:28px; font-weight:800; letter-spacing:-.03em; margin:0; }
.center-sub { color:var(--text-dim); font-size:14px; margin:4px 0 20px; max-width:400px; line-height:1.6; }
.center-narrow { max-width:440px; width:100%; text-align:left; }
.badge {
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:999px;
  font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
}
.badge-admin { background:var(--brand-soft); color:var(--brand); border:1px solid color-mix(in srgb,var(--brand) 30%,transparent); }
.badge-warn { background:var(--warn-soft); color:var(--warn); border:1px solid color-mix(in srgb,var(--warn) 30%,transparent); }
.badge-danger { background:var(--danger-soft); color:var(--danger); border:1px solid color-mix(in srgb,var(--danger) 30%,transparent); }

.shell { display:flex; min-height:100dvh; }
.sidebar {
  width:240px; flex-shrink:0;
  background:var(--surface-1); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:16px 10px;
  position:sticky; top:0; height:100dvh;
}
.brand {
  display:flex; align-items:center; gap:10px;
  padding:8px 10px 20px;
}
.brand img { width:28px; height:28px; border-radius:8px; }
.brand-info { flex:1; min-width:0; }
.brand-name { font-weight:700; font-size:15px; letter-spacing:-.02em; line-height:1.2; }
.brand-sub { font-size:10px; color:var(--text-faint); letter-spacing:.06em; text-transform:uppercase; }
.nav-items { display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
.nav-item {
  display:flex; align-items:center; gap:12px;
  padding:9px 12px; border-radius:var(--r-md);
  color:var(--text-dim); font-size:13.5px; font-weight:500;
  transition:.12s var(--ease); text-align:left; width:100%;
}
.nav-item svg { width:16px; height:16px; flex-shrink:0; opacity:.85; }
.nav-item:hover { background:var(--surface-2); color:var(--text); }
.nav-item.active { background:var(--brand-soft); color:var(--brand); }
.nav-item.active svg { opacity:1; }
.sidebar-footer { padding:8px 10px 0; border-top:1px solid var(--line); margin-top:8px; }
.user-chip {
  display:flex; align-items:center; gap:10px; padding:8px 8px;
  border-radius:var(--r-md); transition:.12s;
}
.user-chip:hover { background:var(--surface-2); }
.user-chip img { width:28px; height:28px; border-radius:50%; }
.user-chip-info { flex:1; min-width:0; text-align:left; }
.user-chip-name { font-size:12.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-chip-role { font-size:10px; color:var(--brand); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }

.main { flex:1; min-width:0; }
.main-inner { max-width:1100px; margin:0 auto; padding:28px 32px 60px; }
@media (max-width:860px) {
  .sidebar { display:none; }
  .main-inner { padding:16px 16px 32px; }
  .mobile-bar { display:flex !important; }
}
.mobile-bar {
  display:none; position:sticky; top:0; z-index:30;
  background:color-mix(in srgb,var(--surface-1) 92%,transparent);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  padding:12px 16px; align-items:center; gap:12px;
}
.mobile-bar img { width:26px; height:26px; border-radius:7px; }
.mobile-menu {
  position:fixed; inset:0; z-index:50;
  background:var(--bg); overflow-y:auto; padding:20px;
}
.mobile-menu .nav-item { font-size:15px; padding:14px 16px; }

.page-head {
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; margin-bottom:24px; flex-wrap:wrap;
}
.page-title-group { min-width:0; }
.page-sub { color:var(--text-dim); font-size:13px; margin-top:2px; }
.page-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:9px 14px; border-radius:10px;
  font-size:13.5px; font-weight:500;
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--text);
  transition:.12s var(--ease); white-space:nowrap;
}
.btn:hover:not(:disabled) { background:var(--surface-3); border-color:var(--text-faint); }
.btn:active:not(:disabled) { transform:scale(.97); }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.btn svg { width:15px; height:15px; }
.btn-primary { background:var(--brand); color:#031a10; border-color:transparent; font-weight:600; box-shadow:0 2px 12px var(--brand-glow); }
.btn-primary:hover:not(:disabled) { background:#1ec48f; }
.btn-danger { color:var(--danger); border-color:color-mix(in srgb,var(--danger) 35%,transparent); background:var(--danger-soft); }
.btn-danger:hover:not(:disabled) { background:color-mix(in srgb,var(--danger) 18%,transparent); border-color:var(--danger); }
.btn-ghost { background:transparent; border-color:transparent; color:var(--text-dim); }
.btn-ghost:hover:not(:disabled) { background:var(--surface-2); color:var(--text); }
.btn-sm { padding:6px 10px; font-size:12px; }
.btn-icon { width:34px; height:34px; padding:0; }
.btn-block { width:100%; }

.field { display:flex; flex-direction:column; gap:6px; }
.field > label { font-size:12px; font-weight:500; color:var(--text-dim); }
.input {
  width:100%; padding:10px 13px;
  border-radius:10px; border:1px solid var(--line-strong);
  background:var(--surface-2); color:var(--text);
  outline:none; transition:.12s var(--ease);
}
.input:focus { border-color:var(--brand); background:var(--surface-1); }
.input::placeholder { color:var(--text-faint); }

.card {
  background:var(--surface-1); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:18px;
}
.card-flush { padding:0; overflow:hidden; }

.stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; }
.stat {
  padding:16px; background:var(--surface-1);
  border:1px solid var(--line); border-radius:var(--r-md);
}
.stat-label { font-size:10px; font-weight:600; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
.stat-value { font-size:24px; font-weight:700; letter-spacing:-.03em; line-height:1; }
.stat-sub { font-size:11px; color:var(--text-dim); margin-top:4px; }
.stat.accent { background:linear-gradient(135deg,var(--brand-soft),transparent); border-color:color-mix(in srgb,var(--brand) 25%,transparent); }

.table-wrap { overflow-x:auto; }
.table { width:100%; border-collapse:collapse; font-size:13.5px; }
.table th {
  text-align:left; padding:10px 14px;
  font-size:11px; font-weight:600; color:var(--text-faint);
  text-transform:uppercase; letter-spacing:.06em;
  border-bottom:1px solid var(--line); white-space:nowrap;
}
.table td { padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
.table tr:last-child td { border-bottom:none; }
.table tbody tr { transition:.1s; }
.table tbody tr:hover { background:var(--surface-2); }
.table-actions { display:flex; gap:6px; justify-content:flex-end; }

.toolbar {
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  margin-bottom:16px; padding:12px 14px;
  background:var(--surface-1); border:1px solid var(--line); border-radius:var(--r-md);
}
.toolbar .input { width:auto; min-width:200px; flex:1; }
.toolbar .field { flex-direction:row; align-items:center; gap:8px; flex:0 0 auto; }
.toolbar .field > label { white-space:nowrap; font-size:12px; }
.toolbar select.input { width:auto; min-width:130px; }

.row-list { display:flex; flex-direction:column; gap:8px; }
.row-item {
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; background:var(--surface-1);
  border:1px solid var(--line); border-radius:var(--r-md);
  transition:.12s;
}
.row-item:hover { background:var(--surface-2); }
.row-item-main { flex:1; min-width:0; }
.row-item-title { font-weight:500; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-item-sub { color:var(--text-dim); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-item-actions { display:flex; gap:6px; flex-shrink:0; }

.avatar {
  width:36px; height:36px; border-radius:50%; object-fit:cover;
  background:var(--surface-3); border:1.5px solid var(--line-strong); flex-shrink:0;
}
.avatar-sm { width:28px; height:28px; }

.toggle {
  position:relative; width:42px; height:24px; border-radius:999px;
  background:var(--surface-3); border:1px solid var(--line-strong);
  transition:.2s var(--ease); cursor:pointer; flex-shrink:0;
}
.toggle::after {
  content:""; position:absolute; top:2px; left:2px;
  width:18px; height:18px; border-radius:50%; background:var(--text-faint);
  transition:.2s var(--ease);
}
.toggle.on { background:var(--brand); border-color:var(--brand); }
.toggle.on::after { background:#fff; transform:translateX(18px); }

.modal-backdrop {
  position:fixed; inset:0; z-index:150;
  background:rgba(0,0,0,.65); backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center;
  padding:20px; animation:fade .15s var(--ease);
}
@keyframes fade { from { opacity:0; } to { opacity:1; } }
.modal {
  background:var(--surface-1); border:1px solid var(--line-strong);
  border-radius:var(--r-lg); padding:22px;
  max-width:480px; width:100%; max-height:85vh; overflow-y:auto;
  box-shadow:var(--shadow-lg); animation:slideUp .2s var(--ease);
}
@keyframes slideUp { from { transform:translateY(12px); opacity:0; } to { transform:none; opacity:1; } }
.modal h3 { font-size:17px; margin-bottom:8px; }
.modal > p { color:var(--text-dim); font-size:13.5px; margin:0 0 20px; line-height:1.55; }
.modal-actions { display:flex; gap:8px; margin-top:20px; }
.modal-actions .btn { flex:1; }

.empty { text-align:center; padding:60px 24px; color:var(--text-faint); font-size:14px; }
.empty svg { width:48px; height:48px; opacity:.3; margin:0 auto 12px; display:block; }

#toast-root {
  position:fixed; top:16px; right:16px; left:16px;
  display:flex; flex-direction:column; gap:8px;
  z-index:200; pointer-events:none;
}
@media (min-width:600px) { #toast-root { left:auto; max-width:380px; } }
.toast {
  padding:12px 14px; border-radius:var(--r-md);
  background:var(--surface-2); border:1px solid var(--line-strong);
  box-shadow:var(--shadow-lg); font-size:13px; font-weight:500;
  opacity:0; transform:translateY(-8px);
  transition:.2s var(--ease); pointer-events:auto;
}
.toast.show { opacity:1; transform:none; }
.toast.ok { border-left:3px solid var(--brand); }
.toast.error { border-left:3px solid var(--danger); }
.toast.info { border-left:3px solid var(--info); }

.chip {
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:6px;
  font-size:11px; font-weight:600; letter-spacing:.02em;
  background:var(--surface-3); color:var(--text-dim);
}
.chip-brand { background:var(--brand-soft); color:var(--brand); }
.chip-danger { background:var(--danger-soft); color:var(--danger); }
.chip-warn { background:var(--warn-soft); color:var(--warn); }
.chip-info { background:var(--info-soft); color:var(--info); }

.stack { display:flex; flex-direction:column; gap:12px; }
.stack-sm { gap:8px; }
.flex { display:flex; align-items:center; gap:10px; }
.flex-between { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px) { .grid-2 { grid-template-columns:1fr; } }
.mt-8 { margin-top:8px; } .mt-16 { margin-top:16px; } .mt-24 { margin-top:24px; }
.mb-0 { margin-bottom:0; } .mb-16 { margin-bottom:16px; } .mb-24 { margin-bottom:24px; }
.text-right { text-align:right; }
.spin { animation:spin 1s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }

.dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--text-faint); }
.dot.online { background:var(--brand); box-shadow:0 0 8px var(--brand-glow); }
.dot.banned { background:var(--danger); }
</style>
</head>

/* ============ UTILS ============ */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = ts => { if(!ts) return "—"; const d=new Date(ts); return d.toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
const fmtTimeAgo = ts => { if(!ts) return "—"; const s=(Date.now()-ts)/1000; if(s<60) return "baru saja"; if(s<3600) return `${Math.floor(s/60)} mnt lalu`; if(s<86400) return `${Math.floor(s/3600)} jam lalu`; return `${Math.floor(s/86400)} hr lalu`; };

function toast(msg,kind="info"){
  const r=$("#toast-root"); const el=document.createElement("div");
  el.className="toast "+kind; el.textContent=msg; r.appendChild(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  setTimeout(()=>{el.classList.remove("show");setTimeout(()=>el.remove(),300);},3400);
}

function modal({title, body, actions=[{label:"Tutup",primary:false,onClick:()=>{}}]}) {
  return new Promise(res=>{
    const b=document.createElement("div"); b.className="modal-backdrop";
    b.innerHTML=`<div class="modal" role="dialog">
      <h3>${title}</h3>
      <div class="modal-body">${body}</div>
      <div class="modal-actions"></div>
    </div>`;
    const actionsEl = $(".modal-actions", b);
    const close = v => { b.remove(); res(v); };
    actions.forEach(a=>{
      const btn = document.createElement("button");
      btn.className = "btn " + (a.primary?"btn-primary":(a.danger?"btn-danger":"btn-ghost"));
      btn.textContent = a.label;
      btn.onclick = async () => {
        if (a.onClick) {
          btn.disabled = true;
          try { const r = await a.onClick(b); if (r === false) { btn.disabled = false; return; } }
          catch(e){ btn.disabled = false; return; }
        }
        close(true);
      };
      actionsEl.appendChild(btn);
    });
    document.body.appendChild(b);
    b.addEventListener("click", e => { if(e.target===b) close(false); });
  });
}

async function confirmAction(title, msg, confirmLabel="Konfirmasi") {
  return new Promise(res=>{
    const b=document.createElement("div"); b.className="modal-backdrop";
    b.innerHTML=`<div class="modal" role="dialog">
      <h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-no>Batal</button>
        <button class="btn btn-primary" data-yes>${esc(confirmLabel)}</button>
      </div>
    </div>`;
    document.body.appendChild(b);
    const done=v=>{b.remove();res(v);};
    $("[data-no]",b).onclick=()=>done(false);
    $("[data-yes]",b).onclick=()=>done(true);
    b.addEventListener("click",e=>{if(e.target===b)done(false);});
  });
}

/* ============ AUDIT LOG ============ */
async function audit(action, target, details={}) {
  const u = auth.currentUser;
  if (!u) return;
  try {
    await push(ref(db, "auditLogs"), {
      ts: Date.now(),
      actorUid: u.uid,
      actorName: state.profile?.displayName || u.displayName || u.email || "—",
      actorEmail: u.email || "",
      action,
      target: target || null,
      details: details || {},
    });
  } catch(e) { console.warn("audit failed:", e); }
}

/* ============ STATE ============ */
const state = {
  user: null,
  profile: null,
  role: null,
  view: "overview",
  cleanup: null,
};

const PERMISSIONS = {
  superadmin: ["*"],
  admin: ["overview","users","rooms","games","reports","features","announcements","audit","settings"],
  moderator: ["overview","users.read","reports","audit.read"],
  spectator: ["overview","games"],
};

function hasPerm(perm) {
  const role = state.role;
  if (!role) return false;
  if (role === "superadmin") return true;
  const perms = PERMISSIONS[role] || [];
  return perms.includes(perm) || perms.includes(perm.split(".")[0]);
}

/* ============ INIT / AUTH GATE ============ */
onAuthStateChanged(auth, async user => {
  $("#loading").hidden = true;
  $("#app").hidden = false;
  state.user = user;
  if (!user) { renderLogin(); return; }

  // Ambil profil
  try {
    const snap = await get(ref(db, `users/${user.uid}/profile`));
    state.profile = snap.exists() ? snap.val() : null;
  } catch { state.profile = null; }

  // Cek role dari DB
  try {
    const rSnap = await get(ref(db, `userRoles/${user.uid}/role`));
    state.role = rSnap.exists() ? rSnap.val() : null;
  } catch { state.role = null; }

  // Sudah punya role → langsung masuk
  if (state.role) {
    renderShell(state.view);
    return;
  }

  // Belum punya role → minta kode akses
  renderAccessCodeGate();
});

function renderAccessCodeGate() {
  $("#app").innerHTML = `<div class="center-wrap">
    <img class="center-logo" src="https://i.ibb.co.com/Jw4Fvfkn/1790573470498.jpg" alt="">

    <div class="center-narrow">
      <div class="field">
        <label>Kode Akses</label>
        <input class="input mono" id="bk" type="password" placeholder="••••••"
               autocomplete="off" spellcheck="false" inputmode="numeric"
               style="text-align:center;letter-spacing:.5em;font-size:22px;font-weight:700;padding:14px;">
      </div>
      <button class="btn btn-primary btn-block" id="go" style="margin-top:16px;padding:12px;">
        ${I.key}<span>Masuk sebagai Admin</span>
      </button>
      <button class="btn btn-ghost btn-block" id="out" style="margin-top:8px;">
        ${I.logout}<span>Keluar</span>
      </button>
      <p class="faint tiny mt-16" style="line-height:1.6;text-align:center;">
        Hanya staf resmi CAZOO yang boleh mengakses panel ini. Setiap percobaan login dicatat.
      </p>
    </div>
  </div>`;

  const input = $("#bk");
  const btn = $("#go");
  input.focus();

  async function attempt() {
    const code = input.value.trim();
    if (!code) { toast("Masukkan kode akses.", "error"); return; }

    btn.disabled = true;
    btn.innerHTML = `<span class="spin">${I.refresh}</span><span>Memverifikasi…</span>`;

    if (code !== ADMIN_ACCESS_CODE) {
      await audit("admin_login_failed", state.user.uid, { email: state.user.email });
      toast("Kode akses salah.", "error");
      input.value = "";
      input.focus();
      btn.disabled = false;
      btn.innerHTML = `${I.key}<span>Masuk sebagai Admin</span>`;
      return;
    }

    try {
      await set(ref(db, `userRoles/${state.user.uid}`), {
        role: "superadmin",
        grantedBy: "access_code",
        grantedAt: Date.now(),
        grantedByName: "Access Code"
      });
      await audit("admin_login_success", state.user.uid, { email: state.user.email });
      state.role = "superadmin";
      toast("Selamat datang, Admin.", "ok");
      setTimeout(() => renderShell("overview"), 400);
    } catch (e) {
      console.error(e);
      toast("Gagal menyimpan role: " + e.message + " — cek Security Rules.", "error");
      btn.disabled = false;
      btn.innerHTML = `${I.key}<span>Masuk sebagai Admin</span>`;
    }
  }

  btn.onclick = attempt;
  input.addEventListener("keydown", e => { if (e.key === "Enter") attempt(); });
  $("#out").onclick = async () => { await signOut(auth); };
}

    </div>
    <h2>Aktivitas Terbaru</h2>

        </div>
        <span class="chip chip-warn">Catatan</span>
      </div>
    </div>`;

  let pendingReports = 0, pendingRequests = 0, activeRooms = 0, liveGames = 0, totalUsers = 0, activeUsers = 0;

  const offUsers = onValue(ref(db, "users"), snap => {
    totalUsers = snap.exists() ? Object.keys(snap.val()).length : 0;
    const cutoff = Date.now() - 24*3600*1000;
    let act = 0;
    snap.forEach(c => {
      const p = c.val()?.profile;
      if (p?.createdAt && p.createdAt > cutoff) act++;
    });
    activeUsers = act;
    updateStats();
  });

  const offRooms = onValue(ref(db, "rooms"), snap => {
    const rooms = snap.val() || {};
    activeRooms = Object.values(rooms).filter(r => r.status === "ready" || r.status === "waiting").length;
    liveGames = Object.values(rooms).filter(r => r.status === "playing").length;
    updateStats();
    renderRecent();
  });

  const offReports = onValue(ref(db, "reports"), snap => {
    const reps = snap.val() || {};
    pendingReports = Object.values(reps).filter(r => r.status === "pending").length;
    updateStats();
  });

  const offFriends = onValue(ref(db, "friendRequests"), snap => {
    pendingRequests = snap.exists() ? Object.values(snap.val()).reduce((a,v) => a + Object.keys(v||{}).length, 0) : 0;
    updateStats();
  });

  function updateStats() {
    const values = [totalUsers, activeUsers, activeRooms, liveGames, pendingRequests, pendingReports];
    $$("[data-stat]", root).forEach((el, i) => { el.textContent = values[i] ?? "—"; });
  }

  async function renderRecent() {
    const el = $("#recent", root);
    const snap = await get(ref(db, "rooms"));
    if (!snap.exists()) { el.innerHTML = `<div class="empty">Belum ada aktivitas room.</div>`; return; }
    const arr = Object.values(snap.val()).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 8);
    if (!arr.length) { el.innerHTML = `<div class="empty">Belum ada aktivitas room.</div>`; return; }
    el.innerHTML = arr.map(r => `
      <div class="row-item" style="border-radius:0;border-left:0;border-right:0;border-top:0;margin:0;">
        <div class="row-item-main">
          <div class="row-item-title">${esc(r.host?.name||"—")} ${r.guest?`vs ${esc(r.guest.name)}`:"(menunggu lawan)"}</div>
          <div class="row-item-sub">${esc(r.mode)} · ${r.tcMinutes} menit · ${r.status} · ${fmtTimeAgo(r.createdAt)}</div>
        </div>
        <span class="chip ${r.status === "playing" ? "chip-brand" : r.status === "ended" ? "" : "chip-info"}">${esc(r.status)}</span>
      </div>`).join("");
  }

  $("#refresh", root).onclick = () => { renderRecent(); toast("Diperbarui", "ok"); };
  renderRecent();

  return () => { offUsers(); offRooms(); offReports(); offFriends(); };
}

/* ============================================================
   PAGE: USERS
   ============================================================ */
function pageUsers(root) {
  root.innerHTML = `
    <div class="page-head">
      <div class="page-title-group">
        <h1>Users</h1>
        <div class="page-sub">Kelola akun, role, dan status</div>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost" id="refresh">${I.refresh}<span>Refresh</span></button>
      </div>
    </div>
    <div class="toolbar">
      <input class="input" id="q" placeholder="Cari username, nama, atau UID…" autocomplete="off">
      <div class="field">
        <label>Role</label>
        <select class="input" id="frole">
          <option value="">Semua</option>
          <option value="superadmin">Super Admin</option>
          <option value="admin">Admin</option>
          <option value="moderator">Moderator</option>
          <option value="spectator">Spectator</option>
          <option value="player">Player</option>
        </select>
      </div>
      <div class="field">
        <label>Status</label>
        <select class="input" id="fstatus">
          <option value="">Semua</option>
          <option value="active">Aktif</option>
          <option value="banned">Banned</option>
        </select>
      </div>
    </div>
    <div class="card card-flush">
      <div class="table-wrap">
        <table class="table" id="tbody">
          <thead><tr>
            <th>Pengguna</th><th>Role</th><th>Rating</th><th>Status</th><th>Dibuat</th><th></th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="6"><div class="empty">Memuat…</div></td></tr></tbody>
        </table>
      </div>
    </div>`;

  let allUsers = [];
  let allRoles = {};

  const offUsers = onValue(ref(db, "users"), snap => {
    allUsers = snap.exists() ? Object.entries(snap.val()).map(([uid, v]) => ({ uid, ...v })) : [];
    render();
  });
  const offRoles = onValue(ref(db, "userRoles"), snap => {
    allRoles = snap.val() || {};
    render();
  });

  function render() {
    const q = $("#q", root).value.trim().toLowerCase();
    const fRole = $("#frole", root).value;
    const fStatus = $("#fstatus", root).value;

    let rows = allUsers.filter(u => {
      const p = u.profile || {};
      const role = allRoles[u.uid]?.role || "player";
      if (fRole && role !== fRole) return false;
      const banned = u.status?.banned === true;
      if (fStatus === "banned" && !banned) return false;
      if (fStatus === "active" && banned) return false;
      if (q) {
        const hay = [p.username, p.displayName, u.uid].filter(Boolean).join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a,b) => (b.profile?.createdAt||0) - (a.profile?.createdAt||0));

    const tbody = $("#rows", root);
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty">Tidak ada pengguna yang cocok.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = rows.slice(0, 200).map(u => {
      const p = u.profile || {};
      const role = allRoles[u.uid]?.role || "player";
      const banned = u.status?.banned === true;
      const rating = u.ratings?.ranked?.rating ?? "—";
      const created = p.createdAt ? fmtTime(p.createdAt) : "—";
      const photo = p.photoURL || "https://i.ibb.co.com/Jw4Fvfkn/1790573470498.jpg";
      const roleChip = role === "player" ? "" : `<span class="chip chip-brand">${esc(role)}</span>`;
      const bannedChip = banned ? `<span class="chip chip-danger">BANNED</span>` : "";
      return `<tr data-uid="${esc(u.uid)}">
        <td>
          <div class="flex" style="gap:10px;">
            <img class="avatar avatar-sm" src="${esc(photo)}" alt="">
            <div style="min-width:0;">
              <div style="font-weight:500;">${esc(p.displayName || "—")}</div>
              <div class="faint tiny">@${esc(p.username || "—")}</div>
            </div>
          </div>
        </td>
        <td>${roleChip || '<span class="faint small">player</span>'}</td>
        <td><strong>${rating}</strong></td>
        <td>${bannedChip || '<span class="chip chip-brand">Aktif</span>'}</td>
        <td class="faint small">${esc(created)}</td>
        <td class="text-right">
          <div class="table-actions">
            <button class="btn btn-sm btn-ghost" data-view="${esc(u.uid)}" title="Detail">${I.edit}</button>
          </div>
        </td>
      </tr>`;
    }).join("");

    $$("[data-view]", root).forEach(b => b.onclick = () => openUserDetail(b.dataset.view));
  }

  $("#q", root).oninput = render;
  $("#frole", root).onchange = render;
  $("#fstatus", root).onchange = render;
  $("#refresh", root).onclick = () => render();

  async function openUserDetail(uid) {
    const u = allUsers.find(x => x.uid === uid);
    if (!u) return;
    const p = u.profile || {};
    const role = allRoles[uid]?.role || "player";
    const banned = u.status?.banned === true;

    const body = `
      <div class="flex" style="gap:12px;margin-bottom:16px;">
        <img class="avatar" src="${esc(p.photoURL || "https://i.ibb.co.com/Jw4Fvfkn/1790573470498.jpg")}" style="width:48px;height:48px;">
        <div style="min-width:0;">
          <div style="font-weight:600;">${esc(p.displayName || "—")}</div>
          <div class="muted small">@${esc(p.username || "—")}</div>
          <div class="faint tiny mono mt-4">${esc(uid)}</div>
        </div>
      </div>
      <div class="row-item mb-16">
        <div class="row-item-main">
          <div class="row-item-title">Bio</div>
          <div class="row-item-sub">${esc(p.bio || "—")}</div>
        </div>
      </div>
      <div class="grid-2 mb-16">
        <div class="row-item" style="margin:0;">
          <div class="row-item-main">
            <div class="row-item-title">Rating Ranked</div>
            <div class="row-item-sub">${u.ratings?.ranked?.rating ?? "—"} (peak ${u.ratings?.ranked?.peak ?? "—"})</div>
          </div>
        </div>
        <div class="row-item" style="margin:0;">
          <div class="row-item-main">
            <div class="row-item-title">W / L / D</div>
            <div class="row-item-sub">${u.statistics?.ranked?.wins ?? 0} · ${u.statistics?.ranked?.losses ?? 0} · ${u.statistics?.ranked?.draws ?? 0}</div>
          </div>
        </div>
      </div>
      <div class="mb-16">
        <label class="small muted">Role</label>
        <select class="input mt-8" id="newrole">
          <option value="player" ${role==="player"?"selected":""}>Player</option>
          <option value="spectator" ${role==="spectator"?"selected":""}>Spectator</option>
          <option value="moderator" ${role==="moderator"?"selected":""}>Moderator</option>
          <option value="admin" ${role==="admin"?"selected":""}>Admin</option>
          <option value="superadmin" ${role==="superadmin"?"selected":""}>Super Admin</option>
        </select>
        <div class="faint tiny mt-8">Hanya super admin dapat mengubah role. Perubahan dicatat di audit log.</div>
      </div>
      ${banned ? `<div class="row-item" style="border-color:color-mix(in srgb,var(--danger) 40%,var(--line));">
        <div class="row-item-main">
          <div class="row-item-title" style="color:var(--danger);">Akun Diblokir</div>
          <div class="row-item-sub">Alasan: ${esc(u.status?.reason || "—")} · ${fmtTimeAgo(u.status?.bannedAt)}</div>
        </div>
      </div>` : ""}`;

    const isSelf = uid === state.user.uid;
    const canEditRole = state.role === "superadmin" && !isSelf;
    const actions = [];
    actions.push({
      label: "Simpan Role",
      primary: true,
      onClick: async (b) => {
        if (!canEditRole) {
          toast("Hanya super admin yang dapat mengubah role, dan tidak pada akun sendiri.", "error");
          return false;
        }
        const newRole = $("#newrole", b).value;
        if (newRole === role) return;
        try {
          if (newRole === "player") {
            await remove(ref(db, `userRoles/${uid}`));
          } else {
            await set(ref(db, `userRoles/${uid}`), {
              role: newRole,
              grantedBy: state.user.uid,
              grantedByName: state.profile?.displayName || "Admin",
              grantedAt: Date.now()
            });
          }
          await audit("set_role", uid, { from: role, to: newRole, target: p.username || uid });
          toast("Role diperbarui", "ok");
        } catch(e) {
          toast("Gagal: " + e.message, "error");
          return false;
        }
      }
    });
    if (!isSelf) {
      if (banned) {
        actions.push({
          label: "Unban",
          onClick: async () => {
            await remove(ref(db, `users/${uid}/status`));
            await audit("unban_user", uid, { target: p.username || uid });
            toast("Akun dipulihkan", "ok");
          }
        });
      } else {
        actions.push({
          label: "Ban",
          danger: true,
          onClick: async (b) => {
            const reason = prompt("Alasan ban:", "Melanggar aturan") || "Melanggar aturan";
            await set(ref(db, `users/${uid}/status`), {
              banned: true, reason,
              bannedBy: state.user.uid,
              bannedAt: Date.now()
            });
            await audit("ban_user", uid, { reason, target: p.username || uid });
            toast("Akun diblokir", "ok");
          }
        });
      }
    }
    actions.push({ label: "Tutup", primary: !canEditRole });

    await modal({ title: "Detail Pengguna", body, actions });
    render();
  }

  return () => { offUsers(); offRoles(); };
}

function pageRooms(root) {
  root.innerHTML = `
    <div class="page-head">
      <div class="page-title-group">
        <h1>Rooms</h1>
        <div class="page-sub">Room aktif dan selesai</div>
      </div>
    </div>
    <div class="toolbar">
      <input class="input" id="q" placeholder="Cari kode room, nama pemain…">
      <div class="field">
        <label>Status</label>
        <select class="input" id="fst">
          <option value="">Semua</option>
          <option value="waiting">Waiting</option>
          <option value="ready">Ready</option>
          <option value="playing">Playing</option>
          <option value="ended">Ended</option>
        </select>
      </div>
    </div>
    <div class="row-list" id="list"><div class="empty">Memuat…</div></div>`;

  let all = [];
  const off = onValue(ref(db, "rooms"), snap => {
    all = snap.exists() ? Object.entries(snap.val()).map(([id, v]) => ({ id, ...v })) : [];
    render();
  });

  function render() {
    const q = $("#q", root).value.trim().toLowerCase();
    const fst = $("#fst", root).value;
    let rooms = all.filter(r => {
      if (fst && r.status !== fst) return false;
      if (q) {
        const hay = [r.id, r.host?.name, r.guest?.name].filter(Boolean).join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 100);

    const el = $("#list", root);
    if (!rooms.length) { el.innerHTML = `<div class="empty">Tidak ada room yang cocok.</div>`; return; }
    el.innerHTML = rooms.map(r => {
      const moveCount = (r.moves || []).length;
      const chip = r.status === "playing" ? "chip-brand" : r.status === "ended" ? "" : "chip-info";
      return `<div class="row-item">
        <div class="row-item-main">
          <div class="row-item-title">${esc(r.host?.name||"—")} ${r.guest ? `vs ${esc(r.guest.name)}` : "(menunggu)"}</div>
          <div class="row-item-sub">
            <span class="mono">${esc(r.id.slice(0,12))}</span> ·
            ${esc(r.mode)} · ${r.tcMinutes} menit ·
            ${moveCount} langkah ·
            ${fmtTimeAgo(r.createdAt)}
          </div>
        </div>
        <span class="chip ${chip}">${esc(r.status)}</span>
      </div>`;
    }).join("");
  }

  $("#q", root).oninput = render;
  $("#fst", root).onchange = render;
  return () => off();
}

/* ============================================================
   PAGE: GAMES
   ============================================================ */
function pageGames(root) {
  root.innerHTML = `
    <div class="page-head">
      <div class="page-title-group">
        <h1>Games</h1>
        <div class="page-sub">Perubahan rating terbaru seluruh pemain</div>
      </div>
    </div>
    <div class="card card-flush">
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Waktu</th><th>Pemain</th><th>Δ Rating</th><th>Setelah</th></tr></thead>
          <tbody id="rows"><tr><td colspan="4"><div class="empty">Memuat…</div></td></tr></tbody>
        </table>
      </div>
    </div>`;

  const off = onValue(ref(db, "ratingHistory"), async snap => {
    const tbody = $("#rows", root);
    if (!snap.exists()) { tbody.innerHTML = `<tr><td colspan="4"><div class="empty">Belum ada riwayat rating.</div></td></tr>`; return; }
    const entries = [];
    snap.forEach(uSnap => {
      const uid = uSnap.key;
      uSnap.forEach(hSnap => {
        const h = hSnap.val() || {};
        entries.push({ uid, delta: h.delta, after: h.after, before: h.before, ts: h.ts });
      });
    });
    entries.sort((a,b) => (b.ts||0) - (a.ts||0));
    const recent = entries.slice(0, 100);
    if (!recent.length) { tbody.innerHTML = `<tr><td colspan="4"><div class="empty">Belum ada riwayat rating.</div></td></tr>`; return; }

    const uids = [...new Set(recent.map(e => e.uid))];
    const profiles = {};
    for (const uid of uids) {
      try {
        const pSnap = await get(ref(db, `users/${uid}/profile`));
        if (pSnap.exists()) profiles[uid] = pSnap.val();
      } catch {}
    }

    tbody.innerHTML = recent.map(e => {
      const p = profiles[e.uid];
      const label = p ? `@${esc(p.username)}` : e.uid.slice(0,10);
      const delta = e.delta ?? 0;
      const color = delta > 0 ? "var(--brand)" : delta < 0 ? "var(--danger)" : "var(--text-dim)";
      return `<tr>
        <td class="faint small">${esc(fmtTime(e.ts))}</td>
        <td>${label}</td>
        <td style="color:${color};font-weight:600;">${delta >= 0 ? "+" : ""}${delta}</td>
        <td><strong>${e.after ?? "—"}</strong></td>
      </tr>`;
    }).join("");
  });

  return () => off();
}

        <div class="row-item-actions">
          <button class="btn btn-sm btn-primary" data-res="${esc(r.id)}">Proses</button>

          <p>Target: <strong>${esc(r.targetName || r.targetUid || "—")}</strong></p>
          <p>Alasan: <em>${esc(r.reason || "—")}</em></p>`,
        actions: [

            await audit("report_rejected", id, { target: r.targetUid });
            toast("Laporan ditolak", "ok");
          }},
          { label: "Tandai Selesai", primary: true, onClick: async () => {
            await update(ref(db, `reports/${id}`), { status: "resolved", resolvedBy: state.user.uid, resolvedAt: Date.now() });
            await audit("report_resolved", id, { target: r.targetUid });
            toast("Laporan selesai", "ok");
          }}
        ]
      });
    });
  });

  return () => off();
}

          <label>Judul</label>
          <input class="input" id="at" maxlength="80" placeholder="cth: Pemeliharaan server">
        </div>
        <div class="field mb-16">
          <label>Isi</label>
          <textarea class="input" id="ab" rows="4" maxlength="400" placeholder="Detail pengumuman…"></textarea>
        </div>
        <div class="field">
          <label>Tingkat</label>
          <select class="input" id="al">
            <option value="info">Info</option>
            <option value="warning">Peringatan</option>
            <option value="critical">Penting</option>
          </select>
        </div>`,
      actions: [
        { label: "Batal" },
        { label: "Publikasikan", primary: true, onClick: async (b) => {
          const title = $("#at", b).value.trim();
          const body = $("#ab", b).value.trim();
          const level = $("#al", b).value;
          if (!title || !body) { toast("Judul dan isi wajib", "error"); return false; }
          await push(ref(db, "announcements"), {
            title, body, level,
            createdAt: Date.now(),
            createdBy: state.user.uid,
            createdByName: state.profile?.displayName || "Admin"
          });
          await audit("announcement_create", null, { title });
          toast("Pengumuman dipublikasikan", "ok");
        }}
      ]
    });
  };

  return () => off();
}

/* ============================================================
   PAGE: AUDIT LOG
   ============================================================ */
function pageAudit(root) {
  root.innerHTML = `
    <div class="page-head">
      <div class="page-title-group">
        <h1>Audit Log</h1>
        <div class="page-sub">Riwayat tindakan administrator</div>
      </div>
    </div>
    <div class="toolbar">
      <input class="input" id="q" placeholder="Cari aksi, aktor, target…">
    </div>
    <div class="card card-flush">
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Waktu</th><th>Aktor</th><th>Aksi</th><th>Target</th></tr></thead>
          <tbody id="rows"><tr><td colspan="4"><div class="empty">Memuat…</div></td></tr></tbody>
        </table>
      </div>
    </div>`;

  let entries = [];
  const off = onValue(query(ref(db, "auditLogs"), limitToLast(200)), snap => {
    entries = snap.exists() ? Object.values(snap.val()) : [];
    entries.sort((a,b) => (b.ts||0) - (a.ts||0));
    render();
  });

  function render() {
    const q = $("#q", root).value.trim().toLowerCase();
    const tbody = $("#rows", root);
    const filtered = q ? entries.filter(e => [e.action, e.actorName, e.target].filter(Boolean).join(" ").toLowerCase().includes(q)) : entries;
    if (!filtered.length) { tbody.innerHTML = `<tr><td colspan="4"><div class="empty">Tidak ada log.</div></td></tr>`; return; }
    tbody.innerHTML = filtered.map(e => `
      <tr>
        <td class="faint small">${esc(fmtTime(e.ts))}</td>
        <td>${esc(e.actorName || e.actorEmail || "—")}</td>
        <td><span class="chip">${esc(e.action || "—")}</span></td>
        <td class="mono small">${esc((e.target || "—").slice(0, 20))}</td>
      </tr>`).join("");
  }

  $("#q", root).oninput = render;
  return () => off();
}

/* ============================================================
   PAGE: SETTINGS
   ============================================================ */
function pageSettings(root) {
  root.innerHTML = `
    <div class="page-head">
      <div class="page-title-group">
        <h1>Settings</h1>
        <div class="page-sub">Konfigurasi sistem & info</div>
      </div>
    </div>
    <h2>Mode Maintenance</h2>
    <div class="row-item mb-16">
      <div class="row-item-main">
        <div class="row-item-title">Aktifkan Pemeliharaan</div>
        <div class="row-item-sub">Saat aktif, aplikasi utama dapat menampilkan layar pemeliharaan.</div>
      </div>
      <div class="toggle" id="maintoggle" role="switch"></div>
    </div>
    <div class="card mb-24">
      <div class="field mb-16">
        <label>Pesan pemeliharaan</label>
        <textarea class="input" id="maintmsg" rows="2" maxlength="200" placeholder="cth: Server sedang diperbarui, kembali dalam 15 menit."></textarea>
      </div>
      <button class="btn btn-primary" id="savemaint">Simpan Pesan</button>
    </div>
    <h2>Info</h2>
    <div class="row-item mb-16"><div class="row-item-main"><div class="row-item-title">Nama</div><div class="row-item-sub">CAZOO Control Center</div></div></div>
    <div class="row-item mb-16"><div class="row-item-main"><div class="row-item-title">Versi</div><div class="row-item-sub">1.0.0</div></div></div>
    <div class="row-item"><div class="row-item-main"><div class="row-item-title">Role Anda</div><div class="row-item-sub">${esc(state.role || "—")}</div></div></div>`;

  const off = onValue(ref(db, "system/maintenance"), snap => {
    const v = snap.val() || {};
    $("#maintoggle", root).classList.toggle("on", v.enabled === true);
    $("#maintmsg", root).value = v.message || "";
  });

  $("#maintoggle", root).onclick = async () => {
    const cur = $("#maintoggle", root).classList.contains("on");
    await update(ref(db, "system/maintenance"), { enabled: !cur });
    await audit("maintenance_toggle", null, { enabled: !cur });
    toast(`Maintenance ${!cur ? "aktif" : "nonaktif"}`, "ok");
  };

  $("#savemaint", root).onclick = async () => {
    const msg = $("#maintmsg", root).value.trim();
    await update(ref(db, "system/maintenance"), { message: msg });
    await audit("maintenance_message_update", null, { message: msg.slice(0, 40) });
    toast("Pesan disimpan", "ok");
  };

  return () => off();
}

/* ============ PAGES MAP ============ */
const PAGES = {
  overview: pageOverview,
  users: pageUsers,
  rooms: pageRooms,
  games: pageGames,
  reports: pageReports,
  features: pageFeatures,
  announcements: pageAnnouncements,
  audit: pageAudit,
  settings: pageSettings,
};
</script>
</body>
</html>
