      ${!isFolder ? `<button class="menu-item" id="fm-download">${icon('download')} Download</button>` : ''}
      <button class="menu-item" id="fm-copy">${icon('copy')} Copy path</button>
      ${canEdit(r) ? `<button class="menu-item danger" id="fm-delete">${icon('trash-2')} Delete</button>` : ''}`,
    onMount(root){
      const close = () => closeSheet();
      $('#fm-copy', root).addEventListener('click', () => {
        navigator.clipboard?.writeText(path);
        toast('success','Tersalin','Path disalin ke clipboard.');
        close();
      });
      const dl = $('#fm-download', root);
      if (dl) dl.addEventListener('click', () => {
        if (!file) return close();
        const blob = new Blob([file.content], { type:'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = path.split('/').pop();
        a.click();
        URL.revokeObjectURL(a.href);
        close();
      });
      const rn = $('#fm-rename', root);
      if (rn) rn.addEventListener('click', () => { close(); openRenameSheet(path, isFolder); });
      const del = $('#fm-delete', root);
      if (del) del.addEventListener('click', () => {
        close();
        confirmSheet({
          title:'Hapus ' + (isFolder ? 'folder' : 'file'), danger:true, confirmText:'Hapus',
          message:`"${path}" akan dihapus dari branch ${S.currentBranch}.`,
          onConfirm(){
            let files = Store.files();
            if (isFolder){
              files = files.filter(f => !(f.repoId === r.id && f.branch === S.currentBranch && (f.path === path || f.path.startsWith(path + '/'))));
            } else {
              files = files.filter(f => !(f.repoId === r.id && f.branch === S.currentBranch && f.path === path));
            }
            Store.setFiles(files);
            addCommit(r.id, S.currentBranch, `${isFolder?'Delete folder':'Delete file'}: ${path}`, [path], 0, 0);
            toast('success','Dihapus', path);
            router();
          }
        });
      });
    }
  });
}

function openRenameSheet(path, isFolder){
  const r = S.currentRepo;
  openSheet({
    title:'Rename', iconName:'pencil',
    body:`<label class="field">
      <span class="lbl">${icon('type')} Nama baru</span>
      <input class="input" id="rn-name" value="${esc(path.split('/').pop())}" autocomplete="off">
      <div class="hint">Folder: ${esc(path.split('/').slice(0,-1).join('/') || '/')}</div>
    </label>`,
    footer:`<button class="btn btn-primary btn-block" id="rn-submit">${icon('check')} Simpan</button>`,
    onMount(root){
      $('#rn-submit', root).addEventListener('click', () => {
        const newName = $('#rn-name', root).value.trim();
        if (!newName) return toast('error','Nama kosong','');
        const dir = path.split('/').slice(0,-1).join('/');
        const newPath = dir ? dir + '/' + newName : newName;
        const files = Store.files();
        const target = files.filter(f => f.repoId === r.id && f.branch === S.currentBranch);
        let changed = 0;
        target.forEach(f => {
          if (isFolder){
            if (f.path === path || f.path.startsWith(path + '/')){
              f.path = newPath + f.path.slice(path.length);
              f.updatedAt = now();
              changed++;
            }
          } else if (f.path === path){
            f.path = newPath;
            f.updatedAt = now();
            changed++;
          }
        });
        Store.setFiles(files);
        addCommit(r.id, S.currentBranch, `Rename ${isFolder?'folder':'file'}: ${path} → ${newPath}`, [path, newPath], 0, 0);
        closeSheet();
        toast('success','Berhasil di-rename', `${changed} item diperbarui.`);
        router();
      });
    }
  });
}

function openUploadSheet(){
  const r = S.currentRepo;

          </div>

        </label>
        <label class="list-item" style="cursor:pointer">
          <div class="li-icon">${icon('file-archive')}</div>
          <div class="li-main">
            <div class="li-title">Upload ZIP</div>
            <div class="li-sub">Ekstraksi otomatis (demo: hanya file .txt dibaca)</div>
          </div>
          <input type="file" id="up-zip" accept=".zip" class="hide">
        </label>
      </div>
      <div id="up-progress" class="hide mt-3">
        <div class="row-between mb-1">
          <span class="small">Mengunggah...</span>
          <span class="small muted" id="up-pct">0%</span>
        </div>
        <div style="height:6px;background:var(--card-3);border-radius:999px;overflow:hidden">
          <div id="up-bar" style="height:100%;width:0%;background:var(--primary);transition:width .2s"></div>
        </div>
      </div>
      <p class="hint mt-2">Maximum supported size: 5 MB per file (batas demo browser).</p>`,
    onMount(root){
      const handleFiles = (fileList) => {
        const arr = Array.from(fileList);
        if (!arr.length) return;
        const prog = $('#up-progress', root);
        const bar = $('#up-bar', root);
        const pct = $('#up-pct', root);
        prog.classList.remove('hide');
        let done = 0;
        const files = Store.files();
        let totalLines = 0;
        const paths = [];

        arr.forEach(f => {
          if (f.size > 5*1024*1024){
            toast('warning','File terlalu besar', f.name + ' dilewati.');
            done++; updateProgress(); return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            const rel = f.webkitRelativePath || f.name;
            const content = typeof reader.result === 'string' ? reader.result : '';
            const existing = files.findIndex(x => x.repoId === r.id && x.branch === S.currentBranch && x.path === rel);
            if (existing >= 0){ files[existing].content = content; files[existing].updatedAt = now(); }
            else files.push({ id: uid('f'), repoId: r.id, branch: S.currentBranch, path: rel, content, updatedAt: now() });
            totalLines += content.split('\n').length;
            paths.push(rel);
            done++; updateProgress();
          };
          reader.onerror = () => { done++; updateProgress(); };
          reader.readAsText(f);
        });

        function updateProgress(){
          const p = Math.round(done / arr.length * 100);
          bar.style.width = p + '%';
          pct.textContent = p + '%';
          if (done >= arr.length){
            Store.setFiles(files);
            addCommit(r.id, S.currentBranch, `Upload ${paths.length} file`, paths, totalLines, 0);
            setTimeout(() => {
              closeSheet();
              toast('success','Upload selesai', paths.length + ' file ditambahkan.');
              router();
            }, 380);
          }
        }
      };

      $('#up-files', root).addEventListener('change', e => handleFiles(e.target.files));
      $('#up-folder', root).addEventListener('change', e => handleFiles(e.target.files));
      $('#up-zip', root).addEventListener('change', e => {
        toast('info','Demo','Ekstraksi ZIP belum didukung di sisi klien. Unggah file individual atau folder.');
      });
    }
  });
}

        <input class="input" id="pr-title" placeholder="Ringkasan perubahan" autocomplete="off">
      </label>

        <textarea class="textarea" id="pr-body" placeholder="Jelaskan perubahan yang Anda buat." style="min-height:110px"></textarea>
      </label>
      <div class="form-grid">
        <label class="field">
          <span class="lbl">${icon('git-branch')} Dari branch</span>
          <select class="select" id="pr-from">
            ${branches.filter(b=>b.name!==r.defaultBranch).map(b=>`<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('') || '<option value="">(tidak ada)</option>'}

          <span class="lbl">${icon('git-merge')} Ke branch</span>

            ${branches.map(b=>`<option value="${esc(b.name)}" ${b.name===r.defaultBranch?'selected':''}>${esc(b.name)}</option>`).join('')}
          </select>
        </label>
      </div>`,
    footer:`<button class="btn btn-primary btn-block" id="pr-submit">${icon('git-pull-request')} Buat Pull Request</button>`,
    onMount(root){
      $('#pr-submit', root).addEventListener('click', () => {
        const title = $('#pr-title', root).value.trim();
        const from = $('#pr-from', root).value;
        const to = $('#pr-to', root).value;
        if (!title) return toast('error','Judul kosong','');
        if (!from || !to) return toast('error','Branch tidak valid','');
        if (from === to) return toast('error','Branch sama','Pilih branch yang berbeda.');
        const prs = Store.prs();
        const existing = prs.filter(p => p.repoId === repoId);
        const num = existing.length ? Math.max(...existing.map(p=>p.number)) + 1 : 1;
        const fromFiles = repoFiles(repoId, from);
        const toFiles = repoFiles(repoId, to);
        const fromMap = new Map(fromFiles.map(f => [f.path, f.content]));
        const toMap = new Map(toFiles.map(f => [f.path, f.content]));
        const allPaths = new Set([...fromMap.keys(), ...toMap.keys()]);
        let add = 0, del = 0, changed = 0;
        allPaths.forEach(p => {
          const a = fromMap.get(p), b = toMap.get(p);
          if (a === b) return;
          changed++;
          const al = (a||'').split('\n'), bl = (b||'').split('\n');
          const len = Math.max(al.length, bl.length);
          for (let i=0;i<len;i++){ if (al[i] !== bl[i]){ if (al[i]===undefined) del++; else add++; } }
        });
        prs.push({
          id: uid('p'), repoId, number: num, title,
          body: $('#pr-body', root).value.trim(),
          state:'open', authorId: S.user.id,
          fromBranch: from, toBranch: to,
          filesChanged: changed, additions: add, deletions: del,
          comments: [], createdAt: now(), updatedAt: now()
        });
        Store.setPrs(prs);
        pushNotif(S.user.id, 'git-pull-request', 'Pull request dibuat', `#${num} ${title}`, `#/repo/${repoId}/pulls`);
        closeSheet();
        toast('success','Pull request dibuat', '#' + num);
        router();
      });
    }
  });
}

function openPRDetail(prId, mode){
  const p = Store.prs().find(x => x.id === prId);
  if (!p) return;
  const fromFiles = repoFiles(p.repoId, p.fromBranch);
  const toFiles = repoFiles(p.repoId, p.toBranch);
  const fromMap = new Map(fromFiles.map(f => [f.path, f.content]));
  const toMap = new Map(toFiles.map(f => [f.path, f.content]));
  const allPaths = [...new Set([...fromMap.keys(), ...toMap.keys()])];

  let diffHTML = '';
  allPaths.forEach(path => {
    const a = fromMap.get(path);
    const b = toMap.get(path);
    if (a === b) return;
    diffHTML += `<div class="small mono" style="padding:9px 12px;background:var(--card-2);border-bottom:1px solid var(--border);font-weight:600">${esc(path)}</div>`;
    const al = (a||'').split('\n');
    const bl = (b||'').split('\n');
    const len = Math.max(al.length, bl.length);
    for (let i=0;i<len;i++){
      if (al[i] === bl[i]) continue;
      if (al[i] !== undefined && bl[i] === undefined)
        diffHTML += `<div class="diff-line del"><span class="dn">-</span>${esc(al[i])}</div>`;
      else if (al[i] === undefined)
        diffHTML += `<div class="diff-line add"><span class="dn">+</span>${esc(bl[i])}</div>`;
      else {
        diffHTML += `<div class="diff-line del"><span class="dn">-</span>${esc(al[i])}</div>`;
        diffHTML += `<div class="diff-line add"><span class="dn">+</span>${esc(bl[i])}</div>`;
      }
    }
  });

  openSheet({
    title:`#${p.number} ${p.title}`, iconName:'git-pull-request',
    body:`
      <div class="badge-row mb-2">
        <span class="badge ${p.state==='open'?'badge-success':'badge-muted'}">${icon(p.state==='open'?'git-pull-request':'git-merge')} ${p.state}</span>
        <span class="badge mono">${esc(p.fromBranch)} → ${esc(p.toBranch)}</span>
        <span class="badge">${icon('file-diff')} ${p.filesChanged} file</span>
        <span class="badge" style="color:var(--success)">+${p.additions}</span>
        <span class="badge" style="color:var(--danger)">−${p.deletions}</span>
      </div>
      <div class="md mb-3">${renderMarkdown(p.body || '_Tidak ada deskripsi._')}</div>
      <h4 style="font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:7px">${icon('file-diff')} Diff</h4>
      ${diffHTML ? `<div class="diff">${diffHTML}</div>` : `<p class="small muted">Tidak ada perbedaan file.</p>`}
      ${mode === 'comment' ? `
        <div class="divider"></div>
        <label class="field">
          <span class="lbl">${icon('message-square')} Komentar</span>
          <textarea class="textarea" id="prc-body" placeholder="Tulis komentar review..." style="min-height:80px"></textarea>
        </label>` : ''}`,
    footer: mode === 'comment'
      ? `<button class="btn btn-primary btn-block" id="prc-send">${icon('send')} Kirim komentar</button>`
      : `<button class="btn btn-block" data-close-sheet>${icon('x')} Tutup</button>`,
    onMount(root){
      const send = $('#prc-send', root);
      if (send) send.addEventListener('click', () => {
        const body = $('#prc-body', root).value.trim();
        if (!body) return toast('error','Komentar kosong','');
        const prs = Store.prs();
        const t = prs.find(x => x.id === prId);
        t.comments.push({ id: uid('c'), authorId: S.user.id, body, createdAt: now() });
        Store.setPrs(prs);
        closeSheet();
        toast('success','Komentar dikirim','');
      });
    }
  });
}

function mergePR(prId){
  const p = Store.prs().find(x => x.id === prId);
  if (!p) return;
  confirmSheet({
    title:'Merge pull request', confirmText:'Merge', message:`Merge "${p.fromBranch}" ke "${p.toBranch}"?`,
    onConfirm(){
      // Copy files dari fromBranch ke toBranch
      const files = Store.files();
      repoFiles(p.repoId, p.fromBranch).forEach(src => {
        const idx = files.findIndex(f => f.repoId === p.repoId && f.branch === p.toBranch && f.path === src.path);
        if (idx >= 0){ files[idx].content = src.content; files[idx].updatedAt = now(); }
        else files.push({ id: uid('f'), repoId: p.repoId, branch: p.toBranch, path: src.path, content: src.content, updatedAt: now() });
      });
      Store.setFiles(files);
      const prs = Store.prs();
      const t = prs.find(x => x.id === prId);
      t.state = 'merged'; t.updatedAt = now();
      Store.setPrs(prs);
      addCommit(p.repoId, p.toBranch, `Merge pull request #${p.number} from ${p.fromBranch}`, [], p.additions, p.deletions);
      toast('success','Pull request di-merge','');
      router();
    }
  });
}
function closePR(prId){
  const prs = Store.prs();
  const t = prs.find(x => x.id === prId);
  t.state = 'closed'; t.updatedAt = now();
  Store.setPrs(prs);
  toast('info','Pull request ditutup','');
  router();
}

function addCommit(repoId, branch, message, files, additions, deletions){
  const id = uid('c').slice(0,7);
  const commits = Store.commits();
  commits.push({
    id, repoId, branch, message,
    authorId: S.user.id, date: now(),
    additions: additions || 0,
    deletions: deletions || 0,
    files: files || []
  });
  Store.setCommits(commits);

  const repos = Store.repos();
  const r = repos.find(x => x.id === repoId);
  if (r) r.updatedAt = now();
  Store.setRepos(repos);
  return id;
}

/* ---------------------------------------------------------------------------
   30. DOWNLOAD REPO (ZIP sederhana — fallback ke JSON karena tanpa library zip)
   --------------------------------------------------------------------------- */
function downloadRepoZip(){
  const r = S.currentRepo;
  if (!r) return;
  const files = repoFiles(r.id, S.currentBranch);
  if (!files.length) return toast('warning','Repository kosong','Tidak ada file untuk diunduh.');

  // Demo: unduh sebagai file .json berisi struktur. Untuk ZIP nyata butuh library zip.
  const payload = {
    repository: r.name,
    branch: S.currentBranch,
    files: files.map(f => ({ path: f.path, content: f.content }))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${r.name}-${S.currentBranch}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('info','Unduhan dimulai', 'Demo: file diekspor sebagai JSON (ZIP butuh library tambahan).');
}

/* ---------------------------------------------------------------------------
   31. EDITOR (CodeMirror)
   --------------------------------------------------------------------------- */
function openEditor(repoId, branch, filePath){
  const repo = getRepo(repoId);
  if (!repo) return;
  S.currentRepo = repo;
  S.currentBranch = branch;

  const files = repoFiles(repoId, branch);
  if (!files.length){
    toast('warning','Tidak ada file','Buat file terlebih dahulu di repository.');
    return;
  }
  const target = files.find(f => f.path === filePath) || files[0];

  const root = $('#overlay-root');
  root.innerHTML = `
    <div class="editor-shell">
      <div class="editor-head">
        <button class="icon-btn" id="ed-close" aria-label="Tutup editor" data-tip="Tutup">${icon('arrow-left')}</button>
        <div class="editor-tabs" id="ed-tabs"></div>
        <button class="icon-btn" id="ed-more" aria-label="Menu lain" data-tip="Menu">${icon('ellipsis-vertical')}</button>
      </div>
      <div class="editor-toolbar">
        <button class="tool-btn primary" id="ed-save">${icon('save')} <span>Save</span></button>
        <button class="tool-btn" id="ed-search">${icon('search')} <span>Cari</span></button>
        <button class="tool-btn" id="ed-replace">${icon('replace')} <span>Replace</span></button>
        <button class="tool-btn" id="ed-run">${icon('play')} <span>Run</span></button>
        <button class="tool-btn" id="ed-preview">${icon('monitor-play')} <span>Preview</span></button>
        <button class="tool-btn" id="ed-wrap">${icon('wrap-text')} <span>Wrap</span></button>
        <button class="tool-btn" id="ed-goto">${icon('arrow-right-to-line')} <span>Baris</span></button>
      </div>
      <div class="editor-area">
        <textarea id="ed-textarea"></textarea>
      </div>
      <div class="editor-status">
        <span class="st">${icon('git-branch')} <span class="mono">${esc(branch)}</span></span>
        <span class="st">${icon('file-code-2')} <span id="ed-path" class="mono truncate" style="max-width:180px"></span></span>
        <span class="st">${icon('circle-dot')} <span id="ed-pos">Ln 1, Col 1</span></span>
        <span class="st">${icon('type')} <span id="ed-lang"></span></span>
        <span class="st" id="ed-dirty" style="color:var(--warning);display:none">${icon('circle')} belum disimpan</span>
      </div>
    </div>`;

  refreshIcons();

  let openTabs = [target.path];
  let dirty = false;

  const cm = CodeMirror.fromTextArea($('#ed-textarea'), {
    value: target.content,
    mode: langOf(target.path),
    theme: S.settings.theme === 'light' ? 'default' : 'material-darker',
    lineNumbers: true,
    indentUnit: S.settings.tabSize,
    tabSize: S.settings.tabSize,
    indentWithTabs: false,
    lineWrapping: !!S.settings.wordWrap,
    autoCloseBrackets: true,
    matchBrackets: true,
    autoCloseTags: true,
    foldGutter: true,
    gutters: ['CodeMirror-linenumbers','CodeMirror-foldgutter'],
    extraKeys: {
      'Ctrl-S': () => saveFile(),
      'Cmd-S': () => saveFile(),
      'Ctrl-/': 'toggleComment',
      'Cmd-/': 'toggleComment',
      'Tab': cm2 => cm2.replaceSelection('  ', 'end')
    }
  });
  S.cm = cm;
  cm.setSize('100%','100%');
  cm.focus();

  const fontPx = S.settings.editorFont || 13;
  const cmEl = cm.getWrapperElement();
  cmEl.style.fontSize = fontPx + 'px';

  function updateStatus(){
    const pos = cm.getCursor();
    $('#ed-pos').textContent = `Ln ${pos.line+1}, Col ${pos.ch+1}`;
    const p = openTabs[openTabs.length-1] || target.path;
    $('#ed-path').textContent = p;
    $('#ed-lang').textContent = langOf(p) === 'null' ? 'text' : langOf(p);
    $('#ed-dirty').style.display = dirty ? 'inline-flex' : 'none';
    refreshIcons();
  }

  function renderTabs(){
    const cont = $('#ed-tabs');
    cont.innerHTML = openTabs.map(p => `
      <button class="etab ${p === currentPath() ? 'active' : ''}" data-etab="${esc(p)}">
        ${icon(fileIcon(p))}
        <span>${esc(p.split('/').pop())}</span>
        ${openTabs.length > 1 ? `<span class="et-x" data-etab-close="${esc(p)}" role="button" aria-label="Tutup">${icon('x', 12)}</span>` : ''}
      </button>`).join('');
    refreshIcons();
    $$('[data-etab]', cont).forEach(b => b.addEventListener('click', e => {
      if (e.target.closest('[data-etab-close]')) return;
      switchTo(b.dataset.etab);
    }));
    $$('[data-etab-close]', cont).forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      closeTab(b.dataset.etabClose);
    }));
  }

  function currentPath(){ return openTabs[openTabs.length-1]; }

  function switchTo(path){
    const f = repoFiles(repoId, branch).find(x => x.path === path);
    if (!f) return;
    if (!openTabs.includes(path)) openTabs.push(path);
    cm.setValue(f.content);
    cm.setOption('mode', langOf(path));
    cm.clearHistory();
    dirty = false;
    renderTabs();
    updateStatus();
  }

  function closeTab(path){
    if (!dirty) {
      openTabs = openTabs.filter(p => p !== path);
      if (!openTabs.length){
        const f = repoFiles(repoId, branch);
        if (!f.length) return closeEditor();
        openTabs = [f[0].path];
      }
      switchTo(openTabs[openTabs.length-1]);
      renderTabs();
    } else {
      confirmSheet({
        title:'Tutup tanpa menyimpan?', danger:true, confirmText:'Tutup',
        message:'Perubahan yang belum disimpan akan hilang.',
        onConfirm(){
          dirty = false;
          openTabs = openTabs.filter(p => p !== path);
          if (!openTabs.length) return closeEditor();
          switchTo(openTabs[openTabs.length-1]);
          renderTabs();
        }
      });
    }
  }

  function saveFile(){
    const path = currentPath();
    const content = cm.getValue();
    const files = Store.files();
    const idx = files.findIndex(f => f.repoId === repoId && f.branch === branch && f.path === path);
    if (idx < 0) return toast('error','File tidak ditemukan','');
    const oldLines = (files[idx].content || '').split('\n').length;
    const newLines = content.split('\n').length;
    const added = Math.max(0, newLines - oldLines);
    const removed = Math.max(0, oldLines - newLines);
    files[idx].content = content;
    files[idx].updatedAt = now();
    Store.setFiles(files);
    addCommit(repoId, branch, `Update ${path}`, [path], added, removed);
    dirty = false;
    updateStatus();
    toast('success','Tersimpan', path);
  }

  function closeEditor(){
    closeAllOverlays();
    router();
  }

  // Bind toolbar
  $('#ed-close').addEventListener('click', () => {
    if (dirty){
      confirmSheet({
        title:'Perubahan belum disimpan', danger:true, confirmText:'Keluar tanpa simpan',
        message:'Anda memiliki perubahan yang belum disimpan.',
        onConfirm: closeEditor
      });
    } else closeEditor();
  });
  $('#ed-save').addEventListener('click', saveFile);
  $('#ed-search').addEventListener('click', () => cm.execCommand('find'));
  $('#ed-replace').addEventListener('click', () => cm.execCommand('replace'));
  $('#ed-run').addEventListener('click', () => {
    const path = currentPath();
    const content = cm.getValue();
    if (path.endsWith('.js') || path.endsWith('.mjs')){
      const logs = [];
      const origLog = console.log;
      console.log = (...a) => logs.push(a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' '));
      try { (new Function(content))(); } catch(e){ logs.push('Error: ' + e.message); }
      console.log = origLog;
      openSheet({
        title:'Output', iconName:'terminal',
        body:`<pre class="mono" style="font-size:12.5px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre-wrap">${esc(logs.join('\n') || '(tidak ada output)')}</pre>`
      });
    } else {
      openPreviewForCurrentFile();
    }
  });
  $('#ed-preview').addEventListener('click', openPreviewForCurrentFile);
  $('#ed-wrap').addEventListener('click', () => {
    const v = !cm.getOption('lineWrapping');
    cm.setOption('lineWrapping', v);
    const s = Store.settings(); s.wordWrap = v; Store.setSettings(s); S.settings = s;
    toast('info','Word wrap', v ? 'Aktif' : 'Nonaktif');
  });
  $('#ed-goto').addEventListener('click', () => cm.execCommand('jumpToLine'));
  $('#ed-more').addEventListener('click', () => {
    openSheet({

function openPreview(repoId){
  const r = getRepo(repoId);
  if (!r) return;
  const files = repoFiles(repoId, S.currentBranch);
  let html = files.find(f => f.path === 'index.html');
  if (!html) html = files.find(f => f.path.endsWith('.html'));
  if (!html){
    // fallback: tampilkan daftar file
    showPreviewFrame(`<!DOCTYPE html><html><body style="font-family:system-ui;padding:24px;background:#0a0a0f;color:#e7e7ef">
      <h2 style="margin:0 0 10px">Tidak ada index.html</h2>
      <p style="color:#8b8b9c">Repository ini tidak memiliki file HTML untuk dipratinjau.</p>
      <ul style="margin-top:16px;color:#b9b9c9">${files.map(f=>`<li>${esc(f.path)}</li>`).join('')}</ul>
    </body></html>`);
    return;
  }
  let content = html.content;
  files.filter(f => f.path.endsWith('.css')).forEach(f => {
    const name = f.path.split('/').pop();
    const re = new RegExp('<link[^>]*href=["\'][^"\']*' + name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '["\'][^>]*>','i');
    content = content.replace(re, `<style>${f.content}</style>`);
  });
  files.filter(f => f.path.endsWith('.js')).forEach(f => {
    const name = f.path.split('/').pop();
    const re = new RegExp('<script[^>]*src=["\'][^"\']*' + name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '["\'][^>]*><\\/script>','i');
    content = content.replace(re, `<script>${f.content}<\/script>`);
  });
  showPreviewFrame(content);
}

const termState = { cwd:'/', history:[], hIndex:-1 };
function openTerminal(){
  const root = $('#overlay-root');
  let shell = root.querySelector('.term-shell');
  if (shell){ shell.remove(); return; }
  shell = document.createElement('div');
  shell.className = 'term-shell';
  shell.innerHTML = `
    <div class="term-head">
      <span class="th-title">${icon('terminal')} Terminal</span>
      <div class="spacer grow"></div>
      <button class="icon-btn" id="tm-clear" aria-label="Bersihkan" data-tip="Clear">${icon('eraser')}</button>
      <button class="icon-btn" id="tm-copy" aria-label="Salin" data-tip="Copy">${icon('copy')}</button>
      <button class="icon-btn" id="tm-expand" aria-label="Perluas" data-tip="Expand">${icon('maximize-2')}</button>
      <button class="icon-btn" id="tm-close" aria-label="Tutup" data-tip="Close">${icon('x')}</button>
    </div>
    <div class="term-body" id="tm-body"></div>
    <div class="term-input-row">
      <span class="ps">nev@code:~$</span>
      <input class="term-input" id="tm-input" autocomplete="off" spellcheck="false" placeholder="ketik perintah...">
    </div>`;
  root.appendChild(shell);
  refreshIcons();

  const body = $('#tm-body', shell);
  const input = $('#tm-input', shell);

  termPrint('NEV CODE Terminal — demo (perintah terbatas)', 'tk-m');
  termPrint('Ketik "help" untuk daftar perintah.', 'tk-m');
  termPrint('');

  function termPrint(text, colorClass){
    const line = document.createElement('span');
    line.className = 'term-line ' + (colorClass || '');
    line.textContent = text;
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;
  }

  $('#tm-close', shell).addEventListener('click', () => shell.remove());
  $('#tm-clear', shell).addEventListener('click', () => { body.innerHTML = ''; });
  $('#tm-copy', shell).addEventListener('click', () => {
    navigator.clipboard?.writeText(body.textContent);
    toast('success','Tersalin','Isi terminal disalin.');
  });
  $('#tm-expand', shell).addEventListener('click', () => {
    shell.style.height = shell.style.height === '95dvh' ? 'min(72dvh,560px)' : '95dvh';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      const cmd = input.value.trim();
      input.value = '';
      if (!cmd) return;
      termPrint('nev@code:~$ ' + cmd, 'tk-g');
      termState.history.push(cmd);
      termState.hIndex = termState.history.length;
      runCommand(cmd);
      termPrint('');
    } else if (e.key === 'ArrowUp'){
      if (termState.hIndex > 0){ termState.hIndex--; input.value = termState.history[termState.hIndex]; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown'){
      if (termState.hIndex < termState.history.length - 1){ termState.hIndex++; input.value = termState.history[termState.hIndex]; }
      else { termState.hIndex = termState.history.length; input.value = ''; }
      e.preventDefault();
    }
  });
  setTimeout(() => input.focus(), 80);

  function runCommand(cmd){
    const [c, ...args] = cmd.split(/\s+/);
    const r = S.currentRepo;
    const files = r ? repoFiles(r.id, S.currentBranch) : [];

    switch (c){
      case 'help':
        termPrint('Perintah tersedia:', 'tk-a');
        termPrint('  help              tampilkan bantuan');
        termPrint('  ls                daftar file repository aktif');
        termPrint('  cat <file>        tampilkan isi file');
        termPrint('  pwd               direktori saat ini');
        termPrint('  clear             bersihkan layar');
        termPrint('  echo <teks>       cetak teks');
        termPrint('  git status        status repository');
        termPrint('  git log           riwayat commit');
        termPrint('  git branch        daftar branch');
        termPrint('  git checkout <b>  pindah branch');
        termPrint('  open <file>       buka file di editor');
        termPrint('  repo              info repository aktif');
        break;
      case 'ls':
        if (!r) return termPrint('(tidak ada repository aktif — buka repository terlebih dahulu)', 'tk-w');
        if (!files.length) return termPrint('(kosong)');
        files.forEach(f => termPrint('  ' + f.path));
        break;
      case 'cat': {
        if (!args[0]) return termPrint('usage: cat <file>', 'tk-w');
        const f = files.find(x => x.path === args[0] || x.path.endsWith('/' + args[0]));
        if (!f) return termPrint('cat: ' + args[0] + ': file tidak ditemukan', 'tk-w');
        f.content.split('\n').forEach(l => termPrint(l));
        break;
      }
      case 'pwd':
        termPrint('/home/' + (S.user ? S.user.username : 'guest') + (r ? '/' + r.name : ''));
        break;
      case 'clear':
        body.innerHTML = '';
        break;
      case 'echo':
        termPrint(args.join(' '));
        break;
      case 'git':
        if (!r) return termPrint('fatal: bukan repository NEV CODE', 'tk-w');
        if (args[0] === 'status'){
          termPrint('On branch ' + S.currentBranch, 'tk-g');
          termPrint('Your branch is up to date with origin/' + S.currentBranch + '.');
          termPrint('');
          termPrint(files.length + ' files tracked.');
        } else if (args[0] === 'log'){
          const cs = repoCommits(r.id, S.currentBranch);
          cs.forEach(c => termPrint('  ' + c.id + '  ' + c.message + '  (' + timeAgo(c.date) + ')'));
        } else if (args[0] === 'branch'){
          repoBranches(r.id).forEach(b => termPrint((b.name === S.currentBranch ? '* ' : '  ') + b.name));
        } else if (args[0] === 'checkout'){
          if (!args[1]) return termPrint('usage: git checkout <branch>', 'tk-w');
          if (!repoBranches(r.id).some(b => b.name === args[1])) return termPrint('error: branch tidak ditemukan', 'tk-w');
          S.currentBranch = args[1];
          termPrint('Switched to branch ' + args[1], 'tk-g');
          router();
        } else {
          termPrint('git: subcommand tidak dikenal. Coba: status, log, branch, checkout', 'tk-w');
        }
        break;
      case 'open': {
        if (!args[0]) return termPrint('usage: open <file>', 'tk-w');
        const f = files.find(x => x.path === args[0] || x.path.endsWith('/' + args[0]));
        if (!f) return termPrint('open: file tidak ditemukan', 'tk-w');
        shell.remove();
        openEditor(r.id, S.currentBranch, f.path);
        break;
      }
      case 'repo':
        if (!r) return termPrint('(tidak ada repository aktif)', 'tk-w');
        termPrint('Name:        ' + r.name);
        termPrint('Visibility:  ' + r.visibility);
        termPrint('Branch:      ' + S.currentBranch);
        termPrint('Files:       ' + files.length);
        termPrint('Commits:     ' + repoCommits(r.id, S.currentBranch).length);
        break;
      default:
        termPrint('perintah tidak dikenal: ' + c + '. Ketik "help".', 'tk-w');
    }
  }
}

function openSearch(){
  const root = $('#overlay-root');
  root.innerHTML = `
    <div class="search-overlay">
      <div class="search-head">
        <button class="icon-btn" id="sr-close" aria-label="Tutup">${icon('arrow-left')}</button>
        <div class="grow rel">
          ${icon('search')}
          <input class="input" id="sr-input" placeholder="Cari repository, file, user, issue, commit..." autocomplete="off" style="padding-left:38px">
          <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:grid;place-items:center">${icon('search')}</span>
        </div>
      </div>
      <div class="search-body" id="sr-body"></div>
    </div>`;
  // Perbaiki ikon ganda
  $('#sr-input').parentElement.querySelector('span').innerHTML = '';
  $('#sr-input').parentElement.querySelector('span').remove();
  refreshIcons();

  const input = $('#sr-input');
  const body  = $('#sr-body');

  function renderEmpty(){
    const recent = S.searchRecent;
    body.innerHTML = `
      ${recent.length ? `
        <div class="row-between mb-2">
          <span class="small" style="font-weight:600;color:var(--muted)">Pencarian terbaru</span>
          <button class="small" id="sr-clear-recent" style="color:var(--primary-2);font-weight:600">Hapus</button>
        </div>
        <div class="stack mb-3" style="gap:6px">
          ${recent.map(q => `
            <button class="list-item" data-recent="${esc(q)}" style="text-align:left">
              <div class="li-icon">${icon('history')}</div>
              <div class="li-main"><div class="li-title truncate">${esc(q)}</div></div>
            </button>`).join('')}
        </div>` : ''}
      <div class="small" style="font-weight:600;color:var(--muted);margin-bottom:8px">Saran</div>
      <div class="stack" style="gap:6px">
        ${myRepos().slice(0,5).map(r => `
          <a class="list-item" href="#/repo/${r.id}">
            <div class="li-icon">${icon('folder-git-2')}</div>
            <div class="li-main"><div class="li-title truncate">${esc(r.name)}</div><div class="li-sub">repository</div></div>
          </a>`).join('') || `<p class="small muted">Belum ada repository.</p>`}
      </div>`;
    refreshIcons();
    $$('[data-recent]', body).forEach(b => b.addEventListener('click', () => {
      input.value = b.dataset.recent;
      doSearch(b.dataset.recent);
    }));
    const cr = $('#sr-clear-recent');
    if (cr) cr.addEventListener('click', () => {
      S.searchRecent = [];
      DB.set('searchRecent', []);
      renderEmpty();
    });
  }

  function doSearch(q){
    q = q.trim().toLowerCase();
    if (!q){ renderEmpty(); return; }

    const results = [];
    const repos = Store.repos().filter(r => canAccess(r));
    repos.forEach(r => {
      if (r.name.toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q))
        results.push({ type:'Repository', icon:'folder-git-2', title:r.name, sub:r.description||'', href:`#/repo/${r.id}` });
      repoFiles(r.id, r.defaultBranch).forEach(f => {
        if (f.path.toLowerCase().includes(q))
          results.push({ type:'File', icon:fileIcon(f.path), title:f.path, sub:r.name, href:`#/editor/${r.id}/${encodeURIComponent(r.defaultBranch)}/${encodeURIComponent(f.path)}` });
      });
      repoIssues(r.id).forEach(i => {
        if (i.title.toLowerCase().includes(q) || (i.body||'').toLowerCase().includes(q))
          results.push({ type:'Issue', icon:'circle-dot', title:`#${i.number} ${i.title}`, sub:r.name, href:`#/repo/${r.id}/issues` });
      });
      repoCommits(r.id).forEach(c => {
        if (c.message.toLowerCase().includes(q))
          results.push({ type:'Commit', icon:'git-commit-horizontal', title:c.message, sub:`${r.name} • ${c.id.slice(0,7)}`, href:`#/repo/${r.id}/actions` });
      });
    });
    Store.users().forEach(u => {
      if (u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))
        results.push({ type:'User', icon:'user', title:u.username, sub:u.email, href:'#/profile' });
    });

    if (!results.length){
      body.innerHTML = viewEmptyState('search-x','Tidak ada hasil',`Tidak ditemukan hasil untuk "${q}".`);
      refreshIcons();
      return;
    }

    const groups = {};
    results.slice(0, 60).forEach(r => { (groups[r.type] = groups[r.type]||[]).push(r); });

    body.innerHTML = Object.keys(groups).map(type => `
      <div class="small mb-2" style="font-weight:600;color:var(--muted)">${type} (${groups[type].length})</div>
      <div class="stack mb-3" style="gap:6px">
        ${groups[type].slice(0,10).map(r => `
          <a class="list-item" href="${r.href}">
            <div class="li-icon">${icon(r.icon)}</div>
            <div class="li-main">
              <div class="li-title truncate">${esc(r.title)}</div>
              ${r.sub ? `<div class="li-sub truncate">${esc(r.sub)}</div>` : ''}
            </div>
          </a>`).join('')}
      </div>`).join('');
    refreshIcons();
    $$('.search-body a', body).forEach(a => a.addEventListener('click', () => {
      saveRecent(input.value.trim());
      closeAllOverlays();
    }));
  }

  function saveRecent(q){
    if (!q) return;
    S.searchRecent = [q, ...S.searchRecent.filter(x => x !== q)].slice(0, 6);
    DB.set('searchRecent', S.searchRecent);
  }

  input.addEventListener('input', debounce(() => doSearch(input.value), 180));
  $('#sr-close').addEventListener('click', () => { closeAllOverlays(); });
  renderEmpty();
  setTimeout(() => input.focus(), 80);
}

function openNotifications(){

      </div>
      <div class="notif-body" id="nt-body"></div>
    </div>`;
  refreshIcons();

  function render(){
    const list = Store.notifs().filter(n => n.userId === S.user.id);
    const body = $('#nt-body');
    if (!list.length){
      body.innerHTML = viewEmptyState('bell-off','Tidak ada notifikasi','Notifikasi akan muncul di sini.');
      refreshIcons();
      return;
    }
    body.innerHTML = list.map(n => `
      <div class="notif-item ${n.read ? '' : 'unread'}" data-nid="${n.id}">
        <div class="ni">${icon(n.icon || 'bell')}</div>
        <div class="grow" style="min-width:0">
          <div class="row-between" style="gap:8px">
            <div class="small" style="font-weight:600">${esc(n.title)}</div>
            <button class="icon-btn" style="width:28px;height:28px;min-width:28px" data-ndel="${n.id}" aria-label="Hapus notifikasi">${icon('x')}</button>
          </div>
          <div class="tiny muted" style="margin-top:2px">${esc(n.body||'')}</div>
          <div class="tiny muted" style="margin-top:6px">${timeAgo(n.createdAt)}</div>
          ${!n.read ? `<button class="btn btn-sm mt-1" data-nread="${n.id}">${icon('check')} Tandai dibaca</button>` : ''}
        </div>
      </div>`).join('');
    refreshIcons();

    $$('[data-nread]', body).forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      markRead(b.dataset.nread);
      render();
      updateNotifBadge();
    }));
    $$('[data-ndel]', body).forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const list2 = Store.notifs().filter(x => x.id !== b.dataset.ndel);
      Store.setNotifs(list2);
      render();
      updateNotifBadge();
    }));
    $$('.notif-item', body).forEach(el => el.addEventListener('click', () => {
      const n = Store.notifs().find(x => x.id === el.dataset.nid);
      if (!n) return;
      markRead(n.id);
      updateNotifBadge();
      if (n.href){ closeAllOverlays(); navigate(n.href); }
    }));
  }

  function markRead(id){
    const list = Store.notifs();
    const n = list.find(x => x.id === id);
    if (n) n.read = true;
    Store.setNotifs(list);
  }

  $('#nt-close').addEventListener('click', () => closeAllOverlays());
  $('#nt-readall').addEventListener('click', () => {
    const list = Store.notifs().map(n => n.userId === S.user.id ? { ...n, read:true } : n);
    Store.setNotifs(list);
    render();
    updateNotifBadge();
    toast('success','Semua ditandai dibaca','');
  });
  render();
}

    { id:'go-dashboard', label:'Go to Dashboard', icon:'layout-dashboard', run: () => { closeAllOverlays(); navigate('/dashboard'); } },
    { id:'new-issue', label:'New Issue', icon:'circle-dot', run: () => {
        const r = S.currentRepo || myRepos()[0];
        if (!r) return toast('warning','Tidak ada repository','Buat repository dulu.');
        closeAllOverlays(); openNewIssueSheet(r.id);
      } },
    { id:'new-branch', label:'New Branch', icon:'git-branch', run: () => {
        if (!S.currentRepo) return toast('warning','Pilih repository','Buka repository terlebih dahulu.');
        closeAllOverlays(); openBranchSheet();
      } },
    { id:'commit', label:'Commit Changes', icon:'git-commit-horizontal', run: () => {
        if (!S.currentRepo) return toast('warning','Pilih repository','Buka repository terlebih dahulu.');
        closeAllOverlays(); openCommitSheet(S.currentRepo.id);
      } },
    { id:'toggle-theme', label:'Toggle Theme', icon:'sun-moon', run: () => { toggleTheme(); closeAllOverlays(); } },
    { id:'open-terminal', label:'Open Terminal', icon:'terminal', run: () => { closeAllOverlays(); openTerminal(); } },
    { id:'open-settings', label:'Open Settings', icon:'settings', run: () => { closeAllOverlays(); navigate('/settings'); } },
    { id:'open-notif', label:'Open Notifications', icon:'bell', run: () => { closeAllOverlays(); openNotifications(); } },
    { id:'logout', label:'Logout', icon:'log-out', run: () => { closeAllOverlays(); Auth.logout(); } }
  ];

  root.innerHTML = `
    <div class="cmdk" id="cmdk-overlay">
      <div class="cmdk-box">
        <div class="cmdk-input-row">
          ${icon('search')}
          <input class="cmdk-input" id="cmdk-input" placeholder="Ketik perintah atau cari..." autocomplete="off">
          <span class="kbd" style="font-size:11px;color:var(--muted)">Esc</span>
        </div>
        <div class="cmdk-list" id="cmdk-list"></div>
      </div>
    </div>`;
  refreshIcons();

  const input = $('#cmdk-input');
  const list = $('#cmdk-list');
  let sel = 0;
  let filtered = cmds.slice();

  function render(){
    list.innerHTML = filtered.length
      ? filtered.map((c,i) => `
          <button class="cmdk-item ${i===sel?'sel':''}" data-cmd="${c.id}">
            ${icon(c.icon)}<span>${esc(c.label)}</span>
          </button>`).join('')
      : `<div class="empty" style="padding:24px"><p class="small muted">Tidak ada perintah yang cocok.</p></div>`;
    refreshIcons();
    $$('[data-cmd]', list).forEach(b => b.addEventListener('click', () => {
      const c = cmds.find(x => x.id === b.dataset.cmd);
      if (c) c.run();
    }));
  }
  function filter(){
    const q = input.value.toLowerCase().trim();
    filtered = cmds.filter(c => c.label.toLowerCase().includes(q));
    sel = 0;
    render();
  }
  input.addEventListener('input', filter);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown'){ sel = Math.min(sel+1, filtered.length-1); render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ sel = Math.max(sel-1, 0); render(); e.preventDefault(); }
    else if (e.key === 'Enter'){ if (filtered[sel]) filtered[sel].run(); e.preventDefault(); }
    else if (e.key === 'Escape'){ closeAllOverlays(); }
  });
  $('#cmdk-overlay').addEventListener('click', e => { if (e.target.id === 'cmdk-overlay') closeAllOverlays(); });
  render();
  setTimeout(() => input.focus(), 60);
}

/* ---------------------------------------------------------------------------
   36. THEME
   --------------------------------------------------------------------------- */
function applyTheme(){
  const t = S.settings.theme || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'light' ? '#f7f7fb' : '#0a0a0f');
}
function applyAccent(){
  const a = S.settings.accent || '#6366f1';
  document.documentElement.style.setProperty('--primary', a);
  document.documentElement.style.setProperty('--primary-2', a);
}
function toggleTheme(){
  const s = Store.settings();
  s.theme = (s.theme === 'dark') ? 'light' : 'dark';
  Store.setSettings(s);
  S.settings = s;
  applyTheme();
  if (S.cm) S.cm.setOption('theme', s.theme === 'light' ? 'default' : 'material-darker');
  toast('info','Tema diganti', s.theme === 'light' ? 'Mode terang' : 'Mode gelap');
}

/* ---------------------------------------------------------------------------
   37. GLOBAL KEYBOARD SHORTCUTS
   --------------------------------------------------------------------------- */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  const tag = (e.target.tagName || '').toLowerCase();
  const inInput = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  const cmFocused = S.cm && S.cm.hasFocus && S.cm.hasFocus();

  if (mod && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    openCommandPalette();
    return;
  }
  if (mod && e.key.toLowerCase() === 's'){
    if (window.__edSave){ e.preventDefault(); window.__edSave(); }
    return;
  }
  if (mod && e.key.toLowerCase() === 'p'){
    if (!cmFocused){ e.preventDefault(); openSearch(); }
    return;
  }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'p'){
    e.preventDefault();
    openCommandPalette();
    return;
  }
  if (e.key === 'Escape'){
    if (S.route.name !== 'landing' && S.route.name !== 'login' && S.route.name !== 'register'){
      const root = $('#overlay-root');
      if (root.innerHTML){ closeAllOverlays(); }
    }
  }
  // Ctrl+/ toggle comment in editor
  if (mod && e.key === '/' && cmFocused){
    e.preventDefault();
    S.cm.execCommand('toggleComment');
  }
});

/* ---------------------------------------------------------------------------
   38. INIT
   --------------------------------------------------------------------------- */
function init(){
  seedIfNeeded();
  applyTheme();
  applyAccent();
  Auth.restore();

  // Pastikan S.settings sinkron
  S.settings = Store.settings();

  if (!location.hash) location.hash = S.user ? '#/dashboard' : '#/';
  router();

  // Handle editor route — buka editor setelah render
  window.addEventListener('hashchange', () => {
    // Jika route adalah editor spesifik
  });
}

// Ekstensi router: tangani #/editor/{repoId}/{branch}/{path}
const _origRouter = router;
router = function(){
  const parts = parseHash();
  if (parts[0] === 'editor' && parts[1] && parts[2] && parts[3]){
    const repo = getRepo(parts[1]);
    if (!repo || !canAccess(repo)){ navigate('/repos'); return; }
    S.currentRepo = repo;
    S.route = { name:'editor', params:{ repoId: parts[1] } };
    renderApp();
    setTimeout(() => openEditor(parts[1], decodeURIComponent(parts[2]), decodeURIComponent(parts[3])), 30);
    return;
  }
  if (parts[0] === 'editor' && parts[1]){
    const repo = getRepo(parts[1]);
    if (repo && canAccess(repo)){
      const files = repoFiles(parts[1], repo.defaultBranch);
      if (files.length){
        navigate(`/editor/${parts[1]}/${encodeURIComponent(repo.defaultBranch)}/${encodeURIComponent(files[0].path)}`);
        return;
      }
    }
  }
  if (parts[0] === 'editor' && !parts[1]){
    const repos = myRepos();
    if (repos.length){
      const r0 = repos[0];
      const files = repoFiles(r0.id, r0.defaultBranch);
      if (files.length){
        navigate(`/editor/${r0.id}/${encodeURIComponent(r0.defaultBranch)}/${encodeURIComponent(files[0].path)}`);
        return;
      }
    }
  }
  return _origRouter();
};

// Override: bindRepo 'code' tab juga harus membuka editor saat file diklik (href sudah menangani)

init();

// Refresh icons secara periodik untuk konten dinamis
const iconObserver = new MutationObserver(debounce(() => refreshIcons(), 80));
iconObserver.observe(document.body, { childList:true, subtree:true });

})();
</script>
