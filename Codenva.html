<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>NEV CODE — Code. Build. Deploy.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#0a0a0f; --bg-2:#0e0e15;
  --fg:#e7e7ef; --fg-2:#b9b9c9;
  --card:#12121a; --card-2:#181822; --card-3:#1e1e2a;
  --border:#24242f; --border-2:#2f2f3d;
  --muted:#8b8b9c;
  --primary:#6366f1; --primary-2:#818cf8; --primary-fg:#ffffff;
  --accent:#22d3ee;
  --success:#22c55e; --warning:#f59e0b; --danger:#ef4444; --info:#38bdf8;
  --radius:12px; --radius-lg:16px; --radius-sm:8px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  --sidebar-w:260px; --sidebar-w-collapsed:68px;
  --header-h:56px; --bottomnav-h:60px;
}
[data-theme="light"]{
  --bg:#f7f7fb; --bg-2:#ffffff;
  --fg:#14141c; --fg-2:#42424f;
  --card:#ffffff; --card-2:#f3f3f8; --card-3:#eaeaf2;
  --border:#e2e2ec; --border-2:#d3d3e0;
  --muted:#6b6b7b;
  --primary:#4f46e5; --primary-2:#6366f1; --primary-fg:#ffffff;
  --accent:#0891b2;
  --success:#15803d; --warning:#b45309; --danger:#dc2626; --info:#0284c7;
  --shadow:0 10px 30px -14px rgba(20,20,40,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--fg);
  font-size:15px; line-height:1.5;
  overflow-x:hidden;
  min-height:100dvh;
  transition:background .25s ease,color .25s ease;
}
body.no-scroll{overflow:hidden}
code,pre,.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
img{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.25}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
::selection{background:var(--primary);color:#fff}

/* Scrollbars */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:40px;padding:0 16px;border-radius:10px;
  background:var(--card-2);border:1px solid var(--border);
  font-size:14px;font-weight:500;color:var(--fg);
  transition:background .15s ease,border-color .15s ease,transform .1s ease,opacity .15s;
  white-space:nowrap;user-select:none;
}
.btn:hover{background:var(--card-3);border-color:var(--border-2)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn-primary:hover{background:var(--primary-2);border-color:var(--primary-2)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--card-2)}
.btn-sm{min-height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-lg{min-height:48px;padding:0 22px;font-size:15px;border-radius:12px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}

.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;min-width:40px;border-radius:10px;
  color:var(--fg-2);transition:background .15s,color .15s,transform .1s;
}
.icon-btn:hover{background:var(--card-2);color:var(--fg)}
.icon-btn:active{transform:scale(.92)}
.icon-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.input,.select,.textarea{
  width:100%;min-height:44px;padding:10px 14px;
  background:var(--bg-2);border:1px solid var(--border);
  border-radius:10px;font-size:15px;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent);
}
.textarea{min-height:96px;resize:vertical;padding:12px 14px;line-height:1.55}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
label.field{display:block;margin-bottom:14px}
label.field > .lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--fg-2);margin-bottom:6px}
label.field > .lbl svg{width:14px;height:14px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}

.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px;
}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  border:1px solid var(--border-2);background:var(--card-2);color:var(--fg-2);
  white-space:nowrap;line-height:1.7;
}
.badge svg{width:12px;height:12px}
.badge-primary{background:color-mix(in srgb,var(--primary) 18%,transparent);border-color:color-mix(in srgb,var(--primary) 40%,transparent);color:var(--primary-2)}
.badge-success{background:color-mix(in srgb,var(--success) 15%,transparent);border-color:color-mix(in srgb,var(--success) 35%,transparent);color:var(--success)}
.badge-warning{background:color-mix(in srgb,var(--warning) 15%,transparent);border-color:color-mix(in srgb,var(--warning) 35%,transparent);color:var(--warning)}
.badge-danger{background:color-mix(in srgb,var(--danger) 15%,transparent);border-color:color-mix(in srgb,var(--danger) 35%,transparent);color:var(--danger)}
.badge-muted{background:var(--card-2);color:var(--muted)}

.divider{height:1px;background:var(--border);margin:14px 0;border:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}

/* ============================================================
   AUTH / LANDING
   ============================================================ */
.landing{min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
.nav-public{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;height:60px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.03em}
.logo-mark{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 4px 14px -4px color-mix(in srgb,var(--primary) 70%,transparent);
}
.logo-mark svg{width:17px;height:17px}
.nav-public .links{display:none;gap:4px;margin-left:18px}
.nav-public .links a{padding:8px 12px;border-radius:8px;font-size:14px;color:var(--fg-2);font-weight:500}
.nav-public .links a:hover{background:var(--card-2);color:var(--fg)}
.nav-actions{margin-left:auto;display:flex;align-items:center;gap:6px}

.hero{
  position:relative;padding:48px 16px 56px;
  display:flex;flex-direction:column;gap:34px;
  max-width:1180px;margin:0 auto;width:100%;
}
.hero-bg{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  background:
    radial-gradient(650px 340px at 15% -5%, color-mix(in srgb,var(--primary) 22%,transparent), transparent 70%),
    radial-gradient(560px 320px at 92% 12%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 70%);
}
.hero-grid-lines{
  position:absolute;inset:0;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:44px 44px;opacity:.28;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 20%,transparent 78%);
}
.hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;gap:26px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
  padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--card-2);border:1px solid var(--border-2);color:var(--fg-2);
}
.eyebrow svg{width:13px;height:13px;color:var(--primary-2)}
.hero h1{
  font-size:clamp(34px,9vw,60px);font-weight:700;letter-spacing:-.04em;line-height:1.05;
}
.grad-text{
  background:linear-gradient(120deg,var(--primary-2),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .sub{font-size:clamp(15px,3.6vw,18px);color:var(--fg-2);max-width:560px;line-height:1.6}
.hero-cta{display:flex;flex-direction:column;gap:10px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.hero-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.hero-stat b{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em}
.hero-stat span{font-size:11.5px;color:var(--muted)}

.terminal-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
  font-family:'JetBrains Mono',monospace;font-size:12.5px;
}
.terminal-bar{
  display:flex;align-items:center;gap:8px;padding:9px 12px;
  background:var(--card-2);border-bottom:1px solid var(--border);
}
.dot{width:10px;height:10px;border-radius:50%;background:var(--border-2)}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.terminal-bar .t{margin-left:6px;font-size:11.5px;color:var(--muted);font-family:'Inter',sans-serif}
.terminal-body{padding:14px;min-height:190px;line-height:1.75;overflow-x:auto}
.terminal-body .ln{white-space:pre}
.tk-p{color:var(--primary-2)}
.tk-g{color:var(--success)}
.tk-a{color:var(--accent)}
.tk-m{color:var(--muted)}
.tk-w{color:var(--warning)}
.cursor-blink::after{content:'▍';color:var(--accent);animation:blink 1.05s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.section{padding:56px 16px;max-width:1180px;margin:0 auto;width:100%}
.section-head{text-align:center;margin-bottom:28px}
.section-head h2{font-size:clamp(23px,5.4vw,34px);letter-spacing:-.03em;margin-bottom:8px}
.section-head p{color:var(--muted);font-size:14.5px;max-width:520px;margin:0 auto}
.feature-grid{display:grid;gap:12px}
.feature{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px;
  transition:border-color .2s,transform .2s;
}
.feature:hover{border-color:var(--border-2);transform:translateY(-2px)}
.feature .fi{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--primary) 14%,transparent);
  color:var(--primary-2);margin-bottom:12px;
}
.feature .fi svg{width:19px;height:19px}
.feature h3{font-size:15.5px;margin-bottom:6px}
.feature p{font-size:13.5px;color:var(--muted);line-height:1.6}

.cta-band{
  margin:0 16px 56px;max-width:1180px;
  border-radius:20px;padding:34px 20px;text-align:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 20%,var(--card)),var(--card));
  border:1px solid var(--border-2);
}
.cta-band h2{font-size:clamp(22px,5.4vw,30px);margin-bottom:8px}
.cta-band p{color:var(--fg-2);font-size:14.5px;margin-bottom:20px}
.footer{
  border-top:1px solid var(--border);padding:26px 16px 40px;
  display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;
  font-size:13px;color:var(--muted);
}
.footer .fl{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}

/* Auth */
.auth-wrap{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;gap:20px;
  background:
    radial-gradient(600px 340px at 50% -10%, color-mix(in srgb,var(--primary) 18%,transparent), transparent 70%);
}
.auth-card{
  width:100%;max-width:410px;background:var(--card);
  border:1px solid var(--border);border-radius:18px;padding:24px 20px;
  box-shadow:var(--shadow);
}
.auth-card h2{font-size:22px;margin-bottom:6px}
.auth-card .lead{color:var(--muted);font-size:13.5px;margin-bottom:20px}
.auth-switch{text-align:center;font-size:13.5px;color:var(--muted);margin-top:16px}
.auth-switch a{color:var(--primary-2);font-weight:600}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:flex;min-height:100dvh;width:100%}

/* Sidebar (desktop) */
.sidebar{
  display:none;
  flex-direction:column;width:var(--sidebar-w);flex-shrink:0;
  background:var(--bg-2);border-right:1px solid var(--border);
  position:sticky;top:0;height:100dvh;
  transition:width .22s ease;
  z-index:50;
}
.sidebar .side-head{
  display:flex;align-items:center;gap:8px;height:var(--header-h);
  padding:0 14px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.sidebar .side-head .logo-txt{transition:opacity .16s}
.side-nav{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.side-link{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:9px;font-size:14px;font-weight:500;
  color:var(--fg-2);transition:background .14s,color .14s;position:relative;
  min-height:40px;
}
.side-link:hover{background:var(--card-2);color:var(--fg)}
.side-link.active{background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary-2)}
.side-link.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--primary);
}
.side-link svg{width:18px;height:18px;flex-shrink:0}
.side-link .txt{transition:opacity .16s;white-space:nowrap}
.side-sep{height:1px;background:var(--border);margin:8px 10px}
.side-foot{padding:10px;border-top:1px solid var(--border);flex-shrink:0}
.side-user{
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;
  transition:background .14s;min-height:48px;
}
.side-user:hover{background:var(--card-2)}
.avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--accent));
}
.avatar.lg{width:64px;height:64px;font-size:24px}
.avatar.sm{width:24px;height:24px;font-size:10px}

/* Collapsed sidebar */
.sidebar.collapsed{width:var(--sidebar-w-collapsed)}
.sidebar.collapsed .logo-txt,
.sidebar.collapsed .side-link .txt,
.sidebar.collapsed .side-user .uinfo{opacity:0;width:0;overflow:hidden}
.sidebar.collapsed .side-link{justify-content:center;padding:9px}
.sidebar.collapsed .side-user{justify-content:center}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 8px)}
.main-inner{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:14px}

/* Mobile top bar */
.topbar{
  position:sticky;top:0;z-index:45;
  display:flex;align-items:center;gap:4px;
  height:var(--header-h);padding:0 6px 0 4px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.topbar .tb-title{font-size:14.5px;font-weight:600;letter-spacing:-.02em}
.topbar .spacer{flex:1}
.tb-actions{display:flex;align-items:center;gap:0}

/* Bottom nav */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;align-items:stretch;
  height:calc(var(--bottomnav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg-2) 94%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);
  min-height:44px;position:relative;transition:color .15s;
}
.bn-item svg{width:20px;height:20px}
.bn-item.active{color:var(--primary-2)}
.bn-item.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2.5px;border-radius:0 0 3px 3px;background:var(--primary);
}
.bn-item:active{transform:scale(.94)}

/* ============================================================
   PAGE PARTS
   ============================================================ */
.page-head{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.page-head h1{font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.page-head h1 svg{width:21px;height:21px;color:var(--primary-2)}
.page-head .sub{color:var(--muted);font-size:13.5px}

.stat-grid{display:grid;grid-template-columns:1fr;gap:10px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;display:flex;align-items:center;gap:13px;
  transition:border-color .18s,transform .18s;
}
.stat-card:hover{border-color:var(--border-2)}
.stat-card .si{
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--primary) 13%,transparent);color:var(--primary-2);
}
.stat-card .si svg{width:20px;height:20px}
.stat-card .sv{font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.stat-card .sl{font-size:12px;color:var(--muted)}
.si.g{background:color-mix(in srgb,var(--success) 13%,transparent);color:var(--success)}
.si.w{background:color-mix(in srgb,var(--warning) 13%,transparent);color:var(--warning)}
.si.a{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}

.list-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);transition:border-color .15s,background .15s;
  min-height:60px;
}
.list-item:hover{border-color:var(--border-2);background:var(--card-2)}
.list-item .li-icon{
  width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;
  background:var(--card-2);color:var(--muted);
}
.list-item .li-icon svg{width:17px;height:17px}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.list-item .li-sub{font-size:12px;color:var(--muted);margin-top:1px}

/* Tabs */
.tabs{
  display:flex;gap:2px;overflow-x:auto;
  border-bottom:1px solid var(--border);
  margin-bottom:16px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 13px;font-size:13.5px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap;
  transition:color .15s,border-color .15s;min-height:44px;
}
.tab svg{width:15px;height:15px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--primary)}
.tab .cnt{
  font-size:11px;padding:1px 6px;border-radius:999px;
  background:var(--card-2);color:var(--muted);font-weight:600;
}

/* File explorer */
.file-row{
  display:flex;align-items:center;gap:11px;
  padding:11px 12px;border-radius:9px;min-height:46px;
  transition:background .13s;cursor:pointer;position:relative;
}
.file-row:hover{background:var(--card-2)}
.file-row .ficon{flex-shrink:0;color:var(--muted);display:grid;place-items:center;width:18px}
.file-row .ficon svg{width:17px;height:17px}
.file-row .fname{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row.folder .ficon{color:var(--primary-2)}
.file-row .more{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  color:var(--muted);flex-shrink:0;opacity:1;
}
.file-row .more:hover{background:var(--card-3);color:var(--fg)}

/* Editor */
.editor-shell{
  position:fixed;inset:0;z-index:80;background:var(--bg);
  display:flex;flex-direction:column;
}
.editor-head{
  display:flex;align-items:center;gap:6px;height:52px;padding:0 6px;
  border-bottom:1px solid var(--border);background:var(--bg-2);flex-shrink:0;
}
.editor-tabs{
  display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;
  scrollbar-width:none;-ms-overflow-style:none;height:100%;align-items:center;
}
.editor-tabs::-webkit-scrollbar{display:none}
.etab{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 10px;border-radius:8px;font-size:12.5px;
  background:var(--card-2);border:1px solid var(--border);
  white-space:nowrap;flex-shrink:0;
}
.etab.active{background:var(--card-3);border-color:var(--border-2);color:var(--fg)}
.etab .et-x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.etab .et-x:hover{background:var(--danger);color:#fff}
.editor-toolbar{
  display:flex;align-items:center;gap:2px;overflow-x:auto;
  padding:6px 8px;border-bottom:1px solid var(--border);
  background:var(--bg-2);flex-shrink:0;
  scrollbar-width:none;-ms-overflow-style:none;
  padding-bottom:calc(6px + env(safe-area-inset-bottom)*0);
}
.editor-toolbar::-webkit-scrollbar{display:none}
.tool-btn{
  display:inline-flex;align-items:center;gap:6px;
  min-height:36px;padding:0 11px;border-radius:8px;
  font-size:12.5px;font-weight:500;color:var(--fg-2);white-space:nowrap;
  transition:background .14s,color .14s;
}
.tool-btn:hover{background:var(--card-2);color:var(--fg)}
.tool-btn:active{transform:scale(.95)}
.tool-btn svg{width:16px;height:16px}
.tool-btn.primary{background:var(--primary);color:#fff}
.tool-btn.primary:hover{background:var(--primary-2)}
.editor-area{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--bg-2)}
.CodeMirror{
  flex:1;height:auto!important;font-family:'JetBrains Mono',monospace!important;
  font-size:13px;line-height:1.6;background:transparent!important;
}
.CodeMirror-gutters{background:var(--bg-2)!important;border-right:1px solid var(--border)!important}
.CodeMirror-linenumber{color:var(--muted)!important}
.editor-status{
  display:flex;align-items:center;gap:12px;
  padding:6px 12px;font-size:11.5px;color:var(--muted);
  border-top:1px solid var(--border);background:var(--bg-2);flex-shrink:0;
  overflow-x:auto;white-space:nowrap;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
  scrollbar-width:none;
}
.editor-status::-webkit-scrollbar{display:none}
.editor-status .st{display:inline-flex;align-items:center;gap:5px}
.editor-status svg{width:13px;height:13px}

/* Preview */
.preview-shell{
  position:fixed;inset:0;z-index:85;background:var(--bg);
  display:flex;flex-direction:column;
}
.preview-bar{
  display:flex;align-items:center;gap:4px;padding:6px 8px;
  border-bottom:1px solid var(--border);background:var(--bg-2);flex-shrink:0;
  overflow-x:auto;scrollbar-width:none;
}
.preview-bar::-webkit-scrollbar{display:none}
.preview-frame-wrap{flex:1;overflow:auto;padding:10px;display:flex;justify-content:center;background:var(--card-2)}
.preview-frame{
  width:100%;height:100%;background:#fff;border:0;border-radius:8px;
  box-shadow:var(--shadow);transition:width .25s ease;
}
.preview-frame.tablet{width:768px;max-width:100%}
.preview-frame.mobile{width:390px;max-width:100%}

/* Terminal */
.term-shell{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  height:min(72dvh,560px);
  background:var(--bg-2);border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;
  box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);
  animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.term-head{
  display:flex;align-items:center;gap:6px;padding:8px 10px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.term-head .th-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.term-head .th-title svg{width:15px;height:15px;color:var(--success)}
.term-body{
  flex:1;overflow:auto;padding:12px;
  font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.65;
  white-space:pre;
}
.term-line{display:block}
.term-input-row{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-top:1px solid var(--border);flex-shrink:0;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
}
.term-input-row .ps{color:var(--success);font-family:'JetBrains Mono',monospace;font-size:13px;flex-shrink:0}
.term-input{
  flex:1;background:transparent;border:0;outline:none;
  font-family:'JetBrains Mono',monospace;font-size:13px;min-width:0;
}

/* Bottom sheet & Modal */
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .16s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:560px;max-height:88dvh;
  background:var(--card);border:1px solid var(--border);border-bottom:0;
  border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;
  animation:slideUp .24s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet-drag{width:38px;height:4px;border-radius:999px;background:var(--border-2);margin:10px auto 4px;flex-shrink:0}
.sheet-head{
  display:flex;align-items:center;gap:10px;padding:8px 14px 12px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.sheet-head h3{font-size:15.5px;flex:1;display:flex;align-items:center;gap:8px}
.sheet-head h3 svg{width:17px;height:17px;color:var(--primary-2)}
.sheet-body{overflow-y:auto;padding:14px;flex:1;min-height:0}
.sheet-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.sheet-foot .btn{flex:1}

.menu-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 12px;border-radius:10px;min-height:48px;
  font-size:14px;font-weight:500;transition:background .13s;width:100%;text-align:left;
}
.menu-item:hover{background:var(--card-2)}
.menu-item svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.menu-item.danger{color:var(--danger)}
.menu-item.danger svg{color:var(--danger)}

/* Drawer */
.drawer-overlay{
  position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.55);
  animation:fadeIn .16s ease;
}
.drawer{
  position:fixed;top:0;left:0;bottom:0;z-index:96;
  width:min(86vw,320px);background:var(--bg-2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  animation:slideRight .22s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes slideRight{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.drawer-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.drawer-nav{flex:1;overflow-y:auto;padding:10px}

/* Toasts */
.toast-wrap{
  position:fixed;left:0;right:0;bottom:calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 12px);
  z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 14px;
  pointer-events:none;
}
@media (min-width:1024px){.toast-wrap{bottom:20px;left:auto;right:20px;align-items:flex-end;padding:0}}
.toast{
  display:flex;align-items:flex-start;gap:10px;
  width:100%;max-width:380px;
  background:var(--card);border:1px solid var(--border-2);
  border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);
  animation:toastIn .22s cubic-bezier(.2,.9,.3,1);
  pointer-events:auto;font-size:13.5px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.toast svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.toast.success svg{color:var(--success)}
.toast.error svg{color:var(--danger)}
.toast.info svg{color:var(--info)}
.toast.warning svg{color:var(--warning)}
.toast .tmsg{flex:1;min-width:0}

/* Command palette */
.cmdk{
  position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.62);
  backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;
  padding:56px 12px 12px;animation:fadeIn .14s;
}
.cmdk-box{
  width:100%;max-width:600px;background:var(--card);
  border:1px solid var(--border-2);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  max-height:70dvh;
}
.cmdk-input-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.cmdk-input-row svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.cmdk-input{flex:1;background:transparent;border:0;outline:none;font-size:15px;min-width:0}
.cmdk-list{overflow-y:auto;padding:6px;flex:1}
.cmdk-item{
  display:flex;align-items:center;gap:11px;padding:10px 11px;
  border-radius:9px;font-size:14px;width:100%;text-align:left;min-height:44px;
}
.cmdk-item:hover,.cmdk-item.sel{background:var(--card-2)}
.cmdk-item svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}
.cmdk-item .kbd{margin-left:auto;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* Diff */
.diff{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.diff-line{display:flex;padding:0 10px;white-space:pre;overflow-x:auto}
.diff-line.add{background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--success)}
.diff-line.del{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.diff-line.ctx{color:var(--muted)}
.diff-line .dn{width:34px;flex-shrink:0;color:var(--muted);user-select:none}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.kanban::-webkit-scrollbar{height:6px}
.kcol{
  flex:0 0 82vw;max-width:320px;scroll-snap-align:start;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;display:flex;flex-direction:column;gap:9px;min-height:180px;
}
.kcol-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--border)}
.kcol-head .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--card-2);padding:1px 7px;border-radius:999px}
.kcard{
  background:var(--card-2);border:1px solid var(--border);border-radius:9px;
  padding:11px;font-size:13px;cursor:grab;
}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.45}
.kcol.dragover{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 7%,transparent)}

/* Search overlay */
.search-overlay{
  position:fixed;inset:0;z-index:120;background:var(--bg);
  display:flex;flex-direction:column;animation:fadeIn .15s;
}
.search-head{
  display:flex;align-items:center;gap:8px;padding:10px 10px;
  border-bottom:1px solid var(--border);flex-shrink:0;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.search-body{flex:1;overflow-y:auto;padding:12px}

/* Notification panel */
.notif-panel{
  position:fixed;inset:0;z-index:120;background:var(--bg);
  display:flex;flex-direction:column;animation:fadeIn .15s;
}
.notif-head{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--border);flex-shrink:0;
  padding-top:calc(10px + env(safe-area-inset-top));
}
.notif-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.notif-item{
  display:flex;gap:11px;padding:13px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);
}
.notif-item.unread{border-color:color-mix(in srgb,var(--primary) 45%,transparent);background:color-mix(in srgb,var(--primary) 6%,var(--card))}
.notif-item .ni{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--card-2);flex-shrink:0;color:var(--primary-2)}
.notif-item .ni svg{width:16px;height:16px}

/* Empty & skeleton */
.empty{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:44px 20px;text-align:center;
}
.empty .ei{
  width:60px;height:60px;border-radius:16px;display:grid;place-items:center;
  background:var(--card-2);border:1px solid var(--border);color:var(--muted);
}
.empty .ei svg{width:27px;height:27px}
.empty h3{font-size:16px}
.empty p{color:var(--muted);font-size:13.5px;max-width:320px}
.skel{background:linear-gradient(90deg,var(--card-2) 25%,var(--card-3) 50%,var(--card-2) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinner{
  width:18px;height:18px;border:2px solid var(--border-2);
  border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Contribution graph */
.contrib{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px}
.contrib .cweek{display:flex;flex-direction:column;gap:3px}
.contrib .cday{width:11px;height:11px;border-radius:2.5px;background:var(--card-3)}
.contrib .cday.l1{background:color-mix(in srgb,var(--success) 30%,var(--card-3))}
.contrib .cday.l2{background:color-mix(in srgb,var(--success) 55%,var(--card-3))}
.contrib .cday.l3{background:color-mix(in srgb,var(--success) 78%,var(--card-3))}
.contrib .cday.l4{background:var(--success)}

/* Tooltip */
[data-tip]{position:relative}
@media (hover:hover){
  [data-tip]:hover::after{
    content:attr(data-tip);
    position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
    background:var(--card-3);color:var(--fg);border:1px solid var(--border-2);
    padding:5px 9px;border-radius:7px;font-size:11.5px;white-space:nowrap;
    z-index:300;pointer-events:none;font-weight:500;
  }
}

/* Utilities */
.hide{display:none!important}
.mt-1{margin-top:6px}.mt-2{margin-top:12px}.mt-3{margin-top:18px}
.mb-1{margin-bottom:6px}.mb-2{margin-bottom:12px}.mb-3{margin-bottom:18px}
.text-c{text-align:center}
.rel{position:relative}
.gap-sm{gap:6px}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Markdown render */
.md{font-size:14px;line-height:1.75;color:var(--fg-2);word-wrap:break-word}
.md h1,.md h2,.md h3{color:var(--fg);margin:18px 0 8px;letter-spacing:-.02em}
.md h1{font-size:22px;border-bottom:1px solid var(--border);padding-bottom:7px}
.md h2{font-size:18px;border-bottom:1px solid var(--border);padding-bottom:6px}
.md h3{font-size:15.5px}
.md p{margin:10px 0}
.md ul,.md ol{margin:10px 0;padding-left:22px;list-style:revert}
.md li{margin:4px 0}
.md code{background:var(--card-2);padding:2px 6px;border-radius:5px;font-size:12.5px;font-family:'JetBrains Mono',monospace;border:1px solid var(--border)}
.md pre{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:13px;overflow-x:auto;margin:12px 0}
.md pre code{background:none;border:0;padding:0}
.md a{color:var(--primary-2);text-decoration:underline;text-underline-offset:2px}
.md blockquote{border-left:3px solid var(--border-2);padding-left:13px;color:var(--muted);margin:12px 0}
.md table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:7px 10px;text-align:left}
.md th{background:var(--card-2);font-weight:600;color:var(--fg)}
.md img{max-width:100%;border-radius:8px;margin:8px 0}
.md hr{border:0;border-top:1px solid var(--border);margin:18px 0}

/* ============================================================
   RESPONSIVE — TABLET
   ============================================================ */
@media (min-width:600px){
  .main-inner{padding:18px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .feature-grid{grid-template-columns:repeat(2,1fr)}
  .hero-cta{flex-direction:row}
  .hero-cta .btn{flex:0 0 auto}
  .kcol{flex-basis:300px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .form-grid .full{grid-column:1/-1}
}
@media (min-width:768px){
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .feature-grid{grid-template-columns:repeat(3,1fr)}
  .hero{padding:70px 24px 80px;flex-direction:row;align-items:center;gap:44px}
  .hero-inner{flex:1.05}
  .hero-visual{flex:1;min-width:0}
  .section{padding:76px 24px}
  .overlay{align-items:center;padding:24px}
  .sheet{border-radius:18px;border-bottom:1px solid var(--border);max-height:82dvh;animation:modalIn .2s cubic-bezier(.2,.9,.3,1)}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .toast-wrap{padding:0}
  .page-head{flex-direction:row;align-items:flex-end;justify-content:space-between}
  .page-head h1{font-size:26px}
}
@media (min-width:1024px){
  .sidebar{display:flex}
  .bottom-nav{display:none}
  .topbar{display:none}
  .main{padding-bottom:0}
  .main-inner{padding:24px 28px}
  .nav-public{padding:0 24px;height:64px}
  .nav-public .links{display:flex}
  .toast-wrap{bottom:22px;right:22px;left:auto;align-items:flex-end;padding:0;max-width:400px}
  .kcol{flex:1 1 0;max-width:none}
  .kanban{overflow-x:visible}
  .term-shell{left:auto;right:20px;bottom:20px;width:min(640px,60vw);border-radius:14px;border:1px solid var(--border-2)}
  .editor-shell{position:fixed;inset:0}
  .mobile-only{display:none!important}
}
@media (max-width:1023px){
  .desktop-only{display:none!important}
}
@media (min-width:1280px){
  .main-inner{padding:26px 36px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<!-- ROOT -->
<div id="root"></div>

<!-- TOASTS -->
<div class="toast-wrap" id="toasts"></div>

<!-- SHEET / MODAL -->
<div id="sheet-root"></div>

<!-- DRAWER -->
<div id="drawer-root"></div>

<!-- SEARCH / NOTIF / TERMINAL / EDITOR / PREVIEW / CMDK -->
<div id="overlay-root"></div>

const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const debounce = (fn, ms=250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };

function timeAgo(ts){
  const d = Math.floor((now()-ts)/1000);
  if (d < 60) return 'baru saja';
  if (d < 3600) return Math.floor(d/60)+' menit lalu';
  if (d < 86400) return Math.floor(d/3600)+' jam lalu';
  if (d < 2592000) return Math.floor(d/86400)+' hari lalu';
  return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDate(ts){
  return new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

// Hash sederhana — DEMO ONLY. Bukan pengganti bcrypt/PBKDF2 di produksi.
function demoHash(str){
  let h = 5381;
  for (let i=0;i<str.length;i++) h = ((h<<5)+h) ^ str.charCodeAt(i);
  return 'demo$' + (h>>>0).toString(16) + '$' + str.length;
}

};

function icon(name, size){
  const s = size ? ` style="width:${size}px;height:${size}px"` : '';

}
function refreshIcons(){
  if (window.lucide) {

  }
}

/* ---------------------------------------------------------------------------
   4. TOAST
   --------------------------------------------------------------------------- */
const TOAST_ICON = { success:'circle-check', error:'circle-x', warning:'triangle-alert', info:'info' };
function toast(type, title, msg){
  const wrap = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role','status');
  el.innerHTML = `${icon(TOAST_ICON[type]||'info')}
    <div class="tmsg">
      <div style="font-weight:600">${esc(title)}</div>
      ${msg ? `<div class="small muted" style="margin-top:2px">${esc(msg)}</div>` : ''}
    </div>`;
  wrap.appendChild(el);
  refreshIcons();
  setTimeout(() => {
    el.style.transition = 'opacity .2s, transform .2s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 220);
  }, 3400);
}

/* ---------------------------------------------------------------------------

let sheetEscHandler = null;
function openSheet({ title, iconName, body, footer, onMount }){
  closeSheet();
  const root = $('#sheet-root');
  root.innerHTML = `
    <div class="overlay" id="sheet-overlay">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheet-drag"></div>
        <div class="sheet-head">
          <h3>${iconName ? icon(iconName) : ''}<span>${esc(title)}</span></h3>
          <button class="icon-btn" data-close-sheet aria-label="Tutup">${icon('x')}</button>
        </div>
        <div class="sheet-body">${body}</div>
        ${footer ? `<div class="sheet-foot">${footer}</div>` : ''}
      </div>
    </div>`;
  refreshIcons();

  const ov = $('#sheet-overlay');
  ov.addEventListener('click', e => { if (e.target === ov) closeSheet(); });
  $$('[data-close-sheet]', root).forEach(b => b.addEventListener('click', closeSheet));
  sheetEscHandler = e => { if (e.key === 'Escape') closeSheet(); };
  document.addEventListener('keydown', sheetEscHandler);
  document.body.classList.add('no-scroll');
  if (onMount) onMount(root);
  return root;
}
function closeSheet(){
  const root = $('#sheet-root');
  if (!root.innerHTML) return;
  root.innerHTML = '';
  document.body.classList.remove('no-scroll');
  if (sheetEscHandler) { document.removeEventListener('keydown', sheetEscHandler); sheetEscHandler = null; }
}
function confirmSheet({ title='Konfirmasi', message, confirmText='Lanjutkan', danger=false, onConfirm }){
  openSheet({
    title,
    iconName: danger ? 'triangle-alert' : 'circle-help',
    body: `<p class="small" style="color:var(--fg-2);line-height:1.65">${esc(message)}</p>`,
    footer: `
      <button class="btn" data-close-sheet>Batal</button>

    onMount(root){
      $('#confirm-yes', root).addEventListener('click', () => { closeSheet(); onConfirm && onConfirm(); });
    }
  });
}

/* ---------------------------------------------------------------------------

const Auth = {
  register(username, email, password){
    username = username.trim(); email = email.trim().toLowerCase();
    if (username.length < 3) return { ok:false, msg:'Username minimal 3 karakter.' };
    if (!/^[a-z0-9_-]+$/i.test(username)) return { ok:false, msg:'Username hanya boleh huruf, angka, - dan _.' };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { ok:false, msg:'Format email tidak valid.' };
    if (password.length < 6) return { ok:false, msg:'Password minimal 6 karakter.' };
    const users = Store.users();
    if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) return { ok:false, msg:'Username sudah dipakai.' };
    if (users.some(u => u.email === email)) return { ok:false, msg:'Email sudah terdaftar.' };
    const user = {
      id: uid('u'), username, email,
      passwordHash: demoHash(password),
      bio: '', createdAt: now(), avatarColor: pickColor(username)
    };
    users.push(user);
    Store.setUsers(users);
    Store.setSession(user.id);
    S.user = user;
    pushNotif(user.id, 'user-plus', 'Selamat datang di NEV CODE', 'Mulai dengan membuat repository pertama Anda.', '#/repos');
    return { ok:true, user };
  },
  login(identifier, password){
    identifier = identifier.trim().toLowerCase();
    const users = Store.users();
    const u = users.find(x => x.email === identifier || x.username.toLowerCase() === identifier);
    if (!u) return { ok:false, msg:'Akun tidak ditemukan.' };
    if (u.passwordHash !== demoHash(password)) return { ok:false, msg:'Password salah.' };
    Store.setSession(u.id);
    S.user = u;
    return { ok:true, user:u };
  },
  logout(){
    Store.setSession(null);
    S.user = null;
    S.currentRepo = null;
    location.hash = '#/';
    toast('info','Logout berhasil','Sesi Anda telah diakhiri.');
  },
  restore(){
    const id = Store.session();
    if (!id) return null;
    const u = Store.users().find(x => x.id === id);
    if (u) S.user = u;
    return u || null;
  }
};
function pickColor(seed){
  const palette = ['#6366f1','#22d3ee','#f59e0b','#ec4899','#22c55e','#8b5cf6','#ef4444','#0ea5e9'];
  let h = 0; for (let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}
function avatarHTML(user, size=''){
  if (!user) return `<div class="avatar ${size}">?</div>`;
  const initial = user.username.slice(0,1).toUpperCase();
  return `<div class="avatar ${size}" style="background:linear-gradient(135deg,${user.avatarColor||'#6366f1'},var(--accent))">${esc(initial)}</div>`;
}

function getRepo(id){ return Store.repos().find(r => r.id === id); }

}
function repoBranches(repoId){ return Store.branches().filter(b => b.repoId === repoId); }

function repoPRs(repoId){ return Store.prs().filter(p => p.repoId === repoId).sort((a,b)=>b.createdAt-a.createdAt); }
function repoDeployments(repoId){ return Store.deployments().filter(d => d.repoId === repoId).sort((a,b)=>b.createdAt-a.createdAt); }
function myRepos(){ return S.user ? Store.repos().filter(r => r.ownerId === S.user.id).sort((a,b)=>b.updatedAt-a.updatedAt) : []; }
function canAccess(repo){
  if (!repo) return false;
  if (repo.visibility === 'public') return true;
  return S.user && repo.ownerId === S.user.id;

function canEdit(repo){ return S.user && repo && repo.ownerId === S.user.id; }

const EXT_LANG = {
  html:'htmlmixed', htm:'htmlmixed', vue:'htmlmixed',
  css:'css', scss:'css', less:'css',
  js:'javascript', mjs:'javascript', cjs:'javascript', jsx:'javascript',
  ts:'text/typescript', tsx:'text/typescript',
  json:'application/json',
  md:'markdown', markdown:'markdown',
  py:'python',
  php:'php',
  java:'text/x-java',
  c:'text/x-csrc', h:'text/x-csrc',
  cpp:'text/x-c++src', cc:'text/x-c++src', cxx:'text/x-c++src', hpp:'text/x-c++src',
  txt:'null', yml:'null', yaml:'null', xml:'xml', svg:'xml'
};
function langOf(path){ const ext = (path.split('.').pop()||'').toLowerCase(); return EXT_LANG[ext] || 'null'; }
function fileIcon(path, isFolder){
  if (isFolder) return 'folder';
  const ext = (path.split('.').pop()||'').toLowerCase();
  if (['html','htm'].includes(ext)) return 'file-code-2';
  if (['css','scss','less'].includes(ext)) return 'palette';
  if (['js','mjs','cjs','jsx'].includes(ext)) return 'file-json';
  if (['ts','tsx'].includes(ext)) return 'file-type';
  if (ext === 'json') return 'braces';
  if (['md','markdown'].includes(ext)) return 'file-text';
  if (ext === 'py') return 'file-code';
  if (['png','jpg','jpeg','gif','svg','webp'].includes(ext)) return 'image';
  return 'file';
}

/* ---------------------------------------------------------------------------
   9. MARKDOWN (subset renderer, aman dari XSS karena escape dulu)
   --------------------------------------------------------------------------- */
function renderMarkdown(src){
  let s = esc(src || '');
  // fenced code
  const blocks = [];
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push(`<pre><code class="lang-${esc(lang)}">${code}</code></pre>`);
    return `\u0000CB${blocks.length-1}\u0000`;
  });
  // tables
  s = s.replace(/^\|(.+)\|\n\|[\s:|-]+\|\n((?:\|.*\|\n?)*)/gm, (m, head, rows) => {
    const th = head.split('|').map(x=>x.trim()).filter(Boolean).map(x=>`<th>${x}</th>`).join('');
    const tr = rows.trim().split('\n').map(r =>
      '<tr>' + r.split('|').map(x=>x.trim()).filter((_,i,a)=>i>0&&i<a.length-1).map(x=>`<td>${x}</td>`).join('') + '</tr>'
    ).join('');
    return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
  });
  s = s.replace(/^###### (.*)$/gm,'<h6>$1</h6>')
       .replace(/^##### (.*)$/gm,'<h5>$1</h5>')
       .replace(/^#### (.*)$/gm,'<h4>$1</h4>')
       .replace(/^### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^## (.*)$/gm,'<h2>$1</h2>')
       .replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s = s.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');
  s = s.replace(/^(-{3,}|\*{3,})$/gm,'<hr>');
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  // lists
  s = s.replace(/(?:^|\n)((?:[-*+] .*(?:\n|$))+)/g, (m, block) => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[-*+] /,'')}</li>`).join('');
    return `\n<ul>${items}</ul>`;
  });
  s = s.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g, (m, block) => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /,'')}</li>`).join('');
    return `\n<ol>${items}</ol>`;
  });
  // paragraphs
  s = s.split(/\n{2,}/).map(p => {
    if (/^\s*<(h\d|ul|ol|pre|blockquote|table|hr|img|p)/.test(p.trim())) return p;
    if (p.includes('\u0000CB')) return p;
    return p.trim() ? `<p>${p.replace(/\n/g,'<br>')}</p>` : '';
  }).join('\n');
  s = s.replace(/\u0000CB(\d+)\u0000/g, (m,i) => blocks[+i]);
  return s;
}

/* ---------------------------------------------------------------------------
   11. ROUTER
   --------------------------------------------------------------------------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
  return parts;
}
function navigate(path){ location.hash = path.startsWith('#') ? path : '#/' + path.replace(/^\//,''); }

function router(){
  const parts = parseHash();
  const isAuth = !!S.user;
  const head = parts[0] || '';

  // Public routes
  if (!isAuth){
    if (head === 'login')    { S.route = { name:'login' };    return renderPublic(); }
    if (head === 'register') { S.route = { name:'register' }; return renderPublic(); }
    S.route = { name:'landing' };
    return renderPublic();
  }

  // Authenticated routes
  if (!head || head === 'dashboard'){ S.route = { name:'dashboard' }; return renderApp(); }
  if (head === 'repos' || head === 'repositories'){ S.route = { name:'repos' }; return renderApp(); }
  if (head === 'repo'){
    const id = parts[1];
    const tab = parts[2] || 'code';
    const repo = getRepo(id);
    if (!repo || !canAccess(repo)){
      S.route = { name:'notfound' };
      return renderApp('Repository tidak ditemukan', 'Repository tidak ada atau Anda tidak memiliki akses.');
    }
    S.currentRepo = repo;
    S.currentBranch = parts[3] && repoBranches(repo.id).some(b=>b.name===parts[3]) ? parts[3] : repo.defaultBranch;
    S.route = { name:'repo', params:{ id, tab } };
    return renderApp();
  }
  if (head === 'projects'){ S.route = { name:'projects' }; return renderApp(); }
  if (head === 'deployments'){ S.route = { name:'deployments' }; return renderApp(); }
  if (head === 'activity'){ S.route = { name:'activity' }; return renderApp(); }
  if (head === 'issues'){ S.route = { name:'issues' }; return renderApp(); }
  if (head === 'pulls'){ S.route = { name:'pulls' }; return renderApp(); }
  if (head === 'settings'){ S.route = { name:'settings' }; return renderApp(); }
  if (head === 'profile'){ S.route = { name:'profile' }; return renderApp(); }
  if (head === 'help'){ S.route = { name:'help' }; return renderApp(); }
  if (head === 'explorer'){ S.route = { name:'explorer' }; return renderApp(); }
  if (head === 'editor'){
    const repoId = parts[1];
    const repo = getRepo(repoId);
    if (!repo || !canAccess(repo)){ navigate('/repos'); return; }
    S.currentRepo = repo;
    S.route = { name:'editor' };
    return renderApp();
  }
  S.route = { name:'notfound' };
  renderApp();
}

window.addEventListener('hashchange', () => {
  closeSheet(); closeDrawer(); closeAllOverlays();
  router();
  window.scrollTo(0,0);
});

function bindPublic(){
  const tt = $('#theme-toggle');
  if (tt) tt.addEventListener('click', toggleTheme);

  const form = $('#auth-form');
  if (form){
    form.addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(form);
      const err = $('#auth-error');
      err.classList.add('hide');
      const isLogin = S.route.name === 'login';
      const res = isLogin
        ? Auth.login(fd.get('identifier') || '', fd.get('password') || '')
        : Auth.register(fd.get('username') || '', fd.get('email') || '', fd.get('password') || '');
      if (!res.ok){
        err.classList.remove('hide');
        $('span', err).textContent = res.msg;
        refreshIcons();
        return;
      }
      toast('success', isLogin ? 'Berhasil masuk' : 'Akun dibuat', 'Selamat datang, ' + res.user.username + '.');
      navigate('/dashboard');
      router();
    });
  }
  const forgot = $('#forgot');
  if (forgot) forgot.addEventListener('click', () => {
    openSheet({
      title:'Reset password', iconName:'key-round',
      body:`<p class="small muted mb-2">Masukkan email terdaftar. Di lingkungan demo ini, tautan reset tidak benar-benar dikirim.</p>

function buildFileTree(files){
  const root = { name:'', children:{}, files:[] };
  files.forEach(f => {
    const parts = f.path.split('/');
    let node = root;
    parts.slice(0,-1).forEach(p => {
      if (!node.children[p]) node.children[p] = { name:p, children:{}, files:[] };
      node = node.children[p];
    });
    node.files.push(f);
  });
  return root;
}
function renderTree(node, repoId, depth=0, prefix=''){
  let html = '';
  const folders = Object.keys(node.children).sort();
  folders.forEach(name => {
    const child = node.children[name];
    const path = prefix ? prefix + '/' + name : name;
    html += `
      <div class="file-row folder" data-folder="${esc(path)}" style="padding-left:${12+depth*14}px">
        <span class="ficon">${icon('chevron-right')}</span>
        ${icon('folder')}
        <span class="fname">${esc(name)}</span>
        <button class="more" data-more="${esc(path)}" data-more-type="folder" aria-label="Menu folder">${icon('ellipsis-vertical')}</button>
      </div>
      <div class="folder-children hide" data-children="${esc(path)}">${renderTree(child, repoId, depth+1, path)}</div>`;
  });
  node.files.sort((a,b)=>a.path.localeCompare(b.path)).forEach(f => {
    const name = f.path.split('/').pop();
    html += `
      <a class="file-row" href="#/editor/${repoId}/${encodeURIComponent(S.currentBranch)}/${encodeURIComponent(f.path)}">
        <span class="ficon">${icon(fileIcon(f.path))}</span>
        <span class="fname">${esc(name)}</span>
        <button class="more" data-more="${esc(f.path)}" data-more-type="file" aria-label="Menu file">${icon('ellipsis-vertical')}</button>
      </a>`;
  });
  return html;
}

    href:`#/repo/${p.repoId}/pulls`, badge:p.state

/* ---------------------------------------------------------------------------
   24. VIEW: PROFILE
   --------------------------------------------------------------------------- */
function viewProfile(){
  const repos = myRepos();
  const projects = Store.projects().filter(p => p.userId === S.user.id);
  const commits = Store.commits().filter(c => c.authorId === S.user.id);
  const joined = new Date(S.user.createdAt).toLocaleDateString('id-ID',{month:'long',year:'numeric'});

  // Contribution graph: 26 minggu x 7 hari
  const weeks = 26;
  const dayMs = 86400000;
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today.getTime() - (weeks*7-1)*dayMs);
  const counts = {};
  commits.forEach(c => {
    const d = new Date(c.date); d.setHours(0,0,0,0);
    const k = d.getTime();
    counts[k] = (counts[k]||0) + 1;
  });
  let contribHTML = '';
  for (let w=0; w<weeks; w++){
    contribHTML += '<div class="cweek">';
    for (let d=0; d<7; d++){
      const t = start.getTime() + (w*7+d)*dayMs;
      const c = counts[t] || 0;
      const lvl = c===0?0:c<2?1:c<4?2:c<7?3:4;
      contribHTML += `<span class="cday ${lvl?'l'+lvl:''}" data-tip="${c} commit"></span>`;
    }
    contribHTML += '</div>';
  }

  return `
  <div class="page-head">
    <div><h1>${icon('user')} Profil</h1><p class="sub">Bergabung ${joined}</p></div>
    <a class="btn" href="#/settings">${icon('settings')} Edit profil</a>
  </div>

  <section class="card mb-3">
    <div class="row" style="gap:16px;align-items:flex-start;flex-wrap:wrap">
      ${avatarHTML(S.user,'lg')}
      <div class="grow" style="min-width:180px">
        <h2 style="font-size:20px">${esc(S.user.username)}</h2>
        <p class="small muted" style="margin-top:4px">${esc(S.user.bio || 'Belum ada bio.')}</p>
        <div class="row wrap gap-sm mt-2">
          <span class="badge">${icon('mail')} ${esc(S.user.email)}</span>
          <span class="badge">${icon('git-branch')} ${repos.length} repos</span>
          <span class="badge">${icon('kanban')} ${projects.length} projects</span>
        </div>
      </div>
    </div>
  </section>

  <section class="card mb-3">
    <h3 style="font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:14px">${icon('activity')} Kontribusi</h3>
    <div class="contrib">${contribHTML}</div>

/* --- Repo detail --- */
function bindRepo(){
  const r = S.currentRepo;
  if (!r) return;
  const tab = S.route.params.tab;

  // Star / Fork / Share
  const star = $('#repo-star');
  if (star) star.addEventListener('click', () => {
    const repos = Store.repos();
    const rr = repos.find(x => x.id === r.id);
    const key = 'starred_' + r.id;
    const starred = DB.get(key, false);
    if (starred){ rr.stars = Math.max(0, (rr.stars||0) - 1); DB.set(key, false); toast('info','Bintang dihapus',''); }
    else { rr.stars = (rr.stars||0) + 1; DB.set(key, true); toast('success','Ditambahkan ke bintang',''); }
    Store.setRepos(repos);
    S.currentRepo = rr;
    router();
  });
  const fork = $('#repo-fork');
  if (fork) fork.addEventListener('click', () => {
    const repos = Store.repos();
    const rr = repos.find(x => x.id === r.id);
    rr.forks = (rr.forks||0) + 1;
    Store.setRepos(repos);
    toast('success','Fork berhasil','Salinan repository dibuat (demo).');
    router();
  });
  const share = $('#repo-share');
  if (share) share.addEventListener('click', () => {
    const url = location.origin + location.pathname + '#/repo/' + r.id;
    openSheet({
      title:'Bagikan repository', iconName:'share-2',
      body:`<p class="small muted mb-2">Salin tautan berikut untuk membagikan repository.</p>
        <div class="row gap-sm">
          <input class="input mono" id="share-url" value="${esc(url)}" readonly style="font-size:12.5px">
        </div>`,
      footer:`<button class="btn btn-primary btn-block" id="copy-share">${icon('copy')} Salin tautan</button>`,
      onMount(root){
        $('#copy-share', root).addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(url); toast('success','Tersalin','Tautan disalin ke clipboard.'); }
          catch { toast('warning','Gagal menyalin','Salin manual dari kolom input.'); }
          closeSheet();
        });
      }
    });
  });

  // Code tab
  if (tab === 'code' || !tab){
    const tree = $('#file-tree');
    if (tree) tree.innerHTML = renderTree(buildFileTree(repoFiles(r.id, S.currentBranch)), r.id);
    refreshIcons();

    $$('#file-tree .folder').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.closest('[data-more]')) return;
        const path = el.dataset.folder;
        const kids = $(`[data-children="${CSS.escape(path)}"]`);
        if (kids){
          kids.classList.toggle('hide');
          const chev = el.querySelector('.ficon svg, .ficon i');
          el.querySelector('.ficon').innerHTML = icon(kids.classList.contains('hide') ? 'chevron-right' : 'chevron-down');
          refreshIcons();
        }
      });
    });

    $$('[data-more]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const path = btn.dataset.more;
        const type = btn.dataset.moreType;
        openFileMenu(path, type);
      });
    });

    const bs = $('#branch-switch');
    if (bs) bs.addEventListener('click', openBranchSheet);

    const nf = $('#new-file-btn');
    if (nf) nf.addEventListener('click', () => openNewFileSheet());

    const up = $('#upload-btn');
    if (up) up.addEventListener('click', () => openUploadSheet());

    const dl = $('#download-repo');
    if (dl) dl.addEventListener('click', downloadRepoZip);

    const pv = $('#preview-btn');
    if (pv) pv.addEventListener('click', () => openPreview(r.id));
  }

  if (tab === 'issues'){
    const b = $('#new-issue-btn');
    if (b) b.addEventListener('click', () => openNewIssueSheet(r.id));
    $$('[data-issue]').forEach(el => {
      el.addEventListener('click', () => openIssueDetail(el.dataset.issue));
    });
  }

  if (tab === 'pulls'){
    const b = $('#new-pr-btn');
    if (b) b.addEventListener('click', () => openNewPRSheet(r.id));
    $$('[data-pr-merge]').forEach(b => b.addEventListener('click', () => mergePR(b.dataset.prMerge)));
    $$('[data-pr-close]').forEach(b => b.addEventListener('click', () => closePR(b.dataset.prClose)));
    $$('[data-pr-review]').forEach(b => b.addEventListener('click', () => openPRDetail(b.dataset.prReview, 'review')));
    $$('[data-pr-comment]').forEach(b => b.addEventListener('click', () => openPRDetail(b.dataset.prComment, 'comment')));
  }

  if (tab === 'actions'){
    const cb = $('#commit-btn');
    if (cb) cb.addEventListener('click', () => openCommitSheet(r.id));
  }

  if (tab === 'settings'){
    const save = $('#save-repo-settings');
    if (save) save.addEventListener('click', () => {
      const repos = Store.repos();
      const rr = repos.find(x => x.id === r.id);
      const newName = $('#set-name').value.trim();
      if (!newName) return toast('error','Nama kosong','Nama repository wajib diisi.');
      if (repos.some(x => x.id !== r.id && x.ownerId === S.user.id && x.name.toLowerCase() === newName.toLowerCase()))
        return toast('error','Nama duplikat','Anda sudah punya repository dengan nama itu.');
      rr.name = newName;
      rr.description = $('#set-desc').value.trim();
      rr.visibility = $('#set-vis').value;
      rr.updatedAt = now();
      Store.setRepos(repos);
      S.currentRepo = rr;
      toast('success','Tersimpan','Pengaturan repository diperbarui.');
      router();
    });
    const del = $('#delete-repo');
    if (del) del.addEventListener('click', () => {
      confirmSheet({
        title:'Hapus repository', danger:true, confirmText:'Hapus permanen',
        message:`Repository "${r.name}" beserta seluruh file, commit, issue, dan PR akan dihapus. Tindakan ini tidak dapat dibatalkan.`,
        onConfirm(){
          Store.setRepos(Store.repos().filter(x => x.id !== r.id));
          Store.setFiles(Store.files().filter(f => f.repoId !== r.id));
          Store.setCommits(Store.commits().filter(c => c.repoId !== r.id));
          Store.setBranches(Store.branches().filter(b => b.repoId !== r.id));
          Store.setIssues(Store.issues().filter(i => i.repoId !== r.id));
          Store.setPrs(Store.prs().filter(p => p.repoId !== r.id));
          Store.setDeployments(Store.deployments().filter(d => d.repoId !== r.id));
          toast('success','Repository dihapus','');
          navigate('/repos');
        }
      });
    });
  }
}

/* --- Projects --- */
function bindProjects(){
  const b = $('#new-project-btn');
  if (b) b.addEventListener('click', openNewProjectSheet);
  bindKanban();
  $$('[data-project-menu]').forEach(btn => btn.addEventListener('click', () => openProjectMenu(btn.dataset.projectMenu)));
}
function bindKanban(){
  $$('.kcard').forEach(card => {
    card.addEventListener('dragstart', e => {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.task);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  $$('.kcol').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('dragover');
      const taskId = e.dataTransfer.getData('text/plain');
      const projectId = col.closest('.kanban').dataset.project;
      const toCol = col.dataset.col;
      moveTask(projectId, taskId, toCol);
    });
  });
  $$('[data-add-task]').forEach(btn => btn.addEventListener('click', () => openAddTaskSheet(btn.dataset.project, btn.dataset.addTask)));
  $$('[data-task-menu]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    openTaskMenu(btn.dataset.project, btn.dataset.taskMenu);
  }));
}
function moveTask(projectId, taskId, toCol){
  const projects = Store.projects();
  const p = projects.find(x => x.id === projectId);
  if (!p) return;
  let task = null;
  ['todo','progress','done'].forEach(c => {
    const idx = p.columns[c].findIndex(t => t.id === taskId);
    if (idx >= 0){ task = p.columns[c].splice(idx,1)[0]; }
  });
  if (!task) return;
  p.columns[toCol].push(task);
  Store.setProjects(projects);
  router();
}

/* --- Settings --- */
function bindSettings(){
  const acc = $('#save-account');
  if (acc) acc.addEventListener('click', () => {
    const users = Store.users();
    const u = users.find(x => x.id === S.user.id);
    const uname = $('#acc-username').value.trim();
    const email = $('#acc-email').value.trim().toLowerCase();
    if (uname.length < 3) return toast('error','Username tidak valid','Minimal 3 karakter.');
    if (!/^[a-z0-9_-]+$/i.test(uname)) return toast('error','Username tidak valid','Hanya huruf, angka, - dan _.');
    if (users.some(x => x.id !== u.id && x.username.toLowerCase() === uname.toLowerCase()))
      return toast('error','Username sudah dipakai','');
    if (users.some(x => x.id !== u.id && x.email === email))
      return toast('error','Email sudah terdaftar','');
    u.username = uname; u.email = email; u.bio = $('#acc-bio').value.trim();
    Store.setUsers(users);
    S.user = u;
    toast('success','Tersimpan','Profil diperbarui.');
    router();
  });

  const th = $('#set-theme');
  if (th) th.addEventListener('change', () => {
    const s = Store.settings(); s.theme = th.value; Store.setSettings(s); S.settings = s;
    applyTheme();
  });

  $$('[data-accent]').forEach(b => b.addEventListener('click', () => {
    const s = Store.settings(); s.accent = b.dataset.accent; Store.setSettings(s); S.settings = s;
    applyAccent();
    router();
  }));

  const fs = $('#set-font');
  if (fs) fs.addEventListener('change', () => {
    const s = Store.settings(); s.editorFont = Math.max(10, Math.min(24, +fs.value||13)); Store.setSettings(s); S.settings = s;
    toast('info','Preferensi editor','Ukuran font: ' + s.editorFont + 'px');
  });
  const ts = $('#set-tab');
  if (ts) ts.addEventListener('change', () => {
    const s = Store.settings(); s.tabSize = +ts.value; Store.setSettings(s); S.settings = s;
  });
  const ww = $('#set-wrap');
  if (ww) ww.addEventListener('change', () => {
    const s = Store.settings(); s.wordWrap = ww.checked; Store.setSettings(s); S.settings = s;
  });
  const mm = $('#set-minimap');
  if (mm) mm.addEventListener('change', () => {
    const s = Store.settings(); s.minimap = mm.checked; Store.setSettings(s); S.settings = s;
  });

  const ex = $('#export-data');
  if (ex) ex.addEventListener('click', () => {
    const dump = {};
    ['users','repos','files','commits','branches','issues','prs','projects','deployments','notifs','settings'].forEach(k => dump[k] = DB.get(k, []));
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nev-code-export.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('success','Export selesai','File JSON telah diunduh.');
  });

  const rs = $('#reset-data');
  if (rs) rs.addEventListener('click', () => {
    confirmSheet({
      title:'Reset semua data', danger:true, confirmText:'Reset',
      message:'Seluruh akun, repository, file, dan pengaturan akan dihapus permanen dari browser ini.',
      onConfirm(){
        Object.keys(localStorage).filter(k => k.startsWith('nev_')).forEach(k => localStorage.removeItem(k));
        location.hash = '#/';
        location.reload();
      }
    });
  });
}

/* ---------------------------------------------------------------------------
   28. SHEETS: CREATE REPO / NEW FILE / UPLOAD / COMMIT / ISSUE / PR / DEPLOY

function openCreateRepoSheet(){
  const templates = [
    ['empty','Kosong','Repository tanpa file awal.'],
    ['web','Web dasar','index.html, style.css, script.js, README.md'],
    ['readme','Dengan README','Hanya README.md berisi deskripsi.']
  ];
  openSheet({
    title:'Repository Baru', iconName:'folder-git-2',
    body:`
      <label class="field">
        <span class="lbl">${icon('folder-git-2')} Nama repository</span>
        <input class="input" id="cr-name" placeholder="my-project" autocomplete="off">
        <div class="hint">Gunakan huruf kecil, angka, - atau _.</div>
      </label>
      <label class="field">
        <span class="lbl">${icon('file-text')} Deskripsi</span>
        <textarea class="textarea" id="cr-desc" placeholder="Deskripsi singkat (opsional)"></textarea>
      </label>
      <label class="field">
        <span class="lbl">${icon('eye')} Visibilitas</span>
        <select class="select" id="cr-vis">
          <option value="public">Public — siapa saja dapat melihat</option>
          <option value="private">Private — hanya Anda</option>
        </select>
      </label>
      <label class="field">
        <span class="lbl">${icon('layout-template')} Template awal</span>
        <select class="select" id="cr-template">
          ${templates.map(([v,l,d]) => `<option value="${v}">${l} — ${d}</option>`).join('')}
        </select>
      </label>
      <label class="field" style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="cr-readme" checked>
        <span class="lbl" style="margin:0">${icon('book-open')} Tambahkan README.md</span>
      </label>
      <label class="field" style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="cr-gitignore">
        <span class="lbl" style="margin:0">${icon('file-x')} Tambahkan .gitignore</span>
      </label>
      <label class="field">
        <span class="lbl">${icon('scale')} License</span>
        <select class="select" id="cr-license">
          <option value="">Tidak ada</option>
          <option value="MIT">MIT</option>
          <option value="Apache-2.0">Apache 2.0</option>
          <option value="GPL-3.0">GPL 3.0</option>
        </select>
      </label>`,
    footer:`<button class="btn btn-block btn-primary btn-lg" id="cr-submit">${icon('plus')} Create Repository</button>`,
    onMount(root){
      $('#cr-submit', root).addEventListener('click', () => {
        const name = $('#cr-name', root).value.trim();
        const desc = $('#cr-desc', root).value.trim();
        const vis  = $('#cr-vis', root).value;
        const tpl  = $('#cr-template', root).value;
        const addReadme = $('#cr-readme', root).checked;
        const addGitignore = $('#cr-gitignore', root).checked;
        const license = $('#cr-license', root).value;

        if (!name) return toast('error','Nama kosong','Masukkan nama repository.');
        if (!/^[a-zA-Z0-9._-]+$/.test(name)) return toast('error','Nama tidak valid','Hanya huruf, angka, titik, -, _.');
        const repos = Store.repos();
        if (repos.some(r => r.ownerId === S.user.id && r.name.toLowerCase() === name.toLowerCase()))
          return toast('error','Nama duplikat','Anda sudah punya repository dengan nama itu.');

        const repoId = uid('r');
        const newRepo = {
          id: repoId, ownerId: S.user.id, name, description: desc,
          visibility: vis, defaultBranch: 'main',
          createdAt: now(), updatedAt: now(),
          stars: 0, forks: 0,
          language: tpl === 'web' ? 'HTML' : 'Markdown'
        };
        repos.push(newRepo);
        Store.setRepos(repos);

        Store.setBranches([...Store.branches(), { id: uid('b'), repoId, name:'main', createdAt: now() }]);

        const files = Store.files();
        const mkFile = (path, content) => files.push({
          id: uid('f'), repoId, branch:'main', path, content, updatedAt: now()
        });

        if (tpl === 'web'){
          mkFile('index.html', `<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${name}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Halo dari ${name}</h1>
  <p>Edit file ini di NEV CODE.</p>
  <script src="script.js"><\/script>
</body>
</html>`);
          mkFile('style.css', `body{\n  font-family:system-ui,sans-serif;\n  padding:24px;\n  background:#0a0a0f;\n  color:#e7e7ef;\n}`);
          mkFile('script.js', `console.log('${name} siap.');`);
        }

        if (addReadme){
          mkFile('README.md', `# ${name}\n\n${desc || 'Deskripsi project belum ditambahkan.'}\n\n## Menjalankan\n\nBuka \`index.html\` atau gunakan fitur Preview di NEV CODE.\n`);
        }
        if (addGitignore){
          mkFile('.gitignore', `node_modules/\n.DS_Store\n*.log\n.env\n`);
        }
        if (license){
          mkFile('LICENSE', `${license} License\n\nCopyright (c) ${new Date().getFullYear()} ${S.user.username}\n\nPermission is hereby granted, free of charge...\n`);
        }

        Store.setFiles(files);

        Store.setCommits([...Store.commits(), {
          id: uid('c').slice(0,7), repoId, branch:'main',
          message:'Initial commit', authorId: S.user.id, date: now(),
          additions: files.filter(f=>f.repoId===repoId).reduce((a,f)=>a+(f.content||'').split('\n').length,0),
          deletions: 0,
          files: files.filter(f=>f.repoId===repoId).map(f=>f.path)
        }]);

        pushNotif(S.user.id, 'folder-git-2', 'Repository dibuat', `${name} siap digunakan.`, `#/repo/${repoId}`);

        closeSheet();

function openFileMenu(path, type){
  const r = S.currentRepo;
  if (!r) return;
  const file = repoFiles(r.id, S.currentBranch).find(f => f.path === path);
  const isFolder = type === 'folder';
  openSheet({
    title: path.split('/').pop(), iconName: isFolder ? 'folder' : fileIcon(path),
    body:`
      ${!isFolder ? `<a class="menu-item" href="#/editor/${r.id}/${encodeURIComponent(S.currentBranch)}/${encodeURIComponent(path)}">${icon('file-code-2')} Open</a>` : ''}
