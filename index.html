<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MyBro - Pro Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0b1120;
            --panel: #1e293b;
            --panel-hover: #334155;
            --accent: #10b981;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { 
            padding: 20px; background: rgba(11, 17, 32, 0.9); backdrop-filter: blur(15px); 
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--text); }
        .logo span { color: var(--accent); }

        /* CONTENT */
        .content { flex: 1; overflow-y: auto; padding: 15px 15px 90px; }
        .view { display: none; }
        .view.active { display: block; }

        /* CARD STYLE (KHAS WA) */
        .card { 
            background: transparent; border-radius: 12px; padding: 12px; margin-bottom: 2px; 
            display: flex; align-items: center; gap: 15px; position: relative; cursor: pointer;
        }
        .card:active { background: var(--panel); }
        .pfp-wrap { position: relative; width: 55px; height: 55px; flex-shrink: 0; }
        .pfp { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #334155; }
        .card-info { flex: 1; min-width: 0; border-bottom: 0.5px solid var(--border); padding-bottom: 10px; }
        .card-row { display: flex; justify-content: space-between; align-items: center; }
        .card-name { font-weight: 600; font-size: 1.05rem; }
        .card-msg { color: var(--text-dim); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
        .card-time { font-size: 0.75rem; color: var(--accent); }
        
        /* PIN & ARCHIVE BADGE */
        .pin-icon { color: var(--text-dim); font-size: 0.8rem; transform: rotate(45deg); margin-left: 5px; }

        /* DROPDOWN MENU (TITIK 3) */
        .more-btn { padding: 10px; color: var(--text-dim); cursor: pointer; }
        .dropdown {
            position: absolute; right: 10px; top: 40px; background: var(--panel); 
            border: 1px solid var(--border); border-radius: 12px; width: 180px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; z-index: 200;
        }
        .dropdown.active { display: block; }
        .drop-item { padding: 12px 16px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
        .drop-item:active { background: var(--panel-hover); }
        .drop-item.del { color: var(--danger); }

        /* PROFIL ALA WA */
        .prof-header { text-align: center; padding: 30px 0; }
        .prof-pfp-big { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 3px solid var(--accent); }
        .prof-section { background: var(--panel); margin-bottom: 10px; padding: 15px; border-radius: 12px; }
        .prof-label { color: var(--accent); font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; }
        .prof-val { font-size: 1rem; color: white; display: flex; justify-content: space-between; }

        /* CHAT PANEL */
        #chatPanel { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
        .chat-head { padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }

        /* STORY VIEWER */
        #storyViewer { position: fixed; inset: 0; background: black; z-index: 3000; display: none; flex-direction: column; }
        .story-top { position: absolute; top: 0; width: 100%; padding: 15px; display: flex; align-items: center; gap: 10px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
        .view-count { position: absolute; bottom: 30px; width: 100%; text-align: center; color: white; font-size: 0.9rem; }

        /* NAV */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--bg); border-top: 1px solid var(--border); display: flex; }
        .nav-link { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-dim); font-size: 0.75rem; }
        .nav-link.active { color: var(--accent); }
        .nav-link i { font-size: 1.4rem; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">My<span>Bro</span></div>
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-search" style="color:var(--text-dim)"></i>
            <div class="more-btn" onclick="toggleMainDrop()"><i class="fas fa-ellipsis-v"></i></div>
            <div class="dropdown" id="mainDrop">
                <div class="drop-item" onclick="showArchived()"><i class="fas fa-archive"></i> Arsip</div>
                <div class="drop-item"><i class="fas fa-user-plus"></i> Grup Baru</div>
                <div class="drop-item" onclick="location.reload()"><i class="fas fa-sync"></i> Setel Ulang</div>
            </div>
        </div>
    </header>

    <div class="content">
        <div id="v-chats" class="view active">
            <div id="chatList">
                </div>
        </div>

        <div id="v-status" class="view">
            <div class="card" onclick="openMyStory()">
                <div class="pfp-wrap">
                    <img id="myStatusPfp" src="https://via.placeholder.com/150" class="pfp" style="border: 2px solid var(--accent)">
                </div>
                <div class="card-info">
                    <div class="card-name">Status Saya</div>
                    <div id="statusTime" class="card-msg">Ketuk untuk melihat status Anda</div>
                </div>
                <i class="fas fa-camera" style="color:var(--accent)" onclick="event.stopPropagation(); document.getElementById('upStat').click()"></i>
                <input type="file" id="upStat" hidden onchange="uploadStory(this)">
            </div>
            <h4 style="margin: 20px 0 10px; color: var(--accent); font-size: 0.8rem;">PEMBARUAN TERKINI</h4>
            <div id="storyList"></div>
        </div>

        <div id="v-profil" class="view">
            <div class="prof-header">
                <div style="position:relative; display:inline-block">
                    <img id="pfpBig" src="https://via.placeholder.com/150" class="prof-pfp-big">
                    <div style="position:absolute; bottom:15px; right:5px; background:var(--accent); width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center;" onclick="document.getElementById('filePfp').click()">
                        <i class="fas fa-camera" style="font-size:0.9rem"></i>
                    </div>
                </div>
                <input type="file" id="filePfp" hidden onchange="updatePfp(this)">
            </div>

            <div class="prof-section">
                <div class="prof-label">Nama</div>
                <div class="prof-val">
                    <span id="dispName">User Bro</span>
                    <i class="fas fa-pen" onclick="editField('name')"></i>
                </div>
                <div style="color:var(--text-dim); font-size:0.75rem; margin-top:8px;">Ini bukan nama pengguna atau PIN Anda. Nama ini akan terlihat oleh kontak MyBro Anda.</div>
            </div>

            <div class="prof-section">
                <div class="prof-label">Info</div>
                <div class="prof-val">
                    <span id="dispBio">Ada di MyBro</span>
                    <i class="fas fa-pen" onclick="editField('bio')"></i>
                </div>
            </div>

            <div class="prof-section">
                <div class="prof-label">ID MyBro</div>
                <div class="prof-val">
                    <span id="dispID" style="color:var(--text-dim)">BRO-0000</span>
                    <i class="fas fa-copy" onclick="copyID()"></i>
                </div>
            </div>
        </div>
    </div>

    <div id="storyViewer">
        <div class="story-top">
            <i class="fas fa-arrow-left" onclick="closeStory()"></i>
            <img id="svPfp" src="" style="width:35px; height:35px; border-radius:50%">
            <div style="flex:1">
                <div id="svName" style="font-weight:600; font-size:0.9rem;">Nama</div>
                <div id="svTime" style="font-size:0.7rem; opacity:0.8">Waktu</div>
            </div>
            <i class="fas fa-trash" id="delStoryBtn" style="display:none; color:var(--danger)" onclick="deleteMyStory()"></i>
        </div>
        <div id="svContent" style="flex:1; display:flex; align-items:center; justify-content:center;">
            </div>
        <div class="view-count" id="svViews"><i class="fas fa-eye"></i> 0</div>
    </div>

    <nav>
        <div class="nav-link active" onclick="switchView('v-chats', this)"><i class="fas fa-comment"></i>Obrolan</div>
        <div class="nav-link" onclick="switchView('v-status', this)"><i class="fas fa-circle-notch"></i>Status</div>
        <div class="nav-link" onclick="switchView('v-profil', this)"><i class="fas fa-user-circle"></i>Profil</div>
    </nav>

    <script>
        // Simulasi Database & State
        let myData = {
            id: "BRO-3270",
            name: "Radit Jebeh",
            bio: "Ada kabar apa pagi ini?",
            pfp: "https://i.pravatar.cc/150?u=me",
            stories: [] // {media, time, views: []}
        };

        let chats = [
            { id: "BRO-8974", name: "User BRO-8974", lastMsg: "Tf gc", time: "09:05", pinned: true, archived: false },
            { id: "BRO-1122", name: "XYZ", lastMsg: "Di zero", time: "09:05", pinned: false, archived: false }
        ];

        // 1. FUNGSI SWITCH VIEW
        function switchView(viewId, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            el.classList.add('active');
        }

        // 2. FUNGSI RENDER CHAT DENGAN FITUR PIN & HAPUS
        function renderChats() {
            const list = document.getElementById('chatList');
            list.innerHTML = "";
            
            // Urutkan: Pinned di atas
            const sortedChats = [...chats].sort((a, b) => b.pinned - a.pinned);

            sortedChats.forEach(c => {
                if(c.archived) return;

                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <div class="pfp-wrap"><img src="https://ui-avatars.com/api/?name=${c.name}&background=random" class="pfp"></div>
                    <div class="card-info">
                        <div class="card-row">
                            <div class="card-name">${c.name} ${c.pinned ? '<i class="fas fa-thumbtack pin-icon"></i>' : ''}</div>
                            <div class="card-time">${c.time}</div>
                        </div>
                        <div class="card-row">
                            <div class="card-msg">${c.lastMsg}</div>
                            <div class="more-btn" onclick="toggleContext(event, '${c.id}')"><i class="fas fa-ellipsis-v"></i></div>
                        </div>
                        <div class="dropdown" id="drop-${c.id}">
                            <div class="drop-item" onclick="togglePin('${c.id}')"><i class="fas fa-thumbtack"></i> ${c.pinned ? 'Lepas Semat' : 'Sematkan'}</div>
                            <div class="drop-item" onclick="archiveChat('${c.id}')"><i class="fas fa-archive"></i> Arsipkan</div>
                            <div class="drop-item del" onclick="deleteChat('${c.id}')"><i class="fas fa-trash"></i> Hapus Obrolan</div>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        // 3. LOGIKA CONTEXT MENU (TITIK 3)
        function toggleContext(e, id) {
            e.stopPropagation();
            const el = document.getElementById('drop-' + id);
            const isActive = el.classList.contains('active');
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
            if(!isActive) el.classList.add('active');
        }

        function toggleMainDrop() {
            document.getElementById('mainDrop').classList.toggle('active');
        }

        // 4. FITUR CHAT (PIN, DELETE, ARCHIVE)
        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            renderChats();
        }

        function togglePin(id) {
            let chat = chats.find(c => c.id === id);
            chat.pinned = !chat.pinned;
            renderChats();
        }

        function archiveChat(id) {
            let chat = chats.find(c => c.id === id);
            chat.archived = true;
            renderChats();
            alert("Chat diarsipkan");
        }

        // 5. FITUR STORY (LIHAT JUMLAH VIEW & HAPUS)
        function uploadStory(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                myData.stories.push({
                    media: e.target.result,
                    time: "Baru saja",
                    views: Math.floor(Math.random() * 10) // Simulasi view
                });
                alert("Status diunggah!");
                document.getElementById('statusTime').innerText = "Baru saja";
            };
            reader.readAsDataURL(file);
        }

        function openMyStory() {
            if(myData.stories.length === 0) {
                document.getElementById('upStat').click();
                return;
            }
            const story = myData.stories[myData.stories.length - 1];
            document.getElementById('svPfp').src = myData.pfp;
            document.getElementById('svName').innerText = "Status Saya";
            document.getElementById('svTime').innerText = story.time;
            document.getElementById('svContent').innerHTML = `<img src="${story.media}" style="max-width:100%; max-height:80dvh">`;
            document.getElementById('svViews').innerHTML = `<i class="fas fa-eye"></i> ${story.views}`;
            document.getElementById('svViews').style.display = "block";
            document.getElementById('delStoryBtn').style.display = "block";
            document.getElementById('storyViewer').style.display = "flex";
        }

        function deleteMyStory() {
            if(confirm("Hapus status ini?")) {
                myData.stories = [];
                closeStory();
                document.getElementById('statusTime').innerText = "Ketuk untuk melihat status Anda";
            }
        }

        function closeStory() {
            document.getElementById('storyViewer').style.display = "none";
        }

        // 6. PROFIL LOGIC
        function updatePfp(input) {
            const file = input.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    myData.pfp = e.target.result;
                    document.getElementById('pfpBig').src = e.target.result;
                    document.getElementById('myStatusPfp').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function editField(field) {
            let val = prompt("Masukkan " + field + " baru:");
            if(val) {
                if(field === 'name') {
                    myData.name = val;
                    document.getElementById('dispName').innerText = val;
                } else {
                    myData.bio = val;
                    document.getElementById('dispBio').innerText = val;
                }
            }
        }

        // Inisialisasi
        window.onclick = () => {
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active'));
        };

        document.getElementById('dispID').innerText = myData.id;
        document.getElementById('dispName').innerText = myData.name;
        document.getElementById('dispBio').innerText = myData.bio;
        renderChats();
    </script>
</body>
</html>
