<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyBro - Fix Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0b0e14;
            --accent: #00e676;
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --panel: #232d36;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }

        /* Sidebar */
        .nav-rail {
            width: 70px; background: #121b22; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px;
        }
        .nav-item {
            width: 50px; height: 50px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer; color: #8696a0; font-size: 1.2rem;
        }
        .nav-item.active { background: rgba(0, 230, 118, 0.15); color: var(--accent); }

        /* Main */
        .content-area { flex: 1; display: flex; flex-direction: column; position: relative; background: #0b141a; }
        header { padding: 15px 20px; background: #121b22; display: flex; justify-content: space-between; align-items: center; }
        
        .view { display: none; flex: 1; padding: 10px; overflow-y: auto; }
        .view.active { display: flex; flex-direction: column; }

        /* List Styling */
        .list-item {
            display: flex; align-items: center; padding: 12px; gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
        }
        .avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; background: #2a3942; border: 2px solid transparent; }
        .has-story { border-color: var(--accent); padding: 2px; }

        /* FAB */
        .fab {
            position: absolute; bottom: 30px; right: 20px; width: 56px; height: 56px;
            background: var(--accent); border-radius: 16px; display: flex;
            align-items: center; justify-content: center; color: #000; font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: none; z-index: 100;
        }

        /* MODAL FIX */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-card { 
            background: var(--panel); width: 85%; max-width: 350px; 
            padding: 25px; border-radius: 20px; position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .close-x {
            position: absolute; top: 15px; right: 15px; font-size: 1.5rem;
            color: #8696a0; cursor: pointer; z-index: 10;
        }

        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #2a3942; background: #111b21; color: white; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Chat Panel */
        #chatPanel {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100dvh;
            background: #0b141a; z-index: 3000; transition: 0.3s ease; display: flex; flex-direction: column;
        }
        #chatPanel.open { right: 0; }
        
        /* SW Viewer */
        #swViewer { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: #000; z-index: 4000; flex-direction: column; 
        }
    </style>
</head>
<body>

    <nav class="nav-rail">
        <div class="nav-item active" onclick="switchView('chats', this)"><i class="fas fa-comment"></i></div>
        <div class="nav-item" onclick="switchView('stories', this)"><i class="fas fa-circle-notch"></i></div>
        <div class="nav-item" onclick="switchView('contacts', this)"><i class="fas fa-users"></i></div>
        <div class="nav-item" onclick="openModal('profileModal')" style="margin-top:auto"><i class="fas fa-cog"></i></div>
    </nav>

    <div class="content-area">
        <header>
            <h2 id="vTitle">Chatting</h2>
            <div id="displayID" style="color:var(--accent); font-size:0.8rem; font-weight:bold">ID: --</div>
        </header>

        <div id="chatsView" class="view active"></div>
        <div id="storiesView" class="view">
            <div class="list-item" onclick="openModal('storyModal')">
                <div class="avatar" style="display:flex;align-items:center;justify-content:center;border:2px dashed #8696a0"><i class="fas fa-camera"></i></div>
                <div style="margin-left:15px"><strong>Status Saya</strong><br><small>Tambah status baru</small></div>
            </div>
            <div id="swList"></div>
        </div>
        <div id="contactsView" class="view"></div>

        <button class="fab" onclick="openModal('addContactModal')"><i class="fas fa-plus"></i></button>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card">
            <i class="fas fa-times close-x" onclick="closeModal()"></i>
            
            <div id="addContactModal" style="display:none">
                <h3>Cari Teman</h3>
                <input type="text" id="targetID" placeholder="Masukkan ID (BRO-xxxx)">
                <button class="btn" onclick="saveContact()">Tambah Kontak</button>
            </div>

            <div id="storyModal" style="display:none">
                <h3>Update Status</h3>
                <input type="file" id="swFile" accept="image/*" onchange="processFile(this, 'sw')">
                <button class="btn" onclick="uploadStory()">Kirim Status</button>
            </div>

            <div id="profileModal" style="display:none">
                <h3>Profil Saya</h3>
                <input type="text" id="pName" placeholder="Nama Tampilan">
                <p style="font-size:0.8rem; color:#8696a0">Pilih Foto:</p>
                <input type="file" id="pFile" accept="image/*" onchange="processFile(this, 'profile')">
                <button class="btn" onclick="saveProfile()">Simpan Profil</button>
            </div>
        </div>
    </div>

    <div id="swViewer">
        <div style="padding:20px; display:flex; align-items:center; gap:15px; background:rgba(0,0,0,0.5)">
            <i class="fas fa-arrow-left" onclick="closeSW()" style="font-size:1.2rem"></i>
            <span id="swNameDisplay">Nama</span>
        </div>
        <img id="swImgFull" style="width:100%; height:80vh; object-fit:contain">
    </div>

    <div id="chatPanel">
        <header style="background:#202c33">
            <div style="display:flex;align-items:center;gap:15px">
                <i class="fas fa-arrow-left" onclick="closeChat()"></i>
                <img id="chatImg" class="avatar" style="width:40px;height:40px">
                <span id="chatNameTitle">Nama</span>
            </div>
        </header>
        <div id="msgArea" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:8px"></div>
        <div style="padding:10px; background:#202c33; display:flex; gap:10px">
            <input type="text" id="mInput" placeholder="Ketik pesan..." style="margin:0">
            <button onclick="sendMsg()" style="background:var(--accent); border:none; width:45px; border-radius:50%; color:#000"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f",
            storageBucket: "mybro-9ba5f.appspot.com",
            messagingSenderId: "820948893264",
            appId: "1:820948893264:web:e58e1a175bc90053335b55"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myID = localStorage.getItem('chat_uid_fix') || "BRO-" + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('chat_uid_fix', myID);
        document.getElementById('displayID').innerText = "ID: " + myID;

        let activeChat = null;
        let base64Temp = "";

        // MODAL LOGIC
        window.openModal = (id) => {
            document.getElementById('modalOverlay').style.display = 'flex';
            ['addContactModal','storyModal','profileModal'].forEach(m => document.getElementById(m).style.display='none');
            document.getElementById(id).style.display = 'block';
            base64Temp = "";
        };
        window.closeModal = () => document.getElementById('modalOverlay').style.display = 'none';

        window.switchView = (v, el) => {
            document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById(v+'View').classList.add('active');
            el.classList.add('active');
            document.getElementById('vTitle').innerText = v.toUpperCase();
        };

        // FILE PROCESSOR
        window.processFile = (input, type) => {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => { base64Temp = e.target.result; alert("Foto siap diupload!"); };
            reader.readAsDataURL(file);
        };

        // FIREBASE LOGIC
        window.saveProfile = () => {
            const name = document.getElementById('pName').value || myID;
            const data = { name, id: myID };
            if(base64Temp) data.photo = base64Temp;
            set(ref(db, `users/${myID}/profile`), data).then(() => { alert("Profil Berhasil!"); closeModal(); });
        };

        window.saveContact = async () => {
            const tid = document.getElementById('targetID').value.trim();
            if(!tid || tid === myID) return alert("ID Salah!");
            const snap = await get(ref(db, `users/${tid}/profile`));
            if(snap.exists()) {
                set(ref(db, `users/${myID}/contacts/${tid}`), { id: tid });
                alert("Kontak Ditambahkan!"); closeModal();
            } else { alert("User tidak ditemukan!"); }
        };

        window.delContact = (id) => { if(confirm("Hapus?")) remove(ref(db, `users/${myID}/contacts/${id}`)); };

        // SYNC DATA
        onValue(ref(db, `users/${myID}/contacts`), (snap) => {
            const ctn = document.getElementById('chatsView');
            const ctn2 = document.getElementById('contactsView');
            ctn.innerHTML = ""; ctn2.innerHTML = "";
            snap.forEach(child => {
                const cid = child.key;
                onValue(ref(db, `users/${cid}/profile`), (pSnap) => {
                    const p = pSnap.val() || { name: cid, photo: 'https://ui-avatars.com/api/?name='+cid };
                    const html = `
                        <div class="list-item">
                            <img src="${p.photo}" class="avatar" onclick="openChat('${cid}','${p.name}','${p.photo}')">
                            <div style="flex:1" onclick="openChat('${cid}','${p.name}','${p.photo}')"><strong>${p.name}</strong><br><small>${cid}</small></div>
                            <i class="fas fa-trash" style="color:red" onclick="delContact('${cid}')"></i>
                        </div>`;
                    ctn.innerHTML += html; ctn2.innerHTML += html;
                });
            });
        });

        window.uploadStory = () => {
            if(!base64Temp) return alert("Pilih foto!");
            push(ref(db, `stories`), { img: base64Temp, owner: myID, time: Date.now() });
            alert("Story Terkirim!"); closeModal();
        };

        onValue(ref(db, `stories`), (snap) => {
            const list = document.getElementById('swList'); list.innerHTML = "";
            snap.forEach(c => {
                const s = c.val();
                if(Date.now() - s.time < 86400000) {
                    list.innerHTML += `
                        <div class="list-item" onclick="viewSW('${s.img}','${s.owner}')">
                            <img src="${s.img}" class="avatar has-story">
                            <div style="margin-left:15px"><strong>${s.owner}</strong><br><small>Baru saja</small></div>
                        </div>`;
                }
            });
        });

        window.viewSW = (img, name) => {
            document.getElementById('swImgFull').src = img;
            document.getElementById('swNameDisplay').innerText = name;
            document.getElementById('swViewer').style.display = 'flex';
        };
        window.closeSW = () => document.getElementById('swViewer').style.display = 'none';

        // CHAT LOGIC
        window.openChat = (id, name, img) => {
            activeChat = id; document.getElementById('chatNameTitle').innerText = name;
            document.getElementById('chatImg').src = img;
            document.getElementById('chatPanel').classList.add('open');
            const cid = [myID, id].sort().join("_");
            onValue(ref(db, `chats/${cid}`), (snap) => {
                const area = document.getElementById('msgArea'); area.innerHTML = "";
                snap.forEach(m => {
                    const d = m.val();
                    const style = d.f === myID ? 'align-self:flex-end; background:#005c4b' : 'align-self:flex-start; background:#202c33';
                    area.innerHTML += `<div style="${style}; padding:8px 12px; border-radius:10px; color:white; max-width:80%">${d.t}</div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        };

        window.closeChat = () => document.getElementById('chatPanel').classList.remove('open');
        window.sendMsg = () => {
            const i = document.getElementById('mInput');
            if(!i.value || !activeChat) return;
            const cid = [myID, activeChat].sort().join("_");
            push(ref(db, `chats/${cid}`), { f: myID, t: i.value });
            i.value = "";
        };
    </script>
</body>
</html>
