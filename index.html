<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SensorVision · Deteksi Gerak & Suhu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f1a;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            width: 100%;
            max-width: 1400px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo i {
            -webkit-text-fill-color: #22d3ee;
            background: none;
        }
        .header-status {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .header-status .indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .header-status .indicator .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.green {
            background: #4ade80;
            box-shadow: 0 0 12px #4ade8066;
        }
        .dot.red {
            background: #f87171;
            box-shadow: 0 0 12px #f8717166;
        }
        .dot.yellow {
            background: #fbbf24;
            box-shadow: 0 0 12px #fbbf2466;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 24px;
            margin-top: 24px;
        }
        .camera-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 20px;
            position: relative;
        }
        .camera-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #060b18;
            border-radius: 20px;
            overflow: hidden;
        }
        .camera-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .camera-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .camera-overlay-info {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .camera-overlay-info .live {
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .camera-overlay-info .live i {
            font-size: 10px;
        }
        .camera-controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .camera-controls button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e8edf5;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .camera-controls button:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .camera-controls button.primary {
            background: #22d3ee;
            color: #060b18;
            border-color: #22d3ee;
        }
        .camera-controls button.primary:hover {
            background: #06b6d4;
            border-color: #06b6d4;
        }
        .camera-controls button.danger {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }
        .camera-controls button.danger:hover {
            background: rgba(248, 113, 113, 0.2);
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 20px 22px;
        }
        .card h4 {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
        }
        .card h4 i {
            color: #22d3ee;
        }
        .sensor-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .sensor-value:last-child {
            border-bottom: none;
        }
        .sensor-value .label {
            color: #94a3b8;
            font-size: 14px;
        }
        .sensor-value .value {
            font-weight: 700;
            font-size: 18px;
        }
        .value.temp {
            color: #fbbf24;
        }
        .value.motion {
            color: #4ade80;
        }
        .value.humidity {
            color: #22d3ee;
        }

        .motion-graph {
            margin-top: 8px;
            height: 60px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }
        .motion-graph .bar {
            flex: 1;
            background: linear-gradient(180deg, #22d3ee, #06b6d4);
            border-radius: 4px 4px 0 0;
            min-height: 4px;
            transition: height 0.3s;
            opacity: 0.7;
        }
        .motion-graph .bar.active {
            opacity: 1;
            background: linear-gradient(180deg, #4ade80, #22d3ee);
        }

        .log-container {
            max-height: 140px;
            overflow-y: auto;
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .log-container::-webkit-scrollbar {
            width: 3px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .log-item .time {
            color: #64748b;
        }
        .log-item .msg {
            color: #e8edf5;
        }
        .log-item .msg.motion {
            color: #4ade80;
        }
        .log-item .msg.temp {
            color: #fbbf24;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 720px) {
            .sidebar {
                grid-template-columns: 1fr;
            }
            .camera-container {
                aspect-ratio: 4/3;
            }
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-status {
                justify-content: space-between;
            }
        }
        @media (max-width: 480px) {
            .camera-controls button {
                flex: 1;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- HEADER -->
        <header>
            <div class="logo"><i class="fas fa-eye"></i> SensorVision</div>
            <div class="header-status">
                <span class="indicator"><span class="dot green" id="statusDot"></span> <span id="statusText">Online</span></span>
                <span class="indicator"><i class="fas fa-clock"></i> <span id="clockDisplay">--:--:--</span></span>
            </div>
        </header>

        <!-- MAIN -->
        <div class="main-grid">
            <!-- KAMERA -->
            <div class="camera-wrapper">
                <div class="camera-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="overlayCanvas"></canvas>
                    <div class="camera-overlay-info">
                        <span class="live"><i class="fas fa-circle"></i> LIVE</span>
                        <span id="resolutionDisplay">--</span>
                    </div>
                </div>
                <div class="camera-controls">
                    <button class="primary" id="btnStart"><i class="fas fa-play"></i> Mulai</button>
                    <button class="danger" id="btnStop"><i class="fas fa-stop"></i> Berhenti</button>
                    <button id="btnSnapshot"><i class="fas fa-camera"></i> Screenshot</button>
                    <button id="btnToggleOverlay"><i class="fas fa-layer-group"></i> Overlay</button>
                </div>
            </div>

            <!-- SIDEBAR -->
            <div class="sidebar">
                <!-- Sensor -->
                <div class="card">
                    <h4><i class="fas fa-microchip"></i> Sensor</h4>
                    <div class="sensor-value">
                        <span class="label"><i class="fas fa-thermometer-half"></i> Suhu</span>
                        <span class="value temp" id="tempDisplay">25.0 °C</span>
                    </div>
                    <div class="sensor-value">
                        <span class="label"><i class="fas fa-water"></i> Kelembaban</span>
                        <span class="value humidity" id="humidityDisplay">60 %</span>
                    </div>
                    <div class="sensor-value">
                        <span class="label"><i class="fas fa-people-arrows"></i> Gerakan</span>
                        <span class="value motion" id="motionCount">0</span>
                    </div>
                    <div class="sensor-value" style="border-bottom: none; padding-top: 12px;">
                        <span class="label"><i class="fas fa-bolt"></i> Daya</span>
                        <span class="value" style="color:#4ade80;" id="batteryDisplay">100%</span>
                    </div>
                </div>

                <!-- Grafik Gerakan -->
                <div class="card">
                    <h4><i class="fas fa-chart-line"></i> Aktivitas Gerakan</h4>
                    <div class="motion-graph" id="motionGraph">
                        <!-- 20 bar akan diisi JS -->
                    </div>
                    <div style="margin-top:10px; font-size:13px; color:#64748b; display:flex; justify-content:space-between;">
                        <span>Deteksi: <strong id="motionDetectStatus">Tidak Ada</strong></span>
                        <span>Puncak: <strong id="motionPeak">0</strong></span>
                    </div>
                </div>

                <!-- Log -->
                <div class="card">
                    <h4><i class="fas fa-clipboard-list"></i> Log Aktivitas</h4>
                    <div class="log-container" id="logContainer">
                        <div class="log-item"><span class="time">--:--:--</span><span class="msg">Sistem siap</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ─── DOM ──────────────────────────────────────────────────────
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');

        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnSnapshot = document.getElementById('btnSnapshot');
        const btnToggleOverlay = document.getElementById('btnToggleOverlay');

        const tempDisplay = document.getElementById('tempDisplay');
        const humidityDisplay = document.getElementById('humidityDisplay');
        const motionCount = document.getElementById('motionCount');
        const batteryDisplay = document.getElementById('batteryDisplay');
        const clockDisplay = document.getElementById('clockDisplay');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const resolutionDisplay = document.getElementById('resolutionDisplay');
        const motionDetectStatus = document.getElementById('motionDetectStatus');
        const motionPeak = document.getElementById('motionPeak');
        const logContainer = document.getElementById('logContainer');
        const motionGraph = document.getElementById('motionGraph');

        // ─── STATE ──────────────────────────────────────────────────
        let stream = null;
        let isRunning = false;
        let showOverlay = true;
        let motionHistory = []; // untuk grafik (20 nilai)
        let motionPeakValue = 0;
        let motionCounter = 0;
        let lastFrame = null;
        let frameCount = 0;
        let tempValue = 25.0;
        let humidityValue = 60;
        let logCount = 0;
        let animationId = null;

        // ─── KONFIGURASI ────────────────────────────────────────────
        const MOTION_THRESHOLD = 30; // sensitivitas
        const GRAPH_POINTS = 20;
        const TEMP_UPDATE_INTERVAL = 3000; // ms

        // ─── FUNGSI UTAMA ──────────────────────────────────────────

        // Inisialisasi grafik
        function initGraph() {
            motionGraph.innerHTML = '';
            for (let i = 0; i < GRAPH_POINTS; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = '4px';
                motionGraph.appendChild(bar);
            }
            motionHistory = new Array(GRAPH_POINTS).fill(0);
        }
        initGraph();

        // Update grafik
        function updateGraph(value) {
            motionHistory.push(value);
            if (motionHistory.length > GRAPH_POINTS) motionHistory.shift();
            const bars = motionGraph.querySelectorAll('.bar');
            const max = Math.max(1, ...motionHistory);
            motionPeakValue = max;
            motionPeak.textContent = max;
            bars.forEach((bar, i) => {
                const val = motionHistory[i] || 0;
                const pct = Math.min(100, (val / max) * 100);
                bar.style.height = Math.max(4, (pct / 100) * 50 + 4) + 'px';
                bar.classList.toggle('active', val > 0);
            });
        }

        // Log
        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('id-ID');
            const item = document.createElement('div');
            item.className = 'log-item';
            const cls = type === 'motion' ? 'motion' : (type === 'temp' ? 'temp' : '');
            item.innerHTML = `<span class="time">${time}</span><span class="msg ${cls}">${msg}</span>`;
            logContainer.prepend(item);
            if (logContainer.children.length > 30) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        // ─── DETEKSI GERAKAN ──────────────────────────────────────
        function detectMotion(videoElement, canvasEl) {
            const c = canvasEl;
            const w = c.width,
                h = c.height;
            const ctx2 = c.getContext('2d');

            // Ambil frame video ke canvas
            ctx2.drawImage(videoElement, 0, 0, w, h);
            const currentFrame = ctx2.getImageData(0, 0, w, h);
            const data = currentFrame.data;

            if (!lastFrame) {
                lastFrame = currentFrame;
                return 0;
            }

            // Hitung perbedaan
            let diff = 0;
            const len = data.length;
            for (let i = 0; i < len; i += 4) {
                const r = Math.abs(data[i] - lastFrame.data[i]);
                const g = Math.abs(data[i + 1] - lastFrame.data[i + 1]);
                const b = Math.abs(data[i + 2] - lastFrame.data[i + 2]);
                const avg = (r + g + b) / 3;
                if (avg > MOTION_THRESHOLD) diff++;
            }

            // Normalisasi
            const motionLevel = Math.min(100, (diff / (w * h)) * 200);
            lastFrame = currentFrame;

            // Gambar overlay jika ada gerakan
            if (showOverlay && motionLevel > 2) {
                // Buat highlight area bergerak dengan menggambar kotak merah transparan
                // Untuk demo, kita gambar rect di area rata-rata (jika mau lebih akurat, kita bisa cari bounding box)
                // Tapi kita sederhanakan: tampilkan indikator di pojok
                if (motionLevel > 5) {
                    ctx2.fillStyle = 'rgba(255, 0, 0, 0.15)';
                    ctx2.fillRect(0, 0, w, h);
                    ctx2.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                    ctx2.lineWidth = 2;
                    ctx2.strokeRect(2, 2, w - 4, h - 4);
                    // Tampilkan teks
                    ctx2.fillStyle = 'rgba(255, 0, 0, 0.8)';
                    ctx2.font = 'bold 18px Inter';
                    ctx2.fillText('⚠️ GERAKAN TERDETEKSI', 20, 40);
                }
            }

            return motionLevel;
        }

        // ─── LOOP KAMERA ──────────────────────────────────────────
        function processFrame() {
            if (!isRunning) return;

            const w = canvas.width;
            const h = canvas.height;

            // Deteksi gerakan
            const motion = detectMotion(video, canvas);
            motionCounter = Math.round(motion);

            // Update tampilan
            motionCount.textContent = motionCounter;
            if (motion > 5) {
                motionDetectStatus.textContent = 'Ada Gerakan!';
                motionDetectStatus.style.color = '#4ade80';
                if (motion > 20) {
                    addLog(`Gerakan kuat terdeteksi (${Math.round(motion)}%)`, 'motion');
                } else {
                    addLog(`Gerakan terdeteksi (${Math.round(motion)}%)`, 'motion');
                }
                // Update grafik
                updateGraph(Math.round(motion));
            } else {
                motionDetectStatus.textContent = 'Tidak Ada';
                motionDetectStatus.style.color = '#94a3b8';
                updateGraph(0);
            }

            // Update status
            if (motionCounter > 10) {
                statusDot.className = 'dot yellow';
                statusText.textContent = 'Gerakan';
            } else {
                statusDot.className = 'dot green';
                statusText.textContent = 'Online';
            }

            // Lanjutkan loop
            animationId = requestAnimationFrame(processFrame);
        }

        // ─── KONTROL KAMERA ──────────────────────────────────────
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();

                // Set canvas size
                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                const vw = settings.width || 640;
                const vh = settings.height || 480;
                canvas.width = vw;
                canvas.height = vh;
                resolutionDisplay.textContent = `${vw}×${vh}`;

                isRunning = true;
                lastFrame = null;
                addLog('Kamera diaktifkan', 'info');
                btnStart.disabled = true;
                btnStop.disabled = false;

                // Mulai loop
                if (animationId) cancelAnimationFrame(animationId);
                processFrame();

                // Mulai update sensor suhu simulasi
                if (!window._tempInterval) {
                    window._tempInterval = setInterval(updateSensor, TEMP_UPDATE_INTERVAL);
                }

            } catch (err) {
                alert('Tidak dapat mengakses kamera: ' + err.message);
                addLog('Error kamera: ' + err.message, 'error');
                console.error(err);
            }
        }

        function stopCamera() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusDot.className = 'dot red';
            statusText.textContent = 'Offline';
            addLog('Kamera dimatikan', 'info');
            // Clear overlay
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            motionCount.textContent = '0';
            motionDetectStatus.textContent = '--';
            updateGraph(0);
        }

        // ─── SENSOR SIMULASI ──────────────────────────────────────
        function updateSensor() {
            // Simulasi suhu (naik turun sedikit)
            tempValue += (Math.random() - 0.5) * 0.3;
            tempValue = Math.min(35, Math.max(18, tempValue));
            tempDisplay.textContent = tempValue.toFixed(1) + ' °C';

            // Kelembaban
            humidityValue += (Math.random() - 0.5) * 0.8;
            humidityValue = Math.min(85, Math.max(30, humidityValue));
            humidityDisplay.textContent = Math.round(humidityValue) + ' %';

            // Battery (simulasi)
            const bat = Math.max(10, Math.min(100, 100 - Math.random() * 0.5));
            batteryDisplay.textContent = Math.round(bat) + '%';

            // Log perubahan suhu signifikan
            if (Math.random() < 0.1) {
                addLog(`Suhu: ${tempValue.toFixed(1)}°C, Kelembaban: ${Math.round(humidityValue)}%`, 'temp');
            }
        }

        // ─── SNAPSHOT ──────────────────────────────────────────────
        function takeSnapshot() {
            if (!isRunning) {
                alert('Kamera tidak aktif');
                return;
            }
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tctx = tempCanvas.getContext('2d');
            // Gambar video
            tctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            // Gambar overlay jika aktif
            if (showOverlay) {
                // Gambar overlay dari canvas utama (yang punya deteksi)
                tctx.drawImage(canvas, 0, 0);
            }
            const link = document.createElement('a');
            link.download = `snapshot_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
            addLog('Screenshot diambil', 'info');
        }

        // ─── TOGGLE OVERLAY ──────────────────────────────────────
        function toggleOverlay() {
            showOverlay = !showOverlay;
            btnToggleOverlay.textContent = showOverlay ? 'Overlay' : 'Overlay (Mati)';
            addLog(`Overlay ${showOverlay ? 'diaktifkan' : 'dinonaktifkan'}`, 'info');
        }

        // ─── JAM ──────────────────────────────────────────────────
        function updateClock() {
            const now = new Date();
            clockDisplay.textContent = now.toLocaleTimeString('id-ID');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ─── INIT ──────────────────────────────────────────────────
        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        btnSnapshot.addEventListener('click', takeSnapshot);
        btnToggleOverlay.addEventListener('click', toggleOverlay);

        // Tambahkan log awal
        addLog('Sistem siap. Klik Mulai untuk mengaktifkan kamera.', 'info');

        // Mulai update sensor
        setInterval(updateSensor, 3000);
        updateSensor();

        console.log('🚀 SensorVision siap digunakan.');
    </script>
</body>
</html>
