<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B1E3B" />
<title>Cazoo — Digital Wallet</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Cazoo%22%2C%22short_name%22%3A%22Cazoo%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230B1E3B%22%2C%22theme_color%22%3A%22%230B1E3B%22%2C%22icons%22%3A%5B%5D%7D" />
<style>
:root{
  --navy:#0B1E3B;--navy2:#132E56;--blue:#2A7DFF;--blue2:#5AA0FF;
  --bg:#F5F7FB;--card:#FFF;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;
  --ok:#16A34A;--warn:#F59E0B;--err:#DC2626;
  --radius:16px;--radius-sm:10px;--shadow:0 6px 24px rgba(15,23,42,.08);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{--bg:#0A1222;--card:#111A2E;--text:#E6ECF5;--muted:#94A3B8;--line:#1E293B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
img{max-width:100%;display:block}

.splash{min-height:100dvh;display:grid;place-items:center;gap:24px;background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800}
.logo--xl{font-size:32px}
.logo__mark{width:44px;height:44px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--blue2));border-radius:12px;color:#fff;font-weight:900;box-shadow:var(--shadow)}
.logo--xl .logo__mark{width:60px;height:60px;font-size:28px;border-radius:16px}

.appbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.container{padding:16px;max-width:720px;margin:0 auto}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.balance-card{background:linear-gradient(140deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.balance-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(closest-side,rgba(90,160,255,.35),transparent);border-radius:50%}
.balance-card__label{opacity:.8;font-size:13px}
.balance-card__value{font-size:32px;font-weight:800;margin:6px 0 12px;letter-spacing:-.5px}
.balance-card__actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:0;background:var(--blue);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn--ghost{background:rgba(255,255,255,.14);color:#fff}
.btn--outline{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn--danger{background:var(--err)}
.btn--ok{background:var(--ok)}
.btn--block{width:100%}
.btn--sm{padding:8px 12px;font-size:13px}

.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;cursor:pointer;color:var(--text)}
.qa i{display:block;font-size:20px;margin-bottom:6px;font-style:normal}

.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:0}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,125,255,.15)}
.help{font-size:12px;color:var(--muted)}
.error{font-size:12px;color:var(--err);min-height:16px}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:var(--card);cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--blue);background:rgba(42,125,255,.08);color:var(--blue);font-weight:700}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;padding:8px 6px calc(8px + var(--safe-bottom));background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;z-index:30}
.bottom-nav a{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;border-radius:10px}
.bottom-nav a.active{color:var(--blue);font-weight:700}
.bottom-nav a i{font-size:20px;font-style:normal}
.page-with-nav{padding-bottom:96px}

.list{display:grid;gap:10px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm)}
.list-item__icon{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:rgba(42,125,255,.1);color:var(--blue);font-size:18px;flex:none}
.list-item__main{flex:1;min-width:0}
.list-item__title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item__sub{font-size:12px;color:var(--muted)}
.amount-in{color:var(--ok);font-weight:700}
.amount-out{color:var(--err);font-weight:700}

.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(100,116,139,.12);color:var(--muted);font-weight:600;text-transform:uppercase}
.badge--ok{background:rgba(22,163,74,.12);color:var(--ok)}
.badge--warn{background:rgba(245,158,11,.15);color:#B45309}
.badge--err{background:rgba(220,38,38,.12);color:var(--err)}

.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.row--between{justify-content:space-between}
.stack-sm>*+*{margin-top:8px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}

.modal-backdrop{position:fixed;inset:0;background:rgba(11,30,59,.55);display:grid;place-items:end center;z-index:100;animation:fade .18s ease}
.modal{width:100%;max-width:520px;background:var(--card);border-radius:20px 20px 0 0;padding:20px;max-height:90dvh;overflow:auto}
.modal h2{margin:0 0 12px}

.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#0F172A;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:200;font-size:14px;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast--ok{background:var(--ok)}.toast--err{background:var(--err)}

.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.spinner--dark{border-color:rgba(15,23,42,.15);border-top-color:var(--blue)}
.center-spin{display:grid;place-items:center;padding:32px}
@keyframes spin{to{transform:rotate(360deg)}}

.skeleton{background:linear-gradient(90deg,var(--line),#eef2f7,var(--line));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;cursor:pointer;font-size:13px}
.tab.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}

.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv span:first-child{color:var(--muted)}
.notif-dot{width:8px;height:8px;background:var(--err);border-radius:50%;display:inline-block}
#toast-root{position:fixed;inset:0;pointer-events:none}
.qr-box{display:grid;place-items:center;padding:20px;background:#fff;border-radius:12px}
video{width:100%;border-radius:12px;background:#000}
</style>
</head>
<body>
<div id="app"><div class="splash"><div class="logo logo--xl"><span class="logo__mark">C</span><span>Cazoo</span></div><div class="spinner"></div></div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module">
/* =========================================================
   CAZOO — Single File App
   Firebase modular SDK v10 (CDN)
========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail,
  signOut, updateProfile, updatePassword, EmailAuthProvider,
  reauthenticateWithCredential, deleteUser
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getDatabase, ref, set, get, update, onValue, push, serverTimestamp,
  query, orderByChild, limitToLast, equalTo, runTransaction
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
import {
  getFunctions, httpsCallable
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js";

/* -------- Firebase Config (klien, bukan secret) -------- */
const firebaseConfig = {
  apiKey: "AIzaSyBEPzUM9EresZ-yvphzDusVs7AUqdLuCNQ",
  authDomain: "mygame-68b24.firebaseapp.com",
  databaseURL: "https://mygame-68b24-default-rtdb.firebaseio.com",
  projectId: "mygame-68b24",
  storageBucket: "mygame-68b24.firebasestorage.app",
  messagingSenderId: "1003182873390",
  appId: "1:1003182873390:web:aabf3248f759cbc9d678bf",
  measurementId: "G-4C0MYZ19YW"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const functions = getFunctions(app, "asia-southeast2");

/* -------- State & Helpers -------- */
const state = {
  user:null, profile:null, wallet:null, isAdmin:false, route:"home",
  balanceHidden:false, theme:localStorage.getItem("cazoo:theme")||"light"
};
document.documentElement.dataset.theme = state.theme;

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const rupiah = (n=0)=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
const fmtDate = ts => ts ? new Date(ts).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"}) : "-";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-"+Date.now()+"-"+Math.random().toString(36).slice(2));
const validateEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const validateAmount = (v,{min=1000,max=50_000_000}={}) => {
  const n = Number(v);
  if(!Number.isFinite(n)) return {ok:false,msg:"Nominal tidak valid"};
  if(n<min) return {ok:false,msg:`Minimal ${rupiah(min)}`};
  if(n>max) return {ok:false,msg:`Maksimal ${rupiah(max)}`};
  if(n%1!==0) return {ok:false,msg:"Nominal harus bilangan bulat"};
  return {ok:true,value:n};
};
function authErr(code){
  const m = {
    "auth/invalid-email":"Format email tidak valid.",
    "auth/user-disabled":"Akun ini dinonaktifkan.",
    "auth/user-not-found":"Akun tidak ditemukan.",
    "auth/wrong-password":"Kata sandi salah.",
    "auth/invalid-credential":"Email atau kata sandi salah.",
    "auth/email-already-in-use":"Email sudah terdaftar.",
    "auth/weak-password":"Kata sandi minimal 6 karakter.",
    "auth/too-many-requests":"Terlalu banyak percobaan. Coba lagi nanti.",
    "auth/network-request-failed":"Koneksi bermasalah.",
    "auth/requires-recent-login":"Login ulang untuk tindakan ini.",
    "permission-denied":"Izin ditolak. Periksa aturan database.",
    "functions/not-found":"Backend (Cloud Functions) belum di-deploy.",
    "functions/unavailable":"Layanan backend tidak tersedia.",
    "functions/internal":"Terjadi kesalahan di server.",
    "functions/unauthenticated":"Sesi berakhir. Login ulang."
  };
  return m[code] || "Terjadi kesalahan. Coba lagi.";
}

function toast(msg,type="info",ms=2800){
  const el = document.createElement("div");
  el.className = "toast toast--"+type;
  el.textContent = msg;
  $("#toast-root").appendChild(el);
  requestAnimationFrame(()=>el.classList.add("show"));
  setTimeout(()=>{el.classList.remove("show");setTimeout(()=>el.remove(),250)},ms);
}
function modal(html,{onClose}={}){
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-backdrop"><div class="modal">${html}</div></div>`;
  const close = ()=>{root.innerHTML="";onClose&&onClose();};
  root.querySelector(".modal-backdrop").addEventListener("click",e=>{if(e.target.classList.contains("modal-backdrop"))close();});
  return {close, root};
}

/* -------- Router -------- */
const ROUTES = {};
function navigate(r){ location.hash = "#/"+r; }
function currentRoute(){ const h = location.hash.replace(/^#\/?/,""); return h||"home"; }
window.addEventListener("hashchange",()=>{ state.route = currentRoute(); if(state.user) renderRoute(state.route); });

/* -------- Auth Flow -------- */
function renderAuth(){
  const appEl = $("#app");
  appEl.innerHTML = `
    <div class="splash" style="align-content:start;padding-top:10vh">
      <div class="logo logo--xl"><span class="logo__mark">C</span><span>Cazoo</span></div>
      <div class="card" style="width:min(420px,92vw);background:#fff;color:#0F172A">
        <div class="tabs" style="margin-bottom:14px">
          <button class="tab active" data-tab="login">Masuk</button>
          <button class="tab" data-tab="register">Daftar</button>
          <button class="tab" data-tab="reset">Lupa Sandi</button>
        </div>
        <form id="auth-form" novalidate></form>
      </div>
      <p style="color:#cbd5e1;font-size:12px;margin:0">© ${new Date().getFullYear()} Cazoo</p>
    </div>`;
  let mode = "login";
  const form = $("#auth-form");
  const renderForm = ()=>{
    if(mode==="login") form.innerHTML = `
      <div class="field"><label>Email</label><input class="input" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Kata Sandi</label><input class="input" name="password" type="password" required autocomplete="current-password"></div>
      <p class="error" id="err"></p>
      <button class="btn btn--block" type="submit" id="submit">Masuk</button>`;
    else if(mode==="register") form.innerHTML = `
      <div class="field"><label>Nama Tampilan</label><input class="input" name="displayName" maxlength="40" required></div>
      <div class="field"><label>Email</label><input class="input" name="email" type="email" required></div>
      <div class="field"><label>Kata Sandi (min. 6)</label><input class="input" name="password" type="password" required></div>
      <div class="field"><label>Konfirmasi Kata Sandi</label><input class="input" name="password2" type="password" required></div>
      <p class="error" id="err"></p>
      <button class="btn btn--block" type="submit" id="submit">Daftar</button>`;
    else form.innerHTML = `
      <div class="field"><label>Email terdaftar</label><input class="input" name="email" type="email" required></div>
      <p class="error" id="err"></p>
      <button class="btn btn--block" type="submit" id="submit">Kirim Link Reset</button>`;
  };
  $$(".tab",appEl).forEach(b=>b.onclick=()=>{
    mode = b.dataset.tab;
    $$(".tab",appEl).forEach(x=>x.classList.toggle("active",x===b));
    renderForm();
  });
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    const err = $("#err",form); const sub = $("#submit",form);
    err.textContent=""; sub.disabled=true; const old = sub.textContent; sub.textContent="Memproses...";
    try{
      if(mode==="register"){
        if(!data.displayName.trim()) throw new Error("Nama wajib diisi.");
        if(!validateEmail(data.email)) throw new Error("Email tidak valid.");
        if(data.password.length<6) throw new Error("Kata sandi minimal 6 karakter.");
        if(data.password!==data.password2) throw new Error("Konfirmasi kata sandi tidak cocok.");
        const cred = await createUserWithEmailAndPassword(auth,data.email,data.password);
        const uid = cred.user.uid;
        await set(ref(db,`users/${uid}`),{
          displayName:data.displayName.trim(), email:data.email,
          accountStatus:"active", createdAt:serverTimestamp()
        });
        await set(ref(db,`wallets/${uid}`),{
          userId:uid, availableBalance:0, pendingBalance:0, currency:"IDR",
          updatedAt:serverTimestamp()
        });
        try{ await sendEmailVerification(cred.user); }catch{}
        toast("Registrasi berhasil. Cek email verifikasi.","ok");
      }else if(mode==="login"){
        await signInWithEmailAndPassword(auth,data.email,data.password);
      }else{
        if(!validateEmail(data.email)) throw new Error("Email tidak valid.");
        await sendPasswordResetEmail(auth,data.email);
        toast("Link reset dikirim ke email Anda.","ok");
      }
    }catch(ex){
      err.textContent = ex.code ? authErr(ex.code) : (ex.message||"Gagal");
    }finally{ sub.disabled=false; sub.textContent=old; }
  });
  renderForm();
}

/* -------- Auth State -------- */
onAuthStateChanged(auth, async user=>{
  if(!user){ Object.assign(state,{user:null,profile:null,wallet:null,isAdmin:false}); renderAuth(); return; }
  try{
    const [p,w,tok] = await Promise.all([
      get(ref(db,`users/${user.uid}`)),
      get(ref(db,`wallets/${user.uid}`)),
      user.getIdTokenResult(true)
    ]);
    state.user = user;
    state.profile = p.exists()? p.val() : null;
    state.wallet = w.exists()? w.val() : null;
    state.isAdmin = tok.claims.admin === true;

    // Jika profil belum ada (kasus register crash), buat ulang.
    if(!state.profile){
      await set(ref(db,`users/${user.uid}`),{
        displayName:user.displayName||(user.email||"Pengguna").split("@")[0],
        email:user.email||"", accountStatus:"active", createdAt:serverTimestamp()
      });
      state.profile = (await get(ref(db,`users/${user.uid}`))).val();
    }
    if(!state.wallet){
      await set(ref(db,`wallets/${user.uid}`),{
        userId:user.uid,availableBalance:0,pendingBalance:0,currency:"IDR",updatedAt:serverTimestamp()
      });
      state.wallet = (await get(ref(db,`wallets/${user.uid}`))).val();
    }
    if(state.profile.accountStatus === "disabled"){ renderDisabled(); return; }
    subscribeWallet(user.uid);
    subscribeNotifications(user.uid);
    renderAppShell();
  }catch(ex){
    console.error(ex);
    $("#app").innerHTML = `<div class="container"><div class="card"><h3>Gagal memuat data</h3><p class="help">${esc(authErr(ex.code)||ex.message)}</p><button class="btn btn--block mt-12" onclick="location.reload()">Coba Lagi</button></div></div>`;
  }
});

function renderDisabled(){
  $("#app").innerHTML = `<div class="container"><div class="card" style="text-align:center"><h2>Akun Dinonaktifkan</h2><p class="help">Hubungi layanan pelanggan Cazoo.</p><button class="btn btn--block mt-12" id="lo">Keluar</button></div></div>`;
  $("#lo").onclick = ()=>signOut(auth);
}

/* -------- Realtime subscriptions -------- */
let unsubWallet, unsubNotif;
function subscribeWallet(uid){
  unsubWallet && unsubWallet();
  unsubWallet = onValue(ref(db,`wallets/${uid}`), snap=>{
    if(snap.exists()){ state.wallet = snap.val(); if(state.route==="home") renderRoute("home"); }
  });
}
const notifCache = { items:[], unread:0 };
function subscribeNotifications(uid){
  unsubNotif && unsubNotif();
  unsubNotif = onValue(query(ref(db,`notifications/${uid}`), orderByChild("createdAt"), limitToLast(50)), snap=>{
    const arr = [];
    snap.forEach(c=>arr.push({id:c.key,...c.val()}));
    arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    notifCache.items = arr;
    notifCache.unread = arr.filter(n=>!n.read).length;
    const nav = $(".bottom-nav a[data-route='notifications']");
    if(nav) nav.querySelector(".dot")?.remove();
    if(nav && notifCache.unread>0){
      const dot = document.createElement("span"); dot.className="dot"; dot.style.cssText="width:8px;height:8px;background:var(--err);border-radius:50%;position:absolute;transform:translate(14px,-6px)";
      nav.style.position="relative"; nav.appendChild(dot);
    }
  });
}

/* -------- App Shell -------- */
function renderAppShell(){
  const {profile} = state;
  const name = profile?.displayName || state.user?.email || "Pengguna";
  $("#app").innerHTML = `
    <header class="appbar">
      <div class="logo"><span class="logo__mark">C</span><span>Cazoo</span></div>
      <div class="row">
        <button class="btn btn--outline btn--sm" id="toggle-balance" aria-label="Sembunyikan saldo">👁</button>
        <button class="btn btn--outline btn--sm" id="open-settings" aria-label="Pengaturan">⚙</button>
      </div>
    </header>
    <main id="view" class="page-with-nav"></main>
    <nav class="bottom-nav">
      <a href="#/home" data-route="home"><i>🏠</i><span>Beranda</span></a>
      <a href="#/activity" data-route="activity"><i>📄</i><span>Aktivitas</span></a>
      <a href="#/pay" data-route="pay"><i>💳</i><span>Bayar</span></a>
      <a href="#/notifications" data-route="notifications"><i>🔔</i><span>Notifikasi</span></a>
      <a href="#/profile" data-route="profile"><i>👤</i><span>Profil</span></a>
    </nav>`;

function renderRoute(route){
  const view = $("#view"); if(!view) return;
  view.innerHTML = "";
  (ROUTES[route] || ROUTES.home)(view);

  state.route = route;
}

async function loadRecentTransactions(limit=20){
  const uid = state.user?.uid; if(!uid) return [];
  const snap = await get(query(ref(db,`transactions`), orderByChild("userId"), equalTo(uid), limitToLast(limit)));
  const arr=[]; snap.forEach(c=>arr.push({id:c.key,...c.val()}));
  arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return arr;
}

function txRow(t){
  const isIn = ["TOPUP","TRANSFER_IN","REFUND","ADJUSTMENT"].includes(t.transactionType) && !String(t.transactionType).includes("OUT");
  const dir = t.transactionType?.includes("OUT")||t.transactionType==="PAYMENT"||t.transactionType==="WITHDRAWAL"||t.transactionType==="FEE" ? "out" : "in";
  const sign = dir==="in"?"+":"-";
  const cls = dir==="in"?"amount-in":"amount-out";
  const statMap = {success:"badge--ok",pending:"badge--warn",failed:"badge--err",processing:"badge--warn",expired:"badge--err",cancelled:"badge--err"};
  const ic = {TOPUP:"➕",TRANSFER_IN:"↙",TRANSFER_OUT:"↗",PAYMENT:"💳",REFUND:"↩",WITHDRAWAL:"↘",FEE:"#",ADJUSTMENT:"⚙"}[t.transactionType]||"•";
  return `<div class="list-item" data-txid="${t.id}" role="button" tabindex="0">
    <div class="list-item__icon">${ic}</div>
    <div class="list-item__main">
      <div class="list-item__title">${esc(t.description||t.transactionType||"Transaksi")}</div>
      <div class="list-item__sub">${fmtDate(t.createdAt)} · <span class="badge ${statMap[t.status]||""}">${esc(t.status||"-")}</span></div>
    </div>
    <div class="${cls}">${sign}${rupiah(t.amount||0).replace("Rp","Rp ")}</div>
  </div>`;
}

async function showTxDetail(id){
  const snap = await get(ref(db,`transactions/${id}`));
  if(!snap.exists()){ toast("Transaksi tidak ditemukan","err"); return; }
  const t = snap.val();
  const rows = [
    ["ID",id],["Jenis",t.transactionType],["Status",t.status],
    ["Nominal",rupiah(t.amount||0)],["Biaya",rupiah(t.fee||0)],
    ["Total",rupiah((t.amount||0)+(t.fee||0))],
    ["Referensi",t.referenceNumber||"-"],
    ["Deskripsi",t.description||"-"],
    ["Waktu",fmtDate(t.createdAt)]
  ];
  modal(`
    <h2>Detail Transaksi</h2>
    ${rows.map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join("")}
    <button class="btn btn--block mt-12" id="close">Tutup</button>
  `).root.querySelector("#close").onclick = ()=>$("#modal-root").innerHTML="";
}

      const call = httpsCallable(functions,"payMerchant");
      const res = await call({ code, amount:v.value, idempotencyKey:uuid() });
      toast("Pembayaran berhasil.","ok");
      if(res.data?.transactionId) showTxDetail(res.data.transactionId);
    }catch(ex){
      err.textContent = authErr(ex.code)||ex.message;
    }finally{ btn.disabled=false; btn.textContent="Bayar"; }
  };
};

/* -------- HISTORY -------- */
ROUTES.activity = async (root)=>{
  root.innerHTML = `
    <div class="container">
      <h2 style="margin-top:0">Aktivitas</h2>
      <div class="card">
        <div class="row">
          <select id="fType" class="input">
            <option value="">Semua Jenis</option>
            <option>TOPUP</option><option>TRANSFER_IN</option><option>TRANSFER_OUT</option>
            <option>PAYMENT</option><option>WITHDRAWAL</option><option>REFUND</option>
            <option>FEE</option><option>ADJUSTMENT</option>
          </select>
          <select id="fStatus" class="input">
            <option value="">Semua Status</option>
            <option>success</option><option>pending</option><option>processing</option>
            <option>failed</option><option>expired</option><option>cancelled</option>
          </select>
        </div>
        <div class="field mt-8"><label>Cari referensi</label><input class="input" id="fRef" placeholder="Reference number"></div>
        <div class="field"><label>Dari</label><input class="input" id="fFrom" type="date"></div>
        <div class="field"><label>Sampai</label><input class="input" id="fTo" type="date"></div>
        <button class="btn btn--block" id="apply">Terapkan Filter</button>
      </div>
      <div class="list mt-12" id="list"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>`;

  async function fetchPage(){
    const uid = state.user.uid;
    const snap = await get(query(ref(db,"transactions"), orderByChild("userId"), equalTo(uid), limitToLast(200)));
    const arr=[]; snap.forEach(c=>arr.push({id:c.key,...c.val()}));
    arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const t = $("#fType").value, s = $("#fStatus").value, r = $("#fRef").value.trim().toLowerCase();
    const from = $("#fFrom").value ? new Date($("#fFrom").value).getTime() : 0;
    const to = $("#fTo").value ? new Date($("#fTo").value).getTime()+86_399_999 : Infinity;
    return arr.filter(x=>{
      if(t && x.transactionType!==t) return false;
      if(s && x.status!==s) return false;
      if(r && !String(x.referenceNumber||"").toLowerCase().includes(r)) return false;
      const c = x.createdAt||0;
      if(c<from || c>to) return false;
      return true;
    });
  }
  const render = async ()=>{
    const el = $("#list");
    el.innerHTML = `<div class="skeleton"></div>`;
    try{
      const items = await fetchPage();
      if(!items.length){ el.innerHTML = `<div class="empty">Tidak ada transaksi sesuai filter.</div>`; return; }
      el.innerHTML = items.map(txRow).join("");
      el.querySelectorAll("[data-txid]").forEach(x=>x.onclick=()=>showTxDetail(x.dataset.txid));
    }catch(ex){ el.innerHTML = `<div class="empty">${esc(authErr(ex.code)||ex.message)}</div>`; }
  };
  $("#apply").onclick = render;
  render();
};

/* -------- NOTIFICATIONS -------- */
ROUTES.notifications = (root)=>{
  const items = notifCache.items;
  root.innerHTML = `
    <div class="container">
      <div class="row row--between"><h2 style="margin:0">Notifikasi</h2>
        <button class="btn btn--outline btn--sm" id="markAll">Tandai semua dibaca</button>
      </div>
      <div class="list mt-12" id="list"></div>
    </div>`;
  const el = $("#list");
  const render = ()=>{
    if(!items.length){ el.innerHTML = `<div class="empty">Belum ada notifikasi.</div>`; return; }
    el.innerHTML = items.map(n=>`
      <div class="list-item" data-nid="${esc(n.id)}" role="button" tabindex="0">
        <div class="list-item__icon">${n.read?"🔔":"🆕"}</div>
        <div class="list-item__main">
          <div class="list-item__title">${esc(n.title||"Notifikasi")}</div>
          <div class="list-item__sub">${esc(n.message||"")}</div>
          <div class="list-item__sub">${fmtDate(n.createdAt)}</div>
        </div>
        ${n.read?"":'<span class="badge badge--ok">Baru</span>'}
      </div>`).join("");
    el.querySelectorAll("[data-nid]").forEach(x=>x.onclick=async ()=>{
      const nid = x.dataset.nid;
      try{ await update(ref(db,`notifications/${state.user.uid}/${nid}`),{read:true}); }catch{}
      const n = items.find(i=>i.id===nid);
      if(n?.link) navigate(n.link);
      render();
    });
  };
  render();
  $("#markAll").onclick = async ()=>{
    try{
      const updates = {}; items.forEach(n=>{ if(!n.read) updates[`notifications/${state.user.uid}/${n.id}/read`]=true; });
      if(Object.keys(updates).length) await update(ref(db),updates);
      toast("Semua ditandai dibaca.","ok");
    }catch(ex){ toast(authErr(ex.code)||ex.message,"err"); }
  };
};

/* -------- PROFILE -------- */
ROUTES.profile = (root)=>{
  const {profile,user} = state;
  root.innerHTML = `
    <div class="container">
      <div class="card">
        <div class="row">
          <div class="list-item__icon" style="width:56px;height:56px;font-size:24px">👤</div>
          <div class="list-item__main">
            <div class="list-item__title">${esc(profile?.displayName||"-")}</div>
            <div class="list-item__sub">${esc(user.email||"")}</div>
            <div class="list-item__sub">UID: ${esc(user.uid)}</div>
          </div>
        </div>
        ${user.emailVerified?`<span class="badge badge--ok mt-8">Email terverifikasi</span>`:`<div class="row mt-8"><span class="badge badge--warn">Email belum terverifikasi</span><button class="btn btn--sm btn--outline" id="verify">Kirim ulang verifikasi</button></div>`}
      </div>

      <div class="card">
        <h3 style="margin-top:0">Ubah Profil</h3>
        <div class="field"><label>Nama Tampilan</label><input class="input" id="name" value="${esc(profile?.displayName||"")}"></div>
        <button class="btn btn--block" id="saveName">Simpan Nama</button>
      </div>

      <div class="card">
        <h3 style="margin-top:0">Ubah Kata Sandi</h3>
        <div class="field"><label>Sandi Saat Ini</label><input class="input" id="old" type="password"></div>
        <div class="field"><label>Sandi Baru</label><input class="input" id="new" type="password"></div>
        <p class="error" id="err"></p>
        <button class="btn btn--block" id="savePw">Ubah Sandi</button>
      </div>

      <div class="card">
        <h3 style="margin-top:0">Keamanan & Akun</h3>
        <button class="btn btn--outline btn--block" id="goSettings">Pengaturan</button>
        <button class="btn btn--outline btn--block mt-8" id="logout">Keluar</button>
        <button class="btn btn--danger btn--block mt-8" id="deleteAcc">Hapus Akun</button>
      </div>
    </div>`;
  $("#verify").onclick = async ()=>{ try{ await sendEmailVerification(user); toast("Email verifikasi dikirim.","ok"); }catch(ex){ toast(authErr(ex.code),"err"); } };
  $("#saveName").onclick = async ()=>{
    const name = $("#name").value.trim();
    if(!name){ toast("Nama wajib diisi","err"); return; }
    try{
      await update(ref(db,`users/${user.uid}`),{displayName:name});
      await updateProfile(user,{displayName:name});
      state.profile.displayName = name;
      toast("Nama diperbarui.","ok");
    }catch(ex){ toast(authErr(ex.code)||ex.message,"err"); }
  };
  $("#savePw").onclick = async ()=>{
    const err = $("#err"); err.textContent="";
    const o = $("#old").value, n = $("#new").value;
    if(!o||!n){ err.textContent="Isi kedua kolom."; return; }
    if(n.length<6){ err.textContent="Sandi baru minimal 6 karakter."; return; }
    try{
      const cred = EmailAuthProvider.credential(user.email,o);
      await reauthenticateWithCredential(user,cred);
      await updatePassword(user,n);
      toast("Kata sandi diubah.","ok"); $("#old").value="";$("#new").value="";
    }catch(ex){ err.textContent = authErr(ex.code)||ex.message; }
  };
  $("#goSettings").onclick = ()=>navigate("settings");
  $("#logout").onclick = ()=>signOut(auth);
  $("#deleteAcc").onclick = ()=>{
    modal(`<h2>Hapus Akun</h2>
      <p class="help">Tindakan ini permanen. Data transaksi akan disimpan sesuai kebijakan.</p>
      <div class="field"><label>Kata Sandi</label><input class="input" id="pw" type="password"></div>
      <p class="error" id="err"></p>
      <div class="row mt-8">
        <button class="btn btn--outline btn--block" id="cancel">Batal</button>
        <button class="btn btn--danger btn--block" id="ok">Hapus</button>
      </div>`);
    $("#cancel").onclick = ()=>$("#modal-root").innerHTML="";
    $("#ok").onclick = async ()=>{
      try{
        const cred = EmailAuthProvider.credential(user.email,$("#pw").value);
        await reauthenticateWithCredential(user,cred);
        await update(ref(db,`users/${user.uid}`),{accountStatus:"deleted"});
        await deleteUser(user);
        toast("Akun dihapus.","ok");
      }catch(ex){ $("#err").textContent = authErr(ex.code)||ex.message; }
    };
  };
};

/* -------- ADMIN (read-only viewer) -------- */
ROUTES.admin = async (root)=>{
  if(!state.isAdmin){
    root.innerHTML = `<div class="container"><div class="card"><h3>Akses ditolak</h3><p class="help">Anda bukan admin.</p></div></div>`;
    return;
  }
  root.innerHTML = `
    <div class="container">
      <h2 style="margin-top:0">Admin</h2>
      <div class="card"><div id="stat" class="center-spin"><div class="spinner spinner--dark"></div></div></div>
      <div class="card"><h3 style="margin-top:0">Topup Pending</h3><div id="topup" class="list mt-8"><div class="skeleton"></div></div></div>
      <div class="card"><h3 style="margin-top:0">Withdraw Pending</h3><div id="wd" class="list mt-8"><div class="skeleton"></div></div></div>
    </div>`;
  try{
    const usersSnap = await get(ref(db,"users"));
    const txSnap = await get(query(ref(db,"transactions"), limitToLast(500)));
    const wdSnap = await get(query(ref(db,"withdrawals"), orderByChild("status"), equalTo("pending")));
    const prSnap = await get(query(ref(db,"paymentRequests"), orderByChild("status"), equalTo("pending")));

    const users = usersSnap.size || usersSnap.numChildren?.() || 0;
    const txArr=[]; txSnap.forEach(c=>txArr.push(c.val()));
    const total = txArr.filter(t=>t.status==="success").reduce((a,b)=>a+(b.amount||0),0);
    $("#stat").outerHTML = `
      <div class="mt-8">
        <div class="kv"><span>Pengguna</span><strong>${users}</strong></div>
        <div class="kv"><span>Transaksi</span><strong>${txArr.length}</strong></div>
        <div class="kv"><span>Total sukses</span><strong>${rupiah(total)}</strong></div>
        <div class="kv"><span>Sukses</span><strong>${txArr.filter(t=>t.status==="success").length}</strong></div>
        <div class="kv"><span>Gagal</span><strong>${txArr.filter(t=>t.status==="failed").length}</strong></div>
        <div class="kv"><span>Pending</span><strong>${txArr.filter(t=>t.status==="pending"||t.status==="processing").length}</strong></div>
      </div>`;

    const listFrom = (snap, kind) => {
      const arr=[]; snap.forEach(c=>arr.push({id:c.key,...c.val()}));
      if(!arr.length) return `<div class="empty">Tidak ada.</div>`;
      return arr.map(x=>`
        <div class="list-item"><div class="list-item__icon">${kind==="wd"?"↘":"➕"}</div>
          <div class="list-item__main"><div class="list-item__title">${rupiah(x.amount||0)}</div>
            <div class="list-item__sub">${esc(x.userId||"")} · ${fmtDate(x.createdAt)}</div></div>
          <span class="badge badge--warn">${esc(x.status||"")}</span>
        </div>`).join("");
    };
    $("#wd").innerHTML = listFrom(wdSnap,"wd");
    $("#topup").innerHTML = listFrom(prSnap,"pr");
  }catch(ex){
    toast(authErr(ex.code)||ex.message,"err");
  }
};
