<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyBro - Ultra Chat & Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-heavy: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --danger: #ef4444;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }

        /* Nav Rail */
        .nav-rail {
            width: 70px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            align-items: center; padding: 20px 0; gap: 15px;
        }
        .nav-item {
            width: 48px; height: 48px; border-radius: 14px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            transition: 0.3s; color: rgba(255,255,255,0.3);
        }
        .nav-item.active { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(56,189,248,0.4); }

        /* Content Area */
        .content-area { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; }
        header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        .view { display: none; flex: 1; padding: 15px; overflow-y: auto; }
        .view.active { display: flex; flex-direction: column; }

        /* List Cards & Buttons */
        .list-card {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 16px; padding: 12px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 12px; position: relative;
        }
        .avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        
        .delete-btn {
            position: absolute; right: 15px; color: var(--danger);
            padding: 8px; cursor: pointer; opacity: 0.6; transition: 0.3s;
        }
        .delete-btn:hover { opacity: 1; }

        .fab {
            position: absolute; bottom: 85px; right: 20px; width: 55px; height: 55px;
            background: var(--accent); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 1.3rem; color: black;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); cursor: pointer; border: none; z-index: 90;
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #1e293b; border: 1px solid var(--border);
            width: 85%; max-width: 350px; padding: 25px; border-radius: 20px;
            position: relative;
        }
        .close-btn { position: absolute; top: 15px; right: 15px; cursor: pointer; opacity: 0.5; }

        /* Inputs */
        input[type="text"] {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px;
            border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: white; outline: none;
        }
        .file-label {
            display: block; width: 100%; padding: 12px; margin: 10px 0;
            background: var(--glass-heavy); border-radius: 10px; text-align: center;
            cursor: pointer; font-size: 0.9rem; border: 1px dashed var(--accent);
        }
        input[type="file"] { display: none; }
        .btn-action {
            width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px;
            border: none; background: var(--accent); color: black; font-weight: 600; cursor: pointer;
        }

        /* Chat Panel */
        #chatPanel {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100dvh;
            background: var(--bg); z-index: 2000; transition: 0.3s ease;
            display: flex; flex-direction: column;
        }
        #chatPanel.open { right: 0; }
        #messageArea { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .bubble { padding: 10px 14px; border-radius: 16px; max-width: 80%; font-size: 14px; }
        .me { align-self: flex-end; background: var(--accent); color: black; border-bottom-right-radius: 2px; }
        .them { align-self: flex-start; background: var(--glass-heavy); color: white; border-bottom-left-radius: 2px; }
    </style>
</head>
<body>

    <nav class="nav-rail">
        <div class="nav-item active" onclick="switchView('chats', this)"><i class="fas fa-comment-dots"></i></div>
        <div class="nav-item" onclick="switchView('stories', this)"><i class="fas fa-circle-notch"></i></div>
        <div class="nav-item" onclick="switchView('contacts', this)"><i class="fas fa-address-book"></i></div>
        <div class="nav-item" onclick="openModal('profileModal')" style="margin-top:auto"><i class="fas fa-user-gear"></i></div>
    </nav>

    <div class="content-area">
        <header>
            <h2 id="viewTitle" style="margin:0; font-size: 1.2rem;">Obrolan</h2>
            <div id="myIDDisplay" style="font-size: 0.7rem; color: var(--accent); font-weight: bold;">ID: --</div>
        </header>

        <div id="chatsView" class="view active">
            <div id="recentChats"></div>
        </div>

        <div id="storiesView" class="view">
            <div class="list-card" onclick="openModal('storyModal')">
                <div class="avatar" style="display:flex; align-items:center; justify-content:center; border: 2px dashed var(--accent);">
                    <i class="fas fa-camera"></i>
                </div>
                <div><strong>Posting Story</strong><br><small>Pilih foto dari galeri</small></div>
            </div>
            <div id="storyContainer"></div>
        </div>

        <div id="contactsView" class="view">
            <div id="allContacts"></div>
        </div>

        <button class="fab" onclick="openModal('addContactModal')"><i class="fas fa-plus"></i></button>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-content">
            <i class="fas fa-times close-btn" onclick="closeModal()"></i>
            
            <div id="addContactModal" style="display:none">
                <h3>Tambah Teman</h3>
                <input type="text" id="targetID" placeholder="Masukkan ID (BRO-xxxx)">
                <button class="btn-action" onclick="saveContact()">Tambah</button>
            </div>

            <div id="storyModal" style="display:none">
                <h3>Posting Status</h3>
                <label class="file-label" for="storyFile"><i class="fas fa-image"></i> Pilih Foto</label>
                <input type="file" id="storyFile" accept="image/*">
                <div id="storyPreview" style="text-align:center; display:none"><img id="sPrevImg" style="width:100px; height:100px; border-radius:10px; margin-top:10px;"></div>
                <button class="btn-action" onclick="postStory()">Upload Story</button>
            </div>

            <div id="profileModal" style="display:none">
                <h3>Edit Profil</h3>
                <input type="text" id="pName" placeholder="Nama Anda">
                <label class="file-label" for="profileFile"><i class="fas fa-user-circle"></i> Pilih Foto Profil</label>
                <input type="file" id="profileFile" accept="image/*">
                <button class="btn-action" onclick="updateProfile()">Simpan</button>
            </div>
        </div>
    </div>

    <div id="chatPanel">
        <header>
            <div style="display:flex; align-items:center; gap:12px;">
                <i class="fas fa-arrow-left" onclick="closeChat()"></i>
                <img id="chatAvatar" src="" class="avatar" style="width:35px; height:35px; border:none;">
                <span id="chatName" style="font-size: 1rem;">Target</span>
            </div>
        </header>
        <div id="messageArea"></div>
        <div style="padding:15px; display:flex; gap:10px; background: rgba(0,0,0,0.3);">
            <input type="text" id="msgIn" placeholder="Pesan..." style="margin:0">
            <button onclick="sendMsg()" style="background:var(--accent); border:none; width:50px; border-radius:10px;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f",
            storageBucket: "mybro-9ba5f.appspot.com",
            messagingSenderId: "820948893264",
            appId: "1:820948893264:web:e58e1a175bc90053335b55"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myID = localStorage.getItem('my_chat_id') || "BRO-" + Math.floor(Math.random()*8999+1000);
        localStorage.setItem('my_chat_id', myID);
        document.getElementById('myIDDisplay').innerText = "ID: " + myID;

        let currentTarget = null;
        let base64Image = "";

        // UI ACTIONS
        window.switchView = (name, el) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(name+'View').classList.add('active');
            el.classList.add('active');
            document.getElementById('viewTitle').innerText = name.charAt(0).toUpperCase() + name.slice(1);
        };

        window.openModal = (id) => {
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('addContactModal').style.display = 'none';
            document.getElementById('storyModal').style.display = 'none';
            document.getElementById('profileModal').style.display = 'none';
            document.getElementById(id).style.display = 'block';
            base64Image = ""; // Reset image
        };

        window.closeModal = () => document.getElementById('modalOverlay').style.display = 'none';

        // CONVERT IMAGE TO BASE64
        const handleFile = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => { base64Image = reader.result; };
            if(file) reader.readAsDataURL(file);
        };
        document.getElementById('profileFile').addEventListener('change', handleFile);
        document.getElementById('storyFile').addEventListener('change', handleFile);

        // LOGIC PROFILE & CONTACT
        window.updateProfile = () => {
            const name = document.getElementById('pName').value;
            if(!name) return alert("Nama harus diisi!");
            const data = { name, id: myID };
            if(base64Image) data.photo = base64Image;
            set(ref(db, `users/${myID}/profile`), data);
            alert("Profil diperbarui!");
            closeModal();
        };

        window.saveContact = async () => {
            const tid = document.getElementById('targetID').value.trim();
            if(!tid || tid === myID) return;
            const userSnap = await get(ref(db, `users/${tid}/profile`));
            if(userSnap.exists()){
                set(ref(db, `users/${myID}/contacts/${tid}`), { id: tid });
                closeModal();
            } else { alert("ID tidak ditemukan!"); }
        };

        window.deleteContact = (tid) => {
            if(confirm("Hapus kontak ini?")){
                remove(ref(db, `users/${myID}/contacts/${tid}`));
            }
        };

        // LISTEN CONTACTS
        onValue(ref(db, `users/${myID}/contacts`), (snapshot) => {
            const chatList = document.getElementById('recentChats');
            const contList = document.getElementById('allContacts');
            chatList.innerHTML = ""; contList.innerHTML = "";
            snapshot.forEach(child => {
                const cid = child.key;
                onValue(ref(db, `users/${cid}/profile`), (pSnap) => {
                    const p = pSnap.val() || { name: cid, photo: 'https://ui-avatars.com/api/?name='+cid };
                    const html = `<div class="list-card">
                        <div style="display:flex; align-items:center; flex:1" onclick="openChat('${cid}', '${p.name}', '${p.photo}')">
                            <img src="${p.photo}" class="avatar">
                            <div><strong>${p.name}</strong><br><small style="opacity:0.5">${cid}</small></div>
                        </div>
                        <i class="fas fa-trash-alt delete-btn" onclick="deleteContact('${cid}')"></i>
                    </div>`;
                    chatList.innerHTML += html; contList.innerHTML += html;
                });
            });
        });

        // STORY LOGIC
        window.postStory = () => {
            if(!base64Image) return alert("Pilih foto dulu!");
            push(ref(db, `stories`), { url: base64Image, senderID: myID, time: Date.now() });
            alert("Story Berhasil!");
            closeModal();
        };

        onValue(ref(db, `stories`), (snap) => {
            const container = document.getElementById('storyContainer');
            container.innerHTML = "";
            snap.forEach(child => {
                const s = child.val();
                if(Date.now() - s.time < 86400000) {
                    container.innerHTML += `<div class="list-card">
                        <img src="${s.url}" class="avatar" style="border-color:#ec4899">
                        <div><strong>${s.senderID}</strong><br><small>Baru saja</small></div>
                    </div>`;
                }
            });
        });

        // CHAT LOGIC (Same as before)
        window.openChat = (id, name, photo) => {
            currentTarget = id;
            document.getElementById('chatName').innerText = name;
            document.getElementById('chatAvatar').src = photo;
            document.getElementById('chatPanel').classList.add('open');
            const chatID = [myID, id].sort().join("_");
            onValue(ref(db, `chats/${chatID}`), (snap) => {
                const area = document.getElementById('messageArea');
                area.innerHTML = "";
                snap.forEach(c => {
                    const m = c.val();
                    area.innerHTML += `<div class="bubble ${m.sender === myID ? 'me' : 'them'}">${m.text}</div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        };

        window.closeChat = () => document.getElementById('chatPanel').classList.remove('open');
        window.sendMsg = () => {
            const input = document.getElementById('msgIn');
            if(!input.value || !currentTarget) return;
            const chatID = [myID, currentTarget].sort().join("_");
            push(ref(db, `chats/${chatID}`), { sender: myID, text: input.value, time: Date.now() });
            input.value = "";
        };
    </script>
</body>
</html>
