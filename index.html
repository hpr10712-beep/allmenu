<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4F46E5" />
<title>CAZOO — Platform Sekolah & Ujian Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F46E5'/%3E%3Cpath d='M10 22V10h3.2l3 5 3-5H22v12h-3v-6.4l-2.5 4h-1.6l-2.5-4V22H10z' fill='white'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --primary:#4F46E5; --primary-dark:#3730A3; --primary-soft:#EEF2FF;
  --secondary:#0EA5E9; --secondary-soft:#E0F2FE;
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9;
  --text:#0F172A; --text-2:#64748B; --text-3:#94A3B8;
  --border:#E2E8F0; --border-2:#CBD5E1;
  --success:#16A34A; --success-soft:#DCFCE7;
  --warning:#F59E0B; --warning-soft:#FEF3C7;
  --danger:#DC2626; --danger-soft:#FEE2E2;
  --info:#0EA5E9; --info-soft:#E0F2FE;
  --radius:12px; --radius-sm:8px; --radius-lg:16px; --radius-xl:24px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:0 12px 32px rgba(15,23,42,.10);
  --sidebar-w:260px; --header-h:64px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --transition:180ms cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --primary:#6366F1; --primary-dark:#4F46E5; --primary-soft:#1E1B4B;
  --secondary:#38BDF8; --secondary-soft:#0C4A6E;
  --bg:#0B1220; --surface:#0F172A; --surface-2:#1E293B;
  --text:#F1F5F9; --text-2:#94A3B8; --text-3:#64748B;
  --border:#1E293B; --border-2:#334155;
  --success:#22C55E; --success-soft:#052E16;
  --warning:#FBBF24; --warning-soft:#451A03;
  --danger:#EF4444; --danger-soft:#450A0A;
  --info:#38BDF8; --info-soft:#0C4A6E;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  transition:background var(--transition), color var(--transition);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
::-webkit-scrollbar-track{background:transparent}

/* ============ BASE COMPONENTS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;
  transition:all var(--transition); white-space:nowrap; user-select:none;
  border:1px solid transparent;
}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--surface-2);border-color:var(--border-2)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){filter:brightness(.92)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover:not(:disabled){filter:brightness(.92)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-lg{padding:14px 24px;font-size:15px}
.btn-icon{padding:8px;border-radius:var(--radius-sm)}

.input,.select,.textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--text);
  transition:border var(--transition),box-shadow var(--transition);
}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);
}
.textarea{min-height:100px;resize:vertical;font-family:inherit}
.label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--text)}
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
.help{font-size:12px;color:var(--text-2);margin-top:4px}
.error-text{font-size:12px;color:var(--danger);margin-top:4px;display:none}
.error-text.show{display:block}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);
}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.card-title{font-size:16px;font-weight:700}

.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;
  border-radius:999px;font-size:12px;font-weight:600;
}
.badge-primary{background:var(--primary-soft);color:var(--primary)}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:#92400E}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-neutral{background:var(--surface-2);color:var(--text-2)}
[data-theme="dark"] .badge-warning{color:#FBBF24}

/* ============ LANDING ============ */
.landing-nav{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
}
[data-theme="dark"] .landing-nav{background:rgba(15,23,42,.85)}
.landing-nav-inner{
  max-width:1200px;margin:0 auto;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--text)}
.logo-mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
  box-shadow:0 4px 12px rgba(79,70,229,.35);
}
.landing-menu{display:flex;gap:4px}
.landing-menu a{
  padding:8px 14px;border-radius:8px;color:var(--text-2);font-weight:500;font-size:14px;
}
.landing-menu a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.landing-actions{display:flex;gap:8px}
@media(max-width:768px){.landing-menu{display:none}}

.hero{
  max-width:1200px;margin:0 auto;padding:80px 24px 60px;
  display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center;
}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:48px 20px;gap:40px}}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;padding:6px 14px;
  background:var(--primary-soft);color:var(--primary);border-radius:999px;
  font-size:13px;font-weight:600;margin-bottom:20px;
}
.hero h1{
  font-size:52px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-bottom:20px;
}
.hero h1 span{background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:17px;color:var(--text-2);margin-bottom:32px;max-width:560px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:640px){.hero h1{font-size:36px}.hero p{font-size:15px}}

.hero-visual{
  position:relative;border-radius:var(--radius-xl);overflow:hidden;
  background:linear-gradient(135deg,#EEF2FF 0%,#E0F2FE 100%);
  padding:24px;box-shadow:var(--shadow-lg);min-height:380px;
}
[data-theme="dark"] .hero-visual{background:linear-gradient(135deg,#1E1B4B 0%,#0C4A6E 100%)}
.mock-window{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;height:100%;
}
.mock-bar{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.mock-dot{width:10px;height:10px;border-radius:50%}
.mock-body{padding:16px;display:grid;gap:12px}
.mock-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mock-stat > div{padding:12px;background:var(--surface-2);border-radius:10px}
.mock-stat b{display:block;font-size:20px;color:var(--primary)}
.mock-stat span{font-size:11px;color:var(--text-2)}
.mock-chart{height:120px;background:var(--surface-2);border-radius:10px;position:relative;overflow:hidden}
.mock-chart svg{width:100%;height:100%}
.mock-rows{display:grid;gap:6px}
.mock-row{height:10px;background:var(--surface-2);border-radius:6px}
.mock-row:nth-child(2){width:80%}
.mock-row:nth-child(3){width:60%}

.section{max-width:1200px;margin:0 auto;padding:72px 24px}
.section-head{text-align:center;max-width:640px;margin:0 auto 48px}
.section-head h2{font-size:36px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.section-head p{color:var(--text-2);font-size:16px}
@media(max-width:640px){.section{padding:48px 20px}.section-head h2{font-size:26px}}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-3,.grid-4,.grid-2{grid-template-columns:1fr}}

.feature-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:24px;transition:all var(--transition);
}
.feature-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.feature-icon{
  width:44px;height:44px;border-radius:12px;background:var(--primary-soft);
  color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:16px;
}
.feature-card h3{font-size:16px;font-weight:700;margin-bottom:8px}
.feature-card p{color:var(--text-2);font-size:14px}

.faq-item{
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;
  background:var(--surface);overflow:hidden;
}
.faq-q{
  padding:18px 20px;font-weight:600;display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;user-select:none;
}
.faq-a{padding:0 20px;max-height:0;overflow:hidden;transition:all .3s;color:var(--text-2)}
.faq-item.open .faq-a{max-height:400px;padding:0 20px 20px}
.faq-item.open .faq-q svg{transform:rotate(180deg)}
.faq-q svg{transition:transform .3s}

.footer{
  background:var(--surface);border-top:1px solid var(--border);
  padding:48px 24px 24px;margin-top:48px;
}
.footer-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px}
@media(max-width:768px){.footer-inner{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.footer-inner{grid-template-columns:1fr}}
.footer h4{font-size:14px;font-weight:700;margin-bottom:12px}
.footer ul{list-style:none;display:grid;gap:8px}
.footer a{color:var(--text-2);font-size:14px}
.footer-bottom{
  max-width:1200px;margin:32px auto 0;padding-top:24px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;color:var(--text-2);font-size:13px;flex-wrap:wrap;gap:12px;
}

/* ============ AUTH ============ */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:linear-gradient(135deg,var(--bg) 0%,var(--primary-soft) 100%);
}
[data-theme="dark"] .auth-wrap{background:linear-gradient(135deg,var(--bg) 0%,#1E1B4B 100%)}
.auth-card{
  background:var(--surface);border-radius:var(--radius-xl);padding:40px;
  width:100%;max-width:440px;box-shadow:var(--shadow-lg);border:1px solid var(--border);
}
.auth-header{text-align:center;margin-bottom:32px}
.auth-header .logo{justify-content:center;margin-bottom:16px;font-size:22px}
.auth-header h1{font-size:24px;font-weight:800;margin-bottom:6px}
.auth-header p{color:var(--text-2);font-size:14px}
.auth-tabs{display:flex;background:var(--surface-2);border-radius:var(--radius-sm);padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:8px;border-radius:6px;font-weight:600;color:var(--text-2);font-size:14px;transition:all var(--transition)}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:6px;color:var(--text-2);border-radius:6px}
.pw-toggle:hover{background:var(--surface-2)}
.auth-links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.role-opt{padding:12px;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:center;cursor:pointer;transition:all var(--transition)}
.role-opt:hover{border-color:var(--primary)}
.role-opt.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}

/* ============ APP SHELL ============ */
.app{display:none;min-height:100vh}
.app.active{display:block}
.app-layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.app-layout.collapsed{grid-template-columns:72px 1fr}

.sidebar{
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0;
  overflow:hidden;transition:width var(--transition);
}
.sidebar-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-head .logo{font-size:16px}
.sidebar-head .logo span{white-space:nowrap;overflow:hidden}
.app-layout.collapsed .sidebar-head .logo span,
.app-layout.collapsed .sidebar .nav-label,
.app-layout.collapsed .sidebar-school,
.app-layout.collapsed .sidebar-user-info,
.app-layout.collapsed .nav-section-title{display:none}
.sidebar-school{padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.sidebar-school b{display:block;font-size:13px;color:var(--text)}
.sidebar-school span{font-size:11px;color:var(--text-2)}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-section-title{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:12px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;
  color:var(--text-2);font-weight:500;font-size:14px;transition:all var(--transition);
  margin-bottom:2px;position:relative;cursor:pointer;
}
.nav-item:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item svg{flex-shrink:0}
.nav-item .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:2px 6px;border-radius:999px;font-weight:700}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sidebar-user{
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;
  background:var(--surface-2);cursor:pointer;
}
.avatar{
  width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;
}
.avatar.sm{width:28px;height:28px;font-size:12px}
.avatar.lg{width:64px;height:64px;font-size:24px}
.sidebar-user-info{min-width:0;flex:1}
.sidebar-user-info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-info span{font-size:11px;color:var(--text-2)}
.sidebar-overlay{display:none}

.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.header{
  height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:30;
}
.header-title{font-size:16px;font-weight:700;flex:1;min-width:0}
.header-title small{display:block;font-size:12px;font-weight:400;color:var(--text-2)}
.breadcrumb{font-size:12px;color:var(--text-2);margin-bottom:2px}
.breadcrumb span{color:var(--text-3)}
.icon-btn{
  width:38px;height:38px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:all var(--transition);position:relative;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .dot{
  position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--danger);
  border-radius:50%;border:2px solid var(--surface);
}
.content{padding:24px;flex:1;max-width:1600px;width:100%;margin:0 auto}
.page{display:none;animation:fade .2s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--text-2);font-size:14px;margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;display:flex;flex-direction:column;gap:8px;transition:all var(--transition);
}
.stat:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stat-icon.p{background:var(--primary-soft);color:var(--primary)}
.stat-icon.s{background:var(--secondary-soft);color:var(--secondary)}
.stat-icon.g{background:var(--success-soft);color:var(--success)}
.stat-icon.w{background:var(--warning-soft);color:var(--warning)}
.stat-icon.d{background:var(--danger-soft);color:var(--danger)}
.stat-val{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat-label{font-size:13px;color:var(--text-2)}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.table-toolbar{
  display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--border);
  flex-wrap:wrap;align-items:center;
}
.search-box{
  position:relative;flex:1;min-width:200px;
}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search-box .input{padding-left:38px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{
  text-align:left;padding:12px 16px;background:var(--surface-2);
  font-weight:600;font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.td-actions{display:flex;gap:4px;justify-content:flex-end}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--text-2);flex-wrap:wrap;gap:8px}
.pagination-btns{display:flex;gap:4px}
.page-btn{
  min-width:34px;height:34px;padding:0 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-weight:500;font-size:13px;
}
.page-btn:hover:not(:disabled){background:var(--surface-2)}
.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-btn:disabled{opacity:.5;cursor:not-allowed}

.empty{

.flex{display:flex}.flex-1{flex:1}
.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-4{gap:16px}

@media(prefers-reduced-motion:reduce){

    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') el.innerHTML = v;

/* ============ TOAST ============ */
function toast(title, message='', type='info', timeout=4000){
  const wrap = $('#toast-wrap');
  const icons = {
    success: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>',

  const el = h('div', { class:`toast ${type}` },
    h('div', { class:'toast-icon', html: icons[type] || icons.info }),

      h('b', {}, title),

    )
  );
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'all .3s';

    el.style.opacity = '0';

  }, timeout);
}

/* ============ MODAL ============ */
function openModal({ title, body, footer, size='', onClose }){
  const ov = $('#modal-overlay'), modal = $('#modal');
  modal.className = 'modal ' + size;
  $('#modal-title').textContent = title || '';
  const bodyEl = $('#modal-body');
  bodyEl.innerHTML = '';
  if (typeof body === 'string') bodyEl.innerHTML = body;
  else if (body instanceof Node) bodyEl.appendChild(body);
  const footEl = $('#modal-foot');
  footEl.innerHTML = '';
  if (Array.isArray(footer)) footer.forEach(f => footEl.appendChild(f));
  else if (typeof footer === 'string') footEl.innerHTML = footer;
  else if (footer instanceof Node) footEl.appendChild(footer);
  else footEl.style.display = 'none';
  if (footer) footEl.style.display = 'flex';
  ov.classList.add('show');
  ov._onClose = onClose;
  setTimeout(() => {
    const first = bodyEl.querySelector('input,select,textarea,button');
    if (first) first.focus();
  }, 100);
}
function closeModal(){
  const ov = $('#modal-overlay');
  ov.classList.remove('show');
  if (typeof ov._onClose === 'function') { try{ov._onClose();}catch(e){} ov._onClose=null; }
}
$('#modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-overlay').classList.contains('show')) closeModal(); });

function confirmDialog(title, message, onConfirm, opts={}){
  const ok = h('button', { class:`btn ${opts.danger?'btn-danger':'btn-primary'}`, onclick: async (e) => {
    e.target.disabled = true;
    e.target.innerHTML = '<span class="spinner"></span> Memproses...';
    try { await onConfirm(); closeModal(); }
    catch(err){ toast('Gagal', err.message, 'error'); e.target.disabled=false; e.target.textContent = opts.okText || 'Konfirmasi'; }
  }}, opts.okText || 'Konfirmasi');
  openModal({
    title,
    size: 'sm',
    body: h('p', { class:'text-muted' }, message),
    footer: [
      h('button', { class:'btn btn-secondary', onclick: closeModal }, 'Batal'),
      ok
    ]
  });
}

}

function can(resource, action){
  const role = State.profile?.role || 'student';
  const p = PERMISSIONS[role];
  return p && p[resource] && p[resource].includes(action);
}

  /* ============ FIREBASE DATA SERVICE ============ */
const DB = {
  async get(path){
    const snap = await get(ref(db, path));
    return snap.exists() ? snap.val() : null;
  },
  async set(path, value){
    return set(ref(db, path), value);
  },
  async update(path, value){
    return update(ref(db, path), value);
  },
  async push(path, value){
    const r = push(ref(db, path));
    await set(r, value);
    return r.key;
  },
  async remove(path){
    return remove(ref(db, path));
  },
  listen(path, cb){
    const r = ref(db, path);
    const handler = onValue(r, cb, err => console.warn('listen err', path, err));
    State.listeners.push({ r, handler });
    return () => off(r, 'value', handler);
  },
  clearListeners(){
    State.listeners.forEach(({r, handler}) => off(r, 'value', handler));
    State.listeners = [];
  }
};
const tsNow = () => rtdbServerTimestamp();

/* ============ AUTH SERVICE ============ */
const AuthSvc = {
  async login(email, password){
    await setPersistence(auth, browserLocalPersistence);
    const cred = await signInWithEmailAndPassword(auth, email, password);
    return cred.user;
  },
  async register(email, password, displayName, role){
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName });
    // Buat profil user
    const profile = {
      uid: cred.user.uid,
      email,
      displayName,
      role,
      status: role === 'teacher' ? 'pending' : 'active',
      createdAt: tsNow(),
      updatedAt: tsNow()
    };
    await DB.set(`users/${cred.user.uid}`, profile);
    return cred.user;
  },
  async logout(){
    DB.clearListeners();
    await signOut(auth);
  },
  async resetPassword(email){
    await sendPasswordResetEmail(auth, email);
  }
};

/* ============ DATA LOADERS ============ */
async function loadProfile(user){
  let profile = await DB.get(`users/${user.uid}`);
  if (!profile){
    // Bootstrap: jika ini adalah akun pertama atau email tertentu, jadikan superadmin
    const existing = await DB.get('users');
    const isFirst = !existing || Object.keys(existing).length === 0;
    const role = isFirst ? 'superadmin' : 'student';
    profile = {
      uid: user.uid,
      email: user.email,
      displayName: user.displayName || user.email.split('@')[0],
      role,
      status: 'active',
      createdAt: tsNow(),
      updatedAt: tsNow()
    };
    await DB.set(`users/${user.uid}`, profile);
    toast('Selamat datang', isFirst ? 'Akun pertama menjadi Superadmin' : 'Profil dibuat', 'info');
  }
  return profile;
}

  $('#landing-root').innerHTML = '';
  renderAuth();
}
function renderAuth(){
  const root = $('#auth-root');
  root.innerHTML = '';
  const wrap = h('div', { class:'auth-wrap' });

  const card = h('div', { class:'auth-card' });
  card.appendChild(h('div', { class:'auth-header' },
    h('div', { class:'logo' },
      h('div', { class:'logo-mark' }, 'C'),
      h('span', {}, 'CAZOO')
    ),
    h('h1', {}, authMode === 'login' ? 'Masuk ke CAZOO' : 'Buat Akun Baru'),
    h('p', {}, authMode === 'login' ? 'Selamat datang kembali! Silakan masuk.' : 'Daftarkan akun Anda untuk memulai.')
  ));

  const tabs = h('div', { class:'auth-tabs' },
    h('button', { class:`auth-tab ${authMode==='login'?'active':''}`, onclick: () => { authMode='login'; renderAuth(); } }, 'Masuk'),
    h('button', { class:`auth-tab ${authMode==='register'?'active':''}`, onclick: () => { authMode='register'; renderAuth(); } }, 'Daftar')
  );
  card.appendChild(tabs);

  const form = h('form', { onsubmit: e => e.preventDefault() });

  if (authMode === 'login'){
    form.appendChild(h('div', { class:'form-group' },
      h('label', { class:'label', for:'login-email' }, 'Email'),
      h('input', { class:'input', type:'email', id:'login-email', placeholder:'nama@sekolah.sch.id', required:true, autocomplete:'email' })
    ));
    const pwGroup = h('div', { class:'form-group' },
      h('label', { class:'label', for:'login-pw' }, 'Kata Sandi'),
      h('div', { class:'pw-wrap' },
        h('input', { class:'input', type:'password', id:'login-pw', placeholder:'••••••••', required:true, autocomplete:'current-password' }),
        h('button', { type:'button', class:'pw-toggle', onclick: (e) => {
          const inp = $('#login-pw');
          const isPw = inp.type === 'password';
          inp.type = isPw ? 'text' : 'password';
          e.currentTarget.innerHTML = isPw ? Icons.eyeOff : Icons.eye;
        }, html:Icons.eye })
      )
    );
    form.appendChild(pwGroup);
    form.appendChild(h('div', { class:'auth-links' },
      h('a', { href:'#', onclick: async (e) => { e.preventDefault(); openForgotDialog(); } }, 'Lupa kata sandi?'),
      h('a', { href:'#', onclick: (e) => { e.preventDefault(); authMode='register'; renderAuth(); } }, 'Belum punya akun?')
    ));
    form.appendChild(h('button', { class:'btn btn-primary btn-lg', type:'submit', style:'width:100%;margin-top:20px', onclick: doLogin }, 'Masuk'));
  } else {
    form.appendChild(h('div', { class:'form-group' },
      h('label', { class:'label' }, 'Daftar Sebagai'),
      h('div', { class:'role-picker' },
        h('button', { type:'button', class:'role-opt active', 'data-role':'student', onclick: e => {
          $$('.role-opt', form).forEach(x => x.classList.remove('active'));
          e.currentTarget.classList.add('active');
        }, html:Icons.student + '<br>Murid' }),
        h('button', { type:'button', class:'role-opt', 'data-role':'teacher', onclick: e => {
          $$('.role-opt', form).forEach(x => x.classList.remove('active'));
          e.currentTarget.classList.add('active');
        }, html:Icons.teacher + '<br>Guru' })
      )
    ));
    form.appendChild(h('div', { class:'form-group' },
      h('label', { class:'label', for:'reg-name' }, 'Nama Lengkap'),
      h('input', { class:'input', id:'reg-name', placeholder:'Nama lengkap Anda', required:true })
    ));
    form.appendChild(h('div', { class:'form-group' },
      h('label', { class:'label', for:'reg-email' }, 'Email'),
      h('input', { class:'input', type:'email', id:'reg-email', placeholder:'nama@sekolah.sch.id', required:true, autocomplete:'email' })
    ));
    form.appendChild(h('div', { class:'form-group' },
      h('label', { class:'label', for:'reg-pw' }, 'Kata Sandi'),
      h('input', { class:'input', type:'password', id:'reg-pw', required:true, minlength:6, placeholder:'Minimal 6 karakter', autocomplete:'new-password' })
    ));
    form.appendChild(h('button', { class:'btn btn-primary btn-lg', type:'submit', style:'width:100%;margin-top:12px', onclick: doRegister }, 'Daftar'));
  }

  card.appendChild(form);
  card.appendChild(h('div', { style:'text-align:center;margin-top:20px' },
    h('a', { href:'#', class:'text-sm text-muted', onclick: (e) => { e.preventDefault(); showLanding(); } }, '← Kembali ke beranda')
  ));

  wrap.appendChild(card);
  root.appendChild(wrap);
  $('#app-root').innerHTML = '';
  $('#app-root').classList.remove('active');
}

async function doLogin(e){
  const btn = e.currentTarget;
  const email = $('#login-email').value.trim();
  const pw = $('#login-pw').value;
  if (!email || !pw){ toast('Validasi', 'Email dan kata sandi wajib diisi', 'warning'); return; }
  btn.disabled = true;
  const orig = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Memproses...';
  try {
    await AuthSvc.login(email, pw);
    // onAuthStateChanged akan menangani redirect
  } catch(err){
    toast('Login gagal', friendlyAuthError(err), 'error');
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

async function doRegister(e){
  const btn = e.currentTarget;
  const name = $('#reg-name').value.trim();
  const email = $('#reg-email').value.trim();
  const pw = $('#reg-pw').value;
  const role = $('.role-opt.active', btn.closest('form'))?.dataset.role || 'student';
  if (!name || !email || !pw){ toast('Validasi', 'Semua field wajib diisi', 'warning'); return; }
  if (pw.length < 6){ toast('Validasi', 'Kata sandi minimal 6 karakter', 'warning'); return; }
  btn.disabled = true;
  const orig = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Memproses...';
  try {
    await AuthSvc.register(email, pw, name, role);
    toast('Berhasil', role === 'teacher' ? 'Akun guru menunggu persetujuan admin' : 'Akun berhasil dibuat', 'success');
  } catch(err){
    toast('Pendaftaran gagal', friendlyAuthError(err), 'error');
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

function openForgotDialog(){
  const input = h('input', { class:'input', type:'email', placeholder:'nama@sekolah.sch.id' });
  const ok = h('button', { class:'btn btn-primary', onclick: async (e) => {
    const email = input.value.trim();
    if (!email){ toast('Validasi', 'Masukkan email Anda', 'warning'); return; }
    e.target.disabled = true;
    e.target.innerHTML = '<span class="spinner"></span> Mengirim...';
    try {
      await AuthSvc.resetPassword(email);
      toast('Email terkirim', 'Periksa kotak masuk Anda untuk tautan reset', 'success');
      closeModal();
    } catch(err){
      toast('Gagal', friendlyAuthError(err), 'error');
      e.target.disabled = false;
      e.target.textContent = 'Kirim';
    }
  }}, 'Kirim Tautan Reset');
  openModal({
    title: 'Lupa Kata Sandi',
    size: 'sm',
    body: h('div', {},
      h('p', { class:'text-muted mb-4' }, 'Masukkan email terdaftar Anda. Kami akan mengirim tautan untuk mereset kata sandi.'),
      h('div', { class:'form-group' }, h('label', { class:'label' }, 'Email'), input)
    ),
    footer: [ h('button', { class:'btn btn-secondary', onclick: closeModal }, 'Batal'), ok ]
  });
  setTimeout(() => input.focus(), 100);
}

function friendlyAuthError(err){
  const code = err?.code || '';
  const map = {
    'auth/invalid-email': 'Format email tidak valid.',
    'auth/user-not-found': 'Akun tidak ditemukan.',
    'auth/wrong-password': 'Kata sandi salah.',
    'auth/invalid-credential': 'Email atau kata sandi salah.',
    'auth/email-already-in-use': 'Email sudah terdaftar.',
    'auth/weak-password': 'Kata sandi terlalu lemah (minimal 6 karakter).',
    'auth/too-many-requests': 'Terlalu banyak percobaan. Coba beberapa saat lagi.',
    'auth/network-request-failed': 'Koneksi internet bermasalah.',
    'PERMISSION_DENIED': 'Akses ditolak. Periksa Security Rules Firebase.'
  };
  return map[code] || err.message || 'Terjadi kesalahan.';
}

let sidebarCollapsed = localStorage.getItem('cazoo_sidebar_collapsed') === '1';
let sidebarOpenMobile = false;

function renderAppShell(){
  const appRoot = $('#app-root');
  const isExamMode = State.page === 'take-exam' && State.examAttempt;
  if (isExamMode) {
    // Exam shell ditangani oleh renderExam()
    return;
  }
  const role = State.profile?.role || 'student';
  const menu = getMenuForRole();
  const school = State.school || { name:'Sekolah', year:'2024/2025', semester:'Ganjil' };

  appRoot.innerHTML = '';
  appRoot.classList.add('active');

  const sidebar = h('aside', { class:`sidebar ${sidebarOpenMobile?'open':''}` });
  sidebar.appendChild(h('div', { class:'sidebar-head' },
    h('div', { class:'logo' },
      h('div', { class:'logo-mark' }, 'C'),
      h('span', {}, 'CAZOO')
    ),
    h('button', { class:'icon-btn', onclick: () => {
      sidebarCollapsed = !sidebarCollapsed;
      localStorage.setItem('cazoo_sidebar_collapsed', sidebarCollapsed ? '1' : '0');
      renderAppShell();
    }, title:'Perkecil sidebar', html:Icons.menu })
  ));
  sidebar.appendChild(h('div', { class:'sidebar-school' },
    h('b', {}, school.name || 'Sekolah CAZOO'),
    h('span', {}, `${school.year || '2024/2025'} • Semester ${school.semester || 'Ganjil'}`)
  ));
  const nav = h('div', { class:'sidebar-nav' });
  menu.forEach(section => {
    nav.appendChild(h('div', { class:'nav-section-title' }, section.sec));
    section.items.forEach(item => {
      nav.appendChild(h('a', {
        href: `#${item.id}`,
        class: `nav-item ${State.page === item.id ? 'active' : ''}`,
        onclick: (e) => { e.preventDefault(); navigate(item.id); sidebarOpenMobile = false; }
      },
        h('span', { html:item.icon }),
        h('span', { class:'nav-label' }, item.label)
      ));
    });
  });
  sidebar.appendChild(nav);

  const profile = State.profile || {};
  const initials = (profile.displayName || 'U').split(' ').map(s => s[0]).slice(0,2).join('').toUpperCase();
  sidebar.appendChild(h('div', { class:'sidebar-foot' },
    h('button', { class:'nav-item', onclick: toggleTheme },
      h('span', { html: State.theme === 'light' ? Icons.moon : Icons.sun }),
      h('span', { class:'nav-label' }, State.theme === 'light' ? 'Mode Gelap' : 'Mode Terang')
    ),
    h('div', { class:'sidebar-user', onclick: () => navigate('profile') },
      h('div', { class:'avatar' }, initials),
      h('div', { class:'sidebar-user-info' },
        h('b', {}, profile.displayName || 'Pengguna'),
        h('span', {}, ROLE_LABELS[role] || role)
      )
    ),
    h('button', { class:'nav-item', onclick: async () => {
      try { await AuthSvc.logout(); } catch(e){ toast('Gagal logout', e.message, 'error'); }
    }},
      h('span', { html:Icons.logout }),
      h('span', { class:'nav-label' }, 'Keluar')
    )
  ));

  const overlay = h('div', { class:`sidebar-overlay ${sidebarOpenMobile?'show':''}`, onclick: () => {
    sidebarOpenMobile = false; renderAppShell();
  }});

  const header = h('header', { class:'header' },
    h('button', { class:'icon-btn', style:'display:none', id:'mobile-menu-btn', onclick: () => {
      sidebarOpenMobile = true; renderAppShell();
    }, html:Icons.menu }),
    h('div', { class:'header-title' },
      h('div', { class:'breadcrumb' }, 'CAZOO ', h('span', {}, '/ ' + (menu.flatMap(s=>s.items).find(i=>i.id===State.page)?.label || 'Dashboard'))),
      h('div', {}, profile.displayName || 'Pengguna', ' ', h('small', {}, ROLE_LABELS[role] || ''))
    ),
    h('button', { class:'icon-btn', title:'Notifikasi', html:Icons.bell }),
    h('div', { class:'avatar sm', onclick: () => navigate('profile') }, initials)
  );

  const content = h('main', { class:'content' });
  content.id = 'page-container';

  const layout = h('div', { class:`app-layout ${sidebarCollapsed?'collapsed':''}` },
    sidebar, h('div', { class:'main' }, header, content)
  );

  appRoot.appendChild(overlay);
  appRoot.appendChild(layout);

  // Tampilkan tombol mobile
  requestAnimationFrame(() => {
    const btn = $('#mobile-menu-btn');
    if (btn && window.innerWidth <= 900) btn.style.display = 'inline-flex';
  });

  renderPage();
  window.onresize = () => {
    const btn = $('#mobile-menu-btn');
    if (btn) btn.style.display = window.innerWidth <= 900 ? 'inline-flex' : 'none';
  };
}

/* ============ ROUTING ============ */
function navigate(page){
  State.page = page;
  location.hash = '#' + page;
  if (page === 'take-exam'){
    renderExamPage();
    return;
  }
  renderAppShell();
}
window.addEventListener('hashchange', () => {
  const page = location.hash.slice(1) || 'dashboard';
  if (State.user && page !== State.page){
    State.page = page;
    if (page === 'take-exam') renderExamPage();
    else renderAppShell();
  }
});

/* ============ PAGE RENDERER ============ */
function renderPage(){
  const container = $('#page-container');
  if (!container) return;
  container.innerHTML = '';
  const role = State.profile?.role || 'student';
  const map = {
    dashboard: () => renderDashboard(container, role),
    analytics: () => renderAnalytics(container, role),
    users: () => renderUsersPage(container),
    classes: () => renderClassesPage(container, role),
    'my-classes': () => renderClassesPage(container, 'student'),
    subjects: () => renderSubjectsPage(container),
    questions: () => renderQuestionsPage(container, role),
    exams: () => renderExamsPage(container, role),
    'my-exams': () => renderStudentExamsPage(container),
    assignments: () => renderAssignmentsPage(container, role),
    'my-assignments': () => renderStudentAssignmentsPage(container),
    announcements: () => renderAnnouncementsPage(container),
    results: () => renderResultsPage(container),
    'my-results': () => renderStudentResultsPage(container),
    reports: () => renderReportsPage(container),
    audit: () => renderAuditPage(container),
    settings: () => renderSettingsPage(container),
    profile: () => renderProfilePage(container)
  };
  const fn = map[State.page] || map.dashboard;
  try { fn(); }
  catch(err){ console.error(err); container.appendChild(errorState(err.message)); }
}

function errorState(msg){
  return h('div', { class:'empty' },
    h('div', { class:'empty-icon', html: Icons.shield }),
    h('h3', {}, 'Terjadi kesalahan'),
    h('p', {}, msg || 'Silakan muat ulang halaman.'),
    h('button', { class:'btn btn-primary', onclick: () => renderPage() }, 'Coba Lagi')
  );
}
function emptyState(title, desc, actionLabel, onAction){
  return h('div', { class:'empty' },
    h('div', { class:'empty-icon', html: Icons.dashboard }),
    h('h3', {}, title),
    h('p', {}, desc),
    actionLabel ? h('button', { class:'btn btn-primary', onclick: onAction }, actionLabel) : null
  );
}
function loadingState(){
  return h('div', { class:'card', style:'padding:32px' },
    h('div', { class:'skeleton sk-line', style:'width:40%;height:20px' }),
    h('div', { class:'skeleton sk-line', style:'width:80%;margin-top:16px' }),
    h('div', { class:'skeleton sk-line', style:'width:60%' }),
    h('div', { class:'skeleton sk-line', style:'width:70%' })
  );
}

/* ============ DASHBOARD ============ */
async function renderDashboard(container, role){
  container.appendChild(h('div', { class:'page active' },
    h('div', { class:'page-head' },
      h('div', {},
        h('h1', {}, `Halo, ${State.profile?.displayName || 'Pengguna'}`),
        h('p', {}, `Selamat datang di CAZOO. Ringkasan aktivitas ${ROLE_LABELS[role] || role}.`)
      ),
      h('div', { class:'text-sm text-muted' }, fmtDate(now(), { weekday:'long', day:'numeric', month:'long', year:'numeric' }))
    ),
    loadingState()
  ));
  try {
    const stats = await loadDashboardStats(role);
    const wrapper = $('.page', container);
    wrapper.innerHTML = '';
    wrapper.appendChild(h('div', { class:'page-head' },
      h('div', {},
        h('h1', {}, `Halo, ${State.profile?.displayName || 'Pengguna'}`),
        h('p', {}, `Ringkasan ${ROLE_LABELS[role] || role} hari ini.`)
      )
    ));
    wrapper.appendChild(renderStatCards(stats.cards));
    if (stats.upcoming?.length){
      wrapper.appendChild(h('div', { class:'card mb-6' },
        h('div', { class:'card-header' }, h('div', { class:'card-title' }, 'Ujian Terdekat')),
        h('div', { class:'table-scroll' },
          h('table', {},
            h('thead', {}, h('tr', {}, h('th', {}, 'Judul'), h('th', {}, 'Mulai'), h('th', {}, 'Durasi'), h('th', {}, 'Status'))),
            h('tbody', {}, ...stats.upcoming.slice(0,5).map(e => h('tr', {},
              h('td', {}, e.title),
              h('td', {}, fmtDateTime(e.startAt)),
              h('td', {}, (e.duration || 0) + ' menit'),
              h('td', {}, h('span', { class:'badge badge-info' }, e.status || 'terjadwal'))
            )))
          )
        )
      ));
    }
    if (stats.recent?.length){
      wrapper.appendChild(h('div', { class:'card' },
        h('div', { class:'card-header' }, h('div', { class:'card-title' }, 'Aktivitas Terbaru')),
        h('div', {}, ...stats.recent.map(r => h('div', { style:'padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap' },
          h('div', {},
            h('b', { style:'font-size:14px' }, r.title),
            h('div', { class:'text-sm text-muted' }, r.desc || '')
          ),
          h('div', { class:'text-xs text-muted' }, fmtDateTime(r.time))
        )))
      ));
    }
    if (!stats.cards.length || stats.cards.every(c => c.value === 0)){
      wrapper.appendChild(emptyState('Belum ada data', 'Mulai dengan menambahkan data pertama Anda.', 'Buka Menu', () => navigate(role === 'student' ? 'my-classes' : 'classes')));
    }
  } catch(err){
    console.error(err);
    container.innerHTML = '';
    container.appendChild(errorState(err.message));
  }
}

async function loadDashboardStats(role){
  const cards = [];
  const upcoming = [];
  const recent = [];
  try {
    if (can('users','r')){
      const users = await DB.get('users') || {};
      const arr = Object.values(users);
      cards.push({ label:'Total Pengguna', value: arr.length, icon:'users', color:'p' });
      cards.push({ label:'Guru', value: arr.filter(u=>u.role==='teacher').length, icon:'teacher', color:'s' });
      cards.push({ label:'Murid', value: arr.filter(u=>u.role==='student').length, icon:'student', color:'g' });
      arr.slice(-5).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(u => {
        recent.push({ title: u.displayName || u.email, desc: `Terdaftar sebagai ${ROLE_LABELS[u.role] || u.role}`, time: u.createdAt || now() });
      });
    }
    if (can('classes','r')){
      const classes = await DB.get('classes') || {};
      cards.push({ label:'Total Kelas', value: Object.keys(classes).length, icon:'class', color:'p' });
    }
    if (can('subjects','r')){
      const subj = await DB.get('subjects') || {};
      cards.push({ label:'Mata Pelajaran', value: Object.keys(subj).length, icon:'subject', color:'s' });
    }
    if (can('exams','r')){
      const exams = await DB.get('exams') || {};
      const arr = Object.values(exams);
      const nowTs = now();
      cards.push({ label:'Total Ujian', value: arr.length, icon:'exam', color:'p' });
      cards.push({ label:'Ujian Aktif', value: arr.filter(e => e.status === 'active').length, icon:'clock', color:'g' });
      cards.push({ label:'Ujian Mendatang', value: arr.filter(e => e.startAt && e.startAt > nowTs && e.status !== 'archived').length, icon:'calendar', color:'w' });
      arr.filter(e => e.startAt && e.startAt > nowTs).sort((a,b)=>a.startAt-b.startAt).slice(0,5).forEach(e => upcoming.push(e));
    }
    if (can('assignments','r')){
      const asg = await DB.get('assignments') || {};
      cards.push({ label:'Total Tugas', value: Object.keys(asg).length, icon:'assignment', color:'s' });
    }
    // Filter untuk student: hanya yang relevan
    if (role === 'student'){
      const myExams = upcoming.filter(e => !e.classId || true);
      return { cards: cards.filter(c => ['Total Ujian','Ujian Aktif','Ujian Mendatang','Total Tugas'].includes(c.label)), upcoming: myExams, recent: [] };
    }
    return { cards, upcoming, recent };
  } catch(err){
    console.warn('loadDashboardStats', err);
    return { cards:[], upcoming:[], recent:[] };
  }
}

function openQuestionForm(q, ownerUid){
  const isEdit = !!q;
  const typeIn = h('select', { class:'select' },
    ...[
      {v:'pg', t:'Pilihan Ganda'}, {v:'pgk', t:'PG Kompleks'}, {v:'bs', t:'Benar/Salah'},
      {v:'isian', t:'Isian Singkat'}, {v:'esai', t:'Esai'}, {v:'numerik', t:'Numerik'},
      {v:'jodoh', t:'Menjodohkan'}
    ].map(o => h('option', { value:o.v, selected: q?.type===o.v }, o.t))
  );
  const diffIn = h('select', { class:'select' },
    ...['mudah','sedang','sulit'].map(d => h('option', { value:d, selected:q?.difficulty===d }, d))
  );
  const textIn = h('textarea', { class:'textarea', placeholder:'Tulis pertanyaan...', style:'min-height:120px' }, q?.text || '');
  const pointsIn = h('input', { class:'input', type:'number', value:q?.points || 1, min:1 });
  const optionsWrap = h('div', {});

  function renderOptions(){
    optionsWrap.innerHTML = '';
    const t = typeIn.value;
    if (t === 'pg' || t === 'pgk'){
      optionsWrap.appendChild(h('label', { class:'label' }, 'Pilihan Jawaban'));
      const opts = q?.options || ['','','',''];
      const keys = q?.answer || [];
      opts.forEach((o, i) => {
        optionsWrap.appendChild(h('div', { style:'display:flex;gap:8px;margin-bottom:8px;align-items:center' },
          h('input', { type:'radio', name:'ans', value:i, checked: Array.isArray(keys)?keys.includes(i):keys===i, 'data-idx':i }),
          h('input', { class:'input opt-input', value:o, placeholder:`Pilihan ${String.fromCharCode(65+i)}`, 'data-idx':i })
        ));
      });
      optionsWrap.appendChild(h('button', { class:'btn btn-secondary btn-sm', type:'button', onclick: () => {
        const div = h('div', { style:'display:flex;gap:8px;margin-bottom:8px;align-items:center' },
          h('input', { type:'radio', name:'ans', value: optionsWrap.querySelectorAll('.opt-input').length }),
          h('input', { class:'input opt-input', placeholder:'Pilihan baru' })
        );
        optionsWrap.insertBefore(div, optionsWrap.querySelector('button'));
      }}, '+ Tambah Pilihan'));
    } else if (t === 'bs'){
      optionsWrap.appendChild(h('label', { class:'label' }, 'Kunci Jawaban'));
      optionsWrap.appendChild(h('select', { class:'select', id:'bs-ans' },
        h('option', { value:'true', selected: q?.answer==='true' }, 'Benar'),
        h('option', { value:'false', selected: q?.answer==='false' }, 'Salah')
      ));
    } else if (t === 'isian' || t === 'numerik'){
      optionsWrap.appendChild(h('label', { class:'label' }, 'Kunci Jawaban'));
      optionsWrap.appendChild(h('input', { class:'input', id:'short-ans', value: q?.answer || '', placeholder: t === 'numerik' ? 'Angka' : 'Jawaban singkat' }));
    } else if (t === 'esai'){
      optionsWrap.appendChild(h('p', { class:'help' }, 'Soal esai tidak memiliki kunci jawaban otomatis.'));
    }
  }
  renderOptions();
  typeIn.addEventListener('change', renderOptions);

  openModal({
    title: isEdit ? 'Edit Soal' : 'Buat Soal Baru',
    size:'lg',
    body: h('div', {},
      h('div', { class:'form-row' },
        h('div', { class:'form-group' }, h('label', { class:'label' }, 'Tipe Soal'), typeIn),
        h('div', { class:'form-group' }, h('label', { class:'label' }, 'Kesulitan'), diffIn)
      ),
      h('div', { class:'form-group' }, h('label', { class:'label' }, 'Pertanyaan'), textIn),
      optionsWrap,
      h('div', { class:'form-group', style:'margin-top:16px' }, h('label', { class:'label' }, 'Bobot Nilai'), pointsIn)
    ),
    footer: [
      h('button', { class:'btn btn-secondary', onclick: closeModal }, 'Batal'),
      h('button', { class:'btn btn-primary', onclick: async (e) => {
        e.target.disabled = true; e.target.innerHTML = '<span class="spinner"></span> Menyimpan...';
        try {
          const type = typeIn.value;
          const data = { type, difficulty:diffIn.value, text:textIn.value.trim(), points: Number(pointsIn.value) || 1, updatedAt: now() };
          if (type === 'pg' || type === 'pgk'){
            data.options = $$('.opt-input', document).map(i => i.value.trim());
            const radios = $$('input[name="ans"]:checked', document);
            data.answer = radios.length ? Number(radios[0].value) : 0;
          } else if (type === 'bs'){ data.answer = $('#bs-ans').value; }
          else if (type === 'isian' || type === 'numerik'){ data.answer = $('#short-ans').value.trim(); }
          else { data.answer = null; }
          const owner = isEdit ? (ownerUid || State.user.uid) : State.user.uid;
          if (isEdit) await DB.update(`questionBanks/${owner}/${q.id}`, data);
          else {
            const r = push(ref(db, `questionBanks/${State.user.uid}`));
            await set(r, { id:r.key, ...data, createdAt: now(), owner: State.user.uid });
          }
          toast('Berhasil', isEdit ? 'Soal diperbarui' : 'Soal ditambahkan', 'success');
          closeModal(); renderPage();
        } catch(err){ toast('Gagal', err.message, 'error'); e.target.disabled=false; e.target.textContent='Simpan'; }
      }}, 'Simpan')
    ]
  });
}

async function startExam(ex){
  // Buat attempt
  const attemptId = 'a' + now();
  const attempt = {
    attemptId,
    examId: ex.id,
    userId: State.user.uid,
    userName: State.profile.displayName,
    startedAt: now(),
    endsAt: now() + (ex.duration || 60) * 60000,
    status: 'in_progress',
    answers: {}
  };
  try {
    await DB.set(`examAttempts/${ex.id}/${State.user.uid}/${attemptId}`, attempt);
    State.examAttempt = attempt;
    State.currentExam = ex;
    navigate('take-exam');
  } catch(err){
    toast('Gagal', err.message, 'error');
  }
}

/* ============ EXAM TAKING ============ */
let examTick = null;
function renderExamPage(){
  const appRoot = $('#app-root');
  appRoot.innerHTML = '';
  appRoot.classList.add('active');
  const ex = State.currentExam;
  const at = State.examAttempt;
  if (!ex || !at){ navigate('my-exams'); return; }

  const shell = h('div', { class:'exam-shell' });
  const remaining = Math.max(0, at.endsAt - now());

  const timerEl = h('div', { class:`exam-timer ${remaining < 60000 ? 'danger' : remaining < 300000 ? 'warn' : ''}` },
    h('span', { html:Icons.clock }),
    h('span', { id:'exam-time' }, fmtDur(remaining))
  );

  shell.appendChild(h('div', { class:'exam-top' },
    h('h2', {}, ex.title),
    h('span', { class:'badge badge-info' }, ex.subject || 'Umum'),
    timerEl,
    h('span', { class:'save-status', id:'save-status' }, 'Tersimpan otomatis'),
    h('button', { class:'btn btn-primary', onclick: confirmSubmit }, 'Kumpulkan')
  ));

  const body = h('div', { class:'exam-body' });
  const questionArea = h('div', { id:'question-area' });
  const navPanel = h('div', { class:'exam-nav-panel' },
    h('h3', { style:'font-size:14px;font-weight:700;margin-bottom:8px' }, 'Navigasi Soal'),
    h('div', { class:'nav-grid', id:'nav-grid' }),
    h('div', { class:'legend' },
      h('div', {}, h('span', { class:'legend-dot' }), 'Belum dijawab'),
      h('div', {}, h('span', { class:'legend-dot a' }), 'Sudah dijawab'),
      h('div', {}, h('span', { class:'legend-dot f' }), 'Ditandai')
    ),
    h('div', { class:'mt-4', style:'display:flex;flex-direction:column;gap:6px' },
      h('button', { class:'btn btn-secondary btn-sm', onclick: () => { State.examAttempt._prev = true; navigate('take-exam'); } }, '← Sebelumnya'),
      h('button', { class:'btn btn-primary btn-sm', onclick: () => { State.examAttempt._next = true; navigate('take-exam'); } }, 'Berikutnya →')
    )
  );
  body.appendChild(questionArea);
  body.appendChild(navPanel);
  shell.appendChild(body);

  appRoot.appendChild(shell);

  const questions = buildExamQuestions(ex);
  State.examQuestions = questions;
  if (!questions.length){
    questionArea.appendChild(h('div', { class:'card' }, h('div', { class:'empty' },
      h('h3', {}, 'Ujian belum memiliki soal'),
      h('p', {}, 'Hubungi guru Anda.'))
    ));
    return;
  }
  if (State.currentQIdx == null) State.currentQIdx = 0;
  renderCurrentQuestion(questions);

  // Timer
  if (examTick) clearInterval(examTick);
  examTick = setInterval(() => {
    const rem = Math.max(0, at.endsAt - now());
    const t = $('#exam-time');
    if (t) t.textContent = fmtDur(rem);
    const timer = $('.exam-timer');
    if (timer){
      timer.classList.toggle('danger', rem < 60000);
      timer.classList.toggle('warn', rem >= 60000 && rem < 300000);
    }
    if (rem <= 0){
      clearInterval(examTick);
      submitExam(true);
    }
  }, 1000);
}

function buildExamQuestions(ex){
  // Ambil soal dari exam.questionIds (array) atau buat fallback dari bank soal
  if (ex.questionIds && ex.questionIds.length) return ex.questionIds.map((q, i) => ({ ...q, _idx:i }));
  // Fallback: ambil dari bank soal guru pembuat
  return [];
}

let currentQIdx = 0;
function renderCurrentQuestion(questions){
  const area = $('#question-area');
  if (!area) return;
  area.innerHTML = '';
  const idx = Math.max(0, Math.min(currentQIdx, questions.length - 1));
  State.currentQIdx = idx;
  const q = questions[idx];
  const at = State.examAttempt;
  const answer = at.answers?.[q.id];

  const card = h('div', { class:'question-card' });
  card.appendChild(h('div', { class:'q-head' },
    h('div', { class:'q-index' }, `Soal ${idx+1} / ${questions.length}`),
    h('div', { style:'display:flex;gap:8px' },
      h('button', { class:`icon-btn ${answer?.flagged?'':''}`, style: answer?.flagged ? 'color:var(--warning)' : '', title:'Tandai', onclick: () => {
        toggleFlag(q.id); renderCurrentQuestion(questions);
      }, html:Icons.flag })
    )
  ));
  card.appendChild(h('div', { class:'q-text', html: esc(q.text || '').replace(/\n/g,'<br>') }));

  const opts = h('div', { class:'q-options' });
  if (q.type === 'pg' || q.type === 'pgk'){
    const optsArr = q.options || [];
    optsArr.forEach((o, i) => {
      const selected = (Array.isArray(answer?.value) && answer.value.includes(i)) || answer?.value === i;
      opts.appendChild(h('label', { class:`opt ${selected?'selected':''}`, onclick: (e) => {
        e.preventDefault();
        setAnswer(q.id, i, q);
        renderCurrentQuestion(questions);
      }},
        h('div', { class:'opt-key' }, String.fromCharCode(65+i)),
        h('div', {}, o)
      ));
    });
  } else if (q.type === 'bs'){
    ['Benar','Salah'].forEach((t, i) => {
      const v = i === 0 ? 'true' : 'false';
      const selected = String(answer?.value) === v;
      opts.appendChild(h('label', { class:`opt ${selected?'selected':''}`, onclick: (e) => {
        e.preventDefault(); setAnswer(q.id, v, q); renderCurrentQuestion(questions);
      }},
        h('div', { class:'opt-key' }, t[0]),
        h('div', {}, t)
      ));
    });
  } else if (q.type === 'esai' || q.type === 'isian' || q.type === 'numerik'){
    const inp = h(q.type === 'esai' ? 'textarea' : 'input', {
      class: q.type === 'esai' ? 'textarea' : 'input',
      placeholder: 'Tulis jawaban Anda...',
      value: answer?.value || '',
      oninput: e => { debounceSetAnswer(q.id, e.target.value); }
    });
    opts.appendChild(inp);
  } else {
    opts.appendChild(h('p', { class:'text-muted' }, 'Tipe soal tidak didukung.'));
  }
  card.appendChild(opts);

  card.appendChild(h('div', { class:'q-actions' },
    h('button', { class:'btn btn-secondary', disabled: idx===0, onclick: () => {
      State.currentQIdx = idx - 1; renderCurrentQuestion(questions); updateNavGrid();
    }}, '← Sebelumnya'),
    h('span', { class:'save-status', id:'save-status' }, 'Tersimpan otomatis'),
    h('button', { class:'btn btn-primary', disabled: idx===questions.length-1, onclick: () => {
      State.currentQIdx = idx + 1; renderCurrentQuestion(questions); updateNavGrid();
    }}, 'Berikutnya →')
  ));
  area.appendChild(card);
  updateNavGrid();
}

function updateNavGrid(){
  const grid = $('#nav-grid');
  if (!grid) return;
  grid.innerHTML = '';
  const questions = State.examQuestions || [];
  questions.forEach((q, i) => {
    const at = State.examAttempt;
    const ans = at.answers?.[q.id];
    const cls = ['q-num'];
    if (i === currentQIdx) cls.push('current');
    else if (ans?.flagged) cls.push('flagged');
    else if (ans) cls.push('answered');
    grid.appendChild(h('button', { class: cls.join(' '), onclick: () => {
      State.currentQIdx = i; renderCurrentQuestion(questions);
    }}, String(i+1)));
  });
}

function setAnswer(qid, value, q){
  if (!State.examAttempt.answers) State.examAttempt.answers = {};
  State.examAttempt.answers[qid] = { value, updatedAt: now() };
  syncAnswer(qid);
}

let debounceTimers = {};
function debounceSetAnswer(qid, value){
  if (!State.examAttempt.answers) State.examAttempt.answers = {};
  State.examAttempt.answers[qid] = { value, updatedAt: now() };
  const el = $('#save-status');
  if (el){ el.textContent = 'Menyimpan...'; el.className = 'save-status saving'; }
  clearTimeout(debounceTimers[qid]);
  debounceTimers[qid] = setTimeout(() => syncAnswer(qid), 600);
}

async function syncAnswer(qid){
  const at = State.examAttempt;
  const el = $('#save-status');
  try {
    await DB.set(`examAnswers/${at.examId}/${State.user.uid}/${at.attemptId}/${qid}`, {
      value: at.answers[qid].value,
      updatedAt: now()
    });
    await DB.update(`examAttempts/${at.examId}/${State.user.uid}/${at.attemptId}/answers/${qid}`, at.answers[qid]);
    if (el){ el.textContent = 'Tersimpan'; el.className = 'save-status saved'; }
  } catch(err){
    if (el){ el.textContent = 'Gagal menyimpan'; el.className = 'save-status error'; }
    console.warn('save err', err);
  }
}

function toggleFlag(qid){
  if (!State.examAttempt.answers) State.examAttempt.answers = {};
  const cur = State.examAttempt.answers[qid] || { value:null };
  cur.flagged = !cur.flagged;
  cur.updatedAt = now();
  State.examAttempt.answers[qid] = cur;
  syncAnswer(qid);
}

function confirmSubmit(){
  const at = State.examAttempt;
  const questions = State.examQuestions || [];
  const unanswered = questions.filter(q => {
    const a = at.answers?.[q.id];
    return !a || a.value == null || a.value === '';
  }).length;
  confirmDialog('Kumpulkan Ujian?', `Anda memiliki ${unanswered} soal belum dijawab dari ${questions.length} soal. Setelah dikumpulkan, Anda tidak dapat mengubah jawaban.`, async () => {
    await submitExam(false);
  }, { okText:'Kumpulkan Sekarang' });
}

async function submitExam(auto){
  const at = State.examAttempt;
  if (!at) return;
  try {
    const scoreData = autoGrade(State.examQuestions || [], at.answers || {});
    await DB.update(`examAttempts/${at.examId}/${State.user.uid}/${at.attemptId}`, {
      status: 'submitted',
      submittedAt: now(),
      autoSubmitted: !!auto,
      ...scoreData
    });
    await DB.set(`examResults/${at.examId}/${State.user.uid}/${at.attemptId}`, {
      examId: at.examId,
      userId: State.user.uid,
      userName: State.profile.displayName,
      attemptId: at.attemptId,
      submittedAt: now(),
      ...scoreData
    });
    if (examTick) clearInterval(examTick);
    toast('Berhasil dikumpulkan', auto ? 'Waktu habis. Ujian otomatis dikumpulkan.' : 'Jawaban Anda telah tersimpan.', 'success');
    State.examAttempt = null;
    State.currentExam = null;
    State.currentQIdx = 0;
    navigate('my-results');
  } catch(err){
    toast('Gagal', err.message, 'error');
  }
}

function autoGrade(questions, answers){
  let score = 0, correct = 0, wrong = 0, empty = 0, maxScore = 0;
  for (const q of questions){
    const pts = q.points || 1;
    maxScore += pts;
    const a = answers[q.id];
    if (!a || a.value == null || a.value === ''){ empty++; continue; }
    if (q.type === 'pg' || q.type === 'bs' || q.type === 'numerik' || q.type === 'isian'){
      if (String(a.value) === String(q.answer)){ score += pts; correct++; }
      else wrong++;
    } else { /* esai & kompleks: manual */ }
  }
  const finalScore = maxScore ? Math.round((score / maxScore) * 100) : 0;
  return { score, maxScore, finalScore, correct, wrong, empty, graded: questions.every(q => ['pg','bs','numerik','isian'].includes(q.type)) };
}

  grid.appendChild(h('div', { class:'card' }, h('div', { class:'card-header' }, h('div', { class:'card-title' }, 'Perkembangan Nilai')), h('div', { class:'chart-wrap' }, h('canvas', { id:'chartTrend' }))));
  page.appendChild(grid);
  container.appendChild(page);

  const data = await DB.get('examResults') || {};
  const all = [];
  for (const eid in data) for (const uid in data[eid]) for (const aid in data[eid][uid]) all.push({ eid, uid, ...data[eid][uid][aid] });
  const relevant = role === 'student' ? all.filter(r => r.uid === State.user.uid) : all;

  const buckets = { '0-59':0, '60-69':0, '70-79':0, '80-89':0, '90-100':0 };
  relevant.forEach(r => {
    const s = r.finalScore ?? 0;
    if (s < 60) buckets['0-59']++;
    else if (s < 70) buckets['60-69']++;
    else if (s < 80) buckets['70-79']++;
    else if (s < 90) buckets['80-89']++;
    else buckets['90-100']++;
  });

  const sorted = relevant.sort((a,b) => (a.submittedAt||0)-(b.submittedAt||0));
  const trendLabels = sorted.map((r, i) => `#${i+1}`);
  const trendValues = sorted.map(r => r.finalScore ?? 0);

  requestAnimationFrame(() => {
    if ($('#chartDist')){
      new Chart($('#chartDist'), {
        type:'bar',
        data: { labels: Object.keys(buckets), datasets: [{ label:'Jumlah', data: Object.values(buckets), backgroundColor:'#4F46E5', borderRadius:8 }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } }
      });
    }
    if ($('#chartTrend')){
      new Chart($('#chartTrend'), {
        type:'line',
        data: { labels: trendLabels.length ? trendLabels : ['Belum ada data'], datasets: [{ label:'Nilai', data: trendValues.length ? trendValues : [0], borderColor:'#0EA5E9', backgroundColor:'rgba(14,165,233,.15)', fill:true, tension:.35 }] },
        options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } }
      });
    }
  });
}

function toCSV(rows){
  if (!rows.length) return '';
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(',')];
  rows.forEach(r => lines.push(headers.map(h => `"${String(r[h] ?? '').replace(/"/g,'""')}"`).join(',')));
  return lines.join('\n');
}
function downloadCSV(name, csv){
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  const rows = Object.values(data).map(c => ({ nama:c.name, tingkat:c.grade, tahun:c.year, kode:c.code }));
  downloadCSV(`cazoo-classes-${now()}.csv`, toCSV(rows));
  toast('Ekspor selesai', `${rows.length} kelas diunduh`, 'success');
}

/* ============ AUDIT LOG ============ */
async function renderAuditPage(container){
  const page = h('div', { class:'page active' });
  page.appendChild(h('div', { class:'page-head' }, h('div', {}, h('h1', {}, 'Log Aktivitas'), h('p', {}, 'Riwayat aktivitas sistem.'))));
  const card = h('div', { class:'card' });
  const logs = await DB.get('auditLogs') || {};
  const items = Object.values(logs).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,50);
  if (!items.length){
    card.appendChild(h('div', { class:'empty' },
      h('div', { class:'empty-icon', html:Icons.shield }),
      h('h3', {}, 'Belum ada aktivitas')));
  } else {
    items.forEach(l => card.appendChild(h('div', { style:'padding:12px 0;border-bottom:1px solid var(--border)' },
      h('b', {}, l.action || '-'),
      h('div', { class:'text-sm text-muted' }, l.details || ''),
      h('div', { class:'text-xs text-muted' }, fmtDateTime(l.createdAt)))));
  }
  page.appendChild(card);
  container.appendChild(page);
}

/* ============ SETTINGS ============ */
async function renderSettingsPage(container){
  const page = h('div', { class:'page active' });
  page.appendChild(h('div', { class:'page-head' }, h('div', {}, h('h1', {}, 'Pengaturan Sekolah'), h('p', {}, 'Konfigurasi informasi sekolah.'))));
  const school = await DB.get('appSettings/school') || { name:'Sekolah CAZOO', year:'2024/2025', semester:'Ganjil', timezone:'Asia/Jakarta' };
  const nameIn = h('input', { class:'input', value:school.name });
  const yearIn = h('input', { class:'input', value:school.year });
  const semIn = h('select', { class:'select' },
    h('option', { value:'Ganjil', selected: school.semester==='Ganjil' }, 'Ganjil'),
    h('option', { value:'Genap', selected: school.semester==='Genap' }, 'Genap')
  );
  const tzIn = h('input', { class:'input', value:school.timezone || 'Asia/Jakarta' });
  page.appendChild(h('div', { class:'card', style:'max-width:640px' },
    h('div', { class:'form-group' }, h('label', { class:'label' }, 'Nama Sekolah'), nameIn),
    h('div', { class:'form-row' },
      h('div', { class:'form-group' }, h('label', { class:'label' }, 'Tahun Ajaran'), yearIn),
      h('div', { class:'form-group' }, h('label', { class:'label' }, 'Semester'), semIn)
    ),
    h('div', { class:'form-group' }, h('label', { class:'label' }, 'Zona Waktu'), tzIn),
    h('button', { class:'btn btn-primary', onclick: async (e) => {
      e.target.disabled = true; e.target.innerHTML = '<span class="spinner"></span>';
      try {
        await DB.set('appSettings/school', { name:nameIn.value, year:yearIn.value, semester:semIn.value, timezone:tzIn.value, updatedAt: now() });
        State.school = { name:nameIn.value, year:yearIn.value, semester:semIn.value };
        toast('Berhasil', 'Pengaturan disimpan', 'success');
        renderAppShell();
      } catch(err){ toast('Gagal', err.message, 'error'); e.target.disabled=false; e.target.textContent='Simpan'; }
    }}, 'Simpan Pengaturan')
  ));
  container.appendChild(page);
}

/* ============ PROFILE ============ */
function renderProfilePage(container){
  const page = h('div', { class:'page active' });
  const profile = State.profile || {};
  const initials = (profile.displayName || 'U').split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase();
  page.appendChild(h('div', { class:'page-head' }, h('div', {}, h('h1', {}, 'Profil Saya'), h('p', {}, 'Kelola informasi akun Anda.'))));
  const nameIn = h('input', { class:'input', value:profile.displayName || '' });
  page.appendChild(h('div', { class:'card', style:'max-width:640px' },
    h('div', { style:'display:flex;gap:16px;align-items:center;margin-bottom:24px' },
      h('div', { class:'avatar lg' }, initials),
      h('div', {},
        h('b', { style:'font-size:18px' }, profile.displayName || 'Pengguna'),
        h('div', { class:'text-sm text-muted' }, profile.email || ''),
        h('span', { class:'badge badge-primary mt-2' }, ROLE_LABELS[profile.role] || profile.role)
      )
    ),
    h('div', { class:'form-group' }, h('label', { class:'label' }, 'Nama Lengkap'), nameIn),
    h('button', { class:'btn btn-primary', onclick: async (e) => {
      e.target.disabled = true; e.target.innerHTML = '<span class="spinner"></span>';
      try {
        await DB.update(`users/${State.user.uid}`, { displayName: nameIn.value.trim(), updatedAt: now() });
        await updateProfile(auth.currentUser, { displayName: nameIn.value.trim() });
        State.profile.displayName = nameIn.value.trim();
        toast('Berhasil', 'Profil diperbarui', 'success');
        renderAppShell();
      } catch(err){ toast('Gagal', err.message, 'error'); }
      e.target.disabled = false; e.target.textContent = 'Simpan Profil';
    }}, 'Simpan Profil')
  ));
  container.appendChild(page);
}

/* ============ LANDING → AUTH FLOW ============ */
function showLanding(){
  $('#landing-root').style.display = '';
  $('#auth-root').innerHTML = '';
  $('#app-root').classList.remove('active');
  $('#app-root').innerHTML = '';
  renderLanding();
}

/* ============ ONBOARDING / AUTH STATE ============ */
onAuthStateChanged(auth, async (user) => {
  if (examTick){ clearInterval(examTick); examTick = null; }
  if (!user){
    State.user = null;
    State.profile = null;
    DB.clearListeners();
    showLanding();
    return;
  }
  State.user = user;
  try {
    State.profile = await loadProfile(user);
    if (State.profile.status === 'inactive' || (State.profile.role === 'teacher' && State.profile.status === 'pending')){
      toast('Akun belum aktif', 'Akun Anda menunggu persetujuan admin.', 'warning', 6000);
      await AuthSvc.logout();
      return;
    }
    State.school = await DB.get('appSettings/school') || { name:'Sekolah CAZOO', year:'2024/2025', semester:'Ganjil' };
    $('#landing-root').style.display = 'none';
    $('#landing-root').innerHTML = '';
    $('#auth-root').innerHTML = '';
    const initial = (location.hash.slice(1) || (State.profile.role === 'student' ? 'dashboard' : 'dashboard'));
    State.page = initial === 'take-exam' ? 'dashboard' : initial;
    navigate(State.page);
  } catch(err){
    console.error(err);
    toast('Error', err.message, 'error');
    await AuthSvc.logout();
  }
});

/* ============ CONNECTION MONITOR ============ */
const connRef = ref(db, '.info/connected');
onValue(connRef, snap => {
  const el = $('#conn-status');
  if (!el) return;
  if (snap.val() === true) el.classList.remove('show');
  else el.classList.add('show');
});

/* ============ INIT ============ */
if (!location.hash) location.hash = '#beranda';
if (['', 'beranda', 'fitur', 'tentang', 'faq'].includes(location.hash.slice(1))){
  renderLanding();
}
window.addEventListener('hashchange', () => {
  if (!State.user){
    const p = location.hash.slice(1);
    if (p === 'login') showAuth('login');
    else if (p === 'register') showAuth('register');
    else if (['beranda','fitur','tentang','faq'].includes(p)) renderLanding();
  }
});
