<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV AI - Deteksi Manusia</title>
    <!-- Load TensorFlow.js dan COCO-SSD (Model AI) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #b0c4de;
            padding: 10px;
        }
        .cctv-container {
            width: 100%;
            max-width: 500px;
            background: #11161f;
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 0 40px rgba(0, 180, 255, 0.15), inset 0 0 60px rgba(0,0,0,0.8);
            border: 1px solid #2a3a4a;
            position: relative;
        }
        /* Header ala DVR */
        .dvr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 2px solid #1f2a36;
        }
        .dvr-header h1 {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }
        .dvr-header h1 i { color: #ff3b3b; font-style: normal; animation: blink 1s infinite; }
        .rec-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a232e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .rec-led { width: 10px; height: 10px; border-radius: 50%; background: #2a2a2a; transition: 0.2s; }
        .rec-led.active { background: #ff0000; box-shadow: 0 0 15px #ff0000; animation: blink 0.6s infinite; }

        /* Wrapper Video dengan Efek Scanline & Grid */
        .video-wrapper {
            position: relative;
            margin-top: 14px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            border: 2px solid #1f2a36;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
        }
        /* Efek BU RAM dan HITAM PUTIH via CSS filter */
        #displayCanvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            filter: blur(3.5px) grayscale(100%) contrast(1.2);
            transform: scale(1.05); /* hilangkan pinggiran blur */
            background: #000;
        }
        /* Overlay Grid CCTV */
        .video-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 200, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 200, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 2;
        }
        /* Efek garis scanline */
        .video-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.15) 4px);
            pointer-events: none;
            z-index: 3;
            animation: scanMove 8s linear infinite;
        }
        @keyframes scanMove { 0% { transform: translateY(0); } 100% { transform: translateY(100%); } }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        /* HUD Info */
        .hud-overlay {
            position: absolute;
            bottom: 12px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
            font-size: 11px;
            color: #8af0ff;
            text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 4px #000;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 6px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(0, 255, 255, 0.15);
        }
        .hud-left span { margin-right: 12px; }
        .hud-right { color: #ffaa55; }

        /* Panel Bawah */
        .info-panel {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding: 8px 4px;
            font-size: 13px;
            background: #0d121b;
            border-radius: 8px;
            border-left: 3px solid #00e5ff;
            padding-left: 14px;
        }
        .info-panel .label { color: #6a7f9a; }
        .info-panel .value { color: #00ffc3; font-weight: bold; }

        /* Log Aktivitas */
        .log-box {
            margin-top: 12px;
            background: #0a0e14;
            border-radius: 8px;
            padding: 10px 12px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 11px;
            border: 1px solid #1f2a36;
            color: #7a8fa3;
            line-height: 1.8;
        }
        .log-box::-webkit-scrollbar { width: 3px; }
        .log-box::-webkit-scrollbar-thumb { background: #00e5ff33; border-radius: 10px; }
        .log-alert { color: #ff5555; font-weight: bold; }

        /* Tombol */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #1f2a36;
            color: #b0c4de;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #004466; color: #00e5ff; border: 1px solid #00e5ff44; }
        .btn-danger { background: #550000; color: #ff6666; border: 1px solid #ff444444; }
        .btn-success { background: #004d3a; color: #00ffaa; border: 1px solid #00ffaa44; }
        .btn:disabled { opacity: 0.4; transform: none; }
    </style>
</head>
<body>

<div class="cctv-container">
    <!-- Header -->
    <div class="dvr-header">
        <h1><i>●</i> CCTV-AI</h1>
        <div class="rec-status">
            <span class="rec-led" id="recLed"></span>
            <span id="recLabel">STOP</span>
        </div>
    </div>

    <!-- Video Area -->
    <div class="video-wrapper">
        <canvas id="displayCanvas"></canvas>
        <video id="sourceVideo" autoplay playsinline style="display:none;"></video>
        <!-- HUD -->
        <div class="hud-overlay">
            <div class="hud-left">
                <span>👤 <span id="humanCount">0</span></span>
                <span>🕒 <span id="clockTime">--:--:--</span></span>
            </div>
            <div class="hud-right">
                <span id="recTime">IDLE</span>
            </div>
        </div>
    </div>

    <!-- Info Status -->
    <div class="info-panel">
        <div><span class="label">Status</span> <span class="value" id="statusLabel">● SIAGA</span></div>
        <div><span class="label">Konfidensi</span> <span id="confidenceLabel">0%</span></div>
    </div>

    <!-- Log -->
    <div class="log-box" id="logArea">
        > System initialized. Memuat model AI...
    </div>

    <!-- Tombol -->
    <div class="btn-group">
        <button class="btn btn-primary" id="btnStart">▶ Mulai CCTV</button>
        <button class="btn btn-success" id="btnDownload">⬇ Unduh Rekaman</button>
        <button class="btn btn-danger" id="btnClearLog">✕ Bersihkan</button>
    </div>
</div>

<script>
    (function(){
        // --- ELEMENTS ---
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const logArea = document.getElementById('logArea');
        const statusLabel = document.getElementById('statusLabel');
        const humanCount = document.getElementById('humanCount');
        const confidenceLabel = document.getElementById('confidenceLabel');
        const recLed = document.getElementById('recLed');
        const recLabel = document.getElementById('recLabel');
        const recTime = document.getElementById('recTime');
        const clockTime = document.getElementById('clockTime');

        // --- STATE ---
        let isRunning = false;
        let model = null;
        let detectionInterval = null;
        let recording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let stream = null;
        let detectionLoopId = null;
        let lastHumanDetected = false;
        let humanPresentCounter = 0;
        const REQUIRED_CONSECUTIVE = 2; // butuh 2 frame berturut-turut detect manusia
        let recordingStartTime = 0;

        // --- FUNGSI LOG ---
        function addLog(msg, isAlert = false) {
            const time = new Date().toLocaleTimeString('id-ID');
            const prefix = isAlert ? '🚨' : '>';
            logArea.innerHTML += `<div class="${isAlert ? 'log-alert' : ''}">${prefix} [${time}] ${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
            if (logArea.children.length > 30) logArea.removeChild(logArea.firstChild);
        }

        // --- UPDATE JAM ---
        function updateClock() {
            const now = new Date();
            clockTime.textContent = now.toLocaleTimeString('id-ID');
        }
        setInterval(updateClock, 1000);

        // --- RESIZE CANVAS ---
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);

        // --- DRAW VIDEO (Efek Buram & Hitam Putih sudah dari CSS, kita gambar biasa + bounding box) ---
        function drawFrame() {
            if (!isRunning || video.readyState < 2) return;
            
            const w = canvas.width;
            const h = canvas.height;
            // Gambar video ke canvas (CSS akan membuatnya blur + grayscale)
            ctx.drawImage(video, 0, 0, w, h);
        }

        // --- DETEKSI MANUSIA dengan AI ---
        async function detectHumans() {
            if (!isRunning || !model || video.readyState < 2) {
                requestAnimationFrame(detectHumans);
                return;
            }

            try {
                // Deteksi objek
                const predictions = await model.detect(video);
                const humans = predictions.filter(p => p.class === 'person' && p.score > 0.5);
                
                // Update HUD
                humanCount.textContent = humans.length;
                if (humans.length > 0) {
                    const maxScore = Math.max(...humans.map(h => h.score));
                    confidenceLabel.textContent = (maxScore * 100).toFixed(0) + '%';
                } else {
                    confidenceLabel.textContent = '0%';
                }

                // Gambar video dulu (agar bounding box di atas)
                drawFrame();

                // Gambar bounding box untuk manusia (warna cerah agar terlihat meski blur)
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 10;
                humans.forEach(h => {
                    const [x, y, w, hh] = h.bbox;
                    ctx.strokeStyle = '#00ffcc';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.strokeRect(x, y, w, hh);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(0, 255, 200, 0.15)';
                    ctx.fillRect(x, y, w, hh);
                    
                    // Label
                    ctx.font = 'bold 16px Courier New';
                    ctx.fillStyle = '#00ffcc';
                    ctx.shadowBlur = 10;
                    ctx.fillText('MANUSIA ' + (h.score * 100).toFixed(0) + '%', x, y - 8);
                });
                ctx.shadowBlur = 0;

                // --- LOGIKA REKAM OTOMATIS (deteksi manusia) ---
                const humanDetected = humans.length > 0;
                
                if (humanDetected) {
                    humanPresentCounter++;
                } else {
                    humanPresentCounter = 0;
                }

                const isConfirmed = humanPresentCounter >= REQUIRED_CONSECUTIVE;

                // Jika terkonfirmasi ada manusia dan belum merekam -> MULAI REKAM
                if (isConfirmed && !recording) {
                    startRecording();
                }
                // Jika tidak ada manusia dan sedang merekam -> STOP REKAM (setelah 1 detik idle)
                if (!isConfirmed && recording) {
                    // kita stop langsung agar tidak rekam kosong
                    stopRecording();
                }

                // Update status UI
                if (isConfirmed) {
                    statusLabel.textContent = '● MANUSIA TERDETEKSI';
                    statusLabel.style.color = '#ff5555';
                } else {
                    statusLabel.textContent = '● SIAGA (Aman)';
                    statusLabel.style.color = '#00ffc3';
                }

            } catch (err) {
                // diamkan error biar tidak spam
            }

            // Loop terus
            requestAnimationFrame(detectHumans);
        }

        // --- FUNGSI REKAM (MediaRecorder) ---
        function startRecording() {
            if (recording) return;
            try {
                // Capture stream dari canvas (agar efek blur & bounding box ikut terekam)
                const canvasStream = canvas.captureStream(30);
                const audioTrack = null; // tidak pakai audio
                
                mediaRecorder = new MediaRecorder(canvasStream, {
                    mimeType: 'video/webm;codecs=vp9,opus',
                    bitsPerSecond: 1500000 // 1.5 Mbps
                });

                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    // Buat blob dan simpan untuk di-download nanti
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    // Simpan di global untuk tombol download
                    window._lastRecording = { url, blob, time: new Date().toISOString() };
                    addLog(`✅ Rekaman selesai (${(blob.size/1024/1024).toFixed(1)} MB)`, false);
                    recLabel.textContent = 'STOP';
                    recLed.className = 'rec-led';
                    recTime.textContent = 'IDLE';
                };

                mediaRecorder.start(1000); // capture setiap 1 detik
                recording = true;
                recordingStartTime = Date.now();
                recLed.className = 'rec-led active';
                recLabel.textContent = '● REKAM';
                addLog('🔴 Merekam karena mendeteksi manusia!', true);
            } catch (err) {
                addLog('❌ Gagal mulai rekam: ' + err.message);
            }
        }

        function stopRecording() {
            if (!recording || !mediaRecorder) return;
            try {
                if (mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
                recording = false;
                recLed.className = 'rec-led';
                recLabel.textContent = 'STOP';
                recTime.textContent = 'IDLE';
            } catch (e) {}
        }

        // --- TOMBOL DOWNLOAD ---
        document.getElementById('btnDownload').addEventListener('click', function() {
            if (window._lastRecording && window._lastRecording.blob.size > 0) {
                const a = document.createElement('a');
                a.href = window._lastRecording.url;
                a.download = `rekaman_cctv_${new Date().toISOString().replace(/[:.]/g,'-')}.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                addLog('⬇ Unduh rekaman dimulai.');
            } else {
                alert('Belum ada rekaman tersimpan. Biarkan CCTV mendeteksi manusia dulu!');
            }
        });

        // --- TOMBOL CLEAR LOG ---
        document.getElementById('btnClearLog').addEventListener('click', function() {
            logArea.innerHTML = '> Log dibersihkan.';
        });

        // --- TOMBOL START/STOP CCTV ---
        document.getElementById('btnStart').addEventListener('click', async function() {
            if (isRunning) {
                // STOP
                isRunning = false;
                if (recording) stopRecording();
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                statusLabel.textContent = '● STOP';
                statusLabel.style.color = '#6a7f9a';
                humanCount.textContent = '0';
                confidenceLabel.textContent = '0%';
                this.textContent = '▶ Mulai CCTV';
                addLog('⏹ Sistem dihentikan.');
                if (detectionLoopId) cancelAnimationFrame(detectionLoopId);
                return;
            }

            // START
            try {
                const constraints = {
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();

                resizeCanvas();
                isRunning = true;
                this.textContent = '⏹ Stop CCTV';
                addLog('📷 Kamera aktif. Memuat AI...');

                // Muat model AI jika belum
                if (!model) {
                    statusLabel.textContent = '● Memuat AI...';
                    addLog('⏳ Memuat model TensorFlow (COCO-SSD)...');
                    model = await cocoSsd.load({ base: 'mobilenet_v2' });
                    addLog('✅ Model AI siap! Deteksi manusia aktif.');
                    statusLabel.textContent = '● SIAGA';
                } else {
                    addLog('✅ Model AI sudah siap.');
                }

                // Mulai loop deteksi
                if (detectionLoopId) cancelAnimationFrame(detectionLoopId);
                detectHumans();

            } catch (err) {
                alert('Gagal akses kamera: ' + err.message);
                addLog('❌ Error: ' + err.message);
                isRunning = false;
                this.textContent = '▶ Mulai CCTV';
            }
        });

        // --- INISIALISASI AWAL ---
        addLog('🔧 CCTV AI siap. Tekan "Mulai CCTV"');
        statusLabel.textContent = '● SIAGA';
        updateClock();
    })();
</script>
</body>
</html>
