<style>
:root{--primary:#4F46E5;--primary-dark:#3730A3;--primary-light:#818CF8;--primary-soft:#EEF2FF;--secondary:#0EA5E9;--secondary-soft:#E0F2FE;--bg:#F8FAFC;--surface:#FFF;--surface-2:#F1F5F9;--surface-3:#E2E8F0;--text:#0F172A;--text-2:#475569;--text-3:#94A3B8;--border:#E2E8F0;--border-2:#CBD5E1;--success:#16A34A;--success-soft:#DCFCE7;--warning:#F59E0B;--warning-soft:#FEF3C7;--danger:#DC2626;--danger-soft:#FEE2E2;--info:#0EA5E9;--info-soft:#E0F2FE;--radius:12px;--radius-sm:8px;--radius-lg:16px;--shadow-xs:0 1px 2px rgba(15,23,42,.04);--shadow-sm:0 1px 3px rgba(15,23,42,.06);--shadow:0 4px 12px rgba(15,23,42,.08);--shadow-lg:0 12px 32px rgba(15,23,42,.12);--shadow-xl:0 24px 48px rgba(15,23,42,.16);--sidebar-w:268px;--header-h:68px;--t:180ms cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--primary:#6366F1;--primary-dark:#4F46E5;--primary-light:#A5B4FC;--primary-soft:rgba(99,102,241,.15);--secondary:#38BDF8;--secondary-soft:rgba(56,189,248,.15);--bg:#0B1220;--surface:#0F172A;--surface-2:#1E293B;--surface-3:#334155;--text:#F1F5F9;--text-2:#CBD5E1;--text-3:#64748B;--border:#1E293B;--border-2:#334155;--success:#22C55E;--success-soft:rgba(34,197,94,.15);--warning:#FBBF24;--warning-soft:rgba(251,191,36,.15);--danger:#EF4444;--danger-soft:rgba(239,68,68,.15);--info:#38BDF8;--info-soft:rgba(56,189,248,.15)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background var(--t),color var(--t);overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;font-weight:inherit}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
img{max-width:100%;display:block}svg{display:block;flex-shrink:0}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:all var(--t);white-space:nowrap;user-select:none;border:1.5px solid transparent;height:42px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.2)}
.btn-primary:hover:not(:disabled){background:var(--primary-dark);box-shadow:0 4px 12px rgba(79,70,229,.35);transform:translateY(-1px)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--surface-2);border-color:var(--border-2)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover:not(:disabled){filter:brightness(.92)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover:not(:disabled){filter:brightness(.92)}
.btn-google{background:#fff;color:#1F2937;border:1.5px solid var(--border);font-weight:600}
.btn-google:hover:not(:disabled){background:#F8FAFC;border-color:var(--border-2)}
[data-theme="dark"] .btn-google{background:var(--surface-2);color:var(--text);border-color:var(--border-2)}
.btn-sm{padding:6px 12px;font-size:13px;height:34px}
.btn-lg{padding:14px 28px;font-size:15px;height:52px}
.btn-block{width:100%}
.input,.select,.textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);transition:all var(--t);font-size:14px;height:44px}
.textarea{height:auto;min-height:100px;resize:vertical;padding-top:12px}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.label{display:block;font-weight:600;font-size:13px;margin-bottom:8px;color:var(--text)}
.form-group{margin-bottom:18px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
.help{font-size:12px;color:var(--text-2);margin-top:6px}
.divider{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:12px;font-weight:500;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-xs)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.card-title{font-size:16px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge-primary{background:var(--primary-soft);color:var(--primary)}
.badge-success{background:var(--success-soft);color:#15803D}
.badge-warning{background:var(--warning-soft);color:#B45309}
.badge-danger{background:var(--danger-soft);color:#B91C1C}
.badge-info{background:var(--info-soft);color:#0369A1}
.badge-neutral{background:var(--surface-2);color:var(--text-2)}
[data-theme="dark"] .badge-success{color:#4ADE80}[data-theme="dark"] .badge-warning{color:#FCD34D}[data-theme="dark"] .badge-danger{color:#FCA5A5}[data-theme="dark"] .badge-info{color:#7DD3FC}
.landing-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
[data-theme="dark"] .landing-nav{background:rgba(15,23,42,.8)}
.landing-nav-inner{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;color:var(--text);letter-spacing:-.02em}
.logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 6px 16px rgba(79,70,229,.35)}
.landing-menu{display:flex;gap:2px}.landing-menu a{padding:9px 16px;border-radius:9px;color:var(--text-2);font-weight:500;font-size:14px}
.landing-menu a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.landing-actions{display:flex;gap:10px}
@media(max-width:800px){.landing-menu{display:none}}
.hero{max-width:1240px;margin:0 auto;padding:72px 24px 80px;display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
@media(max-width:960px){.hero{grid-template-columns:1fr;padding:48px 20px;gap:40px}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;background:var(--primary-soft);color:var(--primary);border-radius:999px;font-size:13px;font-weight:600;margin-bottom:24px}
.hero h1{font-size:56px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin-bottom:22px}
.hero h1 span{background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:17px;color:var(--text-2);margin-bottom:36px;max-width:560px;line-height:1.65}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:640px){.hero h1{font-size:38px}.hero p{font-size:15px}}
.hero-visual{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:linear-gradient(135deg,#EEF2FF,#E0F2FE);padding:28px;box-shadow:var(--shadow-xl);min-height:420px}
[data-theme="dark"] .hero-visual{background:linear-gradient(135deg,#1E1B4B,#0C4A6E)}
.mock-window{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;height:100%}
.mock-bar{display:flex;gap:6px;padding:14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.mock-dot{width:11px;height:11px;border-radius:50%}
.mock-body{padding:20px;display:grid;gap:16px}
.mock-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mock-stat>div{padding:14px;background:var(--surface-2);border-radius:11px;text-align:center}
.mock-stat b{display:block;font-size:22px;color:var(--primary);font-weight:800}
.mock-stat span{font-size:11px;color:var(--text-2);font-weight:500}
.mock-chart{height:130px;background:var(--surface-2);border-radius:11px;overflow:hidden}
.mock-chart svg{width:100%;height:100%}
.section{max-width:1240px;margin:0 auto;padding:88px 24px}
.section-head{text-align:center;max-width:680px;margin:0 auto 56px}
.section-head h2{font-size:40px;font-weight:800;letter-spacing:-.025em;margin-bottom:14px;line-height:1.15}
.section-head p{color:var(--text-2);font-size:16px}
@media(max-width:640px){.section{padding:56px 20px}.section-head h2{font-size:28px}}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media(max-width:960px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-3,.grid-4,.grid-2{grid-template-columns:1fr}}
.feature-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;transition:all .25s}
.feature-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.feature-icon{width:48px;height:48px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.feature-card h3{font-size:16px;font-weight:700;margin-bottom:9px}
.feature-card p{color:var(--text-2);font-size:14px;line-height:1.6}
.faq-item{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;background:var(--surface);overflow:hidden}
.faq-q{padding:20px 24px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;gap:16px;font-size:15px}
.faq-a{padding:0 24px;max-height:0;overflow:hidden;transition:all .3s;color:var(--text-2);font-size:14px;line-height:1.7}
.faq-item.open .faq-a{max-height:400px;padding:0 24px 22px}
.faq-item.open .faq-q svg{transform:rotate(180deg)}
.faq-q svg{transition:transform .3s;color:var(--text-3)}
.footer{background:var(--surface);border-top:1px solid var(--border);padding:56px 24px 28px;margin-top:56px}
.footer-inner{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px}
@media(max-width:800px){.footer-inner{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.footer-inner{grid-template-columns:1fr}}
.footer h4{font-size:13px;font-weight:700;margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2)}
.footer ul{list-style:none;display:grid;gap:10px}.footer a{color:var(--text-2);font-size:14px}
.footer a:hover{color:var(--primary);text-decoration:none}
.footer-bottom{max-width:1240px;margin:40px auto 0;padding-top:24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;color:var(--text-2);font-size:13px;flex-wrap:wrap;gap:12px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:linear-gradient(135deg,var(--bg),var(--primary-soft))}
[data-theme="dark"] .auth-wrap{background:linear-gradient(135deg,var(--bg),#1E1B4B)}
.auth-card{background:var(--surface);border-radius:var(--radius-lg);padding:44px;width:100%;max-width:460px;box-shadow:var(--shadow-xl);border:1px solid var(--border)}
@media(max-width:520px){.auth-card{padding:32px 24px}}
.auth-header{text-align:center;margin-bottom:28px}
.auth-header .logo{justify-content:center;margin-bottom:20px;font-size:22px}
.auth-header h1{font-size:26px;font-weight:800;margin-bottom:8px}
.auth-header p{color:var(--text-2);font-size:14px}
.auth-tabs{display:flex;background:var(--surface-2);border-radius:10px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:9px;border-radius:7px;font-weight:600;color:var(--text-2);font-size:13.5px;transition:all var(--t)}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs)}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);padding:6px;color:var(--text-3);border-radius:6px}
.pw-toggle:hover{background:var(--surface-2);color:var(--text-2)}
.auth-links{display:flex;justify-content:space-between;margin-top:18px;font-size:13px;flex-wrap:wrap;gap:10px}
.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.role-opt{padding:18px 12px;border:2px solid var(--border);border-radius:var(--radius);text-align:center;cursor:pointer;transition:all var(--t);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.role-opt:hover{border-color:var(--primary-light);background:var(--surface-2)}
.role-opt.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.pending-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--bg),var(--warning-soft))}
.pending-card{background:var(--surface);border-radius:var(--radius-lg);padding:48px 40px;max-width:520px;width:100%;text-align:center;box-shadow:var(--shadow-xl);border:1px solid var(--border)}
.pending-icon{width:80px;height:80px;margin:0 auto 24px;border-radius:50%;background:var(--warning-soft);color:var(--warning);display:flex;align-items:center;justify-content:center}
.pending-card h1{font-size:24px;font-weight:800;margin-bottom:12px}
.pending-card p{color:var(--text-2);margin-bottom:28px;line-height:1.6}
.app{display:none;min-height:100vh}.app.active{display:block}
.app-layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.app-layout.collapsed{grid-template-columns:78px 1fr}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:hidden;transition:width var(--t)}
.sidebar-head{padding:18px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--header-h)}
.sidebar-head .logo{font-size:16px;gap:10px}
.sidebar-head .logo span{white-space:nowrap;overflow:hidden}
.app-layout.collapsed .sidebar-head .logo span,.app-layout.collapsed .sidebar .nav-label,.app-layout.collapsed .sidebar-school,.app-layout.collapsed .sidebar-user-info,.app-layout.collapsed .nav-section-title{opacity:0;pointer-events:none;width:0;overflow:hidden}
.sidebar-school{padding:14px 18px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.sidebar-school b{display:block;font-size:13px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-school span{font-size:11.5px;color:var(--text-2)}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-section-title{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;padding:14px 12px 8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;color:var(--text-2);font-weight:500;font-size:13.5px;transition:all var(--t);margin-bottom:2px;position:relative;cursor:pointer;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.nav-item .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700;min-width:18px;text-align:center}
.nav-label{white-space:nowrap;transition:opacity var(--t)}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.sidebar-user{display:flex;align-items:center;gap:11px;padding:9px;border-radius:9px;background:var(--surface-2);cursor:pointer;transition:all var(--t)}
.sidebar-user:hover{background:var(--surface-3)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.lg{width:72px;height:72px;font-size:26px}
.sidebar-user-info{min-width:0;flex:1}
.sidebar-user-info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sidebar-user-info span{font-size:11px;color:var(--text-2)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:85;opacity:0;visibility:hidden;transition:all var(--t);backdrop-filter:blur(2px)}
.sidebar-overlay.show{opacity:1;visibility:visible}
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:30}
.header-title{flex:1;min-width:0}
.header-title h2{font-size:16px;font-weight:700;margin-bottom:1px}
.breadcrumb{font-size:12px;color:var(--text-3);font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);transition:all var(--t);position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.content{padding:26px;flex:1;max-width:1600px;width:100%;margin:0 auto}
@media(max-width:640px){.content{padding:18px}}
.page{display:none;animation:fadeUp .28s}.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.page-head p{color:var(--text-2);font-size:14px;margin-top:6px}
@media(max-width:640px){.page-head h1{font-size:20px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:10px;transition:all var(--t)}
.stat:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--border-2)}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stat-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.stat-icon.p{background:var(--primary-soft);color:var(--primary)}
.stat-icon.s{background:var(--secondary-soft);color:var(--secondary)}
.stat-icon.g{background:var(--success-soft);color:var(--success)}
.stat-icon.w{background:var(--warning-soft);color:var(--warning)}
.stat-icon.d{background:var(--danger-soft);color:var(--danger)}
.stat-val{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat-label{font-size:13px;color:var(--text-2);font-weight:500}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-xs)}
.table-toolbar{display:flex;gap:12px;padding:18px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}

<script>
/* ============ BOOTSTRAP ERROR HANDLING ============ */
window.CAZOO = {};

window.CAZOO.showError = function(title, msg, details){
  var ov = document.getElementById('error-overlay');
  if(!ov) return;
  ov.style.cssText = 'display:flex;position:fixed;inset:0;background:#F8FAFC;z-index:99999;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;overflow:auto';
  var detailsHtml = details ? '<pre style="background:#F1F5F9;padding:14px;border-radius:8px;font-size:12px;color:#475569;overflow:auto;max-height:220px;white-space:pre-wrap;word-break:break-word;margin-top:16px;line-height:1.5">' + String(details).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }) + '</pre>' : '';
  ov.innerHTML = '<div style="max-width:680px;background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:36px;box-shadow:0 24px 48px rgba(15,23,42,.15);width:100%">' +
    '<div style="width:64px;height:64px;border-radius:16px;background:#FEE2E2;color:#DC2626;display:flex;align-items:center;justify-content:center;margin-bottom:20px">' +
    '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></div>' +
    '<h1 style="font-size:22px;font-weight:800;color:#0F172A;margin-bottom:12px">' + title + '</h1>' +
    '<div style="color:#475569;line-height:1.7;font-size:14px">' + msg + '</div>' +
    detailsHtml +
    '<button onclick="location.reload()" style="margin-top:24px;padding:12px 24px;background:#4F46E5;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px">Muat Ulang Halaman</button>' +
    '</div>';
};

// Cek protokol file://
if (location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', function(){
    window.CAZOO.showError(
      'File harus dijalankan lewat Server Lokal',
      'Browser memblokir JavaScript Module saat file dibuka dengan <code style="background:#F1F5F9;padding:2px 6px;border-radius:4px">file://</code>. Ini alasan halaman tampil putih.',
      'CARA MEMPERBAIKI:\n\n1. Buka Terminal (Mac/Linux) atau CMD (Windows)\n2. Masuk ke folder tempat file index.html berada\n3. Jalankan salah satu perintah berikut:\n\n   python -m http.server 8080\n   (atau jika tidak ada Python: npx serve)\n\n4. Buka browser ke: http://localhost:8080'
    );
  });
}

// Capture error dari module script
window.addEventListener('error', function(e){
  if (e.message && e.message.indexOf('ResizeObserver') !== -1) return;
  if (e.filename && e.filename.indexOf('gstatic.com') !== -1) return;
  if (location.protocol === 'file:') return;
  window.CAZOO.showError(
    'Terjadi Error pada Aplikasi',
    '<b>' + (e.message || 'Unknown error') + '</b>',
    (e.filename || '') + ':' + (e.lineno || '') + '\n\n' + (e.error && e.error.stack ? e.error.stack : '')
  );
});

window.addEventListener('unhandledrejection', function(e){
  if (location.protocol === 'file:') return;
  var reason = e.reason || {};
  var msg = reason.message || String(reason);
  if (msg.indexOf('ResizeObserver') !== -1) return;
  // Ignore Firebase Auth errors yang tidak fatal
  if (reason.code && reason.code.indexOf('auth/') === 0) return;
  window.CAZOO.showError(
    'Terjadi Error',
    '<b>' + msg + '</b>',
    reason.stack || ''
  );
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ============ STATE ============ */
const State = {
  user:null, profile:null, school:null, pendingVerifications:[],
  page:'dashboard', listeners:[], theme:localStorage.getItem('cazoo_theme')||'light',
  examAttempt:null, currentExam:null, examQuestions:[], currentQIdx:0, examTick:null,
  sidebarCollapsed: localStorage.getItem('cazoo_sidebar')==='1',
  sidebarOpenMobile:false,
  signupContext:null,
  googleModalShown:false
};

/* ============ HELPERS ============ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));

/* FIXED: h() sekarang handle SVG strings sebagai DOM node */
const h = (tag, attrs={}, ...children) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'style') el.setAttribute('style', v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') el.innerHTML = v;
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  const append = (c) => {
    if (c == null || c === false) return;
    if (c instanceof Node) { el.appendChild(c); return; }
    const s = String(c);
    // Deteksi string yang merupakan markup SVG atau HTML pendek → parse sebagai element
    if (/^\s*<(svg|span|div|p|b|i|br|hr)\b/i.test(s) && s.trim().endsWith('>')) {
      const tmp = document.createElement('template');
      tmp.innerHTML = s.trim();
      while (tmp.content.firstChild) el.appendChild(tmp.content.firstChild);
      return;
    }
    el.appendChild(document.createTextNode(s));
  };
  for (const c of children.flat()) append(c);
  return el;
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate = (ts, o={}) => !ts ? '-' : new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'2-digit',year:'numeric',...o}).format(new Date(ts));
const fmtDateTime = ts => !ts ? '-' : new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(ts));
const fmtDur = ms => { if (!ms || ms < 0) ms = 0; const s = Math.floor(ms/1000), hh = Math.floor(s/3600), mm = Math.floor((s%3600)/60), ss = s%60; return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0'); };
const uid = () => Math.random().toString(36).slice(2,10);
const now = () => Date.now();

/* ============ TOAST ============ */
const ToastIcons = {
  success:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>',
  error:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  warning:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>',
  info:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
};
function toast(title, msg='', type='info', timeout=4200){
  const wrap = $('#toast-wrap'); if (!wrap) return;
  const el = h('div', { class:`toast ${type}` },
    h('div', { class:'toast-icon', html: ToastIcons[type] || ToastIcons.info }),
    h('div', { class:'toast-body' }, h('b', {}, title), msg ? h('p', {}, msg) : null)
  );
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition = 'all .3s'; el.style.transform = 'translateX(120%)'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, timeout);
}

/* ============ MODAL ============ */
function openModal({ title, body, footer, size='' }){
  const ov = $('#modal-overlay'), md = $('#modal');
  md.className = 'modal ' + size;
  $('#modal-title').textContent = title || '';
  const bd = $('#modal-body'); bd.innerHTML = '';
  if (typeof body === 'string') bd.innerHTML = body;
  else if (body instanceof Node) bd.appendChild(body);
  const ft = $('#modal-foot'); ft.innerHTML = ''; ft.style.display = 'none';
  if (Array.isArray(footer)) { footer.forEach(f => ft.appendChild(f)); ft.style.display = 'flex'; }
  else if (footer instanceof Node) { ft.appendChild(footer); ft.style.display = 'flex'; }
  ov.classList.add('show');

const DB = {
  async get(path){ const s = await get(ref(db, path)); return s.exists() ? s.val() : null; },

/* ============ FINISH AUTH (dipanggil setelah profile tersedia) ============ */
async function finishAuth(user){
  State.user = user;
  const profile = await DB.get(`users/${user.uid}`);
  if (!profile) return;
  State.profile = profile;
  if (profile.status === 'pending' && profile.role === 'teacher'){ renderPendingScreen(); return; }
  if (profile.status === 'inactive'){ toast('Akun dinonaktifkan','Hubungi administrator sekolah.','error',6000); await AuthSvc.logout(); return; }
  try {
    State.school = await DB.get('appSettings/school') || { name:'Sekolah CAZOO', year:'2024/2025', semester:'Ganjil' };
    if (['admin','superadmin'].includes(profile.role)){
      const v = await DB.get('teacherVerifications') || {};
      State.pendingVerifications = Object.values(v).filter(x => x.status === 'pending');
    }
  } catch(e){ console.warn('settings load', e); }
  State.page = 'dashboard';
  renderAppShell();
}

/* ============ LOGIN ============ */
async function doLogin(e){
  const btn = e.currentTarget;
  const email = $('#login-email').value.trim(), pw = $('#login-pw').value;
  if (!email || !pw){ toast('Validasi','Email dan kata sandi wajib diisi','warning'); return; }
  btn.disabled = true; const o = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span> Memproses...';
  try { await AuthSvc.login(email, pw); /* onAuthStateChanged akan handle */ }
  catch(err){ toast('Login gagal', friendlyAuthError(err), 'error'); btn.disabled = false; btn.innerHTML = o; }
}

/* ============ REGISTER ============ */
async function doRegister(e){
  const btn = e.currentTarget, form = btn.closest('form');
  const name = $('#reg-name').value.trim(), email = $('#reg-email').value.trim();
  const pw = $('#reg-pw').value, pw2 = $('#reg-pw2').value;
  const role = $('.role-opt.active', form)?.dataset.role || 'student';
  if (!name || !email || !pw){ toast('Validasi','Semua field wajib diisi','warning'); return; }
  if (pw.length < 6){ toast('Validasi','Kata sandi minimal 6 karakter','warning'); return; }
  if (pw !== pw2){ toast('Validasi','Konfirmasi kata sandi tidak cocok','warning'); return; }
  btn.disabled = true; const o = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span> Memproses...';
  // Simpan context agar onAuthStateChanged tahu ini signup
  State.signupContext = { name, role, provider:'password' };
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await updateProfile(cred.user, { displayName: name });
    const profile = {
      uid: cred.user.uid, email, displayName: name,
      role, status: role === 'teacher' ? 'pending' : 'active',
      provider: 'password', createdAt: now(), updatedAt: now()
    };
    await DB.set('users/' + cred.user.uid, profile);
    if (role === 'teacher'){
      await DB.set('teacherVerifications/' + cred.user.uid, {
        uid: cred.user.uid, email, displayName: name,
        status: 'pending', submittedAt: now()
      });
    }
    State.signupContext = null;
    if (role === 'teacher') toast('Pendaftaran berhasil','Akun guru Anda menunggu verifikasi admin.','success',6000);
    else toast('Berhasil','Akun berhasil dibuat','success');
    // onAuthStateChanged akan trigger render
  } catch(err){
    State.signupContext = null;
    toast('Pendaftaran gagal', friendlyAuthError(err), 'error');
    btn.disabled = false; btn.innerHTML = o;
  }
}

/* ============ GOOGLE ============ */
async function doGoogle(e){
  const btn = e.currentTarget;
  btn.disabled = true; const o = btn.innerHTML; btn.innerHTML = '<span class="spinner dark"></span> Menghubungkan...';
  try {
    await setPersistence(auth, browserLocalPersistence);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt:'select_account' });
    const result = await signInWithPopup(auth, provider);
    const user = result.user;
    const existing = await DB.get('users/' + user.uid);
    if (!existing){
      // User baru — tampilkan modal pilih role
      State.googleModalShown = true;
      openGoogleRoleModal(user);
      return; // onAuthStateChanged juga fire, tapi akan diabaikan karena user belum punya profile
    }
    await finishAuth(user);
  } catch(err){
    toast('Gagal masuk dengan Google', friendlyAuthError(err), 'error');
  }
  btn.disabled = false; btn.innerHTML = o;
}

async function renderDashboard(c, role){
  const wrap = h('div', { class:'page active' });
  c.appendChild(wrap);
  wrap.appendChild(h('div', { class:'page-head' },
    h('div', {}, h('h1', {}, 'Halo, ' + (State.profile?.displayName || 'Pengguna') + ' 👋'),

    h('div', { class:'text-sm text-muted' }, fmtDate(now(), { weekday:'long', day:'numeric', month:'long', year:'numeric' }))));
  const loadEl = h('div', {}); wrap.appendChild(loadEl);
  loadEl.appendChild(loadingCard());
  try {
    const stats = await loadDashboardStats(role);
    loadEl.innerHTML = '';
    loadEl.appendChild(renderStatCards(stats.cards));
    if (stats.upcoming?.length){
      loadEl.appendChild(h('div', { class:'card mb-6' },
        h('div', { class:'card-header' }, h('div', { class:'card-title' }, 'Ujian Terdekat')),
        h('div', { class:'table-scroll' },
          h('table', {},
            h('thead', {}, h('tr', {}, h('th', {}, 'Judul'), h('th', {}, 'Mulai'), h('th', {}, 'Durasi'), h('th', {}, 'Status'))),
            h('tbody', {}, ...stats.upcoming.slice(0,5).map(e => h('tr', {},
              h('td', {}, h('b', {}, e.title)),
              h('td', { class:'text-sm' }, fmtDateTime(e.startAt)),
              h('td', {}, (e.duration || 0) + ' menit'),
              h('td', {}, h('span', { class:'badge badge-info' }, e.status || 'terjadwal')))))))));
    }
    if (!stats.cards.length || stats.cards.every(x => x.value === 0)){
      loadEl.appendChild(emptyState('Belum ada data', 'Mulai dengan menambahkan data pertama Anda.', 'Buka Menu', () => navigate(role === 'student' ? 'my-classes' : 'classes')));
    }
  } catch(err){ loadEl.innerHTML = ''; loadEl.appendChild(errorState(err.message)); }
}
async function loadDashboardStats(role){
  const cards = [], upcoming = [];
  try {
    if (can('users', 'r')){
      const users = await DB.get('users') || {};
      const arr = Object.values(users);
      cards.push({ label:'Total Pengguna', value:arr.length, icon:'users', color:'p' });
      cards.push({ label:'Guru', value:arr.filter(u => u.role === 'teacher').length, icon:'teacher', color:'s' });
      cards.push({ label:'Murid', value:arr.filter(u => u.role === 'student').length, icon:'student', color:'g' });
    }
    if (can('classes', 'r')){
      const cl = await DB.get('classes') || {};
      cards.push({ label:'Total Kelas', value:Object.keys(cl).length, icon:'class', color:'p' });
    }
    if (can('exams', 'r')){
      const ex = await DB.get('exams') || {};
      const arr = Object.values(ex);
      cards.push({ label:'Total Ujian', value:arr.length, icon:'exam', color:'p' });
      const nowTs = now();
      const active = arr.filter(e => e.status === 'active').length;
      const upcomingCount = arr.filter(e => e.startAt && e.startAt > nowTs && e.status !== 'archived').length;
      cards.push({ label:'Ujian Aktif', value:active, icon:'clock', color:'g' });
      cards.push({ label:'Ujian Mendatang', value:upcomingCount, icon:'calendar', color:'w' });
      arr.filter(e => e.startAt && e.startAt > nowTs).sort((a,b) => a.startAt - b.startAt).slice(0,5).forEach(e => upcoming.push(e));
    }
    if (role === 'student'){
      return { cards: cards.filter(x => ['Total Ujian','Ujian Aktif','Ujian Mendatang'].includes(x.label)), upcoming };
    }
    return { cards, upcoming };
  } catch(err){ console.warn('stats', err); return { cards:[], upcoming:[] }; }
}
function renderStatCards(cards){
  const icons = { users:I.users, teacher:I.teacher, student:I.student, class:I.class, subject:I.subject, exam:I.exam, clock:I.clock, calendar:I.calendar, assignment:I.assignment };
  return h('div', { class:'stats' },
    ...cards.map(x => h('div', { class:'stat' },
      h('div', { class:'stat-top' }, h('div', { class:'stat-icon ' + (x.color || 'p'), html: icons[x.icon] || I.dashboard })),
      h('div', { class:'stat-val' }, String(x.value)),
      h('div', { class:'stat-label' }, x.label))));
}

async function startExam(ex){
  const questions = await loadExamQuestions(ex);
  if (!questions.length){ toast('Tidak dapat memulai','Ujian ini belum memiliki soal. Hubungi guru Anda.','warning'); return; }
  const attemptId = 'a' + now();
  const attempt = { attemptId, examId:ex.id, userId:State.user.uid, userName:State.profile.displayName,
    startedAt:now(), endsAt:now() + (ex.duration || 60) * 60000, status:'in_progress', answers:{} };
  try {
    await DB.set('examAttempts/' + ex.id + '/' + State.user.uid + '/' + attemptId, attempt);
    State.examAttempt = attempt; State.currentExam = ex; State.examQuestions = questions; State.currentQIdx = 0;
    navigate('take-exam');
  } catch(err){ toast('Gagal', err.message, 'error'); }
}
async function loadExamQuestions(ex){
  if (ex.questionIds && ex.questionIds.length) return ex.questionIds;
  const data = await DB.get('questionBanks') || {};
  const all = [];
  for (const tid in data) for (const qid in data[tid]) all.push({ id:qid, owner:tid, ...data[tid][qid] });
  return all.slice(0, 10);
}

/* ============ EXAM TAKING ============ */
function renderExamPage(){
  const root = $('#root'); if (!root) return;
  root.innerHTML = '';
  const ex = State.currentExam, at = State.examAttempt;
  if (!ex || !at){ State.page = 'my-exams'; renderAppShell(); return; }
  const shell = h('div', { class:'exam-shell' });
  const remaining = Math.max(0, at.endsAt - now());
  const timerEl = h('div', { class:'exam-timer ' + (remaining < 60000 ? 'danger' : remaining < 300000 ? 'warn' : '') },
    h('span', { html:I.clock }), h('span', { id:'exam-time' }, fmtDur(remaining)));
  shell.appendChild(h('div', { class:'exam-top' },
    h('h2', {}, ex.title),
    h('span', { class:'badge badge-info' }, ex.subject || 'Umum'),
    timerEl,
    h('span', { class:'save-status', id:'save-status' }, 'Tersimpan otomatis'),
    h('button', { class:'btn btn-primary', onclick:confirmSubmit }, I.check, 'Kumpulkan')));
  const body = h('div', { class:'exam-body' });
  const qArea = h('div', { id:'question-area' });
  const navPanel = h('div', { class:'exam-nav-panel' },
    h('h3', { style:'font-size:14px;font-weight:700;margin-bottom:10px' }, 'Navigasi Soal'),
    h('div', { class:'nav-grid', id:'nav-grid' }),
    h('div', { class:'legend' },
      h('div', {}, h('span', { class:'legend-dot' }), 'Belum dijawab'),
      h('div', {}, h('span', { class:'legend-dot a' }), 'Sudah dijawab'),
      h('div', {}, h('span', { class:'legend-dot f' }), 'Ditandai')));
  body.appendChild(qArea); body.appendChild(navPanel);
  shell.appendChild(body); root.appendChild(shell);
  const questions = State.examQuestions || [];
  if (!questions.length){
    qArea.appendChild(h('div', { class:'card' }, h('div', { class:'empty' }, h('h3', {}, 'Ujian belum memiliki soal'))));
    return;
  }
  renderCurrentQuestion(questions);
  if (State.examTick) clearInterval(State.examTick);
  State.examTick = setInterval(() => {
    const rem = Math.max(0, at.endsAt - now());
    const t = $('#exam-time'); if (t) t.textContent = fmtDur(rem);
    const timer = $('.exam-timer');
    if (timer){ timer.classList.toggle('danger', rem < 60000); timer.classList.toggle('warn', rem >= 60000 && rem < 300000); }
    if (rem <= 0){ clearInterval(State.examTick); submitExam(true); }
  }, 1000);
}
function renderCurrentQuestion(questions){
  const area = $('#question-area'); if (!area) return;
  area.innerHTML = '';
  const idx = Math.max(0, Math.min(State.currentQIdx, questions.length - 1));
  State.currentQIdx = idx;
  const q = questions[idx], at = State.examAttempt;
  const answer = at.answers?.[q.id];
  const card = h('div', { class:'question-card' });
  card.appendChild(h('div', { class:'q-head' },
    h('div', { class:'q-index' }, 'Soal ' + (idx + 1) + ' / ' + questions.length),
    h('button', { class:'icon-btn', title:'Tandai soal', style: answer?.flagged ? 'color:var(--warning)' : '', onclick: () => { toggleFlag(q.id); renderCurrentQuestion(questions); }, html:I.flag })));
  card.appendChild(h('div', { class:'q-text', html:esc(q.text || '').replace(/\n/g, '<br>') }));
  const opts = h('div', { class:'q-options' });
  if (q.type === 'pg' || !q.type){
    (q.options || []).forEach((o, i) => {
      const selected = answer?.value === i;
      opts.appendChild(h('label', { class:'opt ' + (selected ? 'selected' : ''), onclick: e => { e.preventDefault(); setAnswer(q.id, i); renderCurrentQuestion(questions); } },
        h('div', { class:'opt-key' }, String.fromCharCode(65 + i)), h('div', {}, o)));
    });
  } else if (q.type === 'bs'){
    ['Benar','Salah'].forEach((t, i) => {
      const v = i === 0 ? 'true' : 'false';
      const selected = String(answer?.value) === v;
      opts.appendChild(h('label', { class:'opt ' + (selected ? 'selected' : ''), onclick: e => { e.preventDefault(); setAnswer(q.id, v); renderCurrentQuestion(questions); } },
        h('div', { class:'opt-key' }, t[0]), h('div', {}, t)));

  } else if (q.type === 'esai' || q.type === 'isian' || q.type === 'numerik'){
    const inp = h(q.type === 'esai' ? 'textarea' : 'input', {
      class:q.type === 'esai' ? 'textarea' : 'input',
      placeholder:'Tulis jawaban Anda...', value:answer?.value || '',
      oninput: e => debounceSetAnswer(q.id, e.target.value)
    });
    opts.appendChild(inp);
  } else opts.appendChild(h('p', { class:'text-muted' }, 'Tipe soal tidak didukung.'));
  card.appendChild(opts);
  card.appendChild(h('div', { class:'q-actions' },
    h('button', { class:'btn btn-secondary', disabled:idx === 0, onclick: () => { State.currentQIdx = idx - 1; renderCurrentQuestion(questions); } }, '← Sebelumnya'),
    h('span', { class:'save-status', id:'save-status' }, 'Tersimpan otomatis'),
    h('button', { class:'btn btn-primary', disabled:idx === questions.length - 1, onclick: () => { State.currentQIdx = idx + 1; renderCurrentQuestion(questions); } }, 'Berikutnya →')));
  area.appendChild(card);
  updateNavGrid();
}
function updateNavGrid(){
  const grid = $('#nav-grid'); if (!grid) return;
  grid.innerHTML = '';
  const questions = State.examQuestions || [];
  questions.forEach((q, i) => {
    const at = State.examAttempt; const ans = at.answers?.[q.id];
    const cls = ['q-num'];
    if (i === State.currentQIdx) cls.push('current');
    else if (ans?.flagged) cls.push('flagged');
    else if (ans) cls.push('answered');
    grid.appendChild(h('button', { class:cls.join(' '), onclick: () => { State.currentQIdx = i; renderCurrentQuestion(questions); } }, String(i + 1)));
  });
}
function setAnswer(qid, value){
  if (!State.examAttempt.answers) State.examAttempt.answers = {};
  State.examAttempt.answers[qid] = { value, updatedAt:now() };
  syncAnswer(qid);
}
const debounceTimers = {};
function debounceSetAnswer(qid, value){
  if (!State.examAttempt.answers) State.examAttempt.answers = {};
  State.examAttempt.answers[qid] = { value, updatedAt:now() };
  const el = $('#save-status'); if (el){ el.textContent = 'Menyimpan...'; el.className = 'save-status saving'; }
  clearTimeout(debounceTimers[qid]);
  debounceTimers[qid] = setTimeout(() => syncAnswer(qid), 600);
}
async function syncAnswer(qid){
  const at = State.examAttempt, el = $('#save-status');
  try {
    await DB.set('examAnswers/' + at.examId + '/' + State.user.uid + '/' + at.attemptId + '/' + qid, { value:at.answers[qid].value, updatedAt:now() });
    await DB.update('examAttempts/' + at.examId + '/' + State.user.uid + '/' + at.attemptId + '/answers/' + qid, at.answers[qid]);
    if (el){ el.textContent = 'Tersimpan'; el.className = 'save-status saved'; }
  } catch(err){
    if (el){ el.textContent = 'Gagal menyimpan'; el.className = 'save-status error'; }
    console.warn('save err', err);
  }
}
function toggleFlag(qid){
  if (!State.examAttempt.answers) State.examAttempt.answers = {};
  const cur = State.examAttempt.answers[qid] || { value:null };
  cur.flagged = !cur.flagged; cur.updatedAt = now();
  State.examAttempt.answers[qid] = cur;
  syncAnswer(qid);
}
function confirmSubmit(){
  const at = State.examAttempt, qs = State.examQuestions || [];
  const un = qs.filter(q => { const a = at.answers?.[q.id]; return !a || a.value == null || a.value === ''; }).length;
  confirmDialog('Kumpulkan Ujian?', 'Anda memiliki ' + un + ' soal belum dijawab dari ' + qs.length + ' soal. Setelah dikumpulkan, jawaban tidak dapat diubah.', async () => { await submitExam(false); }, { okText:'Kumpulkan' });
}
async function submitExam(auto){
  const at = State.examAttempt; if (!at) return;
  try {
    const grade = autoGrade(State.examQuestions || [], at.answers || {});
    await DB.update('examAttempts/' + at.examId + '/' + State.user.uid + '/' + at.attemptId, { status:'submitted', submittedAt:now(), autoSubmitted:!!auto, ...grade });
    await DB.set('examResults/' + at.examId + '/' + State.user.uid + '/' + at.attemptId, {
      examId:at.examId, userId:State.user.uid, userName:State.profile.displayName,
      attemptId:at.attemptId, submittedAt:now(), ...grade });
    if (State.examTick) clearInterval(State.examTick);
    toast('Berhasil dikumpulkan', auto ? 'Waktu habis. Ujian otomatis dikumpulkan.' : 'Jawaban Anda telah tersimpan.', 'success');
    State.examAttempt = null; State.currentExam = null; State.currentQIdx = 0;
    navigate('my-results');
  } catch(err){ toast('Gagal', err.message, 'error'); }
}
function autoGrade(questions, answers){
  let score = 0, correct = 0, wrong = 0, empty = 0, maxScore = 0;
  for (const q of questions){
    const pts = q.points || 1; maxScore += pts;
    const a = answers[q.id];
    if (!a || a.value == null || a.value === ''){ empty++; continue; }
    if (['pg','bs','numerik','isian'].includes(q.type)){
      if (String(a.value) === String(q.answer)){ score += pts; correct++; } else wrong++;
    }
  }
  const finalScore = maxScore ? Math.round((score / maxScore) * 100) : 0;
  return { score, maxScore, finalScore, correct, wrong, empty };
}

function toCSV(rows){
  if (!rows.length) return '';
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(',')];
  rows.forEach(r => lines.push(headers.map(h2 => '"' + String(r[h2] ?? '').replace(/"/g, '""') + '"').join(',')));
  return lines.join('\n');
}
function downloadCSV(name, csv){
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  const semIn = h('select', { class:'select' }, h('option', { value:'Ganjil', selected:school.semester === 'Ganjil' }, 'Ganjil'), h('option', { value:'Genap', selected:school.semester === 'Genap' }, 'Genap'));
  const tzIn = h('input', { class:'input', value:school.timezone || 'Asia/Jakarta' });
  page.appendChild(h('div', { class:'card', style:'max-width:640px' },
    h('div', { class:'form-group' }, h('label', { class:'label' }, 'Nama Sekolah'), nameIn),
    h('div', { class:'form-row' },
      h('div', { class:'form-group' }, h('label', { class:'label' }, 'Tahun Ajaran'), yearIn),
      h('div', { class:'form-group' }, h('label', { class:'label' }, 'Semester'), semIn)),
    h('div', { class:'form-group' }, h('label', { class:'label' }, 'Zona Waktu'), tzIn),
    h('button', { class:'btn btn-primary', onclick: async (e) => {
      e.target.disabled = true; e.target.innerHTML = '<span class="spinner"></span>';
      try {
        await DB.set('appSettings/school', { name:nameIn.value, year:yearIn.value, semester:semIn.value, timezone:tzIn.value, updatedAt:now() });
        State.school = { name:nameIn.value, year:yearIn.value, semester:semIn.value };
        toast('Berhasil', 'Pengaturan disimpan', 'success');
      } catch(err){ toast('Gagal', err.message, 'error'); }
      e.target.disabled = false; e.target.textContent = 'Simpan';
    }}, 'Simpan Pengaturan')));
  c.appendChild(page);
}

/* ============ PROFILE ============ */
function renderProfilePage(c){
  const page = h('div', { class:'page active' });
  const p = State.profile || {};
  const initials = (p.displayName || 'U').split(' ').map(s => s[0]).slice(0,2).join('').toUpperCase();
  page.appendChild(h('div', { class:'page-head' }, h('div', {}, h('h1', {}, 'Profil Saya'), h('p', {}, 'Kelola informasi akun Anda.'))));
  const nameIn = h('input', { class:'input', value:p.displayName || '' });
  const av = p.photoURL ? h('div', { class:'avatar lg' }, h('img', { src:p.photoURL, alt:'' })) : h('div', { class:'avatar lg' }, initials);
  page.appendChild(h('div', { class:'card', style:'max-width:640px' },
    h('div', { style:'display:flex;gap:18px;align-items:center;margin-bottom:26px;flex-wrap:wrap' },
      av,
      h('div', {},
        h('b', { style:'font-size:18px;display:block;margin-bottom:3px' }, p.displayName || 'Pengguna'),
        h('div', { class:'text-sm text-muted' }, p.email || ''),
        h('div', { class:'mt-2' },
          h('span', { class:'badge badge-primary' }, ROLE_LABELS[p.role] || p.role),
          p.status === 'pending' ? h('span', { class:'badge badge-warning', style:'margin-left:6px' }, 'Menunggu Verifikasi') : null))),
    h('div', { class:'form-group' }, h('label', { class:'label' }, 'Nama Lengkap'), nameIn),
    h('button', { class:'btn btn-primary', onclick: async (e) => {
      e.target.disabled = true; e.target.innerHTML = '<span class="spinner"></span>';
      try {
        await DB.update('users/' + State.user.uid, { displayName:nameIn.value.trim(), updatedAt:now() });
        await updateProfile(auth.currentUser, { displayName:nameIn.value.trim() });
        State.profile.displayName = nameIn.value.trim();
        toast('Berhasil', 'Profil diperbarui', 'success');
        renderAppShell();
      } catch(err){ toast('Gagal', err.message, 'error'); }
      e.target.disabled = false; e.target.textContent = 'Simpan Profil';
    }}, 'Simpan Profil')));
  c.appendChild(page);
}

/* ============ AUTH STATE LISTENER ============ */
onAuthStateChanged(auth, async (user) => {
  if (State.examTick){ clearInterval(State.examTick); State.examTick = null; }
  if (!user){
    State.user = null; State.profile = null; DB.clearListeners();
    State.page = 'dashboard';
    renderLanding();
    return;
  }
  State.user = user;
  try {
    const existing = await DB.get('users/' + user.uid);
    if (existing){
      State.profile = existing;
      // Cek status
      if (existing.status === 'pending' && existing.role === 'teacher'){ renderPendingScreen(); return; }
      if (existing.status === 'inactive'){ toast('Akun dinonaktifkan','Hubungi administrator sekolah.','error',6000); await AuthSvc.logout(); return; }
      // Load school + verifications
      try {
        State.school = await DB.get('appSettings/school') || { name:'Sekolah CAZOO', year:'2024/2025', semester:'Ganjil' };
        if (['admin','superadmin'].includes(existing.role)){
          const v = await DB.get('teacherVerifications') || {};
          State.pendingVerifications = Object.values(v).filter(x => x.status === 'pending');
        }
      } catch(e){ console.warn('load meta', e); }
      State.page = 'dashboard';
      renderAppShell();
    } else {
      // User baru — biarkan doRegister / doGoogle yang handle
      // Kalau tidak ada signup context & bukan google, ini tidak seharusnya terjadi
      if (!State.signupContext && !State.googleModalShown){
        // Fallback: buat profile default sebagai student
        const profile = {
          uid: user.uid, email: user.email,
          displayName: user.displayName || user.email.split('@')[0],
          photoURL: user.photoURL || null,
          role: 'student', status: 'active', provider: 'password',
          createdAt: now(), updatedAt: now()
        };
        await DB.set('users/' + user.uid, profile);
        State.profile = profile;
        State.school = await DB.get('appSettings/school') || { name:'Sekolah CAZOO', year:'2024/2025', semester:'Ganjil' };
        State.page = 'dashboard';
        renderAppShell();
      }
    }
  } catch(err){
    console.error('onAuthStateChanged error', err);
    toast('Error', err.message, 'error');
  }
});

/* ============ CONNECTION MONITOR ============ */
try {
  onValue(ref(db, '.info/connected'), snap => {
    const el = $('#conn-status'); if (!el) return;
    if (snap.val() === true) el.classList.remove('show');
    else el.classList.add('show');
  });
} catch(e){ console.warn('conn monitor', e); }

console.log('%cCAZOO','color:#4F46E5;font-weight:bold;font-size:16px','siap digunakan');
</script>
