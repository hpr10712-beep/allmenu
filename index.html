<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Minecraft HD - Open World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }

        /* LOADING SCREEN */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        #loading-screen.hidden {
            opacity: 0;
        }
        #loading-screen h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
            letter-spacing: 2px;
        }
        #loading-bar-container {
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.1);
        }
        #loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        #loading-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-top: 16px;
            letter-spacing: 1px;
        }
        #loading-percent {
            color: #fff;
            font-weight: bold;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            opacity: 0.9;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 2px;
        }
        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        #crosshair::after {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }
        #crosshair-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }

        /* Hotbar */
        #hotbar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            pointer-events: auto;
        }
        .slot {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            user-select: none;
        }
        .slot.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .slot .color-preview {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .slot .key {
            position: absolute;
            top: 2px;
            left: 6px;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: bold;
        }

        /* Info */
        #info {
            position: absolute;
            top: 16px;
            left: 16px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            line-height: 1.6;
            pointer-events: none;
            user-select: none;
        }
        #info strong {
            color: rgba(255, 255, 255, 0.9);
        }

        /* Minimap */
        #minimap {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            background: #2d5a3d;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        #minimap canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        #minimap .player-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #ffd700;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            pointer-events: none;
            transition: all 0.1s;
        }
        #minimap .compass {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            font-weight: bold;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            letter-spacing: 1px;
        }

        /* Skin Selector */
        #skin-selector {
            position: absolute;
            bottom: 110px;
            left: 20px;
            display: flex;
            gap: 8px;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .skin-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.05);
        }
        .skin-btn:hover {
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }
        .skin-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
        }

        /* Controls hint */
        #controls-hint {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            user-select: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: opacity 0.8s;
        }
        #controls-hint.hidden {
            opacity: 0;
        }

        /* Block count */
        #block-count {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            user-select: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #minimap {
                width: 100px;
                height: 100px;
                bottom: 80px;
                right: 10px;
            }
            .slot {
                width: 40px;
                height: 40px;
            }
            .slot .color-preview {
                width: 22px;
                height: 22px;
            }
            #skin-selector {
                bottom: 90px;
                left: 10px;
                padding: 4px 8px;
            }
            .skin-btn {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
            #info {
                font-size: 11px;
                top: 10px;
                left: 10px;
            }
            #controls-hint {
                font-size: 10px;
                bottom: 150px;
                padding: 4px 12px;
            }
            #loading-screen h1 {
                font-size: 1.8rem;
            }
            #loading-bar-container {
                width: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <h1>⛏️ MEMUAT DUNIA</h1>
        <div id="loading-bar-container">
            <div id="loading-bar"></div>
        </div>
        <div id="loading-text">Membangun medan... <span id="loading-percent">0%</span></div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="crosshair"><div id="crosshair-dot"></div></div>
        <div id="info">
            <strong>⛏️ MINECRAFT HD</strong><br />
            <span id="pos-info">0, 0, 0</span>
        </div>
        <div id="controls-hint">🖱️ Klik untuk mulai · WASD gerak · SPACE lompat · Klik kiri hancurkan · Klik kanan pasang</div>

        <div id="skin-selector">
            <button class="skin-btn active" data-skin="steve" title="Steve">🧑</button>
            <button class="skin-btn" data-skin="alex" title="Alex">👩</button>
            <button class="skin-btn" data-skin="knight" title="Knight">⚔️</button>
            <button class="skin-btn" data-skin="ninja" title="Ninja">🥷</button>
            <button class="skin-btn" data-skin="wizard" title="Wizard">🧙</button>
        </div>

        <div id="minimap">
            <div class="compass">N</div>
            <canvas id="minimap-canvas" width="140" height="140"></canvas>
            <div class="player-dot"></div>
        </div>

        <div id="hotbar"></div>
        <div id="block-count">Blocks: <span id="block-count-num">0</span></div>
    </div>

    <!-- Three.js Imports -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ──────────────────────────────────────────────
        // IMPORTS
        // ──────────────────────────────────────────────
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

        // ──────────────────────────────────────────────
        // DOM REFS
        // ──────────────────────────────────────────────
        const hotbarEl = document.getElementById('hotbar');
        const posInfo = document.getElementById('pos-info');
        const controlsHint = document.getElementById('controls-hint');
        const minimapCanvas = document.getElementById('minimap-canvas');
        const ctx = minimapCanvas.getContext('2d');
        const blockCountNum = document.getElementById('block-count-num');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingBar = document.getElementById('loading-bar');
        const loadingPercent = document.getElementById('loading-percent');

        // ──────────────────────────────────────────────
        // LOADING PROGRESS
        // ──────────────────────────────────────────────
        let loadProgress = 0;

        function updateLoading(progress, text) {
            loadProgress = Math.min(100, progress);
            loadingBar.style.width = loadProgress + '%';
            loadingPercent.textContent = Math.round(loadProgress) + '%';
            if (text) document.getElementById('loading-text').innerHTML = text + ' <span id="loading-percent">' + Math
                .round(loadProgress) + '%</span>';
        }

        // ──────────────────────────────────────────────
        // SCENE SETUP
        // ──────────────────────────────────────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 90);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(8, 6, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.prepend(renderer.domElement);

        // ──────────────────────────────────────────────
        // POST PROCESSING (BLOOM for HD)
        // ──────────────────────────────────────────────
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.15, // strength
            0.4, // radius
            0.2 // threshold
        );
        composer.addPass(bloomPass);

        // ──────────────────────────────────────────────
        // CONTROLS
        // ──────────────────────────────────────────────
        const controls = new PointerLockControls(camera, renderer.domElement);

        // ──────────────────────────────────────────────
        // LIGHTING (HD)
        // ──────────────────────────────────────────────
        const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 0.6);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 2.0);
        sunLight.position.set(30, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 80;
        sunLight.shadow.camera.left = -40;
        sunLight.shadow.camera.right = 40;
        sunLight.shadow.camera.top = 40;
        sunLight.shadow.camera.bottom = -40;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-20, 10, -20);
        scene.add(fillLight);

        // ──────────────────────────────────────────────
        // BLOCK DEFINITIONS (Sederhana & Cepat)
        // ──────────────────────────────────────────────
        const BLOCK_TYPES = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3,
            WOOD: 4,
            LEAVES: 5,
            SAND: 6,
            PLANKS: 7,
            COBBLESTONE: 8,
            BRICK: 9,
            SNOW: 10,
            OAK_LOG: 11,
        };

        const BLOCK_COLORS = {
            [BLOCK_TYPES.GRASS]: 0x7cb342,
            [BLOCK_TYPES.DIRT]: 0x8d6e63,
            [BLOCK_TYPES.STONE]: 0x9e9e9e,
            [BLOCK_TYPES.WOOD]: 0x8d6e63,
            [BLOCK_TYPES.LEAVES]: 0x4caf50,
            [BLOCK_TYPES.SAND]: 0xf5e6b8,
            [BLOCK_TYPES.PLANKS]: 0xdeb887,
            [BLOCK_TYPES.COBBLESTONE]: 0x757575,
            [BLOCK_TYPES.BRICK]: 0xb85a3a,
            [BLOCK_TYPES.SNOW]: 0xf0f4f8,
            [BLOCK_TYPES.OAK_LOG]: 0x8d6e63,
        };

        const BLOCK_SOLID = {
            [BLOCK_TYPES.AIR]: false,
            [BLOCK_TYPES.GRASS]: true,
            [BLOCK_TYPES.DIRT]: true,
            [BLOCK_TYPES.STONE]: true,
            [BLOCK_TYPES.WOOD]: true,
            [BLOCK_TYPES.LEAVES]: true,
            [BLOCK_TYPES.SAND]: true,
            [BLOCK_TYPES.PLANKS]: true,
            [BLOCK_TYPES.COBBLESTONE]: true,
            [BLOCK_TYPES.BRICK]: true,
            [BLOCK_TYPES.SNOW]: true,
            [BLOCK_TYPES.OAK_LOG]: true,
        };

        const BLOCK_TRANSPARENT = {
            [BLOCK_TYPES.AIR]: true,
            [BLOCK_TYPES.GRASS]: false,
            [BLOCK_TYPES.DIRT]: false,
            [BLOCK_TYPES.STONE]: false,
            [BLOCK_TYPES.WOOD]: false,
            [BLOCK_TYPES.LEAVES]: true,
            [BLOCK_TYPES.SAND]: false,
            [BLOCK_TYPES.PLANKS]: false,
            [BLOCK_TYPES.COBBLESTONE]: false,
            [BLOCK_TYPES.BRICK]: false,
            [BLOCK_TYPES.SNOW]: false,
            [BLOCK_TYPES.OAK_LOG]: false,
        };

        // ──────────────────────────────────────────────
        // TEXTURE ATLAS SEDERHANA (untuk performa)
        // ──────────────────────────────────────────────
        function generateSimpleTexture(color, size = 32) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const c = canvas.getContext('2d');
            c.fillStyle = '#' + color.toString(16).padStart(6, '0');
            c.fillRect(0, 0, size, size);
            // Tambah noise ringan
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * size,
                    y = Math.random() * size;
                const bright = (Math.random() - 0.5) * 20;
                const r = parseInt(color.toString(16).slice(0, 2), 16) + bright;
                const g = parseInt(color.toString(16).slice(2, 4), 16) + bright;
                const b = parseInt(color.toString(16).slice(4, 6), 16) + bright;
                c.fillStyle = `rgba(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))},0.3)`;
                c.fillRect(x, y, 2 + Math.random() * 4, 2 + Math.random() * 4);
            }
            return canvas;
        }

        const textureCache = new Map();

        function getBlockTexture(type) {
            if (textureCache.has(type)) return textureCache.get(type);
            const color = BLOCK_COLORS[type] || 0x888888;
            const canvas = generateSimpleTexture(color);
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            textureCache.set(type, tex);
            return tex;
        }

        // Grass special (top hijau, side coklat)
        function getGrassTextures() {
            const size = 32;
            const topCanvas = document.createElement('canvas');
            topCanvas.width = size;
            topCanvas.height = size;
            const tCtx = topCanvas.getContext('2d');
            tCtx.fillStyle = '#7cb342';
            tCtx.fillRect(0, 0, size, size);
            for (let i = 0; i < 50; i++) {
                tCtx.fillStyle = `rgba(${60+Math.random()*80},${160+Math.random()*60},${40+Math.random()*60},0.3)`;
                tCtx.fillRect(Math.random() * size, Math.random() * size, 1 + Math.random() * 2, 2 + Math.random() * 4);
            }
            const topTex = new THREE.CanvasTexture(topCanvas);
            topTex.magFilter = THREE.NearestFilter;
            topTex.minFilter = THREE.NearestFilter;

            const sideCanvas = document.createElement('canvas');
            sideCanvas.width = size;
            sideCanvas.height = size;
            const sCtx = sideCanvas.getContext('2d');
            sCtx.fillStyle = '#8d6e63';
            sCtx.fillRect(0, 0, size, size);
            sCtx.fillStyle = '#7cb342';
            sCtx.fillRect(0, 0, size, size * 0.2);
            for (let i = 0; i < 20; i++) {
                sCtx.fillStyle = `rgba(${60+Math.random()*80},${160+Math.random()*60},${40+Math.random()*60},0.3)`;
                sCtx.fillRect(Math.random() * size, Math.random() * size * 0.2, 1 + Math.random() * 2, 2 + Math.random() *
                4);
            }
            const sideTex = new THREE.CanvasTexture(sideCanvas);
            sideTex.magFilter = THREE.NearestFilter;
            sideTex.minFilter = THREE.NearestFilter;

            const bottomCanvas = document.createElement('canvas');
            bottomCanvas.width = size;
            bottomCanvas.height = size;
            const bCtx = bottomCanvas.getContext('2d');
            bCtx.fillStyle = '#8d6e63';
            bCtx.fillRect(0, 0, size, size);
            const bottomTex = new THREE.CanvasTexture(bottomCanvas);
            bottomTex.magFilter = THREE.NearestFilter;
            bottomTex.minFilter = THREE.NearestFilter;

            return { top: topTex, side: sideTex, bottom: bottomTex };
        }

        const grassTex = getGrassTextures();

        // ──────────────────────────────────────────────
        // WORLD DATA (Ringan)
        // ──────────────────────────────────────────────
        const WORLD_SIZE = 32;
        const WORLD_HALF = WORLD_SIZE / 2;
        const MAX_HEIGHT = 12;

        // Map untuk block data
        const world = new Map(); // key "x,y,z" -> type
        // Instanced mesh per tipe
        const instanceMeshes = new Map(); // type -> { mesh, dummy, count, positions }
        const instanceCounts = new Map(); // type -> number

        // Untuk tracking posisi instance (agar bisa dihapus)
        const blockInstanceMap = new Map(); // key "x,y,z" -> { type, index }

        // Geometry dasar
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        // ──────────────────────────────────────────────
        // FUNGSI INSTANCED MESH
        // ──────────────────────────────────────────────
        const dummy = new THREE.Object3D();

        function createInstanceMesh(type) {
            if (instanceMeshes.has(type)) return instanceMeshes.get(type);

            let material;
            if (type === BLOCK_TYPES.GRASS) {
                // Multi-material untuk grass (top, bottom, side)
                const topMat = new THREE.MeshStandardMaterial({ map: grassTex.top, roughness: 0.8 });
                const sideMat = new THREE.MeshStandardMaterial({ map: grassTex.side, roughness: 0.9 });
                const bottomMat = new THREE.MeshStandardMaterial({ map: grassTex.bottom, roughness: 0.9 });
                material = [sideMat, sideMat, topMat, bottomMat, sideMat, sideMat];
            } else {
                const tex = getBlockTexture(type);
                const mat = new THREE.MeshStandardMaterial({
                    map: tex,
                    roughness: 0.8,
                    metalness: 0.0,
                    transparent: BLOCK_TRANSPARENT[type] || false,
                    opacity: 1.0,
                });
                material = mat;
            }

            const mesh = new THREE.InstancedMesh(boxGeo, material, 0);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(mesh);

            const data = {
                mesh,
                dummy,
                count: 0,
                positions: [],
            };
            instanceMeshes.set(type, data);
            instanceCounts.set(type, 0);

            return data;
        }

        function addBlockInstance(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (blockInstanceMap.has(key)) return; // sudah ada

            const data = createInstanceMesh(type);
            const mesh = data.mesh;
            const currentCount = data.count;

            // Resize instance matrix jika perlu
            if (currentCount >= mesh.count) {
                const newCount = Math.max(16, currentCount * 2);
                mesh.instanceMatrix = new THREE.InstancedBufferAttribute(
                    new Float32Array(newCount * 16),
                    16
                );
                mesh.count = newCount;
                // Kita simpan matrix array untuk update
                if (!data.matrixArray) {
                    data.matrixArray = new Float32Array(newCount * 16);
                } else {
                    const old = data.matrixArray;
                    data.matrixArray = new Float32Array(newCount * 16);
                    data.matrixArray.set(old);
                }
            }

            // Set posisi
            dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
            dummy.updateMatrix();
            const matrix = dummy.matrix;
            const arr = data.matrixArray;
            for (let i = 0; i < 16; i++) {
                arr[currentCount * 16 + i] = matrix.elements[i];
            }

            // Update mesh
            mesh.instanceMatrix.array = arr;
            mesh.instanceMatrix.needsUpdate = true;

            // Simpan index
            blockInstanceMap.set(key, { type, index: currentCount });
            data.count = currentCount + 1;
            instanceCounts.set(type, data.count);

            world.set(key, type);
        }

        function removeBlockInstance(x, y, z) {
            const key = `${x},${y},${z}`;
            const entry = blockInstanceMap.get(key);
            if (!entry) return false;

            const { type, index } = entry;
            const data = instanceMeshes.get(type);
            if (!data) return false;

            const lastIndex = data.count - 1;
            if (index !== lastIndex) {
                // Swap with last
                const lastKey = data.positions[lastIndex];
                const lastEntry = blockInstanceMap.get(lastKey);
                if (lastEntry) {
                    lastEntry.index = index;
                    blockInstanceMap.set(lastKey, lastEntry);
                }
                // Copy matrix from last to index
                const arr = data.matrixArray;
                for (let i = 0; i < 16; i++) {
                    arr[index * 16 + i] = arr[lastIndex * 16 + i];
                }
                // Update posisi di positions
                data.positions[index] = data.positions[lastIndex];
            }

            data.count--;
            instanceCounts.set(type, data.count);
            data.positions.pop();

            // Update mesh count
            data.mesh.count = data.count;
            data.mesh.instanceMatrix.array = data.matrixArray;
            data.mesh.instanceMatrix.needsUpdate = true;

            // Hapus dari world dan map
            world.delete(key);
            blockInstanceMap.delete(key);

            // Jika count 0, kita bisa hapus mesh (opsional)
            if (data.count === 0) {
                scene.remove(data.mesh);
                instanceMeshes.delete(type);
                instanceCounts.delete(type);
            }

            return true;
        }

        function getBlock(x, y, z) {
            return world.get(`${x},${y},${z}`) || BLOCK_TYPES.AIR;
        }

        function isSolid(x, y, z) {
            const type = getBlock(x, y, z);
            return BLOCK_SOLID[type] || false;
        }

        function setBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (type === BLOCK_TYPES.AIR) {
                return removeBlockInstance(x, y, z);
            } else {
                // Cek apakah sudah ada
                if (blockInstanceMap.has(key)) {
                    // Jika tipe sama, skip
                    if (blockInstanceMap.get(key).type === type) return true;
                    // Hapus dulu
                    removeBlockInstance(x, y, z);
                }
                addBlockInstance(x, y, z, type);
                updateMinimap();
                updateBlockCount();
                return true;
            }
        }

        function updateBlockCount() {
            blockCountNum.textContent = world.size;
        }

        // ──────────────────────────────────────────────
        // WORLD GENERATION (Ringan)
        // ──────────────────────────────────────────────
        function generateTerrain() {
            const heightMap = new Map();

            // Simple noise manual untuk menghindari library berat
            function simpleNoise(x, z) {
                const n = Math.sin(x * 0.1 + z * 0.13) * 0.5 +
                    Math.sin(x * 0.05 + z * 0.07 + 1.2) * 0.3 +
                    Math.cos(x * 0.02 + z * 0.03) * 0.2;
                return n;
            }

            // Build heightmap
            let totalBlocks = 0;
            for (let x = -WORLD_HALF; x < WORLD_HALF; x++) {
                for (let z = -WORLD_HALF; z < WORLD_HALF; z++) {
                    const n = simpleNoise(x, z);
                    const height = Math.floor((n + 0.6) * 4) + 3;
                    const clamped = Math.max(1, Math.min(MAX_HEIGHT - 2, height));
                    heightMap.set(`${x},${z}`, clamped);
                    totalBlocks += clamped;
                }
            }

            let processed = 0;
            const total = totalBlocks;

            // Place blocks
            for (let x = -WORLD_HALF; x < WORLD_HALF; x++) {
                for (let z = -WORLD_HALF; z < WORLD_HALF; z++) {
                    const height = heightMap.get(`${x},${z}`) || 3;
                    let surfaceType = BLOCK_TYPES.GRASS;
                    if (height < 2) surfaceType = BLOCK_TYPES.SAND;
                    else if (height > 8) surfaceType = BLOCK_TYPES.SNOW;

                    for (let y = 0; y < height; y++) {
                        let type;
                        if (y === height - 1) type = surfaceType;
                        else if (y > height - 4) type = BLOCK_TYPES.DIRT;
                        else type = BLOCK_TYPES.STONE;
                        addBlockInstance(x, y, z, type);
                        processed++;
                        if (processed % 100 === 0) {
                            updateLoading((processed / total) * 100, 'Membangun medan...');
                        }
                    }
                }
            }

            // Place trees (lebih sedikit untuk performa)
            for (let x = -WORLD_HALF + 2; x < WORLD_HALF - 2; x += 4) {
                for (let z = -WORLD_HALF + 2; z < WORLD_HALF - 2; z += 4) {
                    if (Math.random() < 0.12) {
                        const height = heightMap.get(`${x},${z}`) || 3;
                        if (height > 2 && height < 8) {
                            placeTree(x, height, z);
                            processed += 20;
                            updateLoading((processed / total) * 100, 'Menanam pohon...');
                        }
                    }
                }
            }

            updateMinimap();
            updateBlockCount();
            updateLoading(100, 'Selesai!');
        }

        function placeTree(x, y, z) {
            const logType = BLOCK_TYPES.OAK_LOG;
            const leafType = BLOCK_TYPES.LEAVES;
            const trunkHeight = 4 + Math.floor(Math.random() * 2);

            for (let i = 0; i < trunkHeight; i++) {
                addBlockInstance(x, y + i, z, logType);
            }

            const leafStart = trunkHeight - 2;
            for (let dy = 0; dy < 3; dy++) {
                const radius = dy === 0 ? 2 : (dy === 1 ? 1 : 1);
                for (let dx = -radius; dx <= radius; dx++) {
                    for (let dz = -radius; dz <= radius; dz++) {
                        if (Math.abs(dx) === radius && Math.abs(dz) === radius && Math.random() < 0.4) continue;
                        if (dx === 0 && dz === 0 && dy < 2) continue;
                        const lx = x + dx,
                            lz = z + dz,
                            ly = y + leafStart + dy;
                        if (getBlock(lx, ly, lz) === BLOCK_TYPES.AIR) {
                            addBlockInstance(lx, ly, lz, leafType);
                        }
                    }
                }
            }
        }

        // ──────────────────────────────────────────────
        // MINIMAP
        // ──────────────────────────────────────────────
        function updateMinimap() {
            const size = 140;
            const scale = size / WORLD_SIZE;

            ctx.clearRect(0, 0, size, size);
            const bgGrad = ctx.createRadialGradient(70, 70, 10, 70, 70, 70);
            bgGrad.addColorStop(0, '#3a7d44');
            bgGrad.addColorStop(1, '#2d5a3d');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, size, size);

            const half = WORLD_HALF;
            for (let x = -half; x < half; x++) {
                for (let z = -half; z < half; z++) {
                    let topType = BLOCK_TYPES.AIR;
                    for (let y = MAX_HEIGHT - 1; y >= 0; y--) {
                        const type = getBlock(x, y, z);
                        if (type !== BLOCK_TYPES.AIR) {
                            topType = type;
                            break;
                        }
                    }
                    if (topType === BLOCK_TYPES.AIR) continue;
                    const color = BLOCK_COLORS[topType] || 0x888888;
                    const hex = '#' + color.toString(16).padStart(6, '0');
                    ctx.fillStyle = hex;
                    ctx.fillRect((x + half) * scale, (z + half) * scale, scale + 0.5, scale + 0.5);
                }
            }

            // Grid halus
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= WORLD_SIZE; i += 8) {
                const pos = i * scale;
                ctx.beginPath();
                ctx.moveTo(pos, 0);
                ctx.lineTo(pos, size);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, pos);
                ctx.lineTo(size, pos);
                ctx.stroke();
            }
        }

        // ──────────────────────────────────────────────
        // SKIN SYSTEM (Sederhana)
        // ──────────────────────────────────────────────
        let currentSkin = 'steve';
        let playerModel = null;

        const SKIN_COLORS = {
            steve: { head: '#ffcc99', body: '#4caf50', arms: '#3d8b40', legs: '#1a237e', boots: '#5d4037' },
            alex: { head: '#ffcc99', body: '#ff6f00', arms: '#e65100', legs: '#1a237e', boots: '#5d4037' },
            knight: { head: '#bdbdbd', body: '#757575', arms: '#9e9e9e', legs: '#424242', boots: '#212121' },
            ninja: { head: '#1a1a2e', body: '#2d2d44', arms: '#1a1a2e', legs: '#0d0d1a', boots: '#0d0d1a' },
            wizard: { head: '#ffcc99', body: '#4a148c', arms: '#6a1b9a', legs: '#2d1b4e', boots: '#1a0d2e' },
        };

        function createPlayerModel(skinName) {
            if (playerModel) {
                scene.remove(playerModel);
                playerModel.traverse(c => { if (c.isMesh) { c.geometry?.dispose();
                        c.material?.dispose(); } });
                playerModel = null;
            }

            const group = new THREE.Group();
            const colors = SKIN_COLORS[skinName] || SKIN_COLORS.steve;

            function part(w, h, d, color, pos) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.1 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(pos[0], pos[1], pos[2]);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            group.add(part(0.6, 0.6, 0.6, colors.head, [0, 1.3, 0]));
            // Mata
            const eyeMat = new THREE.MeshStandardMaterial({ color: '#1a237e', emissive: '#1a237e', emissiveIntensity: 0.2 });
            const eyeGeo = new THREE.SphereGeometry(0.05, 6, 6);
            const eL = new THREE.Mesh(eyeGeo, eyeMat);
            eL.position.set(-0.15, 1.4, -0.3);
            group.add(eL);
            const eR = new THREE.Mesh(eyeGeo, eyeMat);
            eR.position.set(0.15, 1.4, -0.3);
            group.add(eR);

            group.add(part(0.7, 0.5, 0.4, colors.body, [0, 0.8, 0]));
            group.add(part(0.2, 0.5, 0.2, colors.arms, [-0.45, 0.8, 0]));
            group.add(part(0.2, 0.5, 0.2, colors.arms, [0.45, 0.8, 0]));
            group.add(part(0.2, 0.5, 0.2, colors.legs, [-0.15, 0.25, 0]));
            group.add(part(0.2, 0.5, 0.2, colors.legs, [0.15, 0.25, 0]));

            // Boots
            const bootMat = new THREE.MeshStandardMaterial({ color: colors.boots, roughness: 0.8 });
            const bootGeo = new THREE.BoxGeometry(0.22, 0.1, 0.25);
            const bL = new THREE.Mesh(bootGeo, bootMat);
            bL.position.set(-0.15, 0.05, 0.02);
            group.add(bL);
            const bR = new THREE.Mesh(bootGeo, bootMat);
            bR.position.set(0.15, 0.05, 0.02);
            group.add(bR);

            group.scale.set(0.5, 0.5, 0.5);
            playerModel = group;
            scene.add(group);
            return group;
        }

        // ──────────────────────────────────────────────
        // HOTBAR
        // ──────────────────────────────────────────────
        const hotbarSlots = [
            BLOCK_TYPES.GRASS,
            BLOCK_TYPES.DIRT,
            BLOCK_TYPES.STONE,
            BLOCK_TYPES.PLANKS,
            BLOCK_TYPES.COBBLESTONE,
            BLOCK_TYPES.BRICK,
            BLOCK_TYPES.OAK_LOG,
            BLOCK_TYPES.SAND,
            BLOCK_TYPES.SNOW,
        ];
        let selectedSlot = 0;

        function buildHotbar() {
            hotbarEl.innerHTML = '';
            hotbarSlots.forEach((type, index) => {
                const slot = document.createElement('div');
                slot.className = `slot ${index === selectedSlot ? 'active' : ''}`;
                const key = document.createElement('span');
                key.className = 'key';
                key.textContent = index + 1;
                slot.appendChild(key);

                const preview = document.createElement('div');
                preview.className = 'color-preview';
                const color = BLOCK_COLORS[type] || 0x888888;
                preview.style.background = '#' + color.toString(16).padStart(6, '0');
                slot.appendChild(preview);

                slot.addEventListener('click', () => {
                    selectedSlot = index;
                    updateHotbar();
                });
                hotbarEl.appendChild(slot);
            });
        }

        function updateHotbar() {
            const slots = hotbarEl.querySelectorAll('.slot');
            slots.forEach((slot, i) => {
                slot.classList.toggle('active', i === selectedSlot);
            });
        }

        function getSelectedBlockType() {
            return hotbarSlots[selectedSlot] || BLOCK_TYPES.GRASS;
        }

        // ──────────────────────────────────────────────
        // RAYCASTER
        // ──────────────────────────────────────────────
        const raycaster = new THREE.Raycaster();
        raycaster.far = 10;

        function getIntersection() {
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            // Kumpulkan semua mesh dari instanceMeshes
            const meshes = [];
            for (const [type, data] of instanceMeshes) {
                if (data.mesh) meshes.push(data.mesh);
            }
            const intersects = raycaster.intersectObjects(meshes);
            return intersects.length > 0 ? intersects[0] : null;
        }

        function getBlockFromIntersection(intersect) {
            if (!intersect) return null;
            const pos = new THREE.Vector3();
            intersect.object.getWorldPosition(pos);
            const x = Math.floor(pos.x - 0.5);
            const y = Math.floor(pos.y - 0.5);
            const z = Math.floor(pos.z - 0.5);
            const type = getBlock(x, y, z);
            if (type === BLOCK_TYPES.AIR) return null;
            return { x, y, z, type, normal: intersect.face?.normal || new THREE.Vector3(0, 1, 0) };
        }

        function getAdjacentBlock(intersect) {
            const block = getBlockFromIntersection(intersect);
            if (!block) return null;
            const n = block.normal;
            return {
                x: block.x + Math.round(n.x),
                y: block.y + Math.round(n.y),
                z: block.z + Math.round(n.z),
            };
        }

        // ──────────────────────────────────────────────
        // INPUT
        // ──────────────────────────────────────────────
        const keys = {};
        let isLocked = false;

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code >= 'Digit1' && e.code <= 'Digit9') {
                const idx = parseInt(e.code.charAt(5)) - 1;
                if (idx < hotbarSlots.length) {
                    selectedSlot = idx;
                    updateHotbar();
                }
            }
        });
        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        renderer.domElement.addEventListener('click', () => {
            if (!isLocked) controls.lock();
        });

        controls.addEventListener('lock', () => {
            isLocked = true;
            controlsHint.classList.add('hidden');
        });
        controls.addEventListener('unlock', () => {
            isLocked = false;
            controlsHint.classList.remove('hidden');
        });

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (!isLocked) return;
            if (e.button === 0) {
                const hit = getIntersection();
                if (hit) {
                    const block = getBlockFromIntersection(hit);
                    if (block && block.y > 0) {
                        setBlock(block.x, block.y, block.z, BLOCK_TYPES.AIR);
                    }
                }
            } else if (e.button === 2) {
                const hit = getIntersection();
                if (hit) {
                    const adj = getAdjacentBlock(hit);
                    if (adj) {
                        const { x, y, z } = adj;
                        const px = Math.floor(camera.position.x);
                        const py = Math.floor(camera.position.y - 1.6);
                        const pz = Math.floor(camera.position.z);
                        if (x === px && y === py && z === pz) return;
                        if (x === px && (y === py + 1 || y === py) && z === pz) return;
                        if (getBlock(x, y, z) === BLOCK_TYPES.AIR) {
                            setBlock(x, y, z, getSelectedBlockType());
                        }
                    }
                }
            }
        });
        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        // ──────────────────────────────────────────────
        // RESIZE
        // ──────────────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ──────────────────────────────────────────────
        // GAME LOOP
        // ──────────────────────────────────────────────
        const clock = new THREE.Clock();

        function updatePlayer() {
            if (!isLocked) return;
            const speed = 4.5;
            const delta = clock.getDelta();

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            const moveX = (keys['KeyA'] ? -1 : 0) + (keys['KeyD'] ? 1 : 0);
            const moveZ = (keys['KeyW'] ? -1 : 0) + (keys['KeyS'] ? 1 : 0);

            const velocity = new THREE.Vector3();
            velocity.addScaledVector(right, moveX * speed * delta);
            velocity.addScaledVector(forward, moveZ * speed * delta);

            let verticalVel = window._vVel || 0;
            const gravity = -20;
            if (keys['Space'] && window._grounded) verticalVel = 6;

            verticalVel += gravity * delta;
            if (verticalVel < -15) verticalVel = -15;

            const newPos = camera.position.clone();
            newPos.x += velocity.x;
            newPos.z += velocity.z;
            newPos.y += verticalVel * delta;

            // Collision sederhana
            let grounded = false;
            const testY = newPos.y - 1.3;
            for (let dx = -1; dx <= 1; dx++) {
                for (let dz = -1; dz <= 1; dz++) {
                    for (let dy = -1; dy <= 2; dy++) {
                        const bx = Math.floor(newPos.x + dx * 0.4);
                        const by = Math.floor(testY + dy * 0.4);
                        const bz = Math.floor(newPos.z + dz * 0.4);
                        if (isSolid(bx, by, bz)) {
                            const blockX = bx + 0.5,
                                blockY = by + 0.5,
                                blockZ = bz + 0.5;
                            const dx2 = newPos.x - blockX,
                                dy2 = testY - blockY,
                                dz2 = newPos.z - blockZ;
                            const half = 0.5 + 0.3;
                            if (Math.abs(dx2) < half && Math.abs(dy2) < half && Math.abs(dz2) < half) {
                                if (Math.abs(dx2) >= Math.abs(dy2) && Math.abs(dx2) >= Math.abs(dz2)) {
                                    newPos.x = blockX + (dx2 > 0 ? half : -half);
                                } else if (Math.abs(dy2) >= Math.abs(dz2)) {
                                    newPos.y = blockY + (dy2 > 0 ? half : -half) + 1.3;
                                    if (dy2 < 0) { grounded = true;
                                        verticalVel = 0; }
                                } else {
                                    newPos.z = blockZ + (dz2 > 0 ? half : -half);
                                }
                            }
                        }
                    }
                }
            }

            // Floor check
            const floorY = newPos.y - 1.7;
            const fx = Math.floor(newPos.x),
                fz = Math.floor(newPos.z);
            if (isSolid(fx, Math.floor(floorY), fz) ||
                isSolid(fx + 1, Math.floor(floorY), fz) ||
                isSolid(fx, Math.floor(floorY), fz + 1) ||
                isSolid(fx + 1, Math.floor(floorY), fz + 1)) {
                if (verticalVel < 0) { verticalVel = 0;
                    grounded = true;
                    newPos.y = Math.floor(floorY) + 1.7; }
            }

            camera.position.copy(newPos);
            window._vVel = verticalVel;
            window._grounded = grounded;

            // Player model
            if (playerModel) {
                playerModel.position.copy(camera.position);
                playerModel.position.y -= 1.3;
                if (Math.abs(velocity.x) > 0.01 || Math.abs(velocity.z) > 0.01) {
                    playerModel.rotation.y = Math.atan2(velocity.x, velocity.z);
                }
            }

            posInfo.textContent =
                `${Math.round(camera.position.x)}, ${Math.round(camera.position.y - 1.6)}, ${Math.round(camera.position.z)}`;

            // Minimap dot
            const mmSize = 140;
            const scale = mmSize / WORLD_SIZE;
            const px = (camera.position.x + WORLD_HALF) * scale;
            const pz = (camera.position.z + WORLD_HALF) * scale;
            const dot = document.querySelector('#minimap .player-dot');
            if (dot) {
                dot.style.left = `${px}px`;
                dot.style.top = `${pz}px`;
            }
        }

        // ──────────────────────────────────────────────
        // CLOUDS (Ringan)
        // ──────────────────────────────────────────────
        function createClouds() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.6,
                roughness: 0.2,
                metalness: 0.0,
            });
            for (let i = 0; i < 20; i++) {
                const cg = new THREE.Group();
                const parts = 3 + Math.floor(Math.random() * 4);
                for (let j = 0; j < parts; j++) {
                    const size = 1.5 + Math.random() * 2.5;
                    const geo = new THREE.SphereGeometry(size, 5, 5);
                    const mesh = new THREE.Mesh(geo, mat);
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * 2.5;
                    mesh.position.set(Math.cos(angle) * dist, Math.sin(angle) * dist * 0.3, Math.sin(angle) * dist * 0.4);
                    mesh.scale.y = 0.4 + Math.random() * 0.3;
                    cg.add(mesh);
                }
                cg.position.set((Math.random() - 0.5) * 70, 14 + Math.random() * 4, (Math.random() - 0.5) * 70);
                group.add(cg);
            }
            scene.add(group);
            // animasi sederhana
            let t = 0;
            setInterval(() => {
                t += 0.002;
                group.children.forEach((c, i) => {
                    c.position.x += Math.sin(t + i * 0.7) * 0.005;
                    c.position.z += Math.cos(t * 0.8 + i * 0.5) * 0.005;
                });
            }, 50);
        }

        // ──────────────────────────────────────────────
        // INIT
        // ──────────────────────────────────────────────
        buildHotbar();
        createPlayerModel('steve');
        camera.position.set(0, 8, 0);

        // Loading progress dimulai
        updateLoading(0, 'Mempersiapkan dunia...');

        // Generate world dengan progress
        setTimeout(() => {
            generateTerrain();
            createClouds();
            // Sembunyikan loading setelah semua selesai
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                // Update minimap
                updateMinimap();
                updateBlockCount();
            }, 400);
        }, 100);

        // Skin selector
        document.querySelectorAll('.skin-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSkin = btn.dataset.skin;
                createPlayerModel(currentSkin);
                if (playerModel) {
                    const pos = camera.position.clone();
                    playerModel.position.copy(pos);
                    playerModel.position.y -= 1.3;
                }
            });
        });

        // ──────────────────────────────────────────────
        // ANIMATION LOOP (dengan composer)
        // ──────────────────────────────────────────────
        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            composer.render();
        }

        animate();

        // Perbarui minimap tiap 3 detik
        setInterval(updateMinimap, 3000);

        console.log('✅ Minecraft HD siap!');
        console.log('🎮 Klik untuk mulai, WASD, SPACE, klik kiri/kanan.');
        console.log('✨ Bloom effect aktif untuk tampilan HD.');
    </script>
</body>
    </html>
