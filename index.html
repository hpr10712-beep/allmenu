<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0B1220"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Cazoo Wallet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231E3A8A'/%3E%3Ctext x='50%25' y='50%25' font-family='system-ui' font-weight='900' font-size='38' fill='white' text-anchor='middle' dominant-baseline='central'%3EC%3C/text%3E%3C/svg%3E"/>
<style>
:root{
  --bg:#F5F7FB;--surface:#FFF;--surface-2:#EEF1F7;
  --text:#0A1428;--muted:#68758C;--line:#E5E9F2;
  --brand:#1E3A8A;--brand-2:#2563EB;--brand-3:#3B82F6;--cyan:#06B6D4;
  --ok:#059669;--warn:#D97706;--err:#DC2626;
  --r:16px;--r-lg:22px;--r-xl:28px;
  --sh-1:0 1px 2px rgba(10,20,40,.04),0 1px 1px rgba(10,20,40,.03);
  --sh-2:0 6px 20px rgba(10,20,40,.07),0 2px 6px rgba(10,20,40,.04);
  --sh-3:0 20px 48px rgba(10,20,40,.18);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --tab-h:70px;
}
[data-theme="dark"]{--bg:#070B16;--surface:#0F1729;--surface-2:#192237;--text:#EBEFF8;--muted:#8C9BB8;--line:#1F2A44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;-webkit-appearance:none}
a{color:var(--brand-2);text-decoration:none}
svg{display:block;flex:none}

.splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#fff;background:radial-gradient(120% 80% at 50% 0%,#1E3A8A 0%,#0A1428 60%);transition:opacity .5s,visibility .5s}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash__mark{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#3B82F6,#06B6D4);box-shadow:0 24px 60px rgba(59,130,246,.45),inset 0 1px 0 rgba(255,255,255,.35);font-weight:900;font-size:42px;letter-spacing:-1px}
.splash__name{font-weight:800;font-size:22px}
.splash__bar{width:140px;height:3px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;position:relative}
.splash__bar::after{content:"";position:absolute;inset:0;width:36%;border-radius:99px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:slide 1.3s infinite}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(400%)}}

.auth{min-height:100dvh;display:flex;flex-direction:column;padding:calc(60px + var(--safe-t)) 20px 40px;position:relative;overflow:hidden;background:radial-gradient(130% 70% at 50% 0%,#1E3A8A 0%,#0A1428 60%)}
.auth::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:22px 22px;pointer-events:none;mask-image:linear-gradient(180deg,#000 30%,transparent 80%)}
.auth__in{width:100%;max-width:400px;margin:0 auto;position:relative;z-index:1;color:#fff}
.auth__mark{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#3B82F6,#06B6D4);box-shadow:0 20px 50px rgba(59,130,246,.45);font-weight:900;font-size:30px;margin-bottom:22px}
.auth__h{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin:0 0 10px}
.auth__p{color:rgba(255,255,255,.68);font-size:15px;line-height:1.55;margin:0 0 30px;max-width:320px}
.auth__f{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.auth__fi{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#93C5FD}
.auth__ft{font-weight:700;font-size:14px}
.auth__fd{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:1px}
.gbtn{width:100%;padding:15px 18px;border-radius:16px;background:#fff;color:#1F1F1F;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .12s}
.gbtn:active{transform:scale(.98)}
.gbtn:disabled{opacity:.7}
.gbtn svg{width:20px;height:20px}
.auth__terms{color:rgba(255,255,255,.5);font-size:12px;line-height:1.6;text-align:center;margin-top:22px}

.onb{min-height:100dvh;display:flex;flex-direction:column;padding:calc(30px + var(--safe-t)) 24px calc(24px + var(--safe-b));background:var(--bg)}
.onb__h{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:20px 0 8px}
.onb__p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 auto}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:28px 0 10px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--line);transition:all .15s}
.pin-dot.filled{background:var(--brand-3);transform:scale(1.15)}
.pin-dot.err{background:var(--err);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;padding-top:22px}
.kp button{height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:24px;font-weight:600;color:var(--text);transition:background .1s,transform .1s;display:grid;place-items:center}
.kp button:active{background:var(--surface-2);transform:scale(.96)}
.kp button[data-k="del"]{background:var(--surface-2);font-size:18px}
.kp button[data-k="ok"]{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-size:15px;font-weight:700}
.kp button[data-k="ok"]:disabled{opacity:.4}

.appbar{position:sticky;top:0;z-index:30;padding:calc(6px + var(--safe-t)) 16px 6px;display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px)}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:16px}
.brand__mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#3B82F6,#1E3A8A);color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 12px rgba(59,130,246,.32)}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text);background:var(--surface);border:1px solid var(--line);transition:transform .12s}
.ibtn:active{transform:scale(.94)}
.ibtn--plain{background:transparent;border:0}
.ibtn--dark{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.14);color:#fff}
.container{padding:12px 16px calc(var(--tab-h) + 40px + var(--safe-b));max-width:560px;margin:0 auto}
.view{animation:viewIn .28s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nav-head{display:flex;align-items:center;gap:8px;margin:4px 0 16px}
.nav-head__t{font-weight:800;font-size:18px;letter-spacing:-.3px;flex:1;text-align:center}
.nav-head__sp{width:38px;flex:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec-h h2{font-size:15px;font-weight:700;margin:0}
.sec-h a{font-size:13px;font-weight:600;color:var(--brand-2)}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--safe-b));width:min(440px,calc(100% - 24px));padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:rgba(10,20,40,.72);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border:1px solid rgba(255,255,255,.07);border-radius:24px;box-shadow:0 20px 44px rgba(10,20,40,.32);z-index:60}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 2px;border-radius:18px;color:rgba(255,255,255,.5);font-size:10.5px;font-weight:600;position:relative;transition:all .24s cubic-bezier(.22,1,.36,1)}
.tab svg{width:22px;height:22px}
.tab.active{color:#fff;background:linear-gradient(180deg,rgba(59,130,246,.3),rgba(59,130,246,.16))}
.tab__dot{position:absolute;top:6px;right:calc(50% - 15px);width:7px;height:7px;border-radius:50%;background:#EF4444;box-shadow:0 0 0 2px rgba(10,20,40,.72)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-1)}
.card+.card{margin-top:12px}
.card--flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.card--flush{padding:0;overflow:hidden}

.bal{position:relative;border-radius:var(--r-xl);padding:22px;overflow:hidden;color:#fff;background:radial-gradient(120% 100% at 100% 0%,rgba(6,182,212,.32),transparent 55%),radial-gradient(100% 120% at 0% 100%,rgba(37,99,235,.4),transparent 55%),linear-gradient(140deg,#0A1428 0%,#1E3A8A 100%);box-shadow:0 22px 48px rgba(10,20,40,.28),inset 0 1px 0 rgba(255,255,255,.08)}
.bal::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:16px 16px;pointer-events:none;opacity:.55;mask-image:linear-gradient(135deg,#000,transparent 70%)}
.bal__row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;gap:12px}
.bal__lab{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.bal__val{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin:8px 0 6px;font-variant-numeric:tabular-nums;line-height:1.05;transition:filter .2s}
.bal__val.blur{filter:blur(10px);user-select:none}
.bal__id{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);font-size:11.5px;color:rgba(255,255,255,.75);font-weight:600}
.bal__id b{color:#fff;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.bal__id button{color:inherit;opacity:.7;padding:2px;border-radius:6px}
.bal__quick{display:flex;gap:8px;margin-top:20px;position:relative}
.bal__quick button{flex:1;padding:11px 6px;border-radius:14px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.08);color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;transition:background .15s,transform .12s}
.bal__quick button:active{transform:scale(.96);background:rgba(255,255,255,.18)}

.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--text);box-shadow:var(--sh-1);transition:transform .12s}
.qbtn:active{transform:scale(.96)}
.qbtn__ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:#1E40AF}
[data-theme="dark"] .qbtn__ico{background:linear-gradient(135deg,#1E3A8A,#172554);color:#93C5FD}
.qbtn:nth-child(2) .qbtn__ico{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);color:#047857}
[data-theme="dark"] .qbtn:nth-child(2) .qbtn__ico{background:linear-gradient(135deg,#064E3B,#022C22);color:#6EE7B7}
.qbtn:nth-child(3) .qbtn__ico{background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E}
[data-theme="dark"] .qbtn:nth-child(3) .qbtn__ico{background:linear-gradient(135deg,#78350F,#451A03);color:#FCD34D}
.qbtn:nth-child(4) .qbtn__ico{background:linear-gradient(135deg,#EDE9FE,#DDD6FE);color:#5B21B6}
[data-theme="dark"] .qbtn:nth-child(4) .qbtn__ico{background:linear-gradient(135deg,#4C1D95,#2E1065);color:#C4B5FD}

.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);transition:background .15s,transform .1s;cursor:pointer;text-align:left;width:100%}
.item:active{background:var(--surface-2);transform:scale(.995)}
.item--no:active{background:var(--surface);transform:none;cursor:default}
.item__ico{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.item__ico.in{background:rgba(5,150,105,.12);color:var(--ok)}
.item__ico.out{background:rgba(220,38,38,.1);color:var(--err)}
.item__ico.pending{background:rgba(217,119,6,.14);color:var(--warn)}
.item__ico.brand{background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:#1E40AF}
[data-theme="dark"] .item__ico.brand{background:linear-gradient(135deg,#1E3A8A,#172554);color:#93C5FD}
.item__body{flex:1;min-width:0}
.item__t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item__s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item__amt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.item__amt.in{color:var(--ok)}
.item__chev{color:var(--muted);flex:none;margin-left:-4px}

.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--muted)}
.bdg.ok{background:rgba(5,150,105,.13);color:#047857}
.bdg.warn{background:rgba(217,119,6,.15);color:#B45309}
.bdg.err{background:rgba(220,38,38,.12);color:#B91C1C}
[data-theme="dark"] .bdg.ok{color:#6EE7B7}
[data-theme="dark"] .bdg.warn{color:#FCD34D}
[data-theme="dark"] .bdg.err{color:#FCA5A5}

.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:2px}
.inp{padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);color:var(--text);font-size:15px;width:100%;transition:border-color .18s,box-shadow .18s;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--brand-3);box-shadow:0 0 0 3.5px rgba(59,130,246,.14)}
select.inp{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2368758C' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
textarea.inp{min-height:96px;resize:vertical;font-family:inherit}
.hint{font-size:12px;color:var(--muted);margin-left:2px;line-height:1.5}
.err-line{font-size:12.5px;color:var(--err);display:flex;align-items:center;gap:6px;min-height:16px;margin:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-weight:700;font-size:14.5px;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-pri{background:linear-gradient(135deg,#1E3A8A,#0A1428);color:#fff;box-shadow:0 8px 22px rgba(30,58,138,.28)}
.btn-blue{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;box-shadow:0 8px 22px rgba(59,130,246,.28)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--text)}
.btn-danger{background:rgba(220,38,38,.09);color:#B91C1C;border:1.5px solid rgba(220,38,38,.2)}
[data-theme="dark"] .btn-danger{color:#FCA5A5}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:11px}
.btn-xs{padding:7px 11px;font-size:12px;border-radius:9px}

.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0;margin:0 -2px 14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .18s}
.pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}
[data-theme="dark"] .pill.active{background:#2563EB;border-color:#2563EB}

.mbg{position:fixed;inset:0;background:rgba(10,20,40,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:mbIn .22s ease;padding-top:var(--safe-t)}
@keyframes mbIn{from{opacity:0}to{opacity:1}}
.msheet{width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 20px calc(24px + var(--safe-b));animation:msIn .32s cubic-bezier(.22,1,.36,1)}
@keyframes msIn{from{transform:translateY(100%)}to{transform:none}}
.msheet__h{width:40px;height:4px;background:var(--line);border-radius:99px;margin:8px auto 16px}
.msheet h2{font-size:19px;font-weight:800;margin:0 0 16px;letter-spacing:-.3px}

.twrap{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + var(--safe-t));z-index:300;display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100% - 24px));pointer-events:none}
.toast{padding:13px 16px;border-radius:14px;background:rgba(10,20,40,.95);color:#fff;font-size:13.5px;font-weight:600;box-shadow:var(--sh-3);display:flex;align-items:center;gap:10px;animation:tIn .3s cubic-bezier(.22,1,.36,1)}
.toast.ok{background:linear-gradient(135deg,#059669,#047857)}
.toast.err{background:linear-gradient(135deg,#DC2626,#B91C1C)}
@keyframes tIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.toast.out{animation:tOut .24s ease forwards}
@keyframes tOut{to{opacity:0;transform:translateY(-8px)}}

.sk{background:linear-gradient(90deg,var(--surface-2) 0%,color-mix(in srgb,var(--surface-2) 55%,var(--line)) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:12px}
.sk-line.short{width:40%}
.sk-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;margin-bottom:6px}
.sk-av{width:42px;height:42px;border-radius:13px;flex:none}
.sk-body{flex:1;display:flex;flex-direction:column;gap:8px}

.st{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 20px;gap:14px}
.st__ico{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.st__t{font-weight:700;font-size:16px}
.st__d{font-size:13.5px;color:var(--muted);max-width:280px;line-height:1.55}

.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--muted);flex:none;font-size:13.5px}
.kv>span:last-child{font-weight:600;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
.kv--big>span:last-child{font-size:17px;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--text);transition:all .15s}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
[data-theme="dark"] .chip[aria-pressed="true"]{background:#2563EB;border-color:#2563EB}
.row{display:flex;align-items:center;gap:10px}
.row-between{justify-content:space-between}
.mt{margin-top:14px}.mt-s{margin-top:8px}.mt-l{margin-top:22px}
.txt-c{text-align:center}
.accordion{border-bottom:1px solid var(--line)}

function toast(msg, type="info", ms=2600){
  const root = $("#toast-root");
  const el = document.createElement("div");
  el.className = "toast" + (type==="ok"?" ok":type==="err"?" err":"");
  const iconName = type==="ok"?"check":type==="err"?"alert":"info";
  el.innerHTML = `${ic(iconName,18,2.4)}<span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),240); }, ms);
}

async function sha256Hex(str){
  const buf = new TextEncoder().encode(str);
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,"0")).join("");
}
function randomSalt(){
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2,"0")).join("");
}

      </div>
    </div>`;

  const btn = $("#gbtn"), lbl = $("#glabel");
  btn.onclick = async () => {
    if(btn.disabled) return;
    btn.disabled = true;
    const prev = lbl.textContent;
    lbl.textContent = "Membuka Google…";
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try {
      await signInWithPopup(auth, provider);
    } catch(e){
      if(e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment"){
        try { await signInWithRedirect(auth, provider); return; }
        catch(e2){ toast(errMsg(e2.code, e2.message), "err"); }
      } else if(e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request"){
        toast(errMsg(e.code, e.message), "err");
      }
      btn.disabled = false;
      lbl.textContent = prev;
    }
  };
}

getRedirectResult(auth).catch(e => {

    toast(errMsg(e.code, e.message), "err");

});

/* =========================================================
   AUTH STATE
========================================================= */
onAuthStateChanged(auth, async user => {
  if(!user){
    state.user = null; state.profile = null; state.wallet = null;
    state.needsSetup = false;
    state.unsubWallet?.(); state.unsubNotif?.();
    renderAuth();
    hideSplash();
    return;
  }
  state.user = user;
  try {
    const [pSnap, wSnap] = await Promise.all([
      get(ref(db, `users/${user.uid}`)),
      get(ref(db, `wallets/${user.uid}`))
    ]);
    state.profile = pSnap.exists() ? pSnap.val() : null;
    state.wallet  = wSnap.exists() ? wSnap.val() : null;

    if(!state.profile || !state.profile.accountId){
      state.needsSetup = true;
      renderPinSetup();
      hideSplash();
      return;
    }
    await finalizeLogin();
  } catch(e){
    console.error(e);
    renderFatal(errMsg(e.code, e.message));
    hideSplash();
  }
});

async function finalizeLogin(){
  subscribeWallet(state.user.uid);
  subscribeNotifications(state.user.uid);
  renderShell();
  hideSplash();
}

}

/* =========================================================

function renderPinSetup(){
  const user = state.user;
  let stage = "create";
  let pin1 = "", pin2 = "";

  const draw = () => {
    const val = stage === "create" ? pin1 : pin2;
    $("#app").innerHTML = `
      <div class="onb">
        <div class="row" style="gap:10px;align-items:center">
          <div style="width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#3B82F6,#1E3A8A);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 12px 30px rgba(59,130,246,.32);overflow:hidden">
            ${user.photoURL?`<img src="${esc(user.photoURL)}" style="width:100%;height:100%;object-fit:cover">`
              :esc((user.displayName||user.email||"U").charAt(0).toUpperCase())}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(user.displayName||"Pengguna")}</div>
            <div class="hint" style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(user.email||"")}</div>
          </div>
        </div>

        <h1 class="onb__h">${stage==="create"?"Buat PIN Transaksi":"Konfirmasi PIN"}</h1>
        <p class="onb__p">${stage==="create"
          ?"PIN 6-digit melindungi setiap transaksi Anda. Jangan bagikan ke siapa pun."
          :"Masukkan kembali PIN Anda untuk konfirmasi."}</p>

        <div class="pin-dots" id="dots">${Array(6).fill('<div class="pin-dot"></div>').join("")}</div>
        <div class="err-line txt-c" id="err" style="justify-content:center"></div>

        <div class="kp" id="kp">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
          <button data-k="del">${ic("x",20)}</button>
          <button data-k="0">0</button>
          <button data-k="ok" ${val.length!==6?"disabled":""}>Lanjut</button>
        </div>
      </div>`;

    const dots = $$("#dots .pin-dot");
    val.split("").forEach((_,i) => dots[i]?.classList.add("filled"));

    $("#kp").onclick = e => {
      const btn = e.target.closest("button[data-k]");
      if(btn) handleKey(btn.dataset.k);
    };
  };

  function handleKey(k){
    const isCreate = stage === "create";
    let v = isCreate ? pin1 : pin2;
    const err = $("#err");
    err.textContent = "";

    if(k === "del") v = v.slice(0,-1);
    else if(k === "ok"){
      if(v.length !== 6){ err.textContent = "PIN harus 6 digit."; return; }
      if(isCreate){
        if(/^(\d)\1{5}$/.test(v)){ err.textContent = "PIN terlalu mudah. Hindari angka berulang."; shake(); return; }
        if(["123456","654321","000000","111111","222222","333333","444444","555555","666666","777777","888888","999999"].includes(v)){
          err.textContent = "PIN terlalu mudah ditebak."; shake(); return;
        }
        pin1 = v; stage = "confirm"; pin2 = ""; draw(); return;
      } else {
        if(v !== pin1){ err.textContent = "PIN tidak cocok."; shake(); pin2 = ""; draw(); return; }
        finish(v); return;
      }
    }
    else if(/^\d$/.test(k) && v.length < 6) v += k;

    if(isCreate) pin1 = v; else pin2 = v;
    const dots = $$("#dots .pin-dot");
    dots.forEach((d,i) => d.classList.toggle("filled", i < v.length));
    const ok = $("#kp button[data-k='ok']");
    if(ok) ok.disabled = v.length !== 6;
  }

  function shake(){
    const dots = $$("#dots .pin-dot");
    dots.forEach(d => d.classList.add("err"));
    setTimeout(() => dots.forEach(d => d.classList.remove("err")), 400);
  }

  async function finish(pin){
    const btn = $("#kp button[data-k='ok']");
    if(btn) btn.disabled = true;
    const err = $("#err");
    try {
      const accountId = await generateUniqueAccountId();
      const salt = randomSalt();
      const pinHash = await sha256Hex(salt + ":" + pin);
      const now = Date.now();
      const updates = {};
      updates[`users/${user.uid}`] = {
        accountId,
        displayName: user.displayName || (user.email||"Pengguna").split("@")[0],
        email: user.email || "",
        photoURL: user.photoURL || "",
        accountStatus: "active",
        pinHash, pinSalt: salt,
        pinAttempts: { count: 0, until: 0 },
        createdAt: now
      };
      updates[`wallets/${user.uid}`] = {
        userId: user.uid, availableBalance: 0, pendingBalance: 0,
        currency: "IDR", updatedAt: now
      };
      updates[`accountIds/${accountId}`] = user.uid;

      await update(ref(db), updates);

      state.profile = (await get(ref(db, `users/${user.uid}`))).val();
      state.wallet  = (await get(ref(db, `wallets/${user.uid}`))).val();
      state.needsSetup = false;
      toast("Selamat datang di Cazoo!", "ok");
      await finalizeLogin();
    } catch(e){
      console.error(e);
      err.textContent = errMsg(e.code, e.message);
      pin1 = ""; pin2 = ""; stage = "create";
      setTimeout(draw, 500);
    }
  }

  draw();
}

/* Generate unique 8-10 digit accountId — cek tabrakan */
async function generateUniqueAccountId(){
  for(let i = 0; i < 10; i++){
    const len = 8 + Math.floor(Math.random() * 3);
    let id = "";
    for(let k = 0; k < len; k++) id += Math.floor(Math.random() * 10);
    if(id[0] === "0") id = "1" + id.slice(1);
    const snap = await get(ref(db, `accountIds/${id}`));
    if(!snap.exists()) return id;
  }
  // fallback: pakai timestamp
  return String(Date.now()).slice(-10);
}

/* =========================================================
   PIN PROMPT
========================================================= */
function promptPin(purpose = "Masukkan PIN"){
  return new Promise(resolve => {
    let value = "";
    const m = modal(`
      <h2 class="txt-c" style="margin-bottom:6px">${esc(purpose)}</h2>
      <p class="hint txt-c" style="margin:0 0 4px">PIN 6-digit Anda</p>
      <div class="pin-dots" id="dots">${Array(6).fill('<div class="pin-dot"></div>').join("")}</div>
      <div class="err-line txt-c" id="err" style="justify-content:center"></div>
      <div class="kp" id="kp">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
        <button data-k="del">${ic("x",20)}</button>
        <button data-k="0">0</button>
        <button data-k="ok" disabled>OK</button>
      </div>
      <button class="btn btn-ghost btn-block mt" id="cancel">Batal</button>`);

    const dots = m.$$("#dots .pin-dot");
    const err = m.$("#err");
    const okBtn = m.$("#kp button[data-k='ok']");
    const paint = () => {
      dots.forEach((d,i) => d.classList.toggle("filled", i < value.length));
      okBtn.disabled = value.length !== 6;
    };

    m.$("#kp").onclick = e => {
      const btn = e.target.closest("button[data-k]");
      if(!btn) return;
      const k = btn.dataset.k;
      if(k === "del") value = value.slice(0,-1);
      else if(k === "ok"){
        if(value.length !== 6) return;
        const pin = value; m.close(); resolve(pin); return;
      }
      else if(/^\d$/.test(k) && value.length < 6) value += k;
      paint(); err.textContent = "";
    };
    m.$("#cancel").onclick = () => { m.close(); resolve(null); };
  });
}

async function requirePin(purpose){
  const pin = await promptPin(purpose || "Konfirmasi Transaksi");
  if(!pin) throw new Error("__cancel__");
  await verifyPin(pin);
  return true;
}

async function verifyPin(pin){
  if(!/^\d{6}$/.test(pin)) throw new Error("PIN tidak valid.");
  const userRef = ref(db, `users/${state.user.uid}`);
  const snap = await get(userRef);
  if(!snap.exists()) throw new Error("Profil tidak ditemukan.");
  const u = snap.val();
  const now = Date.now();
  const att = u.pinAttempts || { count:0, until:0 };
  if(att.until && now < att.until){
    const mins = Math.ceil((att.until - now) / 60000);
    throw new Error(`PIN terkunci. Coba lagi dalam ${mins} menit.`);
  }
  const hash = await sha256Hex((u.pinSalt||"") + ":" + pin);
  if(hash !== u.pinHash){
    const count = (att.count||0) + 1;
    const until = count >= 5 ? now + 15*60*1000 : 0;
    await update(userRef, { pinAttempts: { count: count >= 5 ? 0 : count, until } });
    throw new Error("PIN salah.");
  }
  if(att.count || att.until) await update(userRef, { pinAttempts: { count:0, until:0 } });
  return true;
}

const TX_LABEL = {
  TOPUP:"Top Up", TRANSFER_IN:"Transfer Masuk", TRANSFER_OUT:"Transfer Keluar",
  PAYMENT:"Pembayaran", REFUND:"Pengembalian", WITHDRAWAL:"Penarikan",
  FEE:"Biaya", ADJUSTMENT:"Penyesuaian"
};
const TX_ICON = {
  TOPUP:"plus", TRANSFER_IN:"arrowDL", TRANSFER_OUT:"arrowUR",
  PAYMENT:"card", REFUND:"refresh", WITHDRAWAL:"arrowD",
  FEE:"receipt", ADJUSTMENT:"settings"
};
const txDir = t => ["TOPUP","TRANSFER_IN","REFUND","ADJUSTMENT"].includes(t) ? "in" : "out";

function txItemHTML(t){
  const dir = txDir(t.transactionType);
  const iconName = TX_ICON[t.transactionType] || "receipt";

  const sign = dir === "in" ? "+" : "−";
  const amtCls = dir === "in" ? "in" : "";
  return `<button class="item" data-tx="${esc(t.id)}" type="button">
    <div class="item__ico ${dir==='in'?'in':'out'}">${ic(iconName,18)}</div>
    <div class="item__body">
      <div class="item__t">${esc(t.description || TX_LABEL[t.transactionType] || "Transaksi")}</div>
      <div class="item__s">
        <span>${fdate(t.createdAt)}</span>

      </div>
    </div>
    <div class="item__amt ${amtCls}">${sign}${rp(t.amount||0).replace("Rp","Rp ")}</div>

}

      </div>
      <div class="hint mt-s">Saldo Anda: ${rp(bal)}</div>`;
    submit.disabled = !(ok && enough && recipient);
  }
  $("#amount", root).addEventListener("input", updateSummary);
  $("#note", root).addEventListener("input", e => e.target.value = e.target.value.replace(/[^\w\s\.,\-]/g,"").slice(0,60));

  $("#submit", root).onclick = async () => {
    if(!recipient) return;
    const v = Number($("#amount", root).value || 0);
    const err = $("#err", root), btn = $("#submit", root);
    err.innerHTML = "";
    if(!(v >= 1000 && v <= 10_000_000)){ err.innerHTML = `${ic("alert",14,2.2)}<span>Nominal tidak valid.</span>`; return; }
    if(v > (state.wallet?.availableBalance||0)){ err.innerHTML = `${ic("alert",14,2.2)}<span>Saldo tidak cukup.</span>`; return; }

    const ok = await confirmDlg("Konfirmasi Transfer",
      `Kirim ${rp(v)} ke ${recipient.displayName} (ID ${recipient.accountId})?`, "Lanjut");
    if(!ok) return;
    try { await requirePin("PIN Transfer"); }
    catch(e){ if(e.message === "__cancel__") return; err.innerHTML = `${ic("alert",14,2.2)}<span>${esc(e.message)}</span>`; return; }

    btn.disabled = true;
    const prev = btn.innerHTML; btn.innerHTML = `${ic("refresh",16)} Memproses…`;

    try {
      // Re-fetch kedua wallet (server-side view)
      const [sS, rS] = await Promise.all([
        get(ref(db, `wallets/${state.user.uid}`)),
        get(ref(db, `wallets/${recipient.uid}`))
      ]);
      if(!sS.exists() || !rS.exists()) throw new Error("Wallet tidak ditemukan.");
      const sBal = sS.val().availableBalance || 0;
      const rBal = rS.val().availableBalance || 0;
      if(sBal < v) throw new Error("Saldo tidak cukup.");

      const refNum = "TRX" + Math.random().toString(36).slice(2,10).toUpperCase();
      const now = Date.now();
      const outId = uuid(), inId = uuid();
      const senderName = state.profile?.displayName || state.user.email;
      const desc = ($("#note", root).value.trim() || "Transfer").slice(0,60);

      // Multi-path atomic update (RTDB menjamin atomic di seluruh path)
      const updates = {};
      updates[`wallets/${state.user.uid}/availableBalance`] = sBal - v;
      updates[`wallets/${state.user.uid}/updatedAt`] = now;
      updates[`wallets/${recipient.uid}/availableBalance`] = rBal + v;
      updates[`wallets/${recipient.uid}/updatedAt`] = now;

      updates[`transactions/${outId}`] = {
        userId: state.user.uid, senderId: state.user.uid, receiverId: recipient.uid,
        transactionType: "TRANSFER_OUT", amount: v, fee: 0, status: "success",
        createdAt: now, updatedAt: now, referenceNumber: refNum,
        description: desc, idempotencyKey: uuid()
      };
      updates[`transactions/${inId}`] = {
        userId: recipient.uid, senderId: state.user.uid, receiverId: recipient.uid,
        transactionType: "TRANSFER_IN", amount: v, fee: 0, status: "success",
        createdAt: now, updatedAt: now, referenceNumber: refNum,
        description: desc, idempotencyKey: uuid()
      };

      const notifId1 = uuid(), notifId2 = uuid();
      updates[`notifications/${state.user.uid}/${notifId1}`] = {
        title:"Transfer berhasil", message:`${rp(v)} ke ${recipient.displayName}`,
        type:"transfer_out", read:false, createdAt: now, link:"activity"
      };
      updates[`notifications/${recipient.uid}/${notifId2}`] = {
        title:"Transfer masuk", message:`${rp(v)} dari ${senderName}`,
        type:"transfer_in", read:false, createdAt: now, link:"activity"
      };

      await update(ref(db), updates);

      toast("Transfer berhasil", "ok");
      setTimeout(() => showTxDetail(outId), 300);
      setTimeout(() => navigate("home"), 700);
    } catch(e){
      err.innerHTML = `${ic("alert",14,2.2)}<span>${esc(errMsg(e.code, e.message))}</span>`;
      btn.disabled = false; btn.innerHTML = prev;
    }
  };
};

        <div class="card card--flat mt">

        </div>

        </div>
        <div class="field">
          <label>Nominal</label>
          <input class="inp" id="mamt" type="number" inputmode="numeric" min="1000" step="500" placeholder="0">
        </div>
        <div class="err-line" id="err"></div>
        <button class="btn btn-pri btn-block" id="submit">${ic("shield",18)} Bayar</button>
      </div>`;

    let stream = null;
    const video = $("#cam", panel);
    const overlay = $("#camOv", panel);
    (async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:"environment"} }, audio:false });
        video.srcObject = stream;
        await video.play();
        overlay.style.display = "none";
      } catch(e){ overlay.textContent = "Kamera tidak tersedia."; }
    })();
    const cleanup = () => stream?.getTracks().forEach(t => t.stop());
    $("#stopCam", panel).onclick = () => { cleanup(); video.srcObject = null; overlay.style.display = "grid"; overlay.textContent = "Kamera dimatikan."; };
    window.addEventListener("hashchange", cleanup, { once:true });

    $("#submit", panel).onclick = async () => {
      const mname = $("#mname", panel).value.trim();
      const v = Number($("#mamt", panel).value || 0);
      const err = $("#err", panel);
      err.innerHTML = "";
      if(!mname){ err.innerHTML = `${ic("alert",14,2.2)}<span>Masukkan nama merchant.</span>`; return; }
      if(!(v >= 1000 && v <= 10_000_000)){ err.innerHTML = `${ic("alert",14,2.2)}<span>Nominal tidak valid.</span>`; return; }
      if(v > (state.wallet?.availableBalance || 0)){ err.innerHTML = `${ic("alert",14,2.2)}<span>Saldo tidak cukup.</span>`; return; }

      const ok = await confirmDlg("Konfirmasi QRIS", `Bayar ${rp(v)} ke "${mname}"?`, "Lanjut");
      if(!ok) return;
      try { await requirePin("PIN QRIS"); }
      catch(e){ if(e.message === "__cancel__") return; err.innerHTML = `${ic("alert",14,2.2)}<span>${esc(e.message)}</span>`; return; }

      const btn = $("#submit", panel); btn.disabled = true;
      try {
        const curSnap = await get(ref(db, `wallets/${state.user.uid}`));
        const cur = curSnap.val().availableBalance || 0;
        if(cur < v) throw new Error("Saldo tidak cukup.");
        const refNum = "QRIS" + Math.random().toString(36).slice(2,10).toUpperCase();
        const now = Date.now();
        const txId = uuid();
        const updates = {};
        updates[`wallets/${state.user.uid}/availableBalance`] = cur - v;
        updates[`wallets/${state.user.uid}/updatedAt`] = now;
        updates[`transactions/${txId}`] = {
          userId: state.user.uid, senderId: state.user.uid, receiverId: mname,
          transactionType: "PAYMENT", amount: v, fee: 0, status: "success",
          createdAt: now, updatedAt: now, referenceNumber: refNum,
          description: "QRIS - " + mname, idempotencyKey: uuid()
        };
        updates[`notifications/${state.user.uid}/${uuid()}`] = {
          title:"Pembayaran QRIS berhasil", message:`${rp(v)} ke ${mname}`,
          type:"payment", read:false, createdAt: now, link:"activity"
        };
        await update(ref(db), updates);
        toast("Pembayaran QRIS berhasil", "ok");
        setTimeout(() => showTxDetail(txId), 300);
      } catch(e){
        err.innerHTML = `${ic("alert",14,2.2)}<span>${esc(errMsg(e.code, e.message))}</span>`;
      } finally { btn.disabled = false; }
    };
  };

  const showMine = () => {
    const accountId = state.profile?.accountId || "—";
    const name = state.profile?.displayName || "Pengguna";
    panel.innerHTML = `
      <div class="card">

      </div>`;

    if(c) c.onclick = async () => {
      try { await navigator.clipboard.writeText(accountId); toast("ID disalin","ok"); }
      catch { toast("Gagal menyalin","err"); }
    };
    // Minimal QR — pakai library inline kecil untuk encode ID
    renderMiniQR($("#qr", panel), accountId);
  };

  $$(".pill", root).forEach(b => b.onclick = () => {
    $$(".pill", root).forEach(x => x.classList.toggle("active", x === b));
    b.dataset.tab === "scan" ? showScan() : showMine();
  });
  showScan();
};

/* Mini QR encoder — menampilkan ID sebagai QR via Google Charts (butuh internet) */
function renderMiniQR(el, text){
  if(!el) return;
  const url = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=0&data=" + encodeURIComponent(text);
  const img = document.createElement("img");
  img.src = url; img.alt = "QR";
  img.style.width = "220px"; img.style.height = "220px"; img.style.display = "block";
  img.onerror = () => { el.innerHTML = `<div class="hint" style="max-width:200px">${esc(text)}</div>`; };
  el.innerHTML = "";
  el.appendChild(img);
}

  function changePin(){
    let step = "old"; let oldPin = ""; let newPin = "";
    const m = modal(`
      <h2 id="title" class="txt-c">Masukkan PIN Lama</h2>
      <div class="pin-dots" id="dots">${Array(6).fill('<div class="pin-dot"></div>').join("")}</div>

        <button data-k="ok" disabled>OK</button>
      </div>
      <button class="btn btn-ghost btn-block mt" id="cancel">Batal</button>`);

    let val = "";
    const title = m.$("#title"), dots = m.$$("#dots .pin-dot"),
          err = m.$("#err"), okBtn = m.$("#kp button[data-k='ok']");
    const paint = () => {
      dots.forEach((d,i) => d.classList.toggle("filled", i < val.length));
      okBtn.disabled = val.length !== 6;
    };
    const setStep = s => {
      step = s; val = ""; paint();
      title.textContent = s === "old" ? "Masukkan PIN Lama" : s === "new" ? "PIN Baru" : "Konfirmasi PIN Baru";
      err.textContent = "";
    };

    m.$("#kp").onclick = async e => {
      const btn = e.target.closest("button[data-k]");
      if(!btn) return;
      const k = btn.dataset.k;
      if(k === "del") val = val.slice(0,-1);
      else if(k === "ok"){
        if(val.length !== 6) return;
        if(step === "old"){
          try { await verifyPin(val); oldPin = val; setStep("new"); }
          catch(e){ err.innerHTML = `${ic("alert",13,2.3)}<span>${esc(e.message)}</span>`; val=""; paint();
            dots.forEach(d => d.classList.add("err"));
            setTimeout(() => dots.forEach(d => d.classList.remove("err")), 400); }
          return;
        }
        if(step === "new"){
          if(/^(\d)\1{5}$/.test(val) || ["123456","654321"].includes(val)){
            err.textContent = "PIN terlalu mudah."; val = ""; paint(); return;
          }
          newPin = val; setStep("confirm"); return;
        }
        if(step === "confirm"){
          if(val !== newPin){ err.textContent = "PIN tidak cocok."; val=""; paint(); return; }
          try {
            const salt = randomSalt();
            const hash = await sha256Hex(salt + ":" + newPin);
            await update(ref(db, `users/${user.uid}`), { pinHash: hash, pinSalt: salt });
            m.close(); toast("PIN diubah", "ok");
          } catch(e){ err.innerHTML = `${ic("alert",13,2.3)}<span>${esc(errMsg(e.code, e.message))}</span>`; }
          return;
        }
      }
      else if(/^\d$/.test(k) && val.length < 6) val += k;
      paint();
    };
    m.$("#cancel").onclick = () => m.close();
    setOpt();
    function setOpt(){ setStep("old"); }
  }

  $("#hideBal", root).onchange = e => {
    state.hideBalance = e.target.checked;
    localStorage.setItem("cazoo.hideBal", e.target.checked ? "1" : "0");
  };
  $$("[data-legal]", root).forEach(b => b.onclick = () => {
    const t = b.dataset.legal;
    const c = {
      tos:"Dokumen lengkap tersedia di situs resmi Cazoo. Hubungi dukungan untuk salinan.",
      privacy:"Kami melindungi data Anda. Kata sandi tidak disimpan, PIN dienkripsi, dan transaksi tercatat aman."
    }[t];
    const title = { tos:"Syarat Penggunaan", privacy:"Kebijakan Privasi" }[t];
    modal(`<h2>${title}</h2>
      <p class="hint" style="font-size:14px;line-height:1.7;color:var(--text);margin:0 0 20px">${esc(c)}</p>
      <button class="btn btn-pri btn-block" id="ok">Tutup</button>`).$("#ok").onclick = closeModal;
  });
  $("#logout", root).onclick = async () => {
    if(await confirmDlg("Keluar", "Anda yakin ingin keluar?", "Keluar")) signOut(auth);
  };
};

/* =========================================================
   ROUTE: HELP
========================================================= */
const FAQ = [
  { q:"Bagaimana cara Top Up?", a:"Buka menu Top Up dari beranda, pilih nominal, lalu konfirmasi. Saldo akan langsung bertambah." },
  { q:"Apa itu ID Akun Cazoo?", a:"ID Akun adalah 8–10 digit angka unik untuk menerima transfer antar pengguna Cazoo." },
  { q:"Bagaimana jika PIN saya terkunci?", a:"PIN akan terkunci sementara setelah 5 kali salah. Tunggu 15 menit." },
  { q:"Apakah data saya aman?", a:"Ya. Kami menggunakan Google Sign-In dan PIN terenkripsi untuk setiap transaksi." }
];

ROUTES.help = (root) => {
  root.innerHTML = `
    ${navHead("Pusat Bantuan")}
    <div class="card" style="text-align:center;padding:22px">
      <div style="width:64px;height:64px;border-radius:22px;margin:0 auto 14px;background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:#1E40AF;display:grid;place-items:center">${ic("help",30)}</div>
      <div style="font-weight:800;font-size:17px">Ada yang bisa kami bantu?</div>
      <div class="hint" style="margin-top:4px">Cari jawaban cepat atau hubungi kami.</div>
    </div>
    <div class="sec-h"><h2>Pertanyaan Umum</h2></div>
    <div class="card card--flush" style="padding:0 18px">
      ${FAQ.map((f,i) => `
        <div class="accordion" data-i="${i}">
          <div class="accordion__h"><span>${esc(f.q)}</span>${ic("chevD",18)}</div>
          <div class="accordion__b">${esc(f.a)}</div>
        </div>`).join("")}
    </div>
    <div class="sec-h"><h2>Kontak</h2></div>
    <div class="card">
      <div class="kv"><span>Email</span><span>support@cazoo.app</span></div>
      <div class="kv"><span>Jam operasional</span><span>09.00 – 21.00 WIB</span></div>
    </div>`;
  bindNavHead(root, () => navigate("profile"));
  $$(".accordion", root).forEach(acc => {
    $(".accordion__h", acc).onclick = () => {
      const open = acc.classList.contains("open");
      $$(".accordion", root).forEach(a => a.classList.remove("open"));
      if(!open) acc.classList.add("open");
    };
  });
};

/* =========================================================
   Bootstrap
========================================================= */
setTimeout(() => hideSplash(), 2500);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js").catch(()=>{});
}

let lastAct = Date.now();
["click","touchstart","keydown","scroll"].forEach(ev =>
  window.addEventListener(ev, () => { lastAct = Date.now(); }, { passive:true }));
setInterval(() => {
  if(state.user && Date.now() - lastAct > 10*60*1000){
    state.hideBalance = true;
    lastAct = Date.now();
  }
}, 60_000);

window.addEventListener("popstate", () => {
  if($("#modal-root").innerHTML){
    closeModal();
    history.pushState(null, "", location.href);
  }
});
history.pushState(null, "", location.href);
</script>
