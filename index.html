<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CCTV Pro · Surveillance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #060a16;
            color: #e8edf5;
            min-height: 100vh;
            padding: 16px;
        }
        .app {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ─── HEADER ─── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
        }
        .logo i {
            font-size: 28px;
            color: #22d3ee;
        }
        .logo span {
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.green {
            background: #4ade80;
            box-shadow: 0 0 14px #4ade8066;
        }
        .dot.red {
            background: #f87171;
            box-shadow: 0 0 14px #f8717166;
        }
        .dot.yellow {
            background: #fbbf24;
            box-shadow: 0 0 14px #fbbf2466;
        }

        /* ─── MAIN GRID ─── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            margin-top: 20px;
        }

        /* ─── CCTV VIEW ─── */
        .cctv-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 18px;
        }
        .cctv-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #050810;
            border-radius: 18px;
            overflow: hidden;
        }
        .cctv-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .cctv-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Overlay info */
        .cam-overlay {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            flex-wrap: wrap;
            gap: 8px;
        }
        .cam-overlay .left,
        .cam-overlay .right {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .cam-overlay .live {
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cam-overlay .live i {
            font-size: 10px;
        }
        .cam-overlay .rec {
            color: #f87171;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cam-overlay .rec i {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* Grid overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }
        .grid-overlay.active {
            display: block;
        }
        .grid-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 5% 5%;
        }

        /* Controls */
        .cam-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }
        .cam-controls button {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e8edf5;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cam-controls button:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .cam-controls button.primary {
            background: #22d3ee;
            color: #060a16;
            border-color: #22d3ee;
        }
        .cam-controls button.primary:hover {
            background: #06b6d4;
        }
        .cam-controls button.danger {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }
        .cam-controls button.danger:hover {
            background: rgba(248, 113, 113, 0.2);
        }
        .cam-controls button.outline {
            background: transparent;
        }
        .cam-controls button.outline:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .cam-controls button.active-mode {
            border-color: #22d3ee;
            background: rgba(34, 211, 238, 0.08);
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 16px 18px 18px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .card-header h4 {
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
        }
        .card-header h4 i {
            color: #22d3ee;
        }
        .card-header .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            color: #94a3b8;
        }

        /* Sensor */
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .sensor-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 10px 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .sensor-item .label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
        }
        .sensor-item .value {
            font-size: 20px;
            font-weight: 800;
            margin-top: 2px;
        }
        .value.temp {
            color: #fbbf24;
        }
        .value.humid {
            color: #22d3ee;
        }
        .value.motion {
            color: #4ade80;
        }
        .value.recording {
            color: #f87171;
        }

        /* Motion graph */
        .motion-graph {
            height: 44px;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            margin: 6px 0 4px;
        }
        .motion-graph .bar {
            flex: 1;
            background: linear-gradient(180deg, #22d3ee, #06b6d4);
            border-radius: 2px 2px 0 0;
            min-height: 3px;
            transition: height 0.2s;
            opacity: 0.4;
        }
        .motion-graph .bar.active {
            opacity: 1;
            background: linear-gradient(180deg, #4ade80, #22d3ee);
        }
        .motion-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
        }
        .motion-stats strong {
            color: #e8edf5;
        }

        /* Quality selector */
        .quality-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .quality-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 8px 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
        }
        .quality-btn:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .quality-btn.active {
            border-color: #22d3ee;
            background: rgba(34, 211, 238, 0.06);
            color: #22d3ee;
        }
        .quality-btn i {
            display: block;
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* Settings row */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            gap: 10px;
            flex-wrap: wrap;
        }
        .setting-row .label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }
        .setting-row .label i {
            margin-right: 6px;
            color: #22d3ee;
        }
        .setting-row input[type="range"] {
            flex: 1;
            min-width: 60px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.06);
            height: 3px;
            border-radius: 10px;
            outline: none;
        }
        .setting-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #22d3ee;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(34, 211, 238, 0.2);
        }
        .setting-row .val {
            font-weight: 700;
            font-size: 13px;
            min-width: 32px;
            text-align: right;
            color: #fcd34d;
        }

        /* Log */
        .log-container {
            max-height: 110px;
            overflow-y: auto;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .log-container::-webkit-scrollbar {
            width: 3px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .log-item .time {
            color: #64748b;
            font-size: 11px;
        }
        .log-item .msg {
            color: #e8edf5;
        }
        .log-item .msg.motion {
            color: #4ade80;
        }
        .log-item .msg.temp {
            color: #fbbf24;
        }
        .log-item .msg.error {
            color: #f87171;
        }

        .btn-sm {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #94a3b8;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .btn-sm:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #e8edf5;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 720px) {
            .sidebar {
                grid-template-columns: 1fr;
            }
            .cctv-container {
                aspect-ratio: 4/3;
            }
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-right {
                justify-content: space-between;
            }
            .cam-controls button {
                font-size: 12px;
                padding: 6px 12px;
            }
            .quality-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .sensor-grid {
                grid-template-columns: 1fr 1fr;
            }
            .cam-overlay .left,
            .cam-overlay .right {
                font-size: 10px;
                padding: 4px 10px;
            }
        }
        @media (max-width: 480px) {
            .cam-controls {
                gap: 5px;
            }
            .cam-controls button {
                font-size: 11px;
                padding: 5px 10px;
            }
            .header-right .status-badge {
                font-size: 11px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <header>
            <div class="logo"><i class="fas fa-video"></i> <span>CCTV Pro</span></div>
            <div class="header-right">
                <span class="status-badge"><span class="dot green" id="statusDot"></span> <span id="statusText">Online</span></span>
                <span class="status-badge"><i class="fas fa-clock"></i> <span id="clockDisplay">--:--:--</span></span>
                <span class="status-badge"><i class="fas fa-hdd"></i> <span id="storageDisplay">0 GB</span></span>
            </div>
        </header>

        <!-- MAIN -->
        <div class="main-grid">

            <!-- CCTV VIEW -->
            <div class="cctv-wrapper">
                <div class="cctv-container" id="cctvContainer">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="overlayCanvas"></canvas>
                    <div class="grid-overlay" id="gridOverlay"></div>

                    <div class="cam-overlay">
                        <div class="left">
                            <span class="live"><i class="fas fa-circle"></i> LIVE</span>
                            <span id="camName">CAM-01</span>
                            <span id="resolutionDisplay">--</span>
                        </div>
                        <div class="right">
                            <span id="qualityDisplay">HD</span>
                            <span class="rec" id="recIndicator"><i class="fas fa-circle"></i> REC</span>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="cam-controls">
                    <button class="primary" id="btnStart"><i class="fas fa-play"></i> Mulai</button>
                    <button class="danger" id="btnStop"><i class="fas fa-stop"></i> Stop</button>
                    <button class="outline" id="btnRecord"><i class="fas fa-circle" style="color:#f87171;"></i> Rekam</button>
                    <button class="outline" id="btnSnapshot"><i class="fas fa-camera"></i> Foto</button>
                    <button class="outline" id="btnGrid"><i class="fas fa-th"></i> Grid</button>
                    <button class="outline" id="btnFullscreen"><i class="fas fa-expand"></i></button>
                </div>

                <!-- Quality & Settings -->
                <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; padding:0 4px; align-items:center;">
                    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                        <span style="font-size:12px; color:#94a3b8; font-weight:600;">Kualitas:</span>
                        <div class="quality-grid" style="display:flex; gap:6px;">
                            <button class="quality-btn active" data-quality="hd"><i class="fas fa-hdmi"></i> HD</button>
                            <button class="quality-btn" data-quality="sd"><i class="fas fa-signal"></i> SD</button>
                            <button class="quality-btn" data-quality="bw"><i class="fas fa-circle-half-stroke"></i> B/W</button>
                            <button class="quality-btn" data-quality="sepia"><i class="fas fa-mountain"></i> Sepia</button>
                            <button class="quality-btn" data-quality="night"><i class="fas fa-moon"></i> Night</button>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:120px;">
                        <i class="fas fa-search-minus" style="color:#64748b; font-size:13px;"></i>
                        <input type="range" id="zoomSlider" min="1" max="3" step="0.05" value="1"
                        style="flex:1; -webkit-appearance:none; background:rgba(255,255,255,0.06); height:3px; border-radius:10px; outline:none;">
                        <i class="fas fa-search-plus" style="color:#64748b; font-size:13px;"></i>
                        <span id="zoomDisplay" style="font-weight:700; font-size:13px; color:#fcd34d; min-width:36px;">1.0x</span>
                    </div>
                </div>
            </div>

            <!-- SIDEBAR -->
            <div class="sidebar">

                <!-- Sensor -->
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-microchip"></i> Sensor</h4>
                        <span class="badge"><i class="fas fa-sync-alt fa-fw"></i> Real-time</span>
                    </div>
                    <div class="sensor-grid">
                        <div class="sensor-item">
                            <div class="label"><i class="fas fa-thermometer-half"></i> Suhu</div>
                            <div class="value temp" id="tempDisplay">25.0 °C</div>
                        </div>
                        <div class="sensor-item">
                            <div class="label"><i class="fas fa-water"></i> Kelembaban</div>
                            <div class="value humid" id="humidityDisplay">60 %</div>
                        </div>
                        <div class="sensor-item">
                            <div class="label"><i class="fas fa-people-arrows"></i> Gerakan</div>
                            <div class="value motion" id="motionCount">0</div>
                        </div>
                        <div class="sensor-item">
                            <div class="label"><i class="fas fa-circle"></i> Rekaman</div>
                            <div class="value recording" id="recordingStatus">Off</div>
                        </div>
                    </div>
                </div>

                <!-- Motion Graph -->
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-chart-line"></i> Aktivitas Gerakan</h4>
                        <span class="badge" id="motionDetectStatus">Tenang</span>
                    </div>
                    <div class="motion-graph" id="motionGraph"></div>
                    <div class="motion-stats">
                        <span>Puncak: <strong id="motionPeak">0</strong></span>
                        <span>Ambang: <strong id="thresholdDisplay">25</strong></span>
                        <span>Total: <strong id="totalMotion">0</strong></span>
                    </div>
                    <div style="margin-top:10px; border-top:1px solid rgba(255,255,255,0.03); padding-top:10px;">
                        <div class="setting-row">
                            <span class="label"><i class="fas fa-sliders-h"></i> Sensitivitas</span>
                            <input type="range" id="thresholdSlider" min="5" max="80" value="25" />
                            <span class="val" id="thresholdVal">25</span>
                        </div>
                    </div>
                </div>

                <!-- Log -->
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-clipboard-list"></i> Log Kejadian</h4>
                        <div style="display:flex; gap:4px;">
                            <button class="btn-sm" id="btnClearLog"><i class="fas fa-trash"></i></button>
                            <button class="btn-sm" id="btnExportLog"><i class="fas fa-download"></i></button>
                        </div>
                    </div>
                    <div class="log-container" id="logContainer">
                        <div class="log-item"><span class="time">--:--:--</span><span class="msg">Sistem CCTV siap</span></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ─── DOM ──────────────────────────────────────────────────────
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        const gridOverlay = document.getElementById('gridOverlay');

        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnRecord = document.getElementById('btnRecord');
        const btnSnapshot = document.getElementById('btnSnapshot');
        const btnGrid = document.getElementById('btnGrid');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnClearLog = document.getElementById('btnClearLog');
        const btnExportLog = document.getElementById('btnExportLog');

        const zoomSlider = document.getElementById('zoomSlider');
        const zoomDisplay = document.getElementById('zoomDisplay');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdVal = document.getElementById('thresholdVal');
        const thresholdDisplay = document.getElementById('thresholdDisplay');

        const tempDisplay = document.getElementById('tempDisplay');
        const humidityDisplay = document.getElementById('humidityDisplay');
        const motionCount = document.getElementById('motionCount');
        const recordingStatus = document.getElementById('recordingStatus');
        const clockDisplay = document.getElementById('clockDisplay');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const resolutionDisplay = document.getElementById('resolutionDisplay');
        const qualityDisplay = document.getElementById('qualityDisplay');
        const camName = document.getElementById('camName');
        const recIndicator = document.getElementById('recIndicator');
        const motionDetectStatus = document.getElementById('motionDetectStatus');
        const motionPeak = document.getElementById('motionPeak');
        const totalMotionEl = document.getElementById('totalMotion');
        const storageDisplay = document.getElementById('storageDisplay');
        const logContainer = document.getElementById('logContainer');
        const motionGraph = document.getElementById('motionGraph');

        // ─── STATE ──────────────────────────────────────────────────
        let stream = null;
        let isRunning = false;
        let isRecording = false;
        let showGrid = false;
        let qualityMode = 'hd'; // hd, sd, bw, sepia, night
        let motionHistory = [];
        let motionPeakValue = 0;
        let motionCounter = 0;
        let totalMotionEvents = 0;
        let lastFrame = null;
        let frameCount = 0;
        let lastFpsUpdate = 0;
        let tempValue = 25.0;
        let humidityValue = 60;
        let logEntries = [];
        let animationId = null;
        let recordingStartTime = null;
        let storageUsed = 0;

        const GRAPH_POINTS = 20;
        let THRESHOLD = 25;

        // ─── INIT GRAPH ────────────────────────────────────────────
        function initGraph() {
            motionGraph.innerHTML = '';
            for (let i = 0; i < GRAPH_POINTS; i++) {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = '3px';
                motionGraph.appendChild(bar);
            }
            motionHistory = new Array(GRAPH_POINTS).fill(0);
        }
        initGraph();

        // ─── FUNGSI ──────────────────────────────────────────────────
        function updateGraph(value) {
            motionHistory.push(value);
            if (motionHistory.length > GRAPH_POINTS) motionHistory.shift();
            const bars = motionGraph.querySelectorAll('.bar');
            const max = Math.max(1, ...motionHistory);
            motionPeakValue = max;
            motionPeak.textContent = max;
            bars.forEach((bar, i) => {
                const val = motionHistory[i] || 0;
                const pct = Math.min(100, (val / max) * 100);
                bar.style.height = Math.max(3, (pct / 100) * 40 + 3) + 'px';
                bar.classList.toggle('active', val > 0);
            });
        }

        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString('id-ID');
            const entry = { time, msg, type };
            logEntries.push(entry);
            if (logEntries.length > 200) logEntries.shift();

            const item = document.createElement('div');
            item.className = 'log-item';
            const cls = type === 'motion' ? 'motion' : (type === 'temp' ? 'temp' : (type === 'error' ? 'error' : ''));
            item.innerHTML = `<span class="time">${time}</span><span class="msg ${cls}">${msg}</span>`;
            logContainer.prepend(item);
            if (logContainer.children.length > 60) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        // ─── DETEKSI GERAKAN ──────────────────────────────────────
        function detectMotion(videoEl, canvasEl) {
            const c = canvasEl;
            const w = c.width,
                h = c.height;
            const ctx2 = c.getContext('2d');

            ctx2.drawImage(videoEl, 0, 0, w, h);
            const currentFrame = ctx2.getImageData(0, 0, w, h);

            if (!lastFrame) {
                lastFrame = currentFrame;
                return 0;
            }

            let diff = 0;
            const data = currentFrame.data;
            const len = data.length;
            for (let i = 0; i < len; i += 4) {
                const r = Math.abs(data[i] - lastFrame.data[i]);
                const g = Math.abs(data[i + 1] - lastFrame.data[i + 1]);
                const b = Math.abs(data[i + 2] - lastFrame.data[i + 2]);
                if ((r + g + b) / 3 > THRESHOLD) diff++;
            }

            const motionLevel = Math.min(100, (diff / (w * h)) * 300);
            lastFrame = currentFrame;

            // Overlay gerakan
            if (motionLevel > 3) {
                const alpha = Math.min(0.15, motionLevel / 500);
                ctx2.fillStyle = `rgba(255, 0, 0, ${alpha})`;
                ctx2.fillRect(0, 0, w, h);
                if (motionLevel > 12) {
                    ctx2.strokeStyle = `rgba(255, 0, 0, ${Math.min(0.5, motionLevel/200)})`;
                    ctx2.lineWidth = 2;
                    ctx2.strokeRect(4, 4, w - 8, h - 8);
                    ctx2.fillStyle = 'rgba(255, 0, 0, 0.7)';
                    ctx2.font = 'bold 15px Inter';
                    ctx2.fillText('⚠️ GERAKAN', 16, 34);
                }
            }

            return motionLevel;
        }

        // ─── FILTER KUALITAS ──────────────────────────────────────
        function applyQualityFilter(imageData, mode) {
            const data = imageData.data;
            const len = data.length;

            if (mode === 'bw') {
                for (let i = 0; i < len; i += 4) {
                    const gray = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    data[i] = gray;
                    data[i + 1] = gray;
                    data[i + 2] = gray;
                }
            } else if (mode === 'sepia') {
                for (let i = 0; i < len; i += 4) {
                    const r = data[i],
                        g = data[i + 1],
                        b = data[i + 2];
                    data[i] = Math.min(255, (r * 0.393 + g * 0.769 + b * 0.189));
                    data[i + 1] = Math.min(255, (r * 0.349 + g * 0.686 + b * 0.168));
                    data[i + 2] = Math.min(255, (r * 0.272 + g * 0.534 + b * 0.131));
                }
            } else if (mode === 'night') {
                for (let i = 0; i < len; i += 4) {
                    data[i] = Math.min(255, data[i] * 1.3);
                    data[i + 1] = Math.min(255, data[i + 1] * 1.1);
                    data[i + 2] = Math.min(255, data[i + 2] * 0.7);
                }
            }
            return imageData;
        }

        // ─── LOOP ──────────────────────────────────────────────────
        function processFrame(timestamp) {
            if (!isRunning) return;

            const w = canvas.width,
                h = canvas.height;

            // Deteksi gerakan
            const motion = detectMotion(video, canvas);
            motionCounter = Math.round(motion);

            // Simpan frame untuk filter kualitas (diambil dari canvas setelah deteksi)
            const imageData = ctx.getImageData(0, 0, w, h);

            // Terapkan filter kualitas
            let processedData = imageData;
            if (qualityMode === 'bw' || qualityMode === 'sepia' || qualityMode === 'night') {
                processedData = applyQualityFilter(imageData, qualityMode);
                ctx.putImageData(processedData, 0, 0);
            }

            // Update FPS
            frameCount++;
            if (timestamp - lastFpsUpdate > 1000) {
                lastFpsUpdate = timestamp;
                frameCount = 0;
            }

            // Update UI
            motionCount.textContent = motionCounter;

            if (motion > 5) {
                totalMotionEvents++;
                totalMotionEl.textContent = totalMotionEvents;
                motionDetectStatus.textContent = '🚨 Gerakan!';
                motionDetectStatus.style.color = '#4ade80';
                if (motion > 12) {
                    addLog(`Gerakan kuat: ${Math.round(motion)}%`, 'motion');
                }
                updateGraph(Math.round(motion));
                statusDot.className = 'dot yellow';
                statusText.textContent = 'Motion';
            } else {
                motionDetectStatus.textContent = '● Tenang';
                motionDetectStatus.style.color = '#94a3b8';
                updateGraph(0);
                statusDot.className = 'dot green';
                statusText.textContent = 'Online';
            }

            // Update storage (simulasi)
            if (isRecording) {
                storageUsed += 0.001;
                storageDisplay.textContent = storageUsed.toFixed(1) + ' GB';
            }

            animationId = requestAnimationFrame(processFrame);
        }

        // ─── KAMERA ──────────────────────────────────────────────────
        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();

                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                const vw = settings.width || 640;
                const vh = settings.height || 480;
                canvas.width = vw;
                canvas.height = vh;
                resolutionDisplay.textContent = `${vw}×${vh}`;

                isRunning = true;
                lastFrame = null;
                addLog('Kamera aktif', 'info');
                btnStart.disabled = true;
                btnStop.disabled = false;

                if (animationId) cancelAnimationFrame(animationId);
                processFrame(performance.now());

                if (!window._tempInterval) {
                    window._tempInterval = setInterval(updateSensor, 3000);
                }

            } catch (err) {
                alert('Tidak dapat mengakses kamera: ' + err.message);
                addLog('Error kamera: ' + err.message, 'error');
                console.error(err);
            }
        }

        function stopCamera() {
            isRunning = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            video.srcObject = null;
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusDot.className = 'dot red';
            statusText.textContent = 'Offline';
            addLog('Kamera dimatikan', 'info');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            motionCount.textContent = '0';
            motionDetectStatus.textContent = '--';
            updateGraph(0);
            if (isRecording) toggleRecording();
        }

        function toggleRecording() {
            isRecording = !isRecording;
            recordingStatus.textContent = isRecording ? '● Recording' : 'Off';
            recordingStatus.style.color = isRecording ? '#f87171' : '#94a3b8';
            recIndicator.style.display = isRecording ? 'flex' : 'none';
            if (isRecording) {
                recordingStartTime = new Date();
                addLog('📹 Rekaman dimulai', 'info');
            } else {
                addLog('⏹ Rekaman dihentikan', 'info');
            }
        }

        function applyZoom() {
            const zoom = parseFloat(zoomSlider.value);
            zoomDisplay.textContent = zoom.toFixed(1) + 'x';
            video.style.transform = `scale(${zoom})`;
            video.style.transformOrigin = 'center center';
        }

        function setQuality(mode) {
            qualityMode = mode;
            const names = { hd: 'HD', sd: 'SD', bw: 'B/W', sepia: 'Sepia', night: 'Night' };
            qualityDisplay.textContent = names[mode] || 'HD';
            document.querySelectorAll('.quality-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.quality === mode);
            });
            addLog(`Kualitas: ${names[mode]}`, 'info');
        }

        // ─── SENSOR SIMULASI ──────────────────────────────────────
        function updateSensor() {
            tempValue += (Math.random() - 0.5) * 0.3;
            tempValue = Math.min(38, Math.max(18, tempValue));
            tempDisplay.textContent = tempValue.toFixed(1) + ' °C';

            humidityValue += (Math.random() - 0.5) * 0.6;
            humidityValue = Math.min(85, Math.max(25, humidityValue));
            humidityDisplay.textContent = Math.round(humidityValue) + ' %';

            if (Math.random() < 0.04) {
                addLog(`Suhu: ${tempValue.toFixed(1)}°C, Kelembaban: ${Math.round(humidityValue)}%`, 'temp');
            }
        }

        // ─── SNAPSHOT ──────────────────────────────────────────────
        function takeSnapshot() {
            if (!isRunning) {
                alert('Kamera tidak aktif');
                return;
            }
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tctx = tempCanvas.getContext('2d');
            tctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            // Apply quality filter to snapshot
            const imgData = tctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            if (qualityMode === 'bw' || qualityMode === 'sepia' || qualityMode === 'night') {
                const filtered = applyQualityFilter(imgData, qualityMode);
                tctx.putImageData(filtered, 0, 0);
            }
            const link = document.createElement('a');
            link.download = `cctv_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.png`;
            link.href = tempCanvas.toDataURL('image/png');
            link.click();
            addLog('📸 Screenshot diambil', 'info');
        }

        // ─── EXPORT LOG ────────────────────────────────────────────
        function exportLog() {
            if (logEntries.length === 0) {
                alert('Tidak ada data log');
                return;
            }
            let csv = 'Waktu,Pesan,Tipe\n';
            logEntries.forEach(e => {
                csv += `"${e.time}","${e.msg}","${e.type}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.download = `cctv_log_${new Date().toISOString().slice(0,10)}.csv`;
            link.href = URL.createObjectURL(blob);
            link.click();
            addLog('📤 Log diekspor', 'info');
        }

        // ─── JAM ──────────────────────────────────────────────────
        function updateClock() {
            const now = new Date();
            clockDisplay.textContent = now.toLocaleTimeString('id-ID');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ─── EVENT LISTENERS ──────────────────────────────────────
        btnStart.addEventListener('click', startCamera);
        btnStop.addEventListener('click', stopCamera);
        btnRecord.addEventListener('click', toggleRecording);
        btnSnapshot.addEventListener('click', takeSnapshot);
        btnGrid.addEventListener('click', () => {
            showGrid = !showGrid;
            gridOverlay.classList.toggle('active', showGrid);
            addLog(`Grid ${showGrid ? 'diaktifkan' : 'dinonaktifkan'}`, 'info');
        });
        btnFullscreen.addEventListener('click', () => {
            const el = document.querySelector('.cctv-wrapper');
            if (!document.fullscreenElement) {
                el.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        });
        btnClearLog.addEventListener('click', () => {
            logEntries = [];
            logContainer.innerHTML = `<div class="log-item"><span class="time">--:--:--</span><span class="msg">Log dibersihkan</span></div>`;
            addLog('🧹 Log dibersihkan', 'info');
        });
        btnExportLog.addEventListener('click', exportLog);

        zoomSlider.addEventListener('input', applyZoom);
        applyZoom();

        thresholdSlider.addEventListener('input', () => {
            THRESHOLD = parseInt(thresholdSlider.value);
            thresholdVal.textContent = THRESHOLD;
            thresholdDisplay.textContent = THRESHOLD;
        });

        document.querySelectorAll('.quality-btn').forEach(btn => {
            btn.addEventListener('click', () => setQuality(btn.dataset.quality));
        });

        // ─── INIT ──────────────────────────────────────────────────
        addLog('🟢 CCTV Pro siap digunakan', 'info');
        addLog('📷 Klik "Mulai" untuk mengaktifkan kamera', 'info');

        // Update sensor periodically
        setInterval(updateSensor, 3000);
        updateSensor();

        // Storage simulation
        setInterval(() => {
            if (!isRunning) return;
            storageDisplay.textContent = (storageUsed + 0.2).toFixed(1) + ' GB';
        }, 5000);

        console.log('📹 CCTV Pro — Surveillance System');
        console.log('🎥 Fitur: Motion Detection, Kualitas Layar, Rekaman, Grid, Export Log');
    </script>
</body>
