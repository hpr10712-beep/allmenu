<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0B1220"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Cazoo — Dompet Digital</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Cazoo","short_name":"Cazoo","start_url":".","display":"standalone","background_color":"%230B1220","theme_color":"%230B1220","icons":[]}'/>
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#EEF1F7;
  --text:#0A1428; --muted:#68758C; --line:#E5E9F2;
  --brand:#1E3A8A; --brand-2:#2563EB; --brand-3:#3B82F6; --cyan:#06B6D4;
  --ok:#059669; --warn:#D97706; --err:#DC2626;
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(10,20,40,.04),0 1px 1px rgba(10,20,40,.03);
  --sh-2:0 6px 20px rgba(10,20,40,.06),0 2px 6px rgba(10,20,40,.04);
  --sh-3:0 20px 48px rgba(10,20,40,.16);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --tab-h:70px;
}
[data-theme="dark"]{
  --bg:#070B16; --surface:#0F1729; --surface-2:#192237;
  --text:#EBEFF8; --muted:#8C9BB8; --line:#1F2A44;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 6px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
a{color:var(--brand-2);text-decoration:none}
svg{display:block;flex:none}

/* ---------- Splash ---------- */
.splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#1E3A8A 0%,#0A1428 55%,#050A15 100%);
  transition:opacity .5s ease,visibility .5s ease}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash__mark{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3B82F6 0%,#06B6D4 100%);
  box-shadow:0 24px 60px rgba(59,130,246,.45),inset 0 1px 0 rgba(255,255,255,.35);
  font-weight:900;font-size:42px;letter-spacing:-1px;position:relative;overflow:hidden}
.splash__mark::after{content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);
  animation:shine 2s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.splash__name{font-weight:800;font-size:22px;letter-spacing:-.3px}
.splash__tag{color:rgba(255,255,255,.55);font-size:13px;margin-top:-14px}
.splash__bar{width:140px;height:3px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;position:relative;margin-top:8px}
.splash__bar::after{content:"";position:absolute;inset:0;width:36%;border-radius:99px;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  animation:slide 1.3s cubic-bezier(.4,0,.6,1) infinite}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(400%)}}

/* ---------- Auth ---------- */
.auth{min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(60px + var(--safe-t)) 20px 40px;position:relative;overflow:hidden;
  background:radial-gradient(130% 70% at 50% 0%,#1E3A8A 0%,#0A1428 60%)}
.auth::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:22px 22px;pointer-events:none;mask-image:linear-gradient(180deg,#000 30%,transparent 80%)}
.auth__inner{width:100%;max-width:400px;margin:0 auto;position:relative;z-index:1;color:#fff}
.auth__mark{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3B82F6,#06B6D4);
  box-shadow:0 20px 50px rgba(59,130,246,.45),inset 0 1px 0 rgba(255,255,255,.3);
  font-weight:900;font-size:30px;margin-bottom:22px}
.auth__h{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin:0 0 10px}
.auth__p{color:rgba(255,255,255,.68);font-size:15px;line-height:1.55;margin:0 0 34px;max-width:320px}
.auth__features{display:grid;gap:14px;margin-bottom:36px}
.auth__feat{display:flex;gap:12px;align-items:flex-start}
.auth__feat-ic{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#93C5FD}
.auth__feat-t{font-weight:700;font-size:14px;letter-spacing:-.1px}
.auth__feat-d{font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.5;margin-top:1px}
.gbtn{width:100%;padding:15px 18px;border-radius:16px;background:#fff;color:#1F1F1F;
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);
  transition:transform .12s,box-shadow .2s}
.gbtn:active{transform:scale(.98);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.gbtn:disabled{opacity:.7}
.gbtn svg{width:20px;height:20px}
.auth__terms{color:rgba(255,255,255,.5);font-size:12px;line-height:1.6;text-align:center;margin-top:22px}
.auth__terms a{color:rgba(255,255,255,.8);text-decoration:underline;text-underline-offset:2px}

/* ---------- Onboarding (PIN setup) ---------- */
.onb{min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(40px + var(--safe-t)) 24px calc(24px + var(--safe-b));
  background:var(--bg)}
.onb__h{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:20px 0 8px}
.onb__p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 auto}

/* ---------- Layout ---------- */
.appbar{position:sticky;top:0;z-index:30;padding:calc(6px + var(--safe-t)) 16px 6px;
  display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px)}
.appbar--plain{background:transparent;backdrop-filter:none;border:0}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px;font-size:16px}
.brand__mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3B82F6,#1E3A8A);color:#fff;font-weight:900;font-size:15px;
  box-shadow:0 4px 12px rgba(59,130,246,.32)}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:var(--text);background:var(--surface);border:1px solid var(--line);
  transition:transform .12s,background .15s}
.ibtn:active{transform:scale(.94);background:var(--surface-2)}
.ibtn--plain{background:transparent;border:0}
.ibtn--dark{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.14);color:#fff}
.ibtn--dark:active{background:rgba(255,255,255,.22)}
.container{padding:12px 16px calc(var(--tab-h) + 40px + var(--safe-b));max-width:560px;margin:0 auto}
.container--narrow{max-width:400px}
.view{animation:viewIn .28s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nav-head{display:flex;align-items:center;gap:8px;margin:4px 0 16px}
.nav-head__t{font-weight:800;font-size:18px;letter-spacing:-.3px;flex:1;text-align:center}
.nav-head__spacer{width:38px;flex:none}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.sec-h h2{font-size:15px;font-weight:700;letter-spacing:-.2px;margin:0}
.sec-h a,.sec-h button{font-size:13px;font-weight:600;color:var(--brand-2)}

/* ---------- Floating Tab Bar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(12px + var(--safe-b));width:min(440px,calc(100% - 24px));
  padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  background:rgba(10,20,40,.7);backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border:1px solid rgba(255,255,255,.07);border-radius:24px;
  box-shadow:0 20px 44px rgba(10,20,40,.32),0 2px 6px rgba(0,0,0,.12);z-index:60}
[data-theme="dark"] .tabbar{background:rgba(15,23,41,.85);border-color:rgba(255,255,255,.06)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:9px 2px;border-radius:18px;color:rgba(255,255,255,.5);
  font-size:10.5px;font-weight:600;letter-spacing:.01em;position:relative;
  transition:all .24s cubic-bezier(.22,1,.36,1)}
.tab svg{width:22px;height:22px;transition:transform .24s}
.tab.active{color:#fff;background:linear-gradient(180deg,rgba(59,130,246,.3),rgba(59,130,246,.16))}
.tab.active svg{transform:translateY(-1px)}
.tab__dot{position:absolute;top:6px;right:calc(50% - 15px);width:7px;height:7px;border-radius:50%;
  background:#EF4444;box-shadow:0 0 0 2px rgba(10,20,40,.72)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--sh-1)}
.card+.card{margin-top:12px}
.card--flush{padding:0;overflow:hidden}
.card--tight{padding:14px}
.card--flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.card--warn{background:rgba(217,119,6,.08);border-color:rgba(217,119,6,.22);box-shadow:none}
.card--danger{background:rgba(220,38,38,.06);border-color:rgba(220,38,38,.2);box-shadow:none}

/* ---------- Balance Card ---------- */
.bal{position:relative;border-radius:var(--r-xl);padding:22px 22px 20px;overflow:hidden;color:#fff;
  background:
    radial-gradient(120% 100% at 100% 0%,rgba(6,182,212,.32),transparent 55%),
    radial-gradient(100% 120% at 0% 100%,rgba(37,99,235,.4),transparent 55%),
    linear-gradient(140deg,#0A1428 0%,#1E3A8A 100%);
  box-shadow:0 22px 48px rgba(10,20,40,.28),inset 0 1px 0 rgba(255,255,255,.08)}
.bal::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:16px 16px;pointer-events:none;opacity:.55;mask-image:linear-gradient(135deg,#000,transparent 70%)}
.bal__row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;gap:12px}
.bal__lab{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.bal__val{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin:8px 0 6px;
  font-variant-numeric:tabular-nums;line-height:1.05;transition:filter .2s}
.bal__val.blur{filter:blur(10px);user-select:none}
.bal__id{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;
  border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);
  font-size:11.5px;color:rgba(255,255,255,.75);font-weight:600}
.bal__id b{color:#fff;letter-spacing:.1em;font-variant-numeric:tabular-nums;font-weight:700}
.bal__id button{color:inherit;opacity:.7;padding:2px;border-radius:6px;transition:opacity .15s}
.bal__id button:active{opacity:1;background:rgba(255,255,255,.1)}
.bal__quick{display:flex;gap:8px;margin-top:20px;position:relative}
.bal__quick button{flex:1;padding:11px 6px;border-radius:14px;
  background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.08);color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:11px;font-weight:600;transition:background .15s,transform .12s}
.bal__quick button:active{transform:scale(.96);background:rgba(255,255,255,.18)}
.bal__quick span{font-size:11px;letter-spacing:.01em}

/* ---------- Quick Grid ---------- */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 6px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);
  font-size:11.5px;font-weight:600;color:var(--text);box-shadow:var(--sh-1);
  transition:transform .12s,background .15s}
.qbtn:active{transform:scale(.96);background:var(--surface-2)}
.qbtn__ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:#1E40AF}
[data-theme="dark"] .qbtn__ico{background:linear-gradient(135deg,#1E3A8A,#172554);color:#93C5FD}
.qbtn:nth-child(2) .qbtn__ico{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);color:#047857}
[data-theme="dark"] .qbtn:nth-child(2) .qbtn__ico{background:linear-gradient(135deg,#064E3B,#022C22);color:#6EE7B7}
.qbtn:nth-child(3) .qbtn__ico{background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E}
[data-theme="dark"] .qbtn:nth-child(3) .qbtn__ico{background:linear-gradient(135deg,#78350F,#451A03);color:#FCD34D}
.qbtn:nth-child(4) .qbtn__ico{background:linear-gradient(135deg,#EDE9FE,#DDD6FE);color:#5B21B6}
[data-theme="dark"] .qbtn:nth-child(4) .qbtn__ico{background:linear-gradient(135deg,#4C1D95,#2E1065);color:#C4B5FD}

/* ---------- List items ---------- */
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);transition:background .15s,transform .1s;
  cursor:pointer;text-align:left;width:100%}
.item:active{background:var(--surface-2);transform:scale(.995)}
.item--flush{border-radius:0;border-left:0;border-right:0;border-top:0;box-shadow:none}
.item--flush:first-child{border-top:1px solid var(--line)}
.item--no-interact{cursor:default}
.item--no-interact:active{background:var(--surface);transform:none}
.item__ico{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--muted)}
.item__ico.in{background:rgba(5,150,105,.12);color:var(--ok)}
.item__ico.out{background:rgba(220,38,38,.1);color:var(--err)}
.item__ico.pending{background:rgba(217,119,6,.14);color:var(--warn)}
.item__ico.brand{background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:#1E40AF}
[data-theme="dark"] .item__ico.brand{background:linear-gradient(135deg,#1E3A8A,#172554);color:#93C5FD}
.item__body{flex:1;min-width:0}
.item__t{font-weight:600;font-size:14px;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item__s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item__amt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.item__amt.in{color:var(--ok)}
.item__amt.out{color:var(--text)}
.item__chev{color:var(--muted);flex:none;margin-left:-4px}

/* ---------- Badge ---------- */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:var(--surface-2);color:var(--muted)}
.bdg.ok{background:rgba(5,150,105,.13);color:#047857}
.bdg.warn{background:rgba(217,119,6,.15);color:#B45309}
.bdg.err{background:rgba(220,38,38,.12);color:#B91C1C}
[data-theme="dark"] .bdg.ok{color:#6EE7B7}
[data-theme="dark"] .bdg.warn{color:#FCD34D}
[data-theme="dark"] .bdg.err{color:#FCA5A5}
.bdg--flat{background:transparent;padding:0}

/* ---------- Form ---------- */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.01em;margin-left:2px}
.inp,.inp-select,.inp-textarea{padding:14px;border-radius:14px;background:var(--surface);
  border:1.5px solid var(--line);color:var(--text);font-size:15px;width:100%;
  transition:border-color .18s,box-shadow .18s;font-variant-numeric:tabular-nums}
.inp:focus,.inp-select:focus,.inp-textarea:focus{border-color:var(--brand-3);box-shadow:0 0 0 3.5px rgba(59,130,246,.14)}
.inp-select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2368758C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
.inp-textarea{min-height:96px;resize:vertical;font-family:inherit}
.inp-wicon{position:relative}
.inp-wicon .inp{padding-left:44px}
.inp-wicon__ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-left:2px;line-height:1.5}
.err-line{font-size:12.5px;color:var(--err);display:flex;align-items:center;gap:6px;min-height:16px;margin:2px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:14px;font-weight:700;font-size:14.5px;letter-spacing:-.1px;
  transition:transform .12s,filter .15s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-pri{background:linear-gradient(135deg,#1E3A8A,#0A1428);color:#fff;
  box-shadow:0 8px 22px rgba(30,58,138,.28),inset 0 1px 0 rgba(255,255,255,.14)}
.btn-blue{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;
  box-shadow:0 8px 22px rgba(59,130,246,.28)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--text)}
.btn-ghost:active{background:var(--surface-2)}
.btn-danger{background:rgba(220,38,38,.09);color:#B91C1C;border:1.5px solid rgba(220,38,38,.2)}
[data-theme="dark"] .btn-danger{color:#FCA5A5}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:11px}
.btn-xs{padding:7px 11px;font-size:12px;border-radius:9px}

/* ---------- Pills / Tabs ---------- */
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 2px;margin:0 -2px 14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 16px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);
  transition:all .18s;white-space:nowrap}
.pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}
[data-theme="dark"] .pill.active{background:#2563EB;border-color:#2563EB}

/* ---------- Keypad (numeric) ---------- */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto;padding-top:22px}
.kp button{height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
  font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text);
  transition:background .1s,transform .1s;display:grid;place-items:center}
.kp button:active{background:var(--surface-2);transform:scale(.96)}
.kp button[data-k="del"],.kp button[data-k="ok"]{background:var(--surface-2);font-size:18px}
.kp button[data-k="ok"]{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-size:15px;font-weight:700}
.kp button[data-k="ok"]:disabled{opacity:.4}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:28px 0 10px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--line);transition:all .15s cubic-bezier(.22,1,.36,1)}
.pin-dot.filled{background:var(--brand-3);transform:scale(1.15)}
.pin-dot.err{background:var(--err);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ---------- Modal ---------- */
.mbg{position:fixed;inset:0;background:rgba(10,20,40,.5);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;
  animation:mbIn .22s ease;padding-top:var(--safe-t)}

async function sha256Hex(str){
  const buf = new TextEncoder().encode(str);
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,"0")).join("");
}
function randomSalt(){
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2,"0")).join("");
}

    provider.setCustomParameters({ prompt: "select_account" });
    try {
      await signInWithPopup(auth, provider);
      // onAuthStateChanged akan menangani
    } catch (e) {
      if(e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment"){
        try {
          await signInWithRedirect(auth, provider);
          return;

          toast(errMsg(e2.code, e2.message), "err");
        }
      } else if(e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request"){
        toast(errMsg(e.code, e.message), "err");
      }
      btn.disabled = false;
      lbl.textContent = prev;
    }
  };

/* =========================================================
   Auth state
========================================================= */
onAuthStateChanged(auth, async user => {
  if(!user){
    state.user = null; state.profile = null; state.wallet = null;
    state.isAdmin = false; state.needsSetup = false;
    state.unsubWallet?.(); state.unsubNotif?.();
    renderAuth();
    hideSplash();
    return;
  }
  state.user = user;
  try {
    const [tok, pSnap, wSnap] = await Promise.all([
      user.getIdTokenResult(true),
      get(ref(db, `users/${user.uid}`)),
      get(ref(db, `wallets/${user.uid}`))
    ]);
    state.isAdmin = tok.claims?.admin === true;
    state.profile = pSnap.exists() ? pSnap.val() : null;
    state.wallet  = wSnap.exists() ? wSnap.val() : null;

    if(!state.profile || !state.profile.accountId){
      // Perlu setup PIN dulu
      state.needsSetup = true;
      renderPinSetup();
      hideSplash();
      return;
    }
    if(state.profile.accountStatus === "disabled"){
      renderDisabled(); hideSplash(); return;
    }
    await finalizeLogin();
  } catch (e) {
    console.error(e);
    renderFatal(errMsg(e.code, e.message));
    hideSplash();
  }
});

/* Google redirect result handler */
getRedirectResult(auth).catch(e => {

  subscribeWallet(state.user.uid);

}

/* =========================================================
   PIN Setup (onboarding setelah Google login pertama)
========================================================= */
function renderPinSetup(){
  const user = state.user;
  let stage = "create"; // create | confirm
  let pin1 = "";
  let pin2 = "";

  const draw = () => {
    const val = stage === "create" ? pin1 : pin2;
    $("#app").innerHTML = `
      <div class="onb">
        <div class="row" style="gap:10px;align-items:center;margin-bottom:4px">
          <div style="width:52px;height:52px;border-radius:16px;
            background:linear-gradient(135deg,#3B82F6,#1E3A8A);color:#fff;
            display:grid;place-items:center;font-weight:900;font-size:22px;
            box-shadow:0 12px 30px rgba(59,130,246,.32)">
            ${esc((user.displayName || user.email || "U").charAt(0).toUpperCase())}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:15px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${esc(user.displayName || "Pengguna Baru")}
            </div>
            <div class="hint" style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${esc(user.email || "")}
            </div>
          </div>
        </div>

        <h1 class="onb__h">${stage === "create" ? "Buat PIN Transaksi" : "Konfirmasi PIN"}</h1>
        <p class="onb__p">
          ${stage === "create"
            ? "PIN 6-digit melindungi setiap transaksi Anda. Jangan bagikan ke siapa pun, termasuk tim Cazoo."
            : "Masukkan kembali PIN Anda untuk konfirmasi."}
        </p>

        <div class="pin-dots" id="dots">
          ${Array(6).fill('<div class="pin-dot"></div>').join("")}
        </div>
        <div class="err-line txt-c" id="err" style="justify-content:center"></div>

        <div class="kp" id="kp">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
          <button data-k="del">${ic("x",20)}</button>
          <button data-k="0">0</button>
          <button data-k="ok" ${val.length!==6?"disabled":""}>Lanjut</button>
        </div>
      </div>`;

    const dots = $$("#dots .pin-dot");
    val.split("").forEach((_, i) => dots[i]?.classList.add("filled"));

    $("#kp").onclick = e => {
      const btn = e.target.closest("button[data-k]");
      if(!btn) return;
      const k = btn.dataset.k;
      handleKey(k);
    };
  };

  function handleKey(k){
    const isCreate = stage === "create";
    let v = isCreate ? pin1 : pin2;
    const err = $("#err");
    err.textContent = "";

    if(k === "del"){ v = v.slice(0,-1); }
    else if(k === "ok"){
      if(v.length !== 6){ err.textContent = "PIN harus 6 digit."; return; }
      if(isCreate){
        if(/^(\d)\1{5}$/.test(v)){ err.textContent = "PIN terlalu mudah. Hindari angka berulang."; shake(); return; }
        if(["123456","654321","000000","111111","222222","333333","444444","555555","666666","777777","888888","999999"].includes(v)){
          err.textContent = "PIN terlalu mudah ditebak."; shake(); return;
        }
        pin1 = v; stage = "confirm"; pin2 = ""; draw(); return;
      } else {
        if(v !== pin1){ err.textContent = "PIN tidak cocok. Coba lagi."; shake(); pin2=""; draw(); return; }
        // finish
        finish(v);
        return;
      }
    }
    else if(/^\d$/.test(k)){
      if(v.length >= 6) return;
      v += k;
    }

    if(isCreate) pin1 = v; else pin2 = v;

    const dots = $$("#dots .pin-dot");
    dots.forEach((d,i) => d.classList.toggle("filled", i < v.length));
    const ok = $("#kp button[data-k='ok']");
    if(ok) ok.disabled = v.length !== 6;
  }

  function shake(){
    const dots = $$("#dots .pin-dot");
    dots.forEach(d => d.classList.add("err"));
    setTimeout(() => dots.forEach(d => d.classList.remove("err")), 400);
  }

  async function finish(pin){
    const btn = $("#kp button[data-k='ok']");
    if(btn) btn.disabled = true;
    try {
      const salt = randomSalt();
      const pinHash = await sha256Hex(salt + ":" + pin);
      const call = httpsCallable(fns, "finalizeRegistration");
      const res = await call({
        displayName: state.user.displayName || (state.user.email||"Pengguna").split("@")[0],
        pinHash, pinSalt: salt
      });
      toast("Selamat datang di Cazoo!", "ok");
      // refresh profile
      const pSnap = await get(ref(db, `users/${state.user.uid}`));
      state.profile = pSnap.val();
      state.needsSetup = false;
      await finalizeLogin();
    } catch (e) {
      console.error(e);
      $("#err").textContent = errMsg(e.code, e.message);
      pin1 = ""; pin2 = ""; stage = "create";
      setTimeout(draw, 500);
    }
  }

  draw();
}

/* =========================================================
   Realtime subscriptions
========================================================= */
function subscribeWallet(uid){
  state.unsubWallet?.();
  state.unsubWallet = onValue(ref(db, `wallets/${uid}`), s => {
    if(s.exists()){
      state.wallet = s.val();
      if(state.route === "home") renderRoute();
    }
  }, e => console.warn("wallet:", e.message));
}
function subscribeNotifications(uid){
  state.unsubNotif?.();
  state.unsubNotif = onValue(
    query(ref(db, `notifications/${uid}`), orderByChild("createdAt"), limitToLast(80)),
    s => {
      const arr = [];
      s.forEach(c => arr.push({ id: c.key, ...c.val() }));
      arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      state.notifs = arr;
      state.unread = arr.filter(n => !n.read).length;
      paintTabDot();
      if(state.route === "notifications") renderRoute();
    },
    e => console.warn("notif:", e.message)
  );
}
function paintTabDot(){
  $$(".tabbar .tab[data-route='notifications'] .tab__dot").forEach(x => x.remove());
  if(state.unread > 0){
    const el = $(".tabbar .tab[data-route='notifications']");
    if(el){
      const d = document.createElement("span");
      d.className = "tab__dot";
      el.appendChild(d);
    }
  }
}

/* =========================================================
   PIN prompt (modal, keypad)
========================================================= */
function promptPin(purpose = "Masukkan PIN"){
  return new Promise(resolve => {
    let value = "";
    const m = modal(`
      <h2 class="txt-c" style="margin-bottom:6px">${esc(purpose)}</h2>
      <p class="hint txt-c" style="margin:0 0 4px">PIN 6-digit Anda</p>
      <div class="pin-dots" id="dots">${Array(6).fill('<div class="pin-dot"></div>').join("")}</div>
      <div class="err-line txt-c" id="err" style="justify-content:center"></div>
      <div class="kp" id="kp">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
        <button data-k="del">${ic("x",20)}</button>
        <button data-k="0">0</button>
        <button data-k="ok" disabled>OK</button>
      </div>
      <button class="btn btn-ghost btn-block mt" id="cancel">Batal</button>
    `);

    const dots = m.$$("#dots .pin-dot");
    const err = m.$("#err");
    const okBtn = m.$("#kp button[data-k='ok']");

    const paint = () => {
      dots.forEach((d,i) => d.classList.toggle("filled", i < value.length));
      okBtn.disabled = value.length !== 6;
    };

    m.$("#kp").onclick = e => {
      const btn = e.target.closest("button[data-k]");
      if(!btn) return;
      const k = btn.dataset.k;
      if(k === "del") value = value.slice(0,-1);
      else if(k === "ok"){
        if(value.length !== 6) return;
        const pin = value;
        m.close();
        resolve(pin);
        return;
      }
      else if(/^\d$/.test(k) && value.length < 6) value += k;
      paint();
      err.textContent = "";
    };
    m.$("#cancel").onclick = () => { m.close(); resolve(null); };
  });
}

async function requirePin(purpose = "Konfirmasi Transaksi"){
  const pin = await promptPin(purpose);
  if(!pin) throw new Error("__cancel__");
  try {
    await httpsCallable(fns, "verifyPin")({ pin });
    return true;
  } catch(e){
    throw new Error(errMsg(e.code, e.message));
  }
}

async function loadRecent(limit=8){
  const uid = state.user?.uid; if(!uid) return [];
  const snap = await get(query(ref(db,"transactions"),
    orderByChild("userId"), equalTo(uid), limitToLast(limit)));
  const arr = []; snap.forEach(c => arr.push({ id: c.key, ...c.val() }));
  arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return arr;
}

ROUTES.transfer = (root) => {
  root.innerHTML = `
    ${navHead("Transfer")}
    <div class="card">
      <div class="field">
        <label>Cari Penerima</label>
        <div class="inp-wicon">
          <span class="inp-wicon__ic">${ic("search",18)}</span>

      </div>

      <div id="recipient" class="mt"></div>
    </div>

    <div class="card" id="formCard" style="display:none">
      <div class="field">
        <label>Nominal</label>
        <input class="inp" id="amount" type="number" inputmode="numeric" min="1000"

      </div>

      <div class="err-line" id="err"></div>
      <button class="btn btn-pri btn-block" id="submit" disabled>
        ${ic("shield",18)} Konfirmasi Transfer
      </button>
    </div>
  `;
  bindNavHead(root);

  let recipient = null;
  $("#q", root).addEventListener("input", e => e.target.value = e.target.value.replace(/\D/g,"").slice(0,10));

  $$("#quickAmt .chip", root).forEach(c => c.onclick = () => {
    $("#amount", root).value = c.dataset.v;
    $$("#quickAmt .chip", root).forEach(x => x.setAttribute("aria-pressed", x === c));
    updateSummary();
  });

  $("#find", root).onclick = async () => {
    const id = $("#q", root).value.trim();
    const box = $("#recipient", root);
    const formCard = $("#formCard", root);
    formCard.style.display = "none";
    recipient = null;

    if(!/^\d{8,10}$/.test(id)){
      box.innerHTML = `<div class="err-line">${ic("alert",14,2.2)}<span>ID akun harus 8–10 digit angka.</span></div>`;
      return;
    }
    if(id === state.profile?.accountId){
      box.innerHTML = `<div class="err-line">${ic("alert",14,2.2)}<span>Tidak dapat transfer ke diri sendiri.</span></div>`;
      return;
    }
    box.innerHTML = `<div class="sk sk-line" style="height:60px;border-radius:14px"></div>`;
    try {
      const idSnap = await get(ref(db, `accountIds/${id}`));
      if(!idSnap.exists()){
        box.innerHTML = `<div class="err-line">${ic("alert",14,2.2)}<span>Penerima tidak ditemukan.</span></div>`;
        return;
      }
      const uid = idSnap.val();
      const uSnap = await get(ref(db, `users/${uid}`));
      if(!uSnap.exists()){
        box.innerHTML = `<div class="err-line">${ic("alert",14,2.2)}<span>Data penerima tidak tersedia.</span></div>`;
        return;
      }
      const u = uSnap.val();
      if(u.accountStatus !== "active"){
        box.innerHTML = `<div class="err-line">${ic("alert",14,2.2)}<span>Akun penerima tidak aktif.</span></div>`;
        return;
      }
      recipient = { uid, ...u, accountId: id };
      box.innerHTML = `<div class="item item--no-interact">
        <div class="item__ico brand">${ic("user",18)}</div>
        <div class="item__body">
          <div class="item__t">${esc(u.displayName||"Pengguna")}</div>
          <div class="item__s">ID ${esc(id)}</div>
        </div>
        <span class="bdg ok">Aktif</span>
      </div>`;
      formCard.style.display = "block";
      updateSummary();
    } catch(e){
      box.innerHTML = `<div class="err-line">${ic("alert",14,2.2)}<span>${esc(errMsg(e.code, e.message))}</span></div>`;
    }
  };

  function updateSummary(){
    const box = $("#summary", root);
    const err = $("#err", root);
    const submit = $("#submit", root);
    if(!recipient){ box.innerHTML = ""; submit.disabled = true; return; }
    const v = Number($("#amount", root).value || 0);
    const ok = Number.isFinite(v) && v >= 1000 && v <= 10_000_000;
    const bal = state.wallet?.availableBalance || 0;
    const enough = v <= bal;
    err.innerHTML = "";
    if(v > 0 && !ok) err.innerHTML = `${ic("alert",14,2.2)}<span>Nominal antara ${rp(1000)} dan ${rp(10_000_000)}.</span>`;
    else if(v > 0 && !enough) err.innerHTML = `${ic("alert",14,2.2)}<span>Saldo tidak cukup.</span>`;

    box.innerHTML = `
      <div class="card card--flat mt">
        <div class="kv"><span>Pengirim</span><span>${esc(state.profile?.displayName||"Anda")}</span></div>
        <div class="kv"><span>Penerima</span><span>${esc(recipient.displayName)}</span></div>
        <div class="kv"><span>Nominal</span><span>${ok?rp(v):"—"}</span></div>
        <div class="kv"><span>Biaya</span><span>Rp 0</span></div>
        <div class="kv kv--big"><span>Total Debit</span><span>${ok?rp(v):"—"}</span></div>
      </div>
      <div class="hint mt-s">Saldo Anda: ${rp(bal)}</div>`;
    submit.disabled = !(ok && enough && recipient);
  }
  $("#amount", root).addEventListener("input", updateSummary);
  $("#note", root).addEventListener("input", e => e.target.value = e.target.value.replace(/[^\w\s\.,\-]/g,"").slice(0,60));

  $("#submit", root).onclick = async () => {
    if(!recipient) return;
    const v = Number($("#amount", root).value || 0);
    const err = $("#err", root);
    const btn = $("#submit", root);
    err.innerHTML = "";

    if(!(v >= 1000 && v <= 10_000_000)){ err.innerHTML = `${ic("alert",14,2.2)}<span>Nominal tidak valid.</span>`; return; }
    if(v > (state.wallet?.availableBalance||0)){ err.innerHTML = `${ic("alert",14,2.2)}<span>Saldo tidak cukup.</span>`; return; }

    const ok = await confirmDlg("Konfirmasi Transfer",
      `Kirim ${rp(v)} ke ${recipient.displayName} (ID ${recipient.accountId})?`, "Lanjut");
    if(!ok) return;

    try { await requirePin("PIN Transfer"); }
    catch(e){
      if(e.message === "__cancel__") return;
      err.innerHTML = `${ic("alert",14,2.2)}<span>${esc(e.message)}</span>`;
      return;
    }

    btn.disabled = true;
    const prev = btn.innerHTML;
    btn.innerHTML = `${ic("refresh",16)} Memproses…`;
    try {
      const res = await httpsCallable(fns, "transfer")({
        receiverUid: recipient.uid, amount: v,
        note: $("#note", root).value.trim(), idempotencyKey: uuid()
      });
      toast("Transfer berhasil", "ok");
      if(res.data?.transactionId) setTimeout(() => showTxDetail(res.data.transactionId), 300);
      setTimeout(() => navigate("home"), 500);
    } catch(e){
      err.innerHTML = `${ic("alert",14,2.2)}<span>${esc(errMsg(e.code, e.message))}</span>`;
      btn.disabled = false; btn.innerHTML = prev;
    }
  };
};

      <button class="btn btn-pri btn-block" id="submit">
        ${ic("card",18)} Bayar Sekarang
      </button>
      <div class="hint mt">Merchant diverifikasi server sebelum pembayaran diproses.</div>
    </div>

    <div class="sec-h"><h2>Pembayaran Terakhir</h2></div>
    <div id="list">${skeletonList(3)}</div>
  `;

  $$("[data-go]", root).forEach(b => b.onclick = () => {
    const g = b.dataset.go;
    if(g === "qris-scan"){ navigate("qris"); setTimeout(() => $(".pill[data-tab='scan']")?.click(), 40); }
    else if(g === "qris-mine"){ navigate("qris"); setTimeout(() => $(".pill[data-tab='mine']")?.click(), 40); }
    else if(g === "help") navigate("help");
    else if(g === "merchant") $("#code", root).focus();
  });

  $("#submit", root).onclick = async () => {
    const code = $("#code", root).value.trim();
    const v = Number($("#amount", root).value || 0);
    const err = $("#err", root);
    err.innerHTML = "";
    if(!code){ err.innerHTML = `${ic("alert",14,2.2)}<span>Masukkan kode merchant.</span>`; return; }
    if(!(v >= 1000 && v <= 10_000_000)){ err.innerHTML = `${ic("alert",14,2.2)}<span>Nominal tidak valid.</span>`; return; }
    if(v > (state.wallet?.availableBalance || 0)){ err.innerHTML = `${ic("alert",14,2.2)}<span>Saldo tidak cukup.</span>`; return; }

    const ok = await confirmDlg("Konfirmasi Pembayaran", `Bayar ${rp(v)} ke merchant ${code}?`, "Lanjut");
    if(!ok) return;
    try { await requirePin("PIN Pembayaran"); }
    catch(e){
      if(e.message === "__cancel__") return;
      err.innerHTML = `${ic("alert",14,2.2)}<span>${esc(e.message)}</span>`;
      return;
    }

    const btn = $("#submit", root); btn.disabled = true;
    const prev = btn.innerHTML; btn.innerHTML = `${ic("refresh",16)} Memproses…`;
    try {
      const res = await httpsCallable(fns, "payMerchant")({ code, amount: v, idempotencyKey: uuid() });
      toast("Pembayaran berhasil", "ok");
      if(res.data?.transactionId) setTimeout(() => showTxDetail(res.data.transactionId), 300);
      loadHistory();
    } catch(e){
      err.innerHTML = `${ic("alert",14,2.2)}<span>${esc(errMsg(e.code, e.message))}</span>`;
    } finally { btn.disabled = false; btn.innerHTML = prev; }
  };

  async function loadHistory(){
    const el = $("#list", root);
    try {
      const snap = await get(query(ref(db,"transactions"),
        orderByChild("userId"), equalTo(state.user.uid), limitToLast(50)));
      const arr = []; snap.forEach(c => arr.push({ id:c.key, ...c.val() }));
      const pays = arr.filter(t => t.transactionType === "PAYMENT")
        .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,10);
      if(!pays.length){
        el.innerHTML = emptyState("card", "Belum ada pembayaran",
          "Pembayaran ke merchant akan tercatat di sini.");
        return;
      }
      el.innerHTML = `<div class="list">${pays.map(t => txItemHTML(t)).join("")}</div>`;
      el.querySelectorAll("[data-tx]").forEach(x => x.onclick = () => showTxDetail(x.dataset.tx));
    } catch(e){
      el.innerHTML = errState(errMsg(e.code, e.message), "retryPay");
      $("#retryPay", el)?.addEventListener("click", loadHistory);
    }
  }
  loadHistory();
};

    try { await update(ref(db), updates); toast("Semua ditandai dibaca", "ok"); }

  };
};

  $("#deleteBtn", root).onclick = deleteAccount;

      <div class="field">
        <label>Nama</label>
        <input class="inp" id="name" value="${esc(profile?.displayName||"")}" maxlength="40">

        <button class="btn btn-ghost" id="cancel">Batal</button>
        <button class="btn btn-pri" id="ok">Simpan</button>
      </div>`);
    m.$("#cancel").onclick = () => m.close();
    m.$("#ok").onclick = async () => {
      const name = m.$("#name").value.trim();
      if(!name){ m.$("#err").innerHTML = `${ic("alert",13,2.3)}<span>Nama wajib diisi.</span>`; return; }
      try {
        await update(ref(db, `users/${user.uid}`), { displayName: name });
        await updateProfile(user, { displayName: name });
        state.profile.displayName = name;
        m.close(); toast("Nama diperbarui", "ok"); renderRoute();
      } catch(e){ m.$("#err").textContent = errMsg(e.code, e.message); }
    };
  }

  function changePin(){
    let step = "old"; let oldPin = ""; let newPin = "";
    const m = modal(`
      <h2 id="title" class="txt-c">Masukkan PIN Lama</h2>
      <div class="pin-dots" id="dots">${Array(6).fill('<div class="pin-dot"></div>').join("")}</div>
      <div class="err-line txt-c" id="err" style="justify-content:center"></div>
      <div class="kp" id="kp">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
        <button data-k="del">${ic("x",20)}</button>
        <button data-k="0">0</button>
        <button data-k="ok" disabled>OK</button>
      </div>
      <button class="btn btn-ghost btn-block mt" id="cancel">Batal</button>`);

    let val = "";
    const title = m.$("#title");
    const dots = m.$$("#dots .pin-dot");
    const err = m.$("#err");
    const okBtn = m.$("#kp button[data-k='ok']");

    const paint = () => {
      dots.forEach((d,i) => d.classList.toggle("filled", i < val.length));
      okBtn.disabled = val.length !== 6;
    };

    const setStep = (s) => {
      step = s; val = ""; paint();
      if(s === "old") title.textContent = "Masukkan PIN Lama";
      else if(s === "new") title.textContent = "PIN Baru";
      else title.textContent = "Konfirmasi PIN Baru";
      err.textContent = "";
    };

    m.$("#kp").onclick = async e => {
      const btn = e.target.closest("button[data-k]");
      if(!btn) return;
      const k = btn.dataset.k;
      if(k === "del") val = val.slice(0,-1);
      else if(k === "ok"){
        if(val.length !== 6) return;
        if(step === "old"){
          oldPin = val;
          // verify old pin
          try {
            await httpsCallable(fns, "verifyPin")({ pin: oldPin });
            setStep("new");
          } catch(e){
            err.innerHTML = `${ic("alert",13,2.3)}<span>${esc(errMsg(e.code, e.message))}</span>`;
            val = "";
            dots.forEach(d => d.classList.add("err"));
            setTimeout(() => dots.forEach(d => d.classList.remove("err")), 400);
            paint();
          }
          return;
        }
        if(step === "new"){
          if(/^(\d)\1{5}$/.test(val) || ["123456","654321"].includes(val)){
            err.textContent = "PIN terlalu mudah.";
            val = ""; paint(); return;
          }
          newPin = val; setStep("confirm"); return;
        }
        if(step === "confirm"){
          if(val !== newPin){
            err.textContent = "PIN tidak cocok.";
            val = ""; paint(); return;
          }
          try {
            const salt = randomSalt();
            const hash = await sha256Hex(salt + ":" + newPin);
            await httpsCallable(fns, "changePin")({ oldPin, newPinHash: hash, newPinSalt: salt });
            m.close(); toast("PIN diubah", "ok");
          } catch(e){
            err.innerHTML = `${ic("alert",13,2.3)}<span>${esc(errMsg(e.code, e.message))}</span>`;
          }
          return;
        }
      }
      else if(/^\d$/.test(k) && val.length < 6) val += k;
      paint();
    };
    m.$("#cancel").onclick = () => m.close();
    setStep("old");
  }

function newTicket(){
  const m = modal(`
    <h2>Kirim Pengaduan</h2>
    <div class="field">
      <label>Subjek</label>
      <input class="inp" id="subject" maxlength="80" placeholder="Ringkas masalah Anda">
    </div>
    <div class="field">
      <label>Kategori</label>
      <select class="inp inp-select" id="cat">
        <option value="transaksi">Masalah Transaksi</option>
        <option value="akun">Masalah Akun</option>
        <option value="keamanan">Keamanan</option>
        <option value="lainnya">Lainnya</option>
      </select>
    </div>
    <div class="field">
      <label>Deskripsi</label>
      <textarea class="inp inp-textarea" id="desc" maxlength="800"
        placeholder="Jelaskan detail masalah Anda..."></textarea>
    </div>
    <div class="err-line" id="err"></div>
    <div class="g2 mt">
      <button class="btn btn-ghost" id="cancel">Batal</button>
      <button class="btn btn-pri" id="ok">Kirim</button>
    </div>`);
  m.$("#cancel").onclick = () => m.close();
  m.$("#ok").onclick = async () => {
    const subj = m.$("#subject").value.trim();
    const desc = m.$("#desc").value.trim();
    const cat = m.$("#cat").value;
    const err = m.$("#err");
    err.innerHTML = "";
    if(!subj){ err.innerHTML = `${ic("alert",13,2.3)}<span>Subjek wajib diisi.</span>`; return; }
    if(desc.length < 10){ err.innerHTML = `${ic("alert",13,2.3)}<span>Deskripsi minimal 10 karakter.</span>`; return; }
    m.$("#ok").disabled = true;
    try {
      const id = uuid().slice(0,8).toUpperCase();
      const now = Date.now();
      await set(ref(db, `supportTickets/${id}`), {
        ticketId: id, userId: state.user.uid,
        subject: subj, category: cat, message: desc,
        status: "open", createdAt: now, updatedAt: now
      });
      m.close();
      toast(`Tiket #${id} dikirim`, "ok");
    } catch(e){
      err.innerHTML = `${ic("alert",13,2.3)}<span>${esc(errMsg(e.code, e.message))}</span>`;
      m.$("#ok").disabled = false;
    }
  };
}

ROUTES.tickets = (root) => {

      ${ic("plus",18)} Buat Pengaduan Baru
    </button>`;
  bindNavHead(root, () => navigate("help"));

  async function load(){
    const el = $("#list", root);
    try {
      const snap = await get(query(ref(db,"supportTickets"),
        orderByChild("userId"), equalTo(state.user.uid), limitToLast(30)));
      const arr = []; snap.forEach(c => arr.push({ id:c.key, ...c.val() }));
      arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      if(!arr.length){
        el.innerHTML = emptyState("ticket", "Belum ada pengaduan",
          "Pengaduan yang Anda kirim akan tercatat di sini.");
        return;
      }
      const cls = { open:"warn", processing:"warn", resolved:"ok", closed:"err" };
      el.innerHTML = `<div class="list">${arr.map(t => `
        <div class="item item--no-interact">
          <div class="item__ico ${t.status==='resolved'?'in':'pending'}">${ic("ticket",18)}</div>
          <div class="item__body">
            <div class="item__t">${esc(t.subject)}</div>
            <div class="item__s">
              <span class="bdg ${cls[t.status]||""}">${esc(t.status||"—")}</span>
              <span>#${esc(t.id)}</span>
            </div>
          </div>
        </div>`).join("")}</div>`;
    } catch(e){
      el.innerHTML = errState(errMsg(e.code, e.message), "retryTk");
      $("#retryTk", el)?.addEventListener("click", load);
    }
  }
  $("#newBtn", root).onclick = () => { newTicket(); setTimeout(load, 500); };
  load();
};

ROUTES.admin = async (root) => {
  if(!state.isAdmin){
    root.innerHTML = `${navHead("Panel Admin")}${emptyState("shield","Akses Ditolak","Anda bukan admin.")}`;
    bindNavHead(root, () => navigate("profile"));
    return;
  }
  root.innerHTML = `

    <div id="stats">${skeletonList(1)}</div>
    <div class="sec-h"><h2>Permintaan Pending</h2></div>

    <div class="sec-h"><h2>Pengguna Terbaru</h2></div>
    <div id="users">${skeletonList(3)}</div>`;
  bindNavHead(root, () => navigate("profile"));

  try {
    const [uSnap, tSnap] = await Promise.all([
      get(ref(db, "users")),
      get(query(ref(db, "transactions"), limitToLast(500)))
    ]);
    let userCount = 0; uSnap.forEach(() => userCount++);
    const tx = []; tSnap.forEach(c => tx.push(c.val()));
    const succ = tx.filter(t => t.status === "success");
    const total = succ.reduce((a,b) => a + (b.amount||0), 0);
    const pend = tx.filter(t => t.status === "pending" || t.status === "processing");

    $("#stats", root).innerHTML = `
      <div class="card">
        <div class="g2">
          <div>
            <div class="hint">Pengguna</div>

            <div style="font-size:24px;font-weight:800;letter-spacing:-.5px">${tx.length}</div>
          </div>
        </div>
        <div class="kv mt"><span>Sukses</span><span>${succ.length}</span></div>
        <div class="kv"><span>Pending</span><span>${pend.length}</span></div>
        <div class="kv"><span>Gagal</span><span>${tx.filter(t=>t.status==="failed").length}</span></div>
        <div class="kv"><span>Total Nilai Sukses</span><span>${rp(total)}</span></div>
      </div>`;

    $("#pending", root).innerHTML = pend.length
      ? `<div class="list">${pend.slice(0,8).map(t => `
          <button class="item" data-tx="${esc(t.transactionId||"")}" type="button">
            <div class="item__ico pending">${ic("clock",18)}</div>
            <div class="item__body">
              <div class="item__t">${esc(TX_LABEL[t.transactionType]||t.transactionType||"—")}</div>

            </div>
            <div class="item__amt out">${rp(t.amount||0)}</div>
          </button>`).join("")}</div>`
      : emptyState("check", "Tidak ada pending", "Semua permintaan telah diproses.");

    // recent users
    const users = []; uSnap.forEach(c => users.push({ uid: c.key, ...c.val() }));
    users.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    $("#users", root).innerHTML = users.length
      ? `<div class="list">${users.slice(0,8).map(u => `
          <div class="item item--no-interact">
            <div class="item__ico brand">${ic("user",18)}</div>
            <div class="item__body">
              <div class="item__t">${esc(u.displayName||"—")}</div>
              <div class="item__s">ID ${esc(u.accountId||"—")} · ${esc(fdate(u.createdAt))}</div>

            <span class="bdg ${u.accountStatus==='active'?'ok':'warn'}">${esc(u.accountStatus||"—")}</span>
          </div>`).join("")}</div>`
      : emptyState("user", "Belum ada pengguna", "Data pengguna akan muncul di sini.");

    $$("[data-tx]", root).forEach(el => el.onclick = () => showTxDetail(el.dataset.tx));
  } catch(e){
    $("#stats", root).innerHTML = errState(errMsg(e.code, e.message), "retryAd");
    $("#retryAd", root)?.addEventListener("click", () => renderRoute());
  }
