<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader Tanpa Watermark</title>
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #ff0050;
            margin-bottom: 5px;
        }

        .input-group {
            display: flex;
            margin-top: 20px;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        button {
            background-color: #00f2fe;
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #00d2de;
        }

        .hidden {
            display: none !important;
        }

        #loading {
            margin-top: 20px;
            color: #555;
            font-style: italic;
        }

        #result {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn {
            text-decoration: none;
            background-color: #ff0050;
            color: white;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #cc0040;
        }

        .btn-audio {
            background-color: #333;
        }

        .btn-audio:hover {
            background-color: #111;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Downloader</h1>
        <p>Unduh video TikTok & musik tanpa watermark!</p>
        
        <div class="input-group">
            <input type="text" id="tiktokUrl" placeholder="Tempel tautan video TikTok di sini...">
            <button id="downloadBtn" onclick="fetchVideo()">Cari Video</button>
        </div>

        <div id="loading" class="hidden">Memproses tautan...</div>

        <div id="result" class="hidden">
            <h3 id="videoTitle">Judul Video</h3>
            <img id="videoThumbnail" src="" alt="Thumbnail" width="200" style="border-radius: 8px;">
            <div class="download-buttons">
                <a id="btnNoWatermark" href="#" target="_blank" class="btn">Unduh Video (No Watermark)</a>
                <a id="btnAudio" href="#" target="_blank" class="btn btn-audio">Unduh Audio (MP3)</a>
            </div>
        </div>
    </div>

    <script>
        async function fetchVideo() {
            const urlInput = document.getElementById('tiktokUrl').value;
            const loadingDiv = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            
            if (!urlInput) {
                alert("Silakan masukkan tautan TikTok terlebih dahulu!");
                return;
            }

            // Tampilkan tulisan loading, sembunyikan hasil sebelumnya
            loadingDiv.classList.remove('hidden');
            resultDiv.classList.add('hidden');

            try {
                // Menggunakan API pihak ketiga gratis (tikwm)
                const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}&count=12&cursor=0&web=1&hd=1`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.code === 0) {
                    // Jika sukses mendapatkan data dari API
                    document.getElementById('videoTitle').textContent = data.data.title;
                    document.getElementById('videoThumbnail').src = data.data.cover;
                    
                    // Setel tautan ke tombol unduhan
                    document.getElementById('btnNoWatermark').href = data.data.play;
                    document.getElementById('btnAudio').href = data.data.music;

                    // Sembunyikan loading, tampilkan menu hasil
                    loadingDiv.classList.add('hidden');
                    resultDiv.classList.remove('hidden');
                } else {
                    alert("Video tidak ditemukan. Pastikan tautan yang dimasukkan benar.");
                    loadingDiv.classList.add('hidden');
                }

            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan jaringan atau API sedang sibuk.");
                loadingDiv.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
