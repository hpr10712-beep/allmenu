<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Menu</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Orbitron',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  overflow:hidden;
}

/* GALAXY BACKGROUND */
canvas{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none; /* FIX AGAR BISA DIKLIK */
}

/* CONTAINER */
.container{
  position:relative;
  z-index:2;
  padding:35px 25px;
  border-radius:18px;
  text-align:center;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 0 25px rgba(0,0,0,0.8);
}

/* JUDUL */
.title{
  margin-bottom:25px;
  padding:12px;
  border-radius:10px;
  background:url('https://i.ibb.co.com/KxZVC74M/ac92cb77-ceff-431e-b60e-c869f8db130f.jpg') center/cover no-repeat;
  position:relative;
}

.title::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
  border-radius:10px;
}

.title h1{
  position:relative;
  color:white;
  font-size:26px;
  letter-spacing:2px;
  text-shadow:0 0 10px #00c6ff;
}

/* MENU */
.menu{
  display:flex;
  flex-direction:column;
  gap:15px;
  align-items:center;
}

/* TOMBOL */
.btn{
  width:200px;
  padding:13px;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  color:white;
  transition:0.25s;
}

/* HITUNG */
.hitung{
  background:linear-gradient(135deg,#00c6ff,#0072ff);
}

.hitung:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00c6ff;
}

/* BERITA */
.berita{
  background:linear-gradient(135deg,#ff512f,#dd2476);
}

.berita:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #ff512f;
}

/* RESPONSIVE */
@media(max-width:500px){
  .btn{
    width:170px;
    font-size:13px;
  }
  .title h1{
    font-size:20px;
  }
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">
  <div class="title">
    <h1>ELITE MENU</h1>
  </div>

  <div class="menu">
    <button class="btn hitung" onclick="goHitung()">KONTAK ADMIN</button>
    <button class="btn berita" onclick="goBerita()">GRUB JUAL BELI ALL GAME</button>
  </div>
</div>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

window.addEventListener("resize", resize);

/* BINTANG HALUS */
let stars = [];
for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*2,
    speed:Math.random()*0.5 + 0.2
  });
}

function draw(){
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let s of stars){
    s.y += s.speed;

    if(s.y > canvas.height){
      s.y = 0;
      s.x = Math.random()*canvas.width;
    }

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fillStyle = "white";
    ctx.fill();
  }
}

setInterval(draw, 30);

/* NAVIGASI */
function goHitung(){
  window.location.href = "WA.me/+6289603266259";
}

function goBerita(){
  window.location.href = "https://chat.whatsapp.com/KVaUU5idphtBVqKDMvbltx?mode=gi_t";
}
</script>

</body>
</html>
