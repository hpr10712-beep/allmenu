<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LINKORA — Satu halaman untuk semua tautanmu</title>
<meta name="description" content="LINKORA adalah platform link-in-bio profesional untuk kreator, bisnis, dan personal branding." />
<meta name="theme-color" content="#0b0c10" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%2322D3EE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 32h24M32 20v24' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

<style>
:root{
  --bg:#0b0c10; --bg-2:#0f1117; --surface:#151823; --surface-2:#1b1f2c;
  --border:#252a3a; --text:#e8ecf3; --muted:#98a2b3;
  --brand:#7C5CFF; --brand-2:#22D3EE; --brand-ink:#0b0c10;
  --danger:#ef4444; --success:#22c55e; --warn:#f59e0b;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:26px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Space Grotesk", var(--font);
}
:root.light{
  --bg:#f7f8fb; --bg-2:#ffffff; --surface:#ffffff; --surface-2:#f1f3f9;
  --border:#e4e7ee; --text:#0b0c10; --muted:#5b6473;
  --shadow:0 10px 30px rgba(20,20,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

.container{max-width:1180px;margin:0 auto;padding:0 20px}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1}

.nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(140%) blur(12px);background:color-mix(in oklab, var(--bg) 82%, transparent);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.nav-links{display:flex;gap:22px;align-items:center}
.nav-links a{color:var(--muted);font-size:14px;font-weight:500}
.nav-links a:hover{color:var(--text)}
@media(max-width:820px){.nav-links{display:none}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:var(--r-md);font-weight:600;font-size:14px;transition:.18s transform,.18s background,.18s border}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border:1px solid var(--border);color:var(--text);background:var(--surface)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.btn-danger:hover{background:rgba(239,68,68,.18)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card-2{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px}
.grid{display:grid;gap:18px}
@media(min-width:760px){.grid.cols-3{grid-template-columns:repeat(3,1fr)}.grid.cols-2{grid-template-columns:repeat(2,1fr)}.grid.cols-4{grid-template-columns:repeat(4,1fr)}}

.hero{padding:80px 20px 60px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20% -10% auto -10%;height:520px;background:radial-gradient(60% 60% at 20% 20%, color-mix(in oklab, var(--brand) 45%, transparent), transparent 70%),radial-gradient(60% 60% at 80% 30%, color-mix(in oklab, var(--brand-2) 35%, transparent), transparent 70%);filter:blur(60px);opacity:.5;z-index:-1}
.hero h1{font-family:var(--font-display);font-size:clamp(32px,6vw,58px);line-height:1.05;margin:0 0 16px;letter-spacing:-.02em}
.grad-text{background:linear-gradient(135deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lede{font-size:18px;color:var(--muted);max-width:640px;margin:0 auto 26px}
.hero-inner{max-width:820px;margin:0 auto;text-align:center}

.app-shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(max-width:900px){.app-shell{grid-template-columns:1fr}}
.sidebar{background:var(--bg-2);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:900px){.sidebar{position:fixed;inset:0 auto 0 0;width:250px;transform:translateX(-100%);transition:.25s;z-index:60}.sidebar.open{transform:none}}
.sidebar h4{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:16px 12px 8px}
.side-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:500}
.side-item:hover{background:var(--surface);color:var(--text)}
.side-item.active{background:linear-gradient(135deg, color-mix(in oklab, var(--brand) 30%, transparent), color-mix(in oklab, var(--brand-2) 20%, transparent));color:var(--text)}
.side-icon{width:18px;height:18px;flex:none}
.main{padding:26px 26px 80px;max-width:1100px}
@media(max-width:600px){.main{padding:18px 14px 90px}}
.page-title{font-family:var(--font-display);font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.page-sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.mobile-bar{display:none;position:sticky;top:0;z-index:40;background:var(--bg-2);border-bottom:1px solid var(--border);padding:12px 14px;align-items:center;gap:12px}
@media(max-width:900px){.mobile-bar{display:flex}}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
.scrim.show{display:block}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,.textarea,.select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:14px;transition:.15s border, .15s box-shadow;width:100%}
.input:focus,.textarea:focus,.select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in oklab, var(--brand) 25%, transparent)}
.textarea{min-height:90px;resize:vertical}
.error{color:#fca5a5;font-size:12.5px;margin-top:4px}
.hint{color:var(--muted);font-size:12px}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px;box-shadow:var(--shadow)}

.link-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;margin-bottom:10px}
.link-row.dragging{opacity:.5}
.drag-handle{cursor:grab;color:var(--muted);padding:6px;border-radius:6px}
.drag-handle:hover{background:var(--surface-2);color:var(--text)}
.toggle{position:relative;width:38px;height:22px;background:var(--border);border-radius:999px;transition:.2s;flex:none;cursor:pointer}
.toggle.on{background:var(--brand)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on::after{left:19px}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.badge-info{background:color-mix(in oklab, var(--brand) 20%, transparent);color:#c4b5fd}
.badge-success{background:rgba(34,197,94,.15);color:#86efac}
.badge-warn{background:rgba(245,158,11,.15);color:#fcd34d}
.badge-danger{background:rgba(239,68,68,.15);color:#fca5a5}
.badge-muted{background:var(--surface-2);color:var(--muted)}

.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:100;max-width:340px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);animation:slidein .25s}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:200;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:26px;max-width:440px;width:100%;box-shadow:var(--shadow)}

.pf-wrap{min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.pf-card{width:100%;max-width:520px}
.pf-name{font-family:var(--font-display);font-size:24px;text-align:center;margin:0 0 6px}
.pf-bio{text-align:center;opacity:.85;margin:0 0 26px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.pf-links{display:flex;flex-direction:column;gap:14px}
.pf-link{display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 18px;font-weight:600;transition:.18s transform,.18s filter;text-decoration:none}
.pf-link:hover{transform:translateY(-2px);filter:brightness(1.08)}
.pf-footer{text-align:center;margin-top:36px;font-size:12px;opacity:.6}

.sk{background:linear-gradient(90deg,var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:8px;height:14px;margin:6px 0}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

.kpi{padding:18px;border-radius:var(--r-md);background:linear-gradient(180deg, var(--surface-2), var(--surface));border:1px solid var(--border)}
.kpi .k{font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.kpi .v{font-family:var(--font-display);font-size:28px;margin-top:6px}

.preview-shell{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;min-height:560px;display:flex;justify-content:center}
.preview-frame{width:100%;max-width:380px;border-radius:22px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.35);border:8px solid #0f1117;background:#fff;color:#111;height:640px;overflow-y:auto;position:relative}

.section{padding:60px 0}
.section h2{font-family:var(--font-display);font-size:32px;margin:0 0 8px;text-align:center;letter-spacing:-.01em}
.section .sub{text-align:center;color:var(--muted);margin:0 auto 36px;max-width:620px}
.feature{padding:22px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);transition:.2s transform}
.feature:hover{transform:translateY(-3px)}
.feature h3{margin:0 0 8px;font-size:16px}
.feature p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.footer{border-top:1px solid var(--border);padding:36px 0;color:var(--muted);font-size:14px}
.footer-grid{display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:700px){.footer-grid{grid-template-columns:2fr 1fr 1fr 1fr}}
.footer h5{color:var(--text);margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.footer a{display:block;margin:6px 0;color:var(--muted)}
.footer a:hover{color:var(--text)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tab{padding:11px 14px;color:var(--muted);font-weight:500;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--brand)}
.empty{text-align:center;padding:48px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--r-md)}
</style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>

  <script type="module">
  /* ================================================================
     LINKORA — single file app
     ================================================================ */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
    sendEmailVerification, sendPasswordResetEmail, onAuthStateChanged, deleteUser
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getDatabase, ref, get, set, update, remove, push, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  /* -------------------- Firebase init -------------------- */
  const firebaseConfig = {
    apiKey: "AIzaSyBEPzUM9EresZ-yvphzDusVs7AUqdLuCNQ",
    authDomain: "mygame-68b24.firebaseapp.com",
    databaseURL: "https://mygame-68b24-default-rtdb.firebaseio.com",
    projectId: "mygame-68b24",
    storageBucket: "mygame-68b24.firebasestorage.app",
    messagingSenderId: "1003182873390",
    appId: "1:1003182873390:web:aabf3248f759cbc9d678bf",
    measurementId: "G-4C0MYZ19YW"
  };
  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getDatabase(fbApp);

  /* -------------------- Constants -------------------- */
  const RESERVED = new Set([
    "admin","api","login","register","dashboard","settings","help","about",
    "privacy","terms","pricing","features","templates","u","assets","static",
    "support","contact","blog","docs","null","undefined","root","system"
  ]);
  const USERNAME_RE = /^[a-z0-9_]{3,20}$/;
  const ALLOWED_SCHEMES = /^(https?:|mailto:|tel:)/i;

  /* -------------------- State -------------------- */
  const state = { user:null, userData:null, profile:null, page:null, route:"" };

  /* -------------------- Utilities -------------------- */
  const $  = (s, r=document) => r.querySelector(s);
  const esc = (s="") => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const todayKey = () => new Date().toISOString().slice(0,10);

  function toast(msg, type="info", ttl=3600){
    const t = el(`<div class="toast ${type}" role="alert"><div>${esc(msg)}</div></div>`);
    $("#toasts").appendChild(t);
    setTimeout(()=>{ t.style.opacity="0"; t.style.transition=".3s"; setTimeout(()=>t.remove(),320); }, ttl);
  }
  function modal({title, body, confirmText="Konfirmasi", danger=false, onConfirm}){
    const bg = el(`<div class="modal-bg" role="dialog" aria-modal="true">
      <div class="modal">
        <h3 style="margin:0 0 8px">${esc(title)}</h3>
        <div style="color:var(--muted);font-size:14px;line-height:1.55">${body}</div>
        <div class="row" style="justify-content:flex-end;margin-top:22px">
          <button class="btn btn-ghost" data-act="cancel">Batal</button>
          <button class="btn ${danger?"btn-danger":"btn-primary"}" data-act="ok">${esc(confirmText)}</button>
        </div>
      </div></div>`);
    $("#modal-root").appendChild(bg);
    const close = () => bg.remove();
    bg.querySelector('[data-act="cancel"]').onclick = close;
    bg.querySelector('[data-act="ok"]').onclick = () => { onConfirm?.(); close(); };
    bg.addEventListener("click", e => { if(e.target === bg) close(); });
  }
  function debounce(fn, ms=300){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
  function validUrl(u){
    if(!u || typeof u !== "string") return false;
    if(!ALLOWED_SCHEMES.test(u)) return false;
    try { const x = new URL(u); return ["http:","https:","mailto:","tel:"].includes(x.protocol); }
    catch{ return false; }
  }

  /* -------------------- Router -------------------- */
  function go(p){ location.hash = "#" + p; }
  function currentPath(){ return (location.hash || "#/").slice(1) || "/"; }
  function mount(html){
    const app = $("#app"); app.innerHTML = ""; app.appendChild(el(html));
  }

  function onRoute(){
    const path = currentPath();
    state.route = path;
    const parts = path.split("/").filter(Boolean);

    if(parts[0] === "u" && parts[1]) return renderPublicProfile(parts[1]);

    switch(path){
      case "/":                     return renderLanding();
      case "/login":                return renderAuth("login");
      case "/register":             return renderAuth("register");
      case "/forgot":               return renderAuth("forgot");
      case "/dashboard":            return guardDash(() => renderDashOverview());
      case "/dashboard/links":      return guardDash(() => renderDashLinks());
      case "/dashboard/appearance": return guardDash(() => renderDashAppearance());
      case "/dashboard/analytics":  return guardDash(() => renderDashAnalytics());
      case "/dashboard/qr":         return guardDash(() => renderDashQR());
      case "/dashboard/settings":   return guardDash(() => renderDashSettings());
      case "/admin":                return guardAdmin(() => renderAdmin());
      default:                      return render404();
    }
  }

  async function guardDash(fn){
    if(!state.user){ go("/login"); return; }
    if(!state.profile?.username) return renderClaimUsername();
    await ensurePage();
    fn();
  }
  async function guardAdmin(fn){
    if(!state.user){ go("/login"); return; }
    const role = state.userData?.role;
    if(role !== "admin" && role !== "superadmin") return renderForbidden();
    fn();
  }

  /* -------------------- Data -------------------- */
  async function loadUserData(uid){
    try{
      const [uSnap, pSnap, pgSnap] = await Promise.all([
        get(ref(db, `users/${uid}`)),
        get(ref(db, `profiles/${uid}`)),
        get(ref(db, `pages/${uid}`))
      ]);
      state.userData = uSnap.val() || null;
      state.profile  = pSnap.val() || null;
      state.page     = pgSnap.val() || null;
    }catch(e){ console.warn(e); }
  }
  async function ensurePage(){
    if(state.page) return state.page;
    const uid = state.user.uid;
    const blank = { theme: defaultTheme(), links:{}, published:false, createdAt:Date.now(), updatedAt:Date.now() };
    await set(ref(db, `pages/${uid}`), blank);
    state.page = blank;
    return blank;
  }
  function defaultTheme(){
    return {
      bg: "linear-gradient(135deg,#0f172a,#1e293b)",
      text: "#e8ecf3",
      btnBg: "rgba(255,255,255,.10)",
      btnText: "#ffffff",
      btnBorder: "rgba(255,255,255,.18)",
      btnRadius: 14,
      btnHeight: 56,
      gap: 14,
      font: "Inter",
      shadow: "0 10px 24px rgba(0,0,0,.25)"
    };
  }
  async function claimUsername(rawName){
    const name = String(rawName || "").trim().toLowerCase();
    if(!USERNAME_RE.test(name)) throw new Error("Username hanya boleh huruf kecil, angka, dan _ (3–20 karakter).");
    if(RESERVED.has(name)) throw new Error("Username tersebut tidak tersedia.");
    const uid = state.user.uid;

    const unameRef = ref(db, `usernames/${name}`);
    const result = await runTransaction(unameRef, cur => {
      if(cur && cur.uid !== uid) return;
      return { uid };
    });
    if(!result.committed) throw new Error("Username sudah digunakan.");

    const oldName = state.profile?.username;
    if(oldName && oldName !== name){
      try{ await remove(ref(db, `usernames/${oldName}`)); }catch{}
    }
    await update(ref(db), {
      [`profiles/${uid}/username`]: name,
      [`profiles/${uid}/displayName`]: state.profile?.displayName || name
    });
    state.profile = { ...(state.profile||{}), username: name, displayName: state.profile?.displayName || name };
  }

  /* -------------------- Nav -------------------- */
  function topNav(){
    const authed = !!state.user;
    return `
    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>LINKORA</span>
        </a>
        <nav class="nav-links" aria-label="Navigasi utama">
          <a href="#/">Beranda</a>
          <a href="#/#features">Fitur</a>
          <a href="#/#templates">Template</a>
        </nav>
        <div class="row">
          ${authed
            ? `<a class="btn btn-ghost btn-sm" href="#/dashboard">Dashboard</a>
               <button class="btn btn-primary btn-sm" data-act="logout">Logout</button>`
            : `<a class="btn btn-ghost btn-sm" href="#/login">Masuk</a>
               <a class="btn btn-primary btn-sm" href="#/register">Mulai gratis</a>`}
        </div>
      </div>
    </header>`;
  }
  function bindTopNav(root=document){
    root.querySelector('[data-act="logout"]')?.addEventListener("click", async () => {
      await signOut(auth); toast("Kamu telah keluar."); go("/");
    });
  }

  /* -------------------- Auth -------------------- */
  function renderAuth(kind){
    const titles = {
      login:["Masuk ke akunmu","Kelola halamanmu"],
      register:["Buat akun LINKORA","Gratis, tanpa kartu kredit"],
      forgot:["Lupa password","Kami akan mengirim tautan reset"]
    };
    const [t, s] = titles[kind];
    mount(`
      <div class="auth-wrap">
        <div class="auth-card">
          <a class="brand" href="#/" style="margin-bottom:22px">
            <span class="brand-mark"></span><span>LINKORA</span>
          </a>
          <h2 style="font-family:var(--font-display);margin:0 0 4px">${t}</h2>
          <p style="color:var(--muted);margin:0 0 22px;font-size:14px">${s}</p>

          ${kind === "forgot" ? `
            <form id="f">
              <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" required autocomplete="email" /></div>
              <div id="err" class="error" hidden></div>
              <button class="btn btn-primary" style="width:100%;justify-content:center" type="submit">Kirim tautan reset</button>
            </form>` : `
            <form id="f">
              <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" required autocomplete="email" /></div>
              <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" required minlength="6" autocomplete="${kind==="register"?"new-password":"current-password"}" /></div>
              <div id="err" class="error" hidden></div>
              <button class="btn btn-primary" style="width:100%;justify-content:center" type="submit">${kind==="register"?"Buat akun":"Masuk"}</button>
            </form>
          `}

          <div style="margin-top:20px;font-size:13.5px;color:var(--muted);text-align:center">
            ${kind==="login" ? `Belum punya akun? <a href="#/register" style="color:var(--brand)">Daftar</a><br><a href="#/forgot" style="color:var(--muted)">Lupa password?</a>` : ""}
            ${kind==="register" ? `Sudah punya akun? <a href="#/login" style="color:var(--brand)">Masuk</a>` : ""}
            ${kind==="forgot" ? `<a href="#/login" style="color:var(--brand)">Kembali ke login</a>` : ""}
          </div>
        </div>
      </div>
    `);

    const form = $("#f");
    form?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = $("#err"); errEl.hidden = true;
      const email = $("#email").value.trim();
      const pw = $("#pw")?.value || "";
      try{
        if(kind === "forgot"){
          await sendPasswordResetEmail(auth, email);
          toast("Tautan reset telah dikirim. Cek kotak masuk emailmu.","success");
          go("/login");
        } else if(kind === "register"){
          if(pw.length < 6) throw new Error("Password minimal 6 karakter.");
          const cred = await createUserWithEmailAndPassword(auth, email, pw);
          await set(ref(db, `users/${cred.user.uid}`), {
            uid: cred.user.uid, email, role: "user", createdAt: Date.now()
          });
          try{ await sendEmailVerification(cred.user); }catch{}
          toast("Akun berhasil dibuat. Cek email untuk verifikasi.","success",6000);
          go("/dashboard");
        } else {
          await signInWithEmailAndPassword(auth, email, pw);
          toast("Berhasil masuk.","success");
          go("/dashboard");
        }
      }catch(err){
        errEl.textContent = friendlyAuthError(err);
        errEl.hidden = false;
      }
    });
  }
  function friendlyAuthError(err){
    const m = (err?.code || err?.message || "").toString();
    const map = {
      "auth/email-already-in-use": "Email sudah terdaftar.",
      "auth/invalid-email": "Format email tidak valid.",
      "auth/weak-password": "Password terlalu lemah (min 6 karakter).",
      "auth/user-not-found": "Akun tidak ditemukan.",
      "auth/wrong-password": "Password salah.",
      "auth/invalid-credential": "Email atau password salah.",
      "auth/too-many-requests": "Terlalu banyak percobaan. Coba lagi nanti."
    };
    for(const k in map) if(m.includes(k)) return map[k];
    return err?.message || "Terjadi kesalahan. Coba lagi.";
  }

  /* -------------------- Links -------------------- */
  async function renderDashLinks(){
    mount(dashShell("/dashboard/links", "Kelola Tautan", "Tambah, ubah urutan, aktifkan, atau hapus tautan.", `
      <div class="spread" style="margin-bottom:16px">
        <div class="row">
          <button class="btn btn-primary" data-act="add">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            Tambah Tautan
          </button>
        </div>
        <input class="input" id="search" placeholder="Cari tautan…" style="max-width:240px" />
      </div>
      <div id="list"></div>
    `));
    bindShell();
    const uid = state.user.uid;
    const render = (filter="") => {
      const links = Object.entries(state.page?.links || {})
        .map(([id,l]) => ({ id, ...l }))
        .filter(l => !filter || (l.title||"").toLowerCase().includes(filter.toLowerCase()))
        .sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
      const list = $("#list");
      if(!links.length){
        list.innerHTML = `<div class="empty">Belum ada tautan. Klik <b>Tambah Tautan</b> untuk memulai.</div>`;
        return;
      }
      list.innerHTML = links.map(l => `
        <div class="link-row" draggable="true" data-id="${l.id}">
          <div class="drag-handle" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
          </div>
          <div>
            <div style="font-weight:600">${esc(l.title||"(tanpa judul)")}</div>
            <div style="color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px">${esc(l.url||"")}</div>
          </div>
          <div class="row">
            <div class="toggle ${l.active!==false?"on":""}" role="switch" aria-checked="${l.active!==false}" tabindex="0" data-act="toggle" data-id="${l.id}"></div>
            <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${l.id}">Edit</button>
            <button class="btn btn-danger btn-sm" data-act="del" data-id="${l.id}">Hapus</button>
          </div>
        </div>`).join("");

      list.querySelectorAll('[data-act="edit"]').forEach(b => b.onclick = () => openLinkEditor(b.dataset.id));
      list.querySelectorAll('[data-act="del"]').forEach(b => b.onclick = () => {
        modal({ title:"Hapus tautan?", body:"Tindakan ini tidak dapat dibatalkan.", danger:true, confirmText:"Hapus", onConfirm: async () => {
          try{ await remove(ref(db, `pages/${uid}/links/${b.dataset.id}`)); delete state.page.links[b.dataset.id]; toast("Tautan dihapus.","success"); render($("#search").value); }
          catch(e){ toast("Gagal menghapus: " + e.message, "error"); }
        }});
      });
      list.querySelectorAll('[data-act="toggle"]').forEach(t => {
        const fn = async () => {
          const id = t.dataset.id;
          const cur = state.page.links[id].active !== false;
          try{
            await update(ref(db, `pages/${uid}/links/${id}`), { active: !cur, updatedAt: Date.now() });
            state.page.links[id].active = !cur;
            t.classList.toggle("on"); t.setAttribute("aria-checked", String(!cur));
          }catch(e){ toast("Gagal: " + e.message, "error"); }
        };
        t.onclick = fn;
        t.onkeydown = e => { if(e.key===" "||e.key==="Enter"){ e.preventDefault(); fn(); } };
      });

      let dragId = null;
      list.querySelectorAll(".link-row").forEach(row => {
        row.addEventListener("dragstart", e => { dragId = row.dataset.id; row.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
        row.addEventListener("dragend", () => { row.classList.remove("dragging"); dragId = null; });
        row.addEventListener("dragover", e => e.preventDefault());
        row.addEventListener("drop", async e => {
          e.preventDefault();
          const targetId = row.dataset.id;
          if(!dragId || dragId === targetId) return;
          const entries = Object.entries(state.page.links).sort((a,b)=>(a[1].order??0)-(b[1].order??0));
          const ids = entries.map(([id])=>id);
          const fromIdx = ids.indexOf(dragId), toIdx = ids.indexOf(targetId);
          ids.splice(toIdx, 0, ids.splice(fromIdx,1)[0]);
          const updates = {}; ids.forEach((id,i)=>{ updates[`pages/${uid}/links/${id}/order`] = i; });
          try{
            await update(ref(db), updates);
            ids.forEach((id,i)=>{ state.page.links[id].order = i; });
            render($("#search").value);
          }catch(err){ toast("Gagal menyimpan urutan: " + err.message, "error"); }
        });
      });
    };
    render();

    $("#search").addEventListener("input", debounce(e => render(e.target.value), 150));
    $('[data-act="add"]').onclick = () => openLinkEditor();
  }

  function openLinkEditor(id){
    const uid = state.user.uid;
    const existing = id ? state.page.links[id] : null;
    const bg = el(`<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal" style="max-width:520px">
      <h3 style="margin:0 0 16px">${id?"Edit":"Tambah"} Tautan</h3>
      <form id="lf">
        <div class="field"><label for="lt">Judul</label><input class="input" id="lt" maxlength="120" required value="${esc(existing?.title||"")}" /></div>
        <div class="field"><label for="lu">URL Tujuan</label><input class="input" id="lu" type="url" required placeholder="https://" value="${esc(existing?.url||"")}" /></div>

          <button class="btn btn-ghost" type="button" data-act="cancel">Batal</button>
          <button class="btn btn-primary" type="submit">${id?"Simpan":"Tambah"}</button>
        </div>
      </form>
    </div></div>`);
    $("#modal-root").appendChild(bg);
    const close = () => bg.remove();
    bg.querySelector('[data-act="cancel"]').onclick = close;
    bg.querySelector("#lf").addEventListener("submit", async e => {
      e.preventDefault();
      const err = bg.querySelector("#err"); err.hidden = true;
      const url = bg.querySelector("#lu").value.trim();
      if(!validUrl(url)){ err.textContent = "URL tidak valid. Hanya http://, https://, mailto:, dan tel: yang diizinkan."; err.hidden = false; return; }
      const payload = {
        title: bg.querySelector("#lt").value.trim(),
        url,
        description: bg.querySelector("#ld").value.trim(),
        active: existing?.active !== false,
        updatedAt: Date.now()
      };
      try{
        if(id){
          await update(ref(db, `pages/${uid}/links/${id}`), payload);
          Object.assign(state.page.links[id], payload);
        }else{
          const order = Object.keys(state.page.links||{}).length;
          payload.order = order; payload.createdAt = Date.now();
          const r = push(ref(db, `pages/${uid}/links`));
          await set(r, payload);
          state.page.links = state.page.links || {};
          state.page.links[r.key] = payload;
        }
        toast("Tautan disimpan.","success");
        close();
        renderDashLinks();
      }catch(e){ err.textContent = e.message; err.hidden = false; }
    });
  }

  /* -------------------- Analytics -------------------- */
  async function renderDashAnalytics(){
    mount(dashShell("/dashboard/analytics", "Analytics", "Statistik dicatat dari event nyata — kunjungan halaman dan klik tautan.", `
      <div class="card">
        <h3 style="margin:0 0 14px">7 hari terakhir</h3>
        <div id="chart" style="min-height:180px"></div>
      </div>
      <div class="card" style="margin-top:22px">
        <h3 style="margin:0 0 14px">Tautan terpopuler (30 hari)</h3>
        <div id="top-links"><div class="sk" style="height:36px;margin-bottom:8px"></div><div class="sk" style="height:36px"></div></div>
      </div>
      <p class="hint" style="margin-top:16px">
        Catatan: Statistik ini menghitung <b>event yang tercatat</b> saat halaman dimuat / tautan diklik.
        Metrik "unique visitor" tidak ditampilkan karena kami tidak menyimpan identitas pengunjung (tidak ada IP mentah disimpan).
      </p>
    `));
    bindShell();
    const uid = state.user.uid;
    try{
      const snap = await get(ref(db, `analyticsAggregates/${uid}/daily`));
      const data = snap.val() || {};
      const days = [];
      for(let i=6;i>=0;i--){
        const d = new Date(); d.setDate(d.getDate()-i);
        const key = d.toISOString().slice(0,10);
        days.push({
          key,
          label: d.toLocaleDateString("id-ID",{weekday:"short"}),
          views: data[key]?.views||0,
          clicks: Object.values(data[key]?.clicks||{}).reduce((a,b)=>a+b,0)
        });
      }
      const max = Math.max(1, ...days.map(d=>d.views));
      $("#chart").innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:170px">
          ${days.map(d => `
            <div style="display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end">
              <div title="${d.views} kunjungan" style="width:100%;height:${Math.round(d.views/max*120)}px;min-height:4px;background:linear-gradient(180deg,var(--brand),var(--brand-2));border-radius:8px 8px 0 0"></div>
              <div style="font-size:11px;color:var(--muted)">${d.label}</div>
              <div style="font-size:11px">${d.views}</div>
            </div>`).join("")}
        </div>`;

      const linkClicks = {};
      for(let i=0;i<30;i++){
        const d = new Date(); d.setDate(d.getDate()-i);
        const key = d.toISOString().slice(0,10);
        const clicks = data[key]?.clicks || {};
        for(const [lid,c] of Object.entries(clicks)) linkClicks[lid] = (linkClicks[lid]||0) + (c||0);
      }
      const links = state.page?.links || {};
      const ranked = Object.entries(linkClicks)
        .map(([lid,c]) => ({ id:lid, title: links[lid]?.title||"(dihapus)", clicks:c }))
        .sort((a,b)=>b.clicks-a.clicks)
        .slice(0,8);
      $("#top-links").innerHTML = ranked.length
        ? ranked.map(r=>`<div class="spread" style="padding:10px 0;border-bottom:1px solid var(--border)"><span>${esc(r.title)}</span><b>${r.clicks}</b></div>`).join("")
        : `<div class="empty">Belum ada klik tercatat.</div>`;
    }catch(e){
      $("#chart").innerHTML = `<div class="empty">Gagal memuat data: ${esc(e.message)}</div>`;
      $("#top-links").innerHTML = "";
    }
  }

      if(!window.QRCode) return toast("Pustaka QR belum siap, coba lagi.", "error");
      window.QRCode.toCanvas(canvas, url, {
        width: +$("#q-size").value || 320,
        margin: 2,

      }, err => { if(err) toast("Gagal membuat QR: " + err.message, "error"); });
    };
    // tunggu pustaka QR siap
    const waitQR = setInterval(() => {
      if(window.QRCode){ clearInterval(waitQR); gen(); }
    }, 100);
    setTimeout(() => clearInterval(waitQR), 5000);

    $('[data-act="gen"]').onclick = gen;
    $('[data-act="dl"]').onclick = () => {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");

      catch{ toast("Gagal menyalin.","error"); }
    };
  }

        try{
          await Promise.all([
            runTransaction(ref(db, `analyticsAggregates/${uid}/daily/${day}/clicks/${lid}`), v => (v||0)+1),
            runTransaction(ref(db, `analyticsAggregates/${uid}/totals/clicks`), v => (v||0)+1)
          ]);
        }catch{}
      }));
    }catch(e){
      renderProfileError("Terjadi kesalahan", e.message);
    }
  }
  function renderProfileError(title, msg){
    mount(`
      <div class="pf-wrap">
        <div class="pf-card" style="text-align:center;padding-top:80px">
          <h1 style="font-family:var(--font-display);font-size:26px">${esc(title)}</h1>
          <p style="color:var(--muted);margin:12px 0 24px">${esc(msg)}</p>
          <a class="btn btn-primary" href="#/">Kembali ke LINKORA</a>
        </div>
      </div>`);
  }

  /* -------------------- Error pages -------------------- */
  function render404(){
    mount(`${topNav()}
      <div class="container" style="text-align:center;padding:100px 20px">
        <div style="font-family:var(--font-display);font-size:80px;font-weight:700" class="grad-text">404</div>
        <h1 style="font-family:var(--font-display);margin:0 0 10px">Halaman tidak ditemukan</h1>
        <p style="color:var(--muted);margin:0 0 24px">Tautan yang kamu buka tidak ada atau sudah dipindahkan.</p>
        <a class="btn btn-primary" href="#/">Kembali ke beranda</a>
      </div>`);
    bindTopNav();
  }
  function renderForbidden(){
    mount(`${topNav()}
      <div class="container" style="text-align:center;padding:100px 20px">
        <div style="font-family:var(--font-display);font-size:80px;font-weight:700" class="grad-text">403</div>
        <h1 style="font-family:var(--font-display);margin:0 0 10px">Akses ditolak</h1>
        <p style="color:var(--muted);margin:0 0 24px">Kamu tidak memiliki izin untuk membuka halaman ini.</p>
        <a class="btn btn-primary" href="#/dashboard">Kembali ke dashboard</a>
      </div>`);
    bindTopNav();
  }

  /* -------------------- Theme init -------------------- */
  (function initTheme(){
    const prefers = matchMedia("(prefers-color-scheme: light)").matches;
    if(prefers) document.documentElement.classList.add("light");
  })();

  /* -------------------- Boot -------------------- */
  window.addEventListener("hashchange", onRoute);
  onAuthStateChanged(auth, async (user) => {
    state.user = user;
    if(user){ await loadUserData(user.uid); }
    else { state.userData = null; state.profile = null; state.page = null; }
    onRoute();
  });
  </script>
</body>
</html>
