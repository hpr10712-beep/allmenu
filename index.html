<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV AI Pro</title>
    <!-- TensorFlow & COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
            color: #c9d1d9;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #161b22;
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        /* Header minimalis */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #21262d;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f0f6fc;
        }
        .header h1 span { color: #58a6ff; }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            background: #21262d;
            padding: 4px 14px 4px 10px;
            border-radius: 30px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3fb950;
            transition: 0.3s;
        }
        .dot.danger { background: #da3633; }
        .dot.warning { background: #d29922; }

        /* Video Wrapper */
        .video-wrapper {
            position: relative;
            margin-top: 16px;
            border-radius: 16px;
            overflow: hidden;
            background: #010409;
            aspect-ratio: 16 / 9;
            border: 1px solid #30363d;
        }
        #displayCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }
        /* HUD modern di atas video */
        .hud {
            position: absolute;
            bottom: 12px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 500;
            color: #8b949e;
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(4px);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #30363d44;
            pointer-events: none;
        }
        .hud-left { display: flex; gap: 16px; }
        .hud-left .val { color: #f0f6fc; }
        .hud-right .val { color: #58a6ff; }

        /* Info Grid Modern */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 16px;
        }
        .info-item {
            background: #0d1117;
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid #21262d;
        }
        .info-item .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
        }
        .info-item .value {
            font-size: 15px;
            font-weight: 600;
            color: #f0f6fc;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }
        .info-item .value.alert { color: #f0883e; }
        .info-item .value.danger { color: #da3633; }
        .info-item .value.success { color: #3fb950; }

        /* Log Area Minimalis */
        .log-box {
            margin-top: 14px;
            background: #0d1117;
            border-radius: 12px;
            padding: 10px 14px;
            max-height: 72px;
            overflow-y: auto;
            font-size: 12px;
            font-family: 'SF Mono', 'Courier New', monospace;
            color: #8b949e;
            border: 1px solid #21262d;
            line-height: 1.7;
        }
        .log-box::-webkit-scrollbar { width: 3px; }
        .log-box::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
        .log-alert { color: #f0883e; }

        /* Tombol Flat Modern */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: #238636; border-color: #238636; color: #fff; }
        .btn-primary:hover { background: #2ea043; }
        .btn-primary:disabled { opacity: 0.5; cursor: default; background: #238636; }
        .btn-danger { background: #da3633; border-color: #da3633; color: #fff; }
        .btn-danger:hover { background: #f85149; }
        .btn-outline { background: transparent; border-color: #30363d; }
        .btn-outline:hover { background: #21262d; }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1>📹 <span>CCTV</span> AI</h1>
        <div class="status-badge">
            <span class="dot" id="statusDot"></span>
            <span id="statusLabel">SIAGA</span>
        </div>
    </div>

    <!-- VIDEO -->
    <div class="video-wrapper">
        <canvas id="displayCanvas"></canvas>
        <video id="sourceVideo" autoplay playsinline style="display:none;"></video>
        <!-- HUD -->
        <div class="hud">
            <div class="hud-left">
                <span>👤 <span class="val" id="humanCount">0</span></span>
                <span>⚡ <span class="val" id="fpsDisplay">0</span> FPS</span>
            </div>
            <div class="hud-right">
                <span>⏱ <span class="val" id="recTimeDisplay">IDLE</span></span>
            </div>
        </div>
    </div>

    <!-- INFO GRID -->
    <div class="info-grid">
        <div class="info-item">
            <div class="label">Resolusi</div>
            <div class="value" id="resDisplay">--x--</div>
        </div>
        <div class="info-item">
            <div class="label">Inferensi AI</div>
            <div class="value" id="inferDisplay">0 ms</div>
        </div>
        <div class="info-item">
            <div class="label">Konfidensi</div>
            <div class="value" id="confDisplay">0%</div>
        </div>
    </div>

    <!-- LOG -->
    <div class="log-box" id="logArea">
        > Sistem siap. Tekan "Mulai".
    </div>

    <!-- BUTTONS -->
    <div class="btn-group">
        <button class="btn btn-primary" id="btnStart">▶ Mulai</button>
        <button class="btn btn-outline" id="btnDownload">⬇ Unduh</button>
        <button class="btn btn-outline" id="btnClear">✕ Bersih</button>
    </div>
</div>

<script>
    (function(){
        // --- DOM ---
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const logArea = document.getElementById('logArea');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const humanCount = document.getElementById('humanCount');
        const fpsDisplay = document.getElementById('fpsDisplay');
        const resDisplay = document.getElementById('resDisplay');
        const inferDisplay = document.getElementById('inferDisplay');
        const confDisplay = document.getElementById('confDisplay');
        const recTimeDisplay = document.getElementById('recTimeDisplay');
        const btnStart = document.getElementById('btnStart');
        const btnDownload = document.getElementById('btnDownload');
        const btnClear = document.getElementById('btnClear');

        // --- STATE ---
        let isRunning = false;
        let model = null;
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingStartTime = 0;
        let animFrameId = null;
        let detectionTimerId = null;

        // Statistik
        let frameCount = 0;
        let fps = 0;
        let lastFpsUpdate = performance.now();
        let humanDetected = false;
        let humanCounter = 0;
        const MIN_CONSECUTIVE = 2;

        // --- RESIZE CANVAS ---
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.floor(rect.width);
            canvas.height = Math.floor(rect.height);
        }
        window.addEventListener('resize', resizeCanvas);

        // --- LOG ---
        function addLog(msg, isAlert = false) {
            const time = new Date().toLocaleTimeString('id-ID');
            const cls = isAlert ? 'log-alert' : '';
            logArea.innerHTML += `<div class="${cls}">> [${time}] ${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
            while (logArea.children.length > 40) logArea.removeChild(logArea.firstChild);
        }

        // --- DRAW LOOP (60 FPS) ---
        function drawLoop(timestamp) {
            if (!isRunning) {
                animFrameId = requestAnimationFrame(drawLoop);
                return;
            }

            // FPS counter
            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
                fpsDisplay.textContent = fps;
            }

            // 1. Gambar frame ke canvas dengan filter BW + BLUR
            if (video.readyState >= 2) {
                const w = canvas.width, h = canvas.height;
                // Terapkan filter grayscale & blur langsung ke canvas (agar rekaman ikut efek)
                ctx.filter = 'blur(2.5px) grayscale(100%) contrast(1.1)';
                ctx.drawImage(video, 0, 0, w, h);
                ctx.filter = 'none';

                // Jika ada manusia terdeteksi, gambar bounding box (tanpa glow)
                if (humanDetected) {
                    // Box diambil dari variabel global terakhir
                    const boxes = window._lastBoxes || [];
                    ctx.strokeStyle = '#f0883e';
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([]);
                    boxes.forEach(b => {
                        const [x, y, bw, bh] = b.bbox;
                        ctx.strokeRect(x, y, bw, bh);
                        ctx.fillStyle = 'rgba(240, 136, 62, 0.15)';
                        ctx.fillRect(x, y, bw, bh);
                        ctx.font = 'bold 13px -apple-system, sans-serif';
                        ctx.fillStyle = '#f0883e';
                        ctx.fillText('MANUSIA', x, y - 6);
                    });
                }

                // Update info resolusi sekali
                if (resDisplay.textContent === '--x--' && video.videoWidth) {
                    resDisplay.textContent = `${video.videoWidth}x${video.videoHeight}`;
                }
            }

            animFrameId = requestAnimationFrame(drawLoop);
        }

        // --- DETEKSI AI (dipanggil per 200ms) ---
        async function runDetection() {
            if (!isRunning || !model || video.readyState < 2) {
                detectionTimerId = setTimeout(runDetection, 200);
                return;
            }

            const startTime = performance.now();
            try {
                const predictions = await model.detect(video);
                const inferenceTime = (performance.now() - startTime).toFixed(0);
                inferDisplay.textContent = inferenceTime + ' ms';

                // Filter manusia
                const humans = predictions.filter(p => p.class === 'person' && p.score > 0.45);
                window._lastBoxes = humans;

                // Update count
                humanCount.textContent = humans.length;

                // Konfidensi tertinggi
                let maxConf = 0;
                if (humans.length > 0) {
                    maxConf = Math.max(...humans.map(h => h.score));
                    confDisplay.textContent = (maxConf * 100).toFixed(0) + '%';
                } else {
                    confDisplay.textContent = '0%';
                }

                // Logika deteksi berurutan
                if (humans.length > 0) {
                    humanCounter++;
                } else {
                    humanCounter = 0;
                }

                const confirmed = humanCounter >= MIN_CONSECUTIVE;
                if (confirmed && !humanDetected) {
                    humanDetected = true;
                    statusDot.className = 'dot danger';
                    statusLabel.textContent = 'TERDETEKSI';
                    addLog('🚨 Manusia terdeteksi! Memulai rekaman...', true);
                    startRecording();
                } else if (!confirmed && humanDetected) {
                    humanDetected = false;
                    statusDot.className = 'dot';
                    statusLabel.textContent = 'SIAGA';
                    addLog('✅ Manusia pergi. Menghentikan rekaman.');
                    stopRecording();
                } else if (confirmed) {
                    statusDot.className = 'dot danger';
                    statusLabel.textContent = 'TERDETEKSI';
                }

            } catch (err) {
                // silent ignore untuk error sementara
            }

            detectionTimerId = setTimeout(runDetection, 200);
        }

        // --- REKAM ---
        function startRecording() {
            if (isRecording || !isRunning) return;
            try {
                // Stream dari canvas (sudah include efek BW)
                const canvasStream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(canvasStream, {
                    mimeType: 'video/webm;codecs=vp9,opus',
                    bitsPerSecond: 1200000
                });
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    if (recordedChunks.length > 0) {
                        const blob = new Blob(recordedChunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        window._recordingBlob = { url, blob, time: new Date().toISOString() };
                        addLog(`✅ Rekaman selesai (${(blob.size/1024/1024).toFixed(1)} MB)`);
                    }
                    isRecording = false;
                    recTimeDisplay.textContent = 'IDLE';
                };

                mediaRecorder.start(1000);
                isRecording = true;
                recordingStartTime = Date.now();
                recTimeDisplay.textContent = '● REKAM';
                addLog('🔴 Merekam...');
            } catch (e) {
                addLog('❌ Gagal rekam: ' + e.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try { mediaRecorder.stop(); } catch(e) {}
            }
            // Flag diubah di event onstop
            if (isRecording) {
                isRecording = false;
                recTimeDisplay.textContent = 'IDLE';
            }
        }

        // --- START / STOP CCTV ---
        async function toggleCCTV() {
            if (isRunning) {
                // STOP
                isRunning = false;
                if (detectionTimerId) clearTimeout(detectionTimerId);
                if (animFrameId) cancelAnimationFrame(animFrameId);
                if (isRecording) stopRecording();
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                statusDot.className = 'dot';
                statusLabel.textContent = 'STOP';
                humanCount.textContent = '0';
                confDisplay.textContent = '0%';
                fpsDisplay.textContent = '0';
                btnStart.textContent = '▶ Mulai';
                addLog('⏹ Sistem dihentikan.');
                return;
            }

            // START
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                resizeCanvas();
                isRunning = true;
                btnStart.textContent = '⏹ Berhenti';
                statusDot.className = 'dot warning';
                statusLabel.textContent = 'MEMUAT AI';
                addLog('📷 Kamera aktif. Memuat model AI...');

                if (!model) {
                    model = await cocoSsd.load({ base: 'mobilenet_v2' });
                    addLog('✅ Model AI siap (COCO-SSD).');
                } else {
                    addLog('✅ Model AI sudah siap.');
                }

                statusDot.className = 'dot';
                statusLabel.textContent = 'SIAGA';
                humanDetected = false;
                humanCounter = 0;

                // Mulai loop gambar & deteksi
                if (animFrameId) cancelAnimationFrame(animFrameId);
                if (detectionTimerId) clearTimeout(detectionTimerId);
                drawLoop(performance.now());
                runDetection();

            } catch (err) {
                alert('Gagal akses kamera: ' + err.message);
                addLog('❌ Error: ' + err.message);
                isRunning = false;
                btnStart.textContent = '▶ Mulai';
                statusLabel.textContent = 'ERROR';
            }
        }

        // --- DOWNLOAD REKAMAN ---
        function downloadRecording() {
            if (window._recordingBlob && window._recordingBlob.blob.size > 0) {
                const a = document.createElement('a');
                a.href = window._recordingBlob.url;
                a.download = `rekaman_cctv_${new Date().toISOString().replace(/[:.]/g, '-')}.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                addLog('⬇ Proses unduh dimulai.');
            } else {
                alert('Belum ada rekaman. Biarkan CCTV mendeteksi manusia terlebih dahulu.');
            }
        }

        // --- EVENT LISTENERS ---
        btnStart.addEventListener('click', toggleCCTV);
        btnDownload.addEventListener('click', downloadRecording);
        btnClear.addEventListener('click', () => {
            logArea.innerHTML = '> Log dibersihkan.';
        });

        // --- INIT ---
        addLog('🔧 Aplikasi siap. Tekan "Mulai" untuk mengaktifkan CCTV.');
        statusDot.className = 'dot';
        statusLabel.textContent = 'SIAGA';
        recTimeDisplay.textContent = 'IDLE';
        resizeCanvas();

        // Bersihkan interval saat halaman ditutup
        window.addEventListener('beforeunload', function() {
            if (isRecording) stopRecording();
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (detectionTimerId) clearTimeout(detectionTimerId);
            if (animFrameId) cancelAnimationFrame(animFrameId);
        });
    })();
</script>
</body>
</html>
