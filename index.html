<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MyBro - Premium Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #090c10;
            --card: #161b22;
            --accent: #00ffa3;
            --accent-soft: rgba(0, 255, 163, 0.1);
            --text: #f0f6fc;
            --text-dim: #8b949e;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ff4d4d;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- HEADER --- */
        header { 
            padding: 20px; background: rgba(13, 17, 23, 0.8); 
            backdrop-filter: blur(15px); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .brand { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; }
        .brand span { color: var(--accent); }
        .my-status-head { display: flex; align-items: center; gap: 10px; background: var(--card); padding: 5px 12px; border-radius: 100px; border: 1px solid var(--border); }

        /* --- CONTENT AREA --- */
        .main-container { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .view { display: none; opacity: 0; transform: translateY(10px); transition: 0.3s ease; }
        .view.active { display: block; opacity: 1; transform: translateY(0); }

        /* --- STORY SECTION --- */
        .story-wrapper { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 20px; scrollbar-width: none; }
        .story-wrapper::-webkit-scrollbar { display: none; }
        .story-circle { 
            min-width: 68px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; 
        }
        .story-img-frame { 
            width: 64px; height: 64px; border-radius: 22px; padding: 2px;
            border: 2px solid var(--accent); position: relative;
        }
        .story-img-frame img { width: 100%; height: 100%; border-radius: 18px; object-fit: cover; }
        .story-add-icon { 
            position: absolute; bottom: -2px; right: -2px; background: var(--accent); 
            color: #000; width: 20px; height: 20px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 0.7rem; border: 2px solid var(--bg);
        }

        /* --- CARD LIST --- */
        .item-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 14px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 14px; transition: 0.2s;
        }
        .item-card:active { transform: scale(0.97); background: rgba(255,255,255,0.03); }
        .avatar-main { width: 52px; height: 52px; border-radius: 16px; object-fit: cover; background: #30363d; }
        .item-info { flex: 1; }
        .item-name { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
        .item-sub { color: var(--text-dim); font-size: 0.8rem; }

        /* --- MODALS (POPUP) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: flex-end; z-index: 1000;
        }
        .modal-sheet {
            background: #1c2128; width: 100%; max-width: 450px; 
            border-radius: 30px 30px 0 0; padding: 25px; 
            transform: translateY(100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-top: 1px solid var(--border);
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-sheet { transform: translateY(0); }

        .handle { width: 40px; height: 4px; background: var(--border); border-radius: 10px; margin: -10px auto 20px; }
        
        input, textarea {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 14px;
            border: 1px solid var(--border); background: #0d1117; color: white; outline: none;
        }
        .btn-action {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            background: var(--accent); color: #000; font-weight: 700; cursor: pointer;
            margin-top: 10px; font-size: 1rem;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80px;
            background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding-bottom: 15px;
        }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-dim); cursor: pointer; transition: 0.3s; flex: 1;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-btn i { font-size: 1.4rem; margin-bottom: 5px; }
        .nav-btn span { font-size: 0.7rem; font-weight: 600; }

        /* --- CHAT VIEW --- */
        #chatViewFull {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 2000; display: none; flex-direction: column;
        }
        .chat-head { padding: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        #msgContainer { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { padding: 12px 16px; border-radius: 18px; max-width: 80%; font-size: 0.95rem; line-height: 1.4; }
        .msg-me { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 4px; }
        .msg-them { align-self: flex-start; background: var(--card); color: #fff; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="brand">My<span>Bro</span>.</div>
        <div class="my-status-head" onclick="openProfileEdit()">
            <img id="headAvatar" src="https://ui-avatars.com/api/?name=User" style="width:28px; height:28px; border-radius:8px; object-fit:cover;">
            <span id="headID" style="font-size:0.75rem; font-weight:700;">BRO-xxxx</span>
        </div>
    </header>

    <div class="main-container">
        <div id="view-chats" class="view active">
            <div class="story-wrapper" id="storyList">
                <div class="story-circle" onclick="document.getElementById('fileStory').click()">
                    <div class="story-img-frame" style="border-style: dashed; border-color: var(--text-dim);">
                        <img id="myStoryThumb" src="https://ui-avatars.com/api/?name=Me">
                        <div class="story-add-icon"><i class="fas fa-plus"></i></div>
                    </div>
                    <small style="color:var(--text-dim); font-size:0.7rem; margin-top:4px;">Status</small>
                </div>
            </div>
            <h4 style="margin: 25px 0 15px; font-weight: 700; color: var(--text-dim);">Obrolan Terbaru</h4>
            <div id="recentChats"></div>
        </div>

        <div id="view-contacts" class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h4 style="margin:0;">Daftar Kontak</h4>
                <button onclick="openPopup('popAddContact')" style="background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent); padding:6px 12px; border-radius:10px; font-weight:700;">+ Teman</button>
            </div>
            <div id="contactList"></div>
        </div>
    </div>

    <nav>
        <div class="nav-btn active" onclick="switchView('chats', this)"><i class="fas fa-comment-dots"></i><span>Chat</span></div>
        <div class="nav-btn" onclick="switchView('contacts', this)"><i class="fas fa-address-book"></i><span>Kontak</span></div>
        <div class="nav-btn" onclick="openProfileEdit()"><i class="fas fa-user-circle"></i><span>Profil</span></div>
    </nav>

    <div id="overlay" class="modal-overlay" onclick="closePopup(event)">
        <div id="popProfile" class="modal-sheet" style="display:none;">
            <div class="handle"></div>
            <h3 style="margin-top:0">Pengaturan Profil</h3>
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="editProfImg" src="" style="width:100px; height:100px; border-radius:30px; border:2px solid var(--accent); object-fit:cover;">
                <br>
                <button onclick="document.getElementById('fileAvatar').click()" style="margin-top:10px; background:transparent; border:1px solid var(--accent); color:var(--accent); padding:5px 15px; border-radius:10px; font-size:0.8rem;">Ganti Foto</button>
            </div>
            <input type="text" id="editName" placeholder="Nama Tampilan">
            <textarea id="editBio" placeholder="Bio singkat kamu..." rows="2"></textarea>
            <button class="btn-action" onclick="saveProfileData()">Simpan Perubahan</button>
        </div>

        <div id="popAddContact" class="modal-sheet" style="display:none;">
            <div class="handle"></div>
            <h3>Tambah Teman Baru</h3>
            <p style="color:var(--text-dim); font-size:0.85rem;">Masukkan ID MyBro teman kamu untuk memulai obrolan.</p>
            <input type="text" id="targetIDInput" placeholder="Contoh: BRO-1234">
            <button class="btn-action" onclick="addContactAction()">Tambah ke Kontak</button>
        </div>
    </div>

    <div id="chatViewFull">
        <div class="chat-head">
            <i class="fas fa-chevron-left" onclick="closeFullChat()" style="font-size:1.2rem; padding:10px;"></i>
            <img id="chatTargetImg" src="" class="avatar-main" style="width:40px; height:40px;">
            <div style="flex:1">
                <div id="chatTargetName" style="font-weight:700;">Nama</div>
                <div style="font-size:0.7rem; color:var(--accent);">Online</div>
            </div>
            <i class="fas fa-info-circle" style="color:var(--text-dim);"></i>
        </div>
        <div id="msgContainer"></div>
        <div style="padding:15px; background:#161b22; display:flex; gap:10px; align-items:center;">
            <input type="text" id="msgInput" placeholder="Ketik pesan..." style="margin:0;">
            <button onclick="sendChatMessage()" style="background:var(--accent); border:none; width:50px; height:50px; border-radius:15px; cursor:pointer;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <input type="file" id="fileAvatar" accept="image/*" style="display:none;" onchange="handleImage(this, 'avatar')">
    <input type="file" id="fileStory" accept="image/*" style="display:none;" onchange="handleImage(this, 'story')">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myID = localStorage.getItem('mybro_uid');
        if(!myID) {
            myID = "BRO-" + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('mybro_uid', myID);
            // Auto Register
            set(ref(db, `users/${myID}/profile`), { id: myID, name: "User "+myID, photo: "", bio: "Available" });
        }
        document.getElementById('headID').innerText = myID;

        let currentActiveChat = null;
        let imgTemp = "";

        // --- UI NAVIGATION ---
        window.switchView = (view, el) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-'+view).classList.add('active');
            el.classList.add('active');
        };

        window.openPopup = (id) => {
            document.getElementById('overlay').classList.add('active');
            document.querySelectorAll('.modal-sheet').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        };

        window.closePopup = (e) => {
            if(e && e.target.id !== 'overlay') return;
            document.getElementById('overlay').classList.remove('active');
        };

        // --- IMAGE HANDLING ---
        window.handleImage = (input, type) => {
            const file = input.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max = 400; const scale = max / Math.max(img.width, img.height);
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    imgTemp = canvas.toDataURL('image/jpeg', 0.7);
                    
                    if(type === 'avatar') document.getElementById('editProfImg').src = imgTemp;
                    if(type === 'story') uploadStoryAction();
                };
            };
        };

        // --- PROFILE LOGIC ---
        window.openProfileEdit = async () => {
            const snap = await get(ref(db, `users/${myID}/profile`));
            const d = snap.val() || {};
            document.getElementById('editName').value = d.name || "";
            document.getElementById('editBio').value = d.bio || "";
            document.getElementById('editProfImg').src = d.photo || `https://ui-avatars.com/api/?name=${d.name}`;
            window.openPopup('popProfile');
        };

        window.saveProfileData = () => {
            const name = document.getElementById('editName').value;
            const bio = document.getElementById('editBio').value;
            const data = { id: myID, name, bio };
            if(imgTemp) data.photo = imgTemp;
            else data.photo = document.getElementById('editProfImg').src.includes('base64') ? document.getElementById('editProfImg').src : "";

            update(ref(db, `users/${myID}/profile`), data).then(() => {
                alert("Profil diperbarui!");
                window.closePopup();
                imgTemp = "";
            });
        };

        // Sinkronkan Foto Profil di Header Secara Real-time
        onValue(ref(db, `users/${myID}/profile`), (snap) => {
            const d = snap.val();
            if(d && d.photo) {
                document.getElementById('headAvatar').src = d.photo;
                document.getElementById('myStoryThumb').src = d.photo;
            }
        });

        // --- CONTACT LOGIC ---
        window.addContactAction = async () => {
            const tid = document.getElementById('targetIDInput').value.trim();
            if(!tid || tid === myID) return alert("ID Tidak Valid");
            set(ref(db, `users/${myID}/contacts/${tid}`), { id: tid });
            alert("Kontak Berhasil Ditambahkan!");
            window.closePopup();
        };

        onValue(ref(db, `users/${myID}/contacts`), (snap) => {
            const cList = document.getElementById('contactList');
            const rList = document.getElementById('recentChats');
            cList.innerHTML = ""; rList.innerHTML = "";
            snap.forEach(child => {
                const cid = child.key;
                onValue(ref(db, `users/${cid}/profile`), (pSnap) => {
                    const p = pSnap.val() || { name: cid, photo: "" };
                    const avatar = p.photo || `https://ui-avatars.com/api/?name=${p.name}`;
                    const html = `
                        <div class="item-card" onclick="openFullChat('${cid}', '${p.name}', '${avatar}')">
                            <img src="${avatar}" class="avatar-main">
                            <div class="item-info">
                                <div class="item-name">${p.name}</div>
                                <div class="item-sub">${cid}</div>
                            </div>
                            <i class="fas fa-chevron-right" style="color:var(--border)"></i>
                        </div>`;
                    cList.innerHTML += html;
                    rList.innerHTML += html;
                });
            });
        });

        // --- STORY LOGIC ---
        function uploadStoryAction() {
            if(!imgTemp) return;
            const sRef = push(ref(db, 'stories'));
            set(sRef, { id: sRef.key, img: imgTemp, owner: myID, time: Date.now() });
            imgTemp = "";
            alert("Status berhasil diposting!");
        }

        onValue(ref(db, 'stories'), (snap) => {
            const list = document.getElementById('storyList');
            const myBtn = list.firstElementChild.outerHTML;
            list.innerHTML = myBtn;
            snap.forEach(c => {
                const s = c.val();
                if(Date.now() - s.time < 86400000) {
                    get(ref(db, `users/${s.owner}/profile`)).then(pSnap => {
                        const p = pSnap.val() || { name: s.owner };
                        list.innerHTML += `
                            <div class="story-circle">
                                <div class="story-img-frame"><img src="${s.img}"></div>
                                <small style="font-size:0.65rem; color:var(--text-dim); margin-top:4px;">${p.name.split(' ')[0]}</small>
                            </div>`;
                    });
                }
            });
        });

        // --- CHAT LOGIC ---
        window.openFullChat = (id, name, img) => {
            currentActiveChat = id;
            document.getElementById('chatTargetName').innerText = name;
            document.getElementById('chatTargetImg').src = img;
            document.getElementById('chatViewFull').style.display = 'flex';
            
            const chatID = [myID, id].sort().join("_");
            onValue(ref(db, `chats/${chatID}`), (snap) => {
                const area = document.getElementById('msgContainer');
                area.innerHTML = "";
                snap.forEach(m => {
                    const d = m.val();
                    const cls = d.from === myID ? 'msg-me' : 'msg-them';
                    area.innerHTML += `<div class="msg-bubble ${cls}">${d.text}</div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        };

        window.closeFullChat = () => { document.getElementById('chatViewFull').style.display = 'none'; currentActiveChat = null; };

        window.sendChatMessage = () => {
            const inp = document.getElementById('msgInput');
            if(!inp.value || !currentActiveChat) return;
            const chatID = [myID, currentActiveChat].sort().join("_");
            push(ref(db, `chats/${chatID}`), { from: myID, text: inp.value, time: Date.now() });
            inp.value = "";
        };

    </script>
</body>
</html>
