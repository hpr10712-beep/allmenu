<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MyBro - Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0b1120;
            --panel: #1e293b;
            --panel-hover: #334155;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --blue-tick: #3b82f6;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --safe-top: env(safe-area-inset-top);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { 
            padding: calc(15px + var(--safe-top)) 20px 15px; 
            background: rgba(11, 17, 32, 0.9); backdrop-filter: blur(15px); 
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }
        .my-id-tag { background: var(--panel); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); }

        /* CONTENT VIEWS */
        .content { flex: 1; overflow-y: auto; padding: 15px 15px 90px; scroll-behavior: smooth; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-dim); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* CARDS */
        .card { 
            background: transparent; border-radius: 12px; padding: 12px; margin-bottom: 5px; 
            display: flex; align-items: center; gap: 15px; transition: 0.2s; cursor: pointer; position: relative;
        }
        .card:hover, .card:active { background: var(--panel); }
        
        .pfp-wrap { position: relative; width: 52px; height: 52px; border-radius: 50%; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .pfp-wrap.has-story { background: linear-gradient(45deg, var(--accent), #3b82f6); padding: 2.5px; }
        .pfp-wrap.has-story img { border: 2px solid var(--bg); }
        .pfp { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--panel); }

        .card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .card-name { font-weight: 600; font-size: 1rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-time { font-size: 0.75rem; color: var(--text-dim); flex-shrink: 0; }
        .card-msg { font-size: 0.85rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
        
        .add-status-btn { position: absolute; bottom: -2px; right: -2px; background: var(--accent); color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; justify-content: center; align-items: center; font-size: 0.7rem; border: 2.5px solid var(--bg); cursor: pointer; z-index: 5; transition: 0.2s; }

        .unread-badge { background: var(--accent); color: white; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 10px; min-width: 20px; text-align: center; }

        /* OVERLAYS & MODALS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; z-index: 4000; align-items: flex-end; }
        .overlay.active { display: flex; }
        .sheet { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); width: 100%; border-radius: 20px 20px 0 0; padding: 25px 20px 40px; transform: translateY(100%); transition: 0.3s ease; border-top: 1px solid var(--border); box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        .overlay.active .sheet { transform: translateY(0); }
        .menu-item { padding: 16px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; font-size: 1rem; color: var(--text); border-bottom: 1px solid var(--border); }
        .menu-item:hover { background: var(--panel-hover); }
        .menu-item.text-danger { color: #ef4444; }

        input[type="text"], textarea { width: 100%; padding: 14px 16px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: white; outline: none; transition: 0.2s; }
        .btn-fill { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent), #059669); color: white; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px var(--accent-glow); }

        /* CHAT PANEL */
        #chatPanel { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; transform: translateX(100%); transition: 0.3s ease; }
        #chatPanel.active { transform: translateX(0); }
        .chat-header { padding: calc(10px + var(--safe-top)) 15px 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; background: rgba(11, 17, 32, 0.95); backdrop-filter: blur(10px); }
        
        #pinnedMsgContainer { display: none; padding: 10px 15px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 0.85rem; border-left: 4px solid var(--accent); cursor: pointer; }
        #msgArea { flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .bubble { padding: 10px 14px; border-radius: 16px; max-width: 80%; font-size: 0.95rem; word-wrap: break-word; position: relative; display: flex; flex-direction: column; transition: 0.2s; }
        .bubble.sent { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .bubble.received { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .bubble img, .bubble video { max-width: 100%; border-radius: 8px; margin-bottom: 5px; }

        /* STORY VIEWER */
        #storyViewer { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; flex-direction: column; }
        .story-progress-container { display: flex; gap: 4px; padding: calc(10px + var(--safe-top)) 10px 10px; position: absolute; top: 0; left: 0; right: 0; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .story-progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        .story-progress-fill { height: 100%; background: white; width: 0%; transition: width 0.1s linear; }

        /* TOAST */
        .toast-msg { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(16, 185, 129, 0.95); color: white; padding: 12px 20px; border-radius: 50px; font-size: 0.9rem; z-index: 9999; opacity: 0; transition: 0.3s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(11, 17, 32, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; z-index: 500; }
        .nav-link { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; color: var(--text-dim); font-size: 0.7rem; font-weight: 500; cursor: pointer; position: relative; }
        .nav-link.active { color: var(--accent); }
        .nav-badge { position: absolute; top: 10px; right: 25%; background: red; width: 8px; height: 8px; border-radius: 50%; display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">My<span>Bro</span></div>
        <div class="my-id-tag" id="displayID" onclick="copyID()">ID: ...</div>
    </header>

    <div class="content">
        <div id="v-chats" class="view active">
            <div id="archivedBtn" style="display:none; padding:12px 15px; margin-bottom:10px; background:var(--panel); border-radius:12px; cursor:pointer; align-items:center; gap:15px;" onclick="toggleArchived()">
                <i class="fas fa-archive"></i>
                <div style="flex:1; font-weight:600;">Diarsipkan</div>
                <div id="archivedCount">0</div>
            </div>
            <div id="archivedList" style="display:none; margin-bottom: 20px; border-left: 2px solid var(--accent); padding-left: 5px;"></div>
            <div id="chatList"></div>
        </div>

        <div id="v-status" class="view">
            <h4>Status Saya</h4>
            <div class="card" onclick="window.app.openMyStory()">
                <div class="pfp-wrap" id="myStatusPfpWrap">
                    <img id="myStatusPfp" src="" class="pfp">
                    <div class="add-status-btn" onclick="event.stopPropagation(); document.getElementById('storyUpload').click()"><i class="fas fa-plus"></i></div>
                </div>
                <div class="card-info">
                    <div class="card-name">Status Saya</div>
                    <div class="card-msg" id="myStatusText">Ketuk untuk menambahkan status</div>
                </div>
            </div>
            <input type="file" id="storyUpload" accept="image/*,video/*" style="display:none" onchange="window.app.uploadStory(this)">
            <h4 style="margin-top:20px;">Pembaruan Teman</h4>
            <div id="storyList"></div>
        </div>

        <div id="v-contacts" class="view">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h4>Kontak Saya</h4>
                <button onclick="toggleOverlay('popAdd', true)" class="btn-fill" style="width:auto; padding:6px 12px; font-size:0.8rem;">Tambah</button>
            </div>
            <div id="contactList"></div>
        </div>

        <div id="v-profile" class="view">
            <div class="profile-header" onclick="toggleOverlay('popProfile', true)" style="display:flex; align-items:center; gap:15px; padding: 20px; background: var(--panel); border-radius:12px; cursor:pointer;">
                <img id="vProfilePfp" src="" class="pfp" style="width:65px; height:65px;">
                <div style="flex:1;">
                    <h3 id="vProfileName">Nama</h3>
                    <div id="vProfileBio" style="color:var(--text-dim); font-size:0.85rem;">Bio...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="storyViewer">
        <div class="story-progress-container"><div class="story-progress-bar"><div class="story-progress-fill" id="storyProgress"></div></div></div>
        <div class="story-header" style="position:absolute; top:40px; padding:10px; display:flex; align-items:center; gap:10px; color:white; z-index:20;">
            <i class="fas fa-arrow-left" onclick="window.app.closeStory()"></i>
            <img id="svPfp" src="" style="width:40px; height:40px; border-radius:50%;">
            <div><div id="svName" style="font-weight:600;">Nama</div><div id="svTime" style="font-size:0.75rem;">Waktu</div></div>
        </div>
        <div class="story-media" id="svMediaContainer" style="flex:1; display:flex; align-items:center;" onclick="window.app.nextStory()"></div>
        <div class="story-views" id="svViews" style="position:absolute; bottom:40px; left:50%; transform:translateX(-50%); display:none; text-align:center;">
             <i class="fas fa-eye"></i> <span id="svViewCount">0</span>
        </div>
        <div class="story-footer" id="svFooter" style="padding:15px; display:flex; gap:10px;">
            <input type="text" id="storyReplyInp" placeholder="Balas status..." style="background:rgba(255,255,255,0.2); border:none;">
            <button onclick="window.app.replyStory()" class="send-btn" style="width:45px; height:45px; border-radius:50%; background:var(--accent); color:white; border:none;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="chatPanel">
        <div class="chat-header">
            <i class="fas fa-arrow-left" onclick="window.app.closeChat()"></i>
            <img id="chatPfp" src="" class="pfp" style="width:40px; height:40px;">
            <div style="flex:1"><div id="chatName" style="font-weight:600;">...</div><div id="chatOnlineStatus" style="font-size:0.75rem; color:var(--accent);">Memuat...</div></div>
            <i class="fas fa-ellipsis-v" onclick="toggleOverlay('chatOptionsMenu', true)"></i>
        </div>
        <div id="pinnedMsgContainer" onclick="window.app.scrollToPinned()"><div id="pinnedMsgText"></div></div>
        <div id="msgArea"></div>
        <div class="chat-input-area" style="padding:15px; display:flex; gap:10px; background:var(--bg); border-top:1px solid var(--border);">
            <button class="attach-btn" onclick="document.getElementById('chatMedia').click()" style="background:none; border:none; color:var(--text-dim); font-size:1.2rem;"><i class="fas fa-paperclip"></i></button>
            <input type="file" id="chatMedia" style="display:none" onchange="window.app.sendMedia(this)">
            <input type="text" id="msgIn" placeholder="Ketik pesan..." style="margin:0;">
            <button class="send-btn" onclick="window.app.send()" style="background:var(--accent); border:none; width:48px; height:48px; border-radius:12px; color:white;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div class="overlay" id="chatOptionsMenu" onclick="closeOverlay(event)"><div class="sheet"><div class="menu-item" id="archiveMenuBtn">Arsip</div><div class="menu-item text-danger" onclick="window.app.deleteChat()">Hapus Obrolan</div></div></div>
    <div class="overlay" id="msgOptionsMenu" onclick="closeOverlay(event)"><div class="sheet"><div class="menu-item" id="pinMenuText" onclick="window.app.pinMessage()">Sematkan</div><div class="menu-item text-danger" onclick="window.app.deleteMessage()">Hapus Pesan</div></div></div>
    <div class="overlay" id="popAdd" onclick="closeOverlay(event)"><div class="sheet"><h3>Tambah Teman</h3><input type="text" id="targetID" placeholder="ID (BRO-1234)"><button class="btn-fill" onclick="window.app.addFriend()">Simpan</button></div></div>
    <div class="overlay" id="popProfile" onclick="closeOverlay(event)"><div class="sheet"><h3>Edit Profil</h3><input type="text" id="editName"><textarea id="editBio"></textarea><button class="btn-fill" onclick="window.app.updateProfile()">Simpan</button></div></div>

    <nav>
        <div class="nav-link active" onclick="showTab('v-chats', this)"><i class="fas fa-comment-dots"></i><span>Obrolan</span><div class="nav-badge" id="chatBadge"></div></div>
        <div class="nav-link" onclick="showTab('v-status', this)"><i class="fas fa-circle-notch"></i><span>Status</span></div>
        <div class="nav-link" onclick="showTab('v-contacts', this)"><i class="fas fa-users"></i><span>Teman</span></div>
        <div class="nav-link" onclick="showTab('v-profile', this)"><i class="fas fa-cog"></i><span>Setelan</span></div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f"
        };
        const app_fire = initializeApp(firebaseConfig);
        const db = getDatabase(app_fire);

        let myID = localStorage.getItem('mybro_id');
        if(!myID) {
            myID = "BRO-" + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('mybro_id', myID);
            set(ref(db, `users/${myID}/profile`), { id: myID, name: "User " + myID.split('-')[1], bio: "Hey ada di MyBro!" });
        }
        document.getElementById('displayID').innerText = myID;

        // STATUS ONLINE / OFFLINE (GLOBAL)
        const connectedRef = ref(db, '.info/connected');
        const myStatusRef = ref(db, `users/${myID}/status`);
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                onDisconnect(myStatusRef).set(Date.now());
                set(myStatusRef, 'online');
            }
        });

        let activeTarget = null, selectedMsgId = null, isSelectedMsgPinned = false;
        let currentStoryQueue = [], currentStoryIndex = 0, storyTimer, viewingStoryOf = null;

        window.showTab = (id, el) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        };

        window.toggleOverlay = (id, show) => { 
            const el = document.getElementById(id); 
            if(show) { el.classList.add('active'); el.style.display = 'flex'; } 
            else { el.classList.remove('active'); setTimeout(() => el.style.display = 'none', 300); } 
        };
        window.closeOverlay = (e) => { if(e.target.classList.contains('overlay')) toggleOverlay(e.target.id, false); };
        window.copyID = () => { navigator.clipboard.writeText(myID); window.showToast("ID Berhasil Disalin!", "copy"); };
        window.toggleArchived = () => { const l = document.getElementById('archivedList'); l.style.display = l.style.display === 'none' ? 'block' : 'none'; };

        const formatTime = (ts) => {
            const d = new Date(ts);
            return d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
        };

        window.app = {
            openChat: (id, name, pfp) => {
                activeTarget = id;
                document.getElementById('chatName').innerText = name;
                document.getElementById('chatPfp').src = pfp;
                document.getElementById('chatPanel').classList.add('active');
                
                // PRIVACY: Hanya lihat status online jika sudah jadi kontak
                get(ref(db, `users/${myID}/contacts/${id}`)).then(snapContact => {
                    const statusEl = document.getElementById('chatOnlineStatus');
                    if(snapContact.exists()) {
                        onValue(ref(db, `users/${id}/status`), (snapStatus) => {
                            const val = snapStatus.val();
                            if(val === 'online') { statusEl.innerText = "Online"; statusEl.style.color = "var(--accent)"; }
                            else { statusEl.innerText = val ? `Terakhir dilihat ${formatTime(val)}` : "Offline"; statusEl.style.color = "var(--text-dim)"; }
                        });
                    } else { statusEl.innerText = ""; }
                });

                const room = [myID, id].sort().join("_");
                onValue(ref(db, `chats/${room}`), (snap) => {
                    const area = document.getElementById('msgArea'); area.innerHTML = "";
                    let updates = {}, pinnedMsg = null;
                    snap.forEach(child => {
                        const m = child.val();
                        if(m.from !== myID && m.status !== 'read') updates[`${child.key}/status`] = 'read';
                        if(m.pinned) pinnedMsg = m;

                        area.innerHTML += `
                            <div class="bubble ${m.from === myID ? 'sent' : 'received'}" oncontextmenu="window.app.msgMenu('${child.key}', ${m.pinned || false}, event)">
                                ${m.type === 'image' ? `<img src="${m.media}">` : ''}
                                ${m.text ? `<div>${m.text}</div>` : ''}
                                <div style="font-size:0.6rem; opacity:0.7; text-align:right;">${formatTime(m.time)}</div>
                            </div>`;
                    });
                    if(Object.keys(updates).length > 0) update(ref(db, `chats/${room}`), updates);
                    area.scrollTop = area.scrollHeight;
                    document.getElementById('pinnedMsgContainer').style.display = pinnedMsg ? 'block' : 'none';
                    if(pinnedMsg) document.getElementById('pinnedMsgText').innerText = pinnedMsg.text || "Media Tersemat";
                });
            },

            closeChat: () => { document.getElementById('chatPanel').classList.remove('active'); activeTarget = null; },

            send: (txt = null, media = null, type = 'text') => {
                const inp = document.getElementById('msgIn');
                const text = txt || inp.value;
                if(!text && !media) return;
                const room = [myID, activeTarget].sort().join("_");
                push(ref(db, `chats/${room}`), { from: myID, text, media: media || "", type, time: Date.now(), status: 'sent' });
                inp.value = "";
            },

            sendMedia: (input) => {
                const file = input.files[0]; if(!file || file.size > 20*1024*1024) return alert("File > 20MB");
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = () => { window.app.send("", reader.result, file.type.startsWith('image') ? 'image' : 'video'); };
            },

            uploadStory: (input) => {
                const file = input.files[0]; if(!file) return;
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = () => {
                    push(ref(db, `stories/${myID}`), { media: reader.result, type: file.type.startsWith('video') ? 'video' : 'image', time: Date.now(), views: 0 });
                    window.showToast("Status diunggah!");
                };
            },

            // PRIVASI STORY: Hanya render story milik teman
            renderStories: () => {
                const sList = document.getElementById('storyList'); sList.innerHTML = "";
                get(ref(db, `stories`)).then(snap => {
                    snap.forEach(userStory => {
                        const uid = userStory.key; if(uid === myID) return;
                        get(ref(db, `users/${myID}/contacts/${uid}`)).then(contactSnap => {
                            if(contactSnap.exists()) {
                                get(ref(db, `users/${uid}/profile`)).then(pSnap => {
                                    const p = pSnap.val();
                                    sList.innerHTML += `<div class="card" onclick="window.app.openStory('${uid}', '${p.name}', '${p.pfp || ''}')">
                                        <div class="pfp-wrap has-story"><img src="${p.pfp || ''}" class="pfp"></div>
                                        <div class="card-info"><div class="card-name">${p.name}</div><div class="card-msg">Klik untuk melihat status</div></div>
                                    </div>`;
                                });
                            }
                        });
                    });
                });
            },

            openStory: (uid, name, pfp) => {
                viewingStoryOf = uid;
                document.getElementById('svName').innerText = name;
                document.getElementById('svPfp').src = pfp;
                get(ref(db, `stories/${uid}`)).then(snap => {
                    currentStoryQueue = []; snap.forEach(c => currentStoryQueue.push({id: c.key, ...c.val()}));
                    currentStoryIndex = 0;
                    document.getElementById('storyViewer').style.display = 'flex';
                    window.app.renderCurrentStory();
                });
            },

            renderCurrentStory: () => {
                if(currentStoryIndex >= currentStoryQueue.length) return window.app.closeStory();
                const s = currentStoryQueue[currentStoryIndex];
                const container = document.getElementById('svMediaContainer');
                container.innerHTML = s.type === 'video' ? `<video src="${s.media}" autoplay></video>` : `<img src="${s.media}">`;
                
                const bar = document.getElementById('storyProgress');
                bar.style.transition = 'none'; bar.style.width = '0%';
                setTimeout(() => { bar.style.transition = 'width 5s linear'; bar.style.width = '100%'; }, 50);
                
                clearTimeout(storyTimer);
                storyTimer = setTimeout(() => window.app.nextStory(), 5000);
            },

            nextStory: () => { currentStoryIndex++; window.app.renderCurrentStory(); },
            closeStory: () => { clearTimeout(storyTimer); document.getElementById('storyViewer').style.display = 'none'; },

            msgMenu: (id, pinned, e) => { e.preventDefault(); selectedMsgId = id; isSelectedMsgPinned = pinned; toggleOverlay('msgOptionsMenu', true); },
            pinMessage: () => {
                const room = [myID, activeTarget].sort().join("_");
                update(ref(db, `chats/${room}/${selectedMsgId}`), { pinned: !isSelectedMsgPinned });
                toggleOverlay('msgOptionsMenu', false);
            }
        };

        // --- TOAST NOTIF ---
        window.showToast = (msg, icon = 'check') => {
            const t = document.querySelector('.toast-msg') || document.createElement('div');
            t.className = 'toast-msg show'; t.innerHTML = `<i class="fas fa-${icon}"></i> ${msg}`;
            document.body.appendChild(t);
            setTimeout(() => t.classList.remove('show'), 3000);
        };

        // --- BANNED CHECK (PREMIUM DESIGN) ---
        onValue(ref(db, `users/${myID}/isBanned`), (snap) => {
            if (snap.val() === true) {
                document.body.innerHTML = `
                    <div style="position:fixed; inset:0; background:#020617; display:flex; align-items:center; justify-content:center; z-index:99999; font-family:'Inter'; text-align:center; padding:30px;">
                        <div style="background:rgba(30,41,59,0.5); backdrop-filter:blur(20px); padding:40px; border-radius:30px; border:1px solid #ef4444; width:100%; max-width:400px;">
                            <div style="font-size:50px; color:#ef4444; margin-bottom:20px;"><i class="fas fa-user-slash"></i></div>
                            <h2 style="color:white; margin-bottom:10px;">Akses Dibatasi</h2>
                            <p style="color:#94a3b8; font-size:0.9rem; margin-bottom:25px;">Akun Anda <b>${myID}</b> telah diblokir karena melanggar ketentuan.</p>
                            <textarea id="appealTxt" placeholder="Pesan banding..." style="height:100px;"></textarea>
                            <button class="btn-fill" onclick="kirimBanding()" style="background:#ef4444;">Kirim Banding</button>
                        </div>
                    </div>`;
                window.kirimBanding = () => {
                    const msg = document.getElementById('appealTxt').value;
                    update(ref(db, `users/${myID}`), { appeal: msg, appealStatus: 'pending' });
                    alert("Banding dikirim!");
                };
            }
        });

        // Jalankan render story berkala
        setInterval(window.app.renderStories, 10000);
        window.app.renderStories();

    </script>
</body>
</html>
