<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍜 Miecrah - Multiplayer 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0f1f;
            color: #fff;
        }
        canvas {
            display: block;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }
        #hud .title {
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }
        #hud .score {
            font-size: 18px;
            font-weight: 300;
            margin-top: 6px;
            opacity: 0.9;
        }
        #hud .score span {
            font-weight: 700;
            color: #f9d976;
            -webkit-text-fill-color: #f9d976;
        }
        #hud .players-online {
            font-size: 14px;
            opacity: 0.6;
            margin-top: 4px;
        }

        /* Leaderboard */
        #leaderboard {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 16px 22px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 180px;
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }
        #leaderboard h3 {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        #leaderboard .player-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        #leaderboard .player-row .name {
            font-weight: 400;
        }
        #leaderboard .player-row .score {
            font-weight: 600;
            color: #f9d976;
        }
        #leaderboard .player-row.me {
            color: #4fc3f7;
        }
        #leaderboard .player-row.me .score {
            color: #4fc3f7;
        }

        /* Controls info */
        #controls {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        #controls kbd {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 12px;
        }

        /* Status koneksi */
        #status {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 13px;
            opacity: 0.5;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 16px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* Responsif */
        @media (max-width: 640px) {
            #leaderboard {
                top: 10px;
                right: 10px;
                padding: 10px 14px;
                min-width: 130px;
            }
            #leaderboard h3 {
                font-size: 11px;
            }
            #leaderboard .player-row {
                font-size: 12px;
            }
            #hud .title {
                font-size: 17px;
            }
            #hud .score {
                font-size: 14px;
            }
            #controls {
                font-size: 11px;
                padding: 4px 14px;
                bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div id="hud">
        <div class="title">🍜 Miecrah</div>
        <div class="score">⭐ Skor: <span id="myScore">0</span></div>
        <div class="players-online">👥 <span id="playerCount">0</span> pemain online</div>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboard">
        <h3>🏆 Papan Skor</h3>
        <div id="leaderboardList">
            <div class="player-row" style="opacity:0.3;">Belum ada pemain</div>
        </div>
    </div>

    <!-- Kontrol -->
    <div id="controls">
        <kbd>W A S D</kbd> atau <kbd>↑ ← ↓ →</kbd> untuk bergerak · Kumpulkan bintang ⭐
    </div>

    <div id="status">⏳ Menghubungkan ke Firebase...</div>

    <!-- ===== THREE.JS + FIREBASE ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "firebase-app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase-database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        // ----- Impor Firebase -----
        import { initializeApp } from "firebase-app";
        import { getDatabase, ref, set, push, onValue, update, remove, runTransaction, serverTimestamp } from "firebase-database";

        // ----- Konfigurasi Firebase (dari prompt) -----
        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ----- Status koneksi -----
        const statusEl = document.getElementById('status');
        const connectedRef = ref(db, '.info/connected');
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                statusEl.textContent = '✅ Terhubung ke Firebase';
                statusEl.style.opacity = '0.6';
            } else {
                statusEl.textContent = '❌ Koneksi terputus';
                statusEl.style.opacity = '1';
            }
        });

        // ----- Three.js Impor -----
        import * as THREE from 'three';

        // ----- Konfigurasi Game -----
        const ARENA_SIZE = 14;
        const PLAYER_SPEED = 0.12;
        const COLLECT_DIST = 1.8;
        const STAR_COUNT = 8;
        const PLAYER_RADIUS = 0.6;

        // ----- State Player -----
        const playerId = localStorage.getItem('miecrah_playerId') || 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        localStorage.setItem('miecrah_playerId', playerId);
        const playerName = 'Pemain_' + playerId.substr(-4);

        // ----- Scene Three.js -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f0f1f);
        scene.fog = new THREE.Fog(0x0f0f1f, 18, 30);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(10, 10, 14);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ----- Lighting -----
        const ambient = new THREE.AmbientLight(0x40406b, 0.6);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.8);
        dirLight.position.set(8, 16, 6);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 30;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
        fillLight.position.set(-6, 4, -8);
        scene.add(fillLight);

        // ----- Ground -----
        const groundGeo = new THREE.PlaneGeometry(ARENA_SIZE + 4, ARENA_SIZE + 4);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            roughness: 0.8,
            metalness: 0.1,
            transparent: true,
            opacity: 0.9,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(ARENA_SIZE + 4, 20, 0x4444aa, 0x333366);
        gridHelper.position.y = -0.45;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);

        // ----- Player (karakter sendiri) -----
        const playerGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
        const playerMat = new THREE.MeshStandardMaterial({
            color: 0x4fc3f7,
            emissive: 0x1565c0,
            emissiveIntensity: 0.2,
            roughness: 0.2,
            metalness: 0.6,
        });
        const myPlayerMesh = new THREE.Mesh(playerGeo, playerMat);
        myPlayerMesh.castShadow = true;
        myPlayerMesh.receiveShadow = true;
        myPlayerMesh.position.y = 0;
        scene.add(myPlayerMesh);

        // Glow
        const glowGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x4fc3f7,
            transparent: true,
            opacity: 0.08,
            wireframe: true,
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        myPlayerMesh.add(glow);

        // ----- Pemain lain (disimpan dalam Map) -----
        const otherPlayers = new Map(); // playerId -> { mesh, score, name }

        // ----- Bintang (disimpan dalam Map) -----
        const starMeshes = new Map(); // starId -> { mesh, data }

        // ----- Firebase References -----
        const playersRef = ref(db, 'players');
        const starsRef = ref(db, 'stars');

        // ----- Generate bintang awal jika kosong -----
        function generateStarsIfEmpty() {
            get(starsRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    // Buat bintang
                    const updates = {};
                    for (let i = 0; i < STAR_COUNT; i++) {
                        const id = 'star_' + Date.now() + '_' + i;
                        const x = (Math.random() - 0.5) * (ARENA_SIZE - 2);
                        const z = (Math.random() - 0.5) * (ARENA_SIZE - 2);
                        // Hindari spawn di dekat (0,0)
                        if (Math.abs(x) < 1.5 && Math.abs(z) < 1.5) continue;
                        updates[id] = { x, z, claimed: false };
                    }
                    set(starsRef, updates).then(() => {
                        console.log('⭐ Bintang digenerate di Firebase');
                    });
                }
            });
        }
        generateStarsIfEmpty();

        // ----- Fungsi untuk membuat mesh bintang -----
        function createStarMesh() {
            const group = new THREE.Group();
            const geo = new THREE.OctahedronGeometry(0.5, 0);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xf9d976,
                emissive: 0xf39c12,
                emissiveIntensity: 0.3,
                roughness: 0.2,
                metalness: 0.7,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.scale.set(1, 1.3, 1);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);

            // Ring
            const ringGeo = new THREE.RingGeometry(0.6, 0.8, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xf9d976,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -0.1;
            group.add(ring);

            group.userData = {
                rotSpeed: 0.01 + Math.random() * 0.02,
                floatPhase: Math.random() * Math.PI * 2,
                floatSpeed: 0.6 + Math.random() * 0.4,
                baseY: 0.2,
            };
            return group;
        }

        // ----- Update bintang dari Firebase -----
        onValue(starsRef, (snapshot) => {
            const data = snapshot.val() || {};
            // Hapus bintang yang tidak ada di data
            for (const [id, meshObj] of starMeshes) {
                if (!data[id] || data[id].claimed === true) {
                    scene.remove(meshObj.mesh);
                    starMeshes.delete(id);
                }
            }
            // Tambah atau update bintang
            for (const [id, starData] of Object.entries(data)) {
                if (starData.claimed === true) {
                    // Jika sudah diklaim, hapus dari scene jika ada
                    if (starMeshes.has(id)) {
                        scene.remove(starMeshes.get(id).mesh);
                        starMeshes.delete(id);
                    }
                    continue;
                }
                if (!starMeshes.has(id)) {
                    // Buat bintang baru
                    const mesh = createStarMesh();
                    mesh.position.set(starData.x, 0.2, starData.z);
                    mesh.userData.baseY = 0.2 + Math.random() * 0.3;
                    mesh.userData.floatPhase = Math.random() * Math.PI * 2;
                    scene.add(mesh);
                    starMeshes.set(id, { mesh, data: starData });
                } else {
                    // Update posisi jika berubah (jarang)
                    const existing = starMeshes.get(id);
                    if (existing.data.x !== starData.x || existing.data.z !== starData.z) {
                        existing.mesh.position.set(starData.x, 0.2, starData.z);
                        existing.data = starData;
                    }
                }
            }
        });

        // ----- Update pemain dari Firebase -----
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val() || {};
            // Hapus pemain yang sudah tidak ada
            for (const [id, obj] of otherPlayers) {
                if (!data[id]) {
                    scene.remove(obj.mesh);
                    otherPlayers.delete(id);
                }
            }
            // Update atau tambah pemain
            for (const [id, playerData] of Object.entries(data)) {
                if (id === playerId) continue; // skip sendiri
                if (!otherPlayers.has(id)) {
                    // Buat mesh untuk pemain lain
                    const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.6);
                    const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                    const mat = new THREE.MeshStandardMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.1,
                        roughness: 0.3,
                        metalness: 0.3,
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.position.set(playerData.x || 0, 0, playerData.z || 0);
                    scene.add(mesh);
                    otherPlayers.set(id, {
                        mesh,
                        name: playerData.name || 'Anonim',
                        score: playerData.score || 0,
                    });
                } else {
                    // Update posisi
                    const obj = otherPlayers.get(id);
                    obj.mesh.position.set(playerData.x || 0, 0, playerData.z || 0);
                    obj.score = playerData.score || 0;
                    obj.name = playerData.name || 'Anonim';
                }
            }
            // Update jumlah pemain
            document.getElementById('playerCount').textContent = Object.keys(data).length;

            // Update leaderboard
            updateLeaderboard(data);
        });

        // ----- Leaderboard -----
        function updateLeaderboard(data) {
            const list = document.getElementById('leaderboardList');
            const entries = Object.entries(data)
                .map(([id, p]) => ({ id, name: p.name || 'Anonim', score: p.score || 0 }))
                .sort((a, b) => b.score - a.score);

            if (entries.length === 0) {
                list.innerHTML = '<div class="player-row" style="opacity:0.3;">Belum ada pemain</div>';
                return;
            }

            let html = '';
            for (const entry of entries) {
                const isMe = entry.id === playerId;
                html += `
                    <div class="player-row ${isMe ? 'me' : ''}">
                        <span class="name">${entry.name} ${isMe ? '(kamu)' : ''}</span>
                        <span class="score">${entry.score}</span>
                    </div>
                `;
            }
            list.innerHTML = html;
        }

        // ----- Fungsi klaim bintang (transaction) -----
        function claimStar(starId) {
            const starRef = ref(db, `stars/${starId}`);
            runTransaction(starRef, (currentData) => {
                if (currentData === null || currentData.claimed === true) {
                    return; // tidak ada atau sudah diklaim
                }
                // Klaim bintang
                currentData.claimed = true;
                return currentData;
            }).then((result) => {
                if (result.committed) {
                    // Berhasil klaim, tambah skor
                    const playerRef = ref(db, `players/${playerId}`);
                    runTransaction(playerRef, (currentData) => {
                        if (currentData === null) {
                            return { score: 1, name: playerName, x: 0, z: 0 };
                        }
                        currentData.score = (currentData.score || 0) + 1;
                        return currentData;
                    }).then(() => {
                        // Efek visual
                        myPlayerMesh.material.emissiveIntensity = 0.8;
                        setTimeout(() => {
                            myPlayerMesh.material.emissiveIntensity = 0.2;
                        }, 150);
                    });
                } else {
                    // Gagal klaim (bintang sudah diambil)
                    console.log('⭐ Bintang sudah diambil pemain lain');
                }
            }).catch((err) => {
                console.warn('Gagal klaim bintang:', err);
            });
        }

        // ----- Deteksi koleksi bintang (setiap frame) -----
        function checkStarCollection() {
            const myPos = myPlayerMesh.position;
            for (const [id, obj] of starMeshes) {
                const starPos = obj.mesh.position;
                const dist = myPos.distanceTo(starPos);
                if (dist < COLLECT_DIST) {
                    // Coba klaim bintang ini
                    claimStar(id);
                    // Hanya satu per frame
                    break;
                }
            }
        }

        // ----- Keyboard & Touch controls -----
        const keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true;
            if (key === 'a') keys.a = true;
            if (key === 's') keys.s = true;
            if (key === 'd') keys.d = true;
            if (key === 'arrowup') keys.up = true;
            if (key === 'arrowdown') keys.down = true;
            if (key === 'arrowleft') keys.left = true;
            if (key === 'arrowright') keys.right = true;
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
            if (key === 'arrowup') keys.up = false;
            if (key === 'arrowdown') keys.down = false;
            if (key === 'arrowleft') keys.left = false;
            if (key === 'arrowright') keys.right = false;
        });

        // Touch controls
        let touchX = null,
            touchY = null;
        const touchArea = renderer.domElement;
        touchArea.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            touchX = t.clientX;
            touchY = t.clientY;
        }, { passive: true });
        touchArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const dx = t.clientX - touchX;
            const dy = t.clientY - touchY;
            const threshold = 15;
            keys.left = dx < -threshold;
            keys.right = dx > threshold;
            keys.up = dy < -threshold;
            keys.down = dy > threshold;
            touchX = t.clientX;
            touchY = t.clientY;
        }, { passive: false });
        touchArea.addEventListener('touchend', () => {
            keys.left = false;
            keys.right = false;
            keys.up = false;
            keys.down = false;
            touchX = null;
            touchY = null;
        }, { passive: true });

        // ----- Update posisi pemain di Firebase (throttle) -----
        let lastUpdateTime = 0;

        function updatePlayerPosition() {
            const now = Date.now();
            if (now - lastUpdateTime < 80) return; // throttle 80ms
            lastUpdateTime = now;

            const pos = myPlayerMesh.position;
            const playerRef = ref(db, `players/${playerId}`);
            // Set data dengan merge
            update(playerRef, {
                x: pos.x,
                z: pos.z,
                score: parseInt(document.getElementById('myScore').textContent) || 0,
                name: playerName,
                lastActive: serverTimestamp(),
            }).catch((err) => console.warn('Gagal update posisi:', err));
        }

        // ----- Inisialisasi pemain di Firebase -----
        function initPlayer() {
            const playerRef = ref(db, `players/${playerId}`);
            // Cek apakah sudah ada
            get(playerRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    set(playerRef, {
                        x: 0,
                        z: 0,
                        score: 0,
                        name: playerName,
                        lastActive: serverTimestamp(),
                    });
                } else {
                    // Update posisi
                    update(playerRef, {
                        lastActive: serverTimestamp(),
                    });
                }
            });
        }
        initPlayer();

        // ----- Cleanup saat keluar (tidak wajib) -----
        window.addEventListener('beforeunload', () => {
            // Hapus pemain dari Firebase (optional)
            // Jika dihapus, pemain lain tidak akan melihatnya
            // Kita biarkan saja agar data tetap ada, tapi kita set lastActive agar bisa di-filter
            const playerRef = ref(db, `players/${playerId}`);
            update(playerRef, { lastActive: serverTimestamp() });
        });

        // ----- Resize -----
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----- Animasi Loop -----
        function animate() {
            requestAnimationFrame(animate);

            // ----- Gerakan player -----
            let dx = 0,
                dz = 0;
            if (keys.w || keys.up) dz = -1;
            if (keys.s || keys.down) dz = 1;
            if (keys.a || keys.left) dx = -1;
            if (keys.d || keys.right) dx = 1;

            if (dx !== 0 && dz !== 0) {
                dx *= 0.707;
                dz *= 0.707;
            }

            const newX = myPlayerMesh.position.x + dx * PLAYER_SPEED;
            const newZ = myPlayerMesh.position.z + dz * PLAYER_SPEED;
            const limit = ARENA_SIZE / 2 - 0.5;
            myPlayerMesh.position.x = Math.max(-limit, Math.min(limit, newX));
            myPlayerMesh.position.z = Math.max(-limit, Math.min(limit, newZ));

            if (dx !== 0 || dz !== 0) {
                const angle = Math.atan2(dx, dz);
                myPlayerMesh.rotation.y = angle;
            }

            // Update posisi ke Firebase
            updatePlayerPosition();

            // Deteksi koleksi bintang
            checkStarCollection();

            // Update skor lokal
            const playerRef = ref(db, `players/${playerId}`);
            get(playerRef).then((snap) => {
                if (snap.exists()) {
                    const score = snap.val().score || 0;
                    document.getElementById('myScore').textContent = score;
                }
            });

            // ----- Animasi bintang -----
            const time = performance.now() / 1000;
            for (const [id, obj] of starMeshes) {
                const mesh = obj.mesh;
                const ud = mesh.userData;
                mesh.rotation.x += ud.rotSpeed * 0.5;
                mesh.rotation.y += ud.rotSpeed;
                mesh.rotation.z += ud.rotSpeed * 0.3;
                const floatOffset = Math.sin(time * ud.floatSpeed + ud.floatPhase) * 0.2;
                mesh.position.y = ud.baseY + floatOffset;
            }

            // Animasi pemain lain (bounce kecil)
            for (const [id, obj] of otherPlayers) {
                const mesh = obj.mesh;
                mesh.position.y = Math.sin(time * 2 + id.length) * 0.05;
            }

            // Animasi player sendiri
            myPlayerMesh.position.y = Math.sin(time * 3) * 0.03;
            glow.rotation.x = time * 0.5;
            glow.rotation.y = time * 0.7;

            // Kamera mengikuti player
            const targetCamPos = new THREE.Vector3(
                myPlayerMesh.position.x + 10,
                10,
                myPlayerMesh.position.z + 14
            );
            camera.position.lerp(targetCamPos, 0.03);
            camera.lookAt(myPlayerMesh.position.x * 0.3, 0, myPlayerMesh.position.z * 0.3);

            renderer.render(scene, camera);
        }

        animate();

        // ----- Mulai -----
        console.log(`🍜 Miecrah Multiplayer dimulai! ID: ${playerId}`);
        console.log(`👥 Buka di perangkat lain dengan URL yang sama untuk bermain bersama.`);
    </script>
</body>
</html>
