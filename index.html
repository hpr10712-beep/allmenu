<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV Motion Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px 4px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #222;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
        }
        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            transition: 0.2s;
        }
        .led.motion {
            background: #ff3333;
            box-shadow: 0 0 20px #ff3333;
            animation: blink 0.3s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            border: 2px solid #2a2a2a;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            padding: 12px 4px 4px 4px;
            font-size: 13px;
            color: #aaa;
        }
        .log-area {
            margin-top: 12px;
            background: #0f0f0f;
            border-radius: 12px;
            padding: 12px;
            max-height: 100px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid #2a2a2a;
            color: #0f0;
        }
        .log-area::-webkit-scrollbar { width: 4px; }
        .log-area::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            background: #333;
            color: #fff;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
        }
        .btn-primary:active { transform: scale(0.95); }
        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
        }
        .btn-danger:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1>📹 CCTV Pro</h1>
        <div class="status-badge">
            <span class="led" id="ledIndicator"></span>
            <span id="statusText">SIAGA</span>
        </div>
    </div>

    <!-- PLAYER -->
    <div class="video-wrapper">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- INFO -->
    <div class="info-panel">
        <span>📊 Piksel bergerak: <strong id="motionPercent">0%</strong></span>
        <span>⏱️ <span id="timestamp">--:--:--</span></span>
    </div>

    <!-- LOG -->
    <div class="log-area" id="logArea">
        ✅ Sistem siap. Menunggu gerakan...
    </div>

    <!-- BUTTONS -->
    <div class="btn-group">
        <button class="btn btn-primary" id="btnStart">▶ Mulai</button>
        <button class="btn btn-danger" id="btnClear">🗑 Bersihkan Log</button>
    </div>
</div>

<script>
    (function() {
        // --- ELEMENTS ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const led = document.getElementById('ledIndicator');
        const statusText = document.getElementById('statusText');
        const motionPercent = document.getElementById('motionPercent');
        const timestamp = document.getElementById('timestamp');
        const logArea = document.getElementById('logArea');

        // --- STATE ---
        let isRunning = false;
        let lastFrame = null; // ImageData grayscale
        let frameCount = 0;
        const MOTION_THRESHOLD = 0.012; // 1.2% piksel berubah = motion
        const MIN_MOTION_FRAMES = 2; // butuh 2 frame berturut-turut
        let motionCounter = 0;
        let isMotionDetected = false;

        // --- UKURAN CANVAS ---
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.floor(rect.width * 0.6); // resize 60% untuk performa
            canvas.height = Math.floor(rect.height * 0.6);
        }
        window.addEventListener('resize', resizeCanvas);

        // --- LOG FUNCTION ---
        function addLog(msg, isAlert = false) {
            const prefix = isAlert ? '🚨' : '📌';
            const time = new Date().toLocaleTimeString('id-ID');
            logArea.innerHTML += `<div>${prefix} [${time}] ${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
            // limit log
            if (logArea.children.length > 50) {
                logArea.removeChild(logArea.firstChild);
            }
        }

        // --- KONVERSI GRAYSCALE (ImageData -> Uint8Array) ---
        function toGrayscale(imageData) {
            const data = imageData.data;
            const gray = new Uint8Array(data.length / 4);
            for (let i = 0, j = 0; i < data.length; i += 4, j++) {
                gray[j] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
            }
            return gray;
        }

        // --- DETEKSI GERAKAN ---
        function detectMotion(currentGray, width, height) {
            if (!lastFrame) {
                lastFrame = currentGray;
                return false;
            }

            let diffPixels = 0;
            const threshold = 25; // nilai intensitas (0-255)
            const len = currentGray.length;

            // Bandingkan pixel per pixel
            for (let i = 0; i < len; i++) {
                const diff = Math.abs(currentGray[i] - lastFrame[i]);
                if (diff > threshold) {
                    diffPixels++;
                }
            }

            const total = len;
            const percent = (diffPixels / total);
            motionPercent.textContent = (percent * 100).toFixed(2) + '%';

            // Update last frame
            lastFrame = currentGray;

            return percent > MOTION_THRESHOLD;
        }

        // --- DRAW BOUNDING BOX & MOTION VISUAL ---
        function drawMotionOverlay(motion) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (motion) {
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 4;
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 20;
                ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
                ctx.shadowBlur = 0;
                // Text
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('⚠️ GERAKAN', 20, 50);
            }
        }

        // --- MAIN LOOP (dipanggil setiap frame) ---
        function processFrame() {
            if (!isRunning) return;

            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            if (videoWidth === 0 || videoHeight === 0) {
                requestAnimationFrame(processFrame);
                return;
            }

            // Draw video ke canvas (ukuran kecil)
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const gray = toGrayscale(imageData);

            // Deteksi
            const motion = detectMotion(gray, canvas.width, canvas.height);
            
            if (motion) {
                motionCounter++;
            } else {
                motionCounter = 0;
            }

            // Tentukan status
            const isMotionConfirmed = motionCounter >= MIN_MOTION_FRAMES;
            
            if (isMotionConfirmed && !isMotionDetected) {
                isMotionDetected = true;
                led.className = 'led motion';
                statusText.textContent = 'GERAKAN!';
                statusText.style.color = '#ff3333';
                addLog('🚨 Gerakan terdeteksi!', true);
            } else if (!isMotionConfirmed && isMotionDetected) {
                isMotionDetected = false;
                led.className = 'led';
                statusText.textContent = 'SIAGA';
                statusText.style.color = '#00ff88';
                addLog('✅ Kembali aman (tidak ada gerakan)');
            }

            // Update timestamp
            timestamp.textContent = new Date().toLocaleTimeString('id-ID');

            // Gambar overlay visual
            drawMotionOverlay(isMotionConfirmed);

            requestAnimationFrame(processFrame);
        }

        // --- MULAI KAMERA ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                
                resizeCanvas();
                lastFrame = null; // reset deteksi
                isRunning = true;
                addLog('📷 Kamera aktif. Resolusi: ' + video.videoWidth + 'x' + video.videoHeight);
                document.getElementById('btnStart').textContent = '⏹ Berhenti';
                
                requestAnimationFrame(processFrame);
            } catch (err) {
                alert('Gagal akses kamera: ' + err.message);
                addLog('❌ Error: ' + err.message);
            }
        }

        function stopCamera() {
            isRunning = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            led.className = 'led';
            statusText.textContent = 'STOP';
            statusText.style.color = '#888';
            document.getElementById('btnStart').textContent = '▶ Mulai';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            addLog('⏹ Sistem dihentikan.');
        }

        // --- BUTTON HANDLER ---
        document.getElementById('btnStart').addEventListener('click', function() {
            if (isRunning) {
                stopCamera();
            } else {
                startCamera();
            }
        });

        document.getElementById('btnClear').addEventListener('click', function() {
            logArea.innerHTML = '<div>🗑 Log dibersihkan.</div>';
        });

        // --- INIT ---
        led.className = 'led';
        statusText.textContent = 'SIAGA';
        addLog('🔧 Aplikasi siap. Tekan "Mulai" untuk mengaktifkan CCTV.');
    })();
</script>
</body>
</html>
