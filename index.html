<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Game 3D - Koleksi Bintang</title>
    <style>
        /* Reset & styling dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a1a;
            user-select: none;
        }
        canvas {
            display: block;
        }

        /* HUD Skor & Info */
        #hud {
            position: fixed;
            top: 25px;
            left: 30px;
            color: #fff;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }
        #hud .score-label {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.7;
        }
        #hud .score-value {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        #hud .target {
            font-size: 16px;
            font-weight: 300;
            margin-top: 4px;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        /* Pesan Menang */
        #win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            z-index: 20;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
        }
        #win-message.show {
            opacity: 1;
        }
        #win-message h1 {
            font-size: 72px;
            font-weight: 800;
            background: linear-gradient(135deg, #f9d976, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        #win-message p {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 3px;
            opacity: 0.8;
        }
        #win-message .sub {
            font-size: 16px;
            margin-top: 12px;
            opacity: 0.5;
        }

        /* Tombol restart (muncul setelah menang) */
        #restart-btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        #restart-btn.show {
            opacity: 1;
            pointer-events: auto;
        }
        #restart-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateX(-50%) scale(1.04);
            border-color: rgba(255, 215, 0, 0.5);
        }

        /* Kontrol info */
        #controls-info {
            position: fixed;
            bottom: 30px;
            right: 30px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            text-align: right;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            line-height: 1.6;
        }
        #controls-info kbd {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
        }

        /* Responsif */
        @media (max-width: 600px) {
            #hud .score-value {
                font-size: 40px;
            }
            #win-message h1 {
                font-size: 44px;
            }
            #controls-info {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div id="hud">
        <div class="score-label">⭐ SKOR</div>
        <div class="score-value" id="scoreDisplay">0</div>
        <div class="target">Target: <span id="targetDisplay">10</span> bintang</div>
    </div>

    <!-- Pesan Menang -->
    <div id="win-message">
        <h1>🎉 SELAMAT!</h1>
        <p>Kamu mengumpulkan semua bintang!</p>
        <div class="sub">✨ Luar biasa! ✨</div>
    </div>

    <!-- Tombol Restart -->
    <button id="restart-btn">🔄 Main Lagi</button>

    <!-- Info Kontrol -->
    <div id="controls-info">
        <kbd>W A S D</kbd> atau <kbd>↑ ← ↓ →</kbd> untuk bergerak
    </div>

    <!-- ========== THREE.JS GAME ========== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        // ----- Impor -----
        import * as THREE from 'three';

        // ----- Konfigurasi -----
        const TARGET_SCORE = 10;
        const PLAYER_SPEED = 0.12;
        const COLLECT_DISTANCE = 1.6;
        const STAR_COUNT = 12;
        const ARENA_SIZE = 14;

        // ----- State -----
        let score = 0;
        let gameOver = false;
        let stars = [];
        let starPositions = [];

        // ----- DOM refs -----
        const scoreDisplay = document.getElementById('scoreDisplay');
        const targetDisplay = document.getElementById('targetDisplay');
        const winMessage = document.getElementById('win-message');
        const restartBtn = document.getElementById('restart-btn');

        targetDisplay.textContent = TARGET_SCORE;

        // ----- Scene -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 18, 30);

        // ----- Camera -----
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.set(10, 10, 14);
        camera.lookAt(0, 0, 0);

        // ----- Renderer -----
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ----- Lighting -----

        // Ambient
        const ambient = new THREE.AmbientLight(0x40406b, 0.5);
        scene.add(ambient);

        // Main directional
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.8);
        dirLight.position.set(8, 16, 6);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 30;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        scene.add(dirLight);

        // Fill light
        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
        fillLight.position.set(-6, 4, -8);
        scene.add(fillLight);

        // Rim light
        const rimLight = new THREE.DirectionalLight(0xffaa66, 0.3);
        rimLight.position.set(-4, 2, 10);
        scene.add(rimLight);

        // ----- Ground -----
        const groundGeo = new THREE.PlaneGeometry(ARENA_SIZE + 4, ARENA_SIZE + 4);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            roughness: 0.8,
            metalness: 0.1,
            transparent: true,
            opacity: 0.9,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        // ----- Grid (dekoratif) -----
        const gridHelper = new THREE.GridHelper(ARENA_SIZE + 4, 20, 0x4444aa, 0x333366);
        gridHelper.position.y = -0.45;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);

        // ----- Arena Border (cahaya tepi) -----
        const borderPoints = [
            [-ARENA_SIZE / 2, -ARENA_SIZE / 2],
            [ARENA_SIZE / 2, -ARENA_SIZE / 2],
            [ARENA_SIZE / 2, ARENA_SIZE / 2],
            [-ARENA_SIZE / 2, ARENA_SIZE / 2],
            [-ARENA_SIZE / 2, -ARENA_SIZE / 2],
        ];
        const borderCurve = new THREE.CatmullRomCurve3(
            borderPoints.map(p => new THREE.Vector3(p[0], -0.4, p[1]))
        );
        const borderTube = new THREE.TubeGeometry(borderCurve, 60, 0.06, 8, false);
        const borderMat = new THREE.MeshStandardMaterial({
            color: 0x6666ff,
            emissive: 0x4444aa,
            emissiveIntensity: 0.3,
            transparent: true,
            opacity: 0.5,
        });
        const borderMesh = new THREE.Mesh(borderTube, borderMat);
        scene.add(borderMesh);

        // ----- Player -----
        const playerGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
        const playerMat = new THREE.MeshStandardMaterial({
            color: 0x4fc3f7,
            emissive: 0x1565c0,
            emissiveIntensity: 0.15,
            roughness: 0.2,
            metalness: 0.6,
        });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.castShadow = true;
        player.receiveShadow = true;
        player.position.y = 0.0;
        scene.add(player);

        // Player glow (inner)
        const glowGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x4fc3f7,
            transparent: true,
            opacity: 0.08,
            wireframe: true,
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        player.add(glow);

        // ----- Stars -----
        function createStar() {
            const group = new THREE.Group();

            // Badan bintang (octahedron)
            const geo = new THREE.OctahedronGeometry(0.55, 0);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xf9d976,
                emissive: 0xf39c12,
                emissiveIntensity: 0.25,
                roughness: 0.2,
                metalness: 0.7,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.scale.set(1, 1.3, 1);
            group.add(mesh);

            // Glow ring
            const ringGeo = new THREE.RingGeometry(0.7, 0.9, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xf9d976,
                transparent: true,
                opacity: 0.15,
                side: THREE.DoubleSide,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -0.1;
            group.add(ring);

            // Pivot point (untuk animasi)
            group.userData = {
                rotSpeed: 0.01 + Math.random() * 0.02,
                floatPhase: Math.random() * Math.PI * 2,
                floatSpeed: 0.6 + Math.random() * 0.4,
                baseY: 0,
            };

            return group;
        }

        function spawnStars() {
            // Hapus bintang lama
            stars.forEach(s => scene.remove(s));
            stars = [];
            starPositions = [];

            for (let i = 0; i < STAR_COUNT; i++) {
                const star = createStar();
                let x, z, valid;
                let attempts = 0;
                do {
                    x = (Math.random() - 0.5) * (ARENA_SIZE - 1.5);
                    z = (Math.random() - 0.5) * (ARENA_SIZE - 1.5);
                    valid = true;
                    // Jangan spawn di dekat player start (0,0)
                    if (Math.abs(x) < 1.8 && Math.abs(z) < 1.8) valid = false;
                    // Jangan terlalu dekat dengan bintang lain
                    for (const pos of starPositions) {
                        if (Math.sqrt((x - pos.x) ** 2 + (z - pos.z) ** 2) < 1.4) {
                            valid = false;
                            break;
                        }
                    }
                    attempts++;
                    if (attempts > 100) break;
                } while (!valid);

                star.position.set(x, 0.2, z);
                star.userData.baseY = 0.2 + Math.random() * 0.3;
                star.userData.floatPhase = Math.random() * Math.PI * 2;
                scene.add(star);
                stars.push(star);
                starPositions.push({ x, z });
            }
        }

        spawnStars();

        // ----- Keyboard controls -----
        const keys = { w: false, a: false, s: false, d: false, up: false, down: false, left: false, right: false };

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = true;
            if (key === 'a') keys.a = true;
            if (key === 's') keys.s = true;
            if (key === 'd') keys.d = true;
            if (key === 'arrowup') keys.up = true;
            if (key === 'arrowdown') keys.down = true;
            if (key === 'arrowleft') keys.left = true;
            if (key === 'arrowright') keys.right = true;
            // Mencegah scroll dengan arrow
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keys.w = false;
            if (key === 'a') keys.a = false;
            if (key === 's') keys.s = false;
            if (key === 'd') keys.d = false;
            if (key === 'arrowup') keys.up = false;
            if (key === 'arrowdown') keys.down = false;
            if (key === 'arrowleft') keys.left = false;
            if (key === 'arrowright') keys.right = false;
        });

        // ----- Touch / Mobile controls (sederhana) -----
        let touchX = null;
        let touchY = null;
        const touchArea = renderer.domElement;

        touchArea.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            touchX = t.clientX;
            touchY = t.clientY;
        }, { passive: true });

        touchArea.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            const dx = t.clientX - touchX;
            const dy = t.clientY - touchY;
            // Map touch delta ke tombol
            const threshold = 15;
            keys.left = dx < -threshold;
            keys.right = dx > threshold;
            keys.up = dy < -threshold;
            keys.down = dy > threshold;
            touchX = t.clientX;
            touchY = t.clientY;
        }, { passive: false });

        touchArea.addEventListener('touchend', () => {
            keys.left = false;
            keys.right = false;
            keys.up = false;
            keys.down = false;
            touchX = null;
            touchY = null;
        }, { passive: true });

        // ----- Game logic -----
        function collectStar(star) {
            scene.remove(star);
            const idx = stars.indexOf(star);
            if (idx !== -1) {
                stars.splice(idx, 1);
                starPositions.splice(idx, 1);
            }
            score++;
            scoreDisplay.textContent = score;

            // Efek visual: flash player
            player.material.emissiveIntensity = 0.8;
            setTimeout(() => {
                player.material.emissiveIntensity = 0.15;
            }, 150);

            // Efek partikel sederhana (ledakan kecil)
            createCollectParticles(star.position.clone());

            if (score >= TARGET_SCORE) {
                gameOver = true;
                winMessage.classList.add('show');
                restartBtn.classList.add('show');
            } else {
                // Respawn bintang baru di posisi acak
                setTimeout(() => {
                    if (!gameOver) {
                        const newStar = createStar();
                        let x, z, valid;
                        let attempts = 0;
                        do {
                            x = (Math.random() - 0.5) * (ARENA_SIZE - 1.5);
                            z = (Math.random() - 0.5) * (ARENA_SIZE - 1.5);
                            valid = true;
                            if (Math.abs(x) < 1.8 && Math.abs(z) < 1.8) valid = false;
                            for (const pos of starPositions) {
                                if (Math.sqrt((x - pos.x) ** 2 + (z - pos.z) ** 2) < 1.4) {
                                    valid = false;
                                    break;
                                }
                            }
                            attempts++;
                            if (attempts > 100) break;
                        } while (!valid);
                        newStar.position.set(x, 0.2, z);
                        newStar.userData.baseY = 0.2 + Math.random() * 0.3;
                        newStar.userData.floatPhase = Math.random() * Math.PI * 2;
                        scene.add(newStar);
                        stars.push(newStar);
                        starPositions.push({ x, z });
                    }
                }, 300);
            }
        }

        // ----- Particle effect (sederhana) -----
        function createCollectParticles(position) {
            const count = 20;
            const colors = [0xf9d976, 0xf39c12, 0xff6b6b, 0x4fc3f7];
            for (let i = 0; i < count; i++) {
                const size = 0.05 + Math.random() * 0.12;
                const geo = new THREE.SphereGeometry(size, 6, 6);
                const mat = new THREE.MeshStandardMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    emissive: 0xffaa00,
                    emissiveIntensity: 0.5,
                });
                const p = new THREE.Mesh(geo, mat);
                p.position.copy(position);
                p.position.y += 0.2;
                const dir = new THREE.Vector3(
                    (Math.random() - 0.5) * 4,
                    Math.random() * 3 + 1,
                    (Math.random() - 0.5) * 4
                ).normalize().multiplyScalar(0.8 + Math.random() * 1.2);
                p.userData.vel = dir;
                p.userData.life = 1.0;
                scene.add(p);

                // Animasi partikel akan di-update di loop
                // Simpan dalam array global
                if (!window._particles) window._particles = [];
                window._particles.push(p);
            }
        }

        // ----- Update partikel -----
        function updateParticles() {
            if (!window._particles) return;
            const toRemove = [];
            for (let i = 0; i < window._particles.length; i++) {
                const p = window._particles[i];
                p.position.add(p.userData.vel);
                p.userData.vel.y -= 0.06;
                p.userData.life -= 0.012;
                p.scale.setScalar(p.userData.life);
                p.material.transparent = true;
                p.material.opacity = p.userData.life;
                if (p.userData.life <= 0) {
                    toRemove.push(i);
                }
            }
            for (let i = toRemove.length - 1; i >= 0; i--) {
                const idx = toRemove[i];
                scene.remove(window._particles[idx]);
                window._particles.splice(idx, 1);
            }
        }

        // ----- Reset game -----
        function resetGame() {
            // Hapus semua bintang
            stars.forEach(s => scene.remove(s));
            stars = [];
            starPositions = [];

            // Reset skor
            score = 0;
            scoreDisplay.textContent = '0';
            gameOver = false;
            winMessage.classList.remove('show');
            restartBtn.classList.remove('show');

            // Reset player pos
            player.position.set(0, 0, 0);

            // Hapus partikel
            if (window._particles) {
                window._particles.forEach(p => scene.remove(p));
                window._particles = [];
            }

            // Spawn ulang bintang
            spawnStars();

            // Reset material player
            player.material.emissiveIntensity = 0.15;
        }

        restartBtn.addEventListener('click', resetGame);

        // ----- Window resize -----
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----- Animasi loop -----
        function animate() {
            requestAnimationFrame(animate);

            // ----- Gerakan player -----
            if (!gameOver) {
                let dx = 0,
                    dz = 0;
                if (keys.w || keys.up) dz = -1;
                if (keys.s || keys.down) dz = 1;
                if (keys.a || keys.left) dx = -1;
                if (keys.d || keys.right) dx = 1;

                // Normalisasi
                if (dx !== 0 && dz !== 0) {
                    dx *= 0.707;
                    dz *= 0.707;
                }

                const newX = player.position.x + dx * PLAYER_SPEED;
                const newZ = player.position.z + dz * PLAYER_SPEED;

                // Batas arena
                const limit = ARENA_SIZE / 2 - 0.5;
                player.position.x = Math.max(-limit, Math.min(limit, newX));
                player.position.z = Math.max(-limit, Math.min(limit, newZ));

                // Rotasi player mengikuti arah
                if (dx !== 0 || dz !== 0) {
                    const angle = Math.atan2(dx, dz);
                    player.rotation.y = angle;
                }

                // ----- Deteksi koleksi -----
                const pPos = player.position;
                for (let i = stars.length - 1; i >= 0; i--) {
                    const star = stars[i];
                    const dist = pPos.distanceTo(star.position);
                    if (dist < COLLECT_DISTANCE) {
                        collectStar(star);
                        break; // hanya satu per frame
                    }
                }
            }

            // ----- Animasi bintang -----
            const time = performance.now() / 1000;
            for (const star of stars) {
                const ud = star.userData;
                star.rotation.x += ud.rotSpeed * 0.5;
                star.rotation.y += ud.rotSpeed;
                star.rotation.z += ud.rotSpeed * 0.3;
                // Floating
                const floatOffset = Math.sin(time * ud.floatSpeed + ud.floatPhase) * 0.2;
                star.position.y = ud.baseY + floatOffset;
            }

            // ----- Animasi player (bounce ringan) -----
            if (!gameOver) {
                const bob = Math.sin(time * 3) * 0.03;
                player.position.y = bob;
                glow.rotation.x = time * 0.5;
                glow.rotation.y = time * 0.7;
            }

            // ----- Update partikel -----
            updateParticles();

            // ----- Kamera mengikuti player (sedikit) -----
            const targetCamPos = new THREE.Vector3(
                player.position.x + 10,
                10,
                player.position.z + 14
            );
            camera.position.lerp(targetCamPos, 0.03);
            camera.lookAt(player.position.x * 0.3, 0, player.position.z * 0.3);

            // ----- Render -----
            renderer.render(scene, camera);
        }

        animate();

        // ----- Mulai dengan mulus -----
        console.log('🎮 Game 3D Koleksi Bintang siap!');
        console.log(`⭐ Kumpulkan ${TARGET_SCORE} bintang untuk menang!`);
        console.log('🕹️  Gunakan WASD atau panah untuk bergerak.');

        // Jika pengguna memencet tombol restart di awal (tidak sengaja), aman
        // Inisialisasi window._particles
        if (!window._particles) window._particles = [];

        console.log('✅ Game loaded successfully!');
    </script>
</body>
</html>
