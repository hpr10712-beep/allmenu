<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV AI Pro</title>
    <!-- TensorFlow & COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e6edf3;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #151b23;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid #2d333b;
        }
        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #2d333b;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .header h1 span {
            color: #00d4ff;
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #212830;
            padding: 5px 14px 5px 10px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3fb950;
            transition: 0.2s;
        }
        .dot.warning { background: #d29922; }
        .dot.danger { background: #f85149; }
        .dot.inactive { background: #484f58; }

        /* VIDEO WRAPPER */
        .video-wrapper {
            position: relative;
            margin-top: 16px;
            border-radius: 18px;
            overflow: hidden;
            background: #010409;
            aspect-ratio: 16 / 9;
            border: 1px solid #30363d;
        }
        #displayCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }
        /* HUD */
        .hud {
            position: absolute;
            bottom: 12px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            color: #8b949e;
            background: rgba(21, 27, 35, 0.7);
            backdrop-filter: blur(6px);
            padding: 7px 14px;
            border-radius: 12px;
            border: 1px solid #30363d55;
            pointer-events: none;
        }
        .hud-left, .hud-right { display: flex; gap: 16px; }
        .hud .val { color: #f0f6fc; }
        .hud .val.warn { color: #f0883e; }

        /* INFO GRID */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 16px;
        }
        .info-card {
            background: #0d1117;
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            border: 1px solid #212830;
        }
        .info-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #8b949e;
        }
        .info-card .value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 5px;
            font-variant-numeric: tabular-nums;
            color: #f0f6fc;
        }
        .info-card .value.alert { color: #f0883e; }
        .info-card .value.danger { color: #f85149; }
        .info-card .value.success { color: #3fb950; }

        /* LOG */
        .log-box {
            margin-top: 14px;
            background: #0d1117;
            border-radius: 14px;
            padding: 10px 14px;
            max-height: 70px;
            overflow-y: auto;
            font-size: 12px;
            font-family: 'SF Mono', 'Courier New', monospace;
            color: #8b949e;
            border: 1px solid #212830;
            line-height: 1.7;
        }
        .log-box::-webkit-scrollbar { width: 3px; }
        .log-box::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
        .log-alert { color: #f0883e; }
        .log-danger { color: #f85149; }

        /* BUTTONS */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #212830;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
        }
        .btn-primary:hover { background: #388bfd; }
        .btn-primary:disabled { opacity: 0.5; cursor: default; }
        .btn-success {
            background: #238636;
            border-color: #238636;
            color: #fff;
        }
        .btn-success:hover { background: #2ea043; }
        .btn-danger {
            background: #da3633;
            border-color: #da3633;
            color: #fff;
        }
        .btn-danger:hover { background: #f85149; }
        .btn-outline {
            background: transparent;
            border-color: #30363d;
        }
        .btn-outline:hover { background: #212830; }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1>📹 <span>CCTV</span> AI</h1>
        <div class="status-pill">
            <span class="dot" id="statusDot"></span>
            <span id="statusLabel">SIAGA</span>
        </div>
    </div>

    <!-- VIDEO -->
    <div class="video-wrapper">
        <canvas id="displayCanvas"></canvas>
        <video id="sourceVideo" autoplay playsinline style="display:none;"></video>
        <div class="hud">
            <div class="hud-left">
                <span>👤 <span class="val" id="humanCount">0</span></span>
                <span>⚡ <span class="val" id="fpsDisplay">0</span> FPS</span>
            </div>
            <div class="hud-right">
                <span>⏱ <span class="val" id="recTimeDisplay">IDLE</span></span>
            </div>
        </div>
    </div>

    <!-- INFO GRID -->
    <div class="info-grid">
        <div class="info-card">
            <div class="label">Resolusi</div>
            <div class="value" id="resDisplay">--x--</div>
        </div>
        <div class="info-card">
            <div class="label">Inferensi AI</div>
            <div class="value" id="inferDisplay">0 ms</div>
        </div>
        <div class="info-card">
            <div class="label">Konfidensi</div>
            <div class="value" id="confDisplay">0%</div>
        </div>
    </div>

    <!-- LOG -->
    <div class="log-box" id="logArea">
        > Sistem siap. Tekan "Mulai".
    </div>

    <!-- BUTTONS -->
    <div class="btn-group">
        <button class="btn btn-primary" id="btnStart">▶ Mulai</button>
        <button class="btn btn-success" id="btnDownload">⬇ Unduh</button>
        <button class="btn btn-outline" id="btnClear">✕ Bersih</button>
    </div>
</div>

<script>
    (function() {
        // --- DOM ---
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const logArea = document.getElementById('logArea');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const humanCount = document.getElementById('humanCount');
        const fpsDisplay = document.getElementById('fpsDisplay');
        const resDisplay = document.getElementById('resDisplay');
        const inferDisplay = document.getElementById('inferDisplay');
        const confDisplay = document.getElementById('confDisplay');
        const recTimeDisplay = document.getElementById('recTimeDisplay');
        const btnStart = document.getElementById('btnStart');
        const btnDownload = document.getElementById('btnDownload');
        const btnClear = document.getElementById('btnClear');

        // --- STATE ---
        let isRunning = false;
        let model = null;
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingStartTime = 0;
        let animFrameId = null;
        let detectionTimerId = null;

        // Statistik
        let frameCount = 0;
        let fps = 0;
        let lastFpsUpdate = performance.now();
        let humanDetected = false;
        let humanCounter = 0;
        const MIN_CONSECUTIVE = 2;

        // Smoothing bounding box
        let smoothBoxes = [];
        const SMOOTH_FACTOR = 0.5;

        // --- ALARM SUARA ---
        let alarmCtx = null;
        let alarmOsc = null;
        let alarmGain = null;
        let alarmInterval = null;

        function initAudio() {
            if (!alarmCtx) {
                alarmCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function startAlarm() {
            initAudio();
            if (alarmCtx.state === 'suspended') {
                alarmCtx.resume();
            }
            // Jika sudah berbunyi, tidak perlu buat baru
            if (alarmInterval) return;

            // Buat oscillator
            alarmOsc = alarmCtx.createOscillator();
            alarmGain = alarmCtx.createGain();
            alarmOsc.type = 'square';
            alarmOsc.frequency.value = 800;
            alarmGain.gain.value = 0.15;
            alarmOsc.connect(alarmGain);
            alarmGain.connect(alarmCtx.destination);

            alarmOsc.start();
            // Kedip volume (beep-beep)
            let toggle = true;
            alarmInterval = setInterval(() => {
                if (alarmGain) {
                    alarmGain.gain.value = toggle ? 0.15 : 0.0;
                    toggle = !toggle;
                }
            }, 300);
        }

        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            if (alarmOsc) {
                try { alarmOsc.stop(); } catch(e) {}
                alarmOsc.disconnect();
                alarmOsc = null;
            }
            if (alarmGain) {
                alarmGain.disconnect();
                alarmGain = null;
            }
        }

        // --- RESIZE CANVAS ---
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.floor(rect.width);
            canvas.height = Math.floor(rect.height);
        }
        window.addEventListener('resize', resizeCanvas);

        // --- LOG ---
        function addLog(msg, type = '') {
            const time = new Date().toLocaleTimeString('id-ID');
            let cls = '';
            if (type === 'alert') cls = 'log-alert';
            else if (type === 'danger') cls = 'log-danger';
            logArea.innerHTML += `<div class="${cls}">> [${time}] ${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
            while (logArea.children.length > 40) logArea.removeChild(logArea.firstChild);
        }

        // --- DRAW LOOP (60 FPS) ---
        function drawLoop(timestamp) {
            if (!isRunning) {
                animFrameId = requestAnimationFrame(drawLoop);
                return;
            }

            // FPS counter
            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
                fpsDisplay.textContent = fps;
            }

            // Gambar frame dengan efek BW + BLUR
            if (video.readyState >= 2) {
                const w = canvas.width, h = canvas.height;
                ctx.filter = 'blur(2.5px) grayscale(100%) contrast(1.1)';
                ctx.drawImage(video, 0, 0, w, h);
                ctx.filter = 'none';

                // Gambar bounding box yang sudah di-smooth
                if (humanDetected && smoothBoxes.length > 0) {
                    ctx.strokeStyle = '#f0883e';
                    ctx.lineWidth = 2.5;
                    ctx.shadowColor = 'transparent';
                    smoothBoxes.forEach(box => {
                        const [x, y, bw, bh] = box;
                        ctx.strokeRect(x, y, bw, bh);
                        ctx.fillStyle = 'rgba(240, 136, 62, 0.12)';
                        ctx.fillRect(x, y, bw, bh);
                        ctx.font = 'bold 13px -apple-system, sans-serif';
                        ctx.fillStyle = '#f0883e';
                        ctx.fillText('MANUSIA', x, y - 6);
                    });
                }

                // Update resolusi sekali
                if (resDisplay.textContent === '--x--' && video.videoWidth) {
                    resDisplay.textContent = `${video.videoWidth}x${video.videoHeight}`;
                }
            }

            animFrameId = requestAnimationFrame(drawLoop);
        }

        // --- DETEKSI AI (dipanggil per 200ms) ---
        async function runDetection() {
            if (!isRunning || !model || video.readyState < 2) {
                detectionTimerId = setTimeout(runDetection, 200);
                return;
            }

            const startTime = performance.now();
            try {
                const predictions = await model.detect(video);
                const inferenceTime = (performance.now() - startTime).toFixed(0);
                inferDisplay.textContent = inferenceTime + ' ms';

                // Filter manusia
                const humans = predictions.filter(p => p.class === 'person' && p.score > 0.45);

                // Update count
                humanCount.textContent = humans.length;

                // Konfidensi
                let maxConf = 0;
                if (humans.length > 0) {
                    maxConf = Math.max(...humans.map(h => h.score));
                    confDisplay.textContent = (maxConf * 100).toFixed(0) + '%';
                } else {
                    confDisplay.textContent = '0%';
                }

                // --- SMOOTHING BOX ---
                if (humans.length > 0) {
                    // Ambil box pertama dengan skor tertinggi
                    const best = humans.reduce((a, b) => a.score > b.score ? a : b);
                    const [x, y, w, h] = best.bbox;
                    // Smooth dengan box sebelumnya
                    if (smoothBoxes.length === 0) {
                        smoothBoxes = [[x, y, w, h]];
                    } else {
                        const prev = smoothBoxes[0];
                        const sx = prev[0] + (x - prev[0]) * SMOOTH_FACTOR;
                        const sy = prev[1] + (y - prev[1]) * SMOOTH_FACTOR;
                        const sw = prev[2] + (w - prev[2]) * SMOOTH_FACTOR;
                        const sh = prev[3] + (h - prev[3]) * SMOOTH_FACTOR;
                        smoothBoxes = [[sx, sy, sw, sh]];
                    }
                } else {
                    // Jika tidak ada manusia, perlahan box mengecil
                    if (smoothBoxes.length > 0) {
                        const prev = smoothBoxes[0];
                        const sx = prev[0] + (0 - prev[0]) * 0.1;
                        const sy = prev[1] + (0 - prev[1]) * 0.1;
                        const sw = prev[2] * 0.9;
                        const sh = prev[3] * 0.9;
                        if (sw < 1 || sh < 1) {
                            smoothBoxes = [];
                        } else {
                            smoothBoxes = [[sx, sy, sw, sh]];
                        }
                    }
                }

                // Logika deteksi konsisten
                if (humans.length > 0) {
                    humanCounter++;
                } else {
                    humanCounter = 0;
                }

                const confirmed = humanCounter >= MIN_CONSECUTIVE;

                if (confirmed && !humanDetected) {
                    humanDetected = true;
                    statusDot.className = 'dot danger';
                    statusLabel.textContent = 'TERDETEKSI';
                    addLog('🚨 Manusia terdeteksi! Alarm aktif.', 'danger');
                    startAlarm();
                    startRecording();
                } else if (!confirmed && humanDetected) {
                    humanDetected = false;
                    statusDot.className = 'dot';
                    statusLabel.textContent = 'SIAGA';
                    addLog('✅ Manusia pergi. Alarm berhenti.', 'alert');
                    stopAlarm();
                    stopRecording();
                    smoothBoxes = [];
                } else if (confirmed) {
                    statusDot.className = 'dot danger';
                    statusLabel.textContent = 'TERDETEKSI';
                }

            } catch (err) {
                // silent ignore
            }

            detectionTimerId = setTimeout(runDetection, 200);
        }

        // --- REKAM ---
        function startRecording() {
            if (isRecording || !isRunning) return;
            try {
                const canvasStream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(canvasStream, {
                    mimeType: 'video/webm;codecs=vp9,opus',
                    bitsPerSecond: 1200000
                });
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    if (recordedChunks.length > 0) {
                        const blob = new Blob(recordedChunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        window._recordingBlob = { url, blob, time: new Date().toISOString() };
                        addLog(`✅ Rekaman selesai (${(blob.size/1024/1024).toFixed(1)} MB)`, 'alert');
                    }
                    isRecording = false;
                    recTimeDisplay.textContent = 'IDLE';
                };

                mediaRecorder.start(1000);
                isRecording = true;
                recordingStartTime = Date.now();
                recTimeDisplay.textContent = '● REKAM';
                addLog('🔴 Merekam...', 'alert');
            } catch (e) {
                addLog('❌ Gagal rekam: ' + e.message, 'danger');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try { mediaRecorder.stop(); } catch(e) {}
            }
            if (isRecording) {
                isRecording = false;
                recTimeDisplay.textContent = 'IDLE';
            }
        }

        // --- START / STOP CCTV ---
        async function toggleCCTV() {
            if (isRunning) {
                // STOP
                isRunning = false;
                if (detectionTimerId) clearTimeout(detectionTimerId);
                if (animFrameId) cancelAnimationFrame(animFrameId);
                stopAlarm();
                if (isRecording) stopRecording();
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                statusDot.className = 'dot inactive';
                statusLabel.textContent = 'STOP';
                humanCount.textContent = '0';
                confDisplay.textContent = '0%';
                fpsDisplay.textContent = '0';
                btnStart.textContent = '▶ Mulai';
                addLog('⏹ Sistem dihentikan.');
                return;
            }

            // START
            try {
                // Minta izin kamera
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                resizeCanvas();
                isRunning = true;
                btnStart.textContent = '⏹ Berhenti';
                statusDot.className = 'dot warning';
                statusLabel.textContent = 'MEMUAT AI';
                addLog('📷 Kamera aktif. Memuat model AI...');

                if (!model) {
                    model = await cocoSsd.load({ base: 'mobilenet_v2' });
                    addLog('✅ Model AI siap (COCO-SSD).');
                } else {
                    addLog('✅ Model AI sudah siap.');
                }

                statusDot.className = 'dot';
                statusLabel.textContent = 'SIAGA';
                humanDetected = false;
                humanCounter = 0;
                smoothBoxes = [];

                // Mulai loop
                if (animFrameId) cancelAnimationFrame(animFrameId);
                if (detectionTimerId) clearTimeout(detectionTimerId);
                drawLoop(performance.now());
                runDetection();

            } catch (err) {
                // Jika gagal, tampilkan pesan jelas
                let msg = err.message;
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    msg = 'Izin kamera ditolak. Berikan izin di pengaturan browser.';
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    msg = 'Tidak ada kamera yang terdeteksi.';
                }
                alert('Gagal akses kamera: ' + msg);
                addLog('❌ Error: ' + msg, 'danger');
                isRunning = false;
                btnStart.textContent = '▶ Mulai';
                statusLabel.textContent = 'ERROR';
                statusDot.className = 'dot inactive';
            }
        }

        // --- DOWNLOAD REKAMAN ---
        function downloadRecording() {
            if (window._recordingBlob && window._recordingBlob.blob.size > 0) {
                const a = document.createElement('a');
                a.href = window._recordingBlob.url;
                a.download = `rekaman_cctv_${new Date().toISOString().replace(/[:.]/g, '-')}.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                addLog('⬇ Proses unduh dimulai.');
            } else {
                alert('Belum ada rekaman. Biarkan CCTV mendeteksi manusia terlebih dahulu.');
            }
        }

        // --- EVENT LISTENERS ---
        btnStart.addEventListener('click', toggleCCTV);
        btnDownload.addEventListener('click', downloadRecording);
        btnClear.addEventListener('click', () => {
            logArea.innerHTML = '> Log dibersihkan.';
        });

        // --- INIT ---
        addLog('🔧 Aplikasi siap. Tekan "Mulai" untuk mengaktifkan CCTV.');
        statusDot.className = 'dot inactive';
        statusLabel.textContent = 'SIAGA';
        recTimeDisplay.textContent = 'IDLE';
        resizeCanvas();

        // Bersihkan saat halaman ditutup
        window.addEventListener('beforeunload', function() {
            stopAlarm();
            if (isRecording) stopRecording();
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (detectionTimerId) clearTimeout(detectionTimerId);
            if (animFrameId) cancelAnimationFrame(animFrameId);
        });
    })();
</script>
</body>
</html>
