<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0B1220"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Cazoo</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Cazoo","short_name":"Cazoo","start_url":".","display":"standalone","background_color":"%230B1220","theme_color":"%230B1220"}'/>
<style>
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#F1F3F7;
  --text:#0B1220; --muted:#64748B; --line:#E7EAF0;
  --brand-1:#0B1220; --brand-2:#1E3A8A; --brand-3:#3B82F6;
  --accent:#22D3EE;
  --ok:#10B981; --warn:#F59E0B; --err:#EF4444;
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --sh-1:0 1px 2px rgba(11,18,32,.05);
  --sh-2:0 8px 24px rgba(11,18,32,.08);
  --sh-3:0 24px 48px rgba(11,18,32,.18);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --tab-h:64px;
}
[data-theme="dark"]{
  --bg:#070B14; --surface:#0F1626; --surface-2:#151E33;
  --text:#E8EDF6; --muted:#8FA1BD; --line:#1E2A44;
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
a{color:var(--brand-3);text-decoration:none}
svg{display:block}

/* ---------- Splash ---------- */
.splash{
  position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(120% 80% at 50% 0%,#1E3A8A 0%,#0B1220 60%);
  color:#fff;transition:opacity .4s,visibility .4s;
}
.splash.hide{opacity:0;visibility:hidden}
.splash__mark{
  width:76px;height:76px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3B82F6,#22D3EE);
  box-shadow:0 20px 60px rgba(59,130,246,.5),inset 0 1px 0 rgba(255,255,255,.3);
  font-weight:900;font-size:36px;color:#fff;letter-spacing:-.5px;
}
.splash__name{font-weight:800;letter-spacing:-.3px;font-size:22px;margin-top:-8px}
.splash__bar{width:120px;height:3px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;position:relative}
.splash__bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:99px;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* ---------- Layout ---------- */
.appbar{
  position:sticky;top:0;z-index:40;padding:calc(8px + var(--safe-t)) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);
}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.3px}
.brand__mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,#3B82F6,#1E3A8A);color:#fff;font-weight:900;font-size:15px;
  box-shadow:0 4px 12px rgba(59,130,246,.35)}
.brand__name{font-size:16px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:var(--text);background:var(--surface);border:1px solid var(--line);
  transition:transform .12s,background .15s}
.iconbtn:active{transform:scale(.94);background:var(--surface-2)}
.iconbtn--plain{background:transparent;border:0}

.container{padding:12px 16px calc(var(--tab-h) + 40px + var(--safe-b));max-width:560px;margin:0 auto}
.view{animation:viewIn .28s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin:22px 4px 10px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.section-head .section-title{margin:0}
.section-head a{font-size:13px;font-weight:600;color:var(--brand-3)}

/* ---------- Floating Tab Bar (iOS style) ---------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + var(--safe-b));
  width:min(420px,calc(100% - 24px));
  padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  background:rgba(11,18,32,.72);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  box-shadow:0 20px 44px rgba(11,18,32,.32),0 2px 8px rgba(0,0,0,.1);
  z-index:60;
}
[data-theme="dark"] .tabbar{background:rgba(15,22,38,.85);border-color:rgba(255,255,255,.06)}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 2px;border-radius:16px;color:rgba(255,255,255,.55);
  font-size:10px;font-weight:600;letter-spacing:.01em;
  transition:all .22s cubic-bezier(.22,1,.36,1);position:relative;
}
.tab svg{width:22px;height:22px;transition:transform .22s}
.tab.active{color:#fff;background:linear-gradient(180deg,rgba(59,130,246,.28),rgba(59,130,246,.16))}
.tab.active svg{transform:translateY(-1px)}
.tab__dot{position:absolute;top:6px;right:calc(50% - 14px);width:8px;height:8px;border-radius:50%;
  background:var(--err);box-shadow:0 0 0 2px rgba(11,18,32,.72)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--sh-1)}
.card+.card{margin-top:12px}
.card--flush{padding:0;overflow:hidden}

/* ---------- Balance Card ---------- */
.balance{
  position:relative;border-radius:var(--r-xl);padding:22px;overflow:hidden;color:#fff;
  background:
    radial-gradient(120% 100% at 100% 0%,rgba(34,211,238,.22),transparent 55%),
    radial-gradient(100% 120% at 0% 100%,rgba(59,130,246,.35),transparent 55%),
    linear-gradient(135deg,#0B1220,#132146);
  box-shadow:0 20px 44px rgba(11,18,32,.28),inset 0 1px 0 rgba(255,255,255,.06);
}
.balance::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:16px 16px;pointer-events:none;opacity:.6;
}
.balance__top{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.balance__label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(255,255,255,.65)}
.balance__val{font-size:34px;font-weight:800;letter-spacing:-1px;margin:8px 0 4px;
  font-variant-numeric:tabular-nums;transition:filter .2s}
.balance__val.blur{filter:blur(8px);user-select:none}
.balance__id{display:inline-flex;align-items:center;gap:6px;font-size:12px;
  color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);
  padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.08)}
.balance__id b{color:#fff;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.balance__id button{color:inherit;opacity:.7;padding:0}
.balance__id button:active{opacity:1}
.balance__actions{display:flex;gap:8px;margin-top:18px;position:relative}
.balance__actions .chip{
  flex:1;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.08);
  padding:10px 8px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:12.5px;font-weight:600;transition:background .15s,transform .12s;
}
.balance__actions .chip:active{transform:scale(.97);background:rgba(255,255,255,.16)}

/* Quick grid */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick__btn{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 6px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);
  font-size:11.5px;font-weight:600;color:var(--text);box-shadow:var(--sh-1);
  transition:transform .12s,background .15s;
}
.quick__btn:active{transform:scale(.96);background:var(--surface-2)}
.quick__ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,#DBEAFE,#BFDBFE);color:#1E3A8A}
[data-theme="dark"] .quick__ico{background:linear-gradient(135deg,#1E3A8A,#0F2557);color:#93C5FD}
.quick__btn:nth-child(2) .quick__ico{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);color:#065F46}
[data-theme="dark"] .quick__btn:nth-child(2) .quick__ico{background:linear-gradient(135deg,#064E3B,#022C22);color:#6EE7B7}
.quick__btn:nth-child(3) .quick__ico{background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E}
[data-theme="dark"] .quick__btn:nth-child(3) .quick__ico{background:linear-gradient(135deg,#78350F,#451A03);color:#FCD34D}
.quick__btn:nth-child(4) .quick__ico{background:linear-gradient(135deg,#EDE9FE,#DDD6FE);color:#5B21B6}
[data-theme="dark"] .quick__btn:nth-child(4) .quick__ico{background:linear-gradient(135deg,#4C1D95,#2E1065);color:#C4B5FD}

/* ---------- List Items ---------- */
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);transition:background .15s;cursor:pointer}
.item:active{background:var(--surface-2)}
.item__ico{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--muted)}
.item__ico.in{background:rgba(16,185,129,.12);color:var(--ok)}
.item__ico.out{background:rgba(239,68,68,.12);color:var(--err)}
.item__ico.pending{background:rgba(245,158,11,.14);color:#B45309}
.item__body{flex:1;min-width:0}
.item__title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item__sub{font-size:12px;color:var(--muted);margin-top:1px}
.item__amt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.item__amt.in{color:var(--ok)}
.item__amt.out{color:var(--text)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;
  font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--muted)}
.badge.ok{background:rgba(16,185,129,.14);color:#047857}
.badge.warn{background:rgba(245,158,11,.16);color:#B45309}
.badge.err{background:rgba(239,68,68,.14);color:#B91C1C}
[data-theme="dark"] .badge.ok{color:#6EE7B7}
[data-theme="dark"] .badge.warn{color:#FCD34D}
[data-theme="dark"] .badge.err{color:#FCA5A5}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.input,select.input,textarea.input{
  padding:14px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);
  color:var(--text);font-size:15px;transition:border-color .18s,box-shadow .18s;
  font-variant-numeric:tabular-nums;width:100%;
}
.input:focus{border-color:var(--brand-3);box-shadow:0 0 0 3.5px rgba(59,130,246,.14)}
.input.err{border-color:var(--err);box-shadow:0 0 0 3.5px rgba(239,68,68,.14)}
.hint{font-size:12px;color:var(--muted);margin-left:2px}
.err-text{font-size:12.5px;color:var(--err);margin:6px 2px;min-height:16px;display:flex;align-items:center;gap:5px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 18px;border-radius:var(--r);font-weight:700;font-size:14.5px;
  transition:transform .12s,filter .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,#1E3A8A,#0B1220);color:#fff;
  box-shadow:0 8px 20px rgba(30,58,138,.28),inset 0 1px 0 rgba(255,255,255,.12)}
.btn-primary:active{filter:brightness(.95)}
.btn-blue{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;
  box-shadow:0 8px 20px rgba(59,130,246,.3)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--text)}
.btn-danger{background:rgba(239,68,68,.1);color:#B91C1C;border:1.5px solid rgba(239,68,68,.2)}
[data-theme="dark"] .btn-danger{color:#FCA5A5}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:11px}
.btn--plain{padding:8px;background:transparent}

/* ---------- Tabs (pill row) ---------- */
.pilltabs{display:flex;gap:6px;overflow-x:auto;padding:2px;margin:0 -2px 14px;
  scrollbar-width:none}
.pilltabs::-webkit-scrollbar{display:none}
.pilltab{flex:none;padding:9px 16px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);
  transition:all .18s;white-space:nowrap}
.pilltab.active{background:var(--brand-1);color:#fff;border-color:var(--brand-1)}
[data-theme="dark"] .pilltab.active{background:#2563EB;border-color:#2563EB}

/* ---------- Modal sheet ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(11,18,32,.5);backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:flex-end;justify-content:center;
  animation:bgIn .22s ease}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
.modal-sheet{width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;
  background:var(--surface);border-radius:26px 26px 0 0;
  padding:8px 20px calc(24px + var(--safe-b));
  animation:sheetIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.sheet-handle{width:40px;height:4px;background:var(--line);border-radius:99px;margin:8px auto 14px}
.modal-sheet h2{font-size:18px;font-weight:800;margin:6px 0 14px;letter-spacing:-.2px}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);
  top:calc(12px + var(--safe-t));z-index:300;display:flex;flex-direction:column;gap:8px;
  width:min(400px,calc(100% - 24px));pointer-events:none}
.toast{padding:12px 16px;border-radius:14px;background:rgba(11,18,32,.94);
  color:#fff;font-size:13.5px;font-weight:600;box-shadow:var(--sh-3);
  display:flex;align-items:center;gap:10px;
  animation:toastIn .28s cubic-bezier(.22,1,.36,1);backdrop-filter:blur(20px)}
.toast.ok{background:linear-gradient(135deg,#059669,#047857)}
.toast.err{background:linear-gradient(135deg,#DC2626,#B91C1C)}
.toast svg{flex:none}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .24s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}

/* ---------- Auth screens ---------- */
.auth-hero{
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(80px + var(--safe-t)) 20px 40px;
  background:radial-gradient(120% 60% at 50% 0%,#1E3A8A 0%,#0B1220 70%);
  color:#fff;position:relative;overflow:hidden;
}
.auth-hero::after{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:22px 22px;pointer-events:none;
}
.auth-hero .brand__mark{width:56px;height:56px;border-radius:18px;font-size:26px;
  box-shadow:0 20px 44px rgba(59,130,246,.5)}
.auth-hero__title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:18px 0 6px}
.auth-hero__sub{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:32px;text-align:center}
.auth-form{width:100%;max-width:400px;background:var(--surface);color:var(--text);
  border-radius:24px;padding:22px;box-shadow:var(--sh-3);position:relative;z-index:1}

/* ---------- Skeleton ---------- */
.sk{background:linear-gradient(90deg,var(--surface-2) 0%,color-mix(in srgb,var(--surface-2) 60%,var(--line)) 50%,var(--surface-2) 100%);
  background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:12px}
.sk-line.short{width:40%}
.sk-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;display:flex;gap:12px;align-items:center}
.sk-avatar{width:42px;height:42px;border-radius:13px;flex:none}
.sk-body{flex:1;display:flex;flex-direction:column;gap:8px}

/* ---------- Empty / Error ---------- */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:36px 20px;gap:12px}
.state__ico{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--muted)}
.state__title{font-weight:700;font-size:15px}
.state__msg{font-size:13px;color:var(--muted);max-width:280px;line-height:1.5}

/* ---------- Misc ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;
  border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{font-weight:600;text-align:right;word-break:break-word;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chipx{padding:10px 14px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line);
  font-size:13px;font-weight:600;color:var(--text);transition:all .15s}
.chipx[aria-pressed="true"]{background:var(--brand-1);border-color:var(--brand-1);color:#fff}
[data-theme="dark"] .chipx[aria-pressed="true"]{background:#2563EB;border-color:#2563EB}
.row{display:flex;align-items:center;gap:8px}
.row-between{justify-content:space-between}
.mt{margin-top:12px}
.mt-l{margin-top:20px}
.center{display:grid;place-items:center}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:20px 0}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--line);
  transition:background .15s,transform .15s}
.pin-dot.filled{background:var(--brand-3);transform:scale(1.1)}
video{width:100%;border-radius:16px;background:#000;aspect-ratio:1/1;object-fit:cover}
</style>

function toast(msg, type="info", ms=2600) {
  const root = $("#toast-root");
  const el = document.createElement("div");
  el.className = "toast " + (type==="ok"?"ok":type==="err"?"err":"");
  const ic = type==="ok"?"check":type==="err"?"alert":"info";
  el.innerHTML = `${icon(ic,18,2.4)}<span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),240); }, ms);

  const root = $("#modal-root");

  const bg = $(".modal-bg", root);

  return {

    $: s => $(s, root),

  };
}

  return new Promise(resolve => {
    const m = modal(`
      <h2>${esc(title)}</h2>
      <p class="hint" style="margin:0 0 18px;font-size:14px;line-height:1.5">${esc(message)}</p>
      <div class="grid2">
        <button class="btn btn-ghost" id="no">Batal</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="yes">${esc(confirmLabel)}</button>
      </div>`);
    m.$("#no").onclick = () => { m.close(); resolve(false); };
    m.$("#yes").onclick = () => { m.close(); resolve(true); };
  });
}

/* ===== Web Crypto: SHA-256 hash for PIN ===== */
async function sha256Hex(str) {
  const buf = new TextEncoder().encode(str);
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,"0")).join("");
}
function randomSalt() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2,"0")).join("");
}

          <span>Masuk</span>
        </button>`;
    } else if (mode === "register") {
      form.innerHTML = `
        <div class="field">
          <label>Nama</label>
          <input class="input" name="displayName" maxlength="40" required placeholder="Nama lengkap">
        </div>
        <div class="field">
          <label>Email</label>
          <input class="input" name="email" type="email" inputmode="email"
                 autocomplete="email" required placeholder="nama@email.com">
        </div>
        <div class="field">
          <label>Kata Sandi</label>
          <input class="input" name="password" type="password"
                 autocomplete="new-password" required placeholder="Minimal 8 karakter">
          <div class="hint">Gunakan kombinasi huruf & angka.</div>
        </div>
        <div class="field">
          <label>PIN Transaksi (6 digit)</label>
          <input class="input" name="pin" type="password" inputmode="numeric"
                 pattern="[0-9]*" maxlength="6" required placeholder="••••••">
          <div class="hint">PIN diperlukan untuk setiap transaksi. Jangan bagikan ke siapa pun.</div>
        </div>
        <div class="err-text" id="errBox"></div>
        <button class="btn btn-primary btn-block" type="submit" id="submit">
          <span>Buat Akun</span>
        </button>`;
    } else {
      form.innerHTML = `
        <div class="field">
          <label>Email terdaftar</label>
          <input class="input" name="email" type="email" required placeholder="nama@email.com">
        </div>
        <div class="err-text" id="errBox"></div>
        <button class="btn btn-primary btn-block" type="submit" id="submit">
          <span>Kirim Link Reset</span>
        </button>`;
    }
  };
  renderForm();

  tabs.forEach(t => t.onclick = () => {
    mode = t.dataset.tab;
    tabs.forEach(x => x.classList.toggle("active", x === t));
    renderForm();
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    const err = $("#errBox", form);
    const btn = $("#submit", form);
    const label = btn.querySelector("span");
    err.textContent = "";
    btn.disabled = true; label.textContent = "Memproses…";

    try {
      if (mode === "register") {
        const name = (d.displayName || "").trim();
        if (!name) throw new Error("Nama wajib diisi.");
        if (!isEmail(d.email)) throw new Error("Format email tidak valid.");
        if ((d.password || "").length < 8) throw new Error("Kata sandi minimal 8 karakter.");
        if (!/^\d{6}$/.test(d.pin || "")) throw new Error("PIN harus 6 digit angka.");
        if (/^(\d)\1{5}$/.test(d.pin)) throw new Error("PIN terlalu mudah. Hindari angka berulang.");
        if (/^(012345|123456|654321|987654|000000|111111)$/.test(d.pin))
          throw new Error("PIN terlalu mudah ditebak.");

        // 1) create auth user
        const cred = await createUserWithEmailAndPassword(auth, d.email, d.password);
        const user = cred.user;

        // 2) hash PIN di klien (server tetap verifikasi ulang via Cloud Function)
        const salt = randomSalt();
        const pinHash = await sha256Hex(salt + ":" + d.pin);

        // 3) minta Cloud Function finalisasi: generate accountId, buat profil & wallet
        try {
          const finalize = httpsCallable(fns, "finalizeRegistration");
          await finalize({ displayName: name, pinHash, pinSalt: salt });
        } catch (ex) {
          // rollback auth user bila server gagal
          try { await deleteUser(user); } catch {}
          throw ex;
        }

        // 4) kirim email verifikasi (best-effort)
        try { await sendEmailVerification(user); } catch {}

        toast("Akun berhasil dibuat.", "ok");
      }
      else if (mode === "login") {
        await signInWithEmailAndPassword(auth, d.email, d.password);
      }
      else {
        if (!isEmail(d.email)) throw new Error("Format email tidak valid.");
        await sendPasswordResetEmail(auth, d.email);
        toast("Link reset dikirim ke email Anda.", "ok");
      }
    } catch (ex) {
      err.innerHTML = `${icon("alert", 16, 2.2)}<span>${esc(ex.code ? authErr(ex.code, ex.message) : ex.message)}</span>`;
    } finally {
      btn.disabled = false; label.textContent = mode === "login" ? "Masuk" : mode === "register" ? "Buat Akun" : "Kirim Link Reset";
    }
  });
}

/* =========================================================
   AUTH STATE
========================================================= */
onAuthStateChanged(auth, async user => {
  if (!user) {
    state.user = null; state.profile = null; state.wallet = null;
    state.isAdmin = false;
    state.unsubWallet?.(); state.unsubNotif?.();
    renderAuth();
    return;
  }
  try {
    const tok = await user.getIdTokenResult(true);
    state.user = user;
    state.isAdmin = tok.claims?.admin === true;

    const [pSnap, wSnap] = await Promise.all([
      get(ref(db, `users/${user.uid}`)),
      get(ref(db, `wallets/${user.uid}`))
    ]);
    state.profile = pSnap.exists() ? pSnap.val() : null;
    state.wallet  = wSnap.exists() ? wSnap.val() : null;

    // Kalau profil belum ada (edge case), coba buat fallback
    if (!state.profile) {
      const finalize = httpsCallable(fns, "finalizeRegistration");
      const salt = randomSalt();
      const pinHash = await sha256Hex(salt + ":000000");
      await finalize({
        displayName: user.displayName || (user.email || "Pengguna").split("@")[0],
        pinHash, pinSalt: salt
      });
      state.profile = (await get(ref(db, `users/${user.uid}`))).val();
      state.wallet  = (await get(ref(db, `wallets/${user.uid}`))).val();
    }

    if (state.profile.accountStatus === "disabled") { renderDisabledScreen(); return; }

    subscribeWallet(user.uid);
    subscribeNotifications(user.uid);
    renderShell();
  } catch (ex) {
    console.error(ex);
    renderFatal(authErr(ex.code, ex.message));
  }
});

/* =========================================================
   REALTIME SUBSCRIPTIONS
========================================================= */
function subscribeWallet(uid) {
  state.unsubWallet?.();
  state.unsubWallet = onValue(ref(db, `wallets/${uid}`), snap => {
    if (snap.exists()) {
      state.wallet = snap.val();
      if (state.route === "home") renderRoute();
    }
  }, err => console.warn("wallet:", err.message));
}
function subscribeNotifications(uid) {
  state.unsubNotif?.();
  state.unsubNotif = onValue(
    query(ref(db, `notifications/${uid}`), orderByChild("createdAt"), limitToLast(60)),
    snap => {
      const arr = [];
      snap.forEach(c => arr.push({ id: c.key, ...c.val() }));
      arr.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      state.notifs = arr;
      state.notifUnread = arr.filter(n => !n.read).length;
      paintTabDot();
      if (state.route === "notifications") renderRoute();
    },
    err => console.warn("notif:", err.message)
  );
}
function paintTabDot() {
  $$(".tab[data-route='notifications'] .tab__dot").forEach(x => x.remove());
  if (state.notifUnread > 0) {
    const el = $(".tab[data-route='notifications']");
    if (el) {
      const d = document.createElement("span");
      d.className = "tab__dot";
      el.appendChild(d);
    }
  }
}

async function loadRecent(limit = 8) {

function txItemHTML(t) {
  const dir = transferDir(t.transactionType);
  const iconName = txIconName(t.transactionType);
  const statusCls = t.status === "success" ? "ok" : t.status === "pending" || t.status === "processing" ? "warn" : "err";
  const sign = dir === "in" ? "+" : "−";
  const amtCls = dir === "in" ? "in" : "out";
  return `<div class="item" data-tx="${t.id}">
    <div class="item__ico ${dir==='in'?'in':dir==='out'?'out':'pending'}">${icon(iconName,18)}</div>
    <div class="item__body">
      <div class="item__title">${esc(t.description || labelForTx(t.transactionType))}</div>
      <div class="item__sub">${fdate(t.createdAt)} · <span class="badge ${statusCls}">${esc(t.status||"—")}</span></div>
    </div>
    <div class="item__amt ${amtCls}">${sign}${rp(t.amount||0).replace("Rp ","Rp")}</div>
  </div>`;
}
function transferDir(t){
  if (!t) return "out";
  if (["TOPUP","TRANSFER_IN","REFUND","ADJUSTMENT"].includes(t)) return "in";
  if (["TRANSFER_OUT","PAYMENT","WITHDRAWAL","FEE"].includes(t)) return "out";
  return "out";
}
function txIconName(t){
  return { TOPUP:"plus", TRANSFER_IN:"arrowDownLeft", TRANSFER_OUT:"arrowUpRight",
    PAYMENT:"card", REFUND:"refresh", WITHDRAWAL:"arrowDown",
    FEE:"receipt", ADJUSTMENT:"settings" }[t] || "receipt";
}
function labelForTx(t){
  return { TOPUP:"Top Up", TRANSFER_IN:"Transfer Masuk", TRANSFER_OUT:"Transfer Keluar",
    PAYMENT:"Pembayaran", REFUND:"Pengembalian", WITHDRAWAL:"Penarikan",
    FEE:"Biaya", ADJUSTMENT:"Penyesuaian" }[t] || "Transaksi";
}

/* =========================================================
   PIN PROMPT (6-digit)
========================================================= */
function promptPin(purpose = "Konfirmasi PIN") {
  return new Promise((resolve) => {
    let value = "";
    const m = modal(`
      <h2 style="text-align:center">${esc(purpose)}</h2>
      <p class="hint" style="text-align:center;margin:0 0 4px">Masukkan PIN 6 digit Anda</p>
      <div class="pin-dots" id="dots">
        ${Array(6).fill('<div class="pin-dot"></div>').join("")}
      </div>
      <div id="pinErr" class="err-text" style="justify-content:center"></div>
      <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6"
        style="position:absolute;opacity:0;pointer-events:none" autocomplete="off">
      <div class="grid2 mt">
        <button class="btn btn-ghost" id="cancel">Batal</button>
        <button class="btn btn-primary" id="ok" disabled>Konfirmasi</button>
      </div>`);
    const input = m.$("#pinInput");
    const okBtn = m.$("#ok");
    const dots = m.$$("#dots .pin-dot");
    const errEl = m.$("#pinErr");
    input.focus();
    setTimeout(() => input.focus(), 80);

    const paint = () => dots.forEach((d,i) => d.classList.toggle("filled", i < value.length));
    input.addEventListener("input", () => {
      value = input.value.replace(/\D/g,"").slice(0,6);
      input.value = value;
      paint();
      okBtn.disabled = value.length !== 6;
      errEl.textContent = "";
    });
    m.$("#cancel").onclick = () => { m.close(); resolve(null); };
    okBtn.onclick = () => { const v = value; m.close(); resolve(v); };
    input.addEventListener("keydown", e => { if (e.key === "Enter" && value.length === 6) okBtn.click(); });
  });
}

/* Verify PIN via Cloud Function */
async function verifyPin(pin) {
  try {
    const call = httpsCallable(fns, "verifyPin");
    await call({ pin });
    return true;
  } catch (ex) {
    throw new Error(authErr(ex.code, ex.message));
  }
}

/* Helper: prompt PIN + verify dengan retry */
async function requirePin(purpose = "Konfirmasi Transaksi") {
  const pin = await promptPin(purpose);
  if (!pin) throw new Error("__cancel__");
  await verifyPin(pin);
  return true;
}

        <div style="display:flex;gap:10px;align-items:flex-start">
          <span style="color:#B45309;flex:none">${icon("shield",20)}</span>

        </div>
      </div>
    </div>

    <div class="section-title">Riwayat Penarikan</div>
    <div id="list">${skeletonList(2)}</div>`;

  $("#back", root).onclick = () => history.length > 1 ? history.back() : navigate("home");

  $("#acct", root).addEventListener("input", e => e.target.value = e.target.value.replace(/\D/g,"").slice(0,20));

  function validate() {
    const v = Number($("#amount", root).value || 0);
    const bal = state.wallet?.availableBalance || 0;
    const ok = v >= 10000 && v <= 10_000_000 && v <= bal;
    const err = $("#err", root);
    if (v > bal) err.innerHTML = `${icon("alert",14)}<span>Saldo tidak cukup.</span>`;
    else if (v > 0 && v < 10000) err.innerHTML = `${icon("alert",14)}<span>Minimal ${rp(10000)}.</span>`;
    else err.textContent = "";
    const summary = $("#summary", root);
    summary.innerHTML = v > 0 ? `
      <div class="kv"><span>Nominal</span><span>${rp(v)}</span></div>
      <div class="kv"><span>Biaya</span><span>Rp 0</span></div>
      <div class="kv"><span>Diterima</span><span>${rp(v)}</span></div>
      <div class="hint mt">Saldo tersedia: ${rp(bal)}</div>` : "";
    $("#submit", root).disabled = !ok;
  }
  ["#amount","#acct","#owner","#bank"].forEach(s => {
    $(s, root).addEventListener("input", validate);
    $(s, root).addEventListener("change", validate);
  });

  $("#submit", root).onclick = async () => {
    const v = Number($("#amount", root).value || 0);
    const bank = $("#bank", root).value;
    const acct = $("#acct", root).value.trim();
    const owner = $("#owner", root).value.trim();
    const err = $("#err", root);
    if (!/^\d{6,20}$/.test(acct)) { err.innerHTML = `${icon("alert",14)}<span>Nomor rekening tidak valid.</span>`; return; }
    if (!owner) { err.innerHTML = `${icon("alert",14)}<span>Nama pemilik wajib diisi.</span>`; return; }
    if (v > (state.wallet?.availableBalance || 0)) { err.innerHTML = `${icon("alert",14)}<span>Saldo tidak cukup.</span>`; return; }

    const ok = await confirmDialog("Konfirmasi Penarikan",
      `Tarik ${rp(v)} ke ${bank.toUpperCase()} a.n. ${owner}?`, "Lanjut");
    if (!ok) return;

    try { await requirePin("PIN Penarikan"); }
    catch (e) {
      if (e.message === "__cancel__") return;
      err.innerHTML = `${icon("alert",14)}<span>${esc(e.message)}</span>`;
      return;
    }

    const btn = $("#submit", root); btn.disabled = true;
    const prev = btn.innerHTML; btn.innerHTML = `${icon("refresh",16)} Memproses…`;
    try {
      await httpsCallable(fns, "requestWithdrawal")({
        amount: v, bank, accountNumber: acct, accountName: owner, idempotencyKey: uuid()
      });
      toast("Permintaan penarikan dibuat", "ok");
      $("#amount", root).value = "";
      validate();
      loadHistory();
    } catch (ex) {
      err.innerHTML = `${icon("alert",14)}<span>${esc(authErr(ex.code, ex.message))}</span>`;
    } finally { btn.disabled = false; btn.innerHTML = prev; }
  };

  async function loadHistory() {
    const el = $("#list", root);
    try {
      const snap = await get(query(ref(db,"withdrawals"),
        orderByChild("userId"), equalTo(state.user.uid), limitToLast(15)));
      const arr = []; snap.forEach(c => arr.push({ id: c.key, ...c.val() }));
      arr.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      if (!arr.length) {
        el.innerHTML = emptyState("arrowDown", "Belum ada penarikan",
          "Riwayat penarikan akan muncul di sini.");
        return;
      }
      const cls = { paid:"ok", completed:"ok", processing:"warn", pending:"warn", failed:"err", rejected:"err" };
      el.innerHTML = `<div class="list">${arr.map(w => `
        <div class="item" style="cursor:default">
          <div class="item__ico pending">${icon("arrowDown",18)}</div>
          <div class="item__body">
            <div class="item__title">${rp(w.amount||0)}</div>
            <div class="item__sub">${esc((w.bank||"").toUpperCase())} ••${esc((w.accountNumber||"").slice(-4))} · ${fdate(w.createdAt)}</div>
          </div>
          <span class="badge ${cls[w.status]||""}">${esc(w.status||"—")}</span>
        </div>`).join("")}</div>`;
    } catch (ex) {
      el.innerHTML = emptyState("alert", "Gagal memuat", authErr(ex.code, ex.message));
    }
  }
  loadHistory();
};

    (async () => {
      try {
        status.textContent = "Meminta izin kamera…";

      const prev = btn.innerHTML; btn.innerHTML = `${icon("refresh",16)} Memproses…`;
      try {
        const res = await httpsCallable(fns, "payQris")({ payload, idempotencyKey: uuid() });
        toast("Pembayaran QRIS berhasil", "ok");
        if (res.data?.transactionId) setTimeout(() => showTxDetail(res.data.transactionId), 300);
      } catch (ex) {
        err.innerHTML = `${icon("alert",14)}<span>${esc(authErr(ex.code, ex.message))}</span>`;
      } finally { btn.disabled = false; btn.innerHTML = prev; }

          ${icon("refresh",18)} Buat / Perbarui Kode
        </button>
        <div id="qrBox" class="mt"></div>
      </div>`;
    $("#gen", panel).onclick = async () => {
      const btn = $("#gen", panel); btn.disabled = true;
      const prev = btn.innerHTML; btn.innerHTML = `${icon("refresh",16)} Memuat…`;
      try {
        const res = await httpsCallable(fns, "createQrisCode")({ idempotencyKey: uuid() });
        const d = res.data || {};
        $("#qrBox", panel).innerHTML = `
          <div class="card" style="background:var(--surface-2);box-shadow:none;text-align:center">
            ${d.imageUrl ? `<img src="${esc(d.imageUrl)}" alt="QR" style="max-width:260px;margin:0 auto;border-radius:12px">` : ""}
            <div class="kv mt"><span>Referensi</span><span>${esc(d.reference||"—")}</span></div>
            ${d.expiresAt ? `<div class="kv"><span>Berlaku s/d</span><span>${fdate(d.expiresAt)}</span></div>` : ""}
          </div>`;
      } catch (ex) {
        $("#qrBox", panel).innerHTML = emptyState("alert","Tidak tersedia", authErr(ex.code, ex.message));
      } finally { btn.disabled = false; btn.innerHTML = prev; }
    };

  $$(".pilltab", root).forEach(b => b.onclick = () => {
    $$(".pilltab", root).forEach(x => x.classList.toggle("active", x === b));

          <option value="pending">Pending</option>

          <option value="failed">Gagal</option>
          <option value="expired">Kedaluwarsa</option>
        </select>
      </div>
      <div class="field mt">
        <input class="input" id="fRef" placeholder="Cari nomor referensi…" maxlength="40">
      </div>
      <button class="btn btn-blue btn-block" id="apply">Terapkan</button>
    </div>

    <div id="list" class="mt">${skeletonList(4)}</div>`;

  const render = async () => {
    const el = $("#list", root);
    el.innerHTML = skeletonList(4);
    try {
      const uid = state.user.uid;
      const snap = await get(query(ref(db,"transactions"),
        orderByChild("userId"), equalTo(uid), limitToLast(200)));
      let arr = []; snap.forEach(c => arr.push({ id: c.key, ...c.val() }));
      arr.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

      const t = $("#fType", root).value;
      const s = $("#fStatus", root).value;
      const r = $("#fRef", root).value.trim().toLowerCase();
      arr = arr.filter(x => {
        if (t && x.transactionType !== t) return false;
        if (s && x.status !== s) return false;
        if (r && !String(x.referenceNumber||"").toLowerCase().includes(r)) return false;
        return true;
      });
      if (!arr.length) {
        el.innerHTML = emptyState("search", "Tidak ditemukan",
          "Coba ubah filter atau kata kunci pencarian.");
        return;
      }
      el.innerHTML = `<div class="list">${arr.map(txItemHTML).join("")}</div>`;

      el.innerHTML = emptyState("alert","Gagal memuat", authErr(ex.code, ex.message));
    }
  };
  $("#apply", root).onclick = render;
  render();
};

      <div class="item" data-act="logout">

        <div class="item__body"><div class="item__title" style="color:#B91C1C">Keluar</div></div>
      </div>
    </div>

    <div class="section-title">Zona Berbahaya</div>
    <div class="card card--flush">
      <div class="item" data-act="delete">
        <div class="item__ico out">${icon("alert",18)}</div>
        <div class="item__body"><div class="item__title" style="color:#B91C1C">Hapus Akun</div><div class="item__sub">Tindakan permanen</div></div>
      </div>
    </div>`;

  $("#sendVerify", root)?.addEventListener("click", async () => {
    try { await sendEmailVerification(user); toast("Email verifikasi dikirim", "ok"); }
    catch (ex) { toast(authErr(ex.code, ex.message), "err"); }
  });

  $$("[data-act]", root).forEach(el => el.onclick = async () => {
    const a = el.dataset.act;
    if (a === "edit-name") editName();
    else if (a === "change-pw") changePassword();
    else if (a === "change-pin") changePin();
    else if (a === "settings") navigate("settings");
    else if (a === "admin") navigate("admin");
    else if (a === "logout") {
      if (await confirmDialog("Keluar", "Anda yakin ingin keluar dari akun?", "Keluar")) signOut(auth);
    }
    else if (a === "delete") deleteAccountFlow();
  });

  function editName() {
    const m = modal(`
      <h2>Ubah Nama</h2>
      <div class="field"><label>Nama</label>
        <input class="input" id="name" value="${esc(profile?.displayName||"")}" maxlength="40"></div>
      <div class="err-text" id="err"></div>
      <div class="grid2 mt">
        <button class="btn btn-ghost" id="cancel">Batal</button>
        <button class="btn btn-primary" id="ok">Simpan</button>
      </div>`);
    m.$("#cancel").onclick = () => m.close();
    m.$("#ok").onclick = async () => {
      const name = m.$("#name").value.trim();
      if (!name) { m.$("#err").textContent = "Nama wajib diisi."; return; }
      try {
        await update(ref(db, `users/${user.uid}`), { displayName: name });
        await updateProfile(user, { displayName: name });
        state.profile.displayName = name;
        m.close(); toast("Nama diperbarui", "ok"); renderRoute();
      } catch (ex) { m.$("#err").textContent = authErr(ex.code, ex.message); }
    };
  }

  function changePassword() {
    const m = modal(`
      <h2>Ubah Kata Sandi</h2>
      <div class="field"><label>Sandi saat ini</label>
        <input class="input" id="old" type="password" autocomplete="current-password"></div>
      <div class="field"><label>Sandi baru (min. 8)</label>
        <input class="input" id="new" type="password" autocomplete="new-password"></div>
      <div class="err-text" id="err"></div>
      <div class="grid2 mt">
        <button class="btn btn-ghost" id="cancel">Batal</button>
        <button class="btn btn-primary" id="ok">Ubah</button>
      </div>`);
    m.$("#cancel").onclick = () => m.close();
    m.$("#ok").onclick = async () => {
      const o = m.$("#old").value, n = m.$("#new").value;
      const err = m.$("#err");
      if (!o || !n) { err.textContent = "Isi kedua kolom."; return; }
      if (n.length < 8) { err.textContent = "Sandi baru minimal 8 karakter."; return; }
      try {
        const cred = EmailAuthProvider.credential(user.email, o);
        await reauthenticateWithCredential(user, cred);
        await updatePassword(user, n);
        m.close(); toast("Kata sandi diubah", "ok");
      } catch (ex) { err.textContent = authErr(ex.code, ex.message); }
    };
  }

  function changePin() {
    const m = modal(`
      <h2>Ubah PIN</h2>
      <div class="field"><label>PIN saat ini</label>
        <input class="input" id="old" type="password" inputmode="numeric" maxlength="6"></div>
      <div class="field"><label>PIN baru (6 digit)</label>
        <input class="input" id="new" type="password" inputmode="numeric" maxlength="6"></div>
      <div class="field"><label>Konfirmasi PIN baru</label>
        <input class="input" id="new2" type="password" inputmode="numeric" maxlength="6"></div>
      <div class="err-text" id="err"></div>
      <div class="grid2 mt">
        <button class="btn btn-ghost" id="cancel">Batal</button>
        <button class="btn btn-primary" id="ok">Simpan</button>
      </div>`);
    ["old","new","new2"].forEach(id => m.$("#"+id).addEventListener("input",
      e => e.target.value = e.target.value.replace(/\D/g,"").slice(0,6)));
    m.$("#cancel").onclick = () => m.close();
    m.$("#ok").onclick = async () => {
      const o = m.$("#old").value, n = m.$("#new").value, n2 = m.$("#new2").value;
      const err = m.$("#err");
      if (!/^\d{6}$/.test(o) || !/^\d{6}$/.test(n)) { err.textContent = "PIN harus 6 digit."; return; }
      if (n !== n2) { err.textContent = "Konfirmasi PIN tidak cocok."; return; }
      if (/^(\d)\1{5}$/.test(n)) { err.textContent = "PIN terlalu mudah."; return; }
      try {
        const salt = randomSalt();
        const pinHash = await sha256Hex(salt + ":" + n);
        const oldHash = await sha256Hex("__verify__:" + o); // verifikasi lama dilakukan server
        await httpsCallable(fns, "changePin")({ oldPin: o, newPinHash: pinHash, newPinSalt: salt });
        m.close(); toast("PIN diubah", "ok");
      } catch (ex) { err.textContent = authErr(ex.code, ex.message); }
    };
  }

  function deleteAccountFlow() {
    const m = modal(`
      <h2>Hapus Akun</h2>
      <p class="hint" style="line-height:1.5;margin:0 0 14px">
        Tindakan ini permanen. Pastikan saldo Anda sudah ditarik. Riwayat transaksi disimpan sesuai kebijakan.
      </p>
      <div class="field"><label>Kata Sandi</label>
        <input class="input" id="pw" type="password" autocomplete="current-password"></div>
      <div class="err-text" id="err"></div>
      <div class="grid2 mt">
        <button class="btn btn-ghost" id="cancel">Batal</button>
        <button class="btn btn-danger" id="ok">Hapus Akun</button>
      </div>`);
    m.$("#cancel").onclick = () => m.close();
    m.$("#ok").onclick = async () => {
      try {
        const cred = EmailAuthProvider.credential(user.email, m.$("#pw").value);
        await reauthenticateWithCredential(user, cred);
        await update(ref(db, `users/${user.uid}`), { accountStatus: "deleted" });
        await deleteUser(user);
        toast("Akun dihapus", "ok");
      } catch (ex) { m.$("#err").textContent = authErr(ex.code, ex.message); }
    };
  }
};

/* =========================================================
   ROUTE: SETTINGS
========================================================= */
ROUTES.settings = (root) => {
  root.innerHTML = `
    <div class="row row-between" style="margin:0 4px 14px">
      <button class="iconbtn iconbtn--plain" id="back">${icon("arrowLeft",20)}</button>
      <div style="font-weight:800;font-size:16px">Pengaturan</div>
      <div style="width:38px"></div>
    </div>

    <div class="section-title" style="margin-top:0">Tampilan</div>
    <div class="card card--flush">
      <div class="item" style="cursor:default">
        <div class="item__ico">${icon("eye",18)}</div>
        <div class="item__body"><div class="item__title">Tema</div><div class="item__sub">Terang atau gelap</div></div>
        <select class="input" id="theme" style="width:auto">
          <option value="light">Terang</option>
          <option value="dark">Gelap</option>
        </select>
      </div>
    </div>

    <div class="section-title">Keamanan</div>
    <div class="card card--flush">
      <div class="item" style="cursor:default">
        <div class="item__ico">${icon("lock",18)}</div>
        <div class="item__body"><div class="item__title">Sembunyikan Saldo</div>
          <div class="item__sub">Otomatis disembunyikan saat buka aplikasi</div></div>
        <label class="row" style="gap:8px">
          <input type="checkbox" id="hideBal" style="width:20px;height:20px">
        </label>
      </div>
    </div>

    <div class="section-title">Info</div>
    <div class="card card--flush">
      <div class="item" style="cursor:default">
        <div class="item__ico">${icon("info",18)}</div>
        <div class="item__body"><div class="item__title">Versi</div></div>
        <span class="badge">1.0.0</span>
      </div>
      <div class="item" data-act="tos">
        <div class="item__ico">${icon("receipt",18)}</div>
        <div class="item__body"><div class="item__title">Syarat Penggunaan</div></div>
        ${icon("chevronRight",18)}
      </div>
      <div class="item" data-act="privacy">
        <div class="item__ico">${icon("shield",18)}</div>
        <div class="item__body"><div class="item__title">Kebijakan Privasi</div></div>
        ${icon("chevronRight",18)}
      </div>
    </div>

    <button class="btn btn-danger btn-block mt-l" id="logout">${icon("logout",18)} Keluar Akun</button>`;

  $("#back", root).onclick = () => history.length > 1 ? history.back() : navigate("profile");
  $("#theme", root).value = state.theme;
  $("#theme", root).onchange = e => {
    state.theme = e.target.value;
    document.documentElement.dataset.theme = state.theme;
    localStorage.setItem("cazoo.theme", state.theme);
  };
  const hideBal = localStorage.getItem("cazoo.hideBal") === "1";
  state.hideBalance = hideBal;
  $("#hideBal", root).checked = hideBal;
  $("#hideBal", root).onchange = e => {
    localStorage.setItem("cazoo.hideBal", e.target.checked ? "1" : "0");
    state.hideBalance = e.target.checked;
  };
  $("#logout", root).onclick = async () => {
    if (await confirmDialog("Keluar", "Anda yakin ingin keluar?", "Keluar")) signOut(auth);
  };
  $$("[data-act]", root).forEach(el => el.onclick = () => {
    modal(`<h2>${el.dataset.act === "tos" ? "Syarat Penggunaan" : "Kebijakan Privasi"}</h2>
      <p class="hint" style="line-height:1.6">Dokumen lengkap disediakan oleh penyedia layanan Cazoo. Hubungi dukungan untuk salinan resmi.</p>
      <button class="btn btn-primary btn-block mt" onclick="document.getElementById('modal-root').innerHTML=''">Tutup</button>`);
  });
};

/* =========================================================
   ROUTE: ADMIN (read-only)
========================================================= */
ROUTES.admin = async (root) => {
  if (!state.isAdmin) {
    root.innerHTML = emptyState("shield", "Akses Ditolak", "Anda bukan admin.");
    return;
  }
  root.innerHTML = `
    <div style="font-weight:800;font-size:20px;letter-spacing:-.3px;margin:0 4px 14px">Panel Admin</div>
    <div class="card" id="stats">${skeletonList(1)}</div>
    <div class="section-title">Permintaan Pending</div>
    <div class="card card--flush" id="pending">${skeletonList(2)}</div>`;
  try {
    const [uSnap, tSnap] = await Promise.all([
      get(ref(db, "users")),
      get(query(ref(db, "transactions"), limitToLast(500)))
    ]);
    const users = uSnap.size || 0;
    const tx = []; tSnap.forEach(c => tx.push(c.val()));
    const succ = tx.filter(t => t.status === "success");
    const total = succ.reduce((a,b) => a + (b.amount||0), 0);
    const pending = tx.filter(t => t.status === "pending" || t.status === "processing");

    $("#stats", root).innerHTML = `
      <div class="grid2">
        <div><div class="hint">Pengguna</div><div style="font-size:22px;font-weight:800">${users}</div></div>
        <div><div class="hint">Total Transaksi</div><div style="font-size:22px;font-weight:800">${tx.length}</div></div>
      </div>
      <div class="mt">
        <div class="kv"><span>Sukses</span><span>${succ.length}</span></div>
        <div class="kv"><span>Pending</span><span>${pending.length}</span></div>
        <div class="kv"><span>Gagal</span><span>${tx.filter(t=>t.status==="failed").length}</span></div>
        <div class="kv"><span>Total Nilai (sukses)</span><span>${rp(total)}</span></div>
      </div>`;
    $("#pending", root).innerHTML = pending.length
      ? `<div class="list">${pending.slice(0,10).map(t => `
          <div class="item" data-tx="${esc(t.transactionId||"")}">
            <div class="item__ico pending">${icon("clock",18)}</div>
            <div class="item__body">
              <div class="item__title">${esc(t.transactionType||"—")}</div>
              <div class="item__sub">${esc(t.userId||"")} · ${fdate(t.createdAt)}</div>
            </div>
            <div class="item__amt out">${rp(t.amount||0)}</div>
          </div>`).join("")}</div>`
      : emptyState("check", "Tidak ada pending", "Semua permintaan telah diproses.");
  } catch (ex) {
    $("#stats", root).innerHTML = emptyState("alert","Gagal memuat", authErr(ex.code, ex.message));
  }
};

/* =========================================================
   BOOTSTRAP
========================================================= */
// Hide splash setelah app siap
setTimeout(() => {
  document.querySelector(".splash")?.classList.add("hide");
  setTimeout(() => document.querySelector(".splash")?.remove(), 400);
}, 500);

// PWA service worker (opsional)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").catch(() => {});
}

// Idle auto-lock: setelah 15 menit idle, minta PIN untuk melihat saldo
let lastActivity = Date.now();
["click","touchstart","keydown","scroll"].forEach(ev =>
  window.addEventListener(ev, () => { lastActivity = Date.now(); }, { passive: true }));
setInterval(() => {
  if (!state.user) return;
  if (Date.now() - lastActivity > 15*60*1000) {
    state.hideBalance = true;
    lastActivity = Date.now();
  }
}, 60_000);
</script>
