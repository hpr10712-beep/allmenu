<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MyBro - Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0b1120;
            --panel: #1e293b;
            --panel-hover: #334155;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --safe-top: env(safe-area-inset-top);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { 
            padding: calc(15px + var(--safe-top)) 20px 15px; 
            background: rgba(11, 17, 32, 0.9); backdrop-filter: blur(15px); 
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }
        .my-id-tag { background: var(--panel); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); }

        /* CONTENT VIEWS */
        .content { flex: 1; overflow-y: auto; padding: 15px 15px 90px; }
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        h4 { font-size: 0.95rem; font-weight: 600; color: var(--text-dim); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* CARDS (CHAT & CONTACT) */
        .card { 
            background: transparent; border-radius: 12px; padding: 12px; margin-bottom: 5px; 
            display: flex; align-items: center; gap: 15px; transition: 0.2s; cursor: pointer;
        }
        .card:hover, .card:active { background: var(--panel); }
        
        /* STORY RING PFP */
        .pfp-wrap { position: relative; width: 52px; height: 52px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .pfp-wrap.has-story { background: linear-gradient(45deg, var(--accent), #3b82f6); padding: 2px; }
        .pfp-wrap.has-story img { border: 2px solid var(--bg); }
        .pfp { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--panel); }

        .card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .card-name { font-weight: 600; font-size: 1rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-time { font-size: 0.75rem; color: var(--text-dim); flex-shrink: 0; }
        .card-msg { font-size: 0.85rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ADD STORY BUTTON */
        .my-story-btn { background: var(--panel); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; cursor: pointer; }
        .add-story-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-glow); color: var(--accent); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }

        /* MODALS */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; z-index: 1000; align-items: flex-end; }
        .overlay.active { display: flex; }
        .sheet { background: var(--bg); width: 100%; border-radius: 20px 20px 0 0; padding: 25px 20px 40px; transform: translateY(100%); transition: 0.3s ease; border-top: 1px solid var(--border); }
        .overlay.active .sheet { transform: translateY(0); }

        /* INPUTS & BUTTONS */
        input[type="text"], textarea { width: 100%; padding: 14px 16px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: white; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: var(--accent); }
        .btn-fill { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: 600; font-size: 1rem; cursor: pointer; }

        /* STORY VIEWER (FULLSCREEN) */
        #storyViewer { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; flex-direction: column; }
        .story-progress-container { display: flex; gap: 4px; padding: calc(10px + var(--safe-top)) 10px 10px; position: absolute; top: 0; left: 0; right: 0; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .story-progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        .story-progress-fill { height: 100%; background: white; width: 0%; transition: width 0.1s linear; }
        .story-header { position: absolute; top: 40px; left: 0; right: 0; padding: 10px 15px; display: flex; align-items: center; gap: 10px; z-index: 10; }
        .story-media { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .story-media img, .story-media video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .story-footer { padding: 15px; display: flex; gap: 10px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); align-items: center; }
        .story-views { font-size: 0.8rem; color: white; display: flex; align-items: center; gap: 5px; margin-bottom: 10px; position: absolute; bottom: 70px; left: 15px; }

        /* CHAT PANEL */
        #chatPanel { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; transform: translateX(100%); transition: 0.3s ease; }
        #chatPanel.active { transform: translateX(0); }
        .chat-header { padding: calc(10px + var(--safe-top)) 15px 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; background: rgba(11, 17, 32, 0.95); backdrop-filter: blur(10px); }
        #msgArea { flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 10px 14px; border-radius: 16px; max-width: 78%; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; position: relative; }
        .bubble .time { display: block; font-size: 0.65rem; margin-top: 4px; text-align: right; opacity: 0.7; }
        .sent { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .chat-input-area { padding: 12px 15px 25px; display: flex; gap: 10px; background: var(--bg); border-top: 1px solid var(--border); }

        /* NAV BOTTOM */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(11, 17, 32, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; z-index: 500; }
        .nav-link { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; color: var(--text-dim); font-size: 0.7rem; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .nav-link i { font-size: 1.3rem; margin-bottom: 2px; }
        .nav-link.active { color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="logo">My<span>Bro</span></div>
        <div class="my-id-tag" id="displayID" onclick="copyID()">ID: ...</div>
    </header>

    <div class="content">
        <div id="v-chats" class="view active">
            <h4>Pesan Terbaru</h4>
            <div id="chatList"></div>
        </div>

        <div id="v-status" class="view">
            <h4>Status Saya</h4>
            <div class="my-story-btn" onclick="document.getElementById('storyUpload').click()">
                <div class="add-story-icon"><i class="fas fa-plus"></i></div>
                <div class="card-info">
                    <div class="card-name">Tambah Status</div>
                    <div class="card-msg">Ketuk untuk membagikan foto/video</div>
                </div>
            </div>
            <input type="file" id="storyUpload" accept="image/*,video/mp4,video/webm" style="display:none" onchange="window.app.uploadStory(this)">
            
            <h4>Pembaruan Teman</h4>
            <div id="storyList"></div>
        </div>

        <div id="v-contacts" class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h4 style="margin:0">Kontak Saya</h4>
                <button onclick="toggleOverlay('popAdd', true)" style="background:var(--accent); border:none; color:white; padding:6px 12px; border-radius:8px; font-weight:600; font-size:0.8rem;"><i class="fas fa-user-plus"></i> Tambah</button>
            </div>
            <div id="contactList"></div>
        </div>
    </div>

    <nav>
        <div class="nav-link active" onclick="showTab('v-chats', this)"><i class="fas fa-comment-dots"></i><span>Obrolan</span></div>
        <div class="nav-link" onclick="showTab('v-status', this)"><i class="fas fa-circle-notch"></i><span>Status</span></div>
        <div class="nav-link" onclick="showTab('v-contacts', this)"><i class="fas fa-users"></i><span>Teman</span></div>
        <div class="nav-link" onclick="toggleOverlay('popProfile', true)"><i class="fas fa-user"></i><span>Profil</span></div>
    </nav>

    <div class="overlay" id="popAdd" onclick="closeOverlay(event)">
        <div class="sheet">
            <h3 style="margin-bottom: 15px;">Tambah Teman</h3>
            <input type="text" id="targetID" placeholder="Masukkan ID (Contoh: BRO-1234)">
            <button class="btn-fill" onclick="window.app.addFriend()">Simpan Kontak</button>
        </div>
    </div>

    <div class="overlay" id="popProfile" onclick="closeOverlay(event)">
        <div class="sheet">
            <h3 style="margin-bottom: 20px; text-align:center;">Edit Profil</h3>
            <div style="text-align:center; margin-bottom:20px;">
                <div class="pfp-wrap" style="width:90px; height:90px; margin:0 auto;">
                    <img id="pfpEdit" src="" class="pfp">
                </div>
                <button onclick="document.getElementById('filePfp').click()" style="background:none; border:none; color:var(--accent); margin-top:10px; font-weight:600; cursor:pointer;">Ubah Foto</button>
                <input type="file" id="filePfp" accept="image/*,video/*" style="display:none" onchange="window.app.handlePfp(this)">
            </div>
            <input type="text" id="editName" placeholder="Nama Lengkap">
            <textarea id="editBio" placeholder="Bio singkat..." rows="2"></textarea>
            <button class="btn-fill" onclick="window.app.updateProfile()">Simpan Profil</button>
        </div>
    </div>

    <div id="storyViewer">
        <div class="story-progress-container"><div class="story-progress-bar"><div class="story-progress-fill" id="storyProgress"></div></div></div>
        <div class="story-header">
            <i class="fas fa-arrow-left" onclick="window.app.closeStory()" style="color:white; font-size:1.2rem; cursor:pointer; text-shadow:0 1px 3px rgba(0,0,0,0.5);"></i>
            <img id="svPfp" src="" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
            <div style="flex:1">
                <div id="svName" style="color:white; font-weight:600; font-size:0.95rem; text-shadow:0 1px 3px rgba(0,0,0,0.5);">Nama</div>
                <div id="svTime" style="color:rgba(255,255,255,0.8); font-size:0.75rem;">Waktu</div>
            </div>
        </div>
        
        <div class="story-media" id="svMediaContainer" onclick="window.app.nextStory()">
            </div>

        <div class="story-views" id="svViews" style="display:none;"><i class="fas fa-eye"></i> <span id="svViewCount">0</span></div>

        <div class="story-footer" id="svFooter">
            <input type="text" id="storyReplyInp" placeholder="Balas status ini..." style="margin:0; background:rgba(255,255,255,0.2); border:none; backdrop-filter:blur(5px); color:white;">
            <button onclick="window.app.replyStory()" style="background:var(--accent); border:none; width:45px; height:45px; border-radius:12px; color:white;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="chatPanel">
        <div class="chat-header">
            <i class="fas fa-arrow-left" onclick="window.app.closeChat()" style="font-size:1.2rem; cursor:pointer;"></i>
            <img id="chatPfp" src="" class="pfp" style="width:40px; height:40px;">
            <div style="flex:1">
                <div id="chatName" style="font-weight:600; font-size:1rem;">...</div>
                <div style="font-size:0.75rem; color:var(--accent);">Online</div>
            </div>
        </div>
        <div id="msgArea"></div>
        <div class="chat-input-area">
            <input type="text" id="msgIn" placeholder="Ketik pesan..." style="margin:0; background:var(--panel);">
            <button onclick="window.app.send()" style="background:var(--accent); border:none; width:48px; height:48px; border-radius:12px; color:white;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f"
        };
        const app_fire = initializeApp(firebaseConfig);
        const db = getDatabase(app_fire);

        // -- STATE --
        let myID = localStorage.getItem('mybro_id');
        if(!myID) {
            myID = "BRO-" + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('mybro_id', myID);
            set(ref(db, `users/${myID}/profile`), { id: myID, name: "User " + myID.split('-')[1], pfp: "", bio: "Hello!" });
        }
        document.getElementById('displayID').innerText = myID;

        let activeTarget = null;
        let pfpBase64 = "";
        
        // Story State
        let currentStoryQueue = [];
        let currentStoryIndex = 0;
        let storyTimer;
        let viewingStoryOf = null;

        // -- UTILS --
        window.showTab = (id, el) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }
        window.toggleOverlay = (id, show) => {
            const el = document.getElementById(id);
            if(show) { el.classList.add('active'); el.style.display = 'flex'; }
            else { el.classList.remove('active'); setTimeout(() => el.style.display = 'none', 300); }
        }
        window.closeOverlay = (e) => { if(e.target.classList.contains('overlay')) toggleOverlay(e.target.id, false); }
        window.copyID = () => { navigator.clipboard.writeText(myID); alert("ID Disalin: " + myID); }
        
        const formatTime = (ts) => {
            const d = new Date(ts);
            const now = new Date();
            if(d.getDate() === now.getDate() && d.getMonth() === now.getMonth()) {
                return d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
            }
            return d.getDate() + "/" + (d.getMonth()+1);
        }

        // -- CORE LOGIC --
        window.app = {
            // PROFILE
            handlePfp: (input) => {
                const file = input.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    pfpBase64 = reader.result; // Accepts all photo/video formats supported by browser
                    document.getElementById('pfpEdit').src = pfpBase64;
                }
            },
            updateProfile: () => {
                const updates = { name: document.getElementById('editName').value, bio: document.getElementById('editBio').value };
                if(pfpBase64) updates.pfp = pfpBase64;
                update(ref(db, `users/${myID}/profile`), updates);
                toggleOverlay('popProfile', false);
            },
            addFriend: () => {
                const tid = document.getElementById('targetID').value.trim().toUpperCase();
                if(!tid || tid === myID) return;
                set(ref(db, `users/${myID}/contacts/${tid}`), { id: tid });
                toggleOverlay('popAdd', false);
            },

            // CHAT SYSTEM
            openChat: (id, name, pfp) => {
                activeTarget = id;
                document.getElementById('chatName').innerText = name;
                document.getElementById('chatPfp').src = pfp;
                document.getElementById('chatPanel').classList.add('active');
                
                const room = [myID, id].sort().join("_");
                onValue(ref(db, `chats/${room}`), (snap) => {
                    const area = document.getElementById('msgArea');
                    area.innerHTML = "";
                    snap.forEach(child => {
                        const m = child.val();
                        area.innerHTML += `
                            <div class="bubble ${m.from === myID ? 'sent' : 'received'}">
                                ${m.text}
                                <span class="time">${formatTime(m.time)}</span>
                            </div>`;
                    });
                    area.scrollTop = area.scrollHeight;
                });
            },
            closeChat: () => {
                document.getElementById('chatPanel').classList.remove('active');
                activeTarget = null;
            },
            send: (customText = null) => {
                const inp = document.getElementById('msgIn');
                const text = customText || inp.value;
                if(!text || !activeTarget) return;
                const room = [myID, activeTarget].sort().join("_");
                push(ref(db, `chats/${room}`), { from: myID, text: text, time: Date.now() });
                if(!customText) inp.value = "";
            },

            // STORY SYSTEM
            uploadStory: (input) => {
                const file = input.files[0];
                if(!file) return;
                if(file.size > 5 * 1024 * 1024) return alert("Maksimal ukuran file 5MB untuk versi ini.");
                
                const type = file.type.startsWith('video') ? 'video' : 'image';
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    push(ref(db, `stories/${myID}`), {
                        media: reader.result, type: type, time: Date.now(), views: 0
                    });
                    alert("Status berhasil diunggah!");
                }
            },
            openStory: (userId, userName, userPfp, isMyStory) => {
                get(ref(db, `stories/${userId}`)).then(snap => {
                    if(!snap.exists()) return;
                    currentStoryQueue = [];
                    const now = Date.now();
                    snap.forEach(child => {
                        const s = child.val();
                        if(now - s.time < 24 * 60 * 60 * 1000) { // Only 24h stories
                            currentStoryQueue.push({ id: child.key, ...s });
                        }
                    });
                    if(currentStoryQueue.length === 0) return;
                    
                    viewingStoryOf = userId;
                    document.getElementById('svName').innerText = userName;
                    document.getElementById('svPfp').src = userPfp;
                    document.getElementById('storyViewer').style.display = 'flex';
                    
                    if(isMyStory) {
                        document.getElementById('svFooter').style.display = 'none';
                        document.getElementById('svViews').style.display = 'flex';
                    } else {
                        document.getElementById('svFooter').style.display = 'flex';
                        document.getElementById('svViews').style.display = 'none';
                    }

                    currentStoryIndex = 0;
                    window.app.renderCurrentStory();
                });
            },
            renderCurrentStory: () => {
                if(currentStoryIndex >= currentStoryQueue.length) return window.app.closeStory();
                
                const s = currentStoryQueue[currentStoryIndex];
                document.getElementById('svTime').innerText = formatTime(s.time);
                
                const container = document.getElementById('svMediaContainer');
                container.innerHTML = "";
                
                if(s.type === 'video') {
                    container.innerHTML = `<video src="${s.media}" autoplay playsinline></video>`;
                } else {
                    container.innerHTML = `<img src="${s.media}">`;
                }

                // Increment View
                if(viewingStoryOf !== myID) {
                    get(ref(db, `stories/${viewingStoryOf}/${s.id}/views`)).then(snap => {
                        update(ref(db, `stories/${viewingStoryOf}/${s.id}`), { views: (snap.val() || 0) + 1 });
                    });
                } else {
                    document.getElementById('svViewCount').innerText = s.views || 0;
                }

                // Progress Bar Animation
                const bar = document.getElementById('storyProgress');
                bar.style.transition = 'none'; bar.style.width = '0%';
                setTimeout(() => {
                    bar.style.transition = 'width 5s linear'; // 5s per story
                    bar.style.width = '100%';
                }, 50);

                clearTimeout(storyTimer);
                storyTimer = setTimeout(() => window.app.nextStory(), 5000);
            },
            nextStory: () => { currentStoryIndex++; window.app.renderCurrentStory(); },
            closeStory: () => {
                clearTimeout(storyTimer);
                document.getElementById('storyViewer').style.display = 'none';
                viewingStoryOf = null;
            },
            replyStory: () => {
                const inp = document.getElementById('storyReplyInp');
                if(!inp.value || !viewingStoryOf) return;
                activeTarget = viewingStoryOf;
                window.app.send(`Membahas status: "${inp.value}"`);
                inp.value = "";
                window.app.closeStory();
                alert("Balasan dikirim!");
            }
        };

        // -- DATA SYNC WATCHERS --
        
        // 1. Profil Sendiri
        onValue(ref(db, `users/${myID}/profile`), (snap) => {
            const d = snap.val(); if(!d) return;
            document.getElementById('editName').value = d.name;
            document.getElementById('editBio').value = d.bio;
            if(d.pfp) document.getElementById('pfpEdit').src = d.pfp;
        });

        // 2. Daftar Chat & Kontak (Realtime Last Message)
        onValue(ref(db, `users/${myID}/contacts`), (snap) => {
            const cList = document.getElementById('contactList');
            const rList = document.getElementById('chatList');
            const sList = document.getElementById('storyList');
            cList.innerHTML = ""; rList.innerHTML = ""; sList.innerHTML = "";

            snap.forEach(child => {
                const cid = child.key;
                const room = [myID, cid].sort().join("_");
                
                onValue(ref(db, `users/${cid}/profile`), (pSnap) => {
                    const p = pSnap.val() || { name: cid, pfp: "" };
                    const pfp = p.pfp || `https://ui-avatars.com/api/?name=${p.name}&background=1e293b&color=fff`;

                    // Generate Contact Card
                    const cCard = document.createElement('div'); cCard.className = 'card';
                    cCard.innerHTML = `<img src="${pfp}" class="pfp" style="width:45px;height:45px"><div class="card-info"><div class="card-name">${p.name}</div><div class="card-msg">${p.bio || 'Ada!'}</div></div>`;
                    cCard.onclick = () => window.app.openChat(cid, p.name, pfp);
                    cList.appendChild(cCard);

                    // Fetch Last Message for Chat List
                    const q = query(ref(db, `chats/${room}`), orderByChild('time'), limitToLast(1));
                    onValue(q, (msgSnap) => {
                        let lastMsg = "Mulai obrolan", lastTime = "";
                        msgSnap.forEach(m => { lastMsg = m.val().text; lastTime = formatTime(m.val().time); });
                        
                        // Check if user has active story
                        get(ref(db, `stories/${cid}`)).then(storySnap => {
                            let hasStory = false;
                            const now = Date.now();
                            if(storySnap.exists()) {
                                storySnap.forEach(s => { if(now - s.val().time < 86400000) hasStory = true; });
                            }

                            // Generate Chat Card
                            const existingChatCard = document.getElementById(`chat-${cid}`);
                            const htmlChat = `
                                <div class="pfp-wrap ${hasStory ? 'has-story' : ''}"><img src="${pfp}" class="pfp"></div>
                                <div class="card-info">
                                    <div class="card-header-flex"><div class="card-name">${p.name}</div><div class="card-time">${lastTime}</div></div>
                                    <div class="card-msg">${lastMsg}</div>
                                </div>
                            `;
                            
                            if(existingChatCard) {
                                existingChatCard.innerHTML = htmlChat;
                            } else {
                                const rCard = document.createElement('div');
                                rCard.className = 'card'; rCard.id = `chat-${cid}`;
                                rCard.innerHTML = htmlChat;
                                rCard.onclick = () => window.app.openChat(cid, p.name, pfp);
                                rList.appendChild(rCard);
                            }

                            // Generate Story Card if has story
                            if(hasStory) {
                                const existingStoryCard = document.getElementById(`story-${cid}`);
                                if(!existingStoryCard) {
                                    const sCard = document.createElement('div');
                                    sCard.className = 'card'; sCard.id = `story-${cid}`;
                                    sCard.innerHTML = `<div class="pfp-wrap has-story"><img src="${pfp}" class="pfp"></div><div class="card-info"><div class="card-name">${p.name}</div><div class="card-msg">Pembaruan baru</div></div>`;
                                    sCard.onclick = () => window.app.openStory(cid, p.name, pfp, false);
                                    sList.appendChild(sCard);
                                }
                            }
                        });
                    });
                });
            });
        });

    </script>
</body>
</html>
