<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV AI HD</title>
    <!-- TensorFlow & COCO-SSD -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e6edf3;
            overflow: hidden;
        }
        .container {
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            background: #0b0e14;
            display: flex;
            flex-direction: column;
            padding: 12px 16px 16px 16px;
        }
        /* HEADER MINIMALIS */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .header h1 span {
            color: #00d4ff;
        }
        .header h1 small {
            font-size: 11px;
            font-weight: 400;
            color: #8b949e;
            margin-left: 6px;
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #212830;
            padding: 4px 14px 4px 10px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3fb950;
            transition: 0.2s;
        }
        .dot.warning { background: #d29922; }
        .dot.danger { background: #f85149; }
        .dot.inactive { background: #484f58; }

        /* VIDEO WRAPPER FULL FLEX */
        .video-wrapper {
            position: relative;
            flex: 1;
            min-height: 0;
            border-radius: 16px;
            overflow: hidden;
            background: #010409;
            border: 1px solid #30363d;
        }
        #displayCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain; /* Menjaga aspek rasio */
        }
        /* HUD OVERLAY */
        .hud {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            color: #8b949e;
            background: rgba(11, 14, 20, 0.7);
            backdrop-filter: blur(6px);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid #30363d55;
            pointer-events: none;
        }
        .hud-left, .hud-right { display: flex; gap: 18px; }
        .hud .val { color: #f0f6fc; }
        .hud .val.hd { color: #00d4ff; font-weight: 700; }

        /* INFO GRID KOMPAK */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
            flex-shrink: 0;
        }
        .info-card {
            background: #0d1117;
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
            border: 1px solid #212830;
        }
        .info-card .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #8b949e;
        }
        .info-card .value {
            font-size: 14px;
            font-weight: 600;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
            color: #f0f6fc;
        }
        .info-card .value.alert { color: #f0883e; }
        .info-card .value.danger { color: #f85149; }
        .info-card .value.success { color: #3fb950; }

        /* LOG & BUTTONS ROW */
        .bottom-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-shrink: 0;
        }
        .log-box {
            flex: 2;
            background: #0d1117;
            border-radius: 12px;
            padding: 8px 12px;
            max-height: 48px;
            overflow-y: auto;
            font-size: 11px;
            font-family: 'SF Mono', 'Courier New', monospace;
            color: #8b949e;
            border: 1px solid #212830;
            line-height: 1.6;
            white-space: nowrap;
        }
        .log-box::-webkit-scrollbar { width: 3px; }
        .log-box::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
        .log-alert { color: #f0883e; }
        .log-danger { color: #f85149; }

        .btn-group {
            display: flex;
            gap: 8px;
            flex: 1;
        }
        .btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #212830;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
        .btn-primary:hover { background: #388bfd; }
        .btn-success { background: #238636; border-color: #238636; color: #fff; }
        .btn-success:hover { background: #2ea043; }
        .btn-outline { background: transparent; border-color: #30363d; }
        .btn-outline:hover { background: #212830; }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1>📹 <span>CCTV</span> AI <small>FULL HD</small></h1>
        <div class="status-pill">
            <span class="dot" id="statusDot"></span>
            <span id="statusLabel">SIAGA</span>
        </div>
    </div>

    <!-- VIDEO -->
    <div class="video-wrapper">
        <canvas id="displayCanvas"></canvas>
        <video id="sourceVideo" autoplay playsinline style="display:none;"></video>
        <div class="hud">
            <div class="hud-left">
                <span>👤 <span class="val" id="humanCount">0</span></span>
                <span>⚡ <span class="val" id="fpsDisplay">0</span> FPS</span>
                <span>📹 <span class="val hd" id="resDisplay">--x--</span></span>
            </div>
            <div class="hud-right">
                <span>⏱ <span class="val" id="recTimeDisplay">IDLE</span></span>
            </div>
        </div>
    </div>

    <!-- INFO GRID -->
    <div class="info-grid">
        <div class="info-card">
            <div class="label">Inferensi AI</div>
            <div class="value" id="inferDisplay">0 ms</div>
        </div>
        <div class="info-card">
            <div class="label">Konfidensi</div>
            <div class="value" id="confDisplay">0%</div>
        </div>
        <div class="info-card">
            <div class="label">Status Rekam</div>
            <div class="value" id="recStatusDisplay">■ Berhenti</div>
        </div>
        <div class="info-card">
            <div class="label">Deteksi</div>
            <div class="value success" id="detectStatus">Aman</div>
        </div>
    </div>

    <!-- BOTTOM ROW: LOG + BUTTONS -->
    <div class="bottom-row">
        <div class="log-box" id="logArea">
            > Sistem siap. Tekan "Mulai".
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btnStart">▶ Mulai</button>
            <button class="btn btn-success" id="btnDownload">⬇</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // --- DOM ---
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const logArea = document.getElementById('logArea');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const humanCount = document.getElementById('humanCount');
        const fpsDisplay = document.getElementById('fpsDisplay');
        const resDisplay = document.getElementById('resDisplay');
        const inferDisplay = document.getElementById('inferDisplay');
        const confDisplay = document.getElementById('confDisplay');
        const recTimeDisplay = document.getElementById('recTimeDisplay');
        const recStatusDisplay = document.getElementById('recStatusDisplay');
        const detectStatus = document.getElementById('detectStatus');
        const btnStart = document.getElementById('btnStart');
        const btnDownload = document.getElementById('btnDownload');

        // --- STATE ---
        let isRunning = false;
        let model = null;
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let animFrameId = null;
        let detectionTimerId = null;

        // Statistik
        let frameCount = 0;
        let fps = 0;
        let lastFpsUpdate = performance.now();
        let humanDetected = false;
        let humanCounter = 0;
        const MIN_CONSECUTIVE = 2;

        // Smoothing bounding box
        let smoothBoxes = [];
        const SMOOTH_FACTOR = 0.6;

        // --- SUARA "MANUSIA TERDETEKSI" (Speech Synthesis) ---
        let lastSpeakTime = 0;
        function speakHumanDetected() {
            const now = Date.now();
            if (now - lastSpeakTime < 3000) return; // Jangan spam suara
            lastSpeakTime = now;
            if ('speechSynthesis' in window) {
                // Hentikan suara sebelumnya agar tidak numpuk
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance('Manusia terdeteksi');
                msg.lang = 'id-ID';
                msg.rate = 0.9;
                msg.pitch = 1.1;
                msg.volume = 0.8;
                // Cari suara bahasa Indonesia jika ada
                const voices = window.speechSynthesis.getVoices();
                const idVoice = voices.find(v => v.lang.startsWith('id'));
                if (idVoice) msg.voice = idVoice;
                window.speechSynthesis.speak(msg);
            }
        }

        // --- RESIZE CANVAS ke resolusi video asli ---
        function resizeCanvasToVideo() {
            if (video.videoWidth > 0 && video.videoHeight > 0) {
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                if (canvas.width !== vw || canvas.height !== vh) {
                    canvas.width = vw;
                    canvas.height = vh;
                }
                resDisplay.textContent = `${vw}x${vh}`;
            }
        }

        // --- LOG ---
        function addLog(msg, type = '') {
            const time = new Date().toLocaleTimeString('id-ID');
            let cls = '';
            if (type === 'alert') cls = 'log-alert';
            else if (type === 'danger') cls = 'log-danger';
            logArea.innerHTML += `<div class="${cls}">> [${time}] ${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
            while (logArea.children.length > 20) logArea.removeChild(logArea.firstChild);
        }

        // --- DRAW LOOP (60 FPS) - Kualitas HD ---
        function drawLoop(timestamp) {
            if (!isRunning) {
                animFrameId = requestAnimationFrame(drawLoop);
                return;
            }

            // FPS counter
            frameCount++;
            if (timestamp - lastFpsUpdate >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsUpdate = timestamp;
                fpsDisplay.textContent = fps;
            }

            // Gambar dengan resolusi asli video
            if (video.readyState >= 2) {
                // Pastikan canvas sesuai resolusi video
                if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                    resizeCanvasToVideo();
                }

                const w = canvas.width, h = canvas.height;
                // Efek CCTV: blur halus 1.5px + hitam putih + kontras
                ctx.filter = 'blur(1.5px) grayscale(100%) contrast(1.15)';
                ctx.drawImage(video, 0, 0, w, h);
                ctx.filter = 'none';

                // Gambar bounding box HIJAU dengan smoothing
                if (humanDetected && smoothBoxes.length > 0) {
                    const box = smoothBoxes[0];
                    const [x, y, bw, bh] = box;
                    
                    // Glow hijau tipis
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 12;
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x, y, bw, bh);
                    ctx.shadowBlur = 0;
                    
                    // Fill transparan hijau
                    ctx.fillStyle = 'rgba(0, 255, 136, 0.18)';
                    ctx.fillRect(x, y, bw, bh);
                    
                    // Label "MANUSIA" hijau
                    ctx.font = 'bold 16px -apple-system, sans-serif';
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#000';
                    ctx.shadowBlur = 8;
                    ctx.fillText('● MANUSIA', x, y - 10);
                    ctx.shadowBlur = 0;
                }

                // Update status deteksi di info grid
                if (humanDetected) {
                    detectStatus.textContent = '⚠️ Manusia';
                    detectStatus.className = 'value danger';
                } else {
                    detectStatus.textContent = '✅ Aman';
                    detectStatus.className = 'value success';
                }
            }

            animFrameId = requestAnimationFrame(drawLoop);
        }

        // --- DETEKSI AI (dipanggil per 250ms) ---
        async function runDetection() {
            if (!isRunning || !model || video.readyState < 2) {
                detectionTimerId = setTimeout(runDetection, 250);
                return;
            }

            const startTime = performance.now();
            try {
                const predictions = await model.detect(video);
                const inferenceTime = (performance.now() - startTime).toFixed(0);
                inferDisplay.textContent = inferenceTime + ' ms';

                // Filter manusia
                const humans = predictions.filter(p => p.class === 'person' && p.score > 0.4);
                humanCount.textContent = humans.length;

                let maxConf = 0;
                if (humans.length > 0) {
                    maxConf = Math.max(...humans.map(h => h.score));
                    confDisplay.textContent = (maxConf * 100).toFixed(0) + '%';
                } else {
                    confDisplay.textContent = '0%';
                }

                // --- SMOOTHING BOUNDING BOX HIJAU ---
                if (humans.length > 0) {
                    const best = humans.reduce((a, b) => a.score > b.score ? a : b);
                    const [x, y, w, h] = best.bbox;
                    if (smoothBoxes.length === 0) {
                        smoothBoxes = [[x, y, w, h]];
                    } else {
                        const prev = smoothBoxes[0];
                        const sx = prev[0] + (x - prev[0]) * SMOOTH_FACTOR;
                        const sy = prev[1] + (y - prev[1]) * SMOOTH_FACTOR;
                        const sw = prev[2] + (w - prev[2]) * SMOOTH_FACTOR;
                        const sh = prev[3] + (h - prev[3]) * SMOOTH_FACTOR;
                        smoothBoxes = [[sx, sy, sw, sh]];
                    }
                } else {
                    if (smoothBoxes.length > 0) {
                        const prev = smoothBoxes[0];
                        const sx = prev[0] + (0 - prev[0]) * 0.15;
                        const sy = prev[1] + (0 - prev[1]) * 0.15;
                        const sw = prev[2] * 0.85;
                        const sh = prev[3] * 0.85;
                        if (sw < 2 || sh < 2) {
                            smoothBoxes = [];
                        } else {
                            smoothBoxes = [[sx, sy, sw, sh]];
                        }
                    }
                }

                // Logika deteksi konsisten
                if (humans.length > 0) {
                    humanCounter++;
                } else {
                    humanCounter = 0;
                }

                const confirmed = humanCounter >= MIN_CONSECUTIVE;

                if (confirmed && !humanDetected) {
                    humanDetected = true;
                    statusDot.className = 'dot danger';
                    statusLabel.textContent = 'TERDETEKSI';
                    // Panggil suara "Manusia Terdeteksi"
                    speakHumanDetected();
                    addLog('🚨 Manusia terdeteksi! Suara diputar.', 'danger');
                    startRecording();
                } else if (!confirmed && humanDetected) {
                    humanDetected = false;
                    statusDot.className = 'dot';
                    statusLabel.textContent = 'SIAGA';
                    addLog('✅ Manusia pergi.', 'alert');
                    stopRecording();
                    smoothBoxes = [];
                } else if (confirmed) {
                    statusDot.className = 'dot danger';
                    statusLabel.textContent = 'TERDETEKSI';
                }

            } catch (err) {
                // ignore
            }

            detectionTimerId = setTimeout(runDetection, 250);
        }

        // --- REKAM (HD) ---
        function startRecording() {
            if (isRecording || !isRunning) return;
            try {
                // Capture dari canvas resolusi HD
                const canvasStream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(canvasStream, {
                    mimeType: 'video/webm;codecs=vp9,opus',
                    bitsPerSecond: 2500000 // 2.5 Mbps untuk HD
                });
                recordedChunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.onstop = () => {
                    if (recordedChunks.length > 0) {
                        const blob = new Blob(recordedChunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        window._recordingBlob = { url, blob, time: new Date().toISOString() };
                        addLog(`✅ Rekaman selesai (${(blob.size/1024/1024).toFixed(1)} MB)`, 'alert');
                    }
                    isRecording = false;
                    recTimeDisplay.textContent = 'IDLE';
                    recStatusDisplay.textContent = '■ Berhenti';
                    recStatusDisplay.className = 'value';
                };

                mediaRecorder.start(1000);
                isRecording = true;
                recTimeDisplay.textContent = '● REKAM';
                recStatusDisplay.textContent = '● Merekam';
                recStatusDisplay.className = 'value danger';
                addLog('🔴 Merekam...', 'alert');
            } catch (e) {
                addLog('❌ Gagal rekam: ' + e.message, 'danger');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try { mediaRecorder.stop(); } catch(e) {}
            }
            if (isRecording) {
                isRecording = false;
                recTimeDisplay.textContent = 'IDLE';
                recStatusDisplay.textContent = '■ Berhenti';
                recStatusDisplay.className = 'value';
            }
        }

        // --- START / STOP CCTV ---
        async function toggleCCTV() {
            if (isRunning) {
                // STOP
                isRunning = false;
                if (detectionTimerId) clearTimeout(detectionTimerId);
                if (animFrameId) cancelAnimationFrame(animFrameId);
                if (isRecording) stopRecording();
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                statusDot.className = 'dot inactive';
                statusLabel.textContent = 'STOP';
                humanCount.textContent = '0';
                confDisplay.textContent = '0%';
                fpsDisplay.textContent = '0';
                detectStatus.textContent = '⏹ Berhenti';
                detectStatus.className = 'value';
                btnStart.textContent = '▶ Mulai';
                addLog('⏹ Sistem dihentikan.');
                return;
            }

            // START
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                
                // Tunggu sampai video dapat dimensi
                await new Promise(resolve => {
                    if (video.videoWidth > 0) resolve();
                    else video.onloadedmetadata = resolve;
                });
                
                // Set canvas ke ukuran video
                resizeCanvasToVideo();
                
                isRunning = true;
                btnStart.textContent = '⏹ Berhenti';
                statusDot.className = 'dot warning';
                statusLabel.textContent = 'MEMUAT AI';
                addLog('📷 Kamera aktif. Memuat model AI...');

                if (!model) {
                    model = await cocoSsd.load({ base: 'mobilenet_v2' });
                    addLog('✅ Model AI siap (COCO-SSD).');
                } else {
                    addLog('✅ Model AI sudah siap.');
                }

                statusDot.className = 'dot';
                statusLabel.textContent = 'SIAGA';
                humanDetected = false;
                humanCounter = 0;
                smoothBoxes = [];

                // Mulai loop
                if (animFrameId) cancelAnimationFrame(animFrameId);
                if (detectionTimerId) clearTimeout(detectionTimerId);
                drawLoop(performance.now());
                runDetection();

            } catch (err) {
                let msg = err.message;
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    msg = 'Izin kamera ditolak. Berikan izin di pengaturan browser.';
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    msg = 'Tidak ada kamera yang terdeteksi.';
                }
                alert('Gagal akses kamera: ' + msg);
                addLog('❌ Error: ' + msg, 'danger');
                isRunning = false;
                btnStart.textContent = '▶ Mulai';
                statusLabel.textContent = 'ERROR';
                statusDot.className = 'dot inactive';
            }
        }

        // --- DOWNLOAD ---
        function downloadRecording() {
            if (window._recordingBlob && window._recordingBlob.blob.size > 0) {
                const a = document.createElement('a');
                a.href = window._recordingBlob.url;
                a.download = `rekaman_cctv_hd_${new Date().toISOString().replace(/[:.]/g, '-')}.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                addLog('⬇ Unduh rekaman HD dimulai.');
            } else {
                alert('Belum ada rekaman. Biarkan CCTV mendeteksi manusia terlebih dahulu.');
            }
        }

        // --- VOICES LOAD (untuk speech) ---
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices(); // preload
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        // --- EVENT LISTENERS ---
        btnStart.addEventListener('click', toggleCCTV);
        btnDownload.addEventListener('click', downloadRecording);

        // --- INIT ---
        addLog('🔧 CCTV HD siap. Tekan "Mulai".');
        statusDot.className = 'dot inactive';
        statusLabel.textContent = 'SIAGA';
        recTimeDisplay.textContent = 'IDLE';
        recStatusDisplay.textContent = '■ Berhenti';
        detectStatus.textContent = '✅ Aman';
        detectStatus.className = 'value success';

        // Bersihkan resource saat halaman ditutup
        window.addEventListener('beforeunload', function() {
            if (isRecording) stopRecording();
            if (stream) stream.getTracks().forEach(t => t.stop());
            if (detectionTimerId) clearTimeout(detectionTimerId);
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        });
    })();
</script>
</body>
    </html>
