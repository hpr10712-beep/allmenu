<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MyBro - Hyper Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0f172a; --panel: #1e293b; --accent: #10b981; --text: #f8fafc;
            --text-dim: #94a3b8; --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { padding: 18px 20px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        .my-id-tag { background: var(--panel); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; border: 1px solid var(--border); }

        /* VIEWS */
        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 90px; }
        .view { display: none; }
        .view.active { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        /* CONTACT & CHAT LIST CARDS */
        .card { background: var(--panel); border-radius: 18px; padding: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); transition: 0.2s; cursor: pointer; }
        .card:active { transform: scale(0.97); background: #334155; }
        .pfp { width: 52px; height: 52px; border-radius: 15px; object-fit: cover; background: #0f172a; flex-shrink: 0; }
        .card-info { flex: 1; min-width: 0; }
        .card-name { font-weight: 600; font-size: 1rem; margin-bottom: 3px; }
        .card-meta { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* MODALS (SLIDE UP) */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; z-index: 1000; align-items: flex-end; }
        .overlay.active { display: flex; }
        .sheet { background: var(--panel); width: 100%; border-radius: 25px 25px 0 0; padding: 25px; transform: translateY(100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-top: 2px solid var(--accent); }
        .overlay.active .sheet { transform: translateY(0); }

        input, textarea { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid var(--border); background: #0f172a; color: white; outline: none; }
        .btn-fill { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--accent); color: white; font-weight: 700; font-size: 1rem; cursor: pointer; }

        /* CHAT FULLSCREEN */
        #chatPanel { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; flex-direction: column; transform: translateY(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        #chatPanel.active { transform: translateY(0); }
        .chat-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; background: var(--panel); }
        #msgArea { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .bubble { padding: 10px 16px; border-radius: 18px; max-width: 80%; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .sent { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        /* NAVIGATION */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(15px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 500; }
        .nav-link { color: var(--text-dim); text-align: center; font-size: 0.7rem; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; cursor: pointer; }
        .nav-link.active { color: var(--accent); }
        .nav-link i { font-size: 1.4rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">MyBro<span style="color:white">.</span></div>
        <div class="my-id-tag" id="displayID">ID: ...</div>
    </header>

    <div class="content">
        <div id="v-chats" class="view active">
            <h4 style="margin: 0 0 15px;">Pesan Masuk</h4>
            <div id="chatList"></div>
        </div>

        <div id="v-contacts" class="view">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h4 style="margin:0">Kontak Saya</h4>
                <button onclick="toggleOverlay('popAdd', true)" style="background:none; border:1px solid var(--accent); color:var(--accent); padding:5px 12px; border-radius:10px; font-weight:600">+ Cari</button>
            </div>
            <div id="contactList"></div>
        </div>
    </div>

    <nav>
        <div class="nav-link active" onclick="showTab('v-chats', this)"><i class="fas fa-message"></i><span>Chat</span></div>
        <div class="nav-link" onclick="showTab('v-contacts', this)"><i class="fas fa-address-book"></i><span>Kontak</span></div>
        <div class="nav-link" onclick="toggleOverlay('popProfile', true)"><i class="fas fa-circle-user"></i><span>Profil</span></div>
    </nav>

    <div class="overlay" id="popAdd" onclick="closeOverlay(event)">
        <div class="sheet">
            <h3>Tambah Teman</h3>
            <input type="text" id="targetID" placeholder="Masukkan ID (BRO-xxxx)">
            <button class="btn-fill" onclick="window.app.addFriend()">Cari & Tambah</button>
        </div>
    </div>

    <div class="overlay" id="popProfile" onclick="closeOverlay(event)">
        <div class="sheet">
            <h3>Edit Profil</h3>
            <div style="text-align:center; margin-bottom:15px;">
                <img id="pfpEdit" src="https://ui-avatars.com/api/?name=User" class="pfp" style="width:80px; height:80px; border:2px solid var(--accent)">
                <input type="file" id="filePfp" accept="image/*" style="display:none" onchange="window.app.handlePfp(this)">
                <br><button onclick="document.getElementById('filePfp').click()" style="background:none; border:none; color:var(--accent); margin-top:5px;">Ganti Foto</button>
            </div>
            <input type="text" id="editName" placeholder="Nama Lengkap">
            <textarea id="editBio" placeholder="Bio singkat..."></textarea>
            <button class="btn-fill" onclick="window.app.updateProfile()">Simpan Perubahan</button>
        </div>
    </div>

    <div id="chatPanel">
        <div class="chat-header">
            <i class="fas fa-arrow-left" onclick="window.app.closeChat()" style="font-size:1.2rem; cursor:pointer;"></i>
            <img id="chatPfp" src="" class="pfp" style="width:40px; height:40px;">
            <div style="flex:1">
                <div id="chatName" style="font-weight:700;">...</div>
                <div style="font-size:0.7rem; color:var(--accent)">Online</div>
            </div>
        </div>
        <div id="msgArea"></div>
        <div style="padding:15px; display:flex; gap:10px; background:var(--panel);">
            <input type="text" id="msgIn" placeholder="Ketik pesan..." style="margin:0">
            <button onclick="window.app.send()" style="background:var(--accent); border:none; width:50px; height:50px; border-radius:12px; color:white;"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f"
        };
        const app_fire = initializeApp(firebaseConfig);
        const db = getDatabase(app_fire);

        // -- Global State --
        let myID = localStorage.getItem('mybro_id');
        if(!myID) {
            myID = "BRO-" + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem('mybro_id', myID);
            set(ref(db, `users/${myID}/profile`), { id: myID, name: "User " + myID, pfp: "", bio: "Hello!" });
        }
        document.getElementById('displayID').innerText = myID;

        let activeTarget = null;
        let pfpBase64 = "";

        // -- Helper UI --
        window.showTab = (id, el) => {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }
        window.toggleOverlay = (id, show) => {
            const el = document.getElementById(id);
            if(show) { el.classList.add('active'); el.style.display = 'flex'; }
            else { el.classList.remove('active'); setTimeout(() => el.style.display = 'none', 300); }
        }
        window.closeOverlay = (e) => { if(e.target.classList.contains('overlay')) toggleOverlay(e.target.id, false); }

        // -- Main Core Logic --
        window.app = {
            handlePfp: (input) => {
                const reader = new FileReader();
                reader.readAsDataURL(input.files[0]);
                reader.onload = () => {
                    const img = new Image();
                    img.src = reader.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 300; canvas.height = 300;
                        ctx.drawImage(img, 0, 0, 300, 300);
                        pfpBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('pfpEdit').src = pfpBase64;
                    }
                }
            },
            updateProfile: () => {
                const name = document.getElementById('editName').value;
                const bio = document.getElementById('editBio').value;
                const updates = { name, bio };
                if(pfpBase64) updates.pfp = pfpBase64;
                update(ref(db, `users/${myID}/profile`), updates);
                alert("Profil Disimpan!");
                toggleOverlay('popProfile', false);
            },
            addFriend: async () => {
                const tid = document.getElementById('targetID').value.trim();
                if(!tid || tid === myID) return;
                set(ref(db, `users/${myID}/contacts/${tid}`), { id: tid });
                alert("Berhasil!");
                toggleOverlay('popAdd', false);
            },
            openChat: (id, name, pfp) => {
                activeTarget = id;
                document.getElementById('chatName').innerText = name;
                document.getElementById('chatPfp').src = pfp;
                document.getElementById('chatPanel').classList.add('active');
                
                const room = [myID, id].sort().join("_");
                // REALTIME LISTENER PESAN
                onValue(ref(db, `chats/${room}`), (snap) => {
                    const area = document.getElementById('msgArea');
                    area.innerHTML = "";
                    snap.forEach(child => {
                        const m = child.val();
                        const div = document.createElement('div');
                        div.className = `bubble ${m.from === myID ? 'sent' : 'received'}`;
                        div.innerText = m.text;
                        area.appendChild(div);
                    });
                    area.scrollTop = area.scrollHeight;
                });
            },
            closeChat: () => {
                document.getElementById('chatPanel').classList.remove('active');
                activeTarget = null;
            },
            send: () => {
                const inp = document.getElementById('msgIn');
                if(!inp.value || !activeTarget) return;
                const room = [myID, activeTarget].sort().join("_");
                push(ref(db, `chats/${room}`), { from: myID, text: inp.value, time: Date.now() });
                inp.value = "";
            }
        };

        // -- Data Watchers (The Engine) --
        // 1. Sync Profil Header
        onValue(ref(db, `users/${myID}/profile`), (snap) => {
            const d = snap.val();
            if(!d) return;
            document.getElementById('editName').value = d.name;
            document.getElementById('editBio').value = d.bio;
            if(d.pfp) document.getElementById('pfpEdit').src = d.pfp;
        });

        // 2. Render Kontak & Chat List
        onValue(ref(db, `users/${myID}/contacts`), (snap) => {
            const cList = document.getElementById('contactList');
            const rList = document.getElementById('chatList');
            cList.innerHTML = ""; rList.innerHTML = "";

            snap.forEach(child => {
                const cid = child.key;
                onValue(ref(db, `users/${cid}/profile`), (pSnap) => {
                    const p = pSnap.val() || { name: cid, pfp: "" };
                    const pfp = p.pfp || `https://ui-avatars.com/api/?name=${p.name}`;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<img src="${pfp}" class="pfp"><div class="card-info"><div class="card-name">${p.name}</div><div class="card-meta">ID: ${cid}</div></div>`;
                    card.onclick = () => window.app.openChat(cid, p.name, pfp);
                    
                    cList.appendChild(card.cloneNode(true));
                    rList.appendChild(card);
                });
            });
        });

    </script>
</body>
</html>
