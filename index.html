<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>CAZOO — Platform Sekolah & Ujian Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F46E5'/%3E%3Ctext x='16' y='22' font-size='18' font-weight='700' fill='white' text-anchor='middle' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{
  --primary:#4F46E5; --primary-dark:#3730A3; --primary-soft:#EEF2FF;
  --secondary:#0EA5E9; --secondary-soft:#E0F2FE;
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9;
  --text:#0F172A; --text-2:#64748B; --text-3:#94A3B8;
  --success:#16A34A; --success-soft:#DCFCE7;
  --warning:#F59E0B; --warning-soft:#FEF3C7;
  --danger:#DC2626; --danger-soft:#FEE2E2;
  --border:#E2E8F0; --border-2:#CBD5E1;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 25px rgba(15,23,42,.08),0 4px 10px rgba(15,23,42,.04);
  --radius:12px; --radius-sm:8px; --radius-lg:18px;
  --sidebar-w:260px; --sidebar-w-sm:72px;
  --header-h:64px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
[data-theme="dark"]{
  --bg:#0B1120; --surface:#111827; --surface-2:#1E293B;
  --text:#F1F5F9; --text-2:#94A3B8; --text-3:#64748B;
  --border:#1E293B; --border-2:#334155;
  --primary-soft:#1E1B4B; --secondary-soft:#082F49;
  --success-soft:#052E16; --warning-soft:#451A03; --danger-soft:#450A0A;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 10px 25px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
[hidden]{display:none !important}

/* ============ ICONS ============ */
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:inline-block;vertical-align:middle}
.icon-sm{width:14px;height:14px}
.icon-lg{width:24px;height:24px}
.icon-xl{width:32px;height:32px}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;
  transition:.15s; white-space:nowrap; min-height:40px;
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){filter:brightness(.9)}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px;min-height:32px}
.btn-icon{padding:8px;min-width:36px;min-height:36px}
.btn-block{width:100%}

/* ============ INPUTS ============ */
.field{margin-bottom:14px}
.label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--text)}
.label .req{color:var(--danger)}
.input,.select,.textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--text);transition:.15s;min-height:40px;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.textarea{min-height:100px;resize:vertical;font-family:inherit}
.input-error{border-color:var(--danger)}
.error-msg{color:var(--danger);font-size:12px;margin-top:4px}
.hint{color:var(--text-2);font-size:12px;margin-top:4px}
.input-group{position:relative}
.input-group .input{padding-right:42px}
.input-group .toggle-pw{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px;color:var(--text-2);border-radius:6px}
.input-group .toggle-pw:hover{background:var(--surface-2);color:var(--text)}

/* ============ CARD ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:16px;font-weight:700}
.card-sub{font-size:12px;color:var(--text-2);margin-top:2px}

/* ============ BADGE ============ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.badge-primary{background:var(--primary-soft);color:var(--primary)}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:#92400E}
[data-theme="dark"] .badge-warning{color:var(--warning)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-gray{background:var(--surface-2);color:var(--text-2)}

/* ============ LOGO ============ */
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;flex-shrink:0}
.logo-text{background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ============ LANDING ============ */
.landing-nav{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
[data-theme="dark"] .landing-nav{background:rgba(17,24,39,.85)}
.landing-nav-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.landing-menu{display:flex;gap:28px;align-items:center}
.landing-menu a{color:var(--text-2);font-weight:500;font-size:14px}
.landing-menu a:hover{color:var(--text);text-decoration:none}
.hero{max-width:1200px;margin:0 auto;padding:80px 20px 60px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.hero h1{font-size:52px;line-height:1.1;letter-spacing:-.03em;font-weight:800;margin-bottom:20px}
.hero h1 .grad{background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:17px;color:var(--text-2);line-height:1.6;margin-bottom:32px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-visual{position:relative;aspect-ratio:1/1;max-width:480px;justify-self:end}
.hero-mock{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:20px;position:absolute;inset:20px}
.hero-mock-bar{height:8px;background:var(--border);border-radius:4px;margin-bottom:14px}
.hero-mock-bar.w60{width:60%}
.hero-mock-bar.w40{width:40%}
.hero-mock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.hero-mock-tile{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,var(--primary-soft),var(--secondary-soft));display:flex;align-items:center;justify-content:center}
.hero-mock-tile svg{color:var(--primary);width:24px;height:24px}
.section{max-width:1200px;margin:0 auto;padding:80px 20px}
.section-head{text-align:center;max-width:640px;margin:0 auto 50px}
.section-head h2{font-size:36px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.section-head p{color:var(--text-2);font-size:16px}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.feature-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;transition:.2s}
.feature-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.feature-icon{width:48px;height:48px;border-radius:12px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;color:var(--primary);margin-bottom:16px}
.feature-card h3{font-size:17px;font-weight:700;margin-bottom:8px}
.feature-card p{color:var(--text-2);font-size:14px;line-height:1.6}
.faq-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.faq-q{width:100%;text-align:left;padding:18px 20px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px}
.faq-a{padding:0 20px 18px;color:var(--text-2);line-height:1.6;font-size:14px}
.footer{background:var(--surface);border-top:1px solid var(--border);padding:40px 20px;margin-top:60px}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.footer-copy{color:var(--text-2);font-size:13px}

/* ============ AUTH ============ */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--primary-soft),var(--secondary-soft))}
.auth-card{width:100%;max-width:420px;background:var(--surface);border-radius:var(--radius-lg);padding:36px;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.auth-card .logo{justify-content:center;margin-bottom:24px}
.auth-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.auth-sub{text-align:center;color:var(--text-2);margin-bottom:24px;font-size:14px}
.auth-tabs{display:flex;background:var(--surface-2);border-radius:var(--radius-sm);padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:8px;border-radius:6px;font-weight:600;font-size:13px;color:var(--text-2);text-align:center}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.auth-foot{text-align:center;margin-top:18px;font-size:13px;color:var(--text-2)}

/* ============ APP LAYOUT ============ */
.app{display:flex;min-height:100vh;background:var(--bg)}
.sidebar{
  width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:60;
  transition:transform .25s, width .25s;
}
.sidebar.collapsed{width:var(--sidebar-w-sm)}
.sidebar-header{padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);min-height:var(--header-h)}
.sidebar-header .logo-text,.sidebar-header .school-name{display:block}
.sidebar.collapsed .sidebar-header .logo-text,.sidebar.collapsed .sidebar-header .school-name{display:none}
.school-name{font-size:11px;color:var(--text-2);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-section{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:12px 12px 6px}
.sidebar.collapsed .nav-section{display:none}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--text-2);font-weight:500;font-size:14px;cursor:pointer;transition:.15s;margin-bottom:2px;
  width:100%;text-align:left;white-space:nowrap;
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .nav-label{flex:1;overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .nav-item .nav-label{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px}
.nav-badge{background:var(--danger);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700;min-width:20px;text-align:center}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);cursor:pointer}
.user-chip:hover{background:var(--surface-2)}
.sidebar.collapsed .user-chip .u-info{display:none}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.avatar-sm{width:28px;height:28px;font-size:11px}
.avatar-lg{width:56px;height:56px;font-size:22px}
.u-info{flex:1;min-width:0}
.u-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-role{font-size:11px;color:var(--text-2);text-transform:capitalize}

.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0;transition:margin .25s}
.sidebar.collapsed ~ .main{margin-left:var(--sidebar-w-sm)}
.topbar{
  height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;position:sticky;top:0;z-index:40;
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.topbar-title{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);position:relative;transition:.15s;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.content{flex:1;padding:24px;max-width:100%;overflow-x:hidden}
.page-head{margin-bottom:24px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-desc{color:var(--text-2);font-size:14px;margin-top:4px}

/* ============ STATS ============ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stat-icon.p{background:var(--primary-soft);color:var(--primary)}
.stat-icon.s{background:var(--secondary-soft);color:var(--secondary)}
.stat-icon.g{background:var(--success-soft);color:var(--success)}
.stat-icon.w{background:var(--warning-soft);color:var(--warning)}
.stat-icon.d{background:var(--danger-soft);color:var(--danger)}
.stat-label{color:var(--text-2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat-value{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:4px}
.stat-meta{font-size:12px;color:var(--text-2)}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:12px 14px;font-weight:700;color:var(--text-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tbody tr:hover{background:var(--surface-2)}
.table tbody tr:last-child td{border-bottom:none}
.table-actions{display:flex;gap:4px;justify-content:flex-end}
.table-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.search-box{position:relative;flex:1;min-width:200px;max-width:320px}
.search-box .input{padding-left:36px}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);width:16px;height:16px}

/* ============ EMPTY / SKELETON ============ */
.empty{padding:60px 20px;text-align:center}
.empty-icon{width:64px;height:64px;border-radius:16px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--text-3);margin-bottom:16px}
.empty h3{font-size:16px;font-weight:700;margin-bottom:6px}
.empty p{color:var(--text-2);font-size:14px;margin-bottom:20px;max-width:400px;margin-left:auto;margin-right:auto}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 0%,var(--border) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:14px;margin-bottom:10px}
.sk-card{height:100px}

/* ============ MODAL ============ */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:fadein .15s;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:560px;
  max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .2s;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal.lg{max-width:800px}
.modal.xl{max-width:1000px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-title{font-size:17px;font-weight:700}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:380px;pointer-events:none}
.toast{
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);
  border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow-lg);display:flex;gap:10px;
  align-items:flex-start;animation:slidein .25s;pointer-events:auto;
}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast-title{font-weight:700;font-size:13px;margin-bottom:2px}
.toast-msg{font-size:13px;color:var(--text-2)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ============ TABS ============ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 16px;font-weight:600;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--text)}

/* ============ FORM GRID ============ */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.form-grid .field.full{grid-column:1/-1}

/* ============ EXAM ============ */
.exam-shell{min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.exam-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.exam-meta{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px}
.exam-meta-item{display:flex;align-items:center;gap:6px;color:var(--text-2)}
.exam-meta-item strong{color:var(--text);font-weight:600}
.timer{display:flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary);padding:8px 16px;border-radius:10px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--warning-soft);color:#92400E}
.timer.danger{background:var(--danger-soft);color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.exam-body{flex:1;display:grid;grid-template-columns:1fr 300px;gap:0;max-width:1400px;margin:0 auto;width:100%}
.exam-main{padding:24px;overflow-y:auto}
.exam-side{padding:24px;border-left:1px solid var(--border);background:var(--surface);position:sticky;top:73px;align-self:flex-start;max-height:calc(100vh - 73px);overflow-y:auto}
.q-number{display:inline-flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary);padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;margin-bottom:16px}
.q-text{font-size:18px;font-weight:600;line-height:1.55;margin-bottom:20px;white-space:pre-wrap}
.q-image{max-width:100%;border-radius:var(--radius);margin-bottom:16px;border:1px solid var(--border)}
.q-options{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.q-option{
  display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:.15s;
}
.q-option:hover{border-color:var(--primary);background:var(--primary-soft)}
.q-option.selected{border-color:var(--primary);background:var(--primary-soft)}
.q-option input{display:none}
.q-opt-key{
  width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
}
.q-option.selected .q-opt-key{background:var(--primary);color:#fff}
.q-opt-text{flex:1;padding-top:3px;line-height:1.5}
.exam-nav-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.q-panel-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);margin-bottom:12px}
.q-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.q-box{
  aspect-ratio:1;border-radius:8px;background:var(--surface-2);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
  border:2px solid transparent;transition:.15s;cursor:pointer;
}
.q-box:hover{border-color:var(--primary)}
.q-box.current{border-color:var(--primary);background:var(--primary);color:#fff}
.q-box.answered{background:var(--success-soft);color:var(--success);border-color:var(--success)}
.q-box.flagged::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--warning)}
.q-box{position:relative}
.q-legend{font-size:12px;color:var(--text-2);display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.q-legend-item{display:flex;align-items:center;gap:8px}
.q-legend-box{width:16px;height:16px;border-radius:4px;flex-shrink:0}

/* ============ CHART ============ */
.chart-wrap{position:relative;height:280px;padding:10px}

/* ============ MISC ============ */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.text-muted{color:var(--text-2)}
.text-sm{font-size:12px}
.text-center{text-align:center}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.spinner.dark{border-color:var(--border);border-top-color:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--border);margin:16px 0}
.help-text{font-size:12px;color:var(--text-2);background:var(--surface-2);padding:10px 14px;border-radius:8px;border-left:3px solid var(--primary)}
.mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;animation:fadein .2s}
.menu-toggle{display:none}

@media (max-width:1024px){
  .hero{grid-template-columns:1fr;gap:40px;padding:50px 20px}
  .hero-visual{max-width:380px;justify-self:center}
  .hero h1{font-size:40px}
  .exam-body{grid-template-columns:1fr}
  .exam-side{position:static;max-height:none;border-left:none;border-top:1px solid var(--border)}
}
@media (max-width:768px){
  .sidebar{transform:translateX(-100%);width:var(--sidebar-w)}
  .sidebar.open{transform:translateX(0)}
  .sidebar.collapsed{width:var(--sidebar-w)}
  .sidebar.collapsed .sidebar-header .logo-text,.sidebar.collapsed .sidebar-header .school-name,
  .sidebar.collapsed .nav-item .nav-label,.sidebar.collapsed .user-chip .u-info{display:block}
  .sidebar.collapsed .nav-item{justify-content:flex-start;padding:10px 12px}
  .sidebar.collapsed .nav-section{display:block}
  .main{margin-left:0 !important}
  .menu-toggle{display:flex}
  .landing-menu{display:none}
  .hero h1{font-size:32px}
  .hero p{font-size:15px}
  .section{padding:50px 20px}
  .section-head h2{font-size:26px}
  .content{padding:16px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .stat-value{font-size:22px}
  .modal{max-width:100%;border-radius:14px 14px 0 0;max-height:95vh;margin-top:auto}
  .modal-bg{padding:0;align-items:flex-end}
  .topbar{padding:0 12px}
  .page-title{font-size:20px}
  .q-text{font-size:16px}
  .q-grid{grid-template-columns:repeat(6,1fr)}
}
@media (max-width:400px){
  .stats-grid{grid-template-columns:1fr}
  .auth-card{padding:24px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {

    <span style="color:var(--${type === "info" ? "primary" : type})">${svg(icons[type], "icon")}</span>
    <div style="flex:1;min-width:0">
      <div class="toast-title">${esc(title)}</div>
      ${msg ? `<div class="toast-msg">${esc(msg)}</div>` : ""}
    </div>
    <button class="icon-btn" style="width:24px;height:24px" aria-label="Tutup">${svg("i-x","icon-sm")}</button>
  `;
  t.querySelector("button").onclick = () => t.remove();
  $("#toast-root").appendChild(t);
  if (duration) setTimeout(() => t.remove(), duration);
}

function openModal({ title, body, footer, size = "", onClose }) {
  const bg = el("div", { class: "modal-bg", role: "dialog", "aria-modal": "true" });
  const modal = el("div", { class: `modal ${size}` });
  const header = el("div", { class: "modal-header" });
  header.innerHTML = `<div class="modal-title">${esc(title || "")}</div>`;
  const closeBtn = el("button", { class: "icon-btn", "aria-label": "Tutup" });
  closeBtn.innerHTML = svg("i-x");
  closeBtn.onclick = () => close();
  header.appendChild(closeBtn);
  modal.appendChild(header);
  const bodyEl = el("div", { class: "modal-body" });
  if (typeof body === "string") bodyEl.innerHTML = body;
  else if (body instanceof Node) bodyEl.appendChild(body);
  modal.appendChild(bodyEl);
  if (footer) {
    const footEl = el("div", { class: "modal-footer" });
    if (typeof footer === "string") footEl.innerHTML = footer;
    else if (footer instanceof Node) footEl.appendChild(footer);
    else if (Array.isArray(footer)) footer.forEach(f => footEl.appendChild(f));
    modal.appendChild(footEl);
  }
  bg.appendChild(modal);
  document.getElementById("modal-root").appendChild(bg);
  const close = () => {
    bg.remove();
    document.removeEventListener("keydown", onKey);
    if (onClose) onClose();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
  setTimeout(() => { const f = modal.querySelector("input,select,textarea,button"); if (f) f.focus(); }, 50);
  return { close, body: bodyEl, modal };
}

function confirmDialog(title, message, confirmText = "Hapus", danger = true) {
  return new Promise(resolve => {
    const body = el("div", {}, [
      el("p", { class: "text-muted", text: message })
    ]);
    const cancelBtn = el("button", { class: "btn btn-secondary", text: "Batal", onclick: () => { m.close(); resolve(false); } });
    const confirmBtn = el("button", { class: `btn ${danger ? "btn-danger" : "btn-primary"}`, text: confirmText, onclick: () => { m.close(); resolve(true); } });
    const footer = el("div", { class: "row", style: "gap:10px" }, [cancelBtn, confirmBtn]);
    const m = openModal({ title, body, footer });
  });
}

function loadingButton(btn, on, text = "Menyimpan...") {
  if (on) {
    btn.dataset.orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> ${text}`;
  } else {
    btn.disabled = false;
    if (btn.dataset.orig) btn.innerHTML = btn.dataset.orig;
  }
}

async function loadUserProfile(uid) {
  // Try /users/{uid}
  let snap = await get(ref(db, `users/${uid}`));
  if (snap.exists()) return { ...snap.val(), uid };
  // Try /userProfiles/{uid}
  snap = await get(ref(db, `userProfiles/${uid}`));
  if (snap.exists()) return { ...snap.val(), uid };
  return null;
}

async function createUserProfile(uid, data) {
  await set(ref(db, `users/${uid}`), {
    ...data,
    uid,
    createdAt: nowTs(),
    updatedAt: nowTs()
  });
}

async function ensureSchoolMembership(uid, schoolId, role) {
  const memberRef = ref(db, `schoolMemberships/${schoolId}/${uid}`);
  const snap = await get(memberRef);
  if (!snap.exists()) {
    await set(memberRef, { uid, role, schoolId, joinedAt: nowTs() });
  }
}

async function registerUser({ email, password, name, role, className }) {
  const cred = await createUserWithEmailAndPassword(auth, email, password);
  await updateProfile(cred.user, { displayName: name });
  const isTeacher = role === "teacher";
  const profile = {
    email, name, role: isTeacher ? "teacher" : "student",
    status: isTeacher ? "pending" : "active",
    schoolId: APP_SETTINGS.defaultSchoolId,
    className: className || "",
    createdAt: nowTs()
  };
  await createUserProfile(cred.user.uid, profile);
  await ensureSchoolMembership(cred.user.uid, APP_SETTINGS.defaultSchoolId, profile.role);
  return cred.user;
}

function navigate(view, options = {}) {
  if (view === "app" && !STATE.user) view = "auth";
  if (view !== "exam" && STATE.examTimer) { clearInterval(STATE.examTimer); STATE.examTimer = null; }
  STATE.view = view;
  if (options.route) STATE.route = options.route;
  if (options.exam) STATE.exam = options.exam;
  window.scrollTo(0, 0);
  render();
  window.history.replaceState({}, "", view === "app" ? `#${STATE.route}` : `#${view}`);
}

  const root = $("#root");
  root.innerHTML = "";

}

    <div class="topbar-left">

    </div>
  `;
  const content = el("main", { class: "content" });
  content.id = "contentHost";
  main.appendChild(topbar);
  main.appendChild(content);
  wrap.appendChild(sidebar);
  wrap.appendChild(main);

  // events
  sidebar.querySelector("#logoutBtn").onclick = async () => {
    const ok = await confirmDialog("Keluar dari CAZOO?", "Anda akan keluar dari sesi ini.", "Keluar", false);
    if (ok) { await signOut(auth); }
  };
  sidebar.querySelector("#userChip").onclick = () => navigate("app", { route: "profile" });
  sidebar.querySelector("#closeSidebar").onclick = () => { STATE.sidebarOpen = false; sidebar.classList.remove("open"); wrap.querySelector(".mobile-overlay")?.remove(); };
  topbar.querySelector("#openSidebar").onclick = () => {
    STATE.sidebarOpen = true;
    sidebar.classList.add("open");
    const ov = el("div", { class: "mobile-overlay" });
    ov.onclick = () => { STATE.sidebarOpen = false; sidebar.classList.remove("open"); ov.remove(); };
    wrap.appendChild(ov);
  };
  topbar.querySelector("#themeBtnApp").onclick = (e) => {
    applyTheme(STATE.theme === "light" ? "dark" : "light");
    e.currentTarget.innerHTML = svg(STATE.theme === "light" ? "i-moon" : "i-sun");
  };
  topbar.querySelector("#notifBtn").onclick = () => openNotifications();

  // Content — deferred
  setTimeout(() => renderPage(content, STATE.route), 0);
  return wrap;
}

function initials(name) {
  return String(name || "U").split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
}

function roleLabel(role) {
  return {
    superadmin: "Super Admin", admin: "Administrator",
    principal: "Kepala Sekolah", teacher: "Guru", student: "Murid"
  }[role] || role || "-";
}

async function renderPage(host, route) {
  host.innerHTML = `<div class="skeleton sk-line" style="width:40%;height:24px"></div>

  try {

      <p>${esc(err.message || "Terjadi kesalahan.")}</p>
    ` }));
  }
}

/* =========================================================
   DATA HELPERS
   ========================================================= */
async function dbGet(path) {
  const snap = await get(ref(db, path));
  return snap.exists() ? snap.val() : null;
}
async function dbList(path) {
  const data = await dbGet(path);
  if (!data) return [];
  return Object.entries(data).map(([id, v]) => ({ id, ...v }));
}
async function dbSet(path, data) { await set(ref(db, path), { ...data, updatedAt: nowTs() }); }
async function dbPush(path, data) {
  const r = push(ref(db, path));
  await set(r, { ...data, createdAt: nowTs(), updatedAt: nowTs() });
  return r.key;
}
async function dbUpdate(path, data) { await update(ref(db, path), { ...data, updatedAt: nowTs() }); }
async function dbRemove(path) { await remove(ref(db, path)); }

function pageHead(title, desc, actions = []) {
  const head = el("div", { class: "page-head" });
  head.innerHTML = `
    <div class="row between" style="gap:16px;align-items:flex-start">
      <div>
        <h1 class="page-title">${esc(title)}</h1>
        <p class="page-desc">${esc(desc || "")}</p>
      </div>
    </div>
  `;
  if (actions.length) {
    const row = el("div", { class: "row", style: "gap:8px" });
    actions.forEach(a => row.appendChild(a));
    head.querySelector(".row.between").appendChild(row);
  }
  return head;
}

function emptyState(icon, title, desc, actionBtn) {
  const e = el("div", { class: "empty" });
  e.innerHTML = `<div class="empty-icon">${svg(icon, "icon-xl")}</div>
    <h3>${esc(title)}</h3><p>${esc(desc)}</p>`;
  if (actionBtn) e.appendChild(actionBtn);
  return e;
}

function statCard(icon, color, label, value, meta) {
  const c = el("div", { class: "stat-card" });
  c.innerHTML = `
    <div class="stat-head">
      <div class="stat-icon ${color}">${svg(icon, "icon")}</div>
    </div>
    <div class="stat-label">${esc(label)}</div>
    <div class="stat-value">${esc(String(value))}</div>
    <div class="stat-meta">${esc(meta || "")}</div>
  `;
  return c;
}

function statusBadge(status) {
  const map = {
    active: ["Aktif", "badge-success"],
    inactive: ["Nonaktif", "badge-gray"],
    pending: ["Menunggu", "badge-warning"],
    approved: ["Disetujui", "badge-success"],
    draft: ["Draft", "badge-gray"],
    scheduled: ["Terjadwal", "badge-primary"],
    ongoing: ["Berlangsung", "badge-warning"],
    completed: ["Selesai", "badge-success"],
    graded: ["Dinilai", "badge-success"],
    published: ["Terbit", "badge-success"]
  };
  const [label, cls] = map[status] || [status, "badge-gray"];
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

async function renderDashboard() {
  const host = el("div");
  const role = STATE.role;

  let stats = [];
  let upcomingExams = [];
  let recentActivity = [];

  try {
    if (role === "superadmin" || role === "admin") {
      const [users, classes, subjects, exams] = await Promise.all([
        dbList("users").catch(() => []),
        dbList("classes").catch(() => []),
        dbList("subjects").catch(() => []),
        dbList("exams").catch(() => [])
      ]);
      const teachers = users.filter(u => u.role === "teacher");
      const students = users.filter(u => u.role === "student");
      const activeExams = exams.filter(e => e.status === "ongoing" || e.status === "active");
      stats = [
        statCard("i-users", "p", "Total Pengguna", users.length, `${teachers.length} guru · ${students.length} murid`),
        statCard("i-graduation", "s", "Kelas", classes.length, "Kelas terdaftar"),
        statCard("i-book", "g", "Mata Pelajaran", subjects.length, "Mapel aktif"),
        statCard("i-clipboard", "w", "Ujian Aktif", activeExams.length, `${exams.length} total ujian`)
      ];
      upcomingExams = exams.filter(e => e.status === "scheduled")
        .sort((a, b) => (a.startAt || 0) - (b.startAt || 0)).slice(0, 5);
    } else if (role === "teacher") {
      const [exams, questions, submissions, classes] = await Promise.all([
        dbList("exams").catch(() => []),
        dbList("questionBanks").catch(() => []),
        dbList("assignmentSubmissions").catch(() => []),
        dbList("classes").catch(() => [])
      ]);
      const myExams = exams.filter(e => e.teacherId === STATE.user.uid);
      const myQ = questions.filter(q => q.owner === STATE.user.uid);
      stats = [
        statCard("i-clipboard", "p", "Ujian Saya", myExams.length, `${myExams.filter(e => e.status === "ongoing").length} berlangsung`),
        statCard("i-layers", "s", "Bank Soal", myQ.length, "Soal tersimpan"),
        statCard("i-file", "g", "Pengumpulan", submissions.length, "Tugas murid"),
        statCard("i-graduation", "w", "Kelas", classes.length, "Kelas aktif")

      upcomingExams = myExams.filter(e => e.status === "scheduled" || e.status === "ongoing")
        .sort((a, b) => (a.startAt || 0) - (b.startAt || 0)).slice(0, 5);
    } else if (role === "student") {
      const [exams, results, assignments, materials] = await Promise.all([
        dbList("exams").catch(() => []),
        dbList("examResults").catch(() => []),
        dbList("assignments").catch(() => []),
        dbList("materials").catch(() => [])
      ]);
      const myResults = results.filter(r => r.uid === STATE.user.uid);
      stats = [
        statCard("i-clipboard", "p", "Ujian Tersedia", exams.filter(e => e.status === "ongoing").length, "Siap dikerjakan"),
        statCard("i-award", "g", "Nilai Rata-rata", myResults.length ? Math.round(myResults.reduce((a, b) => a + (b.score || 0), 0) / myResults.length) : 0, `${myResults.length} ujian selesai`),
        statCard("i-file", "s", "Tugas", assignments.length, "Tugas aktif"),
        statCard("i-book", "w", "Materi", materials.length, "Materi tersedia")
      ];
      upcomingExams = exams.filter(e => e.status === "ongoing" || e.status === "scheduled")
        .sort((a, b) => (a.startAt || 0) - (b.startAt || 0)).slice(0, 5);
    } else if (role === "principal") {
      const [users, classes, exams, results] = await Promise.all([
        dbList("users").catch(() => []),
        dbList("classes").catch(() => []),
        dbList("exams").catch(() => []),
        dbList("examResults").catch(() => [])
      ]);
      const avg = results.length ? Math.round(results.reduce((a, b) => a + (b.score || 0), 0) / results.length) : 0;

async function renderUsers() {
  const host = el("div");
  const newBtn = el("button", { class: "btn btn-primary" });
  newBtn.innerHTML = `${svg("i-plus")} Tambah Pengguna`;
  newBtn.onclick = () => openUserForm();
  host.appendChild(pageHead("Manajemen Pengguna", "Kelola akun guru, murid, dan staf sekolah.", [newBtn]));

  const card = el("div", { class: "card" });
  const toolbar = el("div", { class: "table-toolbar" });
  toolbar.innerHTML = `
    <div class="search-box">
      ${svg("i-search")}
      <input class="input" id="userSearch" placeholder="Cari nama atau email...">
    </div>
    <select class="select" id="userRoleFilter" style="max-width:180px">
      <option value="">Semua Role</option>
      <option value="student">Murid</option>
      <option value="teacher">Guru</option>
      <option value="admin">Admin</option>
      <option value="principal">Kepala Sekolah</option>
    </select>
    <select class="select" id="userStatusFilter" style="max-width:180px">
      <option value="">Semua Status</option>
      <option value="active">Aktif</option>
      <option value="pending">Menunggu</option>
      <option value="inactive">Nonaktif</option>
    </select>
  `;
  card.appendChild(toolbar);
  const listHost = el("div");
  card.appendChild(listHost);
  host.appendChild(card);

  let allUsers = [];
  try { allUsers = await dbList("users"); } catch (e) { console.error(e); }

  function apply() {
    const q = (toolbar.querySelector("#userSearch").value || "").toLowerCase().trim();
    const rFilter = toolbar.querySelector("#userRoleFilter").value;
    const sFilter = toolbar.querySelector("#userStatusFilter").value;
    let rows = allUsers.slice();
    if (q) rows = rows.filter(u => (u.name || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q));
    if (rFilter) rows = rows.filter(u => u.role === rFilter);
    if (sFilter) rows = rows.filter(u => (u.status || "active") === sFilter);
    draw(rows);
  }

  function draw(rows) {
    listHost.innerHTML = "";
    if (!rows.length) {
      listHost.appendChild(emptyState("i-users", "Belum ada pengguna", "Tambahkan pengguna pertama untuk memulai.", newBtn.cloneNode(true)));
      listHost.querySelector(".empty button")?.addEventListener("click", () => openUserForm());
      return;
    }
    const wrap = el("div", { class: "table-wrap" });
    wrap.innerHTML = `
      <table class="table">
        <thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Kelas</th><th></th></tr></thead>
        <tbody>
          ${rows.map(u => `
            <tr>
              <td>
                <div class="row" style="gap:10px">
                  <div class="avatar avatar-sm">${esc(initials(u.name))}</div>
                  <div>
                    <div style="font-weight:600">${esc(u.name || "-")}</div>
                    <div class="text-sm text-muted">${esc(u.uid || u.id || "")}</div>
                  </div>
                </div>
              </td>
              <td>${esc(u.email || "-")}</td>
              <td>${esc(roleLabel(u.role))}</td>
              <td>${statusBadge(u.status || "active")}</td>
              <td>${esc(u.className || "-")}</td>
              <td class="table-actions">
                ${u.status === "pending" ? `<button class="btn btn-success btn-sm" data-approve="${esc(u.id)}">Setujui</button>` : ""}
                <button class="btn btn-secondary btn-sm" data-edit="${esc(u.id)}">${svg("i-edit","icon-sm")}</button>
                <button class="btn btn-danger btn-sm" data-del="${esc(u.id)}">${svg("i-trash","icon-sm")}</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    wrap.querySelectorAll("[data-edit]").forEach(b => {
      b.onclick = () => openUserForm(rows.find(u => u.id === b.dataset.edit));
    });
    wrap.querySelectorAll("[data-del]").forEach(b => {
      b.onclick = async () => {
        const u = rows.find(x => x.id === b.dataset.del);
        if (!await confirmDialog("Hapus pengguna?", `Akun ${u.name || u.email} akan dihapus dari database. Akun Firebase Auth harus dihapus terpisah melalui Admin SDK.`)) return;
        try {
          await dbRemove(`users/${b.dataset.del}`);
          await dbRemove(`schoolMemberships/${APP_SETTINGS.defaultSchoolId}/${b.dataset.del}`).catch(() => {});
          logAudit("user.delete", { targetUid: b.dataset.del });
          toast("Pengguna dihapus", "", "success");
          apply();
          allUsers = allUsers.filter(x => x.id !== b.dataset.del);
        } catch (err) {
          toast("Gagal menghapus", err.message, "error");
        }
      };
    });
    wrap.querySelectorAll("[data-approve]").forEach(b => {
      b.onclick = async () => {
        try {
          await dbUpdate(`users/${b.dataset.approve}`, { status: "active" });
          await logAudit("user.approve", { targetUid: b.dataset.approve });
          toast("Akun disetujui", "", "success");
          allUsers = await dbList("users");
          apply();
        } catch (err) { toast("Gagal menyetujui", err.message, "error"); }
      };
    });
    listHost.appendChild(wrap);
  }

  toolbar.querySelector("#userSearch").oninput = apply;
  toolbar.querySelector("#userRoleFilter").onchange = apply;
  toolbar.querySelector("#userStatusFilter").onchange = apply;
  apply();
  return host;
}

function openUserForm(existing = null) {
  const isEdit = !!existing;
  const body = el("div");
  body.innerHTML = `
    <div class="form-grid">
      <div class="field"><label class="label">Nama Lengkap <span class="req">*</span></label><input class="input" id="uName" value="${esc(existing?.name || "")}"></div>
      <div class="field"><label class="label">Email <span class="req">*</span></label><input class="input" id="uEmail" type="email" value="${esc(existing?.email || "")}" ${isEdit ? "disabled" : ""}></div>
      <div class="field"><label class="label">Role</label>
        <select class="select" id="uRole" ${STATE.role === "superadmin" ? "" : "disabled"}>

        </select>
      </div>
      <div class="field"><label class="label">Status</label>
        <select class="select" id="uStatus">
          <option value="active" ${existing?.status === "active" || !existing ? "selected" : ""}>Aktif</option>
          <option value="pending" ${existing?.status === "pending" ? "selected" : ""}>Menunggu</option>
          <option value="inactive" ${existing?.status === "inactive" ? "selected" : ""}>Nonaktif</option>
        </select>
      </div>
      <div class="field full"><label class="label">Kelas</label><input class="input" id="uClass" value="${esc(existing?.className || "")}" placeholder="Contoh: X IPA 1"></div>
    </div>
    ${!isEdit ? `<div class="help-text">Untuk menambahkan akun dengan autentikasi, buat akun melalui halaman Daftar terlebih dahulu atau gunakan Firebase Admin SDK untuk pembuatan massal.</div>` : ""}
  `;
  const btn = el("button", { class: "btn btn-primary", text: isEdit ? "Simpan Perubahan" : "Simpan" });
  const m = openModal({ title: isEdit ? "Edit Pengguna" : "Tambah Pengguna", body, footer: btn, size: "lg" });
  btn.onclick = async () => {
    const name = body.querySelector("#uName").value.trim();
    const email = body.querySelector("#uEmail").value.trim();
    const role = body.querySelector("#uRole").value;
    const status = body.querySelector("#uStatus").value;
    const className = body.querySelector("#uClass").value.trim();
    if (!name || !email) { toast("Formulir belum lengkap", "", "warning"); return; }
    loadingButton(btn, true);
    try {
      if (isEdit) {
        await dbUpdate(`users/${existing.id}`, { name, role, status, className });
        logAudit("user.update", { targetUid: existing.id });
        toast("Perubahan disimpan", "", "success");
      } else {
        toast("Tidak diimplementasikan", "Pembuatan akun auth memerlukan Firebase Admin SDK.", "warning");
        loadingButton(btn, false);
        return;
      }
      m.close();
      render();
    } catch (err) {
      loadingButton(btn, false);
      toast("Gagal menyimpan", err.message, "error");
    }
  };
}

function openQuestionForm(existing = null) {
  const body = el("div");
  body.innerHTML = `
    <div class="form-grid">
      <div class="field"><label class="label">Tipe Soal <span class="req">*</span></label>
        <select class="select" id="qType">
          ${Object.entries(Q_TYPES).map(([k, v]) => `<option value="${k}" ${existing?.type === k ? "selected" : ""}>${v}</option>`).join("")}
        </select>
      </div>
      <div class="field"><label class="label">Bobot</label><input class="input" id="qWeight" type="number" min="1" value="${existing?.weight || 1}"></div>
      <div class="field"><label class="label">Mata Pelajaran</label><input class="input" id="qSubject" value="${esc(existing?.subjectName || "")}" placeholder="Matematika"></div>
      <div class="field"><label class="label">Kesulitan</label>
        <select class="select" id="qDiff">
          <option value="mudah" ${existing?.difficulty === "mudah" ? "selected" : ""}>Mudah</option>
          <option value="sedang" ${existing?.difficulty === "sedang" || !existing ? "selected" : ""}>Sedang</option>
          <option value="sulit" ${existing?.difficulty === "sulit" ? "selected" : ""}>Sulit</option>
        </select>
      </div>
      <div class="field full"><label class="label">Pertanyaan <span class="req">*</span></label><textarea class="textarea" id="qText">${esc(existing?.text || "")}</textarea></div>
    </div>
    <div id="qOptionsHost"></div>
    <div class="field mt-2"><label class="label">Pembahasan (opsional)</label><textarea class="textarea" id="qExpl" style="min-height:60px">${esc(existing?.explanation || "")}</textarea></div>
  `;
  const optHost = body.querySelector("#qOptionsHost");
  const typeSel = body.querySelector("#qType");

  function renderOptions() {
    const type = typeSel.value;
    optHost.innerHTML = "";
    if (type === "single" || type === "multi") {
      const opts = existing?.options || [{ key: "A", text: "" }, { key: "B", text: "" }, { key: "C", text: "" }, { key: "D", text: "" }];
      const wrap = el("div");
      wrap.innerHTML = `<label class="label">Pilihan Jawaban</label><div id="optList"></div>
        <button type="button" class="btn btn-secondary btn-sm mt-1" id="addOpt">${svg("i-plus","icon-sm")} Tambah Pilihan</button>
        <div class="field mt-2"><label class="label">Kunci Jawaban ${type === "multi" ? "(pisah dengan koma)" : ""}</label>
          <input class="input" id="qKey" value="${esc((existing?.correctKeys || existing?.correctKey || []).join ? (existing?.correctKeys || []).join(",") : (existing?.correctKey || ""))}"></div>`;
      optHost.appendChild(wrap);
      const list = wrap.querySelector("#optList");
      const drawOpts = () => {
        list.innerHTML = opts.map((o, i) => `
          <div class="row" style="gap:8px;margin-bottom:6px">
            <input class="input" style="max-width:60px" value="${esc(o.key)}" data-ok="${i}">
            <input class="input" value="${esc(o.text)}" data-ot="${i}" placeholder="Isi pilihan">
            ${opts.length > 2 ? `<button type="button" class="btn btn-danger btn-sm" data-del="${i}">${svg("i-trash","icon-sm")}</button>` : ""}
          </div>`).join("");
        list.querySelectorAll("[data-ot]").forEach(inp => inp.oninput = () => opts[+inp.dataset.ot].text = inp.value);
        list.querySelectorAll("[data-ok]").forEach(inp => inp.oninput = () => opts[+inp.dataset.ok].key = inp.value);
        list.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { opts.splice(+b.dataset.del, 1); drawOpts(); });
      };
      drawOpts();
      wrap.querySelector("#addOpt").onclick = () => {
        const nextKey = String.fromCharCode(65 + opts.length);
        opts.push({ key: nextKey, text: "" });
        drawOpts();
      };
      wrap._getOptions = () => opts;
    } else if (type === "truefalse") {
      optHost.innerHTML = `
        <div class="field"><label class="label">Kunci Jawaban</label>
          <select class="select" id="qKey">
            <option value="true" ${existing?.correctKey === "true" ? "selected" : ""}>Benar</option>
            <option value="false" ${existing?.correctKey === "false" ? "selected" : ""}>Salah</option>
          </select>
        </div>`;
    } else if (type === "short" || type === "numeric") {
      optHost.innerHTML = `<div class="field"><label class="label">Kunci Jawaban <span class="req">*</span></label><input class="input" id="qKey" value="${esc(existing?.correctKey || "")}"></div>`;
    } else if (type === "essay") {
      optHost.innerHTML = `<div class="help-text">Soal esai dinilai manual oleh guru. Kunci jawaban tidak wajib.</div>`;
    }
  }
  typeSel.onchange = renderOptions;
  renderOptions();

  const btn = el("button", { class: "btn btn-primary", text: existing ? "Simpan" : "Buat Soal" });
  const m = openModal({ title: existing ? "Edit Soal" : "Buat Soal", body, footer: btn, size: "lg" });
  btn.onclick = async () => {
    const text = body.querySelector("#qText").value.trim();
    if (!text) { toast("Pertanyaan wajib diisi", "", "warning"); return; }
    const type = typeSel.value;
    const data = {
      text,
      type,
      weight: parseInt(body.querySelector("#qWeight").value) || 1,
      subjectName: body.querySelector("#qSubject").value.trim(),
      difficulty: body.querySelector("#qDiff").value,
      explanation: body.querySelector("#qExpl").value.trim(),
      owner: STATE.user.uid,
      ownerName: STATE.profile?.name || ""
    };
    const keyEl = optHost.querySelector("#qKey");
    if (keyEl) {
      if (type === "multi") data.correctKeys = keyEl.value.split(",").map(s => s.trim()).filter(Boolean);
      else data.correctKey = keyEl.value.trim();
    }
    if (type === "single" || type === "multi") {
      data.options = optHost._getOptions ? optHost._getOptions() : [];
    }
    loadingButton(btn, true);
    try {
      if (existing) await dbUpdate(`questionBanks/${existing.id}`, data);
      else await dbPush("questionBanks", data);
      toast("Soal disimpan", "", "success");
      m.close(); render();
    } catch (err) { loadingButton(btn, false); toast("Gagal", err.message, "error"); }
  };
}

        teacherName: STATE.profile?.name || "",
        questionCount: questions.length,
        totalWeight,
        status,
        schoolId: APP_SETTINGS.defaultSchoolId
      };
      const examId = await dbPush("exams", examData);
      await Promise.all(questions.map((q, i) => dbPush(`examQuestions/${examId}`, {
        order: i + 1,
        questionId: q.id,
        text: q.text,
        type: q.type,
        options: q.options || null,
        weight: q.weight || 1,
        correctKey: q.correctKey || null,
        correctKeys: q.correctKeys || null,
        explanation: q.explanation || ""

      logAudit("exam.create", { examId, title });
      toast("Ujian dibuat", status === "draft" ? "Tersimpan sebagai draft." : "Ujian diterbitkan.", "success");
      navigate("app", { route: "exams" });
    } catch (err) {
      loadingButton(btn, false);
      toast("Gagal menyimpan", err.message, "error");
    }
  }
  card.querySelector("#saveDraft").onclick = () => save("draft");
  card.querySelector("#publish").onclick = () => save("ongoing");
  host.appendChild(card);
  return host;
}

/* =========================================================
   EXAM TAKING
   ========================================================= */
async function startExam(examId) {
  try {
    const exam = await dbGet(`exams/${examId}`);
    if (!exam) { toast("Ujian tidak ditemukan", "", "error"); return; }
    if (exam.status !== "ongoing") { toast("Ujian belum aktif", "", "warning"); return; }

    // Check existing attempt
    const attemptPath = `examAttempts/${examId}/${STATE.user.uid}`;
    let attempt = await dbGet(attemptPath);
    let attemptId;
    if (attempt && attempt.submitted) {
      toast("Ujian sudah dikerjakan", "Anda sudah menyelesaikan ujian ini.", "warning");
      return;
    }
    if (!attempt) {
      const startedAt = nowTs();
      const endsAt = startedAt + (exam.duration || 60) * 60000;
      attemptId = "attempt_1";
      attempt = { startedAt, endsAt, submitted: false, attemptId };
      await set(ref(db, `${attemptPath}/${attemptId}`), attempt);
    } else {
      attemptId = attempt.attemptId || Object.keys(attempt)[0];
      if (!attemptId) { attemptId = "attempt_1"; }
      const a = await dbGet(`${attemptPath}/${attemptId}`);
      attempt = a || { startedAt: nowTs(), endsAt: nowTs() + (exam.duration || 60) * 60000, submitted: false, attemptId };
    }

    // Load questions
    const questionMap = await dbGet(`examQuestions/${examId}`) || {};
    const questions = Object.entries(questionMap).map(([id, q]) => ({ id, ...q })).sort((a, b) => (a.order || 0) - (b.order || 0));
    if (!questions.length) { toast("Ujian belum memiliki soal", "", "warning"); return; }

    // Load saved answers
    const savedAnswers = await dbGet(`examAnswers/${examId}/${STATE.user.uid}/${attemptId}`) || {};

    STATE.exam = {
      exam,
      examId,
      attemptId,
      attempt,
      questions,
      answers: { ...savedAnswers },
      current: 0,
      flagged: new Set(),
      saveState: "idle"
    };

    // Setup timer
    const remaining = (attempt.endsAt || 0) - nowTs();
    if (remaining <= 0) { toast("Waktu ujian telah habis", "", "warning"); submitExam(true); return; }

    navigate("exam");
  } catch (err) {
    console.error(err);
    toast("Gagal memulai ujian", err.message, "error");
  }
}

function renderExam() {
  const ex = STATE.exam;
  if (!ex) { navigate("app"); return el("div"); }

  const wrap = el("div", { class: "exam-shell" });
  const header = el("header", { class: "exam-header" });
  const meta = el("div", { class: "exam-meta" });
  meta.innerHTML = `
    <div class="exam-meta-item">${svg("i-clipboard","icon-sm")}<strong>${esc(ex.exam.title)}</strong></div>
    <div class="exam-meta-item">${svg("i-book","icon-sm")}${esc(ex.exam.subjectName || "-")}</div>
    <div class="exam-meta-item">${svg("i-user","icon-sm")}${esc(STATE.profile?.name || "")}</div>
  `;
  const timer = el("div", { class: "timer", id: "examTimer" });
  timer.innerHTML = `${svg("i-clock")} <span id="timerText">--:--</span>`;
  const saveStatus = el("div", { class: "exam-meta-item", id: "saveStatus" });
  saveStatus.innerHTML = `${svg("i-save","icon-sm")}<span>Belum disimpan</span>`;

  const rightRow = el("div", { class: "row", style: "gap:14px;align-items:center" }, [saveStatus, timer]);
  header.appendChild(meta);
  header.appendChild(rightRow);
  wrap.appendChild(header);

  const body = el("div", { class: "exam-body" });
  const main = el("div", { class: "exam-main", id: "examMain" });
  const side = el("div", { class: "exam-side" });
  body.appendChild(main);
  body.appendChild(side);
  wrap.appendChild(body);

  // Render question
  function drawQuestion() {
    const q = ex.questions[ex.current];
    if (!q) return;
    const answered = ex.answers[q.id] != null && ex.answers[q.id] !== "";
    const flagged = ex.flagged.has(q.id);
    main.innerHTML = `
      <div class="q-number">${svg("i-target","icon-sm")} Soal ${ex.current + 1} dari ${ex.questions.length}</div>
      <div class="row" style="gap:8px;margin-bottom:14px">
        <span class="badge badge-primary">${esc(Q_TYPES[q.type] || q.type)}</span>
        <span class="badge badge-gray">Bobot: ${q.weight || 1}</span>
        ${answered ? '<span class="badge badge-success">Terjawab</span>' : '<span class="badge badge-warning">Belum dijawab</span>'}
      </div>
      <div class="q-text">${esc(q.text)}</div>
      <div class="q-options" id="qOptions"></div>
      <div class="exam-nav-actions">
        <div class="row" style="gap:8px">
          <button class="btn btn-secondary" id="prevBtn" ${ex.current === 0 ? "disabled" : ""}>${svg("i-chevron-left","icon-sm")} Sebelumnya</button>
          <button class="btn ${flagged ? "btn-warning" : "btn-secondary"}" id="flagBtn">${svg("i-flag","icon-sm")} ${flagged ? "Hapus Tanda" : "Tandai"}</button>
        </div>
        <div class="row" style="gap:8px">
          ${ex.current < ex.questions.length - 1
            ? '<button class="btn btn-primary" id="nextBtn">Berikutnya ${svg("i-chevron-right","icon-sm")}</button>'
            : '<button class="btn btn-primary" id="reviewBtn">Tinjau & Kumpulkan</button>'}
        </div>
      </div>
    `;
    const optHost = main.querySelector("#qOptions");
    drawQuestionInput(optHost, q);
    main.querySelector("#prevBtn").onclick = () => { ex.current--; drawQuestion(); };
    const nextBtn = main.querySelector("#nextBtn");
    if (nextBtn) nextBtn.onclick = () => { ex.current++; drawQuestion(); };
    main.querySelector("#flagBtn").onclick = () => {
      if (ex.flagged.has(q.id)) ex.flagged.delete(q.id);
      else ex.flagged.add(q.id);
      drawQuestion();
      drawSide();
    };
    const rev = main.querySelector("#reviewBtn");
    if (rev) rev.onclick = openSubmitDialog;
  }

  function drawQuestionInput(host, q) {
    const cur = ex.answers[q.id];
    if (q.type === "single" || q.type === "multi") {
      const opts = q.options || [];
      opts.forEach((opt) => {
        const selected = q.type === "multi"
          ? (Array.isArray(cur) && cur.includes(opt.key))
          : cur === opt.key;
        const o = el("label", { class: `q-option ${selected ? "selected" : ""}` });
        o.innerHTML = `
          <input type="${q.type === "multi" ? "checkbox" : "radio"}" name="q_${q.id}" ${selected ? "checked" : ""}>
          <span class="q-opt-key">${esc(opt.key)}</span>
          <span class="q-opt-text">${esc(opt.text || "")}</span>
        `;
        const inp = o.querySelector("input");
        inp.onchange = () => {
          if (q.type === "multi") {
            const arr = Array.isArray(ex.answers[q.id]) ? ex.answers[q.id].slice() : [];
            if (inp.checked) arr.push(opt.key);
            else { const i = arr.indexOf(opt.key); if (i > -1) arr.splice(i, 1); }
            ex.answers[q.id] = arr;
          } else {
            ex.answers[q.id] = opt.key;
          }
          drawQuestion();
          drawSide();
          saveAnswer(q.id);
        };
        host.appendChild(o);
      });
    } else if (q.type === "truefalse") {
      ["true", "false"].forEach(v => {
        const selected = cur === v;
        const o = el("label", { class: `q-option ${selected ? "selected" : ""}` });
        o.innerHTML = `
          <input type="radio" name="q_${q.id}" ${selected ? "checked" : ""}>
          <span class="q-opt-key">${v === "true" ? "B" : "S"}</span>
          <span class="q-opt-text">${v === "true" ? "Benar" : "Salah"}</span>
        `;
        o.querySelector("input").onchange = () => {
          ex.answers[q.id] = v; drawQuestion(); drawSide(); saveAnswer(q.id);
        };
        host.appendChild(o);
      });
    } else if (q.type === "short" || q.type === "numeric") {
      const inp = el("input", { class: "input", style: "max-width:340px", placeholder: "Tulis jawaban Anda..." });
      inp.value = cur || "";
      inp.oninput = () => {
        ex.answers[q.id] = inp.value;
        saveAnswer(q.id);
        clearTimeout(inp._t);
        inp._t = setTimeout(() => drawSide(), 400);
      };
      host.appendChild(inp);
    } else if (q.type === "essay") {
      const ta = el("textarea", { class: "textarea", placeholder: "Tulis jawaban esai Anda...", style: "min-height:200px" });
      ta.value = cur || "";
      ta.oninput = () => {
        ex.answers[q.id] = ta.value;
        saveAnswer(q.id);
        clearTimeout(ta._t);
        ta._t = setTimeout(() => drawSide(), 400);
      };
      host.appendChild(ta);
      const info = el("div", { class: "help-text mt-1", text: "Jawaban esai akan dinilai oleh guru." });
      host.appendChild(info);
    }
  }

  function drawSide() {
    const answeredCount = ex.questions.filter(q => {
      const a = ex.answers[q.id];
      if (a == null || a === "") return false;
      if (Array.isArray(a)) return a.length > 0;
      return true;
    }).length;
    side.innerHTML = `
      <div class="q-panel-title">Navigasi Soal</div>
      <div class="q-legend">
        <div class="q-legend-item"><span class="q-legend-box" style="background:var(--primary)"></span> Soal saat ini</div>
        <div class="q-legend-item"><span class="q-legend-box" style="background:var(--success-soft);border:1px solid var(--success)"></span> Sudah dijawab</div>
        <div class="q-legend-item"><span class="q-legend-box" style="background:var(--surface-2);border:1px solid var(--border)"></span> Belum dijawab</div>
        <div class="q-legend-item"><span class="q-legend-box" style="background:var(--warning)"></span> Ditandai</div>
      </div>
      <div class="q-grid" id="qGrid"></div>
      <div class="divider"></div>
      <div style="font-size:13px;color:var(--text-2)">
        Terjawab: <strong style="color:var(--success)">${answeredCount}</strong> / ${ex.questions.length}
      </div>
      <div style="height:6px;background:var(--surface-2);border-radius:3px;margin-top:10px;overflow:hidden">
        <div style="height:100%;width:${(answeredCount / ex.questions.length) * 100}%;background:var(--primary);transition:width .3s"></div>
      </div>
      <button class="btn btn-primary btn-block mt-3" id="sideSubmit">Kumpulkan Ujian</button>
    `;
    const grid = side.querySelector("#qGrid");
    ex.questions.forEach((q, i) => {
      const a = ex.answers[q.id];
      const answered = a != null && a !== "" && (!Array.isArray(a) || a.length > 0);
      const flagged = ex.flagged.has(q.id);
      const box = el("button", {
        class: `q-box ${i === ex.current ? "current" : ""} ${answered && i !== ex.current ? "answered" : ""} ${flagged ? "flagged" : ""}`,
        text: String(i + 1)
      });
      box.onclick = () => { ex.current = i; drawQuestion(); drawSide(); };
      grid.appendChild(box);
    });
    side.querySelector("#sideSubmit").onclick = openSubmitDialog;
  }

  async function saveAnswer(qId) {
    const ex2 = STATE.exam;
    const status = wrap.querySelector("#saveStatus");
    if (!status) return;
    status.innerHTML = `<span class="spinner dark" style="width:12px;height:12px"></span><span>Menyimpan...</span>`;
    try {
      await set(ref(db, `examAnswers/${ex2.examId}/${STATE.user.uid}/${ex2.attemptId}/${qId}`), ex2.answers[qId] ?? null);
      status.innerHTML = `${svg("i-check-circle","icon-sm")}<span style="color:var(--success)">Tersimpan</span>`;
      setTimeout(() => {
        if (status && status.parentElement) status.innerHTML = `${svg("i-save","icon-sm")}<span>Autosave aktif</span>`;
      }, 2000);
    } catch (err) {
      status.innerHTML = `${svg("i-alert","icon-sm")}<span style="color:var(--danger)">Gagal menyimpan</span>`;
      console.error("Save failed:", err);
    }
  }

  function openSubmitDialog() {
    const unanswered = ex.questions.filter(q => {
      const a = ex.answers[q.id];
      if (a == null || a === "") return true;
      if (Array.isArray(a)) return a.length === 0;
      return false;
    }).length;
    const flagged = ex.flagged.size;
    const b = el("div");
    b.innerHTML = `
      <p>Anda akan mengumpulkan jawaban ujian ini.</p>
      <div class="grid-2 mt-2">
        <div class="card card-pad" style="text-align:center">
          <div class="stat-label">Belum Dijawab</div>
          <div class="stat-value" style="color:${unanswered ? "var(--danger)" : "var(--success)"}">${unanswered}</div>
        </div>
        <div class="card card-pad" style="text-align:center">
          <div class="stat-label">Ditandai</div>
          <div class="stat-value" style="color:var(--warning)">${flagged}</div>
        </div>
      </div>
      <p class="text-muted text-sm mt-2">Setelah dikumpulkan, jawaban tidak dapat diubah.</p>
    `;
    const back = el("button", { class: "btn btn-secondary", text: "Periksa Kembali", onclick: () => m.close() });
    const submit = el("button", { class: "btn btn-primary", text: "Kumpulkan Sekarang" });
    submit.onclick = async () => {
      loadingButton(submit, true, "Mengirim...");
      m.close();
      await submitExam(false);
    };
    const m = openModal({ title: "Konfirmasi Pengumpulan", body: b, footer: [back, submit] });
  }

  async function submitExam(auto) {
    const ex2 = STATE.exam;
    // Compute result
    let correct = 0, wrong = 0, empty = 0, obtained = 0, totalWeight = 0;
    ex2.questions.forEach(q => {
      totalWeight += q.weight || 1;
      const a = ex2.answers[q.id];
      if (a == null || a === "" || (Array.isArray(a) && a.length === 0)) { empty++; return; }
      let isCorrect = false;
      if (q.type === "single" || q.type === "truefalse" || q.type === "short" || q.type === "numeric") {
        isCorrect = String(a).trim().toLowerCase() === String(q.correctKey || "").trim().toLowerCase();
      } else if (q.type === "multi") {
        const correctKeys = (q.correctKeys || []).map(String).sort();
        const given = (Array.isArray(a) ? a : []).map(String).sort();
        isCorrect = correctKeys.length === given.length && correctKeys.every((k, i) => k === given[i]);
      }
      if (isCorrect) { correct++; obtained += (q.weight || 1); }
      else wrong++;
    });
    const score = totalWeight ? Math.round((obtained / totalWeight) * 100) : 0;
    try {
      await runTransaction(ref(db, `examAttempts/${ex2.examId}/${STATE.user.uid}/${ex2.attemptId}`), (cur) => {
        if (cur && cur.submitted) return cur;
        return { ...(cur || {}), submitted: true, submittedAt: nowTs(), auto: !!auto };
      });
      await set(ref(db, `examResults/${ex2.examId}/${STATE.user.uid}/${ex2.attemptId}`), {
        uid: STATE.user.uid,
        name: STATE.profile?.name || "",
        examId: ex2.examId,
        examTitle: ex2.exam.title,
        subjectName: ex2.exam.subjectName || "",
        className: ex2.exam.className || "",
        attemptId: ex2.attemptId,
        startedAt: ex2.attempt.startedAt || 0,
        submittedAt: nowTs(),
        score, correct, wrong, empty,
        totalQuestions: ex2.questions.length,
        totalWeight, obtainedWeight: obtained,
        status: "graded",
        auto: !!auto
      });
      logAudit("exam.submit", { examId: ex2.examId, score });
      clearInterval(STATE.examTimer);
      STATE.examTimer = null;
      toast("Ujian dikumpulkan", `Nilai sementara: ${score}`, "success");
      STATE.exam = null;
      navigate("app", { route: "grades" });
    } catch (err) {
      toast("Gagal mengumpulkan", err.message, "error");
    }
  }

  // Timer
  const timerText = timer.querySelector("#timerText");
  const startedAt = ex.attempt.startedAt || nowTs();
  const endsAt = ex.attempt.endsAt || (startedAt + (ex.exam.duration || 60) * 60000);
  const tick = () => {
    const remain = Math.max(0, endsAt - nowTs());
    const m = Math.floor(remain / 60000);
    const s = Math.floor((remain % 60000) / 1000);
    timerText.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    timer.classList.toggle("warn", remain < 5 * 60000 && remain >= 60000);
    timer.classList.toggle("danger", remain < 60000);
    if (remain <= 0) {
      clearInterval(STATE.examTimer);
      submitExam(true);
    }
  };
  tick();
  STATE.examTimer = setInterval(tick, 1000);

  drawQuestion();
  drawSide();
  return wrap;
}

/* =========================================================

   ========================================================= */
async function renderAnnouncements() {
  const host = el("div");
  const canEdit = STATE.role !== "student";
  const newBtn = el("button", { class: "btn btn-primary" });
  newBtn.innerHTML = `${svg("i-plus")} Buat Pengumuman`;

  host.appendChild(pageHead("Pengumuman", "Informasi dan pengumuman sekolah.", canEdit ? [newBtn] : []));

  const card = el("div", { class: "card" });
  const anns = await dbList("announcements").catch(() => []);
  if (!anns.length) {
    card.appendChild(emptyState("i-bell", "Belum ada pengumuman", "Belum ada pengumuman yang dipublikasikan.", canEdit ? newBtn.cloneNode(true) : null));
    card.querySelector(".empty button")?.addEventListener("click", () => openAnnouncementForm());
  } else {
    anns.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).forEach(a => {
      const item = el("div", { style: "padding:16px 20px;border-bottom:1px solid var(--border)" });
      item.innerHTML = `
        <div class="row between" style="gap:12px;align-items:flex-start">

            <div style="font-weight:700;font-size:15px">${esc(a.title || "-")}</div>
            <div class="text-sm text-muted">${esc(a.authorName || "-")} · ${fmtDateTime(a.createdAt)}</div>
            <div class="mt-1" style="white-space:pre-wrap">${esc(a.content || "")}</div>
          </div>

function openAnnouncementForm() {
  const body = el("div");
  body.innerHTML = `
    <div class="form-grid">
      <div class="field full"><label class="label">Judul <span class="req">*</span></label><input class="input" id="anTitle"></div>
      <div class="field"><label class="label">Target Kelas (kosongkan untuk semua)</label><input class="input" id="anClass"></div>
      <div class="field full"><label class="label">Isi <span class="req">*</span></label><textarea class="textarea" id="anContent" style="min-height:160px"></textarea></div>
    </div>`;
  const btn = el("button", { class: "btn btn-primary", text: "Terbitkan" });
  const m = openModal({ title: "Buat Pengumuman", body, footer: btn });
  btn.onclick = async () => {
    const title = body.querySelector("#anTitle").value.trim();
    const content = body.querySelector("#anContent").value.trim();
    if (!title || !content) { toast("Judul dan isi wajib diisi", "", "warning"); return; }
    loadingButton(btn, true);
    try {
      await dbPush("announcements", {
        title, content,
        targetClass: body.querySelector("#anClass").value.trim(),
        authorId: STATE.user.uid,
        authorName: STATE.profile?.name || "",
        publishedAt: nowTs()
      });
      toast("Pengumuman diterbitkan", "", "success");
      m.close(); render();
    } catch (err) { loadingButton(btn, false); toast("Gagal", err.message, "error"); }
  };
}

/* =========================================================
   REPORTS (with chart)
   ========================================================= */
async function renderReports() {
  const host = el("div");
  host.appendChild(pageHead("Laporan", "Analisis dan laporan akademik."));

  const results = await dbList("examResults").catch(() => []);
  const exams = await dbList("exams").catch(() => []);

  const statsGrid = el("div", { class: "stats-grid" });
  const avg = results.length ? Math.round(results.reduce((a, b) => a + (b.score || 0), 0) / results.length) : 0;
  const pass = results.filter(r => (r.score || 0) >= 70).length;
  statsGrid.appendChild(statCard("i-trending", "p", "Rata-rata Nilai", avg, "Skala 0-100"));
  statsGrid.appendChild(statCard("i-check-circle", "g", "Kelulusan (≥70)", results.length ? Math.round((pass / results.length) * 100) + "%" : "0%", `${pass} dari ${results.length}`));
  statsGrid.appendChild(statCard("i-clipboard", "s", "Total Ujian", exams.length, "Ujian dibuat"));
  statsGrid.appendChild(statCard("i-users", "w", "Peserta", results.length, "Submission nilai"));
  host.appendChild(statsGrid);

  const chartCard = el("div", { class: "card" });
  const ch = el("div", { class: "card-header" });
  ch.innerHTML = `<div><div class="card-title">Distribusi Nilai</div><div class="card-sub">Jumlah murid per rentang nilai</div></div>`;
  chartCard.appendChild(ch);
  const cw = el("div", { class: "chart-wrap" });
  cw.innerHTML = `<canvas id="gradeChart"></canvas>`;
  chartCard.appendChild(cw);
  host.appendChild(chartCard);

  // Chart after render
  setTimeout(() => {
    const ctx = document.getElementById("gradeChart");
    if (!ctx || !window.Chart) return;
    const buckets = [0, 0, 0, 0, 0];
    results.forEach(r => {
      const s = r.score || 0;
      if (s < 50) buckets[0]++;
      else if (s < 70) buckets[1]++;
      else if (s < 80) buckets[2]++;
      else if (s < 90) buckets[3]++;
      else buckets[4]++;
    });
    if (STATE.charts.grade) STATE.charts.grade.destroy();
    STATE.charts.grade = new Chart(ctx, {
      type: "bar",
      data: {
        labels: ["<50", "50-69", "70-79", "80-89", "90-100"],
        datasets: [{
          label: "Jumlah Murid",
          data: buckets,
          backgroundColor: ["#DC2626", "#F59E0B", "#0EA5E9", "#16A34A", "#4F46E5"],
          borderRadius: 8
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0 } }
        }
      }
    });
  }, 100);

  return host;
}

/* =========================================================
   INIT
   ========================================================= */
async function loadSchool() {
  try {
    const s = await dbGet("appSettings/school");
    if (s) STATE.school = s;
  } catch (e) { /* ignore */ }
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    STATE.user = user;
    try {
      let profile = await loadUserProfile(user.uid);
      if (!profile) {
        // Create a default profile
        profile = {
          name: user.displayName || user.email?.split("@")[0] || "Pengguna",
          email: user.email,
          role: "student",
          status: "active",
          schoolId: APP_SETTINGS.defaultSchoolId
        };
        await createUserProfile(user.uid, profile);
      }
      // Check pending status
      if (profile.status === "pending") {
        toast("Akun menunggu persetujuan", "Hubungi administrator sekolah.", "warning", 8000);
        await signOut(auth);
        return;
      }
      if (profile.status === "inactive") {
        toast("Akun dinonaktifkan", "Hubungi administrator sekolah.", "error", 8000);
        await signOut(auth);
        return;
      }
      STATE.profile = profile;
      STATE.role = profile.role || "student";
      STATE.schoolId = profile.schoolId || APP_SETTINGS.defaultSchoolId;
      await loadSchool();
      const hash = window.location.hash.replace("#", "");
      const route = hash && MENUS[STATE.role]?.find(m => m.id === hash) ? hash : "dashboard";
      STATE.route = route;
      navigate("app", { route });
    } catch (err) {
      console.error("Profile load error:", err);
      toast("Gagal memuat profil", err.message, "error");
      await signOut(auth);
    }
  } else {
    STATE.user = null;
    STATE.profile = null;
    STATE.role = null;
    STATE.exam = null;
    if (STATE.examTimer) { clearInterval(STATE.examTimer); STATE.examTimer = null; }
    navigate("landing");
  }
});

// Handle initial load for unauthenticated users
setTimeout(() => {
  if (!STATE.user && STATE.view === "landing") render();
}, 300);
