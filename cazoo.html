<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>CAZOO — 3D Racing</title>
<link rel="icon" href="https://i.ibb.co.com/67V2PpkF/file-00000000e8948207be00a221094a9d3c.png" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070d;font-family:'Segoe UI',system-ui,sans-serif;color:#e6f0ff}
  canvas{display:block}

  /* ---------- ROTATE PROMPT ---------- */
  #rotate{
    position:fixed;inset:0;z-index:9999;display:none;
    background:radial-gradient(circle at 50% 50%,#0b1226,#05070d);
    flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px;
  }
  #rotate.show{display:flex}
  #rotate .phone{
    width:70px;height:120px;border:3px solid #22e6ff;border-radius:14px;
    position:relative;animation:tilt 1.8s ease-in-out infinite;
    box-shadow:0 0 30px rgba(34,230,255,0.5);
  }
  #rotate .phone::after{content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:#22e6ff;border-radius:2px}
  @keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
  #rotate h2{font-size:20px;letter-spacing:2px;font-weight:800}
  #rotate p{color:#7c8aa6;font-size:13px;letter-spacing:1px}
  @media (orientation:portrait) and (max-width:900px){ #rotate.show{display:flex!important} }

  /* ---------- MENU ---------- */
  #menu{
    position:fixed;inset:0;z-index:10;
    background:radial-gradient(ellipse at 50% 40%,#0e1a3a 0%,#05070d 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    padding:20px;overflow:hidden;
  }
  #menu .glow{
    position:absolute;width:70vw;height:70vw;max-width:800px;max-height:800px;
    border-radius:50%;background:radial-gradient(circle,rgba(34,230,255,0.18),transparent 60%);
    filter:blur(40px);animation:pulse 4s ease-in-out infinite;pointer-events:none;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}

  #menu .logo{
    display:flex;align-items:center;gap:14px;z-index:1;
  }
  #menu .logo img{width:56px;height:56px;border-radius:14px;box-shadow:0 0 30px rgba(34,230,255,0.5)}
  #menu .logo h1{
    font-size:clamp(38px,9vw,72px);font-weight:900;letter-spacing:6px;
    background:linear-gradient(135deg,#22e6ff,#8a5cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #menu .tag{color:#7c8aa6;letter-spacing:4px;font-size:11px;text-transform:uppercase;z-index:1;margin-top:-10px}

  #menu .buttons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;z-index:1;margin-top:14px}

  .btn-main{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:16px 20px;border-radius:14px;border:none;cursor:pointer;
    font-weight:800;letter-spacing:2px;font-size:14px;text-transform:uppercase;
    transition:transform .1s,box-shadow .2s;
    font-family:inherit;
  }
  .btn-main:active{transform:translateY(2px)}
  .btn-main svg{width:20px;height:20px}

  .btn-start{
    background:linear-gradient(135deg,#22e6ff,#8a5cff);color:#04121c;
    box-shadow:0 10px 40px rgba(34,230,255,0.45),0 0 0 1px rgba(255,255,255,0.15) inset;
    padding:20px;font-size:18px;letter-spacing:4px;
  }
  .btn-start:hover{box-shadow:0 14px 50px rgba(34,230,255,0.7),0 0 0 1px rgba(255,255,255,0.2) inset}
  .btn-sec{
    background:rgba(255,255,255,0.06);border:1px solid rgba(90,180,255,0.25);color:#e6f0ff;
  }
  .btn-sec:hover{background:rgba(255,255,255,0.1);border-color:rgba(90,180,255,0.5)}

  #menu .footer{position:absolute;bottom:16px;font-size:11px;color:#4a5670;letter-spacing:2px;z-index:1}

  /* ---------- GAME HUD ---------- */
  #game{position:fixed;inset:0;z-index:5;display:none}
  #game.on{display:block}
  #gameCanvas{position:absolute;inset:0;width:100%;height:100%}

  .hud{position:absolute;pointer-events:none;z-index:6}
  .hud-box{
    background:rgba(6,10,20,0.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(90,180,255,0.3);border-radius:14px;padding:10px 16px;
    box-shadow:0 6px 24px rgba(0,0,0,0.5);
  }
  #hud-lap{top:16px;left:16px}
  #hud-lap .lbl{font-size:9px;letter-spacing:2px;color:#7c8aa6}
  #hud-lap .val{font-size:20px;font-weight:900;margin-top:2px}

  #hud-time{top:16px;right:16px;text-align:right}
  #hud-time .lbl{font-size:9px;letter-spacing:2px;color:#7c8aa6}
  #hud-time .val{font-size:20px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}

  #hud-speed{
    bottom:16px;left:16px;
  }
  #hud-speed .num{font-size:40px;font-weight:900;color:#22e6ff;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(34,230,255,0.5)}
  #hud-speed .unit{font-size:10px;letter-spacing:3px;color:#7c8aa6;margin-top:4px}

  #hud-nitro{
    position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
    width:min(260px,50vw);height:10px;border-radius:99px;
    background:rgba(0,0,0,0.6);border:1px solid rgba(90,180,255,0.3);overflow:hidden;
    z-index:6;
  }
  #hud-nitro .fill{
    height:100%;width:100%;background:linear-gradient(90deg,#22e6ff,#8a5cff);
    transition:width .1s linear;box-shadow:0 0 20px rgba(34,230,255,0.8);
  }
  #hud-nitro .lbl{
    position:absolute;top:-16px;left:50%;transform:translateX(-50%);
    font-size:9px;letter-spacing:2px;color:#7c8aa6;
  }

  #hud-msg{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:clamp(40px,10vw,90px);font-weight:900;letter-spacing:8px;
    color:#22e6ff;text-shadow:0 0 60px rgba(34,230,255,0.8),0 0 20px rgba(34,230,255,1);
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:7;text-transform:uppercase;
  }
  #hud-msg.show{opacity:1}

  /* Controls — touch */
  .ctrl{
    position:absolute;bottom:16px;z-index:8;
    width:70px;height:70px;border-radius:50%;
    background:rgba(6,10,20,0.75);backdrop-filter:blur(12px);
    border:2px solid rgba(34,230,255,0.5);
    display:flex;align-items:center;justify-content:center;
    color:#22e6ff;cursor:pointer;
    box-shadow:0 4px 24px rgba(0,0,0,0.6),0 0 20px rgba(34,230,255,0.2) inset;
    transition:transform .08s,background .1s;
  }
  .ctrl:active{transform:scale(0.92);background:rgba(34,230,255,0.25)}
  .ctrl svg{width:30px;height:30px}

  #ctrl-left{left:16px}
  #ctrl-right{left:100px}
  #ctrl-gas{right:16px;background:rgba(34,230,255,0.15);border-color:#22e6ff;width:80px;height:80px}
  #ctrl-nitro{right:108px;border-color:#8a5cff;color:#8a5cff}
  #ctrl-exit{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    z-index:8;padding:8px 16px;border-radius:99px;
    background:rgba(6,10,20,0.75);backdrop-filter:blur(12px);
    border:1px solid rgba(90,180,255,0.3);color:#e6f0ff;
    font-size:11px;letter-spacing:2px;cursor:pointer;font-family:inherit;font-weight:700;
    text-transform:uppercase;
  }

  /* Result modal */
  #result{
    position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(5,7,13,0.85);backdrop-filter:blur(20px);padding:20px;
  }
  #result.on{display:flex}
  #result .card{
    background:rgba(14,20,34,0.9);border:1px solid rgba(90,180,255,0.35);border-radius:20px;
    padding:32px 28px;text-align:center;max-width:400px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 60px rgba(34,230,255,0.2);
  }
  #result .ttl{
    font-size:32px;font-weight:900;letter-spacing:4px;
    background:linear-gradient(135deg,#22e6ff,#8a5cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:8px;
  }
  #result .time{font-size:44px;font-weight:900;color:#e6f0ff;font-variant-numeric:tabular-nums;margin:16px 0}
  #result .sub{color:#7c8aa6;font-size:12px;letter-spacing:2px;margin-bottom:24px;text-transform:uppercase}
  #result .btns{display:flex;flex-direction:column;gap:10px}

  /* Landscape warning */
  @media (orientation:portrait) and (max-width:900px){
    #menu, #game { display:none !important; }
    #rotate.show{display:flex !important}
  }
</style>
</head>
<body>

<!-- ========== ROTATE PROMPT (portrait HP) ========== -->
<div id="rotate">
  <div class="phone"></div>
  <h2>MIRINGKAN HP</h2>
  <p>Putar perangkat untuk mode lanskap</p>
</div>

<!-- ========== MAIN MENU ========== -->
<div id="menu">
  <div class="glow"></div>

  <div class="logo">
    <img src="https://i.ibb.co.com/67V2PpkF/file-00000000e8948207be00a221094a9d3c.png" alt="CAZOO"/>
    <h1>CAZOO</h1>
  </div>
  <div class="tag">3D Racing • Race Together • Become Legend</div>

  <div class="buttons">
    <button class="btn-main btn-start" id="btn-start">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      MULAI BALAPAN
    </button>
    <button class="btn-main btn-sec" id="btn-multi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/>
        <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14 20c0-2.5 1.7-4.5 4-4.5"/>
      </svg>
      MULTIPLAYER
    </button>
    <button class="btn-main btn-sec" id="btn-garage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 13 5 7h14l2 6v6h-3v-2H6v2H3v-6z"/>
        <circle cx="7.5" cy="13.5" r="1.5"/><circle cx="16.5" cy="13.5" r="1.5"/>
      </svg>
      GARASI
    </button>
  </div>

  <div class="footer">CAZOO © 2026 — v0.1</div>
</div>

<!-- ========== GAME ========== -->
<div id="game">
  <canvas id="gameCanvas"></canvas>

  <div class="hud hud-box" id="hud-lap">
    <div class="lbl">LAP</div>
    <div class="val" id="lapVal">1 / 3</div>
  </div>

  <div class="hud hud-box" id="hud-time">
    <div class="lbl">TIME</div>
    <div class="val" id="timeVal">00:00.00</div>
  </div>

  <div class="hud hud-box" id="hud-speed">
    <div class="num" id="speedVal">0</div>
    <div class="unit">KM/H</div>
  </div>

  <div id="hud-nitro">
    <div class="lbl">NITRO</div>
    <div class="fill" id="nitroFill"></div>
  </div>

  <div id="hud-msg"></div>

  <button class="ctrl" id="ctrl-left">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <button class="ctrl" id="ctrl-right">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <button class="ctrl" id="ctrl-nitro">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
  </button>
  <button class="ctrl" id="ctrl-gas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <button id="ctrl-exit">KELUAR</button>
</div>

<!-- ========== RESULT MODAL ========== -->
<div id="result">
  <div class="card">
    <div class="ttl" id="resultTitle">FINISH</div>
    <div class="sub">WAKTU TOTAL</div>
    <div class="time" id="resultTime">00:00.00</div>
    <div class="btns">
      <button class="btn-main btn-start" id="btn-again">ULANGI</button>
      <button class="btn-main btn-sec" id="btn-home">KE MENU</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =================================================================
   CAZOO — simplified 3D racing demo
   - Landscape only
   - Big START button
   - Real 3D track, real car, real lap timing
   - Touch controls + keyboard
================================================================= */

const $ = (s) => document.querySelector(s);
const canvas = $('#gameCanvas');
const gameEl = $('#game');
const menuEl = $('#menu');

/* ---------- Rotate prompt ---------- */
function checkOrientation(){
  const isPortrait = window.innerHeight > window.innerWidth;
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 900;
  $('#rotate').classList.toggle('show', isPortrait && isMobile);
}
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);
checkOrientation();

/* ---------- THREE.js setup ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.Fog(0x05070d, 60, 220);

const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 500);

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ---------- Lights ---------- */
scene.add(new THREE.HemisphereLight(0x4466aa, 0x05070d, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(30, 60, 20);
scene.add(sun);
const neonA = new THREE.PointLight(0x22e6ff, 1.6, 100);
neonA.position.set(0, 15, 0);
scene.add(neonA);
const neonB = new THREE.PointLight(0x8a5cff, 1.4, 100);
neonB.position.set(40, 12, -40);
scene.add(neonB);

/* ---------- Ground ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ color: 0x0a0f1a, roughness: 0.95, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ---------- Track (rounded loop) ---------- */
const trackCurve = (() => {
  const W = 70, H = 46;
  const pts = [];
  for (let i = 0; i < 16; i++){
    const a = (i / 16) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * W / 2, 0, Math.sin(a) * H / 2));
  }
  return new THREE.CatmullRomCurve3(pts, true);
})();

const trackPoints = trackCurve.getPoints(400);
const TRACK_WIDTH = 10;

// Build road ribbon
(function buildRoad(){
  const left = [], right = [];
  for (let i = 0; i < trackPoints.length; i++){
    const p = trackPoints[i];
    const n = trackPoints[(i + 1) % trackPoints.length];
    const dir = new THREE.Vector3().subVectors(n, p).normalize();
    const side = new THREE.Vector3(-dir.z, 0, dir.x).multiplyScalar(TRACK_WIDTH / 2);
    left.push(p.clone().add(side).setY(0.02));
    right.push(p.clone().sub(side).setY(0.02));
  }
  const verts = [], idx = [];
  for (let i = 0; i < left.length; i++){
    verts.push(left[i].x, left[i].y, left[i].z, right[i].x, right[i].y, right[i].z);
  }
  for (let i = 0; i < left.length - 1; i++){
    const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
    idx.push(a, b, c, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const road = new THREE.Mesh(
    geo,
    new THREE.MeshStandardMaterial({ color: 0x14181f, roughness: 0.75, metalness: 0.15 })
  );
  scene.add(road);

  // Lane markers
  const lineGeo = new THREE.BoxGeometry(0.15, 0.02, 1.2);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.5 });
  for (let i = 0; i < trackPoints.length; i += 8){
    const p = trackPoints[i];
    const n = trackPoints[(i + 1) % trackPoints.length];
    const m = new THREE.Mesh(lineGeo, lineMat);
    m.position.copy(p).setY(0.03);
    m.lookAt(n.x, 0.03, n.z);
    scene.add(m);
  }

  // Neon rails
  const railGeo = new THREE.BoxGeometry(0.18, 0.5, 1.6);
  const railMatA = new THREE.MeshBasicMaterial({ color: 0x22e6ff });
  const railMatB = new THREE.MeshBasicMaterial({ color: 0x8a5cff });
  for (let i = 0; i < left.length; i += 5){
    const a = new THREE.Mesh(railGeo, railMatA);
    a.position.copy(left[i]).setY(0.25);
    const aN = left[(i + 5) % left.length];
    a.lookAt(aN.x, a.position.y, aN.z);
    scene.add(a);

    const b = new THREE.Mesh(railGeo, railMatB);
    b.position.copy(right[i]).setY(0.25);
    const bN = right[(i + 5) % right.length];
    b.lookAt(bN.x, b.position.y, bN.z);
    scene.add(b);
  }

  // Start line
  const start = new THREE.Mesh(
    new THREE.BoxGeometry(TRACK_WIDTH, 0.02, 1.5),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  start.position.copy(trackPoints[0]).setY(0.04);
  const sN = trackPoints[1];
  start.lookAt(sN.x, 0.04, sN.z);
  scene.add(start);
})();

/* ---------- Distant city ---------- */
(function buildCity(){
  for (let i = 0; i < 40; i++){
    const h = 6 + Math.random() * 25;
    const g = new THREE.BoxGeometry(2 + Math.random() * 3, h, 2 + Math.random() * 3);
    const hue = 0.5 + Math.random() * 0.25;
    const color = new THREE.Color().setHSL(hue, 1, 0.15);
    const m = new THREE.MeshStandardMaterial({
      color,
      emissive: new THREE.Color().setHSL(hue, 1, 0.35),
      emissiveIntensity: 0.4,
      roughness: 0.7
    });
    const box = new THREE.Mesh(g, m);
    const ang = Math.random() * Math.PI * 2;
    const r = 130 + Math.random() * 60;
    box.position.set(Math.cos(ang) * r, h / 2, Math.sin(ang) * r);
    scene.add(box);
  }
})();

/* ---------- Car ---------- */
function makeCar(color = 0x22e6ff){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.9, roughness: 0.2 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.55, 4.2), bodyMat);
  body.position.y = 0.5;
  g.add(body);

  const hood = new THREE.Mesh(
    new THREE.BoxGeometry(1.85, 0.2, 1.6),
    new THREE.MeshStandardMaterial({ color, metalness: 0.9, roughness: 0.15 })
  );
  hood.position.set(0, 0.85, 1.2);
  g.add(hood);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.55, 2.0),
    new THREE.MeshStandardMaterial({ color: 0x061018, metalness: 0.7, roughness: 0.1, transparent: true, opacity: 0.9 })
  );
  cabin.position.set(0, 0.95, -0.1);
  g.add(cabin);

  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.34, 24);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.9 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1, roughness: 0.2 });
  const wheels = [];
  [[-1.08, 0.45, 1.35], [1.08, 0.45, 1.35], [-1.08, 0.45, -1.35], [1.08, 0.45, -1.35]].forEach(([x, y, z]) => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(x, y, z);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.36, 16), rimMat);
    rim.rotation.z = Math.PI / 2;
    w.add(rim);
    g.add(w);
    wheels.push(w);
  });

  // Lights
  const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xff3ea5 });
  const h1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.05), headMat);
  h1.position.set(-0.6, 0.65, 2.12); g.add(h1);
  const h2 = h1.clone(); h2.position.x = 0.6; g.add(h2);
  const t1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.05), tailMat);
  t1.position.set(-0.6, 0.6, -2.12); g.add(t1);
  const t2 = t1.clone(); t2.position.x = 0.6; g.add(t2);

  // Boost glow under car
  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(2.4, 4.6),
    new THREE.MeshBasicMaterial({ color: 0x22e6ff, transparent: true, opacity: 0.25 })
  );
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = 0.02;
  g.add(glow);

  return { group: g, wheels, glow };
}

const car = makeCar();
scene.add(car.group);

/* ---------- Checkpoints ---------- */
const checkpoints = [];
for (let i = 0; i < 8; i++){
  const p = trackPoints[Math.floor(trackPoints.length * i / 8)];
  checkpoints.push(p.clone());
}
const CP_RADIUS = 9;

/* ---------- Game state ---------- */
const state = {
  active: false,
  countdown: 0,
  speed: 0,
  nitro: 1,
  boost: 0,
  lap: 1,
  totalLaps: 3,
  nextCP: 0,
  startTime: 0,
  elapsed: 0,
  finished: false,
  steering: 0,
  throttle: 0,
  keys: {}
};

/* ---------- Reset / Start ---------- */
function resetCar(){
  const p0 = checkpoints[0].clone();
  car.group.position.copy(p0);
  car.group.position.y = 0;
  const p1 = checkpoints[1];
  car.group.lookAt(p1.x, car.group.position.y, p1.z);
  state.speed = 0;
  state.nitro = 1;
  state.boost = 0;
  state.lap = 1;
  state.nextCP = 0;
  state.elapsed = 0;
  state.finished = false;
  state.steering = 0;
  state.throttle = 0;
  updateHUD();
}

function startRace(){
  resetCar();
  gameEl.classList.add('on');
  menuEl.style.display = 'none';
  $('#result').classList.remove('on');

  state.active = false;
  state.countdown = 3;

  let c = 3;
  showMsg(String(c));
  const iv = setInterval(() => {
    c--;
    if (c > 0){
      showMsg(String(c));
    } else if (c === 0){
      showMsg('GO!', 700);
      state.active = true;
      state.startTime = performance.now();
      clearInterval(iv);
    }
  }, 800);
}

function exitRace(){
  state.active = false;
  gameEl.classList.remove('on');
  menuEl.style.display = 'flex';
  $('#result').classList.remove('on');
}

function showResult(){
  state.finished = true;
  state.active = false;
  const t = state.elapsed;
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  const ms = Math.floor((t * 100) % 100);
  const str = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
  $('#resultTime').textContent = str;
  $('#resultTitle').textContent = 'FINISH';
  $('#result').classList.add('on');
}

/* ---------- HUD ---------- */
function showMsg(text, dur = 800){
  const el = $('#hud-msg');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), dur);
}

function fmtTime(t){
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  const ms = Math.floor((t * 100) % 100);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
}

function updateHUD(){
  $('#speedVal').textContent = Math.round(state.speed * 3.6);
  $('#lapVal').textContent = Math.min(state.lap, state.totalLaps) + ' / ' + state.totalLaps;
  $('#timeVal').textContent = fmtTime(state.elapsed);
  $('#nitroFill').style.width = (state.nitro * 100) + '%';
}

/* ---------- Main loop ---------- */
let lastT = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (gameEl.classList.contains('on')){
    updateCar(dt);
    updateCamera(dt);
    updateHUD();
  }

  renderer.render(scene, camera);
}

function updateCar(dt){
  if (!state.active || state.finished) {
    state.speed *= 0.92;
    // still move a tiny bit so it doesn't look frozen
    const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(car.group.quaternion);
    car.group.position.addScaledVector(fwd, state.speed * dt);
    return;
  }

  state.elapsed = (performance.now() - state.startTime) / 1000;

  // --- Input ---
  let steerInput = 0;
  if (state.keys['a'] || state.keys['arrowleft'] || state.keys['left']) steerInput += 1;
  if (state.keys['d'] || state.keys['arrowright'] || state.keys['right']) steerInput -= 1;

  let throttleInput = 0;
  if (state.keys['w'] || state.keys['arrowup'] || state.keys['up'] || state.keys['gas']) throttleInput += 1;
  if (state.keys['s'] || state.keys['arrowdown'] || state.keys['down']) throttleInput -= 1;

  const wantNitro = state.keys['shift'] || state.keys['nitro'];

  // --- Physics (arcade) ---
  const MAX_SPEED = 60;
  const BASE_ACCEL = 28;
  const BRAKE = 45;

  if (throttleInput > 0){
    state.speed += BASE_ACCEL * dt;
  } else if (throttleInput < 0){
    state.speed -= BRAKE * dt;
  } else {
    state.speed -= state.speed * 0.9 * dt;
  }

  // Nitro
  if (wantNitro && state.nitro > 0.05 && state.speed > 5){
    state.boost = Math.min(1, state.boost + dt * 2.5);
    state.nitro = Math.max(0, state.nitro - dt * 0.35);
  } else {
    state.boost = Math.max(0, state.boost - dt * 1.2);
    state.nitro = Math.min(1, state.nitro + dt * 0.08);
  }

  const maxNow = MAX_SPEED + state.boost * 30;
  state.speed = Math.max(-10, Math.min(maxNow, state.speed));

  // Steering (less at high speed)
  const steerPower = 1.8 * (1 - Math.min(0.5, state.speed / MAX_SPEED * 0.5));
  const sign = state.speed >= 0 ? 1 : -1;
  car.group.rotation.y += steerInput * steerPower * sign * dt * (0.3 + Math.min(1, Math.abs(state.speed) / 20));

  // Move
  const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(car.group.quaternion);
  car.group.position.addScaledVector(fwd, state.speed * dt);
  car.group.position.y = 0;

  // Wheel spin
  car.wheels.forEach(w => w.rotation.x += state.speed * dt * 2);

  // Glow pulse when boosting
  car.glow.material.opacity = 0.15 + state.boost * 0.5;
  car.glow.material.color.setHex(state.boost > 0.1 ? 0x8a5cff : 0x22e6ff);

  // --- Checkpoint / lap ---
  const cp = checkpoints[state.nextCP];
  const dx = car.group.position.x - cp.x;
  const dz = car.group.position.z - cp.z;
  if (dx*dx + dz*dz < CP_RADIUS * CP_RADIUS){
    state.nextCP = (state.nextCP + 1) % checkpoints.length;
    if (state.nextCP === 0){
      state.lap++;
      if (state.lap > state.totalLaps){
        showResult();
      } else {
        showMsg('LAP ' + state.lap, 900);
      }
    }
  }

  // Keep car near track (soft wall)
  const nearest = nearestTrackPoint(car.group.position);
  const dist = distanceToSegment(car.group.position, nearest.a, nearest.b);
  if (dist > TRACK_WIDTH * 0.9){
    // push back
    const dir = new THREE.Vector3().subVectors(car.group.position, nearest.center).normalize();
    const push = (dist - TRACK_WIDTH * 0.9);
    car.group.position.x -= dir.x * push;
    car.group.position.z -= dir.z * push;
    state.speed *= 0.96;
  }
}

function nearestTrackPoint(pos){
  let bestI = 0, bestD = Infinity;
  for (let i = 0; i < trackPoints.length; i++){
    const p = trackPoints[i];
    const d = (p.x - pos.x) ** 2 + (p.z - pos.z) ** 2;
    if (d < bestD){ bestD = d; bestI = i; }
  }
  const a = trackPoints[bestI];
  const b = trackPoints[(bestI + 1) % trackPoints.length];
  const center = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  return { a, b, center, index: bestI };
}

function distanceToSegment(p, a, b){
  const abx = b.x - a.x, abz = b.z - a.z;
  const apx = p.x - a.x, apz = p.z - a.z;
  const abLenSq = abx*abx + abz*abz;
  const t = abLenSq > 0 ? Math.max(0, Math.min(1, (apx*abx + apz*abz) / abLenSq)) : 0;
  const cx = a.x + abx * t, cz = a.z + abz * t;
  const dx = p.x - cx, dz = p.z - cz;
  return Math.sqrt(dx*dx + dz*dz);
}

function updateCamera(dt){
  const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(car.group.quaternion);
  const camTarget = car.group.position.clone().add(new THREE.Vector3(0, 1.4, 0));
  const desired = car.group.position.clone()
    .add(fwd.clone().multiplyScalar(-8 - state.speed * 0.05))
    .add(new THREE.Vector3(0, 4, 0));

  const lerp = 1 - Math.pow(0.001, dt);
  camera.position.lerp(desired, lerp);
  camera.lookAt(camTarget);
}

/* ---------- Input: keyboard ---------- */
window.addEventListener('keydown', e => {
  state.keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  state.keys[e.key.toLowerCase()] = false;
});

/* ---------- Input: touch buttons ---------- */
function bindHold(el, key){
  const down = (e) => { e.preventDefault(); state.keys[key] = true; };
  const up = (e) => { e.preventDefault(); state.keys[key] = false; };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
}
bindHold($('#ctrl-left'), 'left');
bindHold($('#ctrl-right'), 'right');
bindHold($('#ctrl-gas'), 'gas');
bindHold($('#ctrl-nitro'), 'nitro');

/* ---------- Buttons ---------- */
$('#btn-start').addEventListener('click', startRace);
$('#ctrl-exit').addEventListener('click', exitRace);
$('#btn-again').addEventListener('click', startRace);
$('#btn-home').addEventListener('click', exitRace);

$('#btn-multi').addEventListener('click', () => {
  alert('Multiplayer akan segera hadir. Butuh server backend.');
});
$('#btn-garage').addEventListener('click', () => {
  alert('Garasi akan segera hadir.');
});

/* ---------- Loop kick off ---------- */
resetCar();
camera.position.set(0, 6, 15);
requestAnimationFrame(loop);

/* ---------- Menu background: slowly rotate car in preview ---------- */
setInterval(() => {
  if (!gameEl.classList.contains('on')){
    car.group.rotation.y += 0.008;
  }
}, 30);

// Idle spin for menu
(function menuSpin(){
  if (!gameEl.classList.contains('on')){
    // put car at origin for menu preview
    if (!state.active){
      car.group.position.set(0, 0, 0);
      car.group.rotation.y += 0.01;
      camera.position.set(0, 3.5, 9);
      camera.lookAt(0, 0.7, 0);
    }
  } else if (state.active || state.finished){
    // game mode camera handled in updateCamera
  }
  requestAnimationFrame(menuSpin);
})();

console.log('%cCAZOO ready', 'color:#22e6ff;font-weight:900;font-size:16px');
</script>
