<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel — Cazoo</title>
<link rel="icon" href="https://i.ibb.co.com/Jw4Fvfkn/1790573470498.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080f;--bg-2:#0a0e1a;--surface:#111828;--surface-2:#182135;--surface-3:#212c46;
  --border:rgba(255,255,255,.06);--border-2:rgba(255,255,255,.12);
  --text:#f0f4fc;--text-dim:#8b96b3;--text-dim2:#5a6884;
  --accent:#6d7bff;--accent-2:#a46cff;--accent-soft:rgba(109,123,255,.14);
  --success:#10d98d;--success-soft:rgba(16,217,141,.14);
  --danger:#ff5d6c;--danger-soft:rgba(255,93,108,.14);
  --warn:#ffb020;--warn-soft:rgba(255,176,32,.14);
  --gold:#ffca3c;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(1400px 800px at 8% -8%,rgba(109,123,255,.16),transparent 55%),
    radial-gradient(1200px 700px at 105% 4%,rgba(164,108,255,.14),transparent 55%),
    radial-gradient(900px 500px at 50% 120%,rgba(34,211,238,.08),transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);font-family:'Inter',-apple-system,sans-serif;
  font-size:14px;line-height:1.5;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;padding:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;border:2px solid var(--bg)}
svg.ic{width:20px;height:20px;flex:none;display:block}
.hidden{display:none!important}

/* ============ SPLASH/LOGIN ============ */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.login-box{width:100%;max-width:400px;background:linear-gradient(180deg,var(--surface),var(--surface-2));border-radius:24px;padding:32px 24px;box-shadow:var(--shadow-lg);border:1px solid var(--border-2);text-align:center}
.login-logo{width:88px;height:88px;border-radius:26px;overflow:hidden;margin:0 auto 20px;background:linear-gradient(135deg,#4c5cf0,#8b46e8);box-shadow:0 20px 50px rgba(76,92,240,.35)}
.login-logo img{width:100%;height:100%;object-fit:cover;display:block}
.login-title{font-size:26px;font-weight:900;letter-spacing:-.035em;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text-dim);margin-bottom:24px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--text);transition:.15s;min-height:48px;border:1px solid var(--border-2);width:100%}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#4c5cf0,#8b46e8);color:#fff;border-color:transparent;box-shadow:0 8px 24px rgba(76,92,240,.35)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:rgba(255,93,108,.3)}
.btn.ghost{background:transparent;color:var(--text-dim)}
.btn.google{background:#fff;color:#1a1a2e;border:none;font-weight:700}
.btn.google svg{width:20px;height:20px}
.login-info{font-size:11.5px;color:var(--text-dim2);margin-top:16px;line-height:1.6;padding:12px;background:var(--surface-3);border-radius:12px}

/* ============ LAYOUT ============ */
#app{display:none;min-height:100vh;flex-direction:column}
#app.on{display:flex}
.topbar{position:sticky;top:0;z-index:50;padding:14px 20px;display:flex;align-items:center;gap:12px;background:rgba(6,8,15,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.topbar-logo{width:38px;height:38px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#4c5cf0,#8b46e8);flex:none}
.topbar-logo img{width:100%;height:100%;object-fit:cover;display:block}
.topbar-title{flex:1;font-size:16px;font-weight:900;letter-spacing:-.02em}
.topbar-title small{display:block;font-size:10.5px;color:var(--text-dim2);font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border-2);font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.user-chip:hover{background:var(--surface-3)}
.user-chip .avatar{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#4c5cf0,#8b46e8);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800;overflow:hidden;flex:none}
.user-chip .avatar img{width:100%;height:100%;object-fit:cover}

.layout{flex:1;display:grid;grid-template-columns:240px 1fr;max-width:1400px;width:100%;margin:0 auto;padding:20px}
.sidebar{display:flex;flex-direction:column;gap:4px;padding-right:20px;border-right:1px solid var(--border)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--text-dim);transition:.15s;text-align:left;width:100%}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn.active{background:linear-gradient(135deg,#4c5cf0,#8b46e8);color:#fff;box-shadow:0 6px 16px rgba(76,92,240,.32)}
.nav-btn svg{width:18px;height:18px}
.main{padding-left:24px;min-width:0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:900;letter-spacing:-.03em}
.page-head p{font-size:12.5px;color:var(--text-dim);margin:4px 0 0}

/* ============ CARDS ============ */
.card{background:linear-gradient(180deg,var(--surface),var(--surface-2));border-radius:18px;padding:20px;border:1px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.2);margin-bottom:16px}
.card-title{font-size:11px;font-weight:900;color:var(--text-dim);letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card-title::before{content:'';width:3px;height:14px;border-radius:99px;background:linear-gradient(180deg,#6d7bff,#a46cff)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-card{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:100px;height:100px;background:radial-gradient(circle,rgba(109,123,255,.15),transparent 70%);pointer-events:none}
.stat-card .l{font-size:10px;font-weight:900;color:var(--text-dim2);letter-spacing:.14em;text-transform:uppercase}
.stat-card .v{font-size:26px;font-weight:900;margin-top:6px;letter-spacing:-.035em;font-variant-numeric:tabular-nums;position:relative}
.stat-card .ic{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff}

/* ============ FORM ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:8px}
.input{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg-2);border:1.5px solid var(--border-2);color:var(--text);transition:.15s;font-size:14px;font-weight:500;min-height:46px}
.input:focus{border-color:#6d7bff;box-shadow:0 0 0 3px rgba(109,123,255,.15);background:var(--surface)}
textarea.input{resize:vertical;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{padding:8px 14px;min-height:38px;font-size:12.5px;border-radius:10px;width:auto}
.btn.lg{min-height:52px;font-size:15px;border-radius:14px}

/* ============ LIST ============ */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border);transition:.15s}
.row:hover{background:var(--surface-2);border-color:var(--border-2)}
.row .avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#4c5cf0,#8b46e8);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none;overflow:hidden}
.row .avatar img{width:100%;height:100%;object-fit:cover}
.row .body{flex:1;min-width:0}
.row .ttl{font-size:13.5px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;font-weight:600}
.row .actions{display:flex;gap:6px;flex-shrink:0}

/* ============ BADGE ============ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.badge.green{background:var(--success-soft);color:var(--success);border:1px solid rgba(16,217,141,.3)}
.badge.red{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(255,93,108,.3)}
.badge.gold{background:rgba(255,202,60,.14);color:var(--gold);border:1px solid rgba(255,202,60,.3)}
.badge.blue{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(109,123,255,.3)}
.badge.warn{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(255,176,32,.3)}

/* ============ MODAL ============ */
.modal-root{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-root.on{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal{position:relative;background:linear-gradient(180deg,var(--surface),var(--surface-2));border-radius:22px;padding:24px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);border:1px solid var(--border-2);animation:mpop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes mpop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
.modal h3{font-size:19px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em}
.modal p{color:var(--text-dim);font-size:13.5px;margin:0 0 16px;line-height:1.55}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .btn{flex:1;min-height:44px}

/* ============ TOAST ============ */
#toastRoot{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:400px}
.toast{background:linear-gradient(180deg,var(--surface-2),var(--surface-3));padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;border:1px solid var(--border-2);animation:tin .3s;pointer-events:auto}
.toast.success{border-color:rgba(16,217,141,.4)}
.toast.error{border-color:rgba(255,93,108,.4)}
@keyframes tin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(40px)}}
.toast.out{animation:tout .25s forwards}

/* ============ EMPTY ============ */
.empty{text-align:center;padding:40px 16px;color:var(--text-dim2)}
.empty svg{width:44px;height:44px;margin:0 auto 12px;opacity:.35}
.empty p{margin:0;font-size:13.5px;font-weight:600}
.spinner{display:inline-block;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(109,123,255,.2);border-top-color:#6d7bff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ RESPONSIVE ============ */
@media (max-width:768px){
  .layout{grid-template-columns:1fr;padding:12px}
  .sidebar{flex-direction:row;overflow-x:auto;padding:0 0 12px 0;border-right:none;border-bottom:1px solid var(--border);gap:6px;scrollbar-width:none}
  .sidebar::-webkit-scrollbar{display:none}
  .nav-btn{flex:none;padding:9px 14px;white-space:nowrap;min-width:auto}
  .nav-btn span{display:none}
  .nav-btn.active span{display:inline}
  .main{padding:16px 0 0}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .topbar-title small{display:none}
  .user-chip .name{display:none}
}
</style>
</head>
<body>

<script type="module">
/* ========================================================
   CAZOO ADMIN PANEL
   ======================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

/* ===== FIREBASE ===== */
const cfg = {
  apiKey: "AIzaSyBEPzUM9EresZ-yvphzDusVs7AUqdLuCNQ",
  authDomain: "mygame-68b24.firebaseapp.com",
  databaseURL: "https://mygame-68b24-default-rtdb.firebaseio.com",
  projectId: "mygame-68b24",
  storageBucket: "mygame-68b24.firebasestorage.app",
  messagingSenderId: "1003182873390",
  appId: "1:1003182873390:web:aabf3248f759cbc9d678bf"
};
let FB = { app: null, auth: null, db: null, ready: false };
let api = null;
const State = { user: null, profile: null, page: 'dashboard' };

async function initFirebase() {
  try {
    const [A, D, AU] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js'),
      import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js')
    ]);
    FB.app = A.initializeApp(cfg);
    FB.db = D.getDatabase(FB.app);
    FB.auth = AU.getAuth(FB.app);
    api = { ref: D.ref, set: D.set, get: D.get, update: D.update, remove: D.remove, onValue: D.onValue, serverTimestamp: D.serverTimestamp, push: D.push };
    FB.ready = true;
    return true;
  } catch (e) {
    console.error('[fb]', e);
    return false;
  }
}

/* ===== TOAST ===== */
function toast(msg, type) {
  const root = $('#toastRoot');
  const t = el('div', 'toast' + (type ? ' ' + type : ''));
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 250); }, 3000);
}

/* ===== MODAL ===== */
const Modal = {
  open(opts) {
    return new Promise(resolve => {
      const root = $('#modalRoot');
      root.innerHTML = '';
      const bg = el('div', 'modal-bg');
      const box = el('div', 'modal');
      if (opts.title) box.appendChild(el('h3', null, opts.title));
      if (opts.message) { const p = el('p'); p.textContent = opts.message; box.appendChild(p); }
      if (opts.body) box.appendChild(opts.body);
      const acts = el('div', 'modal-actions');
      (opts.buttons || [{ label: 'Tutup', value: null, variant: 'ghost' }]).forEach(b => {
        const btn = el('button', 'btn ' + (b.variant || 'ghost'), b.label);
        btn.onclick = () => close(b.value);
        acts.appendChild(btn);
      });
      box.appendChild(acts);
      bg.onclick = () => { if (opts.dismissible !== false) close(null); };
      root.appendChild(bg); root.appendChild(box);
      root.classList.add('on');
      function close(v) { root.classList.remove('on'); setTimeout(() => { root.innerHTML = ''; }, 0); resolve(v); }
    });
  },
  confirm(title, msg, okLabel, danger) {
    return this.open({
      title, message: msg,
      buttons: [
        { label: 'Batal', value: false, variant: 'ghost' },
        { label: okLabel || 'Ya', value: true, variant: danger ? 'danger' : 'primary' }
      ]
    });
  }
};

/* ===== AUTH FLOW ===== */
async function checkAdmin(uid, email) {
  email = (email || '').toLowerCase();
  try {
    const s = await api.get(api.ref(FB.db, 'adminConfig/adminUids'));
    if (!s.exists()) return false;
    const v = s.val();
    const list = Array.isArray(v) ? v : Object.values(v || {});
    return list.indexOf(uid) >= 0 || list.indexOf(email) >= 0;
  } catch (e) { return false; }
}

async function doLogin() {
  try {
    const provider = new (await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js')).GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const { signInWithPopup } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
    await signInWithPopup(FB.auth, provider);
  } catch (e) {
    console.error(e);
    if (!String(e.code || '').includes('cancel')) toast('Gagal login: ' + (e.code || e.message), 'error');
  }
}

/* ===== APP ENTRY ===== */
function enterApp() {
  $('#login').style.display = 'none';
  $('#app').classList.add('on');
  // user chip
  const av = $('#userAv'), nm = $('#userName');
  const p = State.profile || {};
  if (p.avatar) av.innerHTML = '<img src="' + esc(p.avatar) + '">';
  else av.textContent = (p.username || 'A').charAt(0).toUpperCase();
  nm.textContent = p.username || 'Admin';
  // sidebar
  $$('#sidebar .nav-btn').forEach(b => {
    if (!b.dataset.p) return;
    b.onclick = () => { setPage(b.dataset.p); };
  });
  $('#btnLogout').onclick = async () => {
    const ok = await Modal.confirm('Keluar?', 'Anda akan sign out dari panel admin.', 'Keluar', true);
    if (!ok) return;
    try { const { signOut } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js'); await signOut(FB.auth); } catch (e) {}
    location.reload();
  };
  $('#userChip').onclick = () => toast('UID: ' + State.user.uid, 'success');
  setPage('dashboard');
}

function setPage(p) {
  State.page = p;
  $$('#sidebar .nav-btn').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  const m = $('#main');
  m.innerHTML = '<div class="empty"><span class="spinner"></span></div>';
  if (p === 'dashboard') renderDashboard(m);
  else if (p === 'users') renderUsers(m);
  else if (p === 'bans') renderBans(m);
  else if (p === 'content') renderContent(m);
  else if (p === 'messages') renderMessages(m);
  else if (p === 'tournaments') renderTournaments(m);
  else if (p === 'shop') renderShop(m);
  else if (p === 'admins') renderAdmins(m);
  else if (p === 'logs') renderLogs(m);
}

/* ===== PAGE: USERS ===== */
async function renderUsers(m) {
  m.innerHTML =
    '<div class="page-head"><div><h1>Pengguna</h1><p>Kelola semua pengguna aplikasi</p></div>' +
    '<div style="display:flex;gap:8px"><input class="input" id="search" placeholder="Cari username / UID..." style="min-width:220px"><button class="btn primary sm" id="btnSearch">Cari</button></div></div>' +
    '<div id="userList"><div class="empty"><span class="spinner"></span></div></div>';

  let allUsers = [];
  async function load() {
    const s = await api.get(api.ref(FB.db, 'users'));
    const v = s.val() || {};
    allUsers = Object.keys(v).map(k => Object.assign({ uid: k }, v[k]));
    allUsers.sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
    draw();
  }
  function draw() {
    const q = ($('#search').value || '').toLowerCase();
    let list = allUsers.filter(u =>
      !q || (u.username || '').toLowerCase().includes(q) ||
      u.uid.toLowerCase().includes(q) ||
      (u.displayId || '').includes(q)
    ).slice(0, 100);

    const box = $('#userList');
    if (!list.length) {
      box.innerHTML = '<div class="empty"><p>Tidak ada pengguna</p></div>';
      return;
    }
    box.innerHTML = '<div class="list">';
    list.forEach(u => {
      const row = el('div', 'row');
      row.innerHTML =
        '<div class="avatar">' + (u.avatar ? '<img src="' + esc(u.avatar) + '">' : esc((u.username || '?').charAt(0).toUpperCase())) + '</div>' +
        '<div class="body">' +
        '<div class="ttl">' + esc(u.username || 'Tanpa nama') + '</div>' +
        '<div class="sub">💎 ' + (Number(u.permata) || 0) + ' · ⭐ ' + (u.stars || 0) + ' · 🎟️ ' + (u.nicknameTokens || 0) + ' · Elo ' + (u.rating || 1200) + '</div>' +
        '</div>' +
        '<div class="actions"><button class="btn sm primary">Kelola</button></div>';
      row.querySelector('button').onclick = () => editUser(u.uid, draw);
      box.appendChild(row);
    });
    box.innerHTML += '</div>';
  }
  $('#btnSearch').onclick = draw;
  $('#search').oninput = draw;
  load();
}

async function editUser(uid, reload) {
  const s = await api.get(api.ref(FB.db, 'users/' + uid));
  const u = s.val() || {};
  let banSnap = null;
  try { banSnap = await api.get(api.ref(FB.db, 'bans/' + uid)); } catch (e) {}
  const banned = banSnap && banSnap.exists();

  const box = el('div');
  box.innerHTML =

    '<div class="avatar" style="width:56px;height:56px;border-radius:16px;font-size:22px">' + (u.avatar ? '<img src="' + esc(u.avatar) + '">' : esc((u.username || '?').charAt(0).toUpperCase())) + '</div>' +

    '<div style="font-size:10.5px;color:var(--text-dim2);font-family:monospace;margin-top:4px;word-break:break-all">' + uid + '</div>' +
    '</div></div>' +
    '<div class="grid-2">' +
    '<div class="field"><label>Permata 💎</label><input class="input" id="e-p" type="number" value="' + (Number(u.permata) || 0) + '"></div>' +
    '<div class="field"><label>Token Ganti Nama 🎟️</label><input class="input" id="e-t" type="number" value="' + (Number(u.nicknameTokens) || 0) + '"></div>' +
    '<div class="field"><label>Bintang ⭐</label><input class="input" id="e-s" type="number" value="' + (Number(u.stars) || 0) + '"></div>' +
    '<div class="field"><label>Rating Elo</label><input class="input" id="e-r" type="number" value="' + (Number(u.rating) || 1200) + '"></div>' +
    '<div class="field"><label>XP</label><input class="input" id="e-x" type="number" value="' + (Number(u.xp) || 0) + '"></div>' +
    '<div class="field"><label>Wins</label><input class="input" id="e-w" type="number" value="' + (Number(u.wins) || 0) + '"></div>' +
    '</div>' +
    '<div class="field"><label>Status</label><select class="input" id="e-b"><option value="0"' + (banned ? '' : ' selected') + '>Aktif</option><option value="1"' + (banned ? ' selected' : '') + '>Banned 🚫</option></select></div>' +
    '<div class="field"><label>Alasan Ban</label><input class="input" id="e-br" value="' + esc((banSnap && banSnap.val() && banSnap.val().reason) || '') + '" placeholder="Melanggar aturan..."></div>' +
    '<div class="btn-row" style="margin-top:8px">' +
    '<button class="btn sm danger" id="e-give">+100 💎</button>' +
    '<button class="btn sm ghost" id="e-reset">Reset Stats</button>' +
    '</div>';

  Modal.open({
    title: 'Kelola Pengguna', body: box, buttons: [
      { label: 'Batal', value: null, variant: 'ghost' },
      { label: 'Simpan', value: 'save', variant: 'primary' }
    ]
  }).then(async r => {
    if (r !== 'save') return;
    try {
      const newStars = parseInt(box.querySelector('#e-s').value, 10) || 0;
      const newRating = parseInt(box.querySelector('#e-r').value, 10) || 1200;
      await api.update(api.ref(FB.db, 'users/' + uid), {
        permata: parseInt(box.querySelector('#e-p').value, 10) || 0,
        nicknameTokens: parseInt(box.querySelector('#e-t').value, 10) || 0,
        stars: newStars,
        rating: newRating,
        xp: parseInt(box.querySelector('#e-x').value, 10) || 0,
        wins: parseInt(box.querySelector('#e-w').value, 10) || 0
      });
      const ban = box.querySelector('#e-b').value === '1';
      const reason = box.querySelector('#e-br').value.trim();
      if (ban) {
        await api.set(api.ref(FB.db, 'bans/' + uid), { reason: reason || 'Melanggar aturan', by: State.user.uid, at: Date.now() });
        await adminLog('BAN_USER', u.username + ' · ' + reason);
      } else {
        await api.remove(api.ref(FB.db, 'bans/' + uid)).catch(() => {});
        await adminLog('UNBAN_USER', u.username);
      }
      await api.update(api.ref(FB.db, 'leaderboard/' + uid), { stars: newStars, rating: newRating }).catch(() => {});
      await adminLog('EDIT_USER', u.username);
      toast('Disimpan!', 'success');
      if (reload) reload();
    } catch (e) { toast('Gagal: ' + e.message, 'error'); }
  });

  setTimeout(() => {
    box.querySelector('#e-give').onclick = () => {
      const inp = box.querySelector('#e-p');
      inp.value = (parseInt(inp.value, 10) || 0) + 100;
    };
    box.querySelector('#e-reset').onclick = async () => {
      const ok = await Modal.confirm('Reset stats?', 'Wins, losses, draws, XP akan direset ke 0.', 'Reset', true);
      if (!ok) return;
      box.querySelector('#e-w').value = 0;
      box.querySelector('#e-x').value = 0;
      toast('Stats akan direset saat simpan', 'warn');
    };
  }, 50);
}

/* ===== PAGE: MESSAGES ===== */
function renderMessages(m) {
  m.innerHTML =
    '<div class="page-head"><div><h1>Pesan</h1><p>Kirim pesan ke pengguna atau broadcast</p></div></div>' +
    '<div class="card"><div class="card-title">Kirim ke 1 Pengguna</div>' +
    '<div class="field"><label>UID Penerima</label><input class="input" id="m-uid" placeholder="UID pengguna..."></div>' +
    '<div class="field"><label>Judul</label><input class="input" id="m-title" placeholder="Judul pesan"></div>' +
    '<div class="field"><label>Isi Pesan</label><textarea class="input" id="m-body" rows="4" placeholder="Tulis pesan..."></textarea></div>' +
    '<button class="btn primary sm" id="m-send">📩 Kirim Pesan</button>' +
    '</div>' +
    '<div class="card"><div class="card-title">Broadcast ke Semua</div>' +
    '<div class="field"><label>Judul Broadcast</label><input class="input" id="b-title" placeholder="Pengumuman"></div>' +
    '<div class="field"><label>Isi Broadcast</label><textarea class="input" id="b-body" rows="4" placeholder="Isi pengumuman..."></textarea></div>' +
    '<button class="btn danger sm" id="b-send">📢 Broadcast Sekarang</button>' +
    '</div>' +
    '<div class="card"><div class="card-title">Riwayat Broadcast</div><div id="bcList"><div class="empty"><span class="spinner"></span></div></div></div>';

  $('#m-send').onclick = async () => {
    const uid = $('#m-uid').value.trim();
    const title = $('#m-title').value.trim();
    const body = $('#m-body').value.trim();
    if (!uid || !title) { toast('UID & judul wajib', 'error'); return; }
    try {
      const id = 'msg_' + Date.now();
      await api.set(api.ref(FB.db, 'adminMessages/' + uid + '/' + id), { title, body, sentAt: Date.now(), from: State.user.uid, fromName: State.profile ? State.profile.username : 'Admin' });
      await adminLog('SEND_MSG', 'To ' + uid.slice(0, 12));
      toast('Pesan terkirim!', 'success');
      $('#m-uid').value = ''; $('#m-title').value = ''; $('#m-body').value = '';
    } catch (e) { toast('Gagal: ' + e.message, 'error'); }
  };

  $('#b-send').onclick = async () => {
    const title = $('#b-title').value.trim();
    const body = $('#b-body').value.trim();
    if (!title) { toast('Judul wajib', 'error'); return; }
    const ok = await Modal.confirm('Broadcast?', 'Pesan akan dikirim ke SEMUA pengguna aktif.', 'Kirim', true);
    if (!ok) return;
    try {
      const id = 'bc_' + Date.now();
      await api.set(api.ref(FB.db, 'adminBroadcast/' + id), { title, body, audience: 'all', sentAt: Date.now(), from: State.user.uid, fromName: State.profile ? State.profile.username : 'Admin' });
      await adminLog('BROADCAST', title);
      toast('Broadcast terkirim!', 'success');
      $('#b-title').value = ''; $('#b-body').value = '';
      loadBroadcasts();
    } catch (e) { toast('Gagal: ' + e.message, 'error'); }
  };

  async function loadBroadcasts() {
    try {
      const s = await api.get(api.ref(FB.db, 'adminBroadcast'));
      const v = s.val() || {};
      const list = Object.keys(v).map(k => Object.assign({ id: k }, v[k])).sort((a, b) => (b.sentAt || 0) - (a.sentAt || 0)).slice(0, 20);
      const box = $('#bcList');
      if (!list.length) { box.innerHTML = '<div class="empty"><p>Belum ada broadcast</p></div>'; return; }
      box.innerHTML = '<div class="list"></div>';
      const listEl = box.querySelector('.list');
      list.forEach(b => {
        const row = el('div', 'row');
        row.innerHTML = '<div class="body"><div class="ttl">' + esc(b.title) + '</div><div class="sub">' + new Date(b.sentAt || 0).toLocaleString('id-ID') + '</div></div>' +
          '<div class="actions"><button class="btn sm danger">Hapus</button></div>';
        row.querySelector('button').onclick = async () => {
          const ok = await Modal.confirm('Hapus broadcast?', '', 'Hapus', true);
          if (!ok) return;
          await api.remove(api.ref(FB.db, 'adminBroadcast/' + b.id));
          toast('Dihapus', 'success');
          loadBroadcasts();
        };
        listEl.appendChild(row);
      });
    } catch (e) { $('#bcList').innerHTML = '<div class="empty"><p>Gagal memuat</p></div>'; }
  }
  loadBroadcasts();
}

/* ===== PAGE: LOGS ===== */
async function renderLogs(m) {
  m.innerHTML = '<div class="page-head"><div><h1>Log Aktivitas</h1><p>Riwayat semua aksi admin</p></div><button class="btn danger sm" id="clearLogs">🗑️ Hapus Semua</button></div><div id="logList"><div class="empty"><span class="spinner"></span></div></div>';
  async function load() {
    try {
      const s = await api.get(api.ref(FB.db, 'adminLogs'));
      const v = s.val() || {};
      const list = Object.keys(v).map(k => Object.assign({ id: k }, v[k])).sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 100);
      const box = $('#logList');
      if (!list.length) { box.innerHTML = '<div class="empty"><p>Belum ada log</p></div>'; return; }
      box.innerHTML = '<div class="list"></div>';
      const listEl = box.querySelector('.list');
      list.forEach(l => {
        const row = el('div', 'row');
        const badge = l.action.includes('BAN') ? 'red' : l.action.includes('DELETE') ? 'warn' : 'blue';
        row.innerHTML =
          '<div class="body"><div class="ttl"><span class="badge ' + badge + '">' + esc(l.action || 'ACTION') + '</span> ' + esc(l.detail || '') + '</div>' +
          '<div class="sub">' + esc(l.byName || 'admin') + ' · ' + new Date(l.at || 0).toLocaleString('id-ID') + '</div></div>';
        listEl.appendChild(row);
      });
    } catch (e) { $('#logList').innerHTML = '<div class="empty"><p>Gagal: ' + e.message + '</p></div>'; }
  }
  $('#clearLogs').onclick = async () => {
    const ok = await Modal.confirm('Hapus semua log?', 'Tindakan ini tidak bisa dibatalkan.', 'Hapus', true);
    if (!ok) return;
    await api.remove(api.ref(FB.db, 'adminLogs'));
    toast('Log dihapus', 'success');
    load();
  };
  load();
}

/* ===== BOOT ===== */
(async () => {
  const ok = await initFirebase();
  if (!ok) { toast('Firebase gagal load', 'error'); return; }
  $('#btnLogin').onclick = doLogin;

  const { onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');

  let handled = false;
  onAuthStateChanged(FB.auth, async user => {
    if (handled) return;
    handled = true;
    if (!user) { $('#login').style.display = 'flex'; return; }

    // Load user profile
    try {
      const s = await api.get(api.ref(FB.db, 'users/' + user.uid));
      if (s.exists()) State.profile = Object.assign({ uid: user.uid }, s.val());
    } catch (e) {}
    State.user = user;

    // Check admin
    const isAdmin = await checkAdmin(user.uid, user.email);
    if (!isAdmin) {
      $('#login').style.display = 'flex';
      await Modal.open({
        title: '⛔ Akses Ditolak',
        message: 'UID/email Anda tidak terdaftar sebagai admin.\n\nUID Anda: ' + user.uid + '\n\nTambahkan UID di atas ke adminConfig/adminUids, lalu refresh halaman.',
        dismissible: false,
        buttons: [{ label: 'OK, Keluar', value: 'out', variant: 'danger' }]
      });
      const { signOut } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
      await signOut(FB.auth);
      location.reload();
      return;
    }
    enterApp();
  });
})();
</script>
